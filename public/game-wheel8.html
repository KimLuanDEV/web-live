<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lucky Wheel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{

margin:0;

background:
url("/assets/police/bg-police-casino.jpg")
center / cover no-repeat fixed;

font-family:system-ui;
color:#fff;
overflow:hidden;

}
/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
padding:12px 16px;
font-weight:700;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.1);
}

#timer{
color:#fff;
}

/* WHEEL AREA */

.wheel{
position:relative;
width:380px;
height:380px;
margin:175px auto 0;
}






.wheel-center{

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);

width:120px;
height:120px;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:26px;

color:#ffffff;

background:
url("/assets/police/wheel-center-police.png")
center / contain no-repeat;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff;

z-index:2;

}


#timer{
top:50px;
font-size:20px;
font-weight:900;

color:#ffffff;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff,
0 0 40px #00aaff;

position:absolute;
}





/* SLOT */

.slot{

position:absolute;

width:95px;
height:95px;

left:50%;
top:50%;

margin-left:-47px;
margin-top:-47px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
url("/assets/police/slot-bg-police.png")
center / contain no-repeat;

transition:.2s;

}




.slot-img{

width:72%;
height:72%;

object-fit:contain;

filter:
drop-shadow(0 0 6px #000)
drop-shadow(0 0 10px rgba(0,0,0,.6));

transition:.2s;

}



.slot.win{

filter:
drop-shadow(0 0 20px #00aaff)
drop-shadow(0 0 40px #00aaff);

animation:policeWin 0.6s infinite alternate;

}

@keyframes policeWin{

0%{
filter:drop-shadow(0 0 10px #00aaff);
}

100%{
filter:drop-shadow(0 0 25px #00aaff);
}

}


.multi{
font-size:18px;
font-weight:800;
}

.pool{

display:none;
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);

font-size:13px;
font-weight:700;

color:#ffd700;

text-shadow:
0 0 5px #000,
0 0 10px #000;

}


/* GRID POSITION */

.s1{ transform:rotate(225deg) translate(140px) rotate(-225deg); }

.s2{ transform:rotate(270deg) translate(140px) rotate(-270deg); }

.s3{ transform:rotate(315deg) translate(140px) rotate(-315deg); }

.s4{ transform:rotate(0deg) translate(140px) rotate(0deg); }

.s5{ transform:rotate(45deg) translate(140px) rotate(-45deg); }

.s6{ transform:rotate(90deg) translate(140px) rotate(-90deg); }

.s7{ transform:rotate(135deg) translate(140px) rotate(-135deg); }

.s8{ transform:rotate(180deg) translate(140px) rotate(-180deg); }

/* BET PANEL */

.bet-panel{

position:absolute;
bottom:-37px;
width:100%;
height:280px;
padding:0;

background:
url("/assets/police/police-panel.png")
center / cover no-repeat;

border-top:2px solid rgba(0,120,255,.6);

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
inset 0 2px 0 rgba(255,255,255,.15);

}


.bet-grid{
position: absolute;
display:flex;
justify-content:center;
gap:0px;
margin-top:2px;
bottom: 25px;
left: 15px;
}

.bet-chip{

width:100px;
height:70px;

border-radius:50%;

background:

url("/assets/police/police-chip.png")
center / contain no-repeat;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:14px;

color:#fff;

text-shadow:0 0 6px #000;

transition:.2s;

}


.bet-chip:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 8px #00aaff);

}


.bet-chip.active{
color:#fff;
}

/* RESULT MODAL */

.result{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.7);
z-index: 2;
}

.result-box{
background:#111;
padding:30px;
border-radius:14px;
text-align:center;
}

.result-title{
font-size:22px;
margin-bottom:10px;
}




.mybet{

display:none;

position:absolute;
bottom:4px;
right:24px;

font-size:13px;
font-weight:800;

color:#ffd700;


padding:2px 6px;

border-radius:6px;

}



.coin-bar{
position:absolute;
bottom:97px;
left:49%;
transform:translateX(-50%);
padding:9px 22px;
z-index: 1;
color: whitesmoke;
}



.bet-hitbox{

position:absolute;
width:100%;
height:100%;
left:0;
top:0;
}

.chip{

position:absolute;

width:95px;
height:95px;

cursor:pointer;

}

/* vị trí theo ảnh */

.c1{
left:84px;
bottom:67px;
width: 58px;
height: 50px;
}

.c2{
left:150px;
bottom:67px;
width: 58px;
height: 50px;
}

.c3{
left:221px;
bottom:67px;
width: 58px;
height: 50px;
}

.c4{
left:287px;
bottom:67px;
width: 58px;
height: 50px;
}

/* hover effect */

.chip:hover{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.12);
}



.police-header{

position:absolute;
top:0;
left:0;

width:100%;
height:140px;

background:
url("/assets/police/police-header.png")
center / cover no-repeat;

z-index:2;

}




.spokes{
position:absolute;
left:189px;
top:40px;
transform:translate(-50%,-50%);
pointer-events:none;
}

.spoke{

position:absolute;

width:2px;
height:150px;

background:linear-gradient(
to top,
rgba(255,255,255,.8),
rgba(255,255,255,.1)
);

transform-origin:bottom center;

box-shadow:0 0 8px rgba(255,255,255,.4);

}


.spoke.s1{ transform:rotate(0deg); }

.spoke.s2{ transform:rotate(45deg); }

.spoke.s3{ transform:rotate(90deg); }

.spoke.s4{ transform:rotate(135deg); }

.spoke.s5{ transform:rotate(180deg); }

.spoke.s6{ transform:rotate(225deg); }

.spoke.s7{ transform:rotate(270deg); }

.spoke.s8{ transform:rotate(315deg); }




</style>
</head>

<body>

<div class="police-header"></div>


<!-- WHEEL -->

<div class="wheel">


<div class="wheel-center">
<span id="timer"></span>
</div>



<div class="spokes">

<div class="spoke s1"></div>
<div class="spoke s2"></div>
<div class="spoke s3"></div>
<div class="spoke s4"></div>
<div class="spoke s5"></div>
<div class="spoke s6"></div>
<div class="spoke s7"></div>
<div class="spoke s8"></div>

</div>



<div class="slot s1" onclick="bet(1)">
<img src="/assets/police/slot1.png" class="slot-img">
<div class="mybet" id="mybet1">0</div>
</div>

<div class="slot s2" onclick="bet(2)">
<img src="/assets/police/slot2.png" class="slot-img">
<div class="mybet" id="mybet2">0</div>
</div>

<div class="slot s3" onclick="bet(3)">
<img src="/assets/police/slot3.png" class="slot-img">
<div class="mybet" id="mybet3">0</div>
</div>

<div class="slot s4" onclick="bet(4)">
<img src="/assets/police/slot4.png" class="slot-img">
<div class="mybet" id="mybet4">0</div>
</div>

<div class="slot s5" onclick="bet(5)">
<img src="/assets/police/slot5.png" class="slot-img">
<div class="mybet" id="mybet5">0</div>
</div>

<div class="slot s6" onclick="bet(6)">
<img src="/assets/police/slot6.png" class="slot-img">
<div class="mybet" id="mybet6">0</div>
</div>

<div class="slot s7" onclick="bet(7)">
<img src="/assets/police/slot7.png" class="slot-img">
<div class="mybet" id="mybet7">0</div>
</div>

<div class="slot s8" onclick="bet(8)">
<img src="/assets/police/slot8.png" class="slot-img">
<div class="mybet" id="mybet8">0</div>
</div>

</div>


<!-- BET PANEL -->


<div class="coin-bar">
💎 <span id="coins"></span>
</div>


<div class="bet-panel">

<div class="bet-hitbox">

<div class="chip c1" onclick="setBet(10)"></div>
<div class="chip c2" onclick="setBet(50)"></div>
<div class="chip c3" onclick="setBet(100)"></div>
<div class="chip c4" onclick="setBet(1000)"></div>

</div>

</div>
<!-- RESULT -->

<div id="resultModal" class="result">

<div class="result-box">

<div class="result-title">
RESULT
</div>

<div id="resultText"></div>

<button onclick="closeResult()">
OK
</button>

</div>

</div>


<script>

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

let currentBet = 0
let highlightIndex = 1
let highlightLoop = null
let highlightSpeed = 1000
let isBetLocked = false


const myBets = [0,0,0,0,0,0,0,0]
const slots = document.querySelectorAll(".slot")



function runHighlight(){

slots.forEach(s=>s.classList.remove("win"))

const slot =
document.querySelector(".slot.s"+highlightIndex)

if(slot){
slot.classList.add("win")
}

highlightIndex++

if(highlightIndex > 8){
highlightIndex = 1
}

}


function changeHighlightSpeed(speed){

highlightSpeed = speed

if(highlightLoop){

clearInterval(highlightLoop)

highlightLoop =
setInterval(runHighlight, highlightSpeed)

}

}



function startHighlightLoop(){

if(highlightLoop) return

highlightLoop = setInterval(runHighlight, highlightSpeed)

}


function stopHighlightLoop(){

clearInterval(highlightLoop)

highlightLoop = null

slots.forEach(s=>s.classList.remove("win"))

}

/* SET BET */

function setBet(v){

currentBet = v


document.querySelectorAll(".bet-chip")
.forEach(c=>c.classList.remove("active"))

event.target.classList.add("active")

}

/* BET */

function bet(slot){

if(!currentBet) return

if(isBetLocked) return

socket.emit("wheel8-bet",{
slot,
bet:currentBet
})

// cộng cược cá nhân
myBets[slot-1] += currentBet

const el = document.getElementById("mybet"+slot)

if(el){

const value = myBets[slot-1]

el.textContent = value

if(value > 0){
el.style.display = "block"
}else{
el.style.display = "none"
}

}

}

/* RESULT */

socket.on("wheel8-result",(data)=>{

stopHighlightLoop()

const slot = data.slot
const m = data.multiplier

slots.forEach(s=>s.classList.remove("win"))

const winSlot =
document.querySelector(".slot.s"+slot)

if(winSlot){

winSlot.classList.add("win")

setTimeout(()=>{
winSlot.classList.remove("win")
},5000)

}

document.getElementById("resultText").textContent =
"Multiplier x"+m

document.getElementById("resultModal").style.display = "flex"

})

/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent = t

// khóa cược khi còn 5 giây
isBetLocked = (t <= 5)

// reset tốc độ mỗi round
if(t >= 5){
highlightSpeed = 1000
}

// sau 5 giây mới bắt đầu highlight
if(t <= 30 && t > 5){
startHighlightLoop()
}

// còn 5 giây thì tăng tốc
if(t <= 5){
changeHighlightSpeed(100)
}

})
/* COIN UPDATE */

socket.on("coin-update",(data)=>{

document.getElementById("coins").textContent=data.coins

})

function closeResult(){

document.getElementById("resultModal").style.display="none"

}


socket.on("wheel8-pool-update",(pool)=>{

for(let i=0;i<8;i++){

const el = document.getElementById("pool"+(i+1))

if(el){
el.textContent = pool[i]
}

}

})


socket.on("wheel8-round-new",()=>{

isBetLocked = false
highlightSpeed = 1000
stopHighlightLoop()

for(let i=1;i<=8;i++){

const pool = document.getElementById("pool"+i)

if(pool){
pool.textContent = 0
pool.style.display = "none"
}

const mybet = document.getElementById("mybet"+i)

if(mybet){
mybet.textContent = 0
mybet.style.display = "none"
}

myBets[i-1] = 0

}

})


socket.on("wheel8-my-bets",(bets)=>{

for(let i=0;i<8;i++){

myBets[i] = bets[i]

const el = document.getElementById("mybet"+(i+1))

if(el){

const value = bets[i]

el.textContent = value

if(value > 0){
el.style.display = "block"
}else{
el.style.display = "none"
}

}

}

})


</script>

</body>
</html>
