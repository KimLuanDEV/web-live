<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Police</title>
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<script src="/socket.io/socket.io.js"></script>

<style>


*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

body{
margin:0;
font-family:system-ui;
color:#fff;
overflow:hidden;
}

body::before{

content:"";
position:fixed;
inset:0;

background:
url("/assets/police/bg-police-casino.jpg")
center / cover no-repeat;

z-index:-1;

}
/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
padding:12px 16px;
font-weight:700;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.1);
}

#timer{
color:#fff;
}

/* WHEEL AREA */

.wheel{

position:relative;

width:90vw;
height:90vw;

max-width:380px;
max-height:380px;

margin:160px auto 0;

}





.wheel-center{

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);

width:120px;
height:120px;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:26px;

color:#ffffff;

background:
url("/assets/police/wheel-center-police.png")
center / contain no-repeat;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff;

z-index:2;

}


#timer{
top:50px;
font-size:20px;
font-weight:900;

color:#ffffff;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff,
0 0 40px #00aaff;

position:absolute;
}





/* SLOT */

.slot{

position:absolute;

width:95px;
height:95px;

left:189px;
top:188px;

margin-left:-47px;
margin-top:-47px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
url("/assets/police/slot-bg-police.png")
center / contain no-repeat;

transition:.2s;

}




.slot-img{

width:72%;
height:72%;

object-fit:contain;

filter:
drop-shadow(0 0 6px #000)
drop-shadow(0 0 10px rgba(0,0,0,.6));

transition:.2s;

}

.slot.win{

box-shadow:
0 0 20px #00aaff,
0 0 40px #00aaff,
inset 0 0 10px #00aaff;

border-radius:50%;

}




.slot.win .slot-img{

filter:
drop-shadow(0 0 15px #00aaff)
drop-shadow(0 0 30px #00aaff)
drop-shadow(0 0 60px #00aaff);

transform:scale(1.15);

animation:policeWin 0.6s infinite alternate;

}

@keyframes policeWin{

0%{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.1);
}

100%{
filter:drop-shadow(0 0 40px #00aaff);
transform:scale(1.2);
}

}

.multi{

position:absolute;
top:1px;
right: 11px;
font-size:15px;
font-weight:900;

color:#ffd700;

text-shadow:
0 0 6px #000,
0 0 10px #000,
0 0 15px #ffcc00;

pointer-events:none;

}

.pool{

display:none;
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);

font-size:13px;
font-weight:700;

color:#ffd700;

text-shadow:
0 0 5px #000,
0 0 10px #000;

}


/* GRID POSITION */

.s1{ transform:rotate(225deg) translate(140px) rotate(-225deg); }

.s2{ transform:rotate(270deg) translate(140px) rotate(-270deg); }

.s3{ transform:rotate(315deg) translate(140px) rotate(-315deg); }

.s4{ transform:rotate(0deg) translate(140px) rotate(0deg); }

.s5{ transform:rotate(45deg) translate(140px) rotate(-45deg); }

.s6{ transform:rotate(90deg) translate(140px) rotate(-90deg); }

.s7{ transform:rotate(135deg) translate(140px) rotate(-135deg); }

.s8{ transform:rotate(180deg) translate(140px) rotate(-180deg); }

/* BET PANEL */

.bet-panel{

position:absolute;
bottom:-20px;
width:100%;
height:280px;
padding:0;

background:
url("/assets/police/police-panel.png")
center / cover no-repeat;

border-top:2px solid rgba(0,120,255,.6);

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
inset 0 2px 0 rgba(255,255,255,.15);
z-index: 1;
}


.bet-grid{
position: absolute;
display:flex;
justify-content:center;
gap:0px;
margin-top:2px;
bottom: 25px;
left: 15px;
}

.bet-chip{

width:100px;
height:70px;

border-radius:50%;

background:

url("/assets/police/police-chip.png")
center / contain no-repeat;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:14px;

color:#fff;

text-shadow:0 0 6px #000;

transition:.2s;

}


.bet-chip:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 8px #00aaff);

}


.bet-chip.active{
color:#fff;
}

/* RESULT MODAL */

.result{
position:fixed;
inset:0;

display:none;

background:rgba(0,0,0,.45);

align-items:flex-end;
justify-content:center;

z-index:10;
}

.result-box{

width:100%;

background:linear-gradient(
180deg,
#0a0a0a,
#111,
#0a0a0a
);

border-top-left-radius:22px;
border-top-right-radius:22px;

padding:28px 20px 35px;

text-align:center;

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
0 -2px 0 rgba(255,255,255,.1) inset;

animation:sheetUp .35s ease;

}

@keyframes sheetUp{

from{
transform:translateY(100%);
}

to{
transform:translateY(0);
}

}

.result-title{
font-size:22px;
margin-bottom:10px;
}




.mybet{

display:none;

position:absolute;
bottom:4px;
right:24px;

font-size:13px;
font-weight:800;

color:#ffd700;


padding:2px 6px;

border-radius:6px;

}



.coin-bar{
position:absolute;
bottom:107px;
left:49%;
transform:translateX(-50%);
padding:9px 22px;
z-index: 2;
color: whitesmoke;
}



.bet-hitbox{

position:absolute;
width:100%;
height:100%;
left:0;
top:0;
}

.chip{

position:absolute;

width:95px;
height:95px;

cursor:pointer;

}

/* vị trí theo ảnh */

.c1{
left:84px;
bottom:61px;
width: 58px;
height: 50px;
}

.c2{
left:150px;
bottom:61px;
width: 58px;
height: 50px;
}

.c3{
left:221px;
bottom:61px;
width: 58px;
height: 50px;
}

.c4{
left:287px;
bottom:61px;
width: 58px;
height: 50px;
}

/* hover effect */

.chip:hover{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.12);
}



.spokes{
position:absolute;
left:189px;
top:40px;
transform:translate(-50%,-50%);
pointer-events:none;
}

.spoke{

position:absolute;

width:2px;
height:150px;

background:linear-gradient(
to top,
rgba(255,255,255,.8),
rgba(255,255,255,.1)
);

transform-origin:bottom center;

box-shadow:0 0 8px rgba(255,255,255,.4);

}


.spoke.s1{ transform:rotate(0deg); }

.spoke.s2{ transform:rotate(45deg); }

.spoke.s3{ transform:rotate(90deg); }

.spoke.s4{ transform:rotate(135deg); }

.spoke.s5{ transform:rotate(180deg); }

.spoke.s6{ transform:rotate(225deg); }

.spoke.s7{ transform:rotate(270deg); }

.spoke.s8{ transform:rotate(315deg); }



.bet-closed-banner{

position:absolute;
bottom:161px;
width:215px;
left:50%;
transform:translateX(-50%);

padding:16px 7px;

font-weight:900;
font-size:22px;
letter-spacing:2px;

color:#fff;

background:
linear-gradient(
90deg,
#001a33,
#003a66,
#001a33
);

border:2px solid #00aaff;

border-radius:8px;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff;

box-shadow:
0 0 20px #00aaff,
inset 0 0 10px #00aaff;

display:none;

animation:policeFlash .5s infinite alternate;

z-index:5;

}

@keyframes policeFlash{

0%{
opacity:0.7;
transform:translateX(-50%) scale(1);
}

100%{
opacity:1;
transform:translateX(-50%) scale(1.05);
}

}



.result-img{

width:90px;
height:90px;

margin:10px auto;

display:block;

filter:drop-shadow(0 0 10px #00aaff);

}

.result-info{

font-size:18px;
font-weight:700;

margin-top:10px;

display:flex;
flex-direction:column;
gap:6px;

}

.result-win{

color:#00ff88;

font-size:22px;

text-shadow:
0 0 10px #00ff88,
0 0 20px #00ff88;

}



.sheet-handle{

width:46px;
height:5px;

border-radius:10px;

background:#777;

margin:0 auto 16px;

opacity:.6;

}


.result-grid{

display:flex;
justify-content:space-between;
gap:10px;

margin-top:12px;

}

.result-card{

flex:1;

background:#161616;

border-radius:12px;

padding:10px;

font-size:14px;

}

.result-value{

font-size:20px;
font-weight:800;

margin-top:4px;

}

.result-card.win{

background:#062d19;

color:#00ff9d;

box-shadow:
0 0 10px #00ff9d inset;

}



.result-ok{

width:100%;
margin-top:18px;

padding:14px;

font-size:18px;
font-weight:800;

border:none;
border-radius:12px;

background:#007bff;
color:#fff;

box-shadow:
0 0 15px #007bff;

}



#betClosedModal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.45);
z-index:999;
}


.bet-closed-bg{

width:420px;
height:200px;

display:flex;
align-items:center;
justify-content:center;

background:
url("/assets/police/police-alert.png")
center / contain no-repeat;

}

#betClosedText{
position:absolute;
font-size:16px;
font-weight:900;
color:#fff;
text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff;
}





.wheel-stand{

position:absolute;

left:50%;
bottom:-161px;

transform:translateX(-50%);

width:650px;
height:425px;

background:
url("/assets/police/wheel-stand.png")
center / contain no-repeat;

pointer-events:none;

z-index:0;

}




.wheel-spokes{

position:absolute;

left:50%;
top:195px;

transform:translate(-50%,-50%);

width:300px;
height:330px;

background:
url("/assets/police/wheel-spokes-police.png")
center / contain no-repeat;

pointer-events:none;

z-index:0;

}




/* HISTORY */

.wheel-history{

position:absolute;
bottom: 162px;
left:50%;
transform:translateX(-50%);

width:300px;
height:50px;

display:flex;
flex-direction:column;
align-items:center;

z-index:3;

}



.history-list{

display:flex;
gap:6px;

}

.history-item{

width:36px;
height:36px;

border-radius:10px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
180deg,
#0d1b2a,
#020617
);

border:1px solid rgba(0,170,255,.4);

box-shadow:
0 0 10px rgba(0,170,255,.4),
inset 0 0 6px rgba(0,170,255,.2);

}

/* màu theo multiplier */

.h5{
background:#1d2f55;
color:#7ab7ff;
}

.h10{
background:#2c1d55;
color:#b37aff;
}

.h15{
background:#55321d;
color:#ffb77a;
}

.h25{
background:#55311d;
color:#ff7a7a;
}

.h45{
background:#552a1d;
color:#ffcc00;
}



</style>
</head>

<body>




<!-- WHEEL -->

<div class="wheel">

<div class="wheel-stand"></div>


<div class="wheel-center">
<span id="timer"></span>
</div>



<div class="wheel-spokes"></div>



<div class="slot s1" onclick="bet(1)">
<div class="multi">x5</div>
<img src="/assets/police/slot1.png" class="slot-img">
<div class="mybet" id="mybet1">0</div>
</div>

<div class="slot s2" onclick="bet(2)">
<div class="multi">x10</div>
<img src="/assets/police/slot2.png" class="slot-img">
<div class="mybet" id="mybet2">0</div>
</div>

<div class="slot s3" onclick="bet(3)">
<div class="multi">x15</div>
<img src="/assets/police/slot3.png" class="slot-img">
<div class="mybet" id="mybet3">0</div>
</div>

<div class="slot s4" onclick="bet(4)">
<div class="multi">x25</div>
<img src="/assets/police/slot4.png" class="slot-img">
<div class="mybet" id="mybet4">0</div>
</div>

<div class="slot s5" onclick="bet(5)">
<div class="multi">x45</div>
<img src="/assets/police/slot5.png" class="slot-img">
<div class="mybet" id="mybet5">0</div>
</div>

<div class="slot s6" onclick="bet(6)">
<div class="multi">x5</div>
<img src="/assets/police/slot6.png" class="slot-img">
<div class="mybet" id="mybet6">0</div>
</div>

<div class="slot s7" onclick="bet(7)">
<div class="multi">x5</div>
<img src="/assets/police/slot7.png" class="slot-img">
<div class="mybet" id="mybet7">0</div>
</div>

<div class="slot s8" onclick="bet(8)">
<div class="multi">x5</div>
<img src="/assets/police/slot8.png" class="slot-img">
<div class="mybet" id="mybet8">0</div>
</div>

</div>



<!-- ================= HISTORY ================= -->

<div class="wheel-history">

<div id="wheelHistoryList" class="history-list">
</div>

</div>



<!-- BET PANEL -->


<div class="coin-bar">
💎 <span id="coins"></span>
</div>


<div class="bet-panel">

<div class="bet-hitbox">

<div class="chip c1" onclick="setBet(10)"></div>
<div class="chip c2" onclick="setBet(50)"></div>
<div class="chip c3" onclick="setBet(100)"></div>
<div class="chip c4" onclick="setBet(1000)"></div>

</div>

</div>

<!-- RESULT -->

<div id="resultModal" class="result" onclick="closeResult()">

<div class="result-box" onclick="event.stopPropagation()">

<div class="sheet-handle"></div>

<div class="result-title">
RESULT
</div>

<img id="resultImg" class="result-img">

<div class="result-grid">

<div class="result-card">
TOTAL BET
<div class="result-value">
<span id="resultTotalBet">0</span> 💎
</div>
</div>

<div class="result-card win">
TOTAL WIN
<div class="result-value">
<span id="resultTotalWin">0</span> 💎
</div>
</div>

</div>

</div>
</div>



<div id="betClosedModal" class="bet-closed-modal">

<div class="bet-closed-bg">

<div id="betClosedText" class="bet-closed-text">
BETTING CLOSED
</div>

</div>

</div>


<script>

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

let currentBet = 0
let highlightIndex = 1
let highlightLoop = null
let highlightSpeed = 1000
let isBetLocked = false
let resultShowing = false
let coins = 0
let wheelHistory = []

const myBets = [0,0,0,0,0,0,0,0]
const slots = document.querySelectorAll(".slot")



function runHighlight(){

slots.forEach(s=>s.classList.remove("win"))

const slot = slots[highlightIndex-1]

if(slot){
slot.classList.add("win")
}

highlightIndex++

if(highlightIndex > 8){
highlightIndex = 1
}

}


function changeHighlightSpeed(speed){

highlightSpeed = speed

if(highlightLoop){

clearInterval(highlightLoop)

highlightLoop =
setInterval(runHighlight, highlightSpeed)

}

}



function startHighlightLoop(){

if(highlightLoop) return

highlightLoop = setInterval(runHighlight, highlightSpeed)

}


function stopHighlightLoop(){

clearInterval(highlightLoop)

highlightLoop = null

slots.forEach(s=>s.classList.remove("win"))

}

/* SET BET */

function setBet(v){

currentBet = v


document.querySelectorAll(".bet-chip")
.forEach(c=>c.classList.remove("active"))

event.target.classList.add("active")

}

/* BET */

function bet(slot){

if(!currentBet) return

const modal = document.getElementById("betClosedModal")
const text  = document.getElementById("betClosedText")

// 🔒 không đủ coin
if(coins < currentBet){

text.textContent = "NOT ENOUGH COINS"

modal.style.display = "flex"

setTimeout(()=>{
modal.style.display = "none"
},2000)

return
}

// 🔒 đã khóa cược
if(isBetLocked){

text.textContent = "BETTING CLOSED"

modal.style.display = "flex"

setTimeout(()=>{
modal.style.display = "none"
},2000)

return
}

// gửi cược
socket.emit("wheel8-bet",{
slot,
bet:currentBet
})

// cộng cược cá nhân
myBets[slot-1] += currentBet

const el = document.getElementById("mybet"+slot)

if(el){

const value = myBets[slot-1]

el.textContent = value

el.style.display = value > 0 ? "block" : "none"

}

}
/* RESULT */

socket.on("wheel8-result",(data)=>{

resultShowing = true

stopHighlightLoop()

const slot = Number(data.slot)
const m = data.multiplier




slots.forEach(s=>s.classList.remove("win"))

const winSlot =
document.querySelector(".slot.s"+slot)

if(winSlot){

winSlot.classList.add("win")

setTimeout(()=>{

winSlot.classList.remove("win")
resultShowing = false

},5000)

}


// hình slot thắng
document.getElementById("resultImg").src =
"/assets/police/slot"+slot+".png"

// tổng cược toàn bộ
const totalBet =
myBets.reduce((a,b)=>a+b,0)

// cược slot thắng
const winBet =
myBets[slot-1] || 0

// tiền thắng
const totalWin =
winBet * m

document.getElementById("resultTotalBet").textContent =
totalBet

document.getElementById("resultTotalWin").textContent =
totalWin

document.getElementById("resultModal").style.display = "flex"

setTimeout(()=>{
closeResult()
},5000)


})

/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent = t

// khóa cược khi còn 5 giây
isBetLocked = (t <= 5)

if(isBetLocked){
slots.forEach(s=>s.classList.add("locked"))
}else{
slots.forEach(s=>s.classList.remove("locked"))
}


// reset tốc độ mỗi round
if(t >= 5){
highlightSpeed = 1000
}

// sau 5 giây mới bắt đầu highlight
if(!resultShowing && t <= 30 && t > 5){
startHighlightLoop()
}

// còn 5 giây thì tăng tốc
if(t <= 5){
changeHighlightSpeed(100)
}

})
/* COIN UPDATE */

socket.on("coin-update",(data)=>{

coins = data.coins

document.getElementById("coins").textContent = coins

})


socket.on("wheel8-history",(list)=>{

wheelHistory = list

renderHistory()

})


function closeResult(){

document.getElementById("resultModal").style.display="none"

}


socket.on("wheel8-pool-update",(pool)=>{

for(let i=0;i<8;i++){

const el = document.getElementById("pool"+(i+1))

if(el){
el.textContent = pool[i]
}

}

})


socket.on("wheel8-round-new",()=>{

isBetLocked = false
highlightSpeed = 1000
stopHighlightLoop()

for(let i=1;i<=8;i++){

const pool = document.getElementById("pool"+i)

if(pool){
pool.textContent = 0
pool.style.display = "none"
}

const mybet = document.getElementById("mybet"+i)

if(mybet){
mybet.textContent = 0
mybet.style.display = "none"
}

myBets[i-1] = 0

}

// đóng modal cảnh báo
document.getElementById("betClosedModal").style.display="none"

})


socket.on("wheel8-my-bets",(bets)=>{

for(let i=0;i<8;i++){

myBets[i] = bets[i]

const el = document.getElementById("mybet"+(i+1))

if(el){

const value = bets[i]

el.textContent = value

if(value > 0){
el.style.display = "block"
}else{
el.style.display = "none"
}

}

}

})



document.addEventListener("touchmove", function(e){

if(e.scale !== 1){
e.preventDefault()
}

},{ passive:false })


document.addEventListener("wheel", function(e){

if(e.ctrlKey){
e.preventDefault()
}

},{ passive:false })


// chặn bôi đen
document.addEventListener("selectstart", e => e.preventDefault())

// chặn chuột phải
document.addEventListener("contextmenu", e => e.preventDefault())

// chặn drag ảnh
document.addEventListener("dragstart", e => e.preventDefault())






function renderHistory(){

const box =
document.getElementById("wheelHistoryList")

box.innerHTML = ""

wheelHistory.forEach(h=>{

const div = document.createElement("div")

div.className = "history-item"

// ⭐ icon xe / máy bay theo slot
const img = document.createElement("img")

img.src = "/assets/police/slot"+h.slot+".png"

img.style.width = "26px"
img.style.height = "26px"
img.style.objectFit = "contain"

div.appendChild(img)

box.appendChild(div)

})

}

</script>

</body>
</html>
