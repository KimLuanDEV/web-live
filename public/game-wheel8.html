<!DOCTYPE html>

<style>


*{

/* WHEEL AREA */

.wheel{

.wheel-center{

#timer{

font-size:20px;

color:#ffffff;

0 0 10px #00aaff,

/* SLOT */

.slot{

position:absolute;

width:95px;
height:95px;

left:189px;
top:188px;

margin-left:-47px;
margin-top:-47px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
url("/assets/police/slot-bg-police.png")
center / contain no-repeat;

transition:.2s;

}




.slot-img{

width:72%;
height:72%;

object-fit:contain;

filter:
drop-shadow(0 0 6px #000)
drop-shadow(0 0 10px rgba(0,0,0,.6));

transition:.2s;

}

.slot.win{

box-shadow:
0 0 20px #00aaff,
0 0 40px #00aaff,
inset 0 0 10px #00aaff;

border-radius:50%;

}





.slot.win .slot-img{

filter:
drop-shadow(0 0 15px #00aaff)
drop-shadow(0 0 30px #00aaff)
drop-shadow(0 0 60px #00aaff);

transform:scale(1.15);

animation:policeWin 0.6s infinite alternate;

}

@keyframes policeWin{

0%{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.1);
}

100%{
filter:drop-shadow(0 0 40px #00aaff);
transform:scale(1.2);
}

}

.multi{

position:absolute;
top:1px;
right: 11px;
font-size:15px;
font-weight:900;

color:#ffd700;

text-shadow:
0 0 6px #000,
0 0 10px #000,
0 0 15px #ffcc00;

pointer-events:none;

}

.pool{

display:none;
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);

font-size:13px;
font-weight:700;

color:#ffd700;

text-shadow:
0 0 5px #000,
0 0 10px #000;

}


/* GRID POSITION */

.s1{ transform:rotate(225deg) translate(140px) rotate(-225deg); }

.s2{ transform:rotate(270deg) translate(140px) rotate(-270deg); }

.s3{ transform:rotate(315deg) translate(140px) rotate(-315deg); }

.s4{ transform:rotate(0deg) translate(140px) rotate(0deg); }

.s5{ transform:rotate(45deg) translate(140px) rotate(-45deg); }

.s6{ transform:rotate(90deg) translate(140px) rotate(-90deg); }

.s7{ transform:rotate(135deg) translate(140px) rotate(-135deg); }

.s8{ transform:rotate(180deg) translate(140px) rotate(-180deg); }

/* BET PANEL */

.bet-panel{

position:absolute;
bottom:-20px;
width:100%;
height:280px;
padding:0;

background:
url("/assets/police/police-panel.png")
center / cover no-repeat;

border-top:2px solid rgba(0,120,255,.6);

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
inset 0 2px 0 rgba(255,255,255,.15);
z-index: 1;
}




.bet-chip{

width:100px;
height:70px;

border-radius:50%;

url("/assets/police/police-chip.png")
center / contain no-repeat;

align-items:center;
justify-content:center;

font-weight:900;
font-size:14px;

color:#fff;

text-shadow:0 0 6px #000;

transition:.2s;

}


.bet-chip:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 8px #00aaff);

}


.bet-chip.active{
color:#fff;
}

/* RESULT MODAL */

.result{
position:fixed;
inset:0;

display:none;

background:rgba(0,0,0,.45);

justify-content:center;

}

.result-box{

url("/assets/police/result-frame-police.png")

}

@keyframes sheetUp{

from{
transform:translateY(100%);
}

to{
transform:translateY(0);
}

}





.mybet{

position:absolute;
bottom:14px;
right:26px;

font-size:13px;
font-weight:800;

color:#ffd700;


padding:2px 6px;

}



.coin-bar{

}

.coin-box{

align-items:center;
gap:0px;

padding:8px 18px;



font-weight:900;
font-size:18px;

}

.coin-icon{

width:38px;
height:48px;

drop-shadow(0 0 6px #00aaff);

}

.coin-value{

color:#fff;

text-shadow:
0 0 6px #00aaff,

letter-spacing:1px;

}



.bet-hitbox{

height:100%;
left:0;
top:0;
}

.chip{

position:absolute;

}

}







.result-img{

top:102px;
left: 168px;
width:145px;
height:145px;
margin:10px auto;
display:block;

}




.sheet-handle{

width:46px;
height:5px;

margin:0 auto 16px;

.result-grid{

}

.result-card{

.wheel-stand{

position:absolute;

left:50%;
bottom:-161px;

transform:translateX(-50%);

width:650px;
height:425px;

background:
url("/assets/police/wheel-stand.png")

}




.wheel-spokes{

url("/assets/police/wheel-spokes-police.png")

bottom: 160px;

height:60px;

}



.history-list{

gap:3px;

}

.history-item{

position:relative;
width:48px;

border-radius:30px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
180deg,
#0d1b2a,
#020617
);

border:1px solid rgba(0,170,255,.4);

box-shadow:
0 0 12px rgba(0,170,255,.5),
inset 0 0 6px rgba(0,170,255,.3);

}



.history-item img{

.history-new{

position:absolute;

top:-6px;
left:26px;

font-size:8px;
font-weight:900;

padding:2px 5px;

color:#fff;

background:linear-gradient(
90deg,
#ff0033,
#ff6600
);

0 0 6px #ff3300,
0 0 10px #ff3300;

}

@keyframes newPulse{

}

100%{

}

}




.wheel-round{

position:absolute;
top:8px;
right:10px;

font-size:12px;
font-weight:700;

color:#fff;

background:rgba(0,0,0,0.5);

padding:4px 8px;

border-radius:6px;

}





/* DECOR BLOCKS */

.decor-left,
.decor-right{

position:absolute;
bottom:240px;

width:120px;
height:146px;

pointer-events:none;
opacity:.9;

}

/* radar trái */

left:-5px;

background:
url("/assets/police/police-girl1.png")
center / contain no-repeat;


}

/* bảng điều khiển phải */

url("/assets/police/police-girl2.png")
center / contain no-repeat;




}




.bet-history-btn{

position:absolute;
bottom:268px;
right:173px;
padding:8px 14px;

font-size:12px;

background:linear-gradient(
90deg,
#001a33,
#003a66,
#001a33
);

border:1px solid #00aaff;
border-radius:6px;

color:#fff;

text-shadow:
0 0 8px #00aaff;

box-shadow:
0 0 10px #00aaff;

z-index: 1;
}



.history-modal{

position:fixed;
inset:0;

display:none;

background:rgba(0,0,0,.6);

align-items:center;
justify-content:center;

z-index:20;

}

.history-box{

width:320px;
max-height:420px;

background:#020617;

border:2px solid #00aaff;

border-radius:12px;

padding:20px;

box-shadow:
0 0 20px #00aaff;

overflow:auto;

}

.history-title{

font-size:18px;
font-weight:900;

}

.history-bets{

}

.history-row{

display:flex;

}

.history-slot-icon{
width:26px;
height:26px;
object-fit:contain;

}

</style>

<body>




<!-- WHEEL -->

<div class="wheel">

<div class="wheel-stand"></div>


<div class="wheel-center">
<span id="timer"></span>
</div>



<div class="wheel-spokes"></div>



<div class="slot s1" onclick="bet(1)">
<div class="multi">x5</div>
<img src="/assets/police/slot1.png" class="slot-img">

<img src="/assets/police/slot4.png" class="slot-img">

</div>

<img src="/assets/police/slot7.png" class="slot-img">

</button>

<div id="roundDetailModal" class="history-modal">

<div class="history-title">
ROUND DETAILS
</div>

<div id="roundDetailList" class="history-bets"></div>

onclick="closeRoundDetail()">

</button>

</div>
</div>



<script>

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

let currentBet = 0
let highlightIndex = 1
let highlightLoop = null
let highlightSpeed = 1000
let isBetLocked = false
let resultShowing = false
let coins = 0
let wheelHistory = []

let myBetHistory = []

let currentRoundId = 0

let lastWinSlot = 0
let lastWinMulti = 0

let roundResults = {}


let lastBetSlot = 0
let lastBetValue = 0


const myBets = [0,0,0,0,0,0,0,0]
const slots = document.querySelectorAll(".slot")



function runHighlight(){

slots.forEach(s=>s.classList.remove("win"))

const slot = slots[highlightIndex-1]

if(slot){
slot.classList.add("win")
}

highlightIndex++

if(highlightIndex > 8){
highlightIndex = 1
}

}


function changeHighlightSpeed(speed){

highlightSpeed = speed

if(highlightLoop){

clearInterval(highlightLoop)

highlightLoop =
setInterval(runHighlight, highlightSpeed)

}

}



function startHighlightLoop(){

if(highlightLoop) return

highlightLoop = setInterval(runHighlight, highlightSpeed)

}


function stopHighlightLoop(){

clearInterval(highlightLoop)
highlightLoop = null

}

/* SET BET */

function setBet(v){

currentBet = v


document.querySelectorAll(".bet-chip")
.forEach(c=>c.classList.remove("active"))

event.target.classList.add("active")

}

/* BET */

function bet(slot){

if(!currentBet) return

const modal = document.getElementById("betClosedModal")
const text  = document.getElementById("betClosedText")

// 🔒 không đủ coin
if(coins < currentBet){

text.textContent = "NOT ENOUGH COINS"

modal.style.display = "flex"

setTimeout(()=>{
modal.style.display = "none"
},2000)

return
}

// 🔒 đã khóa cược
if(isBetLocked){

text.textContent = "BETTING CLOSED"

modal.style.display = "flex"

setTimeout(()=>{
modal.style.display = "none"
},2000)

return
}

// gửi cược
socket.emit("wheel8-bet",{
slot,
bet:currentBet
})


/* 📜 LƯU HISTORY CƯỢC */

// tìm record cùng round + slot
let row = myBetHistory.find(r =>
r.round === currentRoundId &&
r.slot === slot
)

if(row){

// cộng thêm cược
row.bet += currentBet

}else{


}

// giới hạn 20 dòng
if(myBetHistory.length > 20){
myBetHistory.pop()
}


// lưu tạm slot vừa cược
lastBetSlot = slot
lastBetValue = currentBet


const el = document.getElementById("mybet"+slot)

if(el){

const value = myBets[slot-1]

el.textContent = value

el.style.display = value > 0 ? "block" : "none"

}

}
/* RESULT */

socket.on("wheel8-result",(data)=>{


lastWinSlot = data.slot
lastWinMulti = data.multiplier


roundResults[currentRoundId] = {
slot:data.slot,
multi:data.multiplier
}


// cập nhật history ngay lập tức
wheelHistory.unshift({
slot:data.slot,
multi:data.multiplier
})

wheelHistory = wheelHistory.slice(0,8)

renderHistory()



resultShowing = true

stopHighlightLoop()

const slot = Number(data.slot)
const m = data.multiplier




slots.forEach(s=>s.classList.remove("win"))

const winSlot =
document.querySelector(".slot.s"+slot)

if(winSlot){

winSlot.classList.add("win")

setTimeout(()=>{

winSlot.classList.remove("win")
resultShowing = false

},5000)

}


// hình slot thắng
document.getElementById("resultImg").src =
"/assets/police/slot"+slot+".png"

// tổng cược toàn bộ
const totalBet =
myBets.reduce((a,b)=>a+b,0)

// cược slot thắng
const winBet =
myBets[slot-1] || 0

// tiền thắng
const totalWin =
winBet * m

document.getElementById("resultTotalBet").textContent =
totalBet

document.getElementById("resultTotalWin").textContent =
totalWin

document.getElementById("resultModal").style.display = "flex"

setTimeout(()=>{
closeResult()
},5000)



// reload history sau khi có kết quả
socket.emit("wheel8-get-my-history")

})

/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent = t

// khóa cược khi còn 5 giây
isBetLocked = (t <= 5)

if(isBetLocked){
slots.forEach(s=>s.classList.add("locked"))
}else{
slots.forEach(s=>s.classList.remove("locked"))
}


// reset tốc độ mỗi round
if(t >= 5){
highlightSpeed = 1000
}

// sau 5 giây mới bắt đầu highlight
if(!resultShowing && t <= 30 && t > 5){
startHighlightLoop()
}

// còn 5 giây thì tăng tốc
if(t <= 5){
changeHighlightSpeed(100)
}

})
/* COIN UPDATE */

socket.on("coin-update",(data)=>{

coins = data.coins

document.getElementById("coins").textContent = coins

})


socket.on("wheel8-history",(list)=>{

wheelHistory = list

renderHistory()

})



// 📜 USER BET HISTORY
socket.on("wheel8-my-history",(list)=>{

myBetHistory = []

list.forEach(r=>{

myBetHistory.push({
round: r.roundId,
slot: r.slot,
bet: r.bet,
win: r.win || 0,
multi: r.multiplier || 0
})

})

renderMyBetHistory()

})



function closeResult(){

document.getElementById("resultModal").style.display="none"

}


socket.on("wheel8-pool-update",(pool)=>{

for(let i=0;i<8;i++){

const el = document.getElementById("pool"+(i+1))

if(el){
el.textContent = pool[i]
}

}

})


socket.on("wheel8-round-new",(data)=>{

currentRoundId = data.roundId

isBetLocked = false
highlightSpeed = 1000

if(!resultShowing){
stopHighlightLoop()
}

for(let i=1;i<=8;i++){

const pool = document.getElementById("pool"+i)

if(pool){
pool.textContent = 0
pool.style.display = "none"
}

const mybet = document.getElementById("mybet"+i)

if(mybet){

function renderMyBetHistory(){

const box =
document.getElementById("myBetHistoryList")

box.innerHTML=""

// gom theo round
const rounds = {}

myBetHistory.forEach(b=>{

if(!rounds[b.round]){
rounds[b.round] = []
}

rounds[b.round].push(b)

})


Object.keys(rounds)
.sort((a,b)=>b-a)
.forEach(round=>{

const list = rounds[round]

// tổng cược
const totalBet =
list.reduce((a,b)=>a+b.bet,0)

// tổng thắng
let totalWin = 0

list.forEach(b=>{
totalWin += b.win || 0
})



const row = document.createElement("div")
row.className="history-row"

row.innerHTML =
"Round "+round+
" | 💎"+totalBet+
" | 💎"+totalWin

// click mở chi tiết
row.onclick = ()=>openRoundDetailFromHistory(round)

box.appendChild(row)

})

}


function openRoundDetailFromHistory(round){

document.getElementById("roundDetailModal")
.style.display="flex"

const box =
document.getElementById("roundDetailList")

box.innerHTML=""

// lấy tất cả cược của round
const bets =
myBetHistory.filter(b=>b.round == round)

// =======================
// GỘP THEO SLOT
// =======================

const slotMap = {}

bets.forEach(b=>{

if(!slotMap[b.slot]){
slotMap[b.slot] = 0
}

slotMap[b.slot] += b.bet

})

// =======================
// RENDER
// =======================

Object.keys(slotMap).forEach(slot=>{

const bet = slotMap[slot]

const row = document.createElement("div")
row.className="history-row"

let winMark = ""

const winRow =
bets.find(b=>b.slot == slot && b.win > 0)

if(winRow){
winMark = " ⭐ WIN"
}


row.innerHTML =
"<img src='/assets/police/slot"+slot+".png' class='history-slot-icon'>" +
"<span>"+bet+" 💎</span>" +
winMark

box.appendChild(row)

})

}
