<style>

}

html, body{
  margin:0;

  overscroll-behavior:none;
  touch-action:none;
}



*{

-moz-user-select:none;
-ms-user-select:none;

}

body{

color:#fff;
overflow:hidden;

background:#000;
position:fixed;
width:100%;

  display:flex;
  justify-content:center;
  align-items:center;


}

body::before{

  inset:0;
  background:#000000;
  z-index:-1;
}
/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
padding:12px 16px;
font-weight:700;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.1);
}



/* WHEEL AREA */

.wheel{

position:relative;

width:380px;
height:380px;

max-width:380px;
max-height:380px;

margin:160px auto 0;

}





.wheel-center{

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);

width:120px;
height:120px;

display:flex;
align-items:center;
justify-content:center;

font-size:26px;

color:#ffffff;

url("/assets/police/wheel-center-police.png")
center / contain no-repeat;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff;

z-index:2;

}


#timer{
top:50px;
font-size:20px;
font-weight:900;

color:#ffffff;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff,
0 0 40px #00aaff;

}





/* SLOT */

.slot{

position:absolute;

width:95px;
height:95px;

left:189px;
top:188px;

margin-left:-47px;
margin-top:-47px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
url("/assets/police/slot-bg-police.png")
center / contain no-repeat;

transition:.2s;

}




.slot-img{

width:60%;
height:60%;

object-fit:contain;

transition:.2s;

}

.slot.win{

box-shadow:
0 0 20px #f5e12a,
0 0 40px #f5e12a,
inset 0 0 10px #f5e12a;

border-radius:50%;

}





.slot.win .slot-img{

filter:
drop-shadow(0 0 15px #f5e12a)
drop-shadow(0 0 30px #f5e12a)
drop-shadow(0 0 60px #f5e12a);

transform:scale(1.15);

animation:policeWin 0.6s infinite alternate;

}

@keyframes policeWin{

0%{
filter:drop-shadow(0 0 15px #f5e12a);
transform:scale(1.1);
}

100%{
filter:drop-shadow(0 0 40px #f5e12a);
transform:scale(1.2);
}

}

.multi{
  position:absolute;

  top:-23px;
  right:6px;

  width:80px;
  height:70px;

  pointer-events:none;

  z-index:3;
}

.multi img{
  width:100%;
  height:100%;
  object-fit:contain;
  transition:.2s;
}


.slot:hover .multi img{
  transform:scale(1.1);
  filter:
    drop-shadow(0 0 10px #00cfff)
    drop-shadow(0 0 20px #00cfff);
}

.slot.win .multi img{
  filter:
    drop-shadow(0 0 10px #ffd700)
    drop-shadow(0 0 25px #ffcc00);

  transform:scale(1.15);
}



.pool{

display:none;
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);

font-size:13px;
font-weight:700;

color:#ffd700;

text-shadow:
0 0 5px #000,
0 0 10px #000;

}


/* GRID POSITION */

.s1{ transform:rotate(225deg) translate(140px) rotate(-225deg); }

.s2{ transform:rotate(270deg) translate(140px) rotate(-270deg); }

.s3{ transform:rotate(315deg) translate(140px) rotate(-315deg); }

.s4{ transform:rotate(0deg) translate(140px) rotate(0deg); }

.s5{ transform:rotate(45deg) translate(140px) rotate(-45deg); }

.s6{ transform:rotate(90deg) translate(140px) rotate(-90deg); }

.s7{ transform:rotate(135deg) translate(140px) rotate(-135deg); }

.s8{ transform:rotate(180deg) translate(140px) rotate(-180deg); }

/* BET PANEL */

.bet-panel{

position:absolute;
bottom:-20px;
width:100%;
height:280px;
padding:0;

background:
url("/assets/police/police-panel.png")
center / cover no-repeat;

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
inset 0 2px 0 rgba(255,255,255,.15);
z-index: 1;
}




.bet-chip{

height:70px;

justify-content:center;

color:#fff;

text-shadow:0 0 6px #000;

}

/* RESULT MODAL */

.result{

justify-content:center;

}

bottom: -52px;

height:320px;

url("/assets/police/result-frame-police.png")
center / contain no-repeat;

}

@keyframes sheetUp{

from{
transform:translateY(100%);
}

to{

}

}




.mybet{
  display:none;

  position:absolute;
  bottom:-1px;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:4px;

  padding:3px 8px;

  font-size:12px;
  font-weight:900;

  color:#fff;

  background:
    linear-gradient(
      180deg,
      rgba(0,20,40,.9),
      rgba(0,10,25,.95)
    );

  border:1px solid rgba(0,170,255,.6);

  border-radius:999px;

  box-shadow:
    0 0 8px rgba(0,170,255,.6),
    inset 0 0 6px rgba(0,170,255,.4);

  backdrop-filter:blur(4px);

  z-index:4;
}

/* ICON */
.mybet img{
  width:14px;
  height:14px;

  filter:
    drop-shadow(0 0 4px #00cfff)
    drop-shadow(0 0 8px #00aaff);
}

/* TEXT */
.mybet span{
  letter-spacing:0.5px;
}

/* WHEN BET > 0 → EFFECT */
.mybet.active{
  animation:betPulse .6s ease;
}

@keyframes betPulse{
  0%{ transform:translateX(-50%) scale(0.8); opacity:0 }
  100%{ transform:translateX(-50%) scale(1); opacity:1 }
}


.coin-bar{

position:absolute;
bottom:104px;
left:50%;
transform:translateX(-50%);

z-index:5;

}

.coin-box{

display:flex;
align-items:center;
gap:0px;

padding:8px 18px;



font-weight:900;
font-size:18px;

}

.coin-icon{

width:38px;
height:48px;

filter:
drop-shadow(0 0 6px #00aaff);

}

.coin-value{

color:#fff;

text-shadow:
0 0 6px #00aaff,
0 0 12px #00aaff;

letter-spacing:1px;

}



.bet-hitbox{

position:absolute;
width:100%;
height:100%;
left:0;
top:0;
}

.chip{

position:absolute;

width:95px;
height:95px;

cursor:pointer;

}




.chip::after{

content:"";

position:absolute;
left:50%;
top:50%;

width:50px;
height:48px;

transform:translate(-50%,-50%) scale(0.8);

border-radius:50%;

border:3px solid #b6b900;

box-shadow:
0 0 10px #b6b900,
0 0 20px #b6b900,
0 0 40px #b6b900;

opacity:0;

transition:.2s;

}

/* khi chọn chip */

.chip.active::after{

opacity:1;
transform:translate(-50%,-48%) scale(1.12);

}

.history-modal{

/* ==========================================
   MILITARY HISTORY UI
   MY BET HISTORY + ROUND DETAILS
   Layout: 430 x 870
========================================== */

#myBetHistoryModal,
#roundDetailModal {
    --army-bg: #07110b;
    --army-panel: #152719;
    --army-green: #74ff39;
    --army-gold: #eac46b;
    --army-line: #49634a;

    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(60, 105, 46, .35),
            transparent 55%
        ),
        repeating-linear-gradient(
            135deg,
            transparent 0 45px,
            rgba(105, 135, 65, .025) 45px 90px
        ),
        linear-gradient(
            180deg,
            #172a1b 0%,
            #0b190f 42%,
            #030804 100%
        );

    color: #e8f2e4;
    font-family: system-ui, sans-serif;
    z-index: 500;
    overflow: hidden;
}

/* Viền khung màn hình */

#myBetHistoryModal::before,
#roundDetailModal::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(143, 181, 105, .25);
    box-shadow:
        inset 0 0 25px rgba(0, 0, 0, .6),
        0 0 12px rgba(88, 255, 40, .08);
    pointer-events: none;
    z-index: 0;
}

/* ==========================================
   MILITARY HEADER
========================================== */

#myBetHistoryModal .history-header,
#roundDetailModal .history-header {
    position: relative;
    flex-shrink: 0;
    min-height: 92px;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 18px 65px 18px 22px;

    background:
        linear-gradient(
            120deg,
            rgba(65, 90, 54, .25),
            transparent 60%
        ),
        linear-gradient(
            180deg,
            #304431,
            #152419 65%,
            #0b150d
        );

    border-bottom: 3px solid #8c783d;

    box-shadow:
        0 5px 18px rgba(0, 0, 0, .65),
        inset 0 1px 0 rgba(255, 255, 255, .12);

    z-index: 2;
}

/* Thanh LED dưới header */

#myBetHistoryModal .history-header::after,
#roundDetailModal .history-header::after {
    content: "";
    position: absolute;
    bottom: -3px;
    left: 22px;
    right: 22px;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        #9bff51,
        #d9b75e,
        #9bff51,
        transparent
    );

    box-shadow: 0 0 10px rgba(100, 255, 50, .6);
}

/* Tiêu đề */

#myBetHistoryModal .history-title,
#roundDetailModal .history-title {
    font-size: 20px;
    font-weight: 1000;
    letter-spacing: 1.2px;

    color: #f5d887;

    text-shadow:
        0 2px 2px #000,
        0 0 12px rgba(255, 195, 60, .35);
}

/* Dòng phụ */

#myBetHistoryModal .history-sub,
#roundDetailModal .history-sub {
    margin-top: 5px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;

    color: #a5c99b;
    opacity: 1;
}

/* Nút đóng quân đội */

#myBetHistoryModal .history-close,
#roundDetailModal .history-close {
    position: absolute;
    top: 22px;
    right: 18px;

    width: 42px;
    height: 42px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #b99a50;
    border-radius: 5px;

    background: linear-gradient(
        145deg,
        #4a5744,
        #18251b 55%,
        #080e09

    color: #ffe3a0;
    font-size: 19px;
    font-weight: 900;

    box-shadow:
        0 4px 10px #0008,
        inset 0 1px 0 #ffffff30;

    cursor: pointer;
    z-index: 5;
}

#myBetHistoryModal .history-close:active,
#roundDetailModal .history-close:active {
    transform: scale(.94);
    background: #50633b;
}

/* ==========================================
   MY BET HISTORY TABLE
========================================== */

#myBetHistoryModal .history-table {
    position: relative;
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;

    padding: 15px 12px 20px;
    overflow: hidden;
}

/* Tiêu đề cột */

#myBetHistoryModal .history-head {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    align-items: center;

    min-height: 45px;
    padding: 0 4px;
    box-sizing: border-box;

    background: linear-gradient(
        180deg,
        #46583b,
        #202e22
    );

    border: 1px solid #b79a50;
    border-bottom: 2px solid #c9a75b;
    border-radius: 5px 5px 0 0;

    color: #f3d68c;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .6px;

    text-align: center;
    flex-shrink: 0;
}

/* Danh sách cuộn */

#myBetHistoryModal .history-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;

    display: flex;
    flex-direction: column;
    gap: 6px;

    padding: 9px 2px 20px;

    scrollbar-width: thin;
    scrollbar-color: #617a49 transparent;
}

/* Hàng lịch sử */

#myBetHistoryModal .history-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    align-items: center;

    min-height: 55px;
    box-sizing: border-box;
    padding: 8px 4px;

    background: linear-gradient(
        115deg,
        #253b28,
        #122117 70%,
        #0b170e

    border: 1px solid #425a3d;
    border-left: 3px solid #829d57;
    border-radius: 5px;

    box-shadow:
        0 3px 8px rgba(0, 0, 0, .35),
        inset 0 1px 0 rgba(255, 255, 255, .05);

    font-size: 12px;
    font-weight: 800;
    text-align: center;

    transition: background .15s;
}

#myBetHistoryModal .history-row:active {
    background: #354d31;
}

/* Phiên thắng */

#myBetHistoryModal .history-row.win {
    border-left-color: #79ff4e;
    background: linear-gradient(
        110deg,
        #274c2a,
        #132b19
    );
}

/* Phiên thua */

#myBetHistoryModal .history-row.lose {
    border-left-color: #e16b54;
    background: linear-gradient(
        110deg,
        #3b2923,
        #1b2018
    );
}

/* Màu số liệu */

#myBetHistoryModal .history-row.win > :last-child {
    color: #8bff65;
    text-shadow: 0 0 6px #47ff3440;
}

#myBetHistoryModal .history-row.lose > :last-child {
    color: #ff9281;
}

/* ==========================================
   ROUND RESULT
========================================== */

#roundDetailModal .round-result {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    min-height: 150px;
    margin: 0;
    padding: 14px 20px;

    box-sizing: border-box;

    background:
        radial-gradient(
            ellipse at center,
            rgba(77, 124, 49, .3),

            180deg,
            #1b2f1c,
            #0c180f
        );

    box-shadow: inset 0 -8px 18px #0005;

    flex-shrink: 0;
}

/* Hình kết quả */

#roundDetailModal .round-result-icon {
    width: 108px;
    height: 108px;
    flex-shrink: 0;

    background-position: center;
    background-size: contain;
    background-repeat: no-repeat;

    filter:
        drop-shadow(0 0 8px rgba(113, 255, 60, .25))

/* Hệ số kết quả */

#roundDetailModal .round-result-text {
    font-size: 25px;
    font-weight: 1000;
    letter-spacing: 1px;

    color: #ffdc78;

    text-shadow:

        0 0 12px rgba(255, 190, 45, .3);
}

/* ==========================================
   ROUND DETAIL TABLE
========================================== */

#roundDetailModal .round-table-head {
    display: grid;
    grid-template-columns: 142px 2fr 1fr;
    align-items: center;

    min-height: 48px;
    box-sizing: border-box;
    padding: 0 12px;

    background: linear-gradient(
        180deg,
        #435639,
        #1b2b1e
    );

    border-bottom: 2px solid #b99a4e;

    color: #f4d48b;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1px;
    text-align: center;

    flex-shrink: 0;
}

/* Danh sách cược theo slot */

#roundDetailModal .round-detail-list {
    flex: 1;
    min-height: 0;

    display: flex;
    flex-direction: column;
    gap: 8px;

    padding: 12px 10px 24px;

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: thin;
    scrollbar-color: #6e8753 transparent;
}

/* Từng slot */

#roundDetailModal .round-slot-row {
    display: grid;
    grid-template-columns: 142px 2fr 1fr;

    background: linear-gradient(
        110deg,
        #273d2a,
        #152419 75%,
        #0b160e

    border-left: 3px solid #b99a50;
    border-radius: 6px;

    box-shadow:
        0 4px 10px #0005,
        inset 0 1px 0 #ffffff0b;

#roundDetailModal .round-slot-row:active {
    background: #344a30;

/* Khu vực icon slot */

#roundDetailModal .round-slot-left {

    left: 0;

    align-items: center;
    justify-content: flex-start;
    gap: 5px;

/* Hình slot */

#roundDetailModal .round-slot-icon {
    width: 55px;
    height: 55px;
    flex-shrink: 0;

    object-fit: contain;

    filter: drop-shadow(0 3px 5px #0009);
}

/* Tiền cược */

#roundDetailModal .round-slot-bet {
    font-size: 14px;
    font-weight: 900;
    color: #f4e6bd;
    text-align: center;
}

/* Tiền thắng */

#roundDetailModal .round-slot-win {
    font-size: 14px;
    font-weight: 900;
    color: #83ff62;
    text-align: center;

    text-shadow: 0 0 7px #43ff302e;
}

/* ==========================================
   SHARED DETAILS
========================================== */

#myBetHistoryModal .result-row,
#roundDetailModal .result-row {
    background: linear-gradient(
        120deg,
        #46512a,
        #243c22
    );

    border: 1px solid #c5a252;
    border-left: 3px solid #e8c16b;

    box-shadow:
        inset 0 0 12px #e6b94c12,
        0 0 8px #0006;

/* Scrollbar */

#myBetHistoryModal ::-webkit-scrollbar,
#roundDetailModal ::-webkit-scrollbar {

#myBetHistoryModal ::-webkit-scrollbar-thumb,
#roundDetailModal ::-webkit-scrollbar-thumb {

#myBetHistoryModal,
#roundDetailModal {
    box-sizing: border-box;
}

#myBetHistoryModal *,
#roundDetailModal * {
    box-sizing: border-box;
}

<script>


/* =====================================
   AUTO RESPONSIVE IOS + ANDROID
   GIỮ NGUYÊN BỐ CỤC 430 x 870
===================================== */

(function(){

  const BASE_WIDTH = 430;
  const BASE_HEIGHT = 870;

  function resizeGame(){

    const app = document.getElementById("app");

    if(!app) return;

    // Kích thước màn hình thực tế
    const screenWidth = window.innerWidth;

    const screenHeight =
      window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;

    // Tỷ lệ chiều ngang
    const scaleX = screenWidth / BASE_WIDTH;

    // Tỷ lệ chiều dọc
    const scaleY = screenHeight / BASE_HEIGHT;

    // Giữ nguyên tỷ lệ hình ảnh, không méo
   const scale = Math.min(1, scaleX, scaleY);

    // Tự động căn giữa
    app.style.width = BASE_WIDTH + "px";
    app.style.height = BASE_HEIGHT + "px";

    app.style.transform =
      `translate(-50%, -50%) scale(${scale})`;

  }

  // Khi mở game
  if(document.readyState === "loading"){
    document.addEventListener(
      "DOMContentLoaded",
      resizeGame
    );
  }else{
    resizeGame();
  }

  // Khi thay đổi kích thước màn hình
  window.addEventListener("resize", resizeGame);

  // iOS Safari thay đổi vùng hiển thị
  if(window.visualViewport){
    window.visualViewport.addEventListener(
      "resize",
      resizeGame
    );
  }

  // Khi xoay điện thoại
  window.addEventListener(
    "orientationchange",
    resizeGame
  );

})();


const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});




let currentBet = 0
let highlightIndex = 1
let highlightLoop = null
let highlightSpeed = 1000
let isBetLocked = false
let resultShowing = false
let coins = 0
let wheelHistory = []

let myBetHistory = []

let currentRoundId = 0

let lastWinSlot = 0
let lastWinMulti = 0

let roundResults = {}


let lastBetSlot = 0
let lastBetValue = 0


const myBets = [0,0,0,0,0,0,0,0]
const slots = document.querySelectorAll(".slot")

let wheel8History = []

socket.on("wheel8-history",(list)=>{

wheel8History = list || []

})

function runHighlight(){

slots.forEach(s=>s.classList.remove("win"))

const slot = slots[highlightIndex-1]

if(slot){
slot.classList.add("win")
}

highlightIndex++

if(highlightIndex > 8){
highlightIndex = 1
}

}


function changeHighlightSpeed(speed){

highlightSpeed = speed

if(highlightLoop){

clearInterval(highlightLoop)

highlightLoop =
setInterval(runHighlight, highlightSpeed)

}

}



function startHighlightLoop(){

if(highlightLoop) return

highlightLoop = setInterval(runHighlight, highlightSpeed)

}


function stopHighlightLoop(){

clearInterval(highlightLoop)
highlightLoop = null

}

/* SET BET */

function setBet(v){

currentBet = v

// reset
document.querySelectorAll(".chip")
.forEach(c=>c.classList.remove("active"))

// chip vừa bấm
event.target.classList.add("active")

}

/* BET */

function bet(slot){

if(!currentBet) return

const modal = document.getElementById("betClosedModal")
const text  = document.getElementById("betClosedText")

// 🔒 không đủ coin
if(coins < currentBet){

text.textContent = "NOT ENOUGH COINS"
modal.style.display = "flex"

setTimeout(()=> modal.style.display = "none",2000)

return
}

// 🔒 đã khóa cược
if(isBetLocked){

text.textContent = "BETTING CLOSED"
modal.style.display = "flex"

setTimeout(()=> modal.style.display = "none",2000)

return
}

// ✅ gửi cược (KHÔNG update UI ở đây)
socket.emit("wheel8-bet",{
  slot,
  bet:currentBet
})


// =========================
// 📜 LƯU HISTORY (OK giữ)
// =========================

let row = myBetHistory.find(r =>
r.round === currentRoundId &&
r.slot === slot
)

if(row){
  row.bet += currentBet
}else{
  myBetHistory.push({
    round: currentRoundId,
    slot: slot,
    bet: currentBet,
    win:0,
    multi:0
  })
}

// giữ tối đa
if(myBetHistory.length > 200){
  myBetHistory.pop()
}


// =========================
// 🧠 CHỈ LƯU PENDING
// =========================

lastBetSlot = slot
lastBetValue = currentBet

// ❌ KHÔNG update UI ở đây nữa

}
/* RESULT */

socket.on("wheel8-result",(data)=>{

const winSlots = data.slots || [data.slot]
const m = data.multiplier

// slot đại diện để hiển thị hình
const resultSlot = winSlots[0] || 1

lastWinSlot = resultSlot
lastWinMulti = m

roundResults[currentRoundId] = {
slot: resultSlot,
multi: m,
slots: winSlots
}

// cập nhật history
wheelHistory.unshift({
slot: resultSlot,
multi: m,
slots: winSlots,
event: data.event || null
})

wheelHistory = wheelHistory.slice(0,8)

renderHistory()

resultShowing = true

stopHighlightLoop()

// reset highlight
document.querySelectorAll(".slot")
.forEach(s=>s.classList.remove("win"))

// highlight tất cả slot thắng
winSlots.forEach(s=>{

const el = document.querySelector(".slot.s"+s)

if(el){

el.classList.add("win")

setTimeout(()=>{
el.classList.remove("win")
resultShowing = false
},5000)

}

})

// hình slot thắng
// hình kết quả

let resultImg = "/assets/police/slot"+resultSlot+".png"

// event 4 slot x5
if(winSlots.length === 4){

// event slot 1,6,7,8
if(winSlots.includes(1)){
resultImg = "/assets/police/event-x5-all.png"
}

// event slot 2,3,4,5
else{
resultImg = "/assets/police/event-x45-all.png"
}

}

document.getElementById("resultImg").src = resultImg

// tổng cược
const totalBet =
myBets.reduce((a,b)=>a+b,0)

// tổng tiền thắng (có thể nhiều slot)
let totalWin = 0

winSlots.forEach(s=>{

// multiplier theo slot
const slotMulti = [5,10,15,25,45,5,5,5][s-1]

totalWin += (myBets[s-1] || 0) * slotMulti

})

document.getElementById("resultTotalBet").textContent =
totalBet

document.getElementById("resultTotalWin").textContent =
totalWin

document.getElementById("resultModal").style.display = "flex"

setTimeout(()=>{
closeResult()
},5000)

// reload history
socket.emit("wheel8-get-my-history")


// =======================
// 🏆 TOP WINNERS UI
// =======================

const box = document.getElementById("topWinners")
box.innerHTML = ""

if(data.top && data.top.length){

  // đảm bảo luôn đúng thứ tự
  const top = data.top
    .sort((a,b)=>b.win - a.win)
    .slice(0,3)

  top.forEach((p,i)=>{

    const card = document.createElement("div")

    let cls = ""
    let rank = ""

    if(i===0){ cls="top1"; rank="🥇" }
    else if(i===1){ cls="top2"; rank="🥈" }
    else if(i===2){ cls="top3"; rank="🥉" }

    card.className = "top-card " + cls

    card.innerHTML = `
      <div class="top-name">${p.name}</div>
      <div class="top-win">${p.win}💎</div>
    `

    // 🔥 TOP 1 ở giữa
    if(i === 0){
      box.appendChild(card)
    }else{
      box.insertBefore(card, box.firstChild)
    }

  })

}

})
/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent = t

// khóa cược khi còn 5 giây
isBetLocked = (t <= 5)

if(isBetLocked){
slots.forEach(s=>s.classList.add("locked"))
}else{
slots.forEach(s=>s.classList.remove("locked"))
}


// reset tốc độ mỗi round
if(t >= 5){
highlightSpeed = 1000
}

// sau 5 giây mới bắt đầu highlight
if(!resultShowing && t <= 30 && t > 5){
startHighlightLoop()
}

// còn 5 giây thì tăng tốc
if(t <= 5){
changeHighlightSpeed(100)
}

})
/* COIN UPDATE */

socket.on("coin-update",(data)=>{

coins = data.coins

document.getElementById("coins").textContent = coins

})


socket.on("wheel8-history",(list)=>{

wheelHistory = list

renderHistory()

})



// 📜 USER BET HISTORY
socket.on("wheel8-my-history",(list)=>{

myBetHistory = []

list.forEach(r=>{

myBetHistory.push({
round: Number(r.roundId) || 0,
slot: Number(r.slot) || 0,
bet: Number(r.bet) || 0,
win: Number(r.win) || 0,
multi: Number(r.multiplier) || 0,
winSlot: Number(r.winSlot) || 0,
event: r.event || null,
time: Number(r.ts) || 0
})

})

// giữ 50 round
const rounds = {}

myBetHistory.forEach(b=>{

if(!rounds[b.round]){
rounds[b.round] = []
}

rounds[b.round].push(b)

})

const roundIds =
Object.keys(rounds)
.sort((a,b)=>{

const ta = rounds[a][0]?.time || 0
const tb = rounds[b][0]?.time || 0

return tb - ta

})
.slice(0,50)

const newList = []

roundIds.forEach(r=>{
newList.push(...rounds[r])
})

myBetHistory = newList

renderMyBetHistory()

})


function closeResult(){

document.getElementById("resultModal").style.display="none"

// reset bet sau khi xem kết quả
for(let i=1;i<=8;i++){

const el = document.getElementById("mybet"+i)

if(el){
el.textContent = 0
el.style.display = "none"
}

myBets[i-1] = 0

}

}


socket.on("wheel8-pool-update",(pool)=>{

for(let i=0;i<8;i++){

const el = document.getElementById("pool"+(i+1))

if(el){
el.textContent = pool[i]
}

}

})


socket.on("wheel8-round-new",(data)=>{

function renderHistory(){

const box =
document.getElementById("wheelHistoryList")

box.innerHTML = ""

const list = wheelHistory.slice(0,8)

list.forEach((h,i)=>{

const div = document.createElement("div")
div.className = "history-item"

// slot 2,3,4,5 = đỏ
// slot 1,6,7,8 = xanh
let historyColor = ""

if(h.event === "x45-all"){
  historyColor = "history-red"
}
else if(h.event === "x5-all"){
  historyColor = "history-blue"
}
else if(Array.isArray(h.slots) && h.slots.length === 4){

  if(h.slots.includes(1)){
    historyColor = "history-blue"
  }else{
    historyColor = "history-red"
  }

}
else{

  const slot = Number(h.slot)

  if([2,3,4,5].includes(slot)){
    historyColor = "history-red"
  }
  else if([1,6,7,8].includes(slot)){
    historyColor = "history-blue"
  }

}

if(historyColor){
  div.classList.add(historyColor)
}

const img = document.createElement("img")

let imgSrc = "/assets/police/slot"+h.slot+".png"

// EVENT X5 ALL
if(h.event === "x5-all"){
  imgSrc = "/assets/police/event-x5-all.png"
}

// EVENT X45 ALL
else if(h.event === "x45-all"){
  imgSrc = "/assets/police/event-x45-all.png"
}

// fallback nếu server chưa gửi event
else if(Array.isArray(h.slots) && h.slots.length === 4){

  if(h.slots.includes(1)){
    imgSrc = "/assets/police/event-x5-all.png"
  }else{
    imgSrc = "/assets/police/event-x45-all.png"
  }

}

img.src = imgSrc

div.appendChild(img)

// badge NEW cho kết quả mới nhất
if(i === 0){

const badge = document.createElement("div")
badge.className = "history-new"
badge.textContent = "NEW"

div.appendChild(badge)

}

box.appendChild(div)

})

}

function renderMyBetHistory(){

const box =
document.getElementById("myBetHistoryList")

box.innerHTML=""

// gom theo round
const rounds = {}

myBetHistory.forEach(b=>{

if(!rounds[b.round]){
rounds[b.round] = []
}

rounds[b.round].push(b)

})

Object.entries(rounds)
.sort((a,b)=>{

const ta = a[1][0].time || 0
const tb = b[1][0].time || 0

return tb - ta

})
.forEach(([round,list])=>{



// tổng cược
const totalBet =
list.reduce((a,b)=>a + (b.bet || 0),0)

// tổng thắng
const totalWin =
list.reduce((a,b)=>a + (b.win || 0),0)


const ts = list[0].time || 0

const time = ts
? new Date(ts).toLocaleTimeString("vi-VN",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
})
: "--"

const row = document.createElement("div")

row.className =
"history-row " + (totalWin > 0 ? "win":"lose")

row.innerHTML =
"<div>"+round+"</div>" +
"<div>"+time+"</div>" +
"<div>💎"+totalBet+"</div>" +
"<div>💎"+totalWin+"</div>"

row.onclick =
()=>openRoundDetailFromHistory(round)

box.appendChild(row)

})

}



function openRoundDetailFromHistory(round){

const modal = document.getElementById("roundDetailModal")
const box   = document.getElementById("roundDetailList")

modal.style.display = "flex"
box.innerHTML = ""

const bets = myBetHistory
.filter(b => Number(b.round) === Number(round))

if(!bets.length){
box.innerHTML = "<div class='round-slot-row'>No data</div>"
return
}

const resultSlot  = Number(bets[0].winSlot || bets[0].slot) || 0
const resultMulti = Number(bets[0].multi) || 0

const icon  = document.getElementById("roundResultIcon")
const multi = document.getElementById("roundResultMulti")

if(resultSlot){

let resultImg = "/assets/police/slot"+resultSlot+".png"

// EVENT X5 ALL
const first = bets[0]

if(first){

  if(first.event === "x5-all"){
    resultImg = "/assets/police/event-x5-all.png"
  }

  else if(first.event === "x45-all"){
    resultImg = "/assets/police/event-x45-all.png"
  }

}

icon.style.backgroundImage = "url('"+resultImg+"')"
multi.textContent = "x"+resultMulti

}else{

icon.style.backgroundImage = ""
multi.textContent = "?"

}

const slotMap = {}

bets.forEach(b=>{

const slot = Number(b.slot)
if(!slot) return

if(!slotMap[slot]){
slotMap[slot] = {bet:0,win:0}
}

slotMap[slot].bet += Number(b.bet) || 0
slotMap[slot].win += Number(b.win) || 0

})

Object.keys(slotMap)
.map(Number)
.sort((a,b)=>a-b)
.forEach(slot=>{

const item = slotMap[slot]

const row = document.createElement("div")
row.className = "round-slot-row"

if(item.win > 0){
row.classList.add("win")
}

row.innerHTML = `
<div class="round-slot-left">
<img src="/assets/police/slot${slot}.png" class="round-slot-icon">
</div>

<div class="round-slot-bet">
💎 ${item.bet}
</div>

<div class="round-slot-win">
${item.win > 0 ? "💎 "+item.win : "-"}
</div>
`

box.appendChild(row)

})

}

window.addEventListener("load",()=>{

  let progress = 0

  const loadingEl = document.getElementById("gameLoading")
  const bar = document.getElementById("loadingProgress")
  const text = document.getElementById("loadingPercent")

  const timer = setInterval(()=>{

    progress += Math.floor(Math.random()*8) + 6

    if(progress > 100) progress = 100

    bar.style.width = progress + "%"
    text.textContent = progress + "%"

    if(progress >= 100){

      clearInterval(timer)

      setTimeout(()=>{
        loadingEl.classList.add("hide")

        setTimeout(()=>{
          loadingEl.style.display = "none"
        },650)

      },350)

    }

  },110)

})



function scaleGame(){

  const baseWidth = 430
  const baseHeight = 870

  const screenW = window.visualViewport?.width || window.innerWidth
  const screenH = window.visualViewport?.height || window.innerHeight

  const scale = Math.min(
    screenW / baseWidth,
    screenH / baseHeight
  )

  const app = document.getElementById("app")

  app.style.transform =
    `translate(-50%, -50%) scale(${scale})`

}

window.addEventListener("resize", scaleGame)
window.addEventListener("load", scaleGame)

function renderSlotMiss(){

const colX5 = document.getElementById("slotColX5")
const colX45 = document.getElementById("slotColX45")

if(!wheel8History.length){
colX5.innerHTML="Loading..."
colX45.innerHTML=""
return
}

const miss=[0,0,0,0,0,0,0,0]

let missX5=0
let missX45=0

let lastX5Time="-"
let lastX45Time="-"


// SLOT MISS
for(let slot=1;slot<=8;slot++){

let count=0

for(let i=0;i<wheel8History.length;i++){

const r=wheel8History[i]

if(r.slot===slot) break

count++

}

miss[slot-1]=count

}


// EVENT MISS + LAST TIME
for(let i=0;i<wheel8History.length;i++){

const r = wheel8History[i]

if(r.event==="x5-all"){

lastX5Time = r.ts
? new Date(r.ts).toLocaleString("vi-VN",{
  day:"2-digit",
  month:"2-digit",
  year:"numeric",
  hour:"2-digit",
  minute:"2-digit"
})
: "-"

break
}

missX5++

}

for(let i=0;i<wheel8History.length;i++){

const r = wheel8History[i]

if(r.event==="x45-all"){

lastX45Time = r.ts
? new Date(r.ts).toLocaleString("vi-VN",{
  day:"2-digit",
  month:"2-digit",
  year:"numeric",
  hour:"2-digit",
  minute:"2-digit"
})
: "-"

break
}

missX45++

}


// SLOT GROUP
const x5Slots=[1,8,7,6]
const x45Slots=[2,3,4,5]


colX5.innerHTML=`

${x5Slots.map(slot=>slotBox(slot,miss[slot-1])).join("")}

${eventBox(
"event-x5-all.png",
missX5,
lastX5Time
)}

`


colX45.innerHTML=`

${x45Slots.map(slot=>slotBox(slot,miss[slot-1])).join("")}

${eventBox(
"event-x45-all.png",
missX45,
lastX45Time
)}

`

}


function slotBox(slot,miss){

return `
<div class="miss-box">

<img src="/assets/police/slot${slot}.png">

<div class="miss-count">${miss >= 500 ? "500+" : miss}</div>

<div class="miss-sub">round miss</div>

</div>
`

}


function eventBox(img,miss,time){

return `
<div class="miss-box event">

<img src="/assets/police/${img}">

<div class="miss-count">${miss >= 500 ? "500+" : miss}</div>

<div class="miss-sub">event miss</div>

<div class="event-last">

<div>LAST:</div>
<div>${time}</div>

</div>

</div>
`
}
