<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lucky Wheel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
margin:0;
background:#000;
font-family:system-ui;
color:#fff;
overflow:hidden;
}

/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
padding:12px 16px;
font-weight:700;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.1);
}

#timer{
color:#00ffd0;
}

/* WHEEL AREA */

.wheel{
width:340px;
height:340px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);
gap:6px;
}

/* SLOT */

.slot{

background:linear-gradient(
180deg,
rgba(255,255,255,.08),
rgba(0,0,0,.9)
);

border-radius:10px;

display:flex;
align-items:center;
justify-content:center;

font-weight:800;
font-size:18px;

box-shadow:
0 0 10px rgba(0,0,0,.7),
inset 0 1px 0 rgba(255,255,255,.1);

cursor:pointer;
}

.slot.active{
outline:3px solid #00ffd0;
box-shadow:
0 0 20px #00ffd0;
}

.slot.win{
background:#00ffd0;
color:#000;
}

/* GRID POSITION */

.s1{grid-area:1/2}
.s2{grid-area:1/3}

.s3{grid-area:2/4}
.s4{grid-area:3/4}

.s5{grid-area:4/3}
.s6{grid-area:4/2}

.s7{grid-area:3/1}
.s8{grid-area:2/1}

/* BET PANEL */

.bet-panel{
position:absolute;
bottom:0;
width:100%;
padding:14px;
background:#050505;
border-top:1px solid rgba(255,255,255,.1);
}

.bet-grid{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:8px;
margin-top:10px;
}

.bet-chip{

background:#111;
border-radius:12px;

display:flex;
align-items:center;
justify-content:center;

padding:10px;
font-weight:700;

cursor:pointer;
}

.bet-chip.active{
background:#00ffd0;
color:#000;
}

/* RESULT MODAL */

.result{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.7);
}

.result-box{
background:#111;
padding:30px;
border-radius:14px;
text-align:center;
}

.result-title{
font-size:22px;
margin-bottom:10px;
}

</style>
</head>

<body>

<div class="topbar">

<div>
⏱ <span id="timer">60</span>
</div>

<div>
💎 <span id="coins">0</span>
</div>

</div>


<!-- WHEEL -->

<div class="wheel">

<div class="slot s1" onclick="bet(1)">x2</div>
<div class="slot s2" onclick="bet(2)">x3</div>

<div class="slot s3" onclick="bet(3)">x5</div>
<div class="slot s4" onclick="bet(4)">x10</div>

<div class="slot s5" onclick="bet(5)">x0</div>
<div class="slot s6" onclick="bet(6)">x0</div>

<div class="slot s7" onclick="bet(7)">x0</div>
<div class="slot s8" onclick="bet(8)">x0</div>

</div>


<!-- BET PANEL -->

<div class="bet-panel">

Selected Bet:
<span id="selectedBet">0</span> 💎

<div class="bet-grid">

<div class="bet-chip" onclick="setBet(10)">10</div>
<div class="bet-chip" onclick="setBet(50)">50</div>
<div class="bet-chip" onclick="setBet(100)">100</div>
<div class="bet-chip" onclick="setBet(500)">500</div>
<div class="bet-chip" onclick="setBet(1000)">1000</div>
<div class="bet-chip" onclick="setBet(5000)">5000</div>

</div>

</div>


<!-- RESULT -->

<div id="resultModal" class="result">

<div class="result-box">

<div class="result-title">
RESULT
</div>

<div id="resultText"></div>

<button onclick="closeResult()">
OK
</button>

</div>

</div>


<script>

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

let currentBet = 0

const slots = document.querySelectorAll(".slot")

/* SET BET */

function setBet(v){

currentBet = v

document.getElementById("selectedBet").textContent=v

}

/* BET */

function bet(slot){

if(!currentBet) return

socket.emit("wheel8-bet",{
slot,
bet:currentBet
})

}

/* RESULT */

socket.on("wheel8-result",(data)=>{

const m = data.multiplier

slots.forEach(s=>s.classList.remove("win"))

slots.forEach(s=>{
if(s.textContent === "x"+m){
s.classList.add("win")
}
})

document.getElementById("resultText").textContent=
"Multiplier x"+m

document.getElementById("resultModal").style.display="flex"

})

/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent=t

})

/* COIN UPDATE */

socket.on("coin-update",(data)=>{

document.getElementById("coins").textContent=data.coins

})

function closeResult(){

document.getElementById("resultModal").style.display="none"

}

</script>

</body>
</html>
