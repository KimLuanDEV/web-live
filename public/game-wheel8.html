<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lucky Wheel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{

margin:0;

background:
url("/assets/police/bg-police-casino.jpg")
center / cover no-repeat fixed;

font-family:system-ui;
color:#fff;
overflow:hidden;

}
/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
padding:12px 16px;
font-weight:700;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.1);
}

#timer{
color:#00ffd0;
}

/* WHEEL AREA */

.wheel{
position:relative;
width:340px;
height:340px;
margin:20px auto;
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);
gap:6px;
top:160px;
}

.wheel-center{

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);

width:80px;
height:80px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:22px;

background:radial-gradient(
circle,
#00ffd0,
#00695c
);

color:#000;

box-shadow:
0 0 20px #00ffd0,
inset 0 0 10px rgba(255,255,255,.4);

z-index:10;
}
/* SLOT */

.slot{

background:linear-gradient(
180deg,
rgba(255,255,255,.08),
rgba(0,0,0,.9)
);

border-radius:50px;

display:flex;
align-items:center;
justify-content:center;

font-weight:800;
font-size:18px;

box-shadow:
0 0 10px rgba(0,0,0,.7),
inset 0 1px 0 rgba(255,255,255,.1);

cursor:pointer;
position:relative;
flex-direction:column;
}

.slot.active{
outline:3px solid #00ffd0;
box-shadow:
0 0 20px #00ffd0;
}

.slot.win{
background:#00ffd0;
color:#000;
}


.multi{
font-size:18px;
font-weight:800;
}

.pool{

position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);

font-size:13px;
font-weight:700;

color:#ffd700;

text-shadow:
0 0 5px #000,
0 0 10px #000;

}


/* GRID POSITION */

.s1{grid-area:1/2}
.s2{grid-area:1/3}

.s3{grid-area:2/4}
.s4{grid-area:3/4}

.s5{grid-area:4/3}
.s6{grid-area:4/2}

.s7{grid-area:3/1}
.s8{grid-area:2/1}

/* BET PANEL */

.bet-panel{

position:absolute;
bottom:-37px;
width:100%;
height:280px;
padding:0;

background:
url("/assets/police/police-panel.png")
center / cover no-repeat;

border-top:2px solid rgba(0,120,255,.6);

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
inset 0 2px 0 rgba(255,255,255,.15);

}


.bet-grid{
position: absolute;
display:flex;
justify-content:center;
gap:0px;
margin-top:2px;
bottom: 25px;
left: 15px;
}

.bet-chip{

width:100px;
height:70px;

border-radius:50%;

background:

url("/assets/police/police-chip.png")
center / contain no-repeat;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:14px;

color:#fff;

text-shadow:0 0 6px #000;

transition:.2s;

}


.bet-chip:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 8px #00aaff);

}


.bet-chip.active{
color:#fff;
}

/* RESULT MODAL */

.result{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.7);
}

.result-box{
background:#111;
padding:30px;
border-radius:14px;
text-align:center;
}

.result-title{
font-size:22px;
margin-bottom:10px;
}




.mybet{

position:absolute;

top:4px;
right:6px;

font-size:11px;
font-weight:800;

color:#00ffd0;

background:rgba(0,0,0,.6);

padding:2px 6px;

border-radius:6px;

}



.coin-bar{
position:absolute;
bottom:97px;
left:49%;
transform:translateX(-50%);
padding:9px 22px;
z-index: 1;
}



.bet-hitbox{

position:absolute;
width:100%;
height:100%;
left:0;
top:0;
}

.chip{

position:absolute;

width:95px;
height:95px;

cursor:pointer;

}

/* vị trí theo ảnh */

.c1{
left:84px;
bottom:67px;
width: 58px;
height: 50px;
}

.c2{
left:150px;
bottom:67px;
width: 58px;
height: 50px;
}

.c3{
left:221px;
bottom:67px;
width: 58px;
height: 50px;
}

.c4{
left:287px;
bottom:67px;
width: 58px;
height: 50px;
}

/* hover effect */

.chip:hover{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.12);
}



.police-header{

position:absolute;
top:0;
left:0;

width:100%;
height:140px;

background:
url("/assets/police/police-header.png")
center / cover no-repeat;

z-index:10;

}





</style>
</head>

<body>

<div class="police-header"></div>


<!-- WHEEL -->

<div class="wheel">


<div class="wheel-center">
<span id="timer"></span>
</div>

<div class="slot s1" onclick="bet(1)">
<div class="multi">x5</div>
<div class="pool" id="pool1">0</div>
<div class="mybet" id="mybet1">0</div>
</div>

<div class="slot s2" onclick="bet(2)">
<div class="multi">x10</div>
<div class="pool" id="pool2">0</div>
<div class="mybet" id="mybet2">0</div>
</div>

<div class="slot s3" onclick="bet(3)">
<div class="multi">x15</div>
<div class="pool" id="pool3">0</div>
<div class="mybet" id="mybet3">0</div>
</div>

<div class="slot s4" onclick="bet(4)">
<div class="multi">x25</div>
<div class="pool" id="pool4">0</div>
<div class="mybet" id="mybet4">0</div>
</div>

<div class="slot s5" onclick="bet(5)">
<div class="multi">x45</div>
<div class="pool" id="pool5">0</div>
<div class="mybet" id="mybet5">0</div>
</div>

<div class="slot s6" onclick="bet(6)">
<div class="multi">x5</div>
<div class="pool" id="pool6">0</div>
<div class="mybet" id="mybet6">0</div>
</div>

<div class="slot s7" onclick="bet(7)">
<div class="multi">x5</div>
<div class="pool" id="pool7">0</div>
<div class="mybet" id="mybet7">0</div>
</div>

<div class="slot s8" onclick="bet(8)">
<div class="multi">x5</div>
<div class="pool" id="pool8">0</div>
<div class="mybet" id="mybet8">0</div>
</div>

</div>


<!-- BET PANEL -->


<div class="coin-bar">
💎 <span id="coins"></span>
</div>


<div class="bet-panel">

<div class="bet-hitbox">

<div class="chip c1" onclick="setBet(10)"></div>
<div class="chip c2" onclick="setBet(50)"></div>
<div class="chip c3" onclick="setBet(100)"></div>
<div class="chip c4" onclick="setBet(1000)"></div>

</div>

</div>
<!-- RESULT -->

<div id="resultModal" class="result">

<div class="result-box">

<div class="result-title">
RESULT
</div>

<div id="resultText"></div>

<button onclick="closeResult()">
OK
</button>

</div>

</div>


<script>

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

let currentBet = 0


const myBets = [0,0,0,0,0,0,0,0]
const slots = document.querySelectorAll(".slot")

/* SET BET */

function setBet(v){

currentBet = v


document.querySelectorAll(".bet-chip")
.forEach(c=>c.classList.remove("active"))

event.target.classList.add("active")

}

/* BET */

function bet(slot){

if(!currentBet) return

socket.emit("wheel8-bet",{
slot,
bet:currentBet
})

// cộng cược cá nhân
myBets[slot-1] += currentBet

const el =
document.getElementById("mybet"+slot)

if(el){
el.textContent = myBets[slot-1]
}

}

/* RESULT */

socket.on("wheel8-result",(data)=>{

const slot = data.slot
const m = data.multiplier

// reset
slots.forEach(s=>s.classList.remove("win"))

// highlight đúng slot
const winSlot =
document.querySelector(".s"+slot)

if(winSlot){
winSlot.classList.add("win")
}

document.getElementById("resultText").textContent =
"Multiplier x"+m

document.getElementById("resultModal").style.display = "flex"

})

/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent=t

})

/* COIN UPDATE */

socket.on("coin-update",(data)=>{

document.getElementById("coins").textContent=data.coins

})

function closeResult(){

document.getElementById("resultModal").style.display="none"

}


socket.on("wheel8-pool-update",(pool)=>{

for(let i=0;i<8;i++){

const el = document.getElementById("pool"+(i+1))

if(el){
el.textContent = pool[i]
}

}

})


socket.on("wheel8-round-new",()=>{

for(let i=1;i<=8;i++){

const pool =
document.getElementById("pool"+i)

if(pool) pool.textContent = 0

const mybet =
document.getElementById("mybet"+i)

if(mybet) mybet.textContent = 0

myBets[i-1] = 0

}

})

</script>

</body>
</html>
