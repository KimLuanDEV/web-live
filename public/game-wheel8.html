<style>


#app{

  left:50%;
  top:50%;

  width:430px;
  height:870px;

  transform:translate(-50%,-50%);

  overflow:hidden;
}


html, body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
}



*{
-webkit-user-select:none;
-moz-user-select:none;
-ms-user-select:none;
user-select:none;
}

body{
margin:0;
font-family:system-ui;
color:#fff;
overflow:hidden;
  /* FIX NỀN TRẮNG */
background:#000;
position:fixed;
width:100%;

  display:flex;
  justify-content:center;
  align-items:center;


}

body::before{

content:"";
position:fixed;
inset:0;

background:
url("/assets/police/bg-police-casino.jpg")
center / cover no-repeat;

z-index:-1;

}
/* TOP BAR */

.topbar{
display:flex;
justify-content:space-between;
padding:12px 16px;
font-weight:700;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.1);
}



/* WHEEL AREA */

.wheel{

position:relative;

width:380px;
height:380px;

max-width:380px;
max-height:380px;

margin:160px auto 0;

}





.wheel-center{

position:absolute;
left:50%;
top:50%;

transform:translate(-50%,-50%);

width:120px;
height:120px;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:26px;

color:#ffffff;

background:
url("/assets/police/wheel-center-police.png")
center / contain no-repeat;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff;

z-index:2;

}


#timer{
top:50px;
font-size:20px;
font-weight:900;

color:#ffffff;

text-shadow:
0 0 10px #00aaff,
0 0 20px #00aaff,
0 0 40px #00aaff;

position:absolute;
}





/* SLOT */

.slot{

position:absolute;

width:95px;
height:95px;

left:189px;
top:188px;

margin-left:-47px;
margin-top:-47px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

background:
url("/assets/police/slot-bg-police.png")
center / contain no-repeat;

transition:.2s;

}




.slot-img{

width:72%;
height:72%;

object-fit:contain;

filter:
drop-shadow(0 0 6px #000)
drop-shadow(0 0 10px rgba(0,0,0,.6));

transition:.2s;

}

.slot.win{

box-shadow:
0 0 20px #00aaff,
0 0 40px #00aaff,
inset 0 0 10px #00aaff;

border-radius:50%;

}





.slot.win .slot-img{

filter:
drop-shadow(0 0 15px #00aaff)
drop-shadow(0 0 30px #00aaff)
drop-shadow(0 0 60px #00aaff);

transform:scale(1.15);

animation:policeWin 0.6s infinite alternate;

}

@keyframes policeWin{

0%{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.1);
}

100%{
filter:drop-shadow(0 0 40px #00aaff);
transform:scale(1.2);
}

}

.multi{
  position:absolute;

  top:-23px;
  right:-17px;

  width:70px;
  height:70px;

  pointer-events:none;

  z-index:3;
}

.multi img{
  width:100%;
  height:100%;
  object-fit:contain;

  filter:
    drop-shadow(0 0 6px #00aaff)
    drop-shadow(0 0 12px #00aaff);

  transition:.2s;
}


.slot:hover .multi img{
  transform:scale(1.1);
  filter:
    drop-shadow(0 0 10px #00cfff)
    drop-shadow(0 0 20px #00cfff);
}

.slot.win .multi img{
  filter:
    drop-shadow(0 0 10px #ffd700)
    drop-shadow(0 0 25px #ffcc00);

  transform:scale(1.15);
}



.pool{

display:none;
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);

font-size:13px;
font-weight:700;

color:#ffd700;

text-shadow:
0 0 5px #000,
0 0 10px #000;

}


/* GRID POSITION */

.s1{ transform:rotate(225deg) translate(140px) rotate(-225deg); }

.s2{ transform:rotate(270deg) translate(140px) rotate(-270deg); }

.s3{ transform:rotate(315deg) translate(140px) rotate(-315deg); }

.s4{ transform:rotate(0deg) translate(140px) rotate(0deg); }

.s5{ transform:rotate(45deg) translate(140px) rotate(-45deg); }

.s6{ transform:rotate(90deg) translate(140px) rotate(-90deg); }

.s7{ transform:rotate(135deg) translate(140px) rotate(-135deg); }

.s8{ transform:rotate(180deg) translate(140px) rotate(-180deg); }

/* BET PANEL */

.bet-panel{

position:absolute;
bottom:-20px;
width:100%;
height:280px;
padding:0;

background:
url("/assets/police/police-panel.png")
center / cover no-repeat;

border-top:2px solid rgba(0,120,255,.6);

box-shadow:
0 -10px 40px rgba(0,0,0,.8),
inset 0 2px 0 rgba(255,255,255,.15);
z-index: 1;
}




.bet-chip{

width:100px;
height:70px;

border-radius:50%;

background:

url("/assets/police/police-chip.png")
center / contain no-repeat;

display:flex;
align-items:center;
justify-content:center;

font-weight:900;
font-size:14px;

color:#fff;

text-shadow:0 0 6px #000;

transition:.2s;

}


.bet-chip:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 8px #00aaff);

}


.bet-chip.active{
color:#fff;
}

/* RESULT MODAL */

.result{

inset:0;

display:none;

background:rgba(0,0,0,.45);

align-items:flex-end;
justify-content:center;

z-index:10;

.result-box{
position: absolute;
bottom: -52px;
width:100%;
height:320px;

background:
url("/assets/police/result-frame-police.png")
center / contain no-repeat;

padding:70px 30px 40px;

text-align:center;

}

@keyframes sheetUp{

from{
transform:translateY(100%);
}

to{
transform:translateY(0);
}

}




.mybet{
  display:none;

  position:absolute;
  bottom:-1px;
  left:50%;
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:4px;

  padding:3px 8px;

  font-size:12px;
  font-weight:900;

  color:#fff;

  background:
    linear-gradient(

      rgba(0,20,40,.9),
      rgba(0,10,25,.95)

  border:1px solid rgba(0,170,255,.6);

  border-radius:999px;

  box-shadow:
    0 0 8px rgba(0,170,255,.6),

  backdrop-filter:blur(4px);

  z-index:4;
}

/* ICON */
.mybet img{

  height:14px;

    drop-shadow(0 0 4px #00cfff)

}

/* TEXT */
.mybet span{

}

/* WHEN BET > 0 → EFFECT */
.mybet.active{
  animation:betPulse .6s ease;
}

@keyframes betPulse{
  0%{ transform:translateX(-50%) scale(0.8); opacity:0 }
  100%{ transform:translateX(-50%) scale(1); opacity:1 }
}


.coin-bar{

position:absolute;
bottom:94px;
left:50%;
transform:translateX(-50%);

z-index:5;

}

.coin-box{

display:flex;
align-items:center;
gap:0px;

padding:8px 18px;



font-weight:900;
font-size:18px;

}

.coin-icon{

width:38px;
height:48px;

filter:
drop-shadow(0 0 6px #00aaff);

}

.coin-value{

color:#fff;

text-shadow:
0 0 6px #00aaff,
0 0 12px #00aaff;

letter-spacing:1px;

}



.bet-hitbox{

position:absolute;
width:100%;
height:100%;
left:0;
top:0;

.chip{

position:absolute;

width:95px;
height:95px;

cursor:pointer;

}

/* vị trí theo ảnh */

.c1{
left:84px;
bottom:61px;
width: 58px;
height: 50px;
}

.c2{
left:150px;
bottom:61px;
width: 58px;
height: 50px;
}

.c3{
left:221px;
bottom:61px;
width: 58px;
height: 50px;
}

.c4{
left:287px;
bottom:61px;
width: 58px;
height: 50px;
}

/* hover effect */

.chip:hover{
filter:drop-shadow(0 0 15px #00aaff);
transform:scale(1.12);
}







.result-img{
position: absolute;
top:102px;
left: 168px;
width:145px;
height:145px;
margin:10px auto;
display:block;

}




.sheet-handle{

width:46px;
height:5px;

border-radius:10px;

margin:0 auto 16px;

.result-grid{
position: absolute;
bottom: 97px;
left: 152px;

margin-top:40px;

.result-card{
flex:1;
padding:10px;

.result-card.win{
color:#00ff9d;
}

.result-value{

bottom: 36px;

font-weight:800;
}


#betClosedModal{

.bet-closed-bg{

url("/assets/police/police-alert.png")

text-shadow:
0 0 10px #00aaff,

.wheel-stand{

position:absolute;

left:50%;
bottom:-161px;

height:425px;

background:
url("/assets/police/wheel-stand.png")

.wheel-spokes{

url("/assets/police/wheel-spokes-police.png")

/* HISTORY */

.wheel-history{

position:absolute;
bottom: 160px;
left:50%;

height:60px;

flex-direction:column;
align-items:center;

z-index:3;

.history-list{

}

.history-item{

position:relative;
width:48px;
height:48px;

border-radius:30px;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(
180deg,
#0d1b2a,
#020617
);

border:1px solid rgba(0,170,255,.4);

box-shadow:
0 0 12px rgba(0,170,255,.5),

}



.history-item img{

.history-new{

position:absolute;

top:-6px;

#ff0033,
#ff6600

box-shadow:
0 0 6px #ff3300,
0 0 10px #ff3300;

}

@keyframes newPulse{

0%{

}

100%{
transform:scale(1.1);
}

}




.wheel-round{

position:absolute;
top:8px;
right:10px;

font-size:12px;
font-weight:700;

color:#fff;

background:rgba(0,0,0,0.5);

.bet-history-btn{

.history-img{

width:100%;

}


.history-hitbox{

width:77px;

}

.bet-history-btn img{

width:100%;
height:134%;

transition:.15s;

}

.bet-history-btn:hover img{

transform:scale(1.08);

filter:
drop-shadow(0 0 20px #00aaff);

}


/* FULLSCREEN HISTORY */

.history-modal{

position:fixed;
inset:0;

display:none;
flex-direction:column;

background:
linear-gradient(
180deg,
#020617,
#000000
);

z-index:50;

}

/* HEADER */

.history-header{

display:flex;
align-items:center;
justify-content:space-between;

padding:16px 20px;

border-bottom:1px solid rgba(0,170,255,.4);

}


.history-box{

width:320px;
max-height:420px;

border:2px solid #00aaff;

padding:20px;

0 0 20px #00aaff;

.history-title{

}

}

/* TABLE AREA */

.history-table{

}

/* HEADER ROW */

.history-head{

display:grid;

grid-template-columns:1fr 1fr 1fr 1fr;

text-align:center;

background:#001a33;

border-bottom:1px solid #00aaff;

}

/* BODY */

.history-body{

display:flex;
flex-direction:column;

}






.history-bets{

flex-direction:column;

}

/* ROW */

.history-row{

display:grid;

grid-template-columns:1fr 1fr 1fr 1fr;

padding:12px 0;

font-size:14px;

text-align:center;

border-bottom:1px solid rgba(255,255,255,.06);

transition:.15s;

}

.history-row:hover{

background:#0d1b2a;

}

/* WIN / LOSE */

.history-row.win{
color:#00ff9d;
font-weight:800;
}

.history-row.lose{

}

.history-close{

position:absolute;
top:14px;
right:16px;

background:#003a66;

border:none;

color:#fff;

font-weight:900;

padding:8px 14px;

border-radius:6px;

cursor:pointer;

}



.history-slot-icon{
width:26px;
height:26px;
object-fit:contain;
margin-right:8px;
}


.result-row{
background:#001a33;
border:1px solid #00aaff;
box-shadow:0 0 10px #00aaff;
font-weight:900;
}





/* ROUND DETAIL FULLSCREEN */

.round-result{

display:flex;
align-items:center;
justify-content:center;

gap:14px;

padding:16px;

border-bottom:1px solid rgba(0,170,255,.3);

}

.round-result-icon{

width:100px;
height:100px;

background-size:contain;
background-position:center;

filter:
drop-shadow(0 0 10px #00aaff);

}

.round-result-text{

0 0 10px #ffd700;

}

/* LIST */

.round-slot-row:hover{

.round-slot-left{

}

.exit-btn{

}

.exit-img{

}

drop-shadow(0 0 10px #00aaff);

}





/* ================= LOADING FULLSCREEN PRO ================= */

#gameLoading{
position:fixed;
inset:0;
z-index:99999;
overflow:hidden;
background:#000;
opacity:1;
}

.loading-full-bg{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;

transform:scale(1.03);
filter:
brightness(.72)
contrast(1.08)

}

.loading-overlay{
position:absolute;
inset:0;
background:
linear-gradient(
180deg,
rgba(0,0,0,.18) 0%,
rgba(0,10,25,.28) 35%,
rgba(0,0,0,.40) 100%
);
box-shadow:
inset 0 0 120px rgba(0,0,0,.65),
inset 0 -120px 160px rgba(0,0,0,.85);
}

.loading-ui{

}

.loading-brand{

}

.loading-progress-wrap{

.loading-progress-bar{

<div class="slot s1" onclick="bet(1)">

<div class="multi"><img src="/assets/police/multi-x10.png"></div>

  <img src="/assets/police/diamond-icon.png">
  <span>0</span>
</div>

<script>

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

let currentBet = 0
let highlightIndex = 1
let highlightLoop = null
let highlightSpeed = 1000
let isBetLocked = false
let resultShowing = false
let coins = 0
let wheelHistory = []

let myBetHistory = []

let currentRoundId = 0

let lastWinSlot = 0
let lastWinMulti = 0

let roundResults = {}


let lastBetSlot = 0
let lastBetValue = 0


const myBets = [0,0,0,0,0,0,0,0]
const slots = document.querySelectorAll(".slot")



function runHighlight(){

slots.forEach(s=>s.classList.remove("win"))

const slot = slots[highlightIndex-1]

if(slot){
slot.classList.add("win")
}

highlightIndex++

if(highlightIndex > 8){
highlightIndex = 1
}

}


function changeHighlightSpeed(speed){

highlightSpeed = speed

if(highlightLoop){

clearInterval(highlightLoop)

highlightLoop =
setInterval(runHighlight, highlightSpeed)

}

}



function startHighlightLoop(){

if(highlightLoop) return

highlightLoop = setInterval(runHighlight, highlightSpeed)

}


function stopHighlightLoop(){

clearInterval(highlightLoop)
highlightLoop = null

}

/* SET BET */

function setBet(v){

currentBet = v


document.querySelectorAll(".bet-chip")
.forEach(c=>c.classList.remove("active"))

event.target.classList.add("active")

}

/* BET */

function bet(slot){

if(!currentBet) return

const modal = document.getElementById("betClosedModal")
const text  = document.getElementById("betClosedText")

// 🔒 không đủ coin
if(coins < currentBet){

text.textContent = "NOT ENOUGH COINS"
modal.style.display = "flex"

setTimeout(()=> modal.style.display = "none",2000)

return
}

// 🔒 đã khóa cược
if(isBetLocked){

text.textContent = "BETTING CLOSED"
modal.style.display = "flex"

setTimeout(()=> modal.style.display = "none",2000)

return
}

// ✅ gửi cược (KHÔNG update UI ở đây)
socket.emit("wheel8-bet",{
  slot,
  bet:currentBet
})


// =========================
// 📜 LƯU HISTORY (OK giữ)
// =========================

let row = myBetHistory.find(r =>
r.round === currentRoundId &&
r.slot === slot
)

if(row){
  row.bet += currentBet
}else{
  myBetHistory.push({
    round: currentRoundId,
    slot: slot,
    bet: currentBet,
    win:0,
    multi:0
  })
}

// giữ tối đa
if(myBetHistory.length > 200){
  myBetHistory.pop()
}


// =========================
// 🧠 CHỈ LƯU PENDING
// =========================

lastBetSlot = slot
lastBetValue = currentBet

// ❌ KHÔNG update UI ở đây nữa

}
/* RESULT */

socket.on("wheel8-result",(data)=>{

const winSlots = data.slots || [data.slot]
const m = data.multiplier

// slot đại diện để hiển thị hình
const resultSlot = winSlots[0] || 1

lastWinSlot = resultSlot
lastWinMulti = m

roundResults[currentRoundId] = {
slot: resultSlot,
multi: m,
slots: winSlots
}

// cập nhật history
wheelHistory.unshift({
slot: resultSlot,
multi: m,
slots: winSlots,
event: data.event || null
})

wheelHistory = wheelHistory.slice(0,8)

renderHistory()

resultShowing = true

stopHighlightLoop()

// reset highlight
document.querySelectorAll(".slot")
.forEach(s=>s.classList.remove("win"))

// highlight tất cả slot thắng
winSlots.forEach(s=>{

const el = document.querySelector(".slot.s"+s)

if(el){

el.classList.add("win")

setTimeout(()=>{
el.classList.remove("win")
resultShowing = false
},5000)

}

})

// hình slot thắng
// hình kết quả

let resultImg = "/assets/police/slot"+resultSlot+".png"

// event 4 slot x5
if(winSlots.length === 4){

// event slot 1,6,7,8
if(winSlots.includes(1)){
resultImg = "/assets/police/event-x5-all.png"
}

// event slot 2,3,4,5
else{
resultImg = "/assets/police/event-x45-all.png"
}

}

document.getElementById("resultImg").src = resultImg

// tổng cược
const totalBet =
myBets.reduce((a,b)=>a+b,0)

// tổng tiền thắng (có thể nhiều slot)
let totalWin = 0

winSlots.forEach(s=>{

// multiplier theo slot
const slotMulti = [5,10,15,25,45,5,5,5][s-1]

totalWin += (myBets[s-1] || 0) * slotMulti

})

document.getElementById("resultTotalBet").textContent =
totalBet

document.getElementById("resultTotalWin").textContent =
totalWin

document.getElementById("resultModal").style.display = "flex"

setTimeout(()=>{
closeResult()
},5000)

// reload history
socket.emit("wheel8-get-my-history")


// =======================
// 🏆 TOP WINNERS UI
// =======================

const box = document.getElementById("topWinners")
box.innerHTML = ""

if(data.top && data.top.length){

  // đảm bảo luôn đúng thứ tự
  const top = data.top
    .sort((a,b)=>b.win - a.win)
    .slice(0,3)

  top.forEach((p,i)=>{

    const card = document.createElement("div")

    let cls = ""
    let rank = ""

    if(i===0){ cls="top1"; rank="🥇" }
    else if(i===1){ cls="top2"; rank="🥈" }
    else if(i===2){ cls="top3"; rank="🥉" }

    card.className = "top-card " + cls

    card.innerHTML = `
      <div class="top-rank">${rank}</div>
      <div class="top-name">???</div>
      <div class="top-win">+${p.win} 💎</div>
    `

    // 🔥 TOP 1 ở giữa
    if(i === 0){
      box.appendChild(card)
    }else{
      box.insertBefore(card, box.firstChild)
    }

  })

}

})
/* TIMER */

socket.on("wheel8-timer",(t)=>{

document.getElementById("timer").textContent = t

// khóa cược khi còn 5 giây
isBetLocked = (t <= 5)

if(isBetLocked){
slots.forEach(s=>s.classList.add("locked"))
}else{
slots.forEach(s=>s.classList.remove("locked"))
}


// reset tốc độ mỗi round
if(t >= 5){
highlightSpeed = 1000
}

// sau 5 giây mới bắt đầu highlight
if(!resultShowing && t <= 30 && t > 5){
startHighlightLoop()
}

// còn 5 giây thì tăng tốc
if(t <= 5){
changeHighlightSpeed(100)
}

})
/* COIN UPDATE */

socket.on("coin-update",(data)=>{

coins = data.coins

document.getElementById("coins").textContent = coins

})


socket.on("wheel8-history",(list)=>{

wheelHistory = list

renderHistory()

})



// 📜 USER BET HISTORY
socket.on("wheel8-my-history",(list)=>{

myBetHistory = []

list.forEach(r=>{

myBetHistory.push({
round: Number(r.roundId) || 0,
slot: Number(r.slot) || 0,
bet: Number(r.bet) || 0,
win: Number(r.win) || 0,
multi: Number(r.multiplier) || 0,
winSlot: Number(r.winSlot) || 0,
event: r.event || null,
time: Number(r.ts) || 0
})

})

// giữ 50 round
const rounds = {}

myBetHistory.forEach(b=>{

if(!rounds[b.round]){
rounds[b.round] = []
}

rounds[b.round].push(b)

})

const roundIds =
Object.keys(rounds)
.sort((a,b)=>{

const ta = rounds[a][0]?.time || 0
const tb = rounds[b][0]?.time || 0

return tb - ta

})
.slice(0,50)

const newList = []

roundIds.forEach(r=>{
newList.push(...rounds[r])
})

myBetHistory = newList

renderMyBetHistory()

})


function closeResult(){

document.getElementById("resultModal").style.display="none"

// reset bet sau khi xem kết quả
for(let i=1;i<=8;i++){

const el = document.getElementById("mybet"+i)

if(el){
el.textContent = 0
el.style.display = "none"
}

myBets[i-1] = 0

}

}


socket.on("wheel8-pool-update",(pool)=>{

for(let i=0;i<8;i++){

const el = document.getElementById("pool"+(i+1))

if(el){
el.textContent = pool[i]
}

}

})


socket.on("wheel8-round-new",(data)=>{

currentRoundId = data.roundId

isBetLocked = false
highlightSpeed = 1000

if(!resultShowing){
stopHighlightLoop()
}

for(let i=1;i<=8;i++){

const pool = document.getElementById("pool"+i)

if(pool){
pool.textContent = 0
pool.style.display = "none"
}

}



document.getElementById("roundId").textContent =
data.roundId

// đóng modal cảnh báo
document.getElementById("betClosedModal").style.display="none"

})


socket.on("wheel8-my-bets",(bets)=>{

for(let i=0;i<8;i++){

myBets[i] = bets[i]

const el = document.getElementById("mybet"+(i+1))

if(el){

const value = bets[i]

el.textContent = value

if(value > 0){
  el.style.display = "flex"
  el.classList.add("active")
}else{
  el.style.display = "none"
  el.classList.remove("active")
}


}

}

})



document.addEventListener("touchmove", function(e){

  const allowScroll = e.target.closest(
    ".history-table, .round-detail-list"
  )

  if(!allowScroll){
    e.preventDefault()
  }

}, { passive:false })


window.addEventListener("scroll", function(){
  window.scrollTo(0,0);
});


document.addEventListener("wheel", function(e){

if(e.ctrlKey){
e.preventDefault()
}

},{ passive:false })


// chặn bôi đen
document.addEventListener("selectstart", e => e.preventDefault())

// chặn chuột phải
document.addEventListener("contextmenu", e => e.preventDefault())

// chặn drag ảnh
document.addEventListener("dragstart", e => e.preventDefault())





function renderHistory(){

const box =
document.getElementById("wheelHistoryList")

box.innerHTML = ""

const list = wheelHistory.slice(0,8)

list.forEach((h,i)=>{

const div = document.createElement("div")
div.className = "history-item"

const img = document.createElement("img")

let imgSrc = "/assets/police/slot"+h.slot+".png"

// EVENT X5 ALL
if(h.event === "x5-all"){
  imgSrc = "/assets/police/event-x5-all.png"
}

// EVENT X45 ALL
else if(h.event === "x45-all"){
  imgSrc = "/assets/police/event-x45-all.png"
}

// fallback nếu server chưa gửi event
else if(Array.isArray(h.slots) && h.slots.length === 4){

  if(h.slots.includes(1)){
    imgSrc = "/assets/police/event-x5-all.png"
  }else{
    imgSrc = "/assets/police/event-x45-all.png"
  }

}

img.src = imgSrc

div.appendChild(img)

// badge NEW cho kết quả mới nhất
if(i === 0){

const badge = document.createElement("div")
badge.className = "history-new"
badge.textContent = "NEW"

div.appendChild(badge)

}

box.appendChild(div)

})

}



fetch("/api/wheel8-round")
.then(r=>r.json())
.then(d=>{
document.getElementById("roundId").textContent =
d.roundId
})



// 📜 LOAD USER BET HISTORY
socket.emit("wheel8-get-my-history")



socket.on("wheel8-bet-ok",()=>{

if(!lastBetSlot) return

myBets[lastBetSlot-1] += lastBetValue

const el = document.getElementById("mybet"+lastBetSlot)

if(el){

const value = myBets[lastBetSlot-1]

el.textContent = value
el.style.display = value > 0 ? "block" : "none"

}

// reset
lastBetSlot = 0
lastBetValue = 0

})


socket.on("wheel8-bet-fail",(data)=>{

const modal = document.getElementById("betClosedModal")
const text  = document.getElementById("betClosedText")

text.textContent = data.message || "BET FAILED"

modal.style.display = "flex"

setTimeout(()=> modal.style.display = "none",2000)

// reset
lastBetSlot = 0
lastBetValue = 0

})

function openMyBetHistory(){

document.getElementById("myBetHistoryModal")
.style.display="flex"

renderMyBetHistory()

}

function closeMyBetHistory(){

document.getElementById("myBetHistoryModal")
.style.display="none"

}


function renderMyBetHistory(){

const box =
document.getElementById("myBetHistoryList")

box.innerHTML=""

// gom theo round
const rounds = {}

myBetHistory.forEach(b=>{

if(!rounds[b.round]){
rounds[b.round] = []
}

rounds[b.round].push(b)

})

Object.entries(rounds)
.sort((a,b)=>{

const ta = a[1][0].time || 0
const tb = b[1][0].time || 0

return tb - ta

})
.forEach(([round,list])=>{



// tổng cược
const totalBet =
list.reduce((a,b)=>a + (b.bet || 0),0)

// tổng thắng
const totalWin =
list.reduce((a,b)=>a + (b.win || 0),0)


const ts = list[0].time || 0

const time = ts
? new Date(ts).toLocaleTimeString("vi-VN",{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
})
: "--"

const row = document.createElement("div")

row.className =
"history-row " + (totalWin > 0 ? "win":"lose")

row.innerHTML =
"<div>"+round+"</div>" +
"<div>"+time+"</div>" +
"<div>💎"+totalBet+"</div>" +
"<div>💎"+totalWin+"</div>"

row.onclick =
()=>openRoundDetailFromHistory(round)

box.appendChild(row)

})

}



function openRoundDetailFromHistory(round){

const modal = document.getElementById("roundDetailModal")
const box   = document.getElementById("roundDetailList")

modal.style.display = "flex"
box.innerHTML = ""

const bets = myBetHistory
.filter(b => Number(b.round) === Number(round))

if(!bets.length){
box.innerHTML = "<div class='round-slot-row'>No data</div>"
return
}

const resultSlot  = Number(bets[0].winSlot || bets[0].slot) || 0
const resultMulti = Number(bets[0].multi) || 0

const icon  = document.getElementById("roundResultIcon")
const multi = document.getElementById("roundResultMulti")

if(resultSlot){

let resultImg = "/assets/police/slot"+resultSlot+".png"

// EVENT X5 ALL
const first = bets[0]

if(first){

  if(first.event === "x5-all"){
    resultImg = "/assets/police/event-x5-all.png"
  }

  else if(first.event === "x45-all"){
    resultImg = "/assets/police/event-x45-all.png"
  }

}

icon.style.backgroundImage = "url('"+resultImg+"')"
multi.textContent = "x"+resultMulti

}else{

icon.style.backgroundImage = ""
multi.textContent = "?"

}

const slotMap = {}

bets.forEach(b=>{

const slot = Number(b.slot)
if(!slot) return

if(!slotMap[slot]){
slotMap[slot] = {bet:0,win:0}
}

slotMap[slot].bet += Number(b.bet) || 0
slotMap[slot].win += Number(b.win) || 0

})

Object.keys(slotMap)
.map(Number)
.sort((a,b)=>a-b)
.forEach(slot=>{

const item = slotMap[slot]

const row = document.createElement("div")
row.className = "round-slot-row"

if(item.win > 0){
row.classList.add("win")
}

row.innerHTML = `
<div class="round-slot-left">
<img src="/assets/police/slot${slot}.png" class="round-slot-icon">
</div>

<div class="round-slot-bet">
💎 ${item.bet}
</div>

<div class="round-slot-win">
${item.win > 0 ? "💎 "+item.win : "-"}
</div>
`

box.appendChild(row)

})

}



function closeRoundDetail(){

document.getElementById("roundDetailModal")
.style.display="none"

}


function leaveGame(){

window.location.href = "/invest.html"

}


window.addEventListener("load",()=>{

  let progress = 0

  const loadingEl = document.getElementById("gameLoading")
  const bar = document.getElementById("loadingProgress")
  const text = document.getElementById("loadingPercent")

  const timer = setInterval(()=>{

    progress += Math.floor(Math.random()*8) + 6

    if(progress > 100) progress = 100

    bar.style.width = progress + "%"
    text.textContent = progress + "%"

    if(progress >= 100){

      clearInterval(timer)

      setTimeout(()=>{
        loadingEl.classList.add("hide")

        setTimeout(()=>{
          loadingEl.style.display = "none"
        },650)

      },350)

    }

  },110)

})



function scaleGame(){

  const baseWidth = 430
  const baseHeight = 870

  const screenW = window.visualViewport?.width || window.innerWidth
  const screenH = window.visualViewport?.height || window.innerHeight

  const scale = Math.min(
    screenW / baseWidth,
    screenH / baseHeight
  )

  const app = document.getElementById("app")

  app.style.transform =
    `translate(-50%, -50%) scale(${scale})`

}

window.addEventListener("resize", scaleGame)
window.addEventListener("load", scaleGame)



</script>
