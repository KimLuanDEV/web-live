<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nông trại kim cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

.farm-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}

.animal-card{
  background:#111;
  border-radius:18px;
  padding:12px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,255,150,.15);
}

.animal-stage{
  font-size:42px;
  margin:10px 0;
}

.sell-btn{
  background:#00ff99;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<h2 style="text-align:center">🐣 Nông trại kim cương</h2>

<div class="farm-grid" id="farmGrid"></div>

<button onclick="buyEgg()">Mua trứng (100 💎)</button>






<script>

    const me = JSON.parse(localStorage.getItem("user_profile") || "{}");

const socket = io({
  auth:{ uid: me.uid }
});

let animals = [];

function render(){
  const grid = document.getElementById("farmGrid");
  grid.innerHTML="";

  animals.forEach((a,i)=>{

    let icon="🥚";
    if(a.stage===1) icon="🐥";
    if(a.stage===2) icon="🐔";

    grid.innerHTML+=`
      <div class="animal-card">
        <div class="animal-stage">${icon}</div>
        <div>Level: ${a.stage}</div>
        ${a.stage===2
          ? `<button class="sell-btn" onclick="sell(${i})">Bán +${a.value} 💎</button>`
          : `<div>Đang lớn...</div>`
        }
      </div>
    `;
  });
}

function buyEgg(){
  socket.emit("animal-buy-egg");
}

function sell(index){
  socket.emit("animal-sell", index);
}

socket.on("animal-update", data=>{
  animals = data;
  render();
});


</script>

<script src="/socket.io/socket.io.js"></script>
<script src="game-animal.js"></script>






</body>
</html>
