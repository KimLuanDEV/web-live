<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nông trại kim cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

.farm-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}

.animal-card{
  background:#111;
  border-radius:18px;
  padding:12px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,255,150,.15);
}

.animal-stage{
  font-size:42px;
  margin:10px 0;
}

.sell-btn{
  background:#00ff99;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}



/* ============================= */
/* 🐣 HEADER STYLE */
/* ============================= */

.farm-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:60px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.6);
  backdrop-filter:blur(10px);

  border-bottom:1px solid rgba(0,255,150,.2);
  box-shadow:0 0 25px rgba(0,255,150,.15);

  z-index:999;
}

.header-title{
  font-weight:bold;
  font-size:16px;
  letter-spacing:.5px;
}

.header-back{
  position:absolute;
  left:12px;

  width:36px;
  height:36px;

  border:none;
  border-radius:10px;

  background:rgba(0,255,150,.1);
  color:#00ff99;
  font-size:18px;
  cursor:pointer;

  box-shadow:0 0 10px rgba(0,255,150,.3);
}

.header-coins{
  position:absolute;
  right:12px;

  background:rgba(0,255,150,.1);
  padding:6px 12px;
  border-radius:20px;

  font-size:14px;
  font-weight:bold;

  box-shadow:0 0 15px rgba(0,255,150,.2);
}

/* đẩy nội dung xuống dưới header */
body{
  padding-top:70px;
}



</style>
</head>
<body>




<div class="farm-header">

  <button class="header-back" onclick="history.back()">←</button>

  <div class="header-title">
    🐣 Nông trại kim cương
  </div>

  <div class="header-coins">
    💎 <span id="coinValue">0</span>
  </div>

</div>


<div class="farm-grid" id="farmGrid"></div>

<button onclick="buyEgg()">Mua trứng (100 💎)</button>







<script src="/socket.io/socket.io.js"></script>
<script src="game-animal.js"></script>






</body>
</html>
