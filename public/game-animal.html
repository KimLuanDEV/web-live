<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Diamond Farm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">


<style>

body{
  margin:0;
  background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.85)),
    url("/assets/farm/farm_bg.png");
    
  color:#fff;
  font-family:sans-serif;

  padding-top: 0;
  padding-bottom:120px; /* chừa chỗ cho nút shop */

  min-height:100vh;
}


.farm-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
  margin-top: calc(var(--header-height) + 240px);
}

.animal-card{
  position:relative;
  background:rgba(0,255,150,.05);
  border-radius:18px;
  padding:12px;
  text-align:center;
  border:1px solid rgba(0,255,150,.15);
  backdrop-filter:blur(6px);

  box-shadow:
    0 0 20px rgba(0,255,150,.15);

  transition:0.25s ease;
}

.animal-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 30px rgba(0,255,150,.35);
}


.animal-stage{
  position:relative;
  width:100px;
  height:100px;
  margin:0 auto 6px;
  display:flex;
  align-items:flex-end;   /* 👈 Quan trọng */
  justify-content:center;
}



.sell-btn{
  background:#00ff99;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}



/* ============================= */
/* 🐣 HEADER STYLE */
/* ============================= */
.farm-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);

  background:linear-gradient(
    180deg,
    rgba(0,0,0,.95),
    rgba(0,0,0,.7)
  );

  backdrop-filter:blur(14px);

  border-bottom:1px solid rgba(0,255,150,.2);
  box-shadow:0 0 35px rgba(0,255,150,.25);

  z-index:999;

}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
}

.header-top{
  border-bottom:1px solid rgba(0,255,150,.15);
}

.header-bottom{
  padding-bottom:12px;
}

/* ===== Barn ===== */

.barn-info{
  font-weight:bold;
  font-size:16px;
  letter-spacing:.5px;
}

.upgrade-btn{
  background:rgba(0,255,150,.15);
  border:none;
  padding:6px 12px;
  border-radius:10px;
  color:#00ff99;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 12px rgba(0,255,150,.3);
}

/* ===== Coins ===== */

.coin-box{
  background:rgba(0,255,150,.1);
  padding:6px 14px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,255,150,.25);
}

/* ===== Slot ===== */

.slot-box{
  background:rgba(0,200,255,.1);
  padding:6px 14px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,200,255,.25);
}


.slot-box.full{
  background:rgba(255,0,0,.15);
  box-shadow:0 0 20px rgba(255,0,0,.6);
  animation:slotPulse 1s infinite;
}

@keyframes slotPulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.05); }
  100%{ transform:scale(1); }
}


.slot-box.warning{
  animation:slotShake .5s ease infinite;
}

@keyframes slotShake{
  0%{ transform:translateX(0); }
  25%{ transform:translateX(-2px); }
  50%{ transform:translateX(2px); }
  75%{ transform:translateX(-2px); }
  100%{ transform:translateX(0); }
}


/* Back button */

.header-back{
  background:rgba(0,255,150,.1);
  border:none;
  padding:6px 12px;
  border-radius:10px;
  color:#00ff99;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,150,.3);
}




.grow-bar{
  height:6px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  margin-top:8px;
  overflow:hidden;
}

.grow-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00ff99,#00ccff);
  transition:0.3s;
}


.buy-btn{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%);
  z-index:1500;

  padding:16px 34px;
  border:none;
  border-radius:40px;

  font-size:16px;
  font-weight:800;
  letter-spacing:.5px;

  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;

  box-shadow:
    0 10px 40px rgba(0,255,150,.5),
    0 0 25px rgba(0,255,150,.6);

  cursor:pointer;
  transition:.25s ease;
}

.buy-btn:hover{
  transform:translateX(-50%) translateY(-4px);
  box-shadow:
    0 15px 50px rgba(0,255,150,.8),
    0 0 40px rgba(0,255,150,1);
}

.buy-btn:active{
  transform:translateX(-50%) scale(.95);
}



/* ============================= */
/* 🛒 SHOP BOTTOM SHEET */
/* ============================= */

.shop-overlay{
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at bottom,
      rgba(0,255,150,.15),
      rgba(0,0,0,.8)
    );

  backdrop-filter:blur(8px);

  display:flex;
  align-items:flex-end;
  justify-content:center;

  z-index:2000;

  opacity:0;
  transition:opacity .3s ease;
}

.shop-overlay.show{
  opacity:1;
}


.shop-overlay.hidden{
  display:none;
}

.shop-sheet{
  width:100%;
  max-width:500px;
  max-height:80vh;
  overflow-y:auto;
  background:
    linear-gradient(
      180deg,
      rgba(20,20,20,.98),
      rgba(10,10,10,1)
    );

  border-top-left-radius:30px;
  border-top-right-radius:30px;

  padding:20px;
  padding-bottom:50px;

  border-top:1px solid rgba(0,255,150,.3);

  box-shadow:
    0 -20px 60px rgba(0,255,150,.35);

  transform:translateY(110%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}


.shop-overlay.show .shop-sheet{
  transform:translateY(0);
}

.sheet-handle{
  width:50px;
  height:6px;
  border-radius:10px;
  margin:0 auto 16px;

  background:linear-gradient(90deg,#00ff99,#00ccff);

  box-shadow:
    0 0 15px rgba(0,255,150,.8);
}



.shop-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:15px;
}

.shop-grid{
  display:grid;
  grid-auto-flow:column;
  grid-template-rows:repeat(2, auto);
  gap:12px;

  overflow-x:auto;
  overflow-y:hidden;

  padding-bottom:6px;

  scroll-snap-type:x mandatory;
}

.shop-grid::-webkit-scrollbar{
  display:none;
}


/* ===== SHOP CARD ===== */

.shop-item{
  min-width:140px;

  background:
    linear-gradient(
      180deg,
      rgba(0,255,150,.08),
      rgba(0,0,0,.6)
    );

  border-radius:20px;
  padding:12px;

  text-align:center;

  border:1px solid rgba(0,255,150,.25);

  box-shadow:
    0 0 20px rgba(0,255,150,.2);

  transition:.25s ease;
  cursor:pointer;

  scroll-snap-align:start;
}

.shop-item:hover{
  transform:translateY(-6px);
  box-shadow:
    0 0 35px rgba(0,255,150,.6);
}



/* IMAGE */
.shop-img{
  width:100%;
  height:80px;
  object-fit:contain;
  border-radius:12px;
  margin-bottom:6px;
}


/* NAME */
.shop-name{
  font-weight:bold;
  font-size:14px;
  margin-bottom:4px;
}

/* PRICE */
.shop-price{
  font-size:13px;
  font-weight:bold;
  color:#00ff99;
}


.egg-name{
  font-weight:bold;
  margin-bottom:4px;
}

.egg-rare{
  font-size:12px;
  opacity:.7;
}


/* ============================= */
/* 🌟 RARITY GLOW */
/* ============================= */

.animal-card.common{
  box-shadow:0 0 15px rgba(0,255,150,.2);
}

.animal-card.rare{
  box-shadow:0 0 20px rgba(255,215,0,.4);
}

.animal-card.epic{
  box-shadow:0 0 25px rgba(0,200,255,.5);
}

.animal-card.legendary{
  box-shadow:0 0 35px rgba(255,80,0,.7);
  animation:pulseLegend 1.5s infinite;
}

@keyframes pulseLegend{
  0%{ box-shadow:0 0 25px rgba(255,80,0,.6); }
  50%{ box-shadow:0 0 45px rgba(255,80,0,1); }
  100%{ box-shadow:0 0 25px rgba(255,80,0,.6); }
}

/* ============================= */
/* ⏱ Countdown */
/* ============================= */

.countdown{
  font-size:12px;
  margin-top:4px;
  opacity:.7;
}

/* ============================= */
/* 🐣 Hatch Animation */
/* ============================= */

@keyframes hatch{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.2); }
  100%{ transform:scale(1); }
}

.hatching{
  animation:hatch 0.6s ease;
}


/* ============================= */
/* 🥚 Almost Hatch Shake */
/* ============================= */

@keyframes eggShake{
  0%{ transform:translateX(0); }
  25%{ transform:translateX(-3px); }
  50%{ transform:translateX(3px); }
  75%{ transform:translateX(-3px); }
  100%{ transform:translateX(0); }
}

.almost-hatch{
  animation:eggShake 0.4s infinite;
}


/* ============================= */
/* 💥 Crack Animation */
/* ============================= */

/* ============================= */
/* 💥 REAL CRACK OVERLAY */
/* ============================= */


.crack-overlay{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  width:60px;   /* đúng bằng egg thường */
  height:60px;

  pointer-events:none;

  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;

  mix-blend-mode:screen;
  opacity:.9;

  z-index:3; /* cao hơn trứng */
}




@keyframes crackPulse{
  0%{ opacity:.6; }
  50%{ opacity:1; }
  100%{ opacity:.6; }
}



/* ============================= */
/* 💥 Sell Effect */
/* ============================= */

@keyframes sellPop{
  0%{ transform:scale(1); opacity:1; }
  100%{ transform:scale(0); opacity:0; }
}

.selling{
  animation:sellPop 0.4s forwards;
}

/* ============================= */
/* % TEXT */
/* ============================= */

.progress-text{
  font-size:11px;
  margin-top:4px;
}


/* ============================= */
/* 💎 CONFIRM MODAL */
/* ============================= */

.confirm-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.confirm-overlay.hidden{
  display:none;
}

.confirm-box{
  width:90%;
  max-width:320px;
  background:#111;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,255,150,.3);
  animation:popIn .2s ease;
}

@keyframes popIn{
  from{ transform:scale(.8); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

.confirm-title{
  font-weight:bold;
  margin-bottom:10px;
}

.confirm-content{
  font-size:14px;
  margin-bottom:18px;
  opacity:.8;
}

.confirm-actions{
  display:flex;
  gap:10px;
}

.confirm-actions button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.confirm-cancel{
  background:#222;
  color:#aaa;
}

.confirm-ok{
  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;
  box-shadow:0 0 20px rgba(0,255,150,.4);
}


.barn-info.flash{
  animation:barnFlash 0.6s ease;
}

@keyframes barnFlash{
  0%{
    box-shadow:0 0 10px rgba(0,255,150,.5);
    transform:scale(1);
  }
  50%{
    box-shadow:0 0 40px rgba(0,255,150,1);
    transform:scale(1.15);
  }
  100%{
    box-shadow:0 0 10px rgba(0,255,150,.5);
    transform:scale(1);
  }
}



/* 💎 Flying Coin */
.flying-coin{
  position:fixed;
  font-weight:bold;
  color:#00ff99;
  text-shadow:0 0 10px rgba(0,255,150,.8);
  pointer-events:none;
  z-index:5000;
  animation:flyCoin 0.8s ease forwards;
}

@keyframes flyCoin{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(var(--dx),var(--dy)) scale(.6);
    opacity:0;
  }
}

.farm-header.level-1{ background:linear-gradient(180deg,#001a12,#000); }
.farm-header.level-2{ background:linear-gradient(180deg,#001a30,#000); }
.farm-header.level-3{ background:linear-gradient(180deg,#200040,#000); }
.farm-header.level-4{ background:linear-gradient(180deg,#400000,#000); }


.slot-tooltip{
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  margin-top:6px;
  background:#111;
  padding:6px 10px;
  border-radius:10px;
  font-size:11px;
  box-shadow:0 0 15px rgba(255,0,0,.6);
  white-space:nowrap;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateX(-50%) translateY(-5px);}
  to{opacity:1; transform:translateX(-50%) translateY(0);}
}


.farm-header.legendary-glow{
  box-shadow:0 0 50px rgba(255,80,0,.9);
  animation:legendPulse 1.5s infinite;
}

@keyframes legendPulse{
  0%{ box-shadow:0 0 30px rgba(255,80,0,.7); }
  50%{ box-shadow:0 0 60px rgba(255,80,0,1); }
  100%{ box-shadow:0 0 30px rgba(255,80,0,.7); }
}


/* ============================= */
/* 🐔 HATCHED STYLE */
/* ============================= */

.animal-card.hatched{
  background:linear-gradient(
    180deg,
    rgba(0,255,150,.12),
    rgba(0,0,0,.4)
  );
  border:1px solid rgba(0,255,150,.4);
  box-shadow:0 0 35px rgba(0,255,150,.4);
}

.animal-stage.hatched-animal{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

/* Glow circle */
.hatch-glow{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:radial-gradient(
    circle,
    rgba(0,255,150,.5),
    transparent 70%
  );
  animation:glowPulse 1.5s infinite;
}

@keyframes glowPulse{
  0%{ transform:scale(1); opacity:.8; }
  50%{ transform:scale(1.2); opacity:1; }
  100%{ transform:scale(1); opacity:.8; }
}

/* READY badge */
.ready-badge{
  position:absolute;
  top:8px;
  right:8px;
  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;
  font-size:10px;
  padding:4px 8px;
  border-radius:20px;
  font-weight:bold;
  letter-spacing:.5px;
  box-shadow:0 0 12px rgba(0,255,150,.8);
  animation:readyPulse 1.2s infinite;
  z-index:5;
}

@keyframes readyPulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.08); }
  100%{ transform:scale(1); }
}


/* 💀 BROKEN BADGE */
.broken-badge{
  background:linear-gradient(90deg,#ff0000,#ff5500);
  color:#fff;
  box-shadow:0 0 15px rgba(255,0,0,.9);
  animation:brokenBadgePulse 1.2s infinite;
}

@keyframes brokenBadgePulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.1); }
  100%{ transform:scale(1); }
}



.animal-img{
  width:80px;
  height:80px;
  object-fit:contain;
  filter:drop-shadow(0 0 15px rgba(0,255,150,.6));
  animation:animalIdle 2s ease-in-out infinite;
}

@keyframes animalIdle{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
  100%{ transform:translateY(0); }
}



.animal-card.rare .animal-img{
  filter:drop-shadow(0 0 20px gold);
}

.animal-card.epic .animal-img{
  filter:drop-shadow(0 0 20px #00ccff);
}

.animal-card.legendary .animal-img{
  filter:drop-shadow(0 0 30px #ff5000);
}


.animal-card.mythic{
  box-shadow:0 0 40px rgba(255,0,255,.9);
  animation:mythicPulse 1.2s infinite;
}

@keyframes mythicPulse{
  0%{ box-shadow:0 0 30px rgba(255,0,255,.6); }
  50%{ box-shadow:0 0 70px rgba(255,0,255,1); }
  100%{ box-shadow:0 0 30px rgba(255,0,255,.6); }
}


/* ============================= */
/* 💀 BROKEN EGG STYLE */
/* ============================= */

.animal-card.broken{
  background:linear-gradient(
    180deg,
    rgba(255,0,0,.15),
    rgba(0,0,0,.6)
  );
  border:1px solid rgba(255,0,0,.6);
  box-shadow:0 0 35px rgba(255,0,0,.8);
  animation:brokenPulse 1.2s infinite;
}

@keyframes brokenPulse{
  0%{ box-shadow:0 0 25px rgba(255,0,0,.6); }
  50%{ box-shadow:0 0 60px rgba(255,0,0,1); }
  100%{ box-shadow:0 0 25px rgba(255,0,0,.6); }
}

.animal-card.broken .animal-img{
  filter:grayscale(100%) drop-shadow(0 0 20px red);
  animation:none;
}



/* ============================= */
/* 🪹 NEST STYLE */
/* ============================= */

.nest-wrapper{
  position:relative;
  width:100px;
  height:80px;  /* thấp hơn để nhìn đúng tỷ lệ */
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.nest-img{
  position:absolute;
  bottom:0;
  width:100px;
  height:auto;
  object-fit:contain;
  z-index:1;
  transform:translateY(30px);  /* 👈 đẩy lên */
}

.egg-on-nest{
  position:relative;
  width:60px;
  height:auto;
  z-index:2;
  transform:translateY(-11px);  /* 👈 đẩy lên */
}


@keyframes eggIdle{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-4px); }
  100%{ transform:translateY(0); }
}


.almost-hatch .nest-wrapper{
  animation:eggShake 0.4s infinite;
}





/* ================= MULTIPLIER HATCH ================= */

.egg-hatch-area{
  position:relative;
  margin:10px 0;
}

.egg-hatch-success{
  animation:hatchSuccess .6s ease;
}

@keyframes hatchSuccess{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.3); }
  100%{ transform:scale(1); }
}

.egg-hatch-broken{
  animation:hatchBroken .6s ease;
}

@keyframes hatchBroken{
  0%{ transform:rotate(0deg); }
  25%{ transform:rotate(-8deg); }
  50%{ transform:rotate(8deg); }
  75%{ transform:rotate(-8deg); }
  100%{ transform:rotate(0deg); }
}

.multi-glow{
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,255,150,.6),
    transparent 70%);
  top:10px;
  left:50%;
  transform:translateX(-50%);
  animation:glowPulse 1s infinite;
}



#eggCountdown.danger{
  color:#ff4444;
  animation:dangerPulse .8s infinite;
}

@keyframes dangerPulse{
  0%{ opacity:1; }
  50%{ opacity:.4; }
  100%{ opacity:1; }
}





/* ========================= */
/* 🥚 PRO EGG PANEL */
/* ========================= */

.egg-multiplier-box.pro{
  position:fixed;
  left:0;
  right:0;

  padding:
    18px
    max(20px, env(safe-area-inset-right))
    22px
    max(20px, env(safe-area-inset-left));

  background:
    linear-gradient(
      180deg,
      rgba(0,255,150,.18),
      rgba(0,0,0,.95)
    );

  border-bottom:1px solid rgba(0,255,150,.35);

  backdrop-filter:blur(18px);

  box-shadow:
    0 15px 40px rgba(0,255,150,.25),
    inset 0 0 40px rgba(0,255,150,.1);

  z-index:900;
}



/* ===== TOP BAR ===== */

.egg-top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.egg-title{
  font-size:15px;
  font-weight:700;
  opacity:.9;
}

.egg-timer{
  min-width:60px;
  text-align:center;
  padding:6px 12px;
  border-radius:20px;
  font-size:13px;
}


/* ===== CENTER ===== */

.egg-center{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.egg-center::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(0,255,150,.35),
      transparent 70%
    );

  filter:blur(25px);
  z-index:0;
}



.nest-wrapper.big{
  width:130px;
  height:90px;
  position:relative;
  z-index:2;
}

.egg-on-nest.big{
  width:85px;
  transform:translateY(-2px);
}


/* ===== MULTIPLIER ===== */

.egg-multi-result.pro{
  margin-top:6px;
  font-size:40px;
  font-weight:900;
  letter-spacing:3px;

  
  color:#00ffcc;

  text-shadow:
    0 0 8px #00ff99,
    0 0 20px rgba(0,255,150,.8);
}



/* ===== BET AREA ===== */

.egg-multi-bet.pro{
  margin-top:16px;

  display:flex;
  gap:12px;

  padding:0 6px;   /* 👈 tạo khoảng cách 2 bên */
}


.egg-multi-bet.pro input{
  flex:1;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(0,255,150,.3);
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:14px;
  outline:none;
}

.egg-multi-bet.pro input:focus{
  border-color:#00ff99;
  box-shadow:0 0 15px rgba(0,255,150,.6);
}

.egg-multi-bet.pro button{
  flex:1;
  height:58px;

  border:none;
  border-radius:20px;

  font-weight:900;
  font-size:15px;
  letter-spacing:1px;

  background:
    linear-gradient(90deg,#00ff99,#00ccff);

  color:#000;

  box-shadow:
    0 8px 30px rgba(0,255,150,.6),
    0 0 40px rgba(0,255,150,.6);

  transition:.25s ease;
}

.egg-multi-bet.pro button:hover{
  transform:translateY(-3px);
}

.egg-multi-bet.pro button:active{
  transform:scale(.96);
}


.egg-multi-bet.pro button.locked{
  opacity:.4;
  pointer-events:none;
}


.multi-pop{
  animation:multiPop .3s ease;
}

@keyframes multiPop{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.4); }
  100%{ transform:scale(1); }
}



/* ============================= */
/* 🥚 EGG BET SHEET */
/* ============================= */

.egg-bet-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:3000;
  transition:.3s;
}

.egg-bet-overlay.hidden{
  display:none;
}

.egg-bet-sheet{
  width:100%;
  max-width:500px;
  background:linear-gradient(
    180deg,
    rgba(20,20,20,.95),
    rgba(0,0,0,1)
  );
  border-top-left-radius:30px;
  border-top-right-radius:30px;
  padding:20px;
  padding-bottom:40px;
  border-top:1px solid rgba(0,255,150,.3);
  box-shadow:0 -20px 60px rgba(0,255,150,.4);
}

.egg-bet-title{
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.egg-bet-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.egg-bet-item{
  padding:12px;
  border-radius:14px;
  text-align:center;
  background:rgba(0,255,150,.08);
  border:1px solid rgba(0,255,150,.3);
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.egg-bet-item.active{
  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;
  box-shadow:0 0 20px rgba(0,255,150,.8);
}

.egg-bet-confirm{
  width:100%;
  height:50px;
  border:none;
  border-radius:16px;
  font-weight:bold;
  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;
  box-shadow:0 0 25px rgba(0,255,150,.5);
}


.egg-bet-sheet{
  transform:translateY(110%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}

.egg-bet-overlay.show .egg-bet-sheet{
  transform:translateY(0);
}


.egg-bet-item.disabled{
  opacity:.35;
  pointer-events:none;
  filter:grayscale(100%);
}


.egg-current-bet{
  flex:1;
  height:58px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(0,255,150,.25),
      rgba(0,0,0,.4)
    );

  border:1px solid rgba(0,255,150,.5);

  font-weight:700;

  box-shadow:
    inset 0 0 15px rgba(0,255,150,.3),
    0 0 25px rgba(0,255,150,.3);

  transition:.2s ease;
}

.egg-current-bet span{
  font-size:12px;
  opacity:.6;
}

.egg-current-bet strong{
  font-size:20px;
  color:#00ffcc;

  text-shadow:
    0 0 10px rgba(0,255,150,.9),
    0 0 20px rgba(0,255,150,.6);
}




/* ========================= */
/* 🥚 EGG TOP BAR PRO */
/* ========================= */

.egg-top-bar.pro{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 6px 14px;   /* 👈 thêm padding ngang */
  gap:12px;  

  border-bottom:1px solid rgba(0,255,150,.2);
  padding-left: max(6px, env(safe-area-inset-left));
  padding-right: max(6px, env(safe-area-inset-right));
}

/* LEFT */

.egg-title-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.egg-icon-glow{
  font-size:22px;
  width:38px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;

  background:radial-gradient(circle,
    rgba(0,255,150,.4),
    transparent 70%);

  box-shadow:
    0 0 15px rgba(0,255,150,.6),
    0 0 30px rgba(0,255,150,.3);

  animation:eggIconPulse 2s infinite;
}

@keyframes eggIconPulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.15); }
  100%{ transform:scale(1); }
}

.egg-title-text{
  font-size:16px;
  font-weight:800;
  letter-spacing:.5px;
  color:#00ffcc;
  text-shadow:0 0 10px rgba(0,255,150,.7);
}

.egg-sub{
  font-size:10px;
  opacity:.6;
  font-weight:500;
  letter-spacing:.5px;
  margin-top:2px;
}

/* RIGHT */

.egg-timer-wrap{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  
  min-width:85px;         /* 👈 giữ chiều rộng tối thiểu */
  flex-shrink:0;          /* 👈 không cho bị ép */
}

.timer-label{
  font-size:10px;
  opacity:.6;
  margin-bottom:2px;
  letter-spacing:1px;
}

.egg-timer{
  min-width:60px;
  padding:6px 14px;
  border-radius:30px;
  font-size:14px;
  font-weight:900;

  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;

  box-shadow:
    0 0 20px rgba(0,255,150,.8);

  transition:.2s ease;
}

/* 🔥 Danger state */

#eggCountdown.danger{
  background:linear-gradient(90deg,#ff0000,#ff5500);
  color:#fff;

  box-shadow:
    0 0 25px rgba(255,0,0,.9);

  animation:dangerPulse 0.8s infinite;
}

/* ========================= */
/* 🥚 EGG TOP BAR PRO END */
/* ========================= */



/* ============================= */
/* 📜 EGG HISTORY */
/* ============================= */

.egg-history-wrap{
  border-top:1px solid rgba(0,255,150,.2);
  margin-top: 15px;
  padding:0 16px;
}

.history-title{
  font-size:13px;
  opacity:.7;
  margin-bottom:6px;
  margin-top :5px;
}

.egg-history-bar{
  display:flex;
  gap:4px;
  overflow-x:auto;
  padding-bottom:2px;
}

.egg-history-bar::-webkit-scrollbar{
  display:none;
}

.egg-history-item{
  min-width:48px;
  height:36px;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
  font-size:13px;

  backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.1);

  transition:.2s ease;
}

/* LOSE */
.egg-history-item.lose{
  background:rgba(255,0,0,.15);
  color:#ff4444;
  box-shadow:0 0 12px rgba(255,0,0,.4);
}

/* SMALL WIN */
.egg-history-item.small{
  background:rgba(0,255,150,.15);
  color:#00ff99;
  box-shadow:0 0 12px rgba(0,255,150,.4);
}

/* BIG WIN */
.egg-history-item.big{
  background:rgba(0,200,255,.2);
  color:#00ccff;
  box-shadow:0 0 18px rgba(0,200,255,.7);
}

/* JACKPOT */
.egg-history-item.jackpot{
  background:linear-gradient(90deg,#ff00ff,#ff5000);
  color:#fff;
  box-shadow:0 0 25px rgba(255,0,150,1);
  animation:jackpotPulse 1s infinite;
}

@keyframes jackpotPulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.1); }
  100%{ transform:scale(1); }
}



</style>
</head>
<body>




<div class="farm-header">

  <!-- ===== TOP ROW ===== -->
  <div class="header-row header-top">

    <button class="header-back" onclick="history.back()">←</button>

    <div class="barn-info">
      🏕️ Barn Lv <span id="barnLevel">1</span>
    </div>

    <button class="upgrade-btn"
      onclick="upgradeBarn()">
      ⬆
    </button>

  </div>

  <!-- ===== BOTTOM ROW ===== -->
  <div class="header-row header-bottom">

    <div class="coin-box">
      💎 <span id="coinValue">0</span>
    </div>

    <div class="slot-box">
      🥚 <span id="slotCount">0</span> /
      <span id="slotMax">4</span>
    </div>

  </div>

</div>




<div class="egg-multiplier-box pro">

<div class="egg-top-bar pro">

  <div class="egg-title-wrap">
    <div class="egg-icon-glow">🥚</div>
    <div class="egg-title-text">
      Mystic Egg
      <div class="egg-sub">
        High Risk • High Reward
      </div>
    </div>
  </div>

  <div class="egg-timer-wrap">
    <div class="timer-label">
      NEXT HATCH
    </div>
    <div class="egg-timer" id="eggCountdown">
      60s
    </div>
  </div>

</div>


  <div class="egg-center">

    <div class="egg-hatch-area" id="eggHatchArea">

      <div class="nest-wrapper big">
        <img src="/assets/farm/nest.png" class="nest-img">
        <img src="/assets/eggs/egg1.png"
             class="egg-on-nest big"
             id="multiEggImg">
      </div>

    </div>

    <div class="egg-multi-result pro" id="eggResult">
      x ?
    </div>

  </div>


<div class="egg-multi-bet pro">

<div class="egg-current-bet" id="eggCurrentBet">
  <span>Current Bet</span>
  <strong>0 💎</strong>
</div>


  <button id="eggBetBtn" onclick="openEggBetSheet()">
    BUY
  </button>

  
</div>



<div class="egg-history-wrap">
  <div class="history-title">
  Round History
  </div>

  <div class="egg-history-bar" id="eggHistoryBar">
  </div>
</div>



</div>



<div class="farm-grid" id="farmGrid"></div>

<button class="buy-btn" onclick="openShop()">
  🛒 Open Shop
</button>






<!-- ================= SHOP BOTTOM SHEET ================= -->
<div class="shop-overlay hidden" id="shopOverlay">

  <div class="shop-sheet" id="shopSheet">

    <div class="sheet-handle"></div>

    <div class="shop-header">
      🛒 Egg Shop
      <button onclick="closeShop()">✕</button>
    </div>

    <div class="shop-grid" id="shopGrid"></div>

  </div>

</div>



<!-- ================= CONFIRM BUY ================= -->
<div class="confirm-overlay hidden" id="confirmOverlay">

  <div class="confirm-box">

    <div class="confirm-title">
      Confirm Purchase
    </div>

    <div class="confirm-content" id="confirmContent">
      Are you sure?
    </div>

    <div class="confirm-actions">
      <button class="confirm-cancel"
        onclick="closeConfirm()">
        Cancel
      </button>

      <button class="confirm-ok"
        onclick="confirmBuy()">
        Buy
      </button>
    </div>

  </div>

</div>



<!-- 🥚 EGG BET BOTTOM SHEET -->
<div class="egg-bet-overlay hidden" id="eggBetOverlay">

  <div class="egg-bet-sheet">

    <div class="sheet-handle"></div>

    <div class="egg-bet-title">
      Select Bet Amount
    </div>

    <div class="egg-bet-grid" id="eggBetGrid">
      <!-- render mốc cược -->
    </div>

    <button class="egg-bet-confirm"
            onclick="confirmEggBet()">
      CONFIRM
    </button>

  </div>

</div>



<script src="/socket.io/socket.io.js"></script>
<script src="game-animal.js"></script>
