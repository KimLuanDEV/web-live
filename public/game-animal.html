<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nông trại kim cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">


<style>
body{
  margin:0;
  background:
    radial-gradient(circle at top,
      #001a12,
      #000
    );
  color:#fff;
  font-family:sans-serif;
  padding-top:70px;
  min-height:100vh;
}


.farm-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}

.animal-card{
  position:relative;
  background:rgba(0,255,150,.05);
  border-radius:18px;
  padding:14px;
  text-align:center;
  border:1px solid rgba(0,255,150,.15);
  backdrop-filter:blur(6px);

  box-shadow:
    0 0 20px rgba(0,255,150,.15);

  transition:0.25s ease;
}

.animal-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 30px rgba(0,255,150,.35);
}


.animal-stage{
  position:relative;
  width:70px;
  height:70px;
  margin:10px auto;
}


.sell-btn{
  background:#00ff99;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}



/* ============================= */
/* 🐣 HEADER STYLE */
/* ============================= */
.farm-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);

  background:linear-gradient(
    180deg,
    rgba(0,0,0,.95),
    rgba(0,0,0,.7)
  );

  backdrop-filter:blur(14px);

  border-bottom:1px solid rgba(0,255,150,.2);
  box-shadow:0 0 35px rgba(0,255,150,.25);

  z-index:999;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
}

.header-top{
  border-bottom:1px solid rgba(0,255,150,.15);
}

.header-bottom{
  padding-bottom:12px;
}

/* ===== Barn ===== */

.barn-info{
  font-weight:bold;
  font-size:16px;
  letter-spacing:.5px;
}

.upgrade-btn{
  background:rgba(0,255,150,.15);
  border:none;
  padding:6px 12px;
  border-radius:10px;
  color:#00ff99;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 12px rgba(0,255,150,.3);
}

/* ===== Coins ===== */

.coin-box{
  background:rgba(0,255,150,.1);
  padding:6px 14px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,255,150,.25);
}

/* ===== Slot ===== */

.slot-box{
  background:rgba(0,200,255,.1);
  padding:6px 14px;
  border-radius:20px;
  font-weight:bold;
  box-shadow:0 0 15px rgba(0,200,255,.25);
}


.slot-box.full{
  background:rgba(255,0,0,.15);
  box-shadow:0 0 20px rgba(255,0,0,.6);
  animation:slotPulse 1s infinite;
}

@keyframes slotPulse{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.05); }
  100%{ transform:scale(1); }
}


.slot-box.warning{
  animation:slotShake .5s ease infinite;
}

@keyframes slotShake{
  0%{ transform:translateX(0); }
  25%{ transform:translateX(-2px); }
  50%{ transform:translateX(2px); }
  75%{ transform:translateX(-2px); }
  100%{ transform:translateX(0); }
}


/* Back button */

.header-back{
  background:rgba(0,255,150,.1);
  border:none;
  padding:6px 12px;
  border-radius:10px;
  color:#00ff99;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,150,.3);
}

/* Push content xuống */

body{
  padding-top:calc(110px + env(safe-area-inset-top));
}



.grow-bar{
  height:6px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  margin-top:8px;
  overflow:hidden;
}

.grow-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00ff99,#00ccff);
  transition:0.3s;
}


.buy-btn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);

  padding:14px 28px;
  border:none;
  border-radius:30px;

  font-size:15px;
  font-weight:bold;

  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;

  box-shadow:0 0 30px rgba(0,255,150,.4);
  cursor:pointer;
}



/* ============================= */
/* 🛒 SHOP BOTTOM SHEET */
/* ============================= */

.shop-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(4px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:2000;
}

.shop-overlay.hidden{
  display:none;
}

.shop-sheet{
  width:100%;
  max-width:500px;
  background:#111;
  border-top-left-radius:25px;
  border-top-right-radius:25px;
  padding:20px;
  padding-bottom:40px;

  transform:translateY(100%);
  transition:transform .3s ease;
}

.shop-overlay.show .shop-sheet{
  transform:translateY(0);
}

.sheet-handle{
  width:40px;
  height:5px;
  background:#444;
  border-radius:10px;
  margin:0 auto 12px;
}


.shop-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:15px;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* ===== SHOP CARD ===== */

.shop-item{
  background:rgba(255,255,255,.05);
  border-radius:18px;
  padding:12px;
  text-align:center;
  border:1px solid rgba(255,255,255,.08);
  transition:.25s ease;
  cursor:pointer;
}

.shop-item:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(0,255,150,.35);
}


/* IMAGE */
.shop-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:14px;
  margin-bottom:8px;
}

/* NAME */
.shop-name{
  font-weight:bold;
  font-size:14px;
  margin-bottom:4px;
}

/* PRICE */
.shop-price{
  font-size:13px;
  font-weight:bold;
  color:#00ff99;
}


.egg-name{
  font-weight:bold;
  margin-bottom:4px;
}

.egg-rare{
  font-size:12px;
  opacity:.7;
}


/* ============================= */
/* 🌟 RARITY GLOW */
/* ============================= */

.animal-card.common{
  box-shadow:0 0 15px rgba(0,255,150,.2);
}

.animal-card.rare{
  box-shadow:0 0 20px rgba(255,215,0,.4);
}

.animal-card.epic{
  box-shadow:0 0 25px rgba(0,200,255,.5);
}

.animal-card.legendary{
  box-shadow:0 0 35px rgba(255,80,0,.7);
  animation:pulseLegend 1.5s infinite;
}

@keyframes pulseLegend{
  0%{ box-shadow:0 0 25px rgba(255,80,0,.6); }
  50%{ box-shadow:0 0 45px rgba(255,80,0,1); }
  100%{ box-shadow:0 0 25px rgba(255,80,0,.6); }
}

/* ============================= */
/* ⏱ Countdown */
/* ============================= */

.countdown{
  font-size:12px;
  margin-top:4px;
  opacity:.7;
}

/* ============================= */
/* 🐣 Hatch Animation */
/* ============================= */

@keyframes hatch{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.2); }
  100%{ transform:scale(1); }
}

.hatching{
  animation:hatch 0.6s ease;
}


/* ============================= */
/* 🥚 Almost Hatch Shake */
/* ============================= */

@keyframes eggShake{
  0%{ transform:translateX(0); }
  25%{ transform:translateX(-3px); }
  50%{ transform:translateX(3px); }
  75%{ transform:translateX(-3px); }
  100%{ transform:translateX(0); }
}

.almost-hatch{
  animation:eggShake 0.4s infinite;
}


/* ============================= */
/* 💥 Crack Animation */
/* ============================= */

/* ============================= */
/* 💥 REAL CRACK OVERLAY */
/* ============================= */

.animal-stage{
  position:relative;
}

.crack-overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;

  animation:crackAppear .4s ease forwards;
}


@keyframes crackAppear{
  0%{
    opacity:0;
    transform:scale(.6);
  }
  60%{
    opacity:1;
    transform:scale(1.1);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}


/* ============================= */
/* 💥 Sell Effect */
/* ============================= */

@keyframes sellPop{
  0%{ transform:scale(1); opacity:1; }
  100%{ transform:scale(0); opacity:0; }
}

.selling{
  animation:sellPop 0.4s forwards;
}

/* ============================= */
/* % TEXT */
/* ============================= */

.progress-text{
  font-size:11px;
  margin-top:4px;
}


/* ============================= */
/* 💎 CONFIRM MODAL */
/* ============================= */

.confirm-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.confirm-overlay.hidden{
  display:none;
}

.confirm-box{
  width:90%;
  max-width:320px;
  background:#111;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,255,150,.3);
  animation:popIn .2s ease;
}

@keyframes popIn{
  from{ transform:scale(.8); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

.confirm-title{
  font-weight:bold;
  margin-bottom:10px;
}

.confirm-content{
  font-size:14px;
  margin-bottom:18px;
  opacity:.8;
}

.confirm-actions{
  display:flex;
  gap:10px;
}

.confirm-actions button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.confirm-cancel{
  background:#222;
  color:#aaa;
}

.confirm-ok{
  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;
  box-shadow:0 0 20px rgba(0,255,150,.4);
}


.barn-info.flash{
  animation:barnFlash 0.6s ease;
}

@keyframes barnFlash{
  0%{
    box-shadow:0 0 10px rgba(0,255,150,.5);
    transform:scale(1);
  }
  50%{
    box-shadow:0 0 40px rgba(0,255,150,1);
    transform:scale(1.15);
  }
  100%{
    box-shadow:0 0 10px rgba(0,255,150,.5);
    transform:scale(1);
  }
}



/* 💎 Flying Coin */
.flying-coin{
  position:fixed;
  font-weight:bold;
  color:#00ff99;
  text-shadow:0 0 10px rgba(0,255,150,.8);
  pointer-events:none;
  z-index:5000;
  animation:flyCoin 0.8s ease forwards;
}

@keyframes flyCoin{
  0%{
    transform:translate(0,0) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(var(--dx),var(--dy)) scale(.6);
    opacity:0;
  }
}

.farm-header.level-1{ background:linear-gradient(180deg,#001a12,#000); }
.farm-header.level-2{ background:linear-gradient(180deg,#001a30,#000); }
.farm-header.level-3{ background:linear-gradient(180deg,#200040,#000); }
.farm-header.level-4{ background:linear-gradient(180deg,#400000,#000); }


.slot-tooltip{
  position:absolute;
  top:100%;
  left:50%;
  transform:translateX(-50%);
  margin-top:6px;
  background:#111;
  padding:6px 10px;
  border-radius:10px;
  font-size:11px;
  box-shadow:0 0 15px rgba(255,0,0,.6);
  white-space:nowrap;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateX(-50%) translateY(-5px);}
  to{opacity:1; transform:translateX(-50%) translateY(0);}
}


.farm-header.legendary-glow{
  box-shadow:0 0 50px rgba(255,80,0,.9);
  animation:legendPulse 1.5s infinite;
}

@keyframes legendPulse{
  0%{ box-shadow:0 0 30px rgba(255,80,0,.7); }
  50%{ box-shadow:0 0 60px rgba(255,80,0,1); }
  100%{ box-shadow:0 0 30px rgba(255,80,0,.7); }
}


</style>
</head>
<body>




<div class="farm-header">

  <!-- ===== TOP ROW ===== -->
  <div class="header-row header-top">

    <button class="header-back" onclick="history.back()">←</button>

    <div class="barn-info">
      🏕️ Barn Lv <span id="barnLevel">1</span>
    </div>

    <button class="upgrade-btn"
      onclick="upgradeBarn()">
      ⬆
    </button>

  </div>

  <!-- ===== BOTTOM ROW ===== -->
  <div class="header-row header-bottom">

    <div class="coin-box">
      💎 <span id="coinValue">0</span>
    </div>

    <div class="slot-box">
      🥚 <span id="slotCount">0</span> /
      <span id="slotMax">4</span>
    </div>

  </div>

</div>



<div class="farm-grid" id="farmGrid"></div>

<button class="buy-btn" onclick="openShop()">
  🛒 Open Shop
</button>






<!-- ================= SHOP BOTTOM SHEET ================= -->
<div class="shop-overlay hidden" id="shopOverlay">

  <div class="shop-sheet" id="shopSheet">

    <div class="sheet-handle"></div>

    <div class="shop-header">
      🛒 Egg Shop
      <button onclick="closeShop()">✕</button>
    </div>

    <div class="shop-grid" id="shopGrid"></div>

  </div>

</div>



<!-- ================= CONFIRM BUY ================= -->
<div class="confirm-overlay hidden" id="confirmOverlay">

  <div class="confirm-box">

    <div class="confirm-title">
      Confirm Purchase
    </div>

    <div class="confirm-content" id="confirmContent">
      Are you sure?
    </div>

    <div class="confirm-actions">
      <button class="confirm-cancel"
        onclick="closeConfirm()">
        Cancel
      </button>

      <button class="confirm-ok"
        onclick="confirmBuy()">
        Buy
      </button>
    </div>

  </div>

</div>



<script src="/socket.io/socket.io.js"></script>
<script src="game-animal.js"></script>
</body>
</html>
