<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nông trại kim cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">


<style>
body{
  margin:0;
  background:
    radial-gradient(circle at top,
      #001a12,
      #000
    );
  color:#fff;
  font-family:sans-serif;
  padding-top:70px;
  min-height:100vh;
}


.farm-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:16px;
}

.animal-card{
  position:relative;
  background:rgba(0,255,150,.05);
  border-radius:18px;
  padding:14px;
  text-align:center;
  border:1px solid rgba(0,255,150,.15);
  backdrop-filter:blur(6px);

  box-shadow:
    0 0 20px rgba(0,255,150,.15);

  transition:0.25s ease;
}

.animal-card:hover{
  transform:translateY(-3px);
  box-shadow:
    0 0 30px rgba(0,255,150,.35);
}


.animal-stage{
  font-size:42px;
  margin:10px 0;
}

.sell-btn{
  background:#00ff99;
  border:none;
  padding:8px 14px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}



/* ============================= */
/* 🐣 HEADER STYLE */
/* ============================= */
.farm-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  height:60px;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.9),
      rgba(0,0,0,.6)
    );

  backdrop-filter:blur(12px);

  border-bottom:1px solid rgba(0,255,150,.2);
  box-shadow:
    0 0 35px rgba(0,255,150,.2);

  z-index:999;
}


.header-title{
  font-weight:bold;
  font-size:16px;
  letter-spacing:.5px;
}

.header-back{
  position:absolute;
  left:calc(12px + env(safe-area-inset-left));

  width:36px;
  height:36px;

  border:none;
  border-radius:10px;

  background:rgba(0,255,150,.1);
  color:#00ff99;
  font-size:18px;
  cursor:pointer;

  box-shadow:0 0 10px rgba(0,255,150,.3);
}


.header-coins{
  position:absolute;
  right:calc(12px + env(safe-area-inset-right));

  background:rgba(0,255,150,.1);
  padding:6px 12px;
  border-radius:20px;

  font-size:14px;
  font-weight:bold;

  box-shadow:0 0 15px rgba(0,255,150,.2);
}


/* đẩy nội dung xuống dưới header */
body{
  padding-top:calc(70px + env(safe-area-inset-top));
}



.grow-bar{
  height:6px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  margin-top:8px;
  overflow:hidden;
}

.grow-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00ff99,#00ccff);
  transition:0.3s;
}


.buy-btn{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);

  padding:14px 28px;
  border:none;
  border-radius:30px;

  font-size:15px;
  font-weight:bold;

  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;

  box-shadow:0 0 30px rgba(0,255,150,.4);
  cursor:pointer;
}


.shop-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2000;
}

.shop-overlay.hidden{
  display:none;
}

.shop-box{
  width:90%;
  max-width:400px;
  background:#111;
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 40px rgba(0,255,150,.25);
}

.shop-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:15px;
}

.shop-grid{
  display:grid;
  gap:12px;
}

.shop-item{
  padding:14px;
  border-radius:14px;
  background:rgba(0,255,150,.05);
  border:1px solid rgba(0,255,150,.15);
  cursor:pointer;
  transition:0.2s;
}

.shop-item:hover{
  transform:scale(1.02);
  box-shadow:0 0 25px rgba(0,255,150,.3);
}

.egg-name{
  font-weight:bold;
  margin-bottom:4px;
}

.egg-rare{
  font-size:12px;
  opacity:.7;
}


/* ============================= */
/* 🌟 RARITY GLOW */
/* ============================= */

.animal-card.common{
  box-shadow:0 0 15px rgba(0,255,150,.2);
}

.animal-card.rare{
  box-shadow:0 0 20px rgba(255,215,0,.4);
}

.animal-card.epic{
  box-shadow:0 0 25px rgba(0,200,255,.5);
}

.animal-card.legendary{
  box-shadow:0 0 35px rgba(255,80,0,.7);
  animation:pulseLegend 1.5s infinite;
}

@keyframes pulseLegend{
  0%{ box-shadow:0 0 25px rgba(255,80,0,.6); }
  50%{ box-shadow:0 0 45px rgba(255,80,0,1); }
  100%{ box-shadow:0 0 25px rgba(255,80,0,.6); }
}

/* ============================= */
/* ⏱ Countdown */
/* ============================= */

.countdown{
  font-size:12px;
  margin-top:4px;
  opacity:.7;
}

/* ============================= */
/* 🐣 Hatch Animation */
/* ============================= */

@keyframes hatch{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.2); }
  100%{ transform:scale(1); }
}

.hatching{
  animation:hatch 0.6s ease;
}

/* ============================= */
/* 💥 Sell Effect */
/* ============================= */

@keyframes sellPop{
  0%{ transform:scale(1); opacity:1; }
  100%{ transform:scale(0); opacity:0; }
}

.selling{
  animation:sellPop 0.4s forwards;
}

/* ============================= */
/* % TEXT */
/* ============================= */

.progress-text{
  font-size:11px;
  margin-top:4px;
}


/* ============================= */
/* 💎 CONFIRM MODAL */
/* ============================= */

.confirm-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3000;
}

.confirm-overlay.hidden{
  display:none;
}

.confirm-box{
  width:90%;
  max-width:320px;
  background:#111;
  border-radius:20px;
  padding:20px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,255,150,.3);
  animation:popIn .2s ease;
}

@keyframes popIn{
  from{ transform:scale(.8); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

.confirm-title{
  font-weight:bold;
  margin-bottom:10px;
}

.confirm-content{
  font-size:14px;
  margin-bottom:18px;
  opacity:.8;
}

.confirm-actions{
  display:flex;
  gap:10px;
}

.confirm-actions button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.confirm-cancel{
  background:#222;
  color:#aaa;
}

.confirm-ok{
  background:linear-gradient(90deg,#00ff99,#00ccff);
  color:#000;
  box-shadow:0 0 20px rgba(0,255,150,.4);
}


</style>
</head>
<body>




<div class="farm-header">

  <button class="header-back" onclick="history.back()">←</button>

<div class="header-title">
  🏰 Barn Lv <span id="barnLevel">1</span>
</div>

<button class="header-back"
  style="right:110px;left:auto"
  onclick="upgradeBarn()">
  ⬆
</button>


  <div class="header-coins">
    💎 <span id="coinValue">0</span>
  </div>

</div>


<div class="farm-grid" id="farmGrid"></div>

<button class="buy-btn" onclick="openShop()">
  🛒 Open Shop
</button>






<!-- ================= SHOP ================= -->
<div class="shop-overlay hidden" id="shopOverlay">

  <div class="shop-box">

    <div class="shop-header">
      🛒 Egg Shop
      <button onclick="closeShop()">✕</button>
    </div>

    <div class="shop-grid" id="shopGrid"></div>

  </div>

</div>


<!-- ================= CONFIRM BUY ================= -->
<div class="confirm-overlay hidden" id="confirmOverlay">

  <div class="confirm-box">

    <div class="confirm-title">
      Confirm Purchase
    </div>

    <div class="confirm-content" id="confirmContent">
      Are you sure?
    </div>

    <div class="confirm-actions">
      <button class="confirm-cancel"
        onclick="closeConfirm()">
        Cancel
      </button>

      <button class="confirm-ok"
        onclick="confirmBuy()">
        Buy
      </button>
    </div>

  </div>

</div>



<script src="/socket.io/socket.io.js"></script>
<script src="game-animal.js"></script>
</body>
</html>
