<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🧠 AI Tool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">

  <style>
    body{
      margin:0;
      background:#0e0e12;
      color:#fff;
      font-family:system-ui;
      display:flex;
      flex-direction:column;
      height:100vh;
    }

    header{
      height:52px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 12px;
      background:#111;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .back-btn{
      background:none;
      border:none;
      color:#fff;
      font-size:20px;
      cursor:pointer;
    }

    .title{
      font-weight:800;
      font-size:16px;
    }

    .chat-box{
      flex:1;
      padding:14px;
      overflow-y:auto;
    }

    .msg{
      max-width:80%;
      margin-bottom:12px;
      padding:10px 12px;
      border-radius:12px;
      line-height:1.5;
      font-size:14px;
    }

    .user{
      margin-left:auto;
      background:#2563eb;
    }

    .ai{
      background:#1f1f2b;
      border:1px solid rgba(255,255,255,.06);
    }

    .input-bar{
      display:flex;
      gap:8px;
      padding:10px;
      border-top:1px solid rgba(255,255,255,.08);
      background:#111;
    }

    .input-bar input{
      flex:1;
      padding:10px 12px;
      border-radius:10px;
      border:none;
      outline:none;
      font-size:14px;
    }

    .input-bar button{
      padding:0 16px;
      border-radius:10px;
      border:none;
      background:#22c55e;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">🧠 AI Tool</div>
</header>

<div class="chat-box" id="chatBox">
  <div class="msg ai">
    👋 Xin chào!  
    Bạn có thể hỏi **bất kỳ điều gì**: học tập, code, đầu tư, ý tưởng, đời sống…
  </div>
</div>

<div class="input-bar">
  <input id="userInput" placeholder="Nhập câu hỏi của bạn..." />
  <button onclick="send()">Gửi</button>
</div>

<script>
async function send(){
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  addMsg(text, "user");
  input.value = "";

  addMsg("⏳ AI đang suy nghĩ...", "ai", true);

  // 👉 GỌI API BACKEND (bước 3)
  const res = await fetch("/api/ai/ask",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ question:text })
  });

  const data = await res.json();
  removeTyping();
  addMsg(data.answer || "❌ AI chưa trả lời được", "ai");
}

function addMsg(text, role, typing=false){
  const box = document.getElementById("chatBox");
  const div = document.createElement("div");
  div.className = "msg " + role;
  if(typing) div.id="typing";
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeTyping(){
  const t = document.getElementById("typing");
  if(t) t.remove();
}
</script>

</body>
</html>
