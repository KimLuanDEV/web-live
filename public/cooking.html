<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🍳 Nấu ăn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

.cooking-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD */
.cook-card{
  position:relative;
  height:170px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background:#000;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
  transition:transform .15s ease, box-shadow .15s ease;
}

.cook-card:active{
  transform:scale(.97);
}

/* IMAGE */
.cook-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* OVERLAY */
.cook-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.75),
    rgba(0,0,0,.15),
    transparent
  );
}

/* INFO */
.cook-card .info{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:2;
  color:#fff;
}

.cook-card .title{
  font-weight:800;
  font-size:15px;
  line-height:1.2;
}

.cook-card .meta{
  display:flex;
  gap:6px;
  margin-top:6px;
  font-size:11px;
}

/* CHIP */
.cook-chip{
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);
  font-weight:700;
}


</style>

</head>

<body class="page-library">

<header class="simple-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">🍳 Nấu ăn</div>
</header>



<main class="library-container">
  <div id="cookingGrid" class="cooking-grid"></div>
</main>

<script src="/cooking.js"></script>




</body>
</html>
