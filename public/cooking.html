<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🍳 Nấu ăn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

.cooking-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.cook-card{
  background:#15151c;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
}

.cook-card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.cook-card .info{
  padding:10px;
}

.cook-card .title{
  font-weight:800;
  font-size:14px;
}

.cook-card .meta{
  font-size:12px;
  opacity:.7;
  margin-top:2px;
}


</style>

</head>

<body class="page-library">

<header class="simple-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">🍳 Nấu ăn</div>
</header>



<main class="library-container">
  <div id="cookingGrid" class="cooking-grid"></div>
</main>

<script src="/cooking.js"></script>




</body>
</html>
