<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🍳 Nấu ăn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

.cooking-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD DỌC */
.cook-card{
  position:relative;
  aspect-ratio:3/4;       /* 🔥 TỶ LỆ DỌC */
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background:#000;
  box-shadow:0 10px 28px rgba(0,0,0,.6);
  transition:transform .15s ease;
}

.cook-card:active{
  transform:scale(.97);
}

/* IMAGE */
.cook-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;     /* 🔥 HIỂN THỊ ĐẦY ĐỦ ẢNH */
  background:#000;        /* tránh viền trắng */
}


.cook-card::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.85),
    rgba(0,0,0,.25),
    transparent 55%
  );
}


.cook-card .info{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  z-index:2;
  color:#fff;
}

.cook-card .title{
  font-weight:800;
  font-size:14px;
  line-height:1.2;
}


.cook-card .meta{
  display:flex;
  gap:6px;
  margin-top:6px;
  font-size:11px;
}

/* CHIP */
.cook-chip{
  padding:4px 8px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(6px);
  font-weight:700;
}


/* ===== PAGE DARK ===== */
body.page-library{
  background:#000;
  color:#fff;
}

/* ===== HEADER ===== */
.cook-header{
  position:sticky;
  top:0;
  z-index:20;
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:12px;

  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.cook-back{
  width:36px;
  height:36px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:18px;
}

.cook-header-center{
  flex:1;
  text-align:center;
  line-height:1.1;
}

.cook-header-title{
  font-size:16px;
  font-weight:900;
}

.cook-header-sub{
  font-size:11px;
  opacity:.6;
}

.cook-header-right{
  width:36px;
  text-align:right;
  opacity:.7;
}

/* ===== CONTENT ===== */
.library-container{
  padding:14px;
}

/* ===== CARD ADJUST DARK ===== */
.cook-card{
  background:#000;
  box-shadow:0 10px 28px rgba(0,0,0,.6);
}

/* CHIP DARK */
.cook-chip{
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.18);
}



</style>

</head>

<body class="page-library">

<header class="cook-header">
  <button class="cook-back" onclick="history.back()">←</button>

  <div class="cook-header-center">
    <div class="cook-header-title">Nấu ăn</div>
    <div class="cook-header-sub">Công thức · Cook Mode</div>
  </div>

  <div class="cook-header-right">🍳</div>
</header>




<main class="library-container">
  <div id="cookingGrid" class="cooking-grid"></div>
</main>

<script src="/cooking.js"></script>




</body>
</html>
