<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🎙 Phiên dịch giọng nói</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">




  <style>

    .voice-translate{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:22px;
  margin-top:20px;
}

/* 🎧 Waveform */
.wave-box{
  width:100%;
  max-width:320px;
  padding:20px;
  border-radius:16px;
  background:#0f0f0f;
  text-align:center;
}

.wave{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  height:60px;
  gap:6px;
  margin-bottom:10px;
}

.wave span{
  width:6px;
  height:14px;
  background:#4fa3ff;
  border-radius:4px;
  opacity:.4;
}

/* 🔥 active animation */
.wave.active span{
  animation: waveAnim 1s infinite ease-in-out;
}
.wave.active span:nth-child(odd){
  animation-delay:.2s;
}

@keyframes waveAnim{
  0%{height:10px;opacity:.3}
  50%{height:52px;opacity:1}
  100%{height:10px;opacity:.3}
}

.wave-text{
  font-size:13px;
  opacity:.6;
}

/* 🎙 Mic button */
.mic-wrap{
  display:flex;
  justify-content:center;
}

.mic-btn{
  width:86px;
  height:86px;
  border-radius:50%;
  border:none;
  font-size:34px;
  background:linear-gradient(135deg,#ff4f4f,#ff8f4f);
  color:#fff;
  box-shadow:0 0 0 rgba(255,79,79,.6);
}

.mic-btn.recording{
  animation: pulse 1.2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,79,79,.6)}
  70%{box-shadow:0 0 0 22px rgba(255,79,79,0)}
  100%{box-shadow:0 0 0 0 rgba(255,79,79,0)}
}

/* 🌍 Language */
.lang-box{
  display:flex;
  align-items:center;
  gap:12px;
  opacity:.8;
}

.lang{
  padding:6px 12px;
  border-radius:10px;
  background:#151515;
  font-size:14px;
}

.lang-arrow{
  opacity:.5;
}



/* 📝 Live text */
.live-text-box{
  width:100%;
  max-width:360px;
  background:#111;
  border-radius:14px;
  padding:14px;
}

.live-label{
  font-size:12px;
  opacity:.6;
  margin-bottom:6px;
}

.live-text{
  font-size:15px;
  min-height:38px;
  line-height:1.4;
}

/* 📜 History */
.history-box{
  width:100%;
  max-width:360px;
  background:#0c0c0c;
  border-radius:14px;
  padding:14px;
}

.history-label{
  font-size:12px;
  opacity:.6;
  margin-bottom:8px;
}

.history-list{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:220px;
  overflow:auto;
}

.history-item{
  background:#161616;
  border-radius:10px;
  padding:10px 12px;
  font-size:14px;
  line-height:1.4;
}

.history-empty{
  opacity:.4;
  font-size:13px;
}

.history-en{
  margin-top:6px;
  font-size:13px;
  opacity:.75;
  color:#9fd0ff;
  border-left:2px solid #2b6cff;
  padding-left:8px;
}


.history-en{
  cursor:pointer;
  transition:.15s;
}

.history-en:active{
  opacity:.6;
  transform:scale(.98);
}


.history-zh{
  margin-top:6px;
  font-size:13px;
  opacity:.75;
  color:#ffd28a;
  border-left:2px solid #ff9800;
  padding-left:8px;
  cursor:pointer;
  transition:.15s;
}

.history-zh:active{
  opacity:.6;
  transform:scale(.98);
}


.input-box{
  width:100%;
  max-width:360px;
  background:#0f0f0f;
  border-radius:14px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

#manualInput{
  width:100%;
  background:#151515;
  border:none;
  border-radius:10px;
  padding:10px;
  color:#fff;
  font-size:14px;
  resize:none;
  outline:none;
}

#btnTranslateText{
  padding:10px;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg,#4fa3ff,#6a5cff);
  color:#fff;
  font-weight:600;
}



  </style>
</head>

<body>

<script src="/guard.js"></script>

<div class="page-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="page-title">🎙 Phiên dịch giọng nói</div>
</div>



<div class="container voice-translate">

  <!-- 🎧 WAVEFORM -->
  <div class="wave-box" id="waveBox">
    <div class="wave">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="wave-text" id="waveText">Nhấn để bắt đầu thu âm</div>
  </div>

  <!-- 🎙 MIC BUTTON -->
  <div class="mic-wrap">
    <button class="mic-btn" id="micBtn">
      🎙
    </button>
  </div>

  <!-- 🌍 LANGUAGE (UI ONLY) -->
<div class="lang-box">
  <div class="lang" id="srcLangLabel">🇻🇳 Tiếng Việt</div>

  <div class="lang-arrow" id="btnSwapLang" style="cursor:pointer">
    🔁
  </div>

  <div class="lang">🌍 EN / 中文</div>
</div>


</div>


<!-- 📝 LIVE TEXT -->
<div class="live-text-box">
  <div class="live-label">🎧 Đang nhận giọng nói</div>
  <div class="live-text" id="liveText">...</div>
</div>


<!-- ✍️ MANUAL INPUT -->
<div class="input-box">
  <textarea id="manualInput"
    placeholder="✍️ Nhập nội dung cần dịch..."
    rows="3"></textarea>

  <button id="btnTranslateText">
    🌍 Dịch văn bản
  </button>
</div>



<!-- 📜 HISTORY -->
<div class="history-box">
  <div class="history-label">📜 Lịch sử câu nói</div>
  <div class="history-list" id="historyList">
    <div class="history-empty">Chưa có câu nào</div>
  </div>
</div>






<script>
const micBtn   = document.getElementById("micBtn");
const wave     = document.querySelector(".wave");
const waveText = document.getElementById("waveText");
const liveTextEl  = document.getElementById("liveText");
const historyList = document.getElementById("historyList");
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);




let recognition;
let recording = false;


let sourceLang = "vi"; // vi | en | zh

const srcLangLabel = document.getElementById("srcLangLabel");
const btnSwapLang  = document.getElementById("btnSwapLang");

function updateSourceLang(){
  if (!recognition) return;

  if (sourceLang === "vi") {
    srcLangLabel.textContent = "🇻🇳 Tiếng Việt";
    recognition.lang = "vi-VN";
  }
  else if (sourceLang === "en") {
    srcLangLabel.textContent = "🇺🇸 English";
    recognition.lang = "en-US";
  }
  else if (sourceLang === "zh") {
    srcLangLabel.textContent = "🇨🇳 中文";
    recognition.lang = "zh-CN";
  }
}



// ✅ CHECK BROWSER SUPPORT
const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  waveText.textContent = "❌ Trình duyệt không hỗ trợ thu giọng nói";
  micBtn.disabled = true;
} else {

  recognition = new SpeechRecognition();
  recognition.lang = "vi-VN";      // 🌍 ngôn ngữ nguồn
  updateSourceLang();


btnSwapLang.onclick = () => {
  // xoay vòng: vi → en → zh → vi
  sourceLang =
    sourceLang === "vi" ? "en" :
    sourceLang === "en" ? "zh" :
    "vi";

  // nếu đang thu mic → restart để áp dụng ngôn ngữ mới
  if (recording) {
    try { recognition.stop(); } catch(e){}
    setTimeout(() => {
      updateSourceLang();
      try { recognition.start(); } catch(e){}
    }, 300);
  } else {
    updateSourceLang();
  }
};



recognition.continuous = !isMobile;   // mobile: false, PC: true
recognition.interimResults = true;
recognition.maxAlternatives = 1;      // 🔥 giảm nhiễu


  recognition.onstart = () => {
    recording = true;
    micBtn.classList.add("recording");
    wave.classList.add("active");
    waveText.textContent = "🎧 Đang nghe giọng nói...";
  };

recognition.onend = () => {
  micBtn.classList.remove("recording");
  wave.classList.remove("active");
  waveText.textContent = "⏹ Đã dừng thu âm";

  // 🔁 MOBILE: tự restart để tăng độ chính xác
  if (recording && isMobile) {
    setTimeout(() => {
      try {
        recognition.start();
      } catch (e) {}
    }, 300);
  }
};




  recognition.onerror = (e) => {
    console.error("Speech error:", e);
    waveText.textContent = "⚠️ Lỗi microphone hoặc quyền truy cập";
  };



async function translateText(text, targetLang){
  try{
    const url =
      "https://translate.googleapis.com/translate_a/single" +
      `?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=` +
      encodeURIComponent(text);

    const res = await fetch(url);
    const data = await res.json();

    return data[0].map(x => x[0]).join("");
  }catch(e){
    console.error("Translate failed", e);
    return "";
  }
}




function speakEN(text){
  if (!window.speechSynthesis) {
    alert("Trình duyệt không hỗ trợ phát giọng nói");
    return;
  }

  // dừng giọng đang phát
  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 1;    // tốc độ
  utter.pitch = 1;   // cao độ

  // 🔍 chọn giọng EN tốt nhất
  const voices = speechSynthesis.getVoices();
  const enVoice =
    voices.find(v => v.lang === "en-US" && /female|woman/i.test(v.name)) ||
    voices.find(v => v.lang === "en-US") ||
    voices[0];

  if (enVoice) utter.voice = enVoice;

  speechSynthesis.speak(utter);
}



function speakZH(text){
  if (!window.speechSynthesis) {
    alert("Trình duyệt không hỗ trợ phát giọng nói");
    return;
  }

  speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "zh-CN";
  utter.rate = 1;
  utter.pitch = 1;

  const voices = speechSynthesis.getVoices();
  const zhVoice =
    voices.find(v => v.lang === "zh-CN") ||
    voices.find(v => v.lang.startsWith("zh")) ||
    voices[0];

  if (zhVoice) utter.voice = zhVoice;

  speechSynthesis.speak(utter);
}





const manualInput = document.getElementById("manualInput");
const btnTranslateText = document.getElementById("btnTranslateText");

btnTranslateText.onclick = async () => {
  const text = manualInput.value.trim();
  if (!text) return;

  manualInput.value = "";

  // xoá placeholder
  historyList.querySelector(".history-empty")?.remove();

  const div = document.createElement("div");
  div.className = "history-item";

  // VN
  const vn = document.createElement("div");
  vn.textContent = text;

  // EN
  const en = document.createElement("div");
  en.className = "history-en";
  en.textContent = "⏳ Translating EN...";

  // ZH
  const zh = document.createElement("div");
  zh.className = "history-zh";
  zh.textContent = "⏳ Translating 中文...";

  div.appendChild(vn);
  div.appendChild(en);
  div.appendChild(zh);
  historyList.prepend(div);

// 🇺🇸 EN
translateText(text, "en").then(result => {
  if (result) {
    en.textContent = "🇺🇸 " + result;
    en.onclick = () => speakEN(result);
  } else {
    en.textContent = "⚠️ Không dịch được EN";
  }
});

// 🇨🇳 ZH
translateText(text, "zh-CN").then(result => {
  if (result) {
    zh.textContent = "🇨🇳 " + result;
    zh.onclick = () => speakZH(result);
  } else {
    zh.textContent = "⚠️ Không dịch được 中文";
  }
});

};



recognition.onresult = (event) => {
  let interimText = "";
  let finalText = "";

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const text = event.results[i][0].transcript.trim();

    if (event.results[i].isFinal) {
      finalText += text;
    } else {
      interimText += text;
    }
  }

  // 🟢 TEXT ĐANG NÓI
if (interimText && interimText.length > 3) {
  liveTextEl.textContent = interimText;
}


  // ✅ CÂU HOÀN CHỈNH → LƯU LỊCH SỬ
  if (finalText) {
    liveTextEl.textContent = "...";

    // xoá placeholder
    historyList.querySelector(".history-empty")?.remove();

const div = document.createElement("div");
div.className = "history-item";

// text gốc
const vn = document.createElement("div");
vn.textContent = finalText;

// placeholder EN
const en = document.createElement("div");
en.className = "history-en";
en.textContent = "⏳ Translating EN...";

const zh = document.createElement("div");
zh.className = "history-zh";
zh.textContent = "⏳ Translating 中文...";

div.appendChild(vn);
div.appendChild(en);
div.appendChild(zh);
historyList.prepend(div);


// 🇺🇸 ENGLISH
translateText(finalText, "en").then(result => {
  if (result) {
    en.textContent = "🇺🇸 " + result;
    en.onclick = () => speakEN(result);
  } else {
    en.textContent = "⚠️ Không dịch được EN";
  }
});

// 🇨🇳 CHINESE
translateText(finalText, "zh-CN").then(result => {
  if (result) {
    zh.textContent = "🇨🇳 " + result;
    zh.onclick = () => speakZH(result);
  } else {
    zh.textContent = "⚠️ Không dịch được 中文";
  }
});





if (isMobile && finalText) {
  try {
    recognition.stop();
  } catch(e){}
}


  }
};

}



// 🎙 MIC BUTTON CLICK
micBtn.onclick = () => {
  if (!recognition) return;

if (!recording) {
  recording = true;
  recognition.start();
} else {
  recording = false;
  recognition.stop();
}


};
</script>



</body>
</html>
