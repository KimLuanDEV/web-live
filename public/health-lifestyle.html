<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🏃‍♂️ Lối sống</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">

<style>
body{
  background:#0e0e12;
  color:#fff;
}

/* ===== HEADER ===== */
.health-header{
  position:sticky;
  top:0;
  z-index:50;
  height:64px;
  padding:0 12px;
  display:grid;
  grid-template-columns:36px 1fr 36px;
  align-items:center;
  background:linear-gradient(180deg, rgba(60,90,40,.35), rgba(14,14,18,.95));
  border-bottom:1px solid rgba(255,255,255,.08);
}

.hh-back{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;border:none;
  background:rgba(255,255,255,.06);
  color:#fff;font-size:18px;
}

.hh-center{text-align:center;}
.hh-title{font-weight:800;}
.hh-sub{font-size:11px;opacity:.65}

.page{ padding:16px; }

/* ===== OVERVIEW ===== */
.life-overview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:24px;
}

.life-card{
  background:#15151c;
  border-radius:16px;
  padding:14px 8px;
  text-align:center;
  border:1px solid rgba(255,255,255,.06);
}

.life-icon{ font-size:22px; }
.life-value{ font-weight:800; margin-top:4px; }
.life-label{ font-size:11px; opacity:.6 }

/* ===== HABITS ===== */
.habit-section{
  margin-bottom:26px;
}

.habit-title{
  font-weight:800;
  margin-bottom:12px;
}

.habit-list{
  display:grid;
  gap:12px;
}

.habit-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px;
  border-radius:14px;
  background:#15151c;
  border:1px solid rgba(255,255,255,.06);
}

.habit-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.habit-icon{ font-size:22px; }
.habit-name{ font-weight:700; }
.habit-desc{ font-size:12px; opacity:.6 }

/* toggle */
.habit-toggle{
  width:46px;
  height:26px;
  background:#333;
  border-radius:20px;
  position:relative;
  cursor:pointer;
}

.habit-toggle::after{
  content:'';
  position:absolute;
  top:3px; left:3px;
  width:20px; height:20px;
  background:#999;
  border-radius:50%;
  transition:.2s;
}

.habit-toggle.active{
  background:#2ecc71;
}
.habit-toggle.active::after{
  left:23px;
  background:#fff;
}

/* ===== TIP ===== */
.life-tip{
  display:flex;
  gap:12px;
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#2c4f3a,#15151c);
  border:1px solid rgba(255,255,255,.08);
}

.life-tip-icon{ font-size:22px; }
.life-tip-text{ font-size:13px; line-height:1.4 }
</style>
</head>

<body>

<header class="health-header">
  <button class="hh-back" onclick="history.back()">←</button>
  <div class="hh-center">
    <div class="hh-title">🏃‍♂️ Lối sống</div>
    <div class="hh-sub">Thói quen mỗi ngày</div>
  </div>
  <div></div>
</header>

<main class="page">

  <!-- 📊 TỔNG QUAN -->
  <div class="life-overview">
    <div class="life-card">
      <div class="life-icon">😴</div>
      <div class="life-value">6h</div>
      <div class="life-label">Ngủ</div>
    </div>

    <div class="life-card">
      <div class="life-icon">👣</div>
      <div class="life-value">3,200</div>
      <div class="life-label">Bước</div>
    </div>

    <div class="life-card">
      <div class="life-icon">🔥</div>
      <div class="life-value">180</div>
      <div class="life-label">Vận động</div>
    </div>
  </div>

  <!-- ✅ THÓI QUEN -->
  <div class="habit-section">
    <div class="habit-title">Thói quen hôm nay</div>

    <div class="habit-list">

      <div class="habit-item">
        <div class="habit-left">
          <div class="habit-icon">💧</div>
          <div>
            <div class="habit-name">Uống đủ nước</div>
            <div class="habit-desc">≥ 2 lít</div>
          </div>
        </div>
        <div class="habit-toggle"></div>
      </div>

      <div class="habit-item">
        <div class="habit-left">
          <div class="habit-icon">🚶‍♂️</div>
          <div>
            <div class="habit-name">Đi bộ</div>
            <div class="habit-desc">≥ 30 phút</div>
          </div>
        </div>
        <div class="habit-toggle"></div>
      </div>

      <div class="habit-item">
        <div class="habit-left">
          <div class="habit-icon">🛌</div>
          <div>
            <div class="habit-name">Ngủ sớm</div>
            <div class="habit-desc">Trước 23:00</div>
          </div>
        </div>
        <div class="habit-toggle"></div>
      </div>

    </div>
  </div>

  <!-- 💡 GỢI Ý -->
  <div class="life-tip">
    <div class="life-tip-icon">💡</div>
    <div class="life-tip-text">
      Đi bộ 10 phút sau bữa ăn giúp cải thiện tiêu hóa và giấc ngủ.
    </div>
  </div>

</main>

<script>

async function saveLifestyle(){
  const toggles = document.querySelectorAll('.habit-toggle');
  const data = await loadHealthData();

  data.lifestyle = {
    sleepHours: 6,
    steps: 3200,
    exerciseMinutes: 20,
    habits: {
      water: toggles[0].classList.contains('active'),
      walk: toggles[1].classList.contains('active'),
      sleepEarly: toggles[2].classList.contains('active')
    }
  };

  await saveHealthData(data);
}

document.querySelectorAll('.habit-toggle').forEach(t=>{
  t.onclick = async ()=>{
    t.classList.toggle('active');
    await saveLifestyle();
  };
});

</script>



<script src="/health-store.js"></script>


</body>
</html>
