<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dragon Tiger Phoenix</title>

<script src="/socket.io/socket.io.js"></script>

<style>

/* ================= BACKGROUND ================= */

body{
margin:0;
font-family:system-ui;
background:#000;
color:#fff;
overflow:hidden;
}

/* ================= TOPBAR ================= */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.08);
font-weight:600;
}

/* ================= ARENA ================= */

.arena{
flex:1;
display:flex;
justify-content:space-around;
align-items:center;
padding:20px;
height:60vh;
}


/* ================= BET PANEL ================= */

.bet-panel{

display:flex;

justify-content:center;

gap:12px;

padding:12px;

}

.chip{

background:#111;

border-radius:10px;

padding:10px 14px;

cursor:pointer;

border:1px solid rgba(255,255,255,.1);

}

.chip:active{
transform:scale(.9);
}

/* ================= RESULT ================= */

.result{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

background:rgba(0,0,0,.85);

font-size:28px;

}

.hidden{
display:none;
}

.result img{
width:220px;
margin-top:20px;
}




.bet-card{
width:30%;
aspect-ratio:3/4;
border-radius:20px;
overflow:hidden;
position:relative;
cursor:pointer;

box-shadow:
0 20px 60px rgba(0,0,0,.9),
0 0 40px rgba(255,255,255,.05);

transition:.25s;
}

.bet-card:hover{
transform:scale(1.05);
}

.bet-card img{
width:100%;
height:100%;
object-fit:cover;
}

/* overlay */

.bet-overlay{
position:absolute;
bottom:0;
left:0;
right:0;
padding:12px;
background:linear-gradient(
transparent,
rgba(0,0,0,.9)
);
text-align:center;
}

.bet-title{
font-weight:700;
letter-spacing:2px;
}

.bet-amount{
font-size:20px;
margin-top:6px;
color:#ffd700;
font-weight:700;
}



</style>
</head>

<body>

<div class="topbar">

   <div>
   Round: <span id="roundId">0</span>
   </div>

   <div>
   ⏱ <span id="timer">60</span>
   </div>

   <div>
   💎 <span id="coins">0</span>
   </div>

</div>


<div class="arena">

  <div class="bet-card dragon" onclick="placeBet('dragon')">
      <img src="/assets/dtp/dragon.png">
      <div class="bet-overlay">
        <div class="bet-title">DRAGON</div>
        <div class="bet-amount" id="betDragon">0</div>
      </div>
  </div>

  <div class="bet-card tiger" onclick="placeBet('tiger')">
      <img src="/assets/dtp/tiger.png">
      <div class="bet-overlay">
        <div class="bet-title">TIGER</div>
        <div class="bet-amount" id="betTiger">0</div>
      </div>
  </div>

  <div class="bet-card phoenix" onclick="placeBet('phoenix')">
      <img src="/assets/dtp/phoenix.png">
      <div class="bet-overlay">
        <div class="bet-title">PHOENIX</div>
        <div class="bet-amount" id="betPhoenix">0</div>
      </div>
  </div>

</div>



<div class="bet-panel">

   <div class="chip" onclick="setBet(10)">10</div>
   <div class="chip" onclick="setBet(50)">50</div>
   <div class="chip" onclick="setBet(100)">100</div>
   <div class="chip" onclick="setBet(500)">500</div>

</div>


<div id="result" class="result hidden">

<div id="resultText"></div>

<img id="winnerImg">

</div>

<script>

/* ================= SOCKET ================= */

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

/* ================= STATE ================= */

let currentBet = 10;

let currentRound = 1;

let betDragon = 0;
let betTiger = 0;
let betPhoenix = 0;


/* ================= COIN ================= */

socket.on("coin-update", data=>{

document.getElementById("coins").textContent = data.coins;

});

/* ================= BET ================= */

function setBet(v){

currentBet = v;

}

function placeBet(side){

socket.emit("dtp-bet",{
  side,
  bet:currentBet
});

if(side === "dragon"){
   betDragon += currentBet;
   document.getElementById("betDragon").textContent = betDragon;
}

if(side === "tiger"){
   betTiger += currentBet;
   document.getElementById("betTiger").textContent = betTiger;
}

if(side === "phoenix"){
   betPhoenix += currentBet;
   document.getElementById("betPhoenix").textContent = betPhoenix;
}

}

/* ================= ROUND ================= */

socket.on("dtp-round-new", data=>{

currentRound = data.roundId;

betDragon = 0;
betTiger = 0;
betPhoenix = 0;

document.getElementById("betDragon").textContent = 0;
document.getElementById("betTiger").textContent = 0;
document.getElementById("betPhoenix").textContent = 0;
document.getElementById("roundId").textContent = data.roundId;

});


/* ================= TIMER ================= */

socket.on("dtp-timer", t=>{

document.getElementById("timer").textContent = t;

});

/* ================= RESULT ================= */

socket.on("dtp-result", data=>{

const result = document.getElementById("result");

const text = document.getElementById("resultText");
const img  = document.getElementById("winnerImg");

// hiện overlay
result.classList.remove("hidden");

// text
text.innerText = "Winner: " + data.winner.toUpperCase();

// image
img.src = "/assets/dtp/" + data.winner + ".png";


// =============================
// highlight cửa thắng
// =============================

document.querySelectorAll(".bet-card")
.forEach(c=>{
  c.style.boxShadow =
  "0 10px 40px rgba(0,0,0,.8)";
});

const winCard =
document.querySelector("." + data.winner);

if(winCard){
  winCard.style.boxShadow =
  "0 0 60px gold, 0 0 120px rgba(255,215,0,.6)";
}


// =============================
// ẩn result sau 4s
// =============================

setTimeout(()=>{

result.classList.add("hidden");

},4000);

});

</script>

</body>
</html>
