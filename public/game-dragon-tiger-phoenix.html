<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Dragon Tiger Phoenix</title>

<script src="/socket.io/socket.io.js"></script>

<style>

/* ================= BACKGROUND ================= */

html, body{
touch-action: manipulation;
background: #000;
}


body{

margin:0;
font-family:system-ui;

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.9)
),
url("/assets/dtp/bg-arena.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

color:#fff;
overflow:hidden;

}


body::before{

content:"";
position:fixed;
inset:0;

background:
radial-gradient(
circle at center,
rgba(255,215,0,.15),
transparent 60%
);

pointer-events:none;
}


/* ================= TOPBAR PRO ================= */
.topbar{

position:relative;

display:flex;
align-items:center;

height:46px;

padding:0 14px;

background:
linear-gradient(180deg,#0a0a0a,#000);

border-bottom:1px solid rgba(255,255,255,.08);

box-shadow:
0 10px 40px rgba(0,0,0,.9);

}


.top-item{

display:flex;
flex-direction:column;
align-items:center;

padding:0;
min-width:68px;

}

.top-label{

font-size:11px;
opacity:.6;
letter-spacing:1px;

}

.top-value{

font-size:15px;
font-weight:700;

}

/* ROUND */

.round-box{
color:#fff;
}

/* TIMER */

.timer-box{
color:#ffcc00;
}

.timer{
font-size:20px;
}

/* COINS */

.coin-box{
color:#00ffd5;
}

.coin{
font-size:18px;
}

/* ================= ARENA ================= */

.arena{
position:relative;
flex:1;
display:flex;
justify-content:center;
align-items:center;
gap:30px;
padding:20px;
height:80vh;
}


.arena::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:
radial-gradient(
circle,
rgba(255,215,0,.12),
rgba(255,215,0,.04),
transparent 70%
);

border-radius:50%;

top:55%;
left:50%;

transform:translate(-50%,-50%);

pointer-events:none;

}

/* HUD */

.arena-hud{

position:absolute;

top:70px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
align-items:center;
padding:14px 32px;


}

/* ROUND */

.round-title{

font-size:28px;
letter-spacing:3px;
opacity:.6;

}

.round-number{

font-size:31px;
font-weight:900;

margin-top:5px;

}

/* TIMER */

.timer-number{

font-size:30px;
font-weight:900;

color:#ffd700;

text-shadow:
0 0 10px gold,
0 0 30px gold;

margin-top:26px;

}
/* ================= BET BAR (BOTTOM CASINO) ================= */

.bet-panel{

position:fixed;

bottom:0;
left:0;
right:0;

height:110px;

display:flex;
justify-content:center;
align-items:center;

gap:22px;

padding:10px 20px;

background:
linear-gradient(
180deg,
rgba(0,0,0,.3),
rgba(0,0,0,.85)
);

backdrop-filter: blur(8px);

border-top:1px solid rgba(255,255,255,.08);

box-shadow:
0 -10px 40px rgba(0,0,0,.9);

z-index:20;

}

/* CHIP BASE */

.chip{

position:relative;

width:80px;
height:80px;

border-radius:50%;

cursor:pointer;

transition:.25s;

display:flex;
align-items:center;
justify-content:center;

}

.chip img{

width:100%;
height:150%;
object-fit:contain;

pointer-events:none;

}

/* number */

.chip span{

position:absolute;
bottom:-3px;
font-size:14px;
font-weight:700;
background:#000;
padding:0px 6px;
border-radius:20px;
border:1px solid rgba(255,255,255,.2);
color:#ffd700;
}

/* hover */

.chip:hover{
transform:scale(1.12);
}

/* active */

.chip.active{

transform:scale(1.25);

filter:drop-shadow(0 0 10px gold);

}

/* ================= RESULT ================= */

.result{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

background:rgba(0,0,0,.85);

font-size:28px;

}

.hidden{
display:none;
}

.result img{
width:220px;
margin-top:20px;
}




.bet-card{

width:28%;
max-width:260px;

aspect-ratio:3/4;

border-radius:22px;
overflow:hidden;

position:relative;
cursor:pointer;

border:2px solid rgba(255,255,255,.08);

box-shadow:
0 25px 80px rgba(0,0,0,.9),
0 0 30px rgba(255,255,255,.05);

transition:.25s;

background:#000;
}

.bet-card.dragon{
border-color:#ff4040;
}

.bet-card.tiger{
border-color:#4090ff;
}

.bet-card.phoenix{
border-color:#ff9b00;
}

.bet-card img{
width:100%;
height:100%;
object-fit:cover;
}

/* overlay */

.bet-overlay{

position:absolute;
bottom:-11px;
left:0;
right:0;

padding:0px;

background:linear-gradient(
transparent,
rgba(0,0,0,.8)
);

display:flex;
justify-content:center;
align-items:center;

}


.bet-amount{

font-size:18px;
font-weight:800;
color:#ffd700;
text-shadow:
0 0 10px gold,
0 0 20px gold;
padding:6px 14px;

}



.history-bar{
display:flex;
gap:1px;
padding:6px 0px;
justify-content:center;
}

.history-item{
width:40px;
height:40px;
border-radius:0px;
display:flex;
align-items:center;
justify-content:center;
background:#0a0a0a;
border:1px solid rgba(255,255,255,.1);
}

.history-icon{
width:38px;
height:38px;
object-fit:contain;
filter:drop-shadow(0 0 6px rgba(255,215,0,.4));
}


.history-head .history-icon{
width:25px;
height:25px;
opacity:1.9;
}

.history-dragon{
background:#8b0000;
}

.history-tiger{
background:#0b3d91;
}

.history-phoenix{
background:#ff8c00;
}


.history-row.dragon{border-left:3px solid #ff4040;}
.history-row.tiger{border-left:3px solid #4090ff;}
.history-row.phoenix{border-left:3px solid #ff9b00;}


/* BACK BUTTON */

.back-btn{

position:relative;
z-index:2;

font-size:22px;
font-weight:900;

width:36px;
height:36px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;
transition:.2s;

}

.back-btn:hover{

transform:scale(1.1);

box-shadow:0 0 10px rgba(255,255,255,.2);

}


/* GAME TITLE */

.game-title{

position:absolute;

left:50%;
transform:translateX(-50%);

font-size:15px;
font-weight:800;

letter-spacing:1px;

opacity:.9;

white-space:nowrap;

}



.my-history{

position:fixed;
inset:0;

background:rgba(0,0,0,.9);

display:none;   /* 🔥 mặc định ẩn */

align-items:center;
justify-content:center;

z-index:50;

}

.my-history-box{

width:90%;
max-width:420px;

background:#0a0a0a;

border-radius:16px;

padding:20px;

border:1px solid rgba(255,255,255,.1);

}

.my-history-title{

font-weight:800;
margin-bottom:10px;

}

.history-row{

display:flex;
justify-content:space-between;

padding:6px 0;

border-bottom:1px solid rgba(255,255,255,.05);

}

.close-history{

margin-top:10px;

text-align:center;

padding:8px;

background:#222;

border-radius:8px;

cursor:pointer;

}



/* ================= FLOAT HISTORY BUTTON ================= */


.history-table{
font-size:13px;
}

.history-head,
.history-row{

display:grid;

/* 6 cột */
grid-template-columns:
60px   /* round */
1fr    /* dragon */
1fr    /* tiger */
1fr    /* phoenix */
70px   /* result */
70px;  /* P/L */

align-items:center;
text-align:center;

}

/* header style */

.history-head{

padding:6px 0;
font-weight:700;
opacity:.6;

border-bottom:1px solid rgba(255,255,255,.1);
margin-bottom:6px;

}

/* row style */

.history-row{

padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.05);
font-weight:600;

}

/* căn giữa nội dung */

.history-head div,
.history-row div{

display:flex;
align-items:center;
justify-content:center;

}

/* win */

.history-win{
color:#00ff9c;
}

/* lose */

.history-lose{
color:#ff5a5a;
}



.history-stats{

display:flex;
justify-content:space-between;

margin-bottom:12px;
font-size:12px;
opacity:.8;

}

.stat span{

display:block;

font-size:16px;
font-weight:800;

margin-top:3px;

}

#historyProfit{
color:#00ff9c;
}

#historyWinrate{
color:#ffd700;
}

/* scroll */

#myHistoryList{

max-height:260px;
overflow-y:auto;
padding-right:4px;

}

/* scroll đẹp */

#myHistoryList::-webkit-scrollbar{
width:4px;
}

#myHistoryList::-webkit-scrollbar-thumb{
background:#333;
border-radius:10px;
}

/* big win */

.history-bigwin{
color:#ffd700;
font-weight:900;
text-shadow:0 0 10px gold;
}



.flying-chip{
position:fixed;
width:60px;
height:60px;
pointer-events:none;
z-index:999;
transition:all .6s cubic-bezier(.2,.8,.2,1);
}





.win-explosion{

position:absolute;
inset:0;

background:
radial-gradient(circle,
rgba(255,215,0,.9),
rgba(255,215,0,.2),
transparent 70%);

animation:explode .7s ease-out;
pointer-events:none;

}

@keyframes explode{

0%{
transform:scale(.3);
opacity:1;
}

100%{
transform:scale(2.5);
opacity:0;
}

}



.bet-progress{

width:240px;
height:6px;

background:#111;
border-radius:20px;

margin-top:12px;

overflow:hidden;

}

#betBar{

height:100%;
width:100%;

background:linear-gradient(
90deg,
#00ff9c,
#ffd700,
#ff4040
);

transition:width 1s linear;

}



.pool-display{

position:absolute;

bottom:123px;
left:50%;
transform:translateX(-50%);

font-size:12px;
font-weight:700;

padding:3px 10px;

border-radius:20px;

background:rgba(0,0,0,.8);
border:1px solid rgba(255,255,255,.15);

color:#ffd700;

box-shadow:
0 0 10px rgba(255,215,0,.3);

}


.pool-display.bump{
animation:bump .25s;
}

@keyframes bump{
0%{transform:translateX(-50%) scale(1)}
50%{transform:translateX(-50%) scale(1.2)}
100%{transform:translateX(-50%) scale(1)}
}




/* ================= BALANCE BAR PREMIUM ================= */

.balance-bar{

position:fixed;

bottom:115px;
left:50%;
transform:translateX(-50%);

display:flex;
align-items:center;

gap:14px;

width:340px;
height:52px;

padding:0 16px;

border-radius:14px;

background:
linear-gradient(180deg,#111,#000);

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 15px 40px rgba(0,0,0,.9),
0 0 20px rgba(0,255,200,.2);

z-index:25;

overflow:hidden;

}


/* shine effect */

.balance-bar::before{

content:"";

position:absolute;

top:0;
left:-120%;

width:120%;
height:100%;

background:
linear-gradient(
120deg,
transparent,
rgba(255,255,255,.15),
transparent
);

animation:balanceShine 4s infinite;

}

@keyframes balanceShine{

0%{ left:-120%; }
100%{ left:120%; }

}


/* icon */

.balance-left{

width:32px;
height:32px;

display:flex;
align-items:center;
justify-content:center;

}

.balance-left img{

width:100%;
height:100%;
object-fit:contain;

filter:
drop-shadow(0 0 6px rgba(255,120,120,.8));

}


/* center */

.balance-center{

display:flex;
flex-direction:column;

}


/* label */

.balance-title{

font-size:10px;

letter-spacing:2px;

opacity:.6;

}


/* value */

.balance-value{

font-size:22px;
font-weight:900;

color:#00ffd5;

text-shadow:
0 0 8px rgba(0,255,200,.7),
0 0 18px rgba(0,255,200,.4);

}


.coin-pop{
animation:coinPop .3s;
}

@keyframes coinPop{

0%{transform:scale(1)}
50%{transform:scale(1.3)}
100%{transform:scale(1)}

}



/* history button inside balance */

.balance-history{

margin-left:auto;

width:40px;
height:40px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;

transition:.25s;

}

.balance-history img{

width:100%;
height:100%;

object-fit:contain;

filter:
drop-shadow(0 0 6px rgba(255,215,0,.5));

}

.balance-history:hover{

transform:scale(1.15);

filter:drop-shadow(0 0 10px gold);

}



/* ================= PAYOUT TEXT ================= */

.payout-text{

margin-top:8px;

font-size:14px;
font-weight:900;

letter-spacing:1px;

text-align:center;

}

/* dragon */

.dragon-pay{
color:#ff4040;
text-shadow:0 0 8px rgba(255,80,80,.8);
}

/* tiger */

.tiger-pay{
color:#4090ff;
text-shadow:0 0 8px rgba(80,150,255,.8);
}

/* phoenix */

.phoenix-pay{
color:#ff9b00;
text-shadow:0 0 8px rgba(255,180,80,.8);
}


/* card column */

.bet-col{

display:flex;
flex-direction:column;
align-items:center;

width:28%;
max-width:260px;

}

</style>
</head>

<body>


<div class="topbar">

  <div class="back-btn" onclick="location.href='/invest.html'">‹</div>

  <div class="game-title">
    <span style="color:red">DRAGON</span> • 
    <span style="color:rgb(17,13,231)">TIGER</span> • 
    <span style="color:rgb(235,129,8)">PHOENIX</span>
  </div>

</div>


<div class="history-bar" id="historyBar"></div>



<div class="arena">

<div class="arena-hud">

  <div class="round-title">ROUND</div>

  <div class="round-number" id="roundId">0</div>

  <div class="timer-number">
    <span id="timer">60</span>
  </div>


<div class="bet-progress">
<div id="betBar"></div>
</div>


</div>

<div class="bet-col">

  <div class="bet-card dragon" onclick="placeBet('dragon')">

    <img src="/assets/dtp/dragon.png">

    <div class="bet-overlay">
      <div class="bet-amount" id="betDragon">0</div>
    </div>

    <div class="pool-display">
      <span id="poolDragon">0</span>
    </div>

  </div>

  <div class="payout-text dragon-pay">WIN x3</div>

</div>


<div class="bet-col">

  <div class="bet-card tiger" onclick="placeBet('tiger')">

    <img src="/assets/dtp/tiger.png">

    <div class="bet-overlay">
      <div class="bet-amount" id="betTiger">0</div>
    </div>

    <div class="pool-display">
      <span id="poolTiger">0</span>
    </div>

  </div>

  <div class="payout-text tiger-pay">WIN x3</div>

</div>


<div class="bet-col">

  <div class="bet-card phoenix" onclick="placeBet('phoenix')">

    <img src="/assets/dtp/phoenix.png">

    <div class="bet-overlay">
      <div class="bet-amount" id="betPhoenix">0</div>
    </div>

    <div class="pool-display">
      <span id="poolPhoenix">0</span>
    </div>

  </div>

  <div class="payout-text phoenix-pay">WIN x3</div>

</div>

</div>




<div class="balance-bar">

  <div class="balance-left">
      <img src="/assets/dtp/meat-icon.png">
  </div>

  <div class="balance-center">
      <div class="balance-title">ACCOUNT BALANCE</div>
      <div class="balance-value" id="coins">0</div>
  </div>

<div class="balance-history" onclick="openMyHistory()">
    <img src="/assets/dtp/monkey-history.png">
</div>

</div>


<div class="bet-panel">

  <div class="chip active" onclick="setBet(10,this)">
      <img src="/assets/dtp/chip-dragon.png">
      <span>10</span>
  </div>

  <div class="chip" onclick="setBet(50,this)">
      <img src="/assets/dtp/chip-tiger.png">
      <span>50</span>
  </div>

  <div class="chip" onclick="setBet(100,this)">
      <img src="/assets/dtp/chip-phoenix.png">
      <span>100</span>
  </div>

  <div class="chip" onclick="setBet(500,this)">
      <img src="/assets/dtp/chip-lion.png">
      <span>500</span>
  </div>

</div>


<div id="result" class="result hidden">

<div id="resultText"></div>

<img id="winnerImg">

</div>





<div id="myHistoryModal" class="my-history">

<div class="my-history-box">

<div class="my-history-title">
MY BET HISTORY
</div>

<div class="history-stats">

<div class="stat">
TOTAL P/L
<span id="historyProfit">0</span>
</div>

<div class="stat">
WIN RATE
<span id="historyWinrate">0%</span>
</div>

</div>

<div class="history-table">

<div class="history-head">
  <div>ROUND</div>

  <div>
    <img src="/assets/dtp/dragon-head.png" class="history-icon">
  </div>

  <div>
    <img src="/assets/dtp/tiger-head.png" class="history-icon">
  </div>

  <div>
    <img src="/assets/dtp/phoenix-head.png" class="history-icon">
  </div>

  <div>RESULT</div>
  <div>P/L</div>
</div>

<div id="myHistoryList"></div>

</div>


<div class="close-history" onclick="closeMyHistory()">
CLOSE
</div>

</div>

</div>





<script>

/* ================= SOCKET ================= */

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});



/* ================= STATE ================= */

let currentBet = 10;

let currentRound = 1;

let betDragon = 0;
let betTiger = 0;
let betPhoenix = 0;

let betRestored = false;

/* ================= COIN ================= */

socket.on("coin-update", data=>{

const el = document.getElementById("coins");

el.textContent = data.coins;

el.classList.add("coin-pop");

setTimeout(()=>{
el.classList.remove("coin-pop");
},300);

});

/* ================= BET ================= */

function setBet(v,el){

currentBet = v;

document.querySelectorAll(".chip")
.forEach(c=>c.classList.remove("active"));

el.classList.add("active");

}


function placeBet(side){

const chip = document.querySelector(".chip.active img");
const chipRect = chip.getBoundingClientRect();

const card = document.querySelector("." + side);
const cardRect = card.getBoundingClientRect();

const flying = document.createElement("img");
flying.src = chip.src;
flying.className = "flying-chip";

flying.style.left = chipRect.left + "px";
flying.style.top  = chipRect.top + "px";

document.body.appendChild(flying);

setTimeout(()=>{
flying.style.left = cardRect.left + cardRect.width/2 + "px";
flying.style.top  = cardRect.top + cardRect.height/2 + "px";
flying.style.transform = "scale(.6)";
},10);

setTimeout(()=>{
flying.remove();
},600);


// ===== original bet =====

socket.emit("dtp-bet",{ side, bet:currentBet });

if(side==="dragon"){
betDragon+=currentBet;
betDragonEl.textContent=betDragon;
}

if(side==="tiger"){
betTiger+=currentBet;
betTigerEl.textContent=betTiger;
}

if(side==="phoenix"){
betPhoenix+=currentBet;
betPhoenixEl.textContent=betPhoenix;
}

}

/* ================= ROUND ================= */

socket.on("dtp-round-new", data=>{

if(currentRound !== data.roundId){

   betDragon = 0;
   betTiger = 0;
   betPhoenix = 0;

   document.getElementById("betDragon").textContent = 0;
   document.getElementById("betTiger").textContent = 0;
   document.getElementById("betPhoenix").textContent = 0;

   // 🔥 RESET POOL
   document.getElementById("poolDragon").textContent = 0;
   document.getElementById("poolTiger").textContent = 0;
   document.getElementById("poolPhoenix").textContent = 0;

   betRestored = false;
}

currentRound = data.roundId;
document.getElementById("roundId").textContent = data.roundId;

});

/* ================= TIMER ================= */

socket.on("dtp-timer", t=>{

document.getElementById("timer").textContent = t;

const percent = t / 60 * 100;

document.getElementById("betBar").style.width =
percent + "%";

});




/* ================= RESULT ================= */

let dtpHistory = [];

socket.on("dtp-result", data=>{

const result = document.getElementById("result");
const text   = document.getElementById("resultText");
const img    = document.getElementById("winnerImg");

// =============================
// SHOW RESULT
// =============================

result.classList.remove("hidden");

text.innerText =
"Winner: " + data.winner.toUpperCase();

img.src =
"/assets/dtp/" + data.winner + ".png";


// =============================
// HIGHLIGHT WIN CARD
// =============================

document.querySelectorAll(".bet-card")
.forEach(c=>{
  c.style.boxShadow =
  "0 10px 40px rgba(0,0,0,.8)";
});

const winCard =
document.querySelector("." + data.winner);

if(winCard){
winCard.style.boxShadow =
"0 0 80px gold,0 0 200px rgba(255,215,0,.7)";
}


// =============================
//  WIN EXPLOSION
// =============================


const fx = document.createElement("div");
fx.className="win-explosion";

winCard.appendChild(fx);

setTimeout(()=>{
fx.remove();
},700);



// =============================
// HISTORY 8 ROUND
// =============================

dtpHistory.unshift(data.winner);

if(dtpHistory.length > 8){
  dtpHistory.pop();
}

renderDtpHistory();


// =============================
// HIDE RESULT
// =============================

setTimeout(()=>{
result.classList.add("hidden");
},4000);

});


// =============================
// RENDER HISTORY
// =============================

function renderDtpHistory(){

const bar = document.getElementById("historyBar");
if(!bar) return;

bar.innerHTML = "";

dtpHistory.forEach(r=>{

const item = document.createElement("div");
item.className = "history-item history-"+r;

const img = document.createElement("img");

if(r === "dragon") img.src = "/assets/dtp/dragon-head.png";
if(r === "tiger") img.src = "/assets/dtp/tiger-head.png";
if(r === "phoenix") img.src = "/assets/dtp/phoenix-head.png";

img.className = "history-icon";

item.appendChild(img);

bar.appendChild(item);

});

}



socket.on("dtp-history-update", list=>{

dtpHistory = list;

renderDtpHistory();

});


socket.on("dtp-bet-update", data=>{

document.getElementById("poolDragon").textContent =
data.dragon;

document.getElementById("poolTiger").textContent =
data.tiger;

document.getElementById("poolPhoenix").textContent =
data.phoenix;

});


socket.on("dtp-my-bet", data=>{

betDragon  = data.dragon  || 0;
betTiger   = data.tiger   || 0;
betPhoenix = data.phoenix || 0;

document.getElementById("betDragon").textContent  = betDragon;
document.getElementById("betTiger").textContent   = betTiger;
document.getElementById("betPhoenix").textContent = betPhoenix;

betRestored = true; // 🔥 thêm dòng này

});




function openMyHistory(){

socket.emit("dtp-get-my-history");

document.getElementById("myHistoryModal")
.style.display = "flex";

}

function closeMyHistory(){

document.getElementById("myHistoryModal")
.style.display = "none";

}





socket.on("dtp-my-history", list=>{

const box = document.getElementById("myHistoryList");

box.innerHTML = "";

let totalProfit = 0;
let winCount = 0;

list.forEach(r=>{

const div = document.createElement("div");

let iconSrc =
r.winner==="dragon" ? "/assets/dtp/dragon-head.png" :
r.winner==="tiger" ? "/assets/dtp/tiger-head.png" :
"/assets/dtp/phoenix-head.png";

let totalBet =
(r.dragon||0) +
(r.tiger||0) +
(r.phoenix||0);

let profit = (r.win||0) - totalBet;

let resultClass =
profit > 0 ? "history-win" : "history-lose";

if(profit >= 200){
resultClass += " history-bigwin";
}

if(profit > 0) winCount++;

totalProfit += profit;

div.className = "history-row " + resultClass;

div.innerHTML = `
<div>#${r.round}</div>
<div>${r.dragon||0}</div>
<div>${r.tiger||0}</div>
<div>${r.phoenix||0}</div>
<div>
<img src="${iconSrc}" class="history-icon">
</div>
<div>${profit>0?"+":""}${profit}</div>
`;

box.appendChild(div);

});


// =====================
// STATS
// =====================

document.getElementById("historyProfit")
.textContent =
(totalProfit>0?"+":"") + totalProfit;

const winrate =
list.length
? Math.round(winCount/list.length*100)
: 0;

document.getElementById("historyWinrate")
.textContent = winrate + "%";

});



function updatePool(id,value){

const el = document.getElementById(id);

el.textContent=value;

el.classList.add("bump");

setTimeout(()=>el.classList.remove("bump"),200);

}



</script>
