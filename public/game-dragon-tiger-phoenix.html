<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dragon Tiger Phoenix</title>

<script src="/socket.io/socket.io.js"></script>

<style>

/* ================= BACKGROUND ================= */

body{
margin:0;
font-family:system-ui;
background:#000;
color:#fff;
overflow:hidden;
}

/* ================= TOPBAR ================= */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 16px;
background:#050505;
border-bottom:1px solid rgba(255,255,255,.08);
font-weight:600;
}

/* ================= ARENA ================= */

.arena{
flex:1;
display:flex;
justify-content:space-around;
align-items:center;
padding:20px;
height:60vh;
}

/* ================= CARD ================= */

.card{

width:30%;
aspect-ratio:3/4;

border-radius:18px;

overflow:hidden;

cursor:pointer;

position:relative;

box-shadow:
0 10px 40px rgba(0,0,0,.8);

transition:.2s;

}

.card:active{
transform:scale(.95);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}



/* ================= BET PANEL ================= */

.bet-panel{

display:flex;

justify-content:center;

gap:12px;

padding:12px;

}

.chip{

background:#111;

border-radius:10px;

padding:10px 14px;

cursor:pointer;

border:1px solid rgba(255,255,255,.1);

}

.chip:active{
transform:scale(.9);
}

/* ================= RESULT ================= */

.result{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

background:rgba(0,0,0,.85);

font-size:28px;

}

.hidden{
display:none;
}

.result img{
width:220px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="topbar">

   <div>
   Round: <span id="roundId">1</span>
   </div>

   <div>
   ⏱ <span id="timer">60</span>
   </div>

   <div>
   💎 <span id="coins">0</span>
   </div>

</div>


<div class="arena">

   <div class="card" onclick="placeBet('dragon')">
   <img src="/assets/dtp/dragon.png">
   </div>

   <div class="card" onclick="placeBet('tiger')">
   <img src="/assets/dtp/tiger.png">
   </div>

   <div class="card" onclick="placeBet('phoenix')">
   <img src="/assets/dtp/phoenix.png">
   </div>

</div>



<div class="bet-panel">

   <div class="chip" onclick="setBet(10)">10</div>
   <div class="chip" onclick="setBet(50)">50</div>
   <div class="chip" onclick="setBet(100)">100</div>
   <div class="chip" onclick="setBet(500)">500</div>

</div>


<div id="result" class="result hidden">

<div id="resultText"></div>

<img id="winnerImg">

</div>

<script>

/* ================= SOCKET ================= */

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});

/* ================= STATE ================= */

let currentBet = 10;

let currentRound = 1;

/* ================= COIN ================= */

socket.on("coin-update", data=>{

document.getElementById("coins").textContent = data.coins;

});

/* ================= BET ================= */

function setBet(v){

currentBet = v;

}

function placeBet(side){

socket.emit("dtp-bet",{

side,
bet:currentBet

});

}

/* ================= ROUND ================= */

socket.on("dtp-round-new", data=>{

currentRound = data.roundId;

document.getElementById("roundId").textContent = data.roundId;

});

/* ================= TIMER ================= */

socket.on("dtp-timer", t=>{

document.getElementById("timer").textContent = t;

});

/* ================= RESULT ================= */

socket.on("dtp-result", data=>{

const result = document.getElementById("result");

result.classList.remove("hidden");

document.getElementById("resultText").innerText =
"Winner: " + data.winner.toUpperCase();

document.getElementById("winnerImg").src =
"/assets/dtp/"+data.winner+".png";

setTimeout(()=>{

result.classList.add("hidden");

},4000);

});

</script>

</body>
</html>
