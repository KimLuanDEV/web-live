<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Dragon Tiger Phoenix</title>

<script src="/socket.io/socket.io.js"></script>

<style>

/* ================= BACKGROUND ================= */

html, body{
touch-action: manipulation;
background: #000;
}


body{

margin:0;
font-family:system-ui;

background:
linear-gradient(
rgba(0,0,0,.65),
rgba(0,0,0,.9)
),
url("/assets/dtp/bg-arena.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

color:#fff;
overflow:hidden;

}


body::before{

content:"";
position:fixed;
inset:0;

background:
radial-gradient(
circle at center,
rgba(255,215,0,.15),
transparent 60%
);

pointer-events:none;
}


/* ================= TOPBAR PRO ================= */
.topbar{

display:flex;
align-items:center;
gap:0px;

padding:10px 14px;

background:
linear-gradient(180deg,#0a0a0a,#000);
border-bottom:1px solid rgba(255,255,255,.08);
box-shadow:
0 10px 40px rgba(0,0,0,.9);
margin-bottom:-6px;
}


.top-item{

display:flex;
flex-direction:column;
align-items:center;

padding:0;
min-width:68px;

}

.top-label{

font-size:11px;
opacity:.6;
letter-spacing:1px;

}

.top-value{

font-size:15px;
font-weight:700;

}

/* ROUND */

.round-box{
color:#fff;
}

/* TIMER */

.timer-box{
color:#ffcc00;
}

.timer{
font-size:20px;
}

/* COINS */

.coin-box{
color:#00ffd5;
}

.coin{
font-size:18px;
}

/* ================= ARENA ================= */

.arena{
position:relative;
flex:1;
display:flex;
justify-content:center;
align-items:center;
gap:30px;
padding:20px;
height:80vh;
}


.arena::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:
radial-gradient(
circle,
rgba(255,215,0,.12),
rgba(255,215,0,.04),
transparent 70%
);

border-radius:50%;

top:55%;
left:50%;

transform:translate(-50%,-50%);

pointer-events:none;

}

/* HUD */

.arena-hud{

position:absolute;

top:70px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
align-items:center;
padding:14px 32px;


}

/* ROUND */

.round-title{

font-size:28px;
letter-spacing:3px;
opacity:.6;

}

.round-number{

font-size:31px;
font-weight:900;

margin-top:5px;

}

/* TIMER */

.timer-number{

font-size:30px;
font-weight:900;

color:#ffd700;

text-shadow:
0 0 10px gold,
0 0 30px gold;

margin-top:26px;

}
/* ================= BET BAR (BOTTOM CASINO) ================= */

.bet-panel{

position:fixed;

bottom:0;
left:0;
right:0;

height:110px;

display:flex;
justify-content:center;
align-items:center;

gap:22px;

padding:10px 20px;

background:
linear-gradient(
180deg,
rgba(0,0,0,.3),
rgba(0,0,0,.85)
);

backdrop-filter: blur(8px);

border-top:1px solid rgba(255,255,255,.08);

box-shadow:
0 -10px 40px rgba(0,0,0,.9);

z-index:20;

}

/* CHIP BASE */

.chip{

position:relative;

width:80px;
height:80px;

border-radius:50%;

cursor:pointer;

transition:.25s;

display:flex;
align-items:center;
justify-content:center;

}

.chip img{

width:100%;
height:150%;
object-fit:contain;

pointer-events:none;

}

/* number */

.chip span{

position:absolute;
bottom:-3px;
font-size:14px;
font-weight:700;
background:#000;
padding:0px 6px;
border-radius:20px;
border:1px solid rgba(255,255,255,.2);
color:#ffd700;
}

/* hover */

.chip:hover{
transform:scale(1.12);
}

/* active */

.chip.active{

transform:scale(1.25);

filter:drop-shadow(0 0 10px gold);

}

/* ================= RESULT ================= */

.result{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

background:rgba(0,0,0,.85);

font-size:28px;

}

.hidden{
display:none;
}

.result img{
width:220px;
margin-top:20px;
}




.bet-card{

width:28%;
max-width:260px;

aspect-ratio:3/4;

border-radius:22px;
overflow:hidden;

position:relative;
cursor:pointer;

border:2px solid rgba(255,255,255,.08);

box-shadow:
0 25px 80px rgba(0,0,0,.9),
0 0 30px rgba(255,255,255,.05);

transition:.25s;

background:#000;
}

.bet-card.dragon{
border-color:#ff4040;
}

.bet-card.tiger{
border-color:#4090ff;
}

.bet-card.phoenix{
border-color:#ff9b00;
}

.bet-card img{
width:100%;
height:100%;
object-fit:cover;
}

/* overlay */

.bet-overlay{

position:absolute;
bottom:-11px;
left:0;
right:0;

padding:0px;

background:linear-gradient(
transparent,
rgba(0,0,0,.8)
);

display:flex;
justify-content:center;
align-items:center;

}


.bet-amount{

font-size:26px;
font-weight:800;
color:#ffd700;
text-shadow:
0 0 10px gold,
0 0 20px gold;
padding:6px 14px;

}



.history-bar{
display:flex;
gap:1px;
padding:6px 0px;
justify-content:center;
}

.history-item{
width:40px;
height:40px;
border-radius:0px;
display:flex;
align-items:center;
justify-content:center;
background:#0a0a0a;
border:1px solid rgba(255,255,255,.1);
}

.history-icon{
width:38px;
height:38px;
object-fit:contain;
}

.history-dragon{
background:#8b0000;
}

.history-tiger{
background:#0b3d91;
}

.history-phoenix{
background:#ff8c00;
}




/* BACK BUTTON */

.back-btn{

font-size:22px;
font-weight:900;

width:36px;
height:36px;

display:flex;
align-items:center;
justify-content:center;

cursor:pointer;
transition:.2s;

}

.back-btn:hover{

transform:scale(1.1);

box-shadow:0 0 10px rgba(255,255,255,.2);

}


/* GAME TITLE */

.game-title{
flex:1;
display:flex;
justify-content:center;
align-items:center;
margin-right:-51px;
}

.game-title img{
height:32px;
width:auto;
object-fit:contain;
}



</style>
</head>

<body>

<div class="topbar">

  <div class="back-btn" onclick="location.href='/invest.html'">‹</div>

<div class="game-title">
  <img src="/assets/dtp/game-title.png" alt="Dragon Tiger Phoenix">
</div>

  <div class="top-item coin-box">
    <div class="top-value coin">
      💎 <span id="coins">0</span>
    </div>
  </div>

</div>


<div class="history-bar" id="historyBar"></div>



<div class="arena">

<div class="arena-hud">

  <div class="round-title">ROUND</div>

  <div class="round-number" id="roundId">0</div>

  <div class="timer-number">
    <span id="timer">60</span>
  </div>

</div>

  <div class="bet-card dragon" onclick="placeBet('dragon')">
      <img src="/assets/dtp/dragon.png">
      <div class="bet-overlay">
        <div class="bet-amount" id="betDragon">0</div>
      </div>
  </div>

  <div class="bet-card tiger" onclick="placeBet('tiger')">
      <img src="/assets/dtp/tiger.png">
      <div class="bet-overlay">
        <div class="bet-amount" id="betTiger">0</div>
      </div>
  </div>

  <div class="bet-card phoenix" onclick="placeBet('phoenix')">
      <img src="/assets/dtp/phoenix.png">
      <div class="bet-overlay">
        <div class="bet-amount" id="betPhoenix">0</div>
      </div>
  </div>

</div>




<div class="bet-panel">

  <div class="chip active" onclick="setBet(10,this)">
      <img src="/assets/dtp/chip-dragon.png">
      <span>10</span>
  </div>

  <div class="chip" onclick="setBet(50,this)">
      <img src="/assets/dtp/chip-tiger.png">
      <span>50</span>
  </div>

  <div class="chip" onclick="setBet(100,this)">
      <img src="/assets/dtp/chip-phoenix.png">
      <span>100</span>
  </div>

  <div class="chip" onclick="setBet(500,this)">
      <img src="/assets/dtp/chip-lion.png">
      <span>500</span>
  </div>

</div>


<div id="result" class="result hidden">

<div id="resultText"></div>

<img id="winnerImg">

</div>

<script>

/* ================= SOCKET ================= */

const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

const socket = io({
auth:{
uid:me.uid
}
});



/* ================= STATE ================= */

let currentBet = 10;

let currentRound = 1;

let betDragon = 0;
let betTiger = 0;
let betPhoenix = 0;

let betRestored = false;

/* ================= COIN ================= */

socket.on("coin-update", data=>{

document.getElementById("coins").textContent = data.coins;

});

/* ================= BET ================= */

function setBet(v,el){

currentBet = v;

document.querySelectorAll(".chip")
.forEach(c=>c.classList.remove("active"));

el.classList.add("active");

}


function placeBet(side){

socket.emit("dtp-bet",{
  side,
  bet:currentBet
});

if(side === "dragon"){
   betDragon += currentBet;
   document.getElementById("betDragon").textContent = betDragon;
}

if(side === "tiger"){
   betTiger += currentBet;
   document.getElementById("betTiger").textContent = betTiger;
}

if(side === "phoenix"){
   betPhoenix += currentBet;
   document.getElementById("betPhoenix").textContent = betPhoenix;
}

}

/* ================= ROUND ================= */

socket.on("dtp-round-new", data=>{

// nếu round thay đổi
if(currentRound !== data.roundId){

   betDragon = 0;
   betTiger = 0;
   betPhoenix = 0;

   document.getElementById("betDragon").textContent = 0;
   document.getElementById("betTiger").textContent = 0;
   document.getElementById("betPhoenix").textContent = 0;

   // reset trạng thái restore
   betRestored = false;
}

currentRound = data.roundId;

document.getElementById("roundId").textContent = data.roundId;

});

/* ================= TIMER ================= */

socket.on("dtp-timer", t=>{

document.getElementById("timer").textContent = t;

});




/* ================= RESULT ================= */

let dtpHistory = [];

socket.on("dtp-result", data=>{

const result = document.getElementById("result");
const text   = document.getElementById("resultText");
const img    = document.getElementById("winnerImg");

// =============================
// SHOW RESULT
// =============================

result.classList.remove("hidden");

text.innerText =
"Winner: " + data.winner.toUpperCase();

img.src =
"/assets/dtp/" + data.winner + ".png";


// =============================
// HIGHLIGHT WIN CARD
// =============================

document.querySelectorAll(".bet-card")
.forEach(c=>{
  c.style.boxShadow =
  "0 10px 40px rgba(0,0,0,.8)";
});

const winCard =
document.querySelector("." + data.winner);

if(winCard){
winCard.style.boxShadow =
"0 0 80px gold,0 0 200px rgba(255,215,0,.7)";
}


// =============================
// HISTORY 8 ROUND
// =============================

dtpHistory.unshift(data.winner);

if(dtpHistory.length > 8){
  dtpHistory.pop();
}

renderDtpHistory();


// =============================
// HIDE RESULT
// =============================

setTimeout(()=>{
result.classList.add("hidden");
},4000);

});


// =============================
// RENDER HISTORY
// =============================

function renderDtpHistory(){

const bar = document.getElementById("historyBar");
if(!bar) return;

bar.innerHTML = "";

dtpHistory.forEach(r=>{

const item = document.createElement("div");
item.className = "history-item history-"+r;

const img = document.createElement("img");

if(r === "dragon") img.src = "/assets/dtp/dragon-head.png";
if(r === "tiger") img.src = "/assets/dtp/tiger-head.png";
if(r === "phoenix") img.src = "/assets/dtp/phoenix-head.png";

img.className = "history-icon";

item.appendChild(img);

bar.appendChild(item);

});

}



socket.on("dtp-history-update", list=>{

dtpHistory = list;

renderDtpHistory();

});


socket.on("dtp-bet-update", data=>{

// nếu muốn hiển thị tổng cược phòng thì xử lý ở đây
// hiện tại chỉ dùng cho thống kê, không ghi đè cược user

});


socket.on("dtp-my-bet", data=>{

betDragon  = data.dragon  || 0;
betTiger   = data.tiger   || 0;
betPhoenix = data.phoenix || 0;

document.getElementById("betDragon").textContent  = betDragon;
document.getElementById("betTiger").textContent   = betTiger;
document.getElementById("betPhoenix").textContent = betPhoenix;

betRestored = true; // 🔥 thêm dòng này

});






</script>

</body>
</html>
