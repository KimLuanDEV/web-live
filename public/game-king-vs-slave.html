<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King vs Slave</title>

<style>
html,body{
  margin:0;
  background:#06060b;
  font-family:system-ui;
  color:#fff;
  overflow:hidden;
}

/* ================= HEADER PRO ================= */
.ks-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0f0f1a,#06060b);
  border-bottom:1px solid rgba(255,255,255,.05);
  z-index:100;
  backdrop-filter:blur(6px);
}

/* back */
.ks-back{
  font-size:22px;
  cursor:pointer;
  opacity:.8;
}

.ks-back:hover{
  opacity:1;
}

/* center title */
.ks-center{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.ks-title{
  font-weight:700;
  font-size:18px;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.ks-sub{
  font-size:11px;
  opacity:.6;
  letter-spacing:.5px;
}

/* right wallet */
.ks-wallet{
  text-align:right;
}

.ks-diamond{
  color:#00e6ff;
  font-weight:700;
}

.ks-bet{
  font-size:11px;
  opacity:.6;
}

/* ================= KING ROW ================= */
.ks-king-row{
  position:fixed;
  top:70px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
}

.ks-king-card{
  width:55px;
  height:80px;
  border-radius:10px;
  background:linear-gradient(180deg,#1a1a1a,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:1px solid rgba(255,215,0,.4);
  box-shadow:0 0 10px rgba(255,215,0,.3);
}

/* ================= ARENA ================= */
.ks-arena{
  position:absolute;
  top:160px;
  left:0;
  right:0;
  bottom:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ks-battle{
  display:flex;
  gap:60px;
}

.ks-big-card{
  width:130px;
  height:190px;
  border-radius:16px;
  background:linear-gradient(180deg,#111,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  box-shadow:0 0 30px rgba(0,0,0,.8);
}

/* ================= PLAYER ROW ================= */
.ks-player-row{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
}

.ks-player-card{
  width:65px;
  height:95px;
  border-radius:12px;
  background:linear-gradient(180deg,#141414,#050505);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  border:1px solid rgba(0,255,200,.4);
  box-shadow:0 0 10px rgba(0,255,200,.3);
  transition:.2s;
}

.ks-player-card:hover{
  transform:translateY(-10px);
}

/* ================= RESULT ================= */
.ks-result{
  position:absolute;
  bottom:110px;
  left:0;
  right:0;
  text-align:center;
  font-weight:700;
  font-size:18px;
}


/* ================= BET OVERLAY ================= */
.bet-overlay{
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,215,0,.10), transparent 55%),
    radial-gradient(circle at 50% 70%, rgba(0,230,255,.10), transparent 55%),
    rgba(0,0,0,.62);
  backdrop-filter: blur(10px);
}

.bet-panel{
  width:min(420px, 92vw);
  border-radius:18px;
  padding:18px 16px 16px;
  background:linear-gradient(180deg, rgba(20,20,30,.92), rgba(0,0,0,.86));
  border:1px solid rgba(255,255,255,.08);
  box-shadow: 0 20px 60px rgba(0,0,0,.65);
  text-align:center;
}

.bet-badge{
  width:52px;
  height:52px;
  margin:0 auto 10px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  background:linear-gradient(180deg, rgba(255,215,0,.25), rgba(0,0,0,.4));
  border:1px solid rgba(255,215,0,.25);
  box-shadow:0 0 22px rgba(255,215,0,.25);
}

.bet-title{
  font-weight:800;
  font-size:18px;
  letter-spacing:.3px;
}

.bet-sub{
  margin-top:4px;
  font-size:12px;
  opacity:.7;
}

.bet-row{
  margin-top:14px;
  display:flex;
  gap:10px;
}

.bet-input{
  flex:1;
  height:40px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  outline:none;
  background:rgba(0,0,0,.35);
  color:#fff;
  padding:0 12px;
  font-weight:700;
  text-align:center;
}

.bet-go{
  width:96px;
  height:40px;
  border:none;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(90deg,#ff007a,#ff4c00);
  box-shadow:0 0 18px rgba(255,0,122,.22);
}

.bet-quick{
  margin-top:12px;
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.bet-quick button{
  min-width:72px;
  height:34px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(0,0,0,.28);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.bet-err{
  margin-top:10px;
  min-height:18px;
  font-size:12px;
  color:#ff6868;
  opacity:.95;
}

/* Ẩn/hiện UI game theo trạng thái */
.hidden-ui{ display:none !important; }


</style>
</head>

<body>

<div class="ks-header">

  <div class="ks-back" onclick="history.back()">
    ←
  </div>

  <div class="ks-center">
    <div class="ks-title">👑 King vs Slave</div>
    <div class="ks-sub">Bắt vua để chiến thắng</div>
  </div>

  <div class="ks-wallet">
    <div class="ks-diamond">
      💎 <span id="diamondValue">0</span>
    </div>
    <div class="ks-bet">
      Bet: <span id="currentBet">0</span>
    </div>
  </div>

</div>

<!-- 💎 BET OVERLAY (CENTER) -->
<div id="betOverlay" class="bet-overlay">
  <div class="bet-panel">
    <div class="bet-badge">💎</div>
    <div class="bet-title">Đặt cược để bắt đầu</div>
    <div class="bet-sub">Chỉ thắng khi 🔒 bắt được 👑</div>

    <div class="bet-row">
      <input id="betInput" class="bet-input" type="number" placeholder="Nhập bet">
      <button class="bet-go" onclick="placeBet()">CƯỢC</button>
    </div>

    <div class="bet-quick">
      <button onclick="setBetQuick(10)">10</button>
      <button onclick="setBetQuick(50)">50</button>
      <button onclick="setBetQuick(100)">100</button>
      <button onclick="setBetQuick('all')">ALL</button>
    </div>

    <div id="betErr" class="bet-err"></div>
  </div>
</div>


<!-- 🎮 GAME UI (chỉ hiện sau khi cược) -->
<div id="gameUI" class="hidden-ui">

  <!-- KING CARDS -->
  <div id="kingRow" class="ks-king-row"></div>

  <!-- ARENA -->
  <div class="ks-arena">
    <div class="ks-battle">
      <div id="playerBig" class="ks-big-card">?</div>
      <div id="kingBig" class="ks-big-card">?</div>
    </div>
  </div>

  <div id="result" class="ks-result"></div>

  <!-- PLAYER CARDS -->
  <div id="playerRow" class="ks-player-row"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{ uid: localStorage.getItem("uid") }
});

let roundActive = false;
let betPlaced = false;
let playerDeck = ["slave","normal","normal","normal","normal"];
let kingCount = 5;

const map = {
  king:"👑",
  slave:"🔒",
  normal:"👤"
};


let lastPickIndex = -1;

function showBetOverlay(show){
  document.getElementById("betOverlay").style.display = show ? "flex" : "none";
}

function showGameUI(show){
  document.getElementById("gameUI").classList.toggle("hidden-ui", !show);
}

function setBetQuick(v){
  const input = document.getElementById("betInput");
  if(v === "all"){
    const d = Number(document.getElementById("diamondValue").textContent || 0);
    input.value = d;
  }else{
    input.value = v;
  }
}

function setBetError(msg){
  document.getElementById("betErr").textContent = msg || "";
}


/* ================= DIAMOND UPDATE ================= */

socket.on("diamond-update", data=>{
  document.getElementById("diamondValue").textContent =
    data.diamonds;
});

/* ================= PLACE BET ================= */

function placeBet(){

  const bet = Number(
    document.getElementById("betInput").value
  );

  if(!bet || bet<=0){
    setBetError("Bet không hợp lệ");
    return;
  }

  setBetError("");
  socket.emit("kvs-bet",{ bet });
}

/* ================= BET OK ================= */

socket.on("kvs-bet-ok", data=>{
  betPlaced = true;
  roundActive = true;

  kingCount = 5;
  playerDeck = ["slave","normal","normal","normal","normal"];
  lastPickIndex = -1;

  document.getElementById("result").textContent =
    "Đã cược 💎 " + data.bet;

  document.getElementById("currentBet").textContent = data.bet;

  // ✅ show game – hide overlay
  showBetOverlay(false);
  showGameUI(true);

  renderKing();
  renderPlayer();
});

/* ================= PLAY CARD ================= */

function playCard(index){
  if(!roundActive || !betPlaced) return;
  lastPickIndex = index;
  socket.emit("kvs-play-card",{ index });
}

/* ================= RESULT ================= */

socket.on("kvs-result", data=>{

  // ✅ trừ 1 lá king đã lật
  kingCount = Math.max(0, kingCount - 1);

  // ✅ trừ đúng lá player đã chọn
  if(lastPickIndex >= 0 && lastPickIndex < playerDeck.length){
    playerDeck.splice(lastPickIndex, 1);
  }
  lastPickIndex = -1;

  document.getElementById("playerBig").textContent =
    map[data.playerCard];

  document.getElementById("kingBig").textContent =
    map[data.kingCard];

  const resultEl = document.getElementById("result");

  if(data.result==="win"){
    resultEl.textContent = "🔥 THẮNG +" + (data.win||0) + " 💎";
    resultEl.style.color = "#00ff88";

    roundActive = false;
    betPlaced = false;
    document.getElementById("currentBet").textContent = 0;

    // ✅ về màn cược
    showGameUI(false);
    showBetOverlay(true);
    document.getElementById("betInput").value = "";
    setBetError("");
  }
  else if(data.result==="lose"){
    resultEl.textContent = "💀 Thua";
    resultEl.style.color = "#ff4444";

    roundActive = false;
    betPlaced = false;
    document.getElementById("currentBet").textContent = 0;

    // ✅ về màn cược
    showGameUI(false);
    showBetOverlay(true);
    document.getElementById("betInput").value = "";
    setBetError("");
  }
  else{
    resultEl.textContent = "🤝 Hòa";
    resultEl.style.color = "#ffaa00";
    // draw → tiếp tục, giữ UI game
  }

  renderKing();
  renderPlayer();
});

/* ================= RENDER ================= */

function renderKing(){
  const row=document.getElementById("kingRow");
  row.innerHTML="";
  for(let i=0;i<kingCount;i++){
    const div=document.createElement("div");
    div.className="ks-king-card";
    div.textContent="🂠";
    row.appendChild(div);
  }
}

function renderPlayer(){
  const row=document.getElementById("playerRow");
  row.innerHTML="";
  playerDeck.forEach((_,i)=>{
    const div=document.createElement("div");
    div.className="ks-player-card";
    div.textContent="🂠";
    div.onclick=()=>playCard(i);
    row.appendChild(div);
  });
}



showGameUI(false);
showBetOverlay(true);
setBetError("");

renderKing();
renderPlayer();

</script>

</body>
</html>
