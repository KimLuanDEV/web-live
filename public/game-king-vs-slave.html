<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King vs Slave</title>

<style>
html,body{
  margin:0;
  background:#06060b;
  font-family:system-ui;
  color:#fff;
  overflow:hidden;
}

/* ================= HEADER ================= */
.ks-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#0c0c18,#050508);
  border-bottom:1px solid rgba(255,255,255,.05);
  z-index:10;
  font-weight:700;
  letter-spacing:.5px;
}

/* ================= KING ROW ================= */
.ks-king-row{
  position:fixed;
  top:70px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
}

.ks-king-card{
  width:55px;
  height:80px;
  border-radius:10px;
  background:linear-gradient(180deg,#1a1a1a,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:1px solid rgba(255,215,0,.4);
  box-shadow:0 0 10px rgba(255,215,0,.3);
}

/* ================= ARENA ================= */
.ks-arena{
  position:absolute;
  top:160px;
  left:0;
  right:0;
  bottom:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ks-battle{
  display:flex;
  gap:60px;
}

.ks-big-card{
  width:130px;
  height:190px;
  border-radius:16px;
  background:linear-gradient(180deg,#111,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  box-shadow:0 0 30px rgba(0,0,0,.8);
}

/* ================= PLAYER ROW ================= */
.ks-player-row{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
}

.ks-player-card{
  width:65px;
  height:95px;
  border-radius:12px;
  background:linear-gradient(180deg,#141414,#050505);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  border:1px solid rgba(0,255,200,.4);
  box-shadow:0 0 10px rgba(0,255,200,.3);
  transition:.2s;
}

.ks-player-card:hover{
  transform:translateY(-10px);
}

/* ================= RESULT ================= */
.ks-result{
  position:absolute;
  bottom:110px;
  left:0;
  right:0;
  text-align:center;
  font-weight:700;
  font-size:18px;
}
</style>
</head>

<body>

<div class="ks-header">
  👑 King vs Slave
</div>

<!-- KING CARDS -->
<div id="kingRow" class="ks-king-row"></div>

<!-- ARENA -->
<div class="ks-arena">
  <div class="ks-battle">
    <div id="playerBig" class="ks-big-card">?</div>
    <div id="kingBig" class="ks-big-card">?</div>
  </div>
</div>

<div id="result" class="ks-result"></div>

<!-- PLAYER CARDS -->
<div id="playerRow" class="ks-player-row"></div>

<script>

let playerDeck = [];
let kingDeck = [];
let roundActive = false;

const map = {
  king:"👑",
  slave:"🔒",
  normal:"👤"
};

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function startRound(){
  playerDeck = shuffle(["slave","normal","normal","normal","normal"]);
  kingDeck   = shuffle(["king","normal","normal","normal","normal"]);

  document.getElementById("playerBig").textContent = "?";
  document.getElementById("kingBig").textContent = "?";
  document.getElementById("result").textContent = "";

  renderKing();
  renderPlayer();
  roundActive = true;
}

function renderKing(){
  const row = document.getElementById("kingRow");
  row.innerHTML = "";

  kingDeck.forEach(()=>{

    const div = document.createElement("div");
    div.className = "ks-king-card";
    div.textContent = "🂠";
    row.appendChild(div);

  });
}

function renderPlayer(){
  const row = document.getElementById("playerRow");
  row.innerHTML = "";

  playerDeck.forEach((_,index)=>{
    const div = document.createElement("div");
    div.className = "ks-player-card";
    div.textContent = "🂠";
    div.onclick = ()=>playCard(index);
    row.appendChild(div);
  });
}

function playCard(index){

  if(!roundActive) return;

  const playerCard = playerDeck.splice(index,1)[0];
  const kingCard   = kingDeck.shift();

  document.getElementById("playerBig").textContent = map[playerCard];
  document.getElementById("kingBig").textContent = map[kingCard];

  renderKing();
  renderPlayer();

  const resultEl = document.getElementById("result");

  if(playerCard==="slave" && kingCard==="king"){
    resultEl.textContent = "🔥 BẮT ĐƯỢC VUA!";
    resultEl.style.color = "#00ff88";
    roundActive = false;
    return;
  }

  if(playerCard==="slave" && kingCard==="normal"){
    resultEl.textContent = "💀 Nô lệ lộ diện!";
    resultEl.style.color = "#ff4444";
    roundActive = false;
    return;
  }

  if(playerCard==="normal" && kingCard==="king"){
    resultEl.textContent = "💀 Gặp Vua!";
    resultEl.style.color = "#ff4444";
    roundActive = false;
    return;
  }

  if(playerCard==="normal" && kingCard==="normal"){
    resultEl.textContent = "🤝 Hòa - tiếp tục!";
    resultEl.style.color = "#ffaa00";

    if(playerDeck.length===0){
      resultEl.textContent = "💀 Không bắt được vua!";
      roundActive=false;
      return;
    }
  }
}

startRound();

</script>

</body>
</html>
