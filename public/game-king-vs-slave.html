<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King vs Slave</title>

<style>
html,body{
  margin:0;
  background:#06060b;
  font-family:system-ui;
  color:#fff;
  overflow:hidden;
}

/* ================= HEADER PRO ================= */
.ks-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0f0f1a,#06060b);
  border-bottom:1px solid rgba(255,255,255,.05);
  z-index:100;
  backdrop-filter:blur(6px);
}

/* back */
.ks-back{
  font-size:22px;
  cursor:pointer;
  opacity:.8;
}

.ks-back:hover{
  opacity:1;
}

/* center title */
.ks-center{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.ks-title{
  font-weight:700;
  font-size:18px;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.ks-sub{
  font-size:11px;
  opacity:.6;
  letter-spacing:.5px;
}

/* right wallet */
.ks-wallet{
  text-align:right;
}

.ks-diamond{
  color:#00e6ff;
  font-weight:700;
}

.ks-bet{
  font-size:11px;
  opacity:.6;
}

/* ================= KING ROW ================= */
.ks-king-row{
  position:fixed;
  top:70px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
}

.ks-king-card{
  width:55px;
  height:80px;
  border-radius:10px;
  background:linear-gradient(180deg,#1a1a1a,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:1px solid rgba(255,215,0,.4);
  box-shadow:0 0 10px rgba(255,215,0,.3);
}

/* ================= ARENA ================= */
.ks-arena{
  position:absolute;
  top:160px;
  left:0;
  right:0;
  bottom:140px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ks-battle{
  display:flex;
  gap:60px;
}

.ks-big-card{
  width:130px;
  height:190px;
  border-radius:16px;
  background:linear-gradient(180deg,#111,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  box-shadow:0 0 30px rgba(0,0,0,.8);
}

/* ================= PLAYER ROW ================= */
.ks-player-row{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:10px;
}

.ks-player-card{
  width:65px;
  height:95px;
  border-radius:12px;
  background:linear-gradient(180deg,#141414,#050505);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  cursor:pointer;
  border:1px solid rgba(0,255,200,.4);
  box-shadow:0 0 10px rgba(0,255,200,.3);
  transition:.2s;
}

.ks-player-card:hover{
  transform:translateY(-10px);
}

/* ================= RESULT ================= */
.ks-result{
  position:absolute;
  bottom:110px;
  left:0;
  right:0;
  text-align:center;
  font-weight:700;
  font-size:18px;
}
</style>
</head>

<body>

<div class="ks-header">

  <div class="ks-back" onclick="history.back()">
    ←
  </div>

  <div class="ks-center">
    <div class="ks-title">👑 King vs Slave</div>
    <div class="ks-sub">Bắt vua để chiến thắng</div>
  </div>

  <div class="ks-wallet">
    <div class="ks-diamond">
      💎 <span id="diamondValue">0</span>
    </div>
    <div class="ks-bet">
      Bet: <span id="currentBet">0</span>
    </div>
  </div>

</div>

<!-- KING CARDS -->
<div id="kingRow" class="ks-king-row"></div>

<!-- ARENA -->
<div class="ks-arena">
  <div class="ks-battle">
    <div id="playerBig" class="ks-big-card">?</div>
    <div id="kingBig" class="ks-big-card">?</div>
  </div>
</div>

<div id="result" class="ks-result"></div>

<!-- PLAYER CARDS -->
<div id="playerRow" class="ks-player-row"></div>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{ uid: localStorage.getItem("uid") }
});

let roundActive = false;
let betPlaced = false;
let playerDeck = ["slave","normal","normal","normal","normal"];
let kingCount = 5;

const map = {
  king:"👑",
  slave:"🔒",
  normal:"👤"
};

/* ================= DIAMOND UPDATE ================= */

socket.on("diamond-update", data=>{
  document.getElementById("diamondValue").textContent =
    data.diamonds;
});

/* ================= PLACE BET ================= */

function placeBet(){

  const bet = Number(
    document.getElementById("betInput").value
  );

  if(!bet || bet<=0){
    alert("Bet không hợp lệ");
    return;
  }

  socket.emit("kvs-bet",{ bet });
}

/* ================= BET OK ================= */

socket.on("kvs-bet-ok", data=>{
  betPlaced = true;
  roundActive = true;
  kingCount = 5;
  playerDeck = ["slave","normal","normal","normal","normal"];

  document.getElementById("result").textContent =
    "Đã cược 💎 " + data.bet;

document.getElementById("currentBet").textContent = data.bet;

  renderKing();
  renderPlayer();
});

/* ================= PLAY CARD ================= */

function playCard(index){
  if(!roundActive || !betPlaced) return;
  socket.emit("kvs-play-card",{ index });
}

/* ================= RESULT ================= */

socket.on("kvs-result", data=>{

  document.getElementById("currentBet").textContent = 0;

  document.getElementById("playerBig").textContent =
    map[data.playerCard];

  document.getElementById("kingBig").textContent =
    map[data.kingCard];

  kingCount--;

  const resultEl =
    document.getElementById("result");

  if(data.result==="win"){
    resultEl.textContent =
      "🔥 THẮNG +" + data.win + " 💎";
    resultEl.style.color="#00ff88";
    roundActive=false;
    betPlaced=false;
  }
  else if(data.result==="lose"){
    resultEl.textContent="💀 Thua";
    resultEl.style.color="#ff4444";
    roundActive=false;
    betPlaced=false;
  }
  else{
    resultEl.textContent="🤝 Hòa";
    resultEl.style.color="#ffaa00";
  }

  renderKing();
  renderPlayer();
});

/* ================= RENDER ================= */

function renderKing(){
  const row=document.getElementById("kingRow");
  row.innerHTML="";
  for(let i=0;i<kingCount;i++){
    const div=document.createElement("div");
    div.className="ks-king-card";
    div.textContent="🂠";
    row.appendChild(div);
  }
}

function renderPlayer(){
  const row=document.getElementById("playerRow");
  row.innerHTML="";
  playerDeck.forEach((_,i)=>{
    const div=document.createElement("div");
    div.className="ks-player-card";
    div.textContent="🂠";
    div.onclick=()=>playCard(i);
    row.appendChild(div);
  });
}

renderKing();
renderPlayer();

</script>

</body>
</html>
