<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King vs Slave</title>

<style>

/* ================= BASE ================= */
html,body{
  margin:0;
  background:#050508;
  font-family: system-ui, sans-serif;
  color:#fff;
  overflow:hidden;
}

/* ===== HEADER ===== */
.ks-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0a0a12,#050508);
  border-bottom:1px solid rgba(255,255,255,.05);
  z-index:10;
}

.ks-title{
  font-weight:700;
  letter-spacing:.5px;
}

.back-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
}

/* ===== MAIN AREA ===== */
.ks-wrap{
  padding-top:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  height:100vh;
}

/* ===== ARENA ===== */
.ks-arena{
  margin-top:20px;
  width:100%;
  max-width:500px;
  height:260px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ks-arena::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,215,0,.25), transparent 60%);
  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%{opacity:.4}
  50%{opacity:.9}
  100%{opacity:.4}
}

/* ===== CARD ===== */
.ks-card{
  width:120px;
  height:170px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  font-weight:700;
  background:linear-gradient(180deg,#111,#000);
  box-shadow:
    0 0 30px rgba(255,255,255,.05),
    0 10px 30px rgba(0,0,0,.7);
  transition:.3s;
}

.ks-card.player{ position:absolute; left:20px; }
.ks-card.bot{ position:absolute; right:20px; }

/* ===== SELECT ===== */
.ks-select{
  margin-top:30px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.ks-option{
  width:80px;
  height:110px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  cursor:pointer;
  background:linear-gradient(180deg,#151515,#050505);
  border:1px solid rgba(255,255,255,.08);
  transition:.2s;
}

.ks-option:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px rgba(255,215,0,.4);
}

/* ===== RESULT ===== */
.ks-result{
  margin-top:25px;
  font-size:20px;
  font-weight:700;
  min-height:28px;
  text-align:center;
}

/* ===== BUTTON ===== */
.ks-btn{
  margin-top:20px;
  padding:10px 26px;
  border:none;
  border-radius:10px;
  font-weight:600;
  background:linear-gradient(90deg,#ff007a,#ff4c00);
  color:#fff;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="ks-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="ks-title">👑 King vs Slave</div>
  <div style="width:30px"></div>
</div>

<div class="ks-wrap">

  <div class="ks-arena">
    <div id="playerCard" class="ks-card player">?</div>
    <div id="botCard" class="ks-card bot">?</div>
  </div>

  <div id="cardArea" class="ks-select"></div>

  <div id="result" class="ks-result"></div>

  <button class="ks-btn" onclick="startRound()">Chơi lại</button>

</div>

<script>

/* ================= GAME LOGIC ================= */

let playerDeck = [];
let kingDeck   = [];
let roundActive = false;

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function startRound(){
  playerDeck = shuffle(["slave","normal","normal","normal","normal"]);
  kingDeck   = shuffle(["king","normal","normal","normal","normal"]);

  document.getElementById("playerCard").textContent = "?";
  document.getElementById("botCard").textContent = "?";
  document.getElementById("result").textContent = "";

  roundActive = true;
  renderCards();
}

function renderCards(){
  const area = document.getElementById("cardArea");
  area.innerHTML = "";

  playerDeck.forEach((_,index)=>{
    const div = document.createElement("div");
    div.className = "ks-option";
    div.textContent = "🂠";
    div.onclick = ()=>playCard(index);
    area.appendChild(div);
  });
}

function playCard(index){

  if(!roundActive) return;

  const playerCard = playerDeck.splice(index,1)[0];
  const kingCard   = kingDeck.shift();

  const map = {
    king:"👑",
    slave:"🔒",
    normal:"👤"
  };

  const playerEl = document.getElementById("playerCard");
  const botEl    = document.getElementById("botCard");
  const resultEl = document.getElementById("result");

  playerEl.textContent = map[playerCard];
  botEl.textContent    = map[kingCard];

  /* ===== RULES ===== */

  // WIN
  if(playerCard==="slave" && kingCard==="king"){
    resultEl.textContent = "🔥 BẮT ĐƯỢC VUA! BẠN THẮNG!";
    resultEl.style.color = "#00ff88";
    roundActive = false;
    return;
  }

  // LOSE
  if(playerCard==="slave" && kingCard==="normal"){
    resultEl.textContent = "💀 Nô lệ lộ diện trước... Bạn thua!";
    resultEl.style.color = "#ff4444";
    roundActive = false;
    return;
  }

  if(playerCard==="normal" && kingCard==="king"){
    resultEl.textContent = "💀 Vua xuất hiện! Bạn thua!";
    resultEl.style.color = "#ff4444";
    roundActive = false;
    return;
  }

  // DRAW
  if(playerCard==="normal" && kingCard==="normal"){
    resultEl.textContent = "🤝 Dân thường gặp nhau... Tiếp tục!";
    resultEl.style.color = "#ffaa00";

    // hết bài mà chưa bắt được vua
    if(playerDeck.length === 0){
      resultEl.textContent = "💀 Không bắt được vua!";
      resultEl.style.color = "#ff4444";
      roundActive = false;
      return;
    }

    renderCards();
  }
}

startRound();

</script>

</body>
</html>
