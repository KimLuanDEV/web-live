<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>King vs Slave • Livestream Pro</title>

  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root{
      --bg:#050508;
      --glass: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.09);
      --txt: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.58);

      --red:#ff3b3b;
      --gold:#ffcc66;
      --cyan:#00f0ff;
      --green:#41ff9b;

      --safeTop: env(safe-area-inset-top, 0px);
      --safeBot: env(safe-area-inset-bottom, 0px);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(circle at 30% 15%, rgba(255,60,60,.18), transparent 45%),
                  radial-gradient(circle at 75% 35%, rgba(0,240,255,.14), transparent 48%),
                  radial-gradient(circle at 50% 85%, rgba(255,204,102,.10), transparent 55%),
                  #050508;
      color:var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
      padding-bottom: var(--safeBot);
    }

 /* ===== TOPBAR NEW ===== */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;

  padding-top: calc(12px + var(--safeTop));
  padding-bottom: 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding-left:16px;
  padding-right:16px;

  z-index:50;

  background: linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.45));
  backdrop-filter: blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.tb-side{
  width:110px;
  display:flex;
  align-items:center;
}

.tb-left{
  justify-content:flex-start;
}

.tb-right{
  justify-content:flex-end;
}

.tb-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  line-height:1.1;
}

.title{
  font-weight:900;
  font-size:17px;
  letter-spacing:.6px;
}


.back{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.2s;
}

.back:hover{
  background:rgba(255,255,255,.15);
}

.wallet{
  padding:8px 14px;
  border-radius:14px;
  font-size:13px;
}


    /* ===== LAYOUT ===== */
.wrap{
  position:fixed;
  inset:0;

  padding-top: calc(76px + var(--safeTop));
  padding-bottom: calc(120px + var(--safeBot));

  display:flex;
  flex-direction:column;
  gap:12px;
}

    /* ===== KING ROW (TOP) ===== */
    .king-row{
      padding: 0 12px;
    }
    .row-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin: 2px 2px 10px;
    }
    .row-head .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      font-size:12px;
      letter-spacing:.4px;
      text-transform:uppercase;
      color: rgba(255,255,255,.9);
    }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:28px;height:28px;border-radius:10px;
      background: radial-gradient(circle at top, rgba(255,204,102,.9), rgba(180,100,0,.9));
      box-shadow: 0 0 16px rgba(255,204,102,.35);
      border:1px solid rgba(255,255,255,.18);
      font-size:14px;
    }
    .phase{
      font-size:11px;
      color:var(--muted);
    }

    .card-row{
      display:flex;
      gap:10px;
      justify-content:space-between;
    }

    /* Card base */
    .card{
      width: calc((100% - 40px) / 5);
      height: 86px;
      flex: none;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      transform: translateZ(0);
      box-shadow: 0 16px 28px rgba(0,0,0,.38);
    }
    .card::before{
      content:"";
      position:absolute; inset:0;
      display:none;
      opacity:.9;
      pointer-events:none;
    }

/* ===== CARD IMAGE MODE ===== */
.card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}



    /* King vibe */
    .card.king{
      background: linear-gradient(180deg, rgba(255,60,60,.22), rgba(0,0,0,.35));
      border-color: rgba(255,60,60,.25);
    }

    /* Player vibe */
    .card.slave{
      background: linear-gradient(180deg, rgba(0,240,255,.18), rgba(0,0,0,.35));
      border-color: rgba(0,240,255,.22);
    }


    /* States */
    .card.hidden-face .label{opacity:0}
    .card.cover::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(0,0,0,.2), rgba(0,0,0,.55)),
                  repeating-linear-gradient(45deg,
                    rgba(255,204,102,.08) 0 10px,
                    rgba(255,204,102,.00) 10px 20px
                  );
      opacity:1;
    }

    .card.reveal{
      animation: flipIn .35s ease-out both;
    }
    @keyframes flipIn{
      from{transform: rotateY(18deg) translateY(6px); filter: blur(.2px); opacity:.6}
      to{transform: rotateY(0deg) translateY(0); opacity:1}
    }

    .card.win{
      border-color: rgba(65,255,155,.55);
      box-shadow: 0 0 0 2px rgba(65,255,155,.18), 0 16px 28px rgba(0,0,0,.38);
    }
    .card.lose{
      border-color: rgba(255,60,60,.60);
      box-shadow: 0 0 0 2px rgba(255,60,60,.18), 0 16px 28px rgba(0,0,0,.38);
    }
    .card.draw{
      border-color: rgba(255,204,102,.55);
      box-shadow: 0 0 0 2px rgba(255,204,102,.14), 0 16px 28px rgba(0,0,0,.38);
    }

    /* ===== CENTER PANEL ===== */
    .center{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 14px;
      min-height: 260px;
    }

  .panel{
  width:min(520px, 100%);
  border-radius:26px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(180deg, rgba(15,15,20,.95), rgba(10,10,15,.85));
  backdrop-filter: blur(18px);
  box-shadow:
    0 30px 80px rgba(0,0,0,.65),
    inset 0 0 40px rgba(0,0,0,.6);
  overflow:hidden;
  position:relative;
}

    
    .panel.hide{
  opacity:0;
  transform: translateY(20px) scale(.98);
  pointer-events:none;
  transition: all .25s ease;
}




    .panel::before{
      content:"";
      position:absolute; inset:-1px;
      background: radial-gradient(circle at 30% 0%, rgba(255,60,60,.18), transparent 55%),
                  radial-gradient(circle at 70% 100%, rgba(0,240,255,.14), transparent 55%);
      pointer-events:none;
    }


.betBox{
  border-radius:20px;
  border:1px solid rgba(255,255,255,.08);
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.3));
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:12px;
  box-shadow: inset 0 0 25px rgba(0,0,0,.4);
}

    .betRow{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .betRow input{
      flex:1;
      height:44px;
      padding: 0 12px;
      border-radius: 14px;
      border:1px solid rgba(0,240,255,.18);
      background:rgba(0,0,0,.6);
      color:#fff;
      outline:none;
      font-weight:800;
      font-size:15px;
      box-shadow: inset 0 0 20px rgba(0,0,0,.6);
    }
    .btn{
      height:44px;
      padding: 0 14px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }




    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

 .quick{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:8px;
  margin-top:4px;
}

.chip{
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.12);
  font-size:12px;
  font-weight:800;
  transition:.2s;
  cursor:pointer;
}

.chip:hover{
  background:rgba(0,240,255,.15);
  border-color:rgba(0,240,255,.4);
  transform: translateY(-2px);
}

 .statusLine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  padding:8px 10px;
  border-radius:12px;
  background:rgba(255,255,255,.04);
}

    .statusLine b{color:#fff}

    /* ===== PLAYER ROW (BOTTOM) ===== */
.player-row{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  padding-top:12px;
  padding-left:12px;
  padding-right:12px;
  background: linear-gradient(180deg, rgba(0,0,0,.0), rgba(0,0,0,.95));
  backdrop-filter: blur(14px);

  border-top:1px solid rgba(255,255,255,.06);
  z-index:40;
}
    /* ===== OVERLAY RESULT ===== */
    .overlay{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:80;
    }
    .overlay.show{display:flex}
    .overlay .backdrop{
      position:absolute; inset:0;
      background: rgba(0,0,0,.72);
      backdrop-filter: blur(8px);
    }
    .modal{
      position:relative;
      width:min(520px, 92vw);
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(10,10,14,.90);
      box-shadow: 0 30px 80px rgba(0,0,0,.65);
      overflow:hidden;
      padding: 16px;
    }
    .modal .mTitle{
      font-weight:1000;
      font-size:18px;
      letter-spacing:.4px;
    }
    .modal .mSub{
      margin-top:6px;
      font-size:12px;
      color: rgba(255,255,255,.70);
      line-height:1.45;
    }
    .modal .mGrid{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .mCard{
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      padding: 12px;
    }
    .mCard .k{
      font-size:11px;
      color: rgba(255,255,255,.58);
    }
    .mCard .v{
      margin-top:6px;
      font-size:15px;
      font-weight:900;
    }
    .modal .mBtns{
      margin-top:14px;
      display:flex;
      gap:10px;
    }
    .spark{
      position:absolute;
      inset:-80px;
      background: radial-gradient(circle at 50% 35%, rgba(0,240,255,.12), transparent 55%),
                  radial-gradient(circle at 35% 60%, rgba(255,60,60,.10), transparent 58%);
      pointer-events:none;
      animation: breathe 2.8s ease-in-out infinite;
    }
    @keyframes breathe{
      0%{opacity:.55; transform: scale(1)}
      50%{opacity:.95; transform: scale(1.04)}
      100%{opacity:.55; transform: scale(1)}
    }


    /* small screens */
    @media (max-width:420px){
      .card{height:78px;border-radius:14px}
    }



    /* ===== ARENA BACKGROUND LAYER ===== */
.center{
  position:relative;
}

.arena-bg{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  pointer-events:none;
}

.panel{
  position:relative;
  z-index:5;
}

/* fight zone */
.fight-zone{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:60px;
}

.slot{
  width:120px;
  height:160px;
  border-radius:20px;
  border:2px dashed rgba(255,255,255,.15);
  background:rgba(255,255,255,.03);
  backdrop-filter: blur(4px);
}

.vs-text{
  font-size:30px;
  font-weight:900;
  opacity:.25;
}



.slot.combat{
  animation: shake .25s ease;
}

@keyframes shake{
  0%{transform: translateX(0)}
  25%{transform: translateX(-6px)}
  50%{transform: translateX(6px)}
  75%{transform: translateX(-4px)}
  100%{transform: translateX(0)}
}




.betActions{
  display:flex;
  gap:10px;
  margin-top:4px;
}

.btn.ghost{
  flex:1;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
}

.btn.primary{
  flex:1;
  background: linear-gradient(180deg, rgba(0,240,255,.35), rgba(0,120,140,.4));
  border:1px solid rgba(0,240,255,.5);
  box-shadow:0 0 30px rgba(0,240,255,.25);
}


.betDisplay{
  flex:1;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:14px;
  border:1px solid rgba(0,240,255,.18);
  background:rgba(0,0,0,.6);

  font-weight:900;
  font-size:15px;
  letter-spacing:.5px;

  box-shadow: inset 0 0 20px rgba(0,0,0,.6);
}



/* =========================
   GLOBAL PHASE BAR
   ========================= */

.global-phase{
  position:fixed;
  top: calc(310px + var(--safeTop));
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  z-index:0;
  pointer-events:none;
}

.phase-pill{
  padding:8px 22px;
  border-radius:40px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.6px;

  backdrop-filter: blur(14px);
  border:1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.5));

  box-shadow:
    0 0 30px rgba(0,240,255,.15),
    inset 0 0 20px rgba(0,0,0,.6);

  transition:.3s;
}

/* trạng thái */

.phase-pill.waiting{
  border-color: rgba(255,204,102,.5);
  box-shadow: 0 0 30px rgba(255,204,102,.35);
}

.phase-pill.picking{
  border-color: rgba(0,240,255,.6);
  box-shadow: 0 0 35px rgba(0,240,255,.4);
}

.phase-pill.result{
  border-color: rgba(65,255,155,.6);
  box-shadow: 0 0 35px rgba(65,255,155,.4);
}

.phase-pill.lose{
  border-color: rgba(255,60,60,.6);
  box-shadow: 0 0 35px rgba(255,60,60,.4);
}

  </style>
</head>

<body>

<div class="topbar">

<script>
/* =========================
   SOCKET AUTH (giống invest.js)
   ========================= */
const me = JSON.parse(localStorage.getItem("user_profile") || "{}");

let deviceId = localStorage.getItem("device_id");
if (!deviceId) {
  deviceId = "dev_" + Math.random().toString(36).slice(2);
  localStorage.setItem("device_id", deviceId);
}

const socket = io({
  auth: { 
    uid: me?.uid || null,
    deviceId 
  }
});



/* =========================
   UI refs
   ========================= */
const diamondEl = document.getElementById("diamondValue");
const kingRow = document.getElementById("kingRow");
const playerRow = document.getElementById("playerRow");
const phaseText = document.getElementById("phaseText");


const betDisplay = document.getElementById("betDisplay");
const betBtn = document.getElementById("betBtn");
const myBetText = document.getElementById("myBetText");
const statusText = document.getElementById("statusText");
const roundText = document.getElementById("roundText");
const resultText = document.getElementById("resultText");
const clearBetBtn = document.getElementById("clearBetBtn");



const panel = document.querySelector(".panel");

/* modal */
const overlay = document.getElementById("overlay");
const mTitle = document.getElementById("mTitle");
const mSub = document.getElementById("mSub");
const mYou = document.getElementById("mYou");
const mKing = document.getElementById("mKing");
const mBet = document.getElementById("mBet");
const mWin = document.getElementById("mWin");

document.getElementById("mOk").onclick = ()=>{
  overlay.classList.remove("show");
  resetArena();
};



/* =========================
   Local state
   ========================= */
let diamonds = 0;
let roundId = 1;
let myBet = 0;
let canPick = false;
let picked = false;
let pickedIndex = -1;
let usedPlayerCards = new Set();
let usedKingCards = new Set();
let currentBetValue = 0;

/* Deck definitions */
const KING_DECK = ["Civilian","Civilian","KING","Civilian","Civilian"];
const SLAVE_DECK = ["Civilian","Civilian","SLAVE","Civilian","Civilian"];


// ================================
// 💎 Fallback lấy từ localStorage
// ================================
if (me?.coins != null) {
  diamonds = Number(me.coins);
  diamondEl.textContent = diamonds.toLocaleString("en-US");
}

function buildRow(el, type){
  el.innerHTML = "";
  const deck = type === "king" ? KING_DECK : SLAVE_DECK;

  deck.forEach((t, idx)=>{

    const card = document.createElement("div");
    card.className = "card cover " + (
      type === "king"
        ? (t==="KING" ? "king" : "common-king")
        : (t==="SLAVE" ? "slave" : "common-player")
    );

    card.dataset.idx = idx;
    card.dataset.t = t;

    // ===== IMAGE =====
    const img = document.createElement("img");
    img.src = "/assets/ks/card-back.png";
    card.appendChild(img);



    // ===== CLICK PLAYER =====
    if(type === "player"){
      card.addEventListener("click", ()=>{
        if(!canPick || picked) return;
        if(usedPlayerCards.has(idx)) return;

        picked = true;
        pickedIndex = idx;

        socket.emit("ks-pick", { index: idx });
        flashPick(card);
      });
    }

    el.appendChild(card);
  });
}

function flashPick(card){
  card.classList.remove("win","lose","draw");
  card.classList.add("reveal");
  setTimeout(()=>card.classList.remove("reveal"), 380);
}

function setPhase(text){

  const el = document.getElementById("phaseText");

  el.textContent = text;

  el.classList.remove("waiting","picking","result","lose");

  if(text.includes("Please place your bet")){
    el.classList.add("waiting");
  }
  else if(text.includes("Select")){
    el.classList.add("picking");
  }
  else if(text.includes("Draw")){
    el.classList.add("result");
  }
  else if(text.includes("End")){
    el.classList.add("result");
  }
}


function setStatus(text){
  statusText.textContent = text;
}

function openPick(){
  canPick = true;
  picked = false;
  pickedIndex = -1;
  
  setPhase("Bet placed • Select card");
  setStatus("Selecting a card");
  // mở bài player
  [...playerRow.children].forEach(c=>{
    c.classList.remove("cover");
  });
}

function lockAll(){
  canPick = false;
  
}


function resetArena(){

  const kingSlot = document.getElementById("kingSlot");
  const playerSlot = document.getElementById("playerSlot");

  if(kingSlot){
    kingSlot.innerHTML = "";
    kingSlot.classList.remove("combat");
  }

  if(playerSlot){
    playerSlot.innerHTML = "";
    playerSlot.classList.remove("combat");
  }
}


function resetUIForNewRound(data){

    resetArena();

  // 🔥 Reset danh sách bài đã dùng
  usedPlayerCards.clear();
  usedKingCards.clear();

  roundId = data?.roundId || (roundId + 1);
  roundText.textContent = "#" + roundId;

  currentBetValue = 0;
  betDisplay.textContent = "0 💎";
  resultText.textContent = "—";
  setStatus("Waiting for a bet");
  setPhase("Not yet bet");
  

  canPick = false;
  picked = false;
  pickedIndex = -1;
  

  buildRow(kingRow, "king");
  buildRow(playerRow, "player");

  // 🔥 Reset lại style các lá bài (đặt ở đây)
  [...playerRow.children].forEach(c=>{
    c.style.opacity = "1";
    c.style.pointerEvents = "auto";
    c.style.transform = "";
  });

  [...kingRow.children].forEach(c=>{
  c.style.opacity = "1";
  c.style.pointerEvents = "auto";
  c.style.transform = "";
});


}

/* =========================
   Quick chips
   ========================= */
document.querySelectorAll(".chip").forEach(ch=>{
  ch.addEventListener("click", ()=>{
    const x = ch.dataset.x;
    const add = ch.dataset.add;

    if(x){
      const v = Math.floor(diamonds * Number(x));
      currentBetValue = v > 0 ? v : 0;
    }
    if(add){
      currentBetValue += Math.floor(Number(add));
    }

    betDisplay.textContent =
      currentBetValue.toLocaleString("en-US") + " 💎";
  });
});
/* =========================
   Bet
   ========================= */
betBtn.onclick = ()=>{
  const bet = currentBetValue;
  if(!bet || bet <= 0) return;
  socket.emit("ks-bet", { bet });
};

clearBetBtn.onclick = ()=>{
  currentBetValue = 0;
  betDisplay.textContent = "0 💎";
  myBetText.textContent = "0";
  resultText.textContent = "—";
  setStatus("Đã reset cược");
};



function animateToArena(cardEl, targetEl){

     if(!cardEl || !targetEl) return; // 💥 chống crash


  const rect1 = cardEl.getBoundingClientRect();
  const rect2 = targetEl.getBoundingClientRect();

  const dx = rect2.left - rect1.left;
  const dy = rect2.top - rect1.top;

  cardEl.style.position = "fixed";
  cardEl.style.left = rect1.left + "px";
  cardEl.style.top = rect1.top + "px";
  cardEl.style.width = rect1.width + "px";
  cardEl.style.height = rect1.height + "px";
  cardEl.style.zIndex = 1000;

  document.body.appendChild(cardEl);

  requestAnimationFrame(()=>{
    cardEl.style.transition = "all .45s cubic-bezier(.2,.8,.2,1)";
    cardEl.style.left = rect2.left + "px";
    cardEl.style.top = rect2.top + "px";
  });

  setTimeout(()=>{
    cardEl.style.transition = "none";
    cardEl.style.position = "relative";
    cardEl.style.left = "";
    cardEl.style.top = "";
    cardEl.style.width = "100%";
    cardEl.style.height = "100%";
    cardEl.style.zIndex = "";

    targetEl.innerHTML = "";
    targetEl.appendChild(cardEl);
  }, 450);
}



/* =========================
   Socket events
   ========================= */
socket.on("connect", ()=>{
  // xin state
  socket.emit("ks-get-state");
});



socket.on("coin-update", (d)=>{
  diamonds = Math.floor(Number(d?.coins || 0));
  diamondEl.textContent = diamonds.toLocaleString("en-US");

  if(me){
    me.coins = diamonds;
    localStorage.setItem("user_profile", JSON.stringify(me));
  }
});

socket.on("ks-state", (s)=>{
  // { roundId, myBet, phase }
  resetUIForNewRound({ roundId: s.roundId });

  if(s.myBet && s.myBet > 0){
    myBet = s.myBet;
    myBetText.textContent = myBet.toLocaleString("en-US");
    currentBetValue = myBet;
    betDisplay.textContent = myBet.toLocaleString("en-US") + " 💎";
    openPick();
  }
});

socket.on("ks-bet-ok", (d)=>{

  myBet = d.bet;
  myBetText.textContent = myBet.toLocaleString("en-US");

  setStatus("Bet placed successfully");

  // 🔥 ẨN PANEL
  panel.classList.add("hide");

  // 🔥 BUILD LẠI DECK CHẮC CHẮN
  buildRow(kingRow, "king");
  buildRow(playerRow, "player");

  // 🔥 KING vẫn úp
  [...kingRow.children].forEach(c=>{
    c.classList.add("cover");
  });

  // 🔥 PLAYER mở mặt ngay
  [...playerRow.children].forEach(c=>{
    c.classList.remove("cover");

    const t = c.dataset.t;
    const img = c.querySelector("img");

    if(t==="SLAVE"){
      img.src = "/assets/ks/card-slave.png";
    }else{
      img.src = "/assets/ks/card-common.png";
    }
  });

  canPick = true;
  picked = false;
  pickedIndex = -1;

  setPhase("Bet placed • Select card");
});


socket.on("ks-error", (e)=>{
  const msg = e?.message || "Lỗi";
  setStatus("❌ " + msg);
});

socket.on("ks-round-new", (d)=>{
  panel.classList.remove("hide");
  resetUIForNewRound(d);
});

socket.on("ks-result", (r)=>{

  lockAll();

  const kingIdx = r.kingIndex;
  const youIdx  = r.youIndex;


usedPlayerCards.add(youIdx);
usedKingCards.add(kingIdx);

const kCard = kingRow.querySelector(`[data-idx="${kingIdx}"]`);
const yCard = playerRow.querySelector(`[data-idx="${youIdx}"]`);

  // mở bài nhưng chưa highlight
  [...kingRow.children].forEach(c=>c.classList.remove("cover"));
  [...playerRow.children].forEach(c=>c.classList.remove("cover"));


// Đổi ảnh khi mở bài
[...kingRow.children].forEach(c=>{
  const t = c.dataset.t;
  const img = c.querySelector("img");
  if(!img) return;

  if(t==="KING") img.src = "/assets/ks/card-king.png";
  else img.src = "/assets/ks/card-common.png";
});

[...playerRow.children].forEach(c=>{
  const t = c.dataset.t;
  const img = c.querySelector("img");
  if(!img) return;

  if(t==="SLAVE") img.src = "/assets/ks/card-slave.png";
  else img.src = "/assets/ks/card-common.png";
});



  // 1️⃣ Player bay trước
  if(yCard){
  animateToArena(yCard, document.getElementById("playerSlot"));
}

  // 2️⃣ King bay sau
setTimeout(()=>{
  if(kCard){
    animateToArena(kCard, document.getElementById("kingSlot"));
  }
}, 400);

  // 3️⃣ Combat rung nhẹ
  setTimeout(()=>{
    document.getElementById("playerSlot").classList.add("combat");
    document.getElementById("kingSlot").classList.add("combat");
  }, 900);

  setTimeout(()=>{
    document.getElementById("playerSlot").classList.remove("combat");
    document.getElementById("kingSlot").classList.remove("combat");
  }, 1200);

  // 4️⃣ Sau animation mới highlight + hiện modal
  setTimeout(()=>{

    const cls = r.result;

    const pSlot = document.getElementById("playerSlot").firstChild;
    const kSlot = document.getElementById("kingSlot").firstChild;

    if(pSlot) pSlot.classList.add(cls);
    if(kSlot) kSlot.classList.add(cls);

    resultText.textContent =
      (cls==="win" ? "WIN ✅" : cls==="lose" ? "LOSE ❌" : "DRAW 🔁");

    setPhase(cls==="draw" ? "Draw • Select card" : "End • New round");
    setStatus(cls==="draw" ? "Draw → Select card" : "Result");

    mTitle.textContent =
      cls==="win" ? "You Win!" :
      cls==="lose" ? "You Lose!" : "Draw!";

    mSub.textContent =
      cls==="draw"
        ? ""
        : "";

    mYou.textContent = r.you;
    mKing.textContent = r.king;
    mBet.textContent = String(r.bet);
    mWin.textContent = String(r.win);

    overlay.classList.add("show");


    // 🔄 AUTO NEXT ROUND (chỉ khi không phải draw)
if(r.result !== "draw"){
  setTimeout(()=>{
    overlay.classList.remove("show");
    resetArena();
    socket.emit("ks-next"); // server tạo round mới
  }, 3000);
}


  }, 1600);

});

socket.on("ks-open-pick", ()=>{
  // draw → cho chọn lại
  openPick();
});

/* init deck */
buildRow(kingRow, "king");
buildRow(playerRow, "player");
resetUIForNewRound({ roundId: 1 });

</script>
