<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               minimum-scale=1,
               user-scalable=no,
               viewport-fit=cover">
  <title>King vs Slave • Livestream Pro</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root{
      --bg:#050508;
      --glass: rgba(255,255,255,.06);
      --line: rgba(255,255,255,.09);
      --txt: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.58);

      --red:#ff3b3b;
      --gold:#ffcc66;
      --cyan:#00f0ff;
      --green:#41ff9b;

      --safeTop: env(safe-area-inset-top, 0px);
      --safeBot: env(safe-area-inset-bottom, 0px);
    }

    *{box-sizing:border-box}


html{
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
}


html, body{
  height:100%;
  background:#050508;  /* chặn đáy trắng */
}

body{
  margin:0;

  background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
    url("/assets/ks/bg-king-slave.jpg");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  /* ❌ iOS hay lỗi, bỏ đi */
  /* background-attachment: fixed; */

  color:var(--txt);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  overflow:hidden;

  /* chặn kéo bung nền trắng */
  overscroll-behavior: none;
}



/* =========================
   HIDE GAME BEFORE LOADED
   ========================= */

body.loading .topbar,
body.loading .global-phase,
body.loading .wrap,
body.loading .player-row,
body.loading .sheet-overlay {
  opacity: 0;
  pointer-events: none;
}

.topbar,
.global-phase,
.wrap,
.player-row,
.sheet-overlay {
  transition: opacity .5s ease;
}




/* =========================
   TOPBAR • DEMON ALTAR
   ========================= */
.topbar{
  position:fixed;
  top:0; left:0; right:0;
  z-index:50;

  padding-top: calc(10px + var(--safeTop));
  padding-bottom: 12px;
  padding-left:16px;
  padding-right:16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    radial-gradient(circle at 20% 0%, rgba(255,0,60,.22), transparent 45%),
    radial-gradient(circle at 80% 0%, rgba(0,240,255,.16), transparent 45%),
    linear-gradient(180deg, rgba(10,0,0,.98), rgba(0,0,0,.78));

  backdrop-filter: blur(18px);

  box-shadow:
    0 14px 50px rgba(0,0,0,.75),
    0 0 40px rgba(255,0,60,.18),
    inset 0 -1px 0 rgba(255,255,255,.06);

  overflow:hidden;
  
}

/* rune layer + ember dust */
.topbar::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,60,.18), transparent 55%),
    radial-gradient(circle at 30% 60%, rgba(255,120,0,.10), transparent 55%),
    radial-gradient(circle at 70% 55%, rgba(0,240,255,.10), transparent 55%),
    repeating-linear-gradient(45deg,
      rgba(255,0,60,.10) 0 2px,
      rgba(255,0,60,0) 2px 10px);
  filter: blur(10px);
  opacity:.75;
  pointer-events:none;
  animation: demonBreath 3.2s ease-in-out infinite;
}

/* blood-drip bar */
.topbar::after{
  content:"";
  position:absolute;
  left:0; right:0; bottom:-1px;
  height:10px;
  background:
    radial-gradient(circle at 12% 0%, rgba(255,0,60,.85), transparent 55%),
    radial-gradient(circle at 33% 0%, rgba(255,0,60,.65), transparent 60%),
    radial-gradient(circle at 57% 0%, rgba(255,0,60,.75), transparent 58%),
    radial-gradient(circle at 82% 0%, rgba(255,0,60,.60), transparent 62%),
    linear-gradient(90deg, transparent, rgba(255,0,60,.55), transparent);
  filter: blur(1.2px);
  opacity:.9;
  pointer-events:none;
}

@keyframes demonBreath{
  0%{transform: translateY(0) scale(1); opacity:.65}
  50%{transform: translateY(6px) scale(1.03); opacity:.95}
  100%{transform: translateY(0) scale(1); opacity:.65}
}

.tb-side{
  width:110px;
  display:flex;
  align-items:center;
 
}
.tb-left{
  justify-content:flex-start;
}
.tb-right{justify-content:flex-end}

.tb-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.1;
  height:80px;     /* tăng không gian */
}

/* Title “Hellfire” */
.title{
  font-weight:1000;
  font-size:18px;
  letter-spacing:1px;
  text-transform:uppercase;

  background: linear-gradient(90deg, #ffcc66, #ff2a2a, #8b0000, #00f0ff);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;

  text-shadow:
    0 0 14px rgba(255,0,60,.55),
    0 0 26px rgba(255,120,0,.35),
    0 0 22px rgba(0,240,255,.25);
}

/* =========================
   PURE DEMON SWORD BUTTON
   ========================= */

.back{
  background: none;
  border: none;
  padding: 0;
  margin: 0;

  width: 48px;
  height: 48px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  transition: transform .2s ease;
}

.back img{
  width: 42px;
  height: 42px;
  object-fit: contain;

  /* 🗡 lưỡi nghiêng trái 45° */
  transform: rotate(-45deg);

  filter:
    drop-shadow(0 0 8px rgba(255,0,0,.8))
    drop-shadow(0 0 20px rgba(255,60,60,.6));

  transition: transform .25s ease, filter .25s ease;
}

/* hover */
.back:hover img{
  transform: rotate(-45deg) scale(1.15);

  filter:
    drop-shadow(0 0 12px rgba(255,0,0,1))
    drop-shadow(0 0 30px rgba(255,120,0,.9));
}

/* click */
.back:active img{
  transform: rotate(-45deg) scale(.9);
}
@keyframes demonPulse{
  0%{filter: drop-shadow(0 0 8px rgba(255,0,0,.7))}
  50%{filter: drop-shadow(0 0 18px rgba(255,0,0,1))}
  100%{filter: drop-shadow(0 0 8px rgba(255,0,0,.7))}
}

.back img{
  animation: demonPulse 2.5s infinite;
}



/* Wallet: cursed capsule */
.wallet{
  padding:0;
  border-radius:0;

  display:flex;
  align-items:center;
  gap:6px;

  font-size:14px;
  font-weight:1000;

  background: none;
  border: none;
  box-shadow: none;
}

.wallet .d{
  font-size:14px;
  filter: drop-shadow(0 0 10px rgba(255,0,60,.35));
}
.wallet .v{
  font-size:14px;
  text-shadow:
    0 0 12px rgba(255,0,60,.35),
    0 0 16px rgba(0,240,255,.15);
  color:#ffcc66; 
}





    /* ===== LAYOUT ===== */
.wrap{
  position:fixed;
  inset:0;

  padding-top: calc(76px + var(--safeTop));
  padding-bottom: calc(120px + var(--safeBot));

  display:flex;
  flex-direction:column;
  gap:12px;
}



/* =========================
   KING ROW – ATTACHED HEADER
   ========================= */

.king-row{
  margin-top:-10px; /* kéo sát header */

  padding:16px 14px 14px;



  background:
    linear-gradient(180deg,
      rgba(0,0,0,.95) 0%,
      rgba(255,60,60,.08) 40%,
      rgba(0,0,0,.6) 100%);

  border-bottom:1px solid rgba(255,60,60,.35);

  box-shadow:
    0 10px 40px rgba(255,60,60,.12),
    inset 0 -20px 40px rgba(0,0,0,.6);

  position:relative;
  z-index:30;
}

.topbar{
  border-bottom: none;
}

.king-row::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg,
    transparent,
    rgba(255,60,60,.6),
    transparent);
  opacity:.6;
}



.king-row .tag{
  font-weight:1000;
  font-size:14px;
  letter-spacing:1.2px;
  color:#fff;

  text-shadow:
    0 0 12px rgba(255,204,102,.8),
    0 0 30px rgba(255,60,60,.6);
}


/* light beam dưới header */
.king-row::after{
  content:"";
  position:absolute;
  bottom:0;
  left:20px;
  right:20px;
  height:3px;

  background:linear-gradient(90deg,
    transparent,
    rgba(255,204,102,.8),
    transparent);

  filter:blur(3px);
  opacity:.6;
}
    
    .row-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin: 2px 2px 10px;
    }
    .row-head .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      font-size:12px;
      letter-spacing:.4px;
      text-transform:uppercase;
      color: rgba(255,255,255,.9);
    }
    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:28px;height:28px;border-radius:10px;
      background: radial-gradient(circle at top, rgba(255,204,102,.9), rgba(180,100,0,.9));
      box-shadow: 0 0 16px rgba(255,204,102,.35);
      border:1px solid rgba(255,255,255,.18);
      font-size:14px;
    }
    .phase{
      font-size:11px;
      color:var(--muted);
    }

    .card-row{
      display:flex;
      gap:10px;
      justify-content:space-between;
    }

    /* Card base */
 .card{
  width: calc((100% - 40px) / 5);
  height: 86px;
  flex: none;

  border-radius: 0;        /* ❌ bỏ bo góc */
  border: none;            /* ❌ bỏ viền */
  background: none;        /* ❌ bỏ nền */
  box-shadow: none;        /* ❌ bỏ đổ bóng */

  position:relative;
  overflow:visible;        /* cho ảnh full không bị cắt */
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  transform: translateZ(0);
}

    
    .card::before{
      content:"";
      position:absolute; inset:0;
      display:none;
      opacity:.9;
      pointer-events:none;
    }

/* ===== CARD IMAGE MODE ===== */
.card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit: fill;
  z-index:0;
  border-radius:16px;
}



    /* King vibe */
    .card.king{
      background: linear-gradient(180deg, rgba(255,60,60,.22), rgba(0,0,0,.35));
      border-color: rgba(255,60,60,.25);
    }

    /* Player vibe */
    .card.slave{
      background: linear-gradient(180deg, rgba(0,240,255,.18), rgba(0,0,0,.35));
      border-color: rgba(0,240,255,.22);
    }


    /* States */
    .card.hidden-face .label{opacity:0}
    .card.cover::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(0,0,0,.2), rgba(0,0,0,.55)),
                  repeating-linear-gradient(45deg,
                    rgba(255,204,102,.08) 0 10px,
                    rgba(255,204,102,.00) 10px 20px
                  );
      opacity:1;
    }

    .card.reveal{
      animation: flipIn .35s ease-out both;
    }
    @keyframes flipIn{
      from{transform: rotateY(18deg) translateY(6px); filter: blur(.2px); opacity:.6}
      to{transform: rotateY(0deg) translateY(0); opacity:1}
    }

    .card.win{
      border-color: rgba(65,255,155,.55);
      box-shadow: 0 0 0 2px rgba(65,255,155,.18), 0 16px 28px rgba(0,0,0,.38);
    }
    .card.lose{
      border-color: rgba(255,60,60,.60);
      box-shadow: 0 0 0 2px rgba(255,60,60,.18), 0 16px 28px rgba(0,0,0,.38);
    }
    .card.draw{
      border-color: rgba(255,204,102,.55);
      box-shadow: 0 0 0 2px rgba(255,204,102,.14), 0 16px 28px rgba(0,0,0,.38);
    }

    /* ===== CENTER PANEL ===== */
    .center{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 0 14px;
      min-height: 260px;
    }

.panel{
  width:min(520px, 100%);
  border-radius:0;

  background: transparent;   /* 🔥 bỏ nền đỏ */
  border:none;               /* 🔥 bỏ viền */
  box-shadow:none;           /* 🔥 bỏ glow */

  position:relative;
  overflow:visible;
}



    


    .panel.hide{
  opacity:0;
  transform: translateY(20px) scale(.98);
  pointer-events:none;
  transition: all .25s ease;
}





.betBox{
  border-radius:0;
  padding:35px 28px; /*dài - rông */

background:
  url("/assets/ui/bet-altar-bg.png")
  center / 100% 100%
  no-repeat;

  background-color: transparent; /* 🔥 đảm bảo không còn lớp nền */
  border:none;
  box-shadow:none;
  min-height:320px;
}



    .betRow{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .betRow input{
      flex:1;
      height:44px;
      padding: 0 12px;
      border-radius: 14px;
      border:1px solid rgba(0,240,255,.18);
      background:rgba(0,0,0,.6);
      color:#fff;
      outline:none;
      font-weight:800;
      font-size:15px;
      box-shadow: inset 0 0 20px rgba(0,0,0,.6);
    }
    .btn{
      height:44px;
      padding: 0 14px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color:#fff;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }




    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

 .quick{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:6px;
  margin-top:0;
}

.chip{
  height:38px;
  border-radius:14px;
  font-size:13px;
  font-weight:900;

 background:
    linear-gradient(180deg,
      rgba(120,0,0,.8),
      rgba(40,0,0,.95));

  border:1px solid rgba(255,255,255,.15);

  box-shadow:
    0 0 20px rgba(255,0,0,.2),
    inset 0 0 20px rgba(0,0,0,.8);



  display:flex;
  align-items:center;
  justify-content:center;

  
  letter-spacing:.4px;

  transition:.2s;
  cursor:pointer;
}

.chip:hover{
  background:
    linear-gradient(180deg,
      rgba(0,240,255,.35),
      rgba(0,120,140,.5));

  border-color: rgba(0,240,255,.6);

  box-shadow:
    0 0 20px rgba(0,240,255,.5);

  transform: translateY(-2px);
}

.chip:active{
  transform: scale(.95);
}

.statusLine{
  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:13px;
  padding:10px 14px;

  border-radius:14px;

  background:
    linear-gradient(90deg,
      rgba(255,60,60,.08),
      rgba(0,240,255,.08));

  border:1px solid rgba(255,255,255,.08);

  box-shadow: inset 0 0 20px rgba(0,0,0,.6);
}

    .statusLine b{color:#fff}



/* =========================
   SLAVE ROW – REBEL STYLE
   ========================= */

.player-row{
  position:fixed;
  left:0;
  right:0;
  bottom:-10px;

  padding:14px 12px calc(16px + var(--safeBot));

  background:
    linear-gradient(180deg,
      rgba(0,0,0,.0),
      rgba(0,0,0,.92)),

      rgba(0,240,255,.12),
      transparent 60%);

  backdrop-filter: blur(18px);

  border-top:1px solid rgba(0,240,255,.35);

  box-shadow:
    0 -10px 40px rgba(0,240,255,.12),
    inset 0 0 40px rgba(0,0,0,.6);

  z-index:40;
  overflow:hidden;
}


.player-row .row-head .tag{
  font-weight:900;
  font-size:13px;
  letter-spacing:.8px;
  color:#fff;

  text-shadow:
    0 0 10px rgba(0,240,255,.8),
    0 0 20px rgba(0,240,255,.5);
}


.player-row .badge{
  width:30px;
  height:30px;
  border-radius:12px;

  background:
    radial-gradient(circle at 30% 20%,
      #e0ffff,
      #00f0ff 40%,
      #003a4a 90%);

  box-shadow:
    0 0 25px rgba(0,240,255,.8),
    0 0 50px rgba(0,240,255,.4);

  border:1px solid rgba(255,255,255,.4);

  font-size:15px;
}





    /* ===== OVERLAY RESULT ===== */
    .overlay{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      z-index:80;
    }
    .overlay.show{display:flex}

 .overlay .backdrop{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 40%,
      rgba(0,0,0,.2),
      rgba(0,0,0,.9));

  backdrop-filter: blur(14px);
}

.modal{
  position:relative;
  width:min(520px, 92vw);
  border-radius:26px;

  background:
    linear-gradient(180deg,
      rgba(15,15,20,.96),
      rgba(8,8,12,.92));

  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 40px 120px rgba(0,0,0,.8),
    0 0 60px rgba(255,60,60,.15),
    0 0 60px rgba(0,240,255,.15);

  overflow:hidden;
  padding:22px;

  transform: scale(.92);
  animation: modalIn .35s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes modalIn{
  to{
    transform: scale(1);
  }
}

  -webkit-text-fill-color:transparent;

  text-align:center;

  text-shadow:
    0 0 20px rgba(255,60,60,.4),
    0 0 40px rgba(0,240,255,.4);
}


    .modal .mSub{

    }

.mCard{

.mCard.win{

.mCard.lose{

  box-shadow:

.mBtns{

}

#mOk{
  width:100%;
  height:46px;
  border-radius:16px;

  font-weight:1000;
  letter-spacing:.8px;

  background:
    linear-gradient(180deg,
      rgba(0,240,255,.6),
      rgba(0,120,140,.7));

  border:1px solid rgba(0,240,255,.8);

  box-shadow:
    0 0 40px rgba(0,240,255,.5);
}



    .modal .mBtns{
      margin-top:14px;
      display:flex;
      gap:10px;
    }



.spark{
  position:absolute;
  inset:-100px;

  background:
    radial-gradient(circle at 50% 30%,
      rgba(0,240,255,.15),
      transparent 55%),
    radial-gradient(circle at 50% 60%,
      rgba(255,60,60,.15),

    @keyframes breathe{
      0%{opacity:.55; transform: scale(1)}

    @media (max-width:420px){
      .card{height:78px;border-radius:14px}

    /* ===== ARENA BACKGROUND LAYER ===== */
.center{
  position:relative;
}

.panel{
  position:relative;
  z-index:5;
}


/* =========================
   ARENA CINEMATIC 2.0
   ========================= */

/* =========================
   ARENA CINEMATIC LEVEL 10
   ========================= */

.arena-bg{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

/* 🔥 Hell vortex */
.arena-bg::before{
  content:"";
  position:absolute;
  width:600px;
  height:600px;
  border-radius:50%;

  background:
    radial-gradient(circle,
      rgba(255,0,0,.35),
      rgba(120,0,0,.2),
      transparent 70%);

  filter: blur(60px);
  animation: vortexSpin 8s linear infinite;
  opacity:.8;
}

@keyframes vortexSpin{
  from{ transform: rotate(0deg) scale(1); }
  to{ transform: rotate(360deg) scale(1.15); }
}

/* ===== FIGHT ZONE ===== */
.fight-zone{
  display:flex;
  align-items:center;
  justify-content:center;
  gap: 37px;
  position:relative;
}


/* ===== SLOT BASE ===== */
.slot{
  width: 130px;
  height: 175px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  background: none;      /* 🔥 bỏ nền */
  border: none;          /* 🔥 bỏ viền */

  transition: transform .25s ease;
}

.slot.combat{
  animation: impact .35s ease;
  filter: drop-shadow(0 0 30px rgba(255,255,255,.25));
}

/* ===== SLOT WRAPPER ===== */
.slot-wrap{
  position: relative;
  width: 180px;
  height: 260px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== FRAME PNG ===== */
.slot-frame{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  z-index:2;
}


/* CARD full không bo góc */
.slot img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:0;
}

.king-wrap .slot-frame{
  filter: drop-shadow(0 0 20px rgba(255,180,60,.6));
}

.player-wrap .slot-frame{
  filter: drop-shadow(0 0 20px rgba(0,240,255,.6));
}

/* ===== KING SLOT GLOW ===== */
.king-slot{
  box-shadow:
    0 0 40px rgba(255,60,60,.35),
    inset 0 0 40px rgba(255,60,60,.15);
  border-color: rgba(255,60,60,.5);
}

/* ===== PLAYER SLOT GLOW ===== */
.player-slot{
  box-shadow:
    0 0 40px rgba(0,240,255,.35),
    inset 0 0 40px rgba(0,240,255,.15);
  border-color: rgba(0,240,255,.5);
}

/* ===== VS TEXT ===== */
.vs-text{
  font-size:40px;
  font-weight:1000;
  letter-spacing:2px;

  background: linear-gradient(90deg,#ff0000,#ffffff,#00f0ff);

  background-clip:text;
  -webkit-background-clip:text;

  color:transparent;
  -webkit-text-fill-color:transparent;

  animation: vsFire 1.5s ease-in-out infinite;
  will-change: transform;
}

@keyframes vsFire{
  0%{ transform: scale(1); filter: drop-shadow(0 0 10px red); }
  50%{ transform: scale(1.2); filter: drop-shadow(0 0 25px cyan); }
  100%{ transform: scale(1); filter: drop-shadow(0 0 10px red); }
}


.fight-zone::before{
  content:"";

  width:200px;
  height:6px;

    rgba(255,60,60,.7),
    rgba(255,255,255,.8),
    rgba(0,240,255,.7));
  filter: blur(6px);
  animation: beamMove 2s linear infinite;
}

@keyframes beamMove{
  0%{ opacity:.4 }
  50%{ opacity:1 }
  100%{ opacity:.4 }
}



.slot.combat{
  animation: impact 0.35s ease;
}

@keyframes impact{
  0%{ transform: scale(1); }
  25%{ transform: scale(1.08); }
  50%{ transform: scale(0.95); }
  75%{ transform: scale(1.05); }
  100%{ transform: scale(1); }
}

   ========================= */

.global-phase{

}

/* Demon capsule */
.phase-pill{

  position:static;

  width:520px;          /* fix cứng chiều ngang cho cân */
  height:110px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:1000;
  letter-spacing:1.2px;

  background-color: transparent !important;

.phase-pill::after{

}


/* tiny horns */
.phase-pill .horn{

  top:-7px;

  height:12px;
  border-radius:0 0 10px 10px;

    radial-gradient(circle at 30% 30%, rgba(255,220,150,.85), rgba(255,0,60,.85));
  filter: drop-shadow(0 0 10px rgba(255,0,60,.45));
  opacity:.9;
}
.phase-pill .horn.left{ left:18px; transform: rotate(-18deg); }
.phase-pill .horn.right{ right:18px; transform: rotate(18deg); }



/* ===== STATES (demon colors) ===== */

}

    inset 0 0 22px rgba(0,0,0,.75);
}

.phase-pill.result{

/* =========================
   KING 3D FLIP EFFECT
   ========================= */

.card,
.card-inner,
.card-face{
  backface-visibility: hidden;
  transform: translateZ(0);
  will-change: transform;
}


.card img{
  backface-visibility: hidden;
}

.card.glow-king{

}


/* =========================

   ========================= */

.card{
  perspective:1000px;
}

.card-inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style: preserve-3d;
  transition: transform .6s cubic-bezier(.2,.8,.2,1);
}

.card.flip .card-inner{
  transform: rotateY(180deg);
}

.card-face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:0;
  overflow:hidden;
}

.card-face img{
  width:100%;
  height:100%;
  object-fit: fill;
  border-radius:0;
}

.card-front{
  backface-visibility: hidden;
  transform: rotateY(180deg);
}
.card-back{
  backface-visibility: hidden;
}
.card{
  transform-style: preserve-3d;
}

.card.glow-king{
  box-shadow:
    0 0 40px rgba(255,60,60,.7),

function buildRow(el, type){

 playSound("pick");

function renderPlayerDeck(){

  [...playerRow.children].forEach(c=>{

      img.src = "/assets/ks/card-common.png";

  });

function flashPick(card){
  card.classList.remove("win","lose","draw");

  setTimeout(()=>card.classList.remove("reveal"), 380);
}



function setPhase(text){

  const el = document.getElementById("phaseText");

  el.textContent = text;   // 🔥 chỉ text

  el.classList.remove("waiting","picking","result","lose");

  if(text.includes("Not yet bet")){
    el.classList.add("waiting");
  }
  else if(text.includes("Select")){
    el.classList.add("picking");
  }
  else if(text.includes("Draw")){
    el.classList.add("result");
  }
  else if(text.includes("End")){
    el.classList.add("result");
  }

function setStatus(text){

function animateToArena(cardEl, targetEl){

playSound("fly");

     if(!cardEl || !targetEl) return; // 💥 chống crash


  const rect1 = cardEl.getBoundingClientRect();
  const rect2 = targetEl.getBoundingClientRect();

  const dx = rect2.left - rect1.left;
  const dy = rect2.top - rect1.top;

  cardEl.style.position = "fixed";
  cardEl.style.left = rect1.left + "px";
  cardEl.style.top = rect1.top + "px";
  cardEl.style.width = rect1.width + "px";
  cardEl.style.height = rect1.height + "px";
  cardEl.style.zIndex = 1000;

  document.body.appendChild(cardEl);

  requestAnimationFrame(()=>{
    cardEl.style.transition = "all .45s cubic-bezier(.2,.8,.2,1)";
    cardEl.style.left = rect2.left + "px";
    cardEl.style.top = rect2.top + "px";
  });

  setTimeout(()=>{
    cardEl.style.transition = "none";
    cardEl.style.position = "";
    cardEl.style.left = "";
    cardEl.style.top = "";
    cardEl.style.width = "100%";
    cardEl.style.height = "100%";
    cardEl.style.zIndex = "";

    targetEl.innerHTML = "";
    targetEl.appendChild(cardEl);
  }, 450);
}

betDisplay.innerHTML =

  images.forEach(img=>{
    if(img.complete){
      updateReal();
    }else{
      img.addEventListener("load", updateReal);
      img.addEventListener("error", updateReal);
    }
  });

  const interval = setInterval(()=>{

    const realPercent = Math.floor((realLoaded / total) * 100);

    // chạy mượt dần tới realPercent
    if(displayPercent < realPercent){
      displayPercent += 1;
    }

    bar.style.width = displayPercent + "%";

    if(realPercent >= 100 && displayPercent >= 100 && !finished){
      finished = true;
      clearInterval(interval);

      setTimeout(()=>{
        loader.classList.add("hide");

        setTimeout(()=>{
          document.body.classList.remove("loading");
        }, 400);

      }, 300);
    }

  }, 12);
}

document.addEventListener("DOMContentLoaded", startSmartLoader);



function finishLoading(){
  const loader = document.getElementById("gameLoader");

  loader.classList.add("hide");

  setTimeout(()=>{
    document.body.classList.remove("loading");
  }, 400);
}


</script>
