<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🕵️ Game Phá Án</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #222;
    }

    button {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    main {
      padding: 24px 16px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
    }

    .desc {
      margin-top: 8px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <button onclick="history.back()">←</button>
    <b>Game phá án</b>
  </header>

  <main>
    <div class="icon">🕵️‍♂️</div>
    <div class="title">Thiên tài phá án</div>
    <div class="desc">
      Khu vực đang phát triển.<br>
      Sắp có điều tra · manh mối · suy luận logic.
    </div>
  </main>

</body>
</html>
