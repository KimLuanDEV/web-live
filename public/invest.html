<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Thị trường đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

  /* ================= PAGE INVEST – FULL BLACK BACKGROUND ================= */

html, body {
  background: #000;
}




</style>


</head>


<body class="page-invest">



<header class="invest-header">
  <!-- LEFT -->
  <div class="header-left">
    <button class="back-btn" onclick="history.back()">←</button>
  </div>

  <!-- CENTER -->
  <div class="header-center">
    <h1>Thị trường đầu tư</h1>
     <div class="header-sub">
      Realtime • Investment
    </div>

  </div>

  <!-- RIGHT (GIỮ TRỐNG ĐỂ CÂN) -->
  <div class="header-right"></div>
</header>




<div class="invest-grid">

<div class="invest-card gold" onclick="goInvest('gold')">

  <div class="asset-icon">
  <img src="/assets/gold.png" alt="Gold">
</div>


  <h3>GOLD</h3>
  <p class="risk">Biên độ: -5% → +8%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card silver" onclick="goInvest('silver')">

 <div class="asset-icon">
  <img src="/assets/silver.png" alt="Silver">
</div>

  <h3>SILVER</h3>
  <p class="risk">Biên độ: -3% → +5%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card diamond" onclick="goInvest('diamond')">

  <div class="asset-icon">
  <img src="/assets/diamond.png" alt="Diamond">
</div>

  <h3>DIAMOND</h3>
  <p class="risk danger">Biên độ: -10% → +15%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


<div class="invest-card oil" onclick="goInvest('oil')">
  <div class="asset-icon">
    <img src="/assets/oil.png" alt="Oil">
  </div>
  <h3>OIL</h3>
  <p class="risk danger">Biên độ: -18% → +25%</p>
  <div class="tap-hint">🔥 Biến động rất mạnh</div>
</div>

<div class="invest-card estate" onclick="goInvest('estate')">
  <div class="asset-icon">
    <img src="/assets/estate.png" alt="Estate">
  </div>
  <h3>REAL ESTATE</h3>
  <p class="risk danger">Biên độ: -12% → +20%</p>
  <div class="tap-hint">🏗 Sóng lớn – chậm</div>
</div>


</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/invest.js"></script>



<div id="investResult" class="invest-result hidden"></div>



</body>
</html>
