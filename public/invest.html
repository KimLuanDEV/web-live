<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Thị trường đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

  /* ================= PAGE INVEST – FULL BLACK BACKGROUND ================= */

html, body {
  background: #000;
}

/* ===== INVEST CARD BASE ===== */
.invest-card{
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  cursor: pointer;
  color: #fff;

  /* ✅ KHÔNG BÓP ẢNH */
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  aspect-ratio: 3 / 4;   /* ✅ giữ tỉ lệ card đẹp */
  box-shadow: 0 12px 30px rgba(0,0,0,.65);
  transition: transform .2s ease, box-shadow .2s ease;
   filter:
    contrast(1.15)
    saturate(1.12)
    brightness(1.05);
}

.invest-card:active{
  transform: scale(.97);
}

/* overlay tối để chữ nổi */
.invest-card::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background: linear-gradient(
    to top,
    rgba(0,0,0,.65),
    rgba(0,0,0,0)
  );
  z-index:0;
}


/* nội dung nằm trên overlay */
.invest-card > *{
  position: relative;
  z-index: 1;
}


/* ===== BACKGROUND THEO ASSET ===== */

.invest-card.gold{
  background-image: url("/assets/bg/gold.jpg");
}
.invest-card.silver{
  background-image: url("/assets/bg/silver.jpg");
}
.invest-card.diamond{
  background-image: url("/assets/bg/diamond.jpg");
}
.invest-card.oil{
  background-image: url("/assets/bg/oil.jpg");
}
.invest-card.estate{
  background-image: url("/assets/bg/estate.jpg");
}
.invest-card.atomic{
  background-image: url("/assets/bg/atomic.jpg");
}


.invest-card h3{
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .5px;
  text-shadow: 0 3px 12px rgba(0,0,0,.8);
}

.invest-card .risk{
  font-size: 14px;
  opacity: .95;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

.invest-card .tap-hint{
  font-size: 13px;
  opacity: .85;
}

.invest-card .asset-icon img{
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.7));
}




/* OIL – rung động mạnh */
.invest-card.oil{
  box-shadow:
    0 0 40px rgba(255,120,0,.25),
    0 12px 30px rgba(0,0,0,.7);
}

/* REAL ESTATE – sang, chậm */
.invest-card.estate{
  box-shadow:
    0 0 35px rgba(255,200,120,.25),
    0 12px 30px rgba(0,0,0,.7);
}


/* ===== INVEST GRID: 2 CỘT – MỖI HÀNG 2 ITEM ===== */
.invest-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 cột cố định */
  gap: 14px;
  padding: 12px;
}


.invest-card{
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
   filter: contrast(1.1) brightness(1.05);
}






</style>


</head>


<body class="page-invest">



<header class="invest-header">
  <!-- LEFT -->
  <div class="header-left">
    <button class="back-btn" onclick="history.back()">←</button>
  </div>

  <!-- CENTER -->
  <div class="header-center">
    <h1>Thị trường đầu tư</h1>
     <div class="header-sub">
      Realtime • Investment
    </div>

  </div>

  <!-- RIGHT (GIỮ TRỐNG ĐỂ CÂN) -->
  <div class="header-right"></div>
</header>




<div class="invest-grid">


<div class="invest-card silver" onclick="goInvest('silver')">
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


<div class="invest-card gold" onclick="goInvest('gold')">
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card diamond" onclick="goInvest('diamond')">
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


<div class="invest-card oil" onclick="goInvest('oil')">
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card estate" onclick="goInvest('estate')">
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


<div class="invest-card atomic" onclick="goInvest('atomic')">
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/invest.js"></script>



<div id="investResult" class="invest-result hidden"></div>



</body>
</html>
