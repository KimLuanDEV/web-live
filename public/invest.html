<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Thị trường đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

  /* ================= PAGE INVEST – FULL BLACK BACKGROUND ================= */

html, body {
  background: #000;
}

/* riêng trang invest */
body.page-invest {
  background: #000;
  min-height: 100vh;
  margin: 0;
}

/* tránh viền trắng do container */
body.page-invest * {
  box-sizing: border-box;
}


body.page-invest {
  background: radial-gradient(
    circle at top,
    #111 0%,
    #000 60%
  );
}


</style>


</head>


<body class="page-invest">



<header class="invest-header">
  <!-- LEFT -->
  <div class="header-left">
    <button class="back-btn" onclick="history.back()">←</button>
  </div>

  <!-- CENTER -->
  <div class="header-center">
    <h1>Thị trường đầu tư</h1>
  </div>

</header>



<div class="invest-grid">

<div class="invest-card gold" onclick="goInvest('gold')">

  <div class="asset-icon">
  <img src="/assets/gold.png" alt="Vàng">
</div>


  <h3>VÀNG</h3>
  <p class="risk">Biên độ: -5% → +8%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card silver" onclick="goInvest('silver')">

 <div class="asset-icon">
  <img src="/assets/silver.png" alt="Bạc">
</div>

  <h3>BẠC</h3>
  <p class="risk">Biên độ: -3% → +5%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card diamond" onclick="goInvest('diamond')">

  <div class="asset-icon">
  <img src="/assets/diamond.png" alt="Kim cương">
</div>

  <h3>KIM CƯƠNG</h3>
  <p class="risk danger">Biên độ: -10% → +15%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/invest.js"></script>



<div id="investResult" class="invest-result hidden"></div>



</body>
</html>
