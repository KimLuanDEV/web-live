<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Thị trường đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-invest">

<div class="invest-header">
  <h1>📈 Thị trường đầu tư</h1>
  <p>⚠️ Đầu tư có rủi ro – Lợi nhuận không đảm bảo</p>
</div>

<div class="invest-balance">
  💎 Số dư: <span id="myCoin">0</span>
</div>

<div class="invest-grid">

 <div class="invest-card gold" onclick="openAnalysis('gold')">
  <div class="asset-icon">🥇</div>
  <h3>VÀNG</h3>
  <p class="risk">Biên độ: -5% → +8%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card silver" onclick="openAnalysis('silver')">
  <div class="asset-icon">🥈</div>
  <h3>BẠC</h3>
  <p class="risk">Biên độ: -3% → +5%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>

<div class="invest-card diamond" onclick="openAnalysis('diamond')">
  <div class="asset-icon">💎</div>
  <h3>KIM CƯƠNG</h3>
  <p class="risk danger">Biên độ: -10% → +15%</p>
  <div class="tap-hint">👆 Xem phân tích</div>
</div>


</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/invest.js"></script>



<div id="investResult" class="invest-result hidden"></div>


<div id="analysisModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeAnalysis()"></div>

  <div class="modal-card invest-analysis">
    <h2 id="analysisTitle">📊 Phân tích</h2>

   <div id="analysisContent" class="analysis-content">

  <canvas
    id="priceChart"
    width="320"
    height="120"
    style="width:100%;margin:8px 0;border-radius:10px;background:#0a0a0a">
  </canvas>

</div>


    <div class="analysis-balance">
      💎 Số dư: <b id="analysisCoin">0</b>
    </div>

    <input
      type="number"
      id="analysisAmount"
      placeholder="Nhập số coin đầu tư"
    >

    <button class="btn-primary" onclick="confirmInvest()">
      🚀 XÁC NHẬN ĐẦU TƯ
    </button>

    <button class="btn-ghost" onclick="closeAnalysis()">
      ✖ Hủy
    </button>
  </div>
</div>



</body>
</html>
