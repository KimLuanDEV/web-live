<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Thị trường đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



<style>

  /* ================= PAGE INVEST – FULL BLACK BACKGROUND ================= */

html, body {
  background: #000;
}

/* ===== INVEST CARD BASE ===== */
.invest-card{
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  cursor: pointer;
  color: #fff;

  /* ✅ KHÔNG BÓP ẢNH */
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;

  aspect-ratio: 3 / 4;   /* ✅ giữ tỉ lệ card đẹp */

  box-shadow:
    0 10px 30px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);

  transition: transform .2s ease, box-shadow .2s ease;
}

.invest-card:active{
  transform: scale(.97);
}

/* overlay tối để chữ nổi */
.invest-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.08),
      rgba(0,0,0,.45)
    );
  z-index:0;
}


/* nội dung nằm trên overlay */
.invest-card > *{
  position: relative;
  z-index: 1;
}


/* ===== BACKGROUND THEO ASSET ===== */

.invest-card.gold{
  background-image:
    linear-gradient(180deg, rgba(255,200,80,.25), rgba(0,0,0,.9)),
    url("/assets/bg/gold.jpg");
}

.invest-card.silver{
  background-image:
    linear-gradient(180deg, rgba(180,200,220,.25), rgba(0,0,0,.9)),
    url("/assets/bg/silver.jpg");
}

.invest-card.diamond{
  background-image:
    linear-gradient(180deg, rgba(0,255,255,.25), rgba(0,0,0,.9)),
    url("/assets/bg/diamond.jpg");
}

.invest-card.oil{
  background-image:
    linear-gradient(180deg, rgba(255,120,0,.35), rgba(0,0,0,.95)),
    url("/assets/bg/oil.jpg");
}

.invest-card.estate{
  background-image:
    linear-gradient(180deg, rgba(255,200,120,.3), rgba(0,0,0,.9)),
    url("/assets/bg/estate.jpg");
}
.invest-card.atomic{
  background-image:
    linear-gradient(180deg, rgba(180,0,255,.35), rgba(0,0,0,.95)),
    url("/assets/bg/atomic.jpg");
}


.invest-card h3{
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .5px;
  text-shadow: 0 3px 12px rgba(0,0,0,.8);
}

.invest-card .risk{
  font-size: 14px;
  opacity: .95;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

.invest-card .tap-hint{
  font-size: 13px;
  opacity: .85;
}

.invest-card .asset-icon img{
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.7));
}




/* OIL – rung động mạnh */
.invest-card.oil{
  box-shadow:
    0 0 40px rgba(255,120,0,.25),
    0 12px 30px rgba(0,0,0,.7);
}

/* REAL ESTATE – sang, chậm */
.invest-card.estate{
  box-shadow:
    0 0 35px rgba(255,200,120,.25),
    0 12px 30px rgba(0,0,0,.7);
}


/* ===== INVEST GRID: 2 CỘT – MỖI HÀNG 2 ITEM ===== */
.invest-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 cột cố định */
  gap: 14px;
  padding: 12px;
}


.invest-card{
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}


.invest-card.portfolio{
  background-image:
    linear-gradient(180deg, rgba(0,200,255,.35), rgba(0,0,0,.95)),
    url("/assets/bg/portfolio.jpg");

  background-size: cover;      /* ✅ FULL ẢNH */
  background-position: center;
  background-repeat: no-repeat;

  box-shadow:
    0 0 45px rgba(0,200,255,.25),
    0 12px 30px rgba(0,0,0,.7);
}



/* ================= PORTFOLIO SHEET ================= */

#portfolioSheet{
  position: fixed;
  inset: 0;
  z-index: 999;
}

#portfolioSheet.hidden{
  display: none;
}

/* backdrop */
#portfolioSheet .sheet-backdrop{
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(6px);
}

/* box */
#portfolioSheet .sheet-box{
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

  background: #050505;
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(0,0,0,.8);

  max-height: 92%;
  display: flex;
  flex-direction: column;

  animation: sheetUp .25s ease;
}

@keyframes sheetUp{
  from{ transform: translateY(100%); }
  to{ transform: translateY(0); }
}

/* header */
#portfolioSheet .sheet-head{
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

#portfolioSheet .sheet-title{
  font-size: 17px;
  font-weight: 800;
}

#portfolioSheet .sheet-close{
  background: none;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;
}

/* body */
#portfolioSheet .sheet-body{
  padding: 12px;
  overflow-y: auto;
}

/* grid trong sheet */
#portfolioSheet .invest-grid{
  grid-template-columns: repeat(2, 1fr);
}

/* card trong sheet */
#portfolioSheet .invest-card{
  aspect-ratio: 1 / 1.15;
}

/* overlay đậm hơn */
#portfolioSheet .invest-card::before{
  background: linear-gradient(
    180deg,
    rgba(0,0,0,.15),
    rgba(0,0,0,.75)
  );
}

/* tên asset */
.asset-name{
  font-size: 16px;
  font-weight: 800;
  text-align: center;
  padding: 10px 0;
  text-shadow: 0 3px 12px rgba(0,0,0,.8);
}



/* ===== NEW GAME CARD ===== */
.invest-card.coming-soon{
  background-image:
    linear-gradient(180deg, rgba(120,120,120,.25), rgba(0,0,0,.95)),
    url("/assets/bg/coming-soon.jpg");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  box-shadow:
    0 0 35px rgba(255,255,255,.08),
    0 12px 30px rgba(0,0,0,.7);

  opacity: .9;
}

/* hiệu ứng chờ */
.invest-card.coming-soon::after{
  content: "COMING SOON";
  position: absolute;
  top: 12px;
  right: -28px;

  transform: rotate(45deg);
  background: rgba(255,255,255,.08);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 32px;
  letter-spacing: 1px;

  z-index: 2;
}


</style>


</head>


<body class="page-invest">



<header class="invest-header">
  <!-- LEFT -->
  <div class="header-left">
    <button class="back-btn" onclick="history.back()">←</button>
  </div>

  <!-- CENTER -->
  <div class="header-center">
    <h1>Thị trường đầu tư</h1>
     <div class="header-sub">
      Realtime • Investment
    </div>

  </div>

  <!-- RIGHT (GIỮ TRỐNG ĐỂ CÂN) -->
  <div class="header-right"></div>
</header>




<div class="invest-grid">

  <!-- CARD TRADE -->
  <div class="invest-card portfolio" onclick="openPortfolio()">
    <h3>Trade</h3>
    <div class="risk">6 mảng • Realtime</div>
    <div class="tap-hint">👆 Xem toàn bộ</div>
  </div>

  <!-- CARD GAME MỚI -->
  <div class="invest-card coming-soon" onclick="openNewGame()">
    <h3>Game mới</h3>
    <div class="risk">Sắp ra mắt</div>
    <div class="tap-hint">🚧 Đang phát triển</div>
  </div>

</div>






<div id="portfolioSheet" class="sheet hidden">
  <div class="sheet-backdrop" onclick="closePortfolio()"></div>

  <div class="sheet-box">
    <div class="sheet-head">
      <div class="sheet-title">Các mảng đầu tư</div>
      <button class="sheet-close" onclick="closePortfolio()">✕</button>
    </div>

    <div class="sheet-body">
      <div class="invest-grid">

        <div class="invest-card silver" onclick="goInvest('silver')">
           <div class="asset-name"></div>
        </div>

        <div class="invest-card gold" onclick="goInvest('gold')">
           <div class="asset-name"></div>
        </div>

        <div class="invest-card diamond" onclick="goInvest('diamond')">
           <div class="asset-name"></div>
        </div>

        <div class="invest-card oil" onclick="goInvest('oil')">
           <div class="asset-name"></div>
        </div>

        <div class="invest-card estate" onclick="goInvest('estate')">
           <div class="asset-name"></div>
        </div>

        <div class="invest-card atomic" onclick="goInvest('atomic')">
           <div class="asset-name"></div>
        </div>

      </div>
    </div>
  </div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/invest.js"></script>



<div id="investResult" class="invest-result hidden"></div>



</body>
</html>
