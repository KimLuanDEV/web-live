<style>

  /* ================= PAGE INVEST – FULL BLACK BACKGROUND ================= */

html, body {
  background: #000;
}

/* ===== INVEST CARD BASE ===== */
.invest-card{
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  cursor: pointer;
  color: #fff;

  /* ✅ KHÔNG BÓP ẢNH */
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;

  aspect-ratio: 3 / 4;   /* ✅ giữ tỉ lệ card đẹp */

  box-shadow:
    0 10px 30px rgba(0,0,0,.55),
    inset 0 1px 0 rgba(255,255,255,.08);

  transition: transform .2s ease, box-shadow .2s ease;
}

.invest-card:active{
  transform: scale(.97);
}

/* overlay tối để chữ nổi */
.invest-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.08),
      rgba(0,0,0,.45)
    );
  z-index:0;
}


/* nội dung nằm trên overlay */
.invest-card > *{
  position: relative;
  z-index: 1;
}


/* ===== BACKGROUND THEO ASSET ===== */

.invest-card.gold{
  background-image:
    linear-gradient(180deg, rgba(255,200,80,.25), rgba(0,0,0,.9)),
    url("/assets/bg/gold.jpg");
}

.invest-card.silver{
  background-image:
    linear-gradient(180deg, rgba(180,200,220,.25), rgba(0,0,0,.9)),
    url("/assets/bg/silver.jpg");
}

.invest-card.diamond{
  background-image:
    linear-gradient(180deg, rgba(0,255,255,.25), rgba(0,0,0,.9)),
    url("/assets/bg/diamond.jpg");
}

.invest-card.oil{
  background-image:
    linear-gradient(180deg, rgba(255,120,0,.35), rgba(0,0,0,.95)),
    url("/assets/bg/oil.jpg");
}

.invest-card.estate{
  background-image:
    linear-gradient(180deg, rgba(255,200,120,.3), rgba(0,0,0,.9)),
    url("/assets/bg/estate.jpg");
}
.invest-card.atomic{
  background-image:
    linear-gradient(180deg, rgba(180,0,255,.35), rgba(0,0,0,.95)),
    url("/assets/bg/atomic.jpg");
}


.invest-card h3{
  font-size: 20px;
  font-weight: 800;
  letter-spacing: .5px;
  text-shadow: 0 3px 12px rgba(0,0,0,.8);
}

.invest-card .risk{
  font-size: 14px;
  opacity: .95;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
}

.invest-card .tap-hint{
  font-size: 13px;
  opacity: .85;
}

.invest-card .asset-icon img{
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.7));
}




/* OIL – rung động mạnh */
.invest-card.oil{
  box-shadow:
    0 0 40px rgba(255,120,0,.25),
    0 12px 30px rgba(0,0,0,.7);
}

/* REAL ESTATE – sang, chậm */
.invest-card.estate{
  box-shadow:
    0 0 35px rgba(255,200,120,.25),
    0 12px 30px rgba(0,0,0,.7);
}


/* ===== INVEST GRID: 2 CỘT – MỖI HÀNG 2 ITEM ===== */
.invest-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr); /* 2 cột cố định */
  gap: 14px;
  padding: 12px;
}


.invest-card{
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}


.invest-card.portfolio{
  background-image:
    linear-gradient(180deg, rgba(0,200,255,.35), rgba(0,0,0,.95)),
    url("/assets/bg/portfolio.jpg");

  background-size: cover;      /* ✅ FULL ẢNH */
  background-position: center;
  background-repeat: no-repeat;

  box-shadow:
    0 0 45px rgba(0,200,255,.25),
    0 12px 30px rgba(0,0,0,.7);
}



/* ================= PORTFOLIO SHEET ================= */

#portfolioSheet{
  position: fixed;
  inset: 0;
  z-index: 999;
}

#portfolioSheet.hidden{
  display: none;
}

/* backdrop */
#portfolioSheet .sheet-backdrop{
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(6px);
}

/* box */
#portfolioSheet .sheet-box{
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;

  background: #050505;
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(0,0,0,.8);

  max-height: 92%;
  display: flex;
  flex-direction: column;

  animation: sheetUp .25s ease;
}

@keyframes sheetUp{
  from{ transform: translateY(100%); }
  to{ transform: translateY(0); }
}

/* header */
#portfolioSheet .sheet-head{
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

#portfolioSheet .sheet-title{
  font-size: 17px;
  font-weight: 800;
}

#portfolioSheet .sheet-close{
  background: none;
  border: none;
  color: #aaa;
  font-size: 20px;
  cursor: pointer;

/* body */
#portfolioSheet .sheet-body{
  padding: 12px;

/* grid trong sheet */
#portfolioSheet .invest-grid{

/* card trong sheet */

/* overlay đậm hơn */

/* tên asset */
.asset-name{

.invest-card.games{

/* ==========================================
   LIVESTREAM PRO - INVEST LUXURY V3
   OBSIDIAN BLACK & CHAMPAGNE GOLD
========================================== */

:root {
  --iv-bg: #050505;
  --iv-panel: #111114;
  --iv-gold: #e9c88b;
  --iv-gold-dark: #9e793e;
  --iv-text: #f7f1e6;
  --iv-muted: #9c9890;
  --iv-line: rgba(233,200,139,.19);
}

html,
body.page-invest {
  margin: 0;
  min-height: 100%;
  background: #000 !important;
  color: var(--iv-text);
  font-family: system-ui, -apple-system,
               "Segoe UI", sans-serif;
}

body.page-invest {
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
}

/* HEADER */
body.page-invest .invest-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 76px;
  padding: 10px 18px;
  background: rgba(9,9,11,.97);
  border-bottom: 1px solid var(--iv-line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

body.page-invest .header-title {
  position: absolute;
  left: 64px;
  right: 64px;
  text-align: center;
  pointer-events: none;
}

body.page-invest .title-main {
  font-size: 17px;
  font-weight: 850;
  letter-spacing: 1.1px;
  background: linear-gradient(
    135deg,#fff4d7,#d8aa60,#fff0c5
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

body.page-invest .back-btn {
  position: relative;
  z-index: 2;
  width: 42px;
  height: 42px;
  border-radius: 13px;
  border: 1px solid var(--iv-line);
  background: linear-gradient(145deg,#22201d,#101012);
  color: var(--iv-gold);
  font-size: 22px;
}

/* MAIN GRID */
body.page-invest > .invest-grid {
  width: 100%;
  max-width: 430px;
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 14px;
  padding: 22px 16px 32px;
  margin: 0 auto;
}

/* CARD CHUNG */
body.page-invest .invest-card {
  position: relative;
  min-width: 0;
  overflow: hidden;
  border-radius: 19px;
  border: 1px solid rgba(233,200,139,.25);
  background-color: #131316;
  background-size: cover;
