<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Oẳn Tù Tì</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family: system-ui, -apple-system;
}

/* ===== BACKGROUND ===== */
.arena-bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.95)),
    url("/assets/bg/arena.jpg") center / cover no-repeat;
  z-index:0;
}

/* ===== PAGE ===== */
.arena-page{
  position:relative;
  z-index:1;
  min-height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */
.arena-header{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  padding:14px 16px;
  backdrop-filter: blur(10px);
  background: rgba(10,10,15,.85);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.back{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
}

.arena-title{
  flex:1;
  text-align:center;
}
.arena-title h1{
  margin:0;
  font-size:16px;
  font-weight:900;
}
.arena-title .sub{
  font-size:11px;
  opacity:.6;
}

/* ===== TIMER ===== */
.arena-timer{
  margin:20px 0;
  text-align:center;
}

.timer-ring{
  width:110px;
  height:110px;
  margin:0 auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at top,
      rgba(255,80,80,.45),
      rgba(120,0,0,.95)
    );

  box-shadow:
    0 0 30px rgba(255,80,80,.7),
    inset 0 0 18px rgba(0,0,0,.8);
}

.timer-ring span{
  font-size:32px;
  font-weight:900;
}

/* ===== CHOICES ===== */
.rps-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  padding:0 16px;
}

.rps-card{
  aspect-ratio:1/1.15;
  border-radius:22px;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(180deg, rgba(255,255,255,.1), rgba(0,0,0,.9));

  box-shadow:
    0 10px 30px rgba(0,0,0,.75),
    inset 0 1px 0 rgba(255,255,255,.15);

  transition:.18s ease;
}

.rps-card:active{
  transform:scale(.95);
}

.rps-card.selected{
  outline:2px solid #ffd86a;
  box-shadow:
    0 0 35px rgba(255,200,0,.85);
}

.rps-icon{
  font-size:42px;
}
.rps-name{
  margin-top:10px;
  font-size:15px;
  font-weight:800;
}

/* ===== FOOTER ===== */
.arena-footer{
  margin-top:auto;
  padding:16px;
  background:
    linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.95));
}

.confirm-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:18px;
  cursor:pointer;

  font-size:16px;
  font-weight:900;
  color:#000;

  background:
    linear-gradient(180deg, #ffd86a, #ffb700);

  box-shadow:0 0 22px rgba(255,200,0,.7);
}

.confirm-btn.locked{
  opacity:.5;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="arena-bg"></div>

<div class="arena-page">

  <!-- HEADER -->
  <div class="arena-header">
    <button class="back" onclick="history.back()">←</button>
    <div class="arena-title">
      <h1>Oẳn Tù Tì</h1>
      <div class="sub">Đối kháng • Realtime</div>
    </div>
    <div style="width:28px"></div>
  </div>

  <!-- TIMER -->
  <div class="arena-timer">
    <div class="timer-ring">
      <span id="roundTimer">15</span>
    </div>
  </div>

  <!-- CHOICES -->
  <div class="rps-grid">
    <div class="rps-card" onclick="selectMove('rock')">
      <div class="rps-icon">✊</div>
      <div class="rps-name">BÚA</div>
    </div>

    <div class="rps-card" onclick="selectMove('scissors')">
      <div class="rps-icon">✌️</div>
      <div class="rps-name">KÉO</div>
    </div>

    <div class="rps-card" onclick="selectMove('paper')">
      <div class="rps-icon">✋</div>
      <div class="rps-name">BAO</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="arena-footer">
    <button class="confirm-btn" id="confirmBtn" onclick="confirmMove()">
      XÁC NHẬN
    </button>
  </div>

</div>

<script>
let selectedMove = null;
let time = 15;

function selectMove(move){
  selectedMove = move;
  document.querySelectorAll(".rps-card")
    .forEach((el,idx)=>{
      el.classList.remove("selected");
      if(
        (idx===0 && move==="rock") ||
        (idx===1 && move==="scissors") ||
        (idx===2 && move==="paper")
      ){
        el.classList.add("selected");
      }
    });
}

function confirmMove(){
  if(!selectedMove){
    alert("⚠️ Hãy chọn BÚA – KÉO – BAO");
    return;
  }
  alert("✅ Bạn đã chọn: " + selectedMove.toUpperCase());
  document.getElementById("confirmBtn").classList.add("locked");
}

// countdown demo
setInterval(()=>{
  if(time > 0){
    time--;
    document.getElementById("roundTimer").textContent = time;
  }
},1000);
</script>

</body>
</html>
