<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đấu trường thời gian</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">

<style>
/* ================= ARENA PAGE ================= */

html, body{
  margin:0;
  padding:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

/* ===== BACKGROUND ===== */
.arena-bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.85)),
    url("/assets/bg/arena.jpg") center / cover no-repeat;
  z-index:0;
}

/* ===== PAGE WRAP ===== */
.arena-page{
  position:relative;
  z-index:1;
  min-height:100%;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */
.arena-header{
  position:sticky;
  top:0;
  z-index:5;

  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;

  backdrop-filter: blur(10px);
  background: rgba(10,10,15,.85);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.arena-header .back{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.arena-title{
  text-align:center;
  flex:1;
}

.arena-title h1{
  font-size:16px;
  margin:0;
  font-weight:800;
  letter-spacing:.5px;
}

.arena-title .sub{
  font-size:11px;
  opacity:.65;
}

/* ===== TIMER ===== */
.arena-timer{
  text-align:center;
  margin:18px 0;
}

.timer-ring{
  width:120px;
  height:120px;
  border-radius:50%;
  margin:0 auto;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at top,
      rgba(255,80,80,.45),
      rgba(120,0,0,.95)
    );

  box-shadow:
    0 0 35px rgba(255,80,80,.6),
    inset 0 0 18px rgba(0,0,0,.8);
}

.timer-ring span{
  font-size:34px;
  font-weight:900;
}

/* ===== ARENA OPTIONS ===== */
.arena-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  padding:0 16px;
}

.arena-option{
  aspect-ratio:1/1.15;
  border-radius:18px;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;

  padding:12px;
  text-align:center;

  background:
    linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.85));

  box-shadow:
    0 10px 25px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.12);

  transition:.18s ease;
}

.arena-option:active{
  transform:scale(.96);
}

.arena-option.attack{
  box-shadow:0 0 25px rgba(255,60,60,.35);
}

.arena-option.defend{
  box-shadow:0 0 25px rgba(0,200,255,.35);
}

.arena-option.allin{
  box-shadow:0 0 30px rgba(255,200,0,.45);
}

.arena-option .icon{
  font-size:34px;
  margin-bottom:10px;
}

.arena-option .name{
  font-size:14px;
  font-weight:800;
}

/* ===== FOOTER / BET BAR ===== */
.arena-footer{
  margin-top:auto;
  padding:14px 16px 22px;
  background:
    linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.9));
}

.bet-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:12px 14px;
  border-radius:16px;

  background: rgba(15,15,20,.9);
  box-shadow:0 8px 24px rgba(0,0,0,.8);
}

.bet-info{
  display:flex;
  flex-direction:column;
}

.bet-info .label{
  font-size:11px;
  opacity:.6;
}

.bet-info .value{
  font-size:16px;
  font-weight:800;
}

.bet-btn{
  padding:10px 18px;
  border-radius:14px;
  border:none;
  cursor:pointer;

  font-weight:800;
  color:#000;

  background:
    linear-gradient(180deg, #ffd86a, #ffb700);
  box-shadow:0 0 18px rgba(255,200,0,.6);
}

.bet-btn:active{
  transform:scale(.96);
}

/* ===== LOCKED ===== */
.locked{
  opacity:.45;
  pointer-events:none;
}
</style>
</head>

<body>

<div class="arena-bg"></div>

<div class="arena-page">

  <!-- HEADER -->
  <div class="arena-header">
    <button class="back" onclick="history.back()">←</button>

    <div class="arena-title">
      <h1>Đấu trường thời gian</h1>
      <div class="sub">Realtime • Sinh tồn</div>
    </div>

    <div style="width:28px"></div>
  </div>

  <!-- TIMER -->
  <div class="arena-timer">
    <div class="timer-ring">
      <span id="arenaTimer">30</span>
    </div>
  </div>

  <!-- OPTIONS -->
  <div class="arena-options">

    <div class="arena-option attack" onclick="selectArena('attack')">
      <div class="icon">⚔️</div>
      <div class="name">Tấn công</div>
    </div>

    <div class="arena-option defend" onclick="selectArena('defend')">
      <div class="icon">🛡️</div>
      <div class="name">Phòng thủ</div>
    </div>

    <div class="arena-option allin" onclick="selectArena('allin')">
      <div class="icon">🔥</div>
      <div class="name">All-in</div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="arena-footer">
    <div class="bet-bar">
      <div class="bet-info">
        <div class="label">Lựa chọn</div>
        <div class="value" id="arenaChoice">—</div>
      </div>

      <button class="bet-btn" onclick="confirmArena()">VÀO LỆNH</button>
    </div>
  </div>

</div>

<script>
let selectedArena = null;
let time = 30;

function selectArena(type){
  selectedArena = type;
  document.getElementById("arenaChoice").textContent =
    type === "attack" ? "⚔️ Tấn công" :
    type === "defend" ? "🛡️ Phòng thủ" :
    "🔥 All-in";
}

function confirmArena(){
  if(!selectedArena){
    alert("⚠️ Hãy chọn chiến thuật!");
    return;
  }
  alert("✅ Đã vào lệnh: " + selectedArena);
  document.querySelector(".bet-btn").classList.add("locked");
}

setInterval(()=>{
  if(time > 0){
    time--;
    document.getElementById("arenaTimer").textContent = time;
  }
},1000);
</script>

</body>
</html>
