
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>MILITARY - LIVE SCREEN</title>

<script src="/socket.io/socket.io.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050a06;
  color: #fff;
  font-family: system-ui, sans-serif;
  min-height: 100dvh;
}

header {
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(
    135deg, #31442b, #0b160e
  );

  border-bottom: 2px solid #b99d61;
}

.logo {
  color: #e8cc88;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 2px;
}

main {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

#status {
  color: #b7e8a2;
  font-size: 13px;
  text-align: center;
}

.video-wrap {
  width: 100%;
  max-width: 450px;
  aspect-ratio: 430 / 870;

  background: #000;
  border: 2px solid #a88d51;
  border-radius: 10px;
  overflow: hidden;

  box-shadow: 0 8px 30px #000b;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

.fullscreen-btn {
  padding: 12px 25px;

  background: #304932;
  color: #f7df9c;

  border: 1px solid #c6a764;
  border-radius: 7px;
  font-weight: 900;
  cursor: pointer;
}

.note {
  max-width: 350px;
  color: #81927e;
  text-align: center;
  font-size: 11px;
  line-height: 1.6;
}


.video-wrap {
  position: relative;
}

#screenFrame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

#screenFrame[hidden] {
  display: none !important;
}



/* ==================================
   WHEEL8 VIEWER LIVE CHAT
================================== */

.w8-viewer-chat {
  position: fixed;
  bottom: max(8px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);

  width: min(450px, calc(100% - 20px));
  padding: 12px;
  box-sizing: border-box;

  z-index: 100;

  background: rgba(10, 24, 14, .94);
  border: 1px solid #a78c4e;
  border-radius: 12px;

  box-shadow: 0 6px 25px #000b;
  backdrop-filter: blur(12px);
}

.w8-chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 8px;

  font-size: 12px;
  font-weight: 900;
  color: #e8d08c;
}

.w8-chat-live {
  color: #ff6666;
  font-size: 11px;
}

.w8-comment-list {
  max-height: 115px;
  min-height: 24px;

  overflow-y: auto;
  overscroll-behavior: contain;

  display: flex;
  flex-direction: column;
  gap: 7px;

  padding: 4px 0 9px;
}

.w8-viewer-comment {
  padding: 5px 7px;

  background: rgba(60, 83, 54, .35);
  border-radius: 6px;

  font-size: 12px;
  line-height: 1.4;

  overflow-wrap: anywhere;
}

.w8-viewer-comment-name {
  color: #edd18a;
  font-weight: 900;
}

.w8-viewer-comment-text {
  color: #edf6e9;
  margin-left: 5px;
}

#w8CommentForm {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

#w8CommentName,
#w8CommentInput {
  min-width: 0;
  width: 100%;
  height: 39px;
  box-sizing: border-box;

  padding: 0 12px;

  background: #101f13;
  color: #fff;

  border: 1px solid #59734f;
  border-radius: 7px;

  font-size: 16px;

  user-select: text;
  -webkit-user-select: text;
}

.w8-comment-send-row {
  display: flex;
  gap: 7px;
}

.w8-comment-send-row button {
  flex-shrink: 0;
  padding: 0 16px;

  background: linear-gradient(
    145deg, #577b43, #294a2c
  );

  border: 1px solid #d1b26b;
  border-radius: 7px;

  color: #fff;
  font-weight: 900;
  cursor: pointer;
}

.w8-comment-send-row button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#w8CommentStatus {
  color: #d6b980;
  font-size: 11px;
  margin-top: 6px;
  min-height: 12px;
}



/* =====================================
   MILITARY FLOATING CHAT BUTTON
===================================== */

.w8-chat-toggle {
  position: fixed;

  right: 18px;
  bottom: calc(18px + env(safe-area-inset-bottom));

  width: 56px;
  height: 56px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(
    145deg,
    #60794a 0%,
    #304c32 45%,
    #102419 100%
  );

  border: 2px solid #d0b16b;
  border-radius: 50%;

  color: #ffffff;
  font-size: 25px;

  box-shadow:
    0 5px 18px #000b,
    0 0 12px #9ecb6940,
    inset 0 2px 3px #ffffff30;

  z-index: 200;
  cursor: pointer;

  transition: transform .2s, background .2s;
}

.w8-chat-toggle:active {
  transform: scale(.92);
}

/* When the comment panel is open */

.w8-chat-toggle.active {
  background: linear-gradient(
    145deg,
    #a35b3b,
    #6b2626 65%,
    #341313
  );

  border-color: #e2ad73;
}

/* Unread comment count */

.w8-chat-unread {
  position: absolute;
  top: -5px;
  right: -5px;

  min-width: 21px;
  height: 21px;

  padding: 0 4px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #e53535;
  border: 2px solid #101d13;
  border-radius: 20px;

  color: #ffffff;
  font-size: 10px;
  font-weight: 900;
}

.w8-chat-unread[hidden] {
  display: none !important;
}

/* =====================================
   CHAT PANEL OPEN / CLOSE
===================================== */

.w8-viewer-chat {
  bottom: calc(86px + env(safe-area-inset-bottom));

  width: min(430px, calc(100% - 24px));
  max-height: calc(100dvh - 110px);

  overflow-y: auto;

  animation: w8ChatOpen .22s ease-out;
}

.w8-viewer-chat[hidden] {
  display: none !important;
}

@keyframes w8ChatOpen {
  from {
    opacity: 0;
    transform: translate(-50%, 15px) scale(.97);
  }

  to {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }
}



/* ==========================================
   MILITARY LIVE
   PREMIUM FULLSCREEN VIEWER
========================================== */

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

body {
  position: fixed;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  font-family: system-ui, sans-serif;
  overscroll-behavior: none;
}

/* FULLSCREEN LAYOUT */

#liveViewer {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  display: block;
  background: #000;
  overflow: hidden;
}

/* REMOVE OLD PAGE ELEMENTS */

header,
.note {
  display: none !important;
}

/* GAME SCREEN */

#liveViewer .video-wrap {
  position: absolute;
  inset: 0;

  width: 100%;
  max-width: none;
  height: 100%;

  aspect-ratio: auto;

  margin: 0;
  padding: 0;

  border: none;
  border-radius: 0;
  box-shadow: none;

  overflow: hidden;
  background: #000;
}

/* FILL ENTIRE VIEWPORT */

#liveViewer #screen,
#liveViewer #screenFrame {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  margin: 0;
  padding: 0;

  object-fit: fill;
  object-position: center;

  border: none;
  border-radius: 0;

  background: #000;
}

#liveViewer #screenFrame[hidden] {
  display: none !important;
}

/* FLOATING CONNECTION STATUS */

#status {
  position: fixed;

  top: calc(12px + env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);

  z-index: 50;

  width: max-content;
  max-width: calc(100% - 40px);

  padding: 9px 16px;

  background: rgba(8, 13, 10, .75);
  border: 1px solid rgba(209, 185, 119, .28);
  border-radius: 30px;

  color: #eee5cb;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .45px;

  text-align: center;
  line-height: 1.45;

  box-shadow: 0 5px 22px rgba(0, 0, 0, .25);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  pointer-events: none;
}

/* SMALL FULLSCREEN CONTROL */

#liveViewer .fullscreen-btn {
  position: fixed;

  left: calc(14px + env(safe-area-inset-left));
  bottom: calc(16px + env(safe-area-inset-bottom));

  z-index: 60;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 44px;
  height: 44px;

  padding: 0;

  background: rgba(10, 16, 12, .68);
  border: 1px solid rgba(214, 192, 134, .3);
  border-radius: 13px;

  color: #f4e5bf;
  font-size: 23px;
  font-weight: 400;

  box-shadow: 0 5px 20px rgba(0, 0, 0, .25);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  cursor: pointer;
}

#liveViewer .fullscreen-btn:active {
  transform: scale(.94);
}

/* FLOATING CHAT BUTTON */

.w8-chat-toggle {
  position: fixed;

  right: calc(14px + env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom));

  z-index: 200;

  display: flex;
  align-items: center;
  justify-content: center;

  width: 68px;
  height: 44px;

  background: rgba(10, 16, 12, .78);
  border: 1px solid rgba(214, 192, 134, .4);
  border-radius: 13px;

  color: #f1e4be;

  box-shadow: 0 5px 20px rgba(0, 0, 0, .3);

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  transition: transform .18s ease;
}

.w8-chat-toggle.active {
  background: rgba(49, 33, 27, .9);
  border-color: rgba(214, 192, 134, .5);
}

#w8ChatIcon {
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 1px;
}

/* PREMIUM FLOATING COMMENTS */

.w8-viewer-chat {
  position: fixed;

  left: auto;
  right: 12px;

  bottom: calc(72px + env(safe-area-inset-bottom));

  transform: none;

  width: min(390px, calc(100% - 24px));
  max-height: min(65dvh, 540px);

  z-index: 190;

  padding: 16px;

  background: rgba(13, 20, 16, .97);
  border: 1px solid rgba(199, 172, 112, .4);
  border-radius: 18px;

  box-shadow: 0 15px 55px rgba(0, 0, 0, .55);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  overflow-y: auto;

  animation: w8PanelRise .2s ease-out;
}

.w8-viewer-chat[hidden] {
  display: none !important;
}

@keyframes w8PanelRise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* CHAT HEADER */

.w8-chat-header {
  margin-bottom: 14px;
  padding-bottom: 12px;

  border-bottom: 1px solid rgba(255,255,255,.09);

  color: #e7d3a0;
  font-size: 12px;
  letter-spacing: .7px;
}

/* COMMENT LIST */

.w8-comment-list {
  max-height: 180px;
  gap: 8px;
}

.w8-viewer-comment {
  padding: 9px 11px;

  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.045);
  border-radius: 9px;

  font-size: 12px;
}

/* CHAT INPUTS */

#w8CommentName,
#w8CommentInput {
  height: 42px;

  background: #172019;
  border: 1px solid #39473a;
  border-radius: 9px;

  color: #fff;
  font-size: 16px;

  outline: none;
}

#w8CommentName:focus,
#w8CommentInput:focus {
  border-color: #bba36a;
}

/* SEND BUTTON */

.w8-comment-send-row button {
  background: linear-gradient(
    145deg,
    #d6bb7e,
    #9c7b40
  );

  border: none;
  border-radius: 9px;

  color: #17150f;
  font-size: 11px;
  font-weight: 900;
}

/* SMALL MOBILE SCREENS */

@media (max-width: 380px) {
  #status {
    top: calc(8px + env(safe-area-inset-top));
    font-size: 10px;
  }

  .w8-viewer-chat {
    padding: 12px;
  }
}




/* ==========================================
   MILITARY LIVE - PREMIUM CHAT UI
========================================== */

/* FLOATING CHAT BUTTON */

#w8ChatToggle {
  position: fixed;
  right: max(14px, env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom));

  left: auto;
  top: auto;

  z-index: 250;

  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;

  width: auto;
  min-width: 88px;
  height: 43px;
  padding: 0 17px;

  background: rgba(22, 32, 25, .92);
  border: 1px solid rgba(204, 181, 126, .52);
  border-radius: 999px;

  color: #f0e2c2;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.3px;

  box-shadow:
    0 6px 22px rgba(0, 0, 0, .3),
    inset 0 1px 0 rgba(255,255,255,.07);

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  cursor: pointer;

  transition:
    background .2s ease,
    transform .2s ease,
    border-color .2s ease;
}

#w8ChatToggle:active {
  transform: scale(.96);
}

#w8ChatToggle.active {
  background: #374638;
  border-color: #cfb784;
}

/* BUTTON LIVE INDICATOR */

.w8-chat-indicator {
  width: 6px;
  height: 6px;
  flex-shrink: 0;

  background: #a4ca90;
  border-radius: 50%;

  box-shadow: 0 0 8px rgba(164,202,144,.45);
}

#w8ChatIcon {
  color: #eddfc0;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

/* UNREAD BADGE */

#w8ChatUnread {
  position: absolute;
  top: -7px;
  right: -6px;

  min-width: 20px;
  height: 20px;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 0 5px;

  background: #c0a273;
  border: 2px solid #18211b;
  border-radius: 20px;

  color: #1b1b15;
  font-size: 10px;
  font-weight: 900;
}

#w8ChatUnread[hidden] {
  display: none !important;
}

/* MAIN FLOATING PANEL */

#w8ViewerChat {
  position: fixed;

  top: auto;
  left: auto;
  right: 12px;
  bottom: calc(72px + env(safe-area-inset-bottom));

  transform: none;

  z-index: 240;

  display: flex;
  flex-direction: column;

  width: min(410px, calc(100% - 24px));
  height: auto;
  max-height: min(64dvh, 510px);

  margin: 0;
  padding: 0;

  overflow: hidden;

  background:
    linear-gradient(
      155deg,
      rgba(28, 39, 30, .98),
      rgba(12, 19, 15, .98)
    );

  border: 1px solid rgba(196,174,126,.38);
  border-radius: 18px;

  box-shadow:
    0 18px 60px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.07);

  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  animation: w8PremiumChatIn .22s ease-out both;
}

#w8ViewerChat[hidden] {
  display: none !important;
}

@keyframes w8PremiumChatIn {
  from {
    opacity: 0;
    transform: translateY(12px) scale(.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* PANEL HEADER */

#w8ViewerChat .w8-chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 12px;

  flex-shrink: 0;

  margin: 0;
  padding: 17px 17px 15px;

  background: transparent;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.w8-chat-heading {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.w8-chat-eyebrow {
  color: #a99b76;

  font-size: 9px;
  font-weight: 800;
  letter-spacing: 2px;
}

.w8-chat-title {
  margin: 0;

  color: #f1e8d7;
  font-size: 18px;
  font-weight: 750;
  letter-spacing: -.35px;
  line-height: 1.2;
}

.w8-chat-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* LIVE BADGE */

#w8ViewerChat .w8-chat-live {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 6px 9px;

  background: rgba(132,177,118,.1);
  border: 1px solid rgba(145,190,129,.2);
  border-radius: 30px;

  color: #b7d7aa;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
}

.w8-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #9cc78b;
}

/* CLOSE BUTTON */

.w8-chat-close {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 29px;
  height: 29px;
  padding: 0;

  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 8px;

  color: #c7c9bc;
  font-size: 21px;
  font-weight: 400;
  line-height: 1;

  cursor: pointer;
}

.w8-chat-close:active {
  background: rgba(255,255,255,.13);
}

/* SCROLLABLE COMMENT FEED */

.w8-chat-feed {
  flex: 1 1 auto;
  min-height: 0;

  overflow-y: auto;
  overscroll-behavior: contain;

  scrollbar-width: thin;
  scrollbar-color: #53604f transparent;
}

#w8CommentList {
  display: flex;
  flex-direction: column;
  gap: 14px;

  min-height: 110px;
  max-height: none;

  margin: 0;
  padding: 17px;

  overflow: visible;
}

/* EMPTY CHAT STATE */

#w8CommentList:empty::before {
  content: "No comments yet. Start the conversation.";

  display: flex;
  align-items: center;
  justify-content: center;

  min-height: 76px;

  color: #819084;
  font-size: 12px;
  text-align: center;
  line-height: 1.5;
}

/* INDIVIDUAL COMMENTS */

#w8ViewerChat .w8-viewer-comment {
  display: block;

  margin: 0;
  padding: 0;

  background: transparent;
  border: none;
  border-radius: 0;

  box-shadow: none;

  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

#w8ViewerChat .w8-viewer-comment-name {
  color: #d5bc87;
  font-size: 12px;
  font-weight: 800;
}

#w8ViewerChat .w8-viewer-comment-text {
  color: #e4e9e0;

  margin-left: 6px;

  font-size: 12px;
  font-weight: 400;
  line-height: 1.6;
}

/* COMPOSER AREA */

#w8CommentForm {
  display: flex;
  flex-direction: column;
  gap: 9px;

  flex-shrink: 0;

  padding: 13px 14px 14px;

  background: rgba(0,0,0,.17);
  border-top: 1px solid rgba(255,255,255,.08);
}

/* INPUT FIELDS */

#w8CommentName,
#w8CommentInput {
  display: block;

  width: 100%;
  min-width: 0;
  height: 43px;

  margin: 0;
  padding: 0 13px;

  background: rgba(41,53,43,.65);
  border: 1px solid rgba(134,151,128,.25);
  border-radius: 10px;

  color: #f3f2ed;

  font-family: inherit;
  font-size: 16px;
  font-weight: 400;

  outline: none;
  box-shadow: none;

  user-select: text;
  -webkit-user-select: text;

  transition:
    border-color .18s ease,
    background .18s ease;
}

#w8CommentName::placeholder,
#w8CommentInput::placeholder {
  color: #8e9a8d;
}

#w8CommentName:focus,
#w8CommentInput:focus {
  background: #29372d;
  border-color: #c2ab7c;
}

/* MESSAGE INPUT + SEND */

#w8ViewerChat .w8-comment-send-row {
  display: flex;
  align-items: stretch;
  gap: 8px;

  width: 100%;
  min-width: 0;
}

#w8CommentInput {
  flex: 1;
}

#w8CommentSend {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  flex: 0 0 auto;

  min-width: 72px;
  height: 43px;
  padding: 0 13px;

  background: linear-gradient(
    145deg,
    #dbc492,
    #af915d
  );

  border: 1px solid rgba(255,236,186,.2);
  border-radius: 10px;

  color: #1f221a;

  font-family: inherit;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .5px;

  cursor: pointer;

  transition: filter .18s ease;
}

#w8CommentSend:active {
  filter: brightness(.9);
}

#w8CommentSend:disabled {
  opacity: .45;
  cursor: not-allowed;
}

/* FORM STATUS */

#w8CommentStatus {
  min-height: 0;
  margin: 0;

  color: #d6bb87;
  font-size: 11px;
  line-height: 1.5;
}

#w8CommentStatus:empty {
  display: none;
}

/* MOBILE OPTIMIZATION */

@media (max-width: 430px) {

  #w8ViewerChat {
    right: 10px;
    width: calc(100% - 20px);
    max-height: min(62dvh, 490px);
    border-radius: 16px;
  }

  #w8ViewerChat .w8-chat-header {
    padding: 15px;
  }

  #w8CommentList {
    padding: 15px;
  }

  #w8CommentForm {
    padding: 12px;
  }
}

@media (prefers-reduced-motion: reduce) {
  #w8ViewerChat {
    animation: none;
  }
}



/* ==================================
   MILITARY LIVE - EXIT BUTTON
================================== */

#w8ExitViewer[hidden] {
  display: none !important;
}

#w8ExitViewer {
  position: fixed;

  top: calc(14px + env(safe-area-inset-top, 0px));
  left: calc(14px + env(safe-area-inset-left, 0px));

  z-index: 300;

  display: flex;
  align-items: center;
  justify-content: center;

  min-width: 74px;
  height: 40px;

  padding: 0 17px;

  border: 1px solid rgba(216, 188, 126, .55);
  border-radius: 11px;

  background: rgba(18, 26, 19, .92);

  color: #f0ddad;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 1.1px;

  box-shadow: 0 5px 18px rgba(0, 0, 0, .35);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  cursor: pointer;
  touch-action: manipulation;
}

#w8ExitViewer:active {
  transform: scale(.96);
  background: rgba(58, 71, 49, .95);
}



</style>
</head>


<body>

<!-- =====================================
     MILITARY LIVE - FULL SCREEN VIEWER
===================================== -->

<main id="liveViewer">

  <div class="video-wrap">

    <!-- WEBRTC STREAM -->
    <video
      id="screen"
      autoplay
      muted
      playsinline
      disablepictureinpicture>
    </video>

    <!-- MOBILE FRAME STREAM -->
    <img
      id="screenFrame"
      alt="Shared game screen"
      hidden>

  </div>

  <!-- FLOATING LIVE STATUS -->
  <div id="status" role="status" aria-live="polite">
    Connecting...
  </div>



<!-- RETURN TO GAME -->
<button
  id="w8ExitViewer"
  class="w8-exit-viewer"
  type="button"
  onclick="w8ExitToGame()"
  aria-label="Exit and return to game"
  hidden>
  <span>EXIT</span>
</button>



  <!-- OPTIONAL NATIVE FULLSCREEN -->
  <button
    class="fullscreen-btn"
    type="button"
    onclick="fullScreen()"
    aria-label="Enter fullscreen"
    title="Fullscreen">
    ⛶
  </button>

</main>






<!-- ==========================================
     MILITARY LIVE - PREMIUM CHAT
========================================== -->

<!-- FLOATING CHAT BUTTON -->
<button
  id="w8ChatToggle"
  class="w8-chat-toggle"
  type="button"
  onclick="w8ToggleChat()"
  aria-controls="w8ViewerChat"
  aria-expanded="false"
  aria-label="Open comments">

  <span class="w8-chat-indicator"></span>

  <span id="w8ChatIcon">CHAT</span>

  <span
    id="w8ChatUnread"
    class="w8-chat-unread"
    hidden>0</span>

</button>


<!-- FLOATING CHAT PANEL -->
<section
  id="w8ViewerChat"
  class="w8-viewer-chat"
  aria-label="Live comments"
  hidden>

  <!-- HEADER -->
  <div class="w8-chat-header">

    <div class="w8-chat-heading">

      <span class="w8-chat-eyebrow">
        MILITARY LIVE
      </span>

      <h2 class="w8-chat-title">
        Live Comments
      </h2>

    </div>

    <div class="w8-chat-header-actions">

      <span class="w8-chat-live">
        <span class="w8-live-dot"></span>
        LIVE
      </span>

      <button
        type="button"
        class="w8-chat-close"
        onclick="w8ToggleChat()"
        aria-label="Close comments">
        &times;
      </button>

    </div>

  </div>


  <!-- COMMENT FEED -->
  <div class="w8-chat-feed">

    <div
      id="w8CommentList"
      class="w8-comment-list"
      role="log"
      aria-label="Recent live comments"
      aria-live="polite">
    </div>

  </div>


  <!-- COMMENT COMPOSER -->
  <form
    id="w8CommentForm"
    class="w8-chat-composer"
    autocomplete="off">

    <input
      id="w8CommentName"
      type="text"
      maxlength="20"
      placeholder="Your display name"
      aria-label="Display name">

    <div class="w8-comment-send-row">

      <input
        id="w8CommentInput"
        type="text"
        maxlength="120"
        placeholder="Write a comment..."
        aria-label="Comment"
        required>

      <button
        id="w8CommentSend"
        type="submit">
        SEND
      </button>

    </div>

    <div
      id="w8CommentStatus"
      role="status"
      aria-live="polite">
    </div>

  </form>

</section>


<script>
const params = new URLSearchParams(location.search);
const token = params.get("room") || "";



/* =====================================
   EXIT VIEWER - RETURN TO GAME
===================================== */

const w8FromSettings =
  params.get("entry") === "settings";

const w8ExitButton =
  document.getElementById("w8ExitViewer");

// Chỉ hiển thị khi vào từ Settings
if (w8ExitButton) {
  w8ExitButton.hidden = !w8FromSettings;
}

function w8ExitToGame() {

  // Thoát chế độ fullscreen nếu đang bật
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }

  // Giải phóng kết nối xem
  closePeer();

  if (socket.connected) {
    socket.disconnect();
  }

  // Đóng tab xem để quay lại tab game gốc
  window.close();

  // Dự phòng nếu trình duyệt không cho đóng tab
  setTimeout(() => {
    if (!window.closed) {
      window.location.replace("/game-military.html");
    }
  }, 350);

}



const video = document.getElementById("screen");
const status = document.getElementById("status");

const socket = io();

let pc = null;
let pendingIce = [];

let iceServers = [
  { urls: "stun:stun.l.google.com:19302" }
];

function setStatus(message) {
  status.textContent = message;
}

function closePeer() {

  if (pc) pc.close();

  pc = null;
  pendingIce = [];
  video.srcObject = null;

const frame = document.getElementById("screenFrame");

frame.hidden = true;
frame.removeAttribute("src");

video.style.display = "block";


}

async function getIce() {

  try {

    const res = await fetch("/ice");

    if (res.ok) {
      const data = await res.json();

      if (
        Array.isArray(data.iceServers) &&
        data.iceServers.length
      ) {
        return data.iceServers;
      }
    }

  } catch (err) {
    console.warn(err);
  }

  return [
    { urls: "stun:stun.l.google.com:19302" }
  ];
}

// Connect to the server and join the viewing session
socket.on("connect", async () => {

  closePeer();

  if (!/^[a-f0-9]{36}$/.test(token)) {
    setStatus("Invalid sharing link.");
    return;
  }

  setStatus("Connecting to the broadcaster...");

  iceServers = await getIce();

  if (!socket.connected) return;

  socket.timeout(10000).emit(
    "w8share:join",
    { token },
    (err, reply) => {

if (err || !reply?.ok) {

  setStatus(
    reply?.error || "Unable to join the viewing room."
  );

} else if (reply.paused) {

  setStatus(
    "Broadcaster temporarily offline. Waiting for LIVE..."
  );

} else {

  setStatus(
    "Connected. Waiting for the video stream..."
  );

}

    }
  );

});

	// Receive WebRTC video and signaling
socket.on("w8share:signal", async ({ from, packet }) => {

  try {

    if (packet.type === "offer") {

     	// Preserve ICE candidates received before the offer
      const earlyIce = pendingIce.slice();

      closePeer();
      pendingIce = earlyIce;

      pc = new RTCPeerConnection({ iceServers });

      const current = pc;

      current.ontrack = event => {

        video.srcObject =
          event.streams[0] ||
          new MediaStream([event.track]);

video.play().catch(() => {
  setStatus("Tap the video to play.");
});

      };

      current.onicecandidate = event => {

        if (event.candidate) {

          socket.emit("w8share:signal", {
            token,
            to: from,
            packet: {
              type: "candidate",
              candidate: event.candidate
            }
          });

        }

      };

current.onconnectionstatechange = () => {

  if (current.connectionState === "connected") {
    setStatus("🔴 WATCHING LIVE");
  }

  if (current.connectionState === "failed") {
    setStatus(
      "Video connection lost. Please reload the page."
    );
  }

};

      await current.setRemoteDescription(
        packet.description
      );

    	// Process early ICE candidates
      const buffered = pendingIce.splice(0);

      for (const candidate of buffered) {
        await current.addIceCandidate(candidate);
      }

      const answer = await current.createAnswer();
      await current.setLocalDescription(answer);

      socket.emit("w8share:signal", {
        token,
        to: from,
        packet: {
          type: "answer",
          description: current.localDescription
        }
      });

    } else if (
      packet.type === "candidate" &&
      packet.candidate
    ) {

      if (pc && pc.remoteDescription) {

        await pc.addIceCandidate(
          packet.candidate
        );

      } else {

        pendingIce.push(packet.candidate);

      }

    }

} catch (err) {

  console.error(err);
  setStatus("Unable to establish the video connection.");

}

});

// Broadcaster stopped screen sharing
socket.on("w8share:ended", () => {

  closePeer();
  setStatus("The broadcaster has stopped screen sharing.");

});

// Socket disconnected
socket.on("disconnect", () => {

  closePeer();
  setStatus("Connection lost. Reconnecting...");

});


// The broadcaster temporarily left the game.
socket.on("w8share:paused", () => {

  closePeer();

  setStatus(
    "LIVE temporarily paused. Waiting for broadcaster..."
  );

});

// The broadcaster has returned.
socket.on("w8share:resumed", () => {

  setStatus(
    "Broadcaster reconnected. Restoring LIVE..."
  );

});

// Resume pending connection after returning to this tab.
document.addEventListener("visibilitychange", () => {

  if (document.hidden) return;

  if (!socket.connected && !socket.active) {
    socket.connect();
  }

});




// Fullscreen

async function fullScreen() {

  const target = document.documentElement;

  try {

    if (document.fullscreenElement) {
      await document.exitFullscreen();
      return;
    }

    if (target.requestFullscreen) {
      await target.requestFullscreen();
      return;
    }

    if (target.webkitRequestFullscreen) {
      target.webkitRequestFullscreen();
      return;
    }

  } catch (error) {
    console.warn("Fullscreen unavailable:", error);
  }

  // Fallback for supported iOS video fullscreen.
  const video = document.getElementById("screen");
  const frame = document.getElementById("screenFrame");

  if (frame.hidden && video.webkitEnterFullscreen) {
    video.webkitEnterFullscreen();
  }

}



// Receive game screen frames from mobile devices
socket.on("w8share:frame", (data) => {

  if (
    typeof data?.image !== "string" ||
    !data.image.startsWith("data:image/jpeg;base64,")
  ) return;

  const frame = document.getElementById("screenFrame");
  const video = document.getElementById("screen");

  frame.src = data.image;
  frame.hidden = false;

  	// Hide WebRTC video when displaying screen frames
  video.style.display = "none";

document.getElementById("status").textContent =
  "🔴 WATCHING LIVE";

});




/* ======================================
   WHEEL8 VIEWER COMMENT SYSTEM
====================================== */

const w8ChatForm =
  document.getElementById("w8CommentForm");

const w8ChatInput =
  document.getElementById("w8CommentInput");

const w8ChatName =
  document.getElementById("w8CommentName");

const w8ChatSend =
  document.getElementById("w8CommentSend");

const w8ChatStatus =
  document.getElementById("w8CommentStatus");

const w8ChatList =
  document.getElementById("w8CommentList");


  
/* =====================================
   TOGGLE LIVE COMMENT PANEL
===================================== */

let w8UnreadCount = 0;

function w8ToggleChat() {

  const panel =
    document.getElementById("w8ViewerChat");

  const button =
    document.getElementById("w8ChatToggle");

  const icon =
    document.getElementById("w8ChatIcon");

  const unread =
    document.getElementById("w8ChatUnread");

  const opening = panel.hidden;

  panel.hidden = !opening;

  button.classList.toggle("active", opening);

  button.setAttribute(
    "aria-expanded",
    String(opening)
  );

button.setAttribute(
  "aria-label",
  opening ? "Close comments" : "Open comments"
);

  icon.textContent = opening ? "CLOSE" : "CHAT";

  	// Mark comments as read when opening the chat
  if (opening) {

    w8UnreadCount = 0;
    unread.hidden = true;

    const list =
      document.getElementById("w8CommentList");

    list.scrollTop = list.scrollHeight;

  }

}



// Send comment
w8ChatForm.addEventListener("submit", (event) => {

  event.preventDefault();

const content = w8ChatInput.value.trim();
const name = w8ChatName.value.trim() || "Viewer";

  if (!content) return;

if (!socket.connected) {
  w8ChatStatus.textContent =
    "Not connected to the server.";
  return;
}

  w8ChatSend.disabled = true;
  w8ChatStatus.textContent = "";

  socket.timeout(8000).emit(
    "w8share:comment",
    {
      token,
      name,
      text: content
    },
    (error, reply) => {

      w8ChatSend.disabled = false;

if (error || !reply?.ok) {

  w8ChatStatus.textContent =
    reply?.error || "Unable to send your comment.";

  return;
}

      w8ChatInput.value = "";
      w8ChatStatus.textContent = "";

    }
  );

});

// Receive comments from the server
socket.on("w8share:comment", (data) => {

  if (data?.token !== token) return;

  const item = document.createElement("div");
  item.className = "w8-viewer-comment";

const username = document.createElement("span");
username.className = "w8-viewer-comment-name";
username.textContent =
  String(data.name || "Viewer") + ":";

  const content = document.createElement("span");
  content.className = "w8-viewer-comment-text";
  content.textContent = String(data.text || "");

  item.appendChild(username);
  item.appendChild(content);

  w8ChatList.appendChild(item);

  
// =====================================
// UNREAD COMMENT BADGE
// =====================================

const chatPanel =
  document.getElementById("w8ViewerChat");

const unreadBadge =
  document.getElementById("w8ChatUnread");

// Increment the counter only when the panel is closed
if (chatPanel.hidden) {

  w8UnreadCount++;

  unreadBadge.textContent =
    w8UnreadCount > 99
      ? "99+"
      : String(w8UnreadCount);

  unreadBadge.hidden = false;

}


  	// Keep only the latest 30 comments
  while (w8ChatList.children.length > 30) {
    w8ChatList.firstElementChild.remove();
  }

  // Automatically scroll to the newest comment
  w8ChatList.scrollTop = w8ChatList.scrollHeight;

});

// Broadcaster ended the LIVE session
socket.on("w8share:ended", () => {

  w8ChatInput.disabled = true;
  w8ChatSend.disabled = true;

  w8ChatStatus.textContent =
    "The LIVE session has ended.";

});

// Disable commenting when disconnected
socket.on("disconnect", () => {

  w8ChatSend.disabled = true;
  w8ChatStatus.textContent =
    "Reconnecting...";

});

// Re-enable commenting after reconnecting
// The server still validates LIVE session access
socket.on("connect", () => {

  w8ChatInput.disabled = false;
  w8ChatSend.disabled = false;
  w8ChatStatus.textContent = "";

});




</script>

</body>
</html>
