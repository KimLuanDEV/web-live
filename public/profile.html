<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <!-- PWA iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livestream Pro">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">


  <title>👤 Hồ sơ cá nhân</title>
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

 <link rel="manifest" href="/manifest.json">

<!-- icon cho iOS -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/style.css" />



  <style>

    .transfer-preview{
margin:10px 0;
padding:10px;
border-radius:10px;
background:#111;
border:1px solid #333;
}

.transfer-preview.hidden{
display:none;
}

.transfer-user{
display:flex;
align-items:center;
gap:10px;
}

.transfer-user img{
width:48px;
height:48px;
border-radius:50%;
object-fit:cover;
}

.transfer-info{
display:flex;
flex-direction:column;
font-size:14px;
}

#transferName{
font-weight:600;
}

#transferLevel{
color:#f7d046;
}

#transferCoin{
color:#6ee7ff;
}

  </style>
</head>

<body class="page-profile">



<script src="/guard.js"></script>


   <!-- HEADER -->

  <!-- PROFILE COVER -->
<div class="profile-cover">
  <img id="coverPreview"
       src="https://i.ibb.co/3mY0H4Xh/Chat-GPT-Image-Jan-19-2026-09-44-27-AM.jpg"
       alt="cover">

  <div class="cover-actions">
    <button id="btnChangeCover">📷</button>
  </div>

  <input type="file" id="coverInput" accept="image/*" hidden>
</div>   
    



<div class="container">
  <div class="profile-shell">



<!-- AVATAR + BASIC INFO -->
<div class="profile-header fb-style">

  <div class="avatar-wrap fb-avatar">
    <img id="avatarPreview"
         src="https://i.ibb.co/ZR2yR7dJ/Chat-GPT-Image-Jan-12-2026-02-44-07-AM.jpg">
    <div id="avatarCrown" class="avatar-crown hidden">👑</div>
    <div class="avatar-camera">📷</div>
  </div>

  <input type="file" id="avatarInput" accept="image/*" hidden>

  <div class="profile-info fb-info">

    <div class="profile-name" id="displayName">
  <span id="profileNameText">User</span>
</div>


    <input id="nameInput" class="name-input hidden" placeholder="Nhập tên của bạn">
  </div>

</div>


<!-- BIO / NOTE -->

  <div class="bio-label">📝 Giới thiệu</div>
  <textarea id="bioInput" placeholder="Viết vài dòng về bạn..." rows="5"></textarea>


  <button class="btn-profile-friends"
        onclick="location.href='/friends.html'">
  <span class="icon">👥</span>
  <span class="text">Bạn bè</span>

  <!-- 🔢 badge số bạn -->
  <span class="friend-badge" id="friendCount" hidden>0</span>

  <!-- 🔔 badge lời mời -->
  <span class="friend-req-badge" id="friendReqCount" hidden>0</span>
</button>


<!-- 👀 Actions khi xem profile người khác -->
<div class="profile-friend-actions" id="profileFriendActions">
  <button class="btn-msg" id="btnMsgFriend">💬 Nhắn tin</button>
  <button class="btn-primary" id="btnAddFriend">➕ Kết bạn</button>
  <button class="btn-waiting" id="btnFriendPending">⏳ Đã gửi lời mời</button>
  <button class="btn-danger" id="btnUnfriend">🚫 Huỷ bạn</button>
  <button class="btn-danger-outline" id="btnBlock">⛔ Block</button>
</div>





  <!-- LEVEL -->
  <div class="profile-level">
    <div class="level-left">
      <div class="level-badge">⭐ Level <b id="levelVal">1</b></div>
      <div id="vipBadgeBox"></div>
    </div>

    <div class="exp-card">
      <div class="exp-head">
        <span>EXP</span>
        <span id="expText">0 / 100</span>
      </div>
      <div class="exp-bar">
        <div class="exp-bar__fill" id="expFill"></div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="profile-stats">


   <div class="stat-box clickable badge-topup" id="btnTopupCoin">
  <span class="stat-badge">NẠP</span>
  <div class="stat-label">💎 Kim cương</div>
  <div class="stat-val" id="coinVal">0</div>
</div>


<div class="stat-box gold clickable badge-invest" id="btnInvest">
  <span class="stat-badge">ĐẦU TƯ</span>
  <div class="stat-label">💎 Đã sử dụng</div>
  <div class="stat-val" id="coinSentVal">0</div>
</div>



    <div class="stat-box blue clickable badge-withdraw" id="btnWithdraw">
  <span class="stat-badge">RÚT</span>
  <div class="stat-label">💵 Ví tiền</div>
  <div class="stat-val" id="coinReceivedVal">0</div>
</div>



<button class="btn-profile-library"
        onclick="location.href='/library.html'">
  <span class="icon">📚</span>
  <span class="text">Thư viện</span>
</button>


<div class="stat-box purple clickable" id="btnTransferCoin">
  <span class="stat-badge">GỬI</span>
  <div class="stat-label">💎 Chuyển kim cương</div>
</div>


  </div>


  






  <!-- ACTIONS -->
  <div class="profile-actions" style="display: none;">
    <button id="btnSave">💾 Lưu</button>
    <button id="btnChangePass">🔐 Đổi mật khẩu</button>
    <button id="btnMessages" style="display: none;">📩 Tin nhắn</button>
    <button onclick="location.href='/lobby.html'">🏟 Lobby</button>
  </div>



  <!-- 🔐 CHANGE PASSWORD -->
<div id="passModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <h3>🔐 Đổi mật khẩu</h3>

    <input id="oldPass" type="password" placeholder="Mã bảo mật">
    <input id="newPass" type="password" placeholder="Mật khẩu mới">
    <input id="newPass2" type="password" placeholder="Nhập lại mật khẩu mới">

    <div style="display:flex;gap:10px;margin-top:12px">
      <button onclick="closePass()">Hủy</button>
      <button onclick="submitChangePass()">Đổi mật khẩu</button>
    </div>
  </div>
</div>

</div>

<!-- GLOBAL MESSAGE MODAL -->
<div id="msgModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <h3 id="msgTitle">Thông báo</h3>
    <div id="msgText" style="margin:12px 0;opacity:.9"></div>

    <div class="msg-actions">
      <button id="msgCancel" onclick="closeMsg()">Hủy</button>
      <button id="msgOk">OK</button>
    </div>
  </div>
</div>



<!-- MOBILE TAB BAR -->
<div class="mobile-tabbar">
  <div class="tab-item" data-tab="lobby">
    <div class="tab-icon">🏟</div>
    <div class="tab-text">Lobby</div>
  </div>

  <div class="tab-item" data-tab="hot">
    <div class="tab-icon">🌍</div>
    <div class="tab-text">Status</div>
  </div>

 <div class="tab-item tab-main" id="tabSettings">
  <div class="tab-plus">⚙️</div>
  <div class="tab-text">Settings</div>
</div>

  <div class="tab-item" data-tab="chat">
    <div class="tab-icon">💬</div>
    <div class="tab-text">Inbox</div>
  </div>

  <div class="tab-item active" data-tab="profile">
    <div class="tab-icon">👤</div>
    <div class="tab-text">Profile</div>
  </div>
</div>




<!-- PROFILE SETTINGS BOTTOM SHEET -->
<div id="profileSheet" class="sheet hidden">
  <div class="sheet-backdrop" onclick="closeProfileSheet()"></div>

  <div class="sheet-panel">
    <div class="sheet-handle"></div>

    <div class="sheet-title">⚙️ Cài đặt tài khoản</div>

   
     <button class="sheet-btn hidden" id="btnAdmin">
      🛠 Admin
     </button>

<button class="sheet-btn hidden" id="btnAdminPanel">
  👑 Admin Control Panel
</button>


       <button class="sheet-btn primary" id="btnWithdrawFromSheet">
    💵 Rút tiền
     </button>
     

    <button class="sheet-btn" onclick="openChangePass()">
      🔐 Đổi mật khẩu
    </button>

   <button class="sheet-btn danger" onclick="confirmLogoutProfile()">
  ⏻ Đăng xuất
</button>


    <button class="sheet-btn ghost" onclick="closeProfileSheet()">
      ✖ Hủy
    </button>
  </div>
</div>


<div id="toast-container"></div>




<div id="transferModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">

    <h3>💎 Chuyển kim cương</h3>


<input id="transferTarget" placeholder="Tên nhân vật hoặc UID">

<div id="transferPreview" class="transfer-preview hidden">

  <div class="transfer-user">

    <img id="transferAvatar">

    <div class="transfer-info">
      <div id="transferName"></div>
      <div id="transferLevel"></div>
      <div id="transferCoin"></div>
    </div>

  </div>

</div>

<input id="transferAmount" type="number" placeholder="Số kim cương">




    <div style="display:flex;gap:10px;margin-top:12px">
      <button onclick="closeTransfer()">Huỷ</button>
      <button onclick="submitTransfer()">Chuyển</button>
    </div>

  </div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/profile.js"></script>
<script src="/push-init.js"></script>
<script src="/app-entry-guard.js"></script>

</body>
</html>
