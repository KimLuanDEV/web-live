<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>👤 Hồ sơ cá nhân</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>

    <script src="/guard.js"></script>

    
  <div class="container">
    <div class="card">

      <h1>👤 Thông tin cá nhân</h1>
      <small>Cập nhật hồ sơ hiển thị trong Livestream</small>

      <hr />

      <!-- AVATAR -->
      <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap">
        <img id="avatarPreview"
             src="https://img.freepik.com/premium-vector/live-streaming-text-neon-sign-illustration_189374-265.jpg?w=360"
             style="width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,255,255,.25)" />

<input
  type="file"
  id="avatarInput"
  accept="image/*"
  style="display:none"
/>

<button id="btnChangeAvatar" type="button">
  📤 Đổi avatar
</button>



        <div style="flex:1">
          <label>Tên hiển thị</label>
          <input id="nameInput" placeholder="Nhập tên của bạn" />
        </div>
      </div>

      <hr />

     <!-- STATS -->
<div class="row">
  <div class="card">
    <div class="badge badge--info">💎 Kim cương</div>
    <h2 id="coinVal">0</h2>
  </div>

  <div class="card">
    <div class="badge badge--ok">⭐ Level</div>
    <h2 id="levelVal">1</h2>
    <div id="vipBadgeBox"></div>
      <!-- ⭐ EXP BAR -->
<div class="exp-card">
  <div class="exp-head">
    <span>⭐ EXP</span>
    <span id="expText">0 / 100</span>
  </div>

  <div class="exp-bar">
    <div class="exp-bar__fill" id="expFill"></div>
  </div>

  <div class="exp-hint">
    Lên level tiếp theo khi đầy EXP
  </div>
</div>
  </div>

  <div class="card">
    <div class="badge badge--gold">💎 đã tặng</div>
    <h2 id="coinSentVal">0</h2>
    <small>Tổng kim cương đã tặng</small>
  </div>

  <div class="card">
    <div class="badge badge--blue">💎 đã nhận</div>
    <h2 id="coinReceivedVal">0</h2>
    <small>Tổng kim cương đã nhận </small>
  </div>
</div>


      <!-- ACTION -->
      <div style="display:flex; gap:12px; flex-wrap:wrap">
        <button id="btnSave">💾 Lưu hồ sơ</button>
        <button onclick="location.href='/lobby.html'">🏟️ Về Lobby</button>
      </div>

    </div>
  </div>

<script src="/profile.js"></script>
</body>
</html>
