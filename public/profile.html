<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>👤 Hồ sơ cá nhân</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-profile">


    <script src="/guard.js"></script>

    
<div class="container">
  <div class="profile-shell">


  <!-- HEADER -->
  <div class="profile-header">
   <div class="avatar-wrap">
  <img id="avatarPreview" src="https://i.ibb.co/ZR2yR7dJ/Chat-GPT-Image-Jan-12-2026-02-44-07-AM.jpg">
  <div id="avatarCrown" class="avatar-crown hidden">👑</div>
</div>

    <div class="profile-info">
      <label>Tên hiển thị</label>
      <input id="nameInput" placeholder="Nhập tên của bạn">
      <button id="btnChangeAvatar">📤 Đổi avatar</button>
    </div>

    <input type="file" id="avatarInput" accept="image/*" hidden>
  </div>

  <!-- LEVEL -->
  <div class="profile-level">
    <div class="level-left">
      <div class="level-badge">⭐ Level <b id="levelVal">1</b></div>
      <div id="vipBadgeBox"></div>
    </div>

    <div class="exp-card">
      <div class="exp-head">
        <span>EXP</span>
        <span id="expText">0 / 100</span>
      </div>
      <div class="exp-bar">
        <div class="exp-bar__fill" id="expFill"></div>
      </div>
    </div>
  </div>

  <!-- STATS -->
  <div class="profile-stats">
    <div class="stat-box">
      <div class="stat-label">💎 Kim cương</div>
      <div class="stat-val" id="coinVal">0</div>
    </div>

    <div class="stat-box gold">
      <div class="stat-label">💎 Đã tặng</div>
      <div class="stat-val" id="coinSentVal">0</div>
    </div>

    <div class="stat-box blue">
      <div class="stat-label">💎 Đã nhận</div>
      <div class="stat-val" id="coinReceivedVal">0</div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="profile-actions">
    <button id="btnSave">💾 Lưu</button>
    <button id="btnChangePass">🔐 Đổi mật khẩu</button>
    <button onclick="location.href='/lobby.html'">🏟 Lobby</button>
  </div>



  <!-- 🔐 CHANGE PASSWORD -->
<div id="passModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <h3>🔐 Đổi mật khẩu</h3>

    <input id="oldPass" type="password" placeholder="Mật khẩu cũ">
    <input id="newPass" type="password" placeholder="Mật khẩu mới">
    <input id="newPass2" type="password" placeholder="Nhập lại mật khẩu mới">

    <div style="display:flex;gap:10px;margin-top:12px">
      <button onclick="closePass()">Hủy</button>
      <button onclick="submitChangePass()">Đổi mật khẩu</button>
    </div>
  </div>
</div>


<!-- GLOBAL MESSAGE MODAL -->
<div id="msgModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <h3 id="msgTitle">Thông báo</h3>
    <div id="msgText" style="margin:12px 0;opacity:.9"></div>
    <button onclick="closeMsg()">OK</button>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/profile.js"></script>
</body>
</html>
