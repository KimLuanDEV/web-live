<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>King ⚔ Slave Lobby</title>
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>



<style>

    .ks-lobby{
  background:#0a0a0f;
  color:#fff;
  font-family:sans-serif;
}

.ks-header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#1a1a22,#0a0a0f);
}

.ks-title{
  font-weight:800;
  letter-spacing:1px;
}

.ks-container{
  padding:20px;
}

.ks-create button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:700;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  color:#000;
  font-size:16px;
}

.ks-room{
  background:#151520;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.ks-room button{
  padding:6px 12px;
  border-radius:8px;
  border:none;
  background:#00bfff;
  color:#000;
  font-weight:600;
}


</style>
</head>

<body class="ks-lobby">

<div class="ks-header">
  <button onclick="history.back()">‹</button>
  <div class="ks-title">👑 King ⚔ Slave</div>
</div>

<div class="ks-container">

  <!-- CREATE ROOM -->
  <div class="ks-create">
    <button onclick="createRoom()">
      ➕ Tạo phòng
    </button>
  </div>

  <!-- ROOM LIST -->
  <div class="ks-room-list" id="roomList">
  </div>

</div>

<script src="/game-king-slave-lobby.js"></script>





</body>
</html>
