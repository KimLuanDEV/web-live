<!DOCTYPE html>
<html>
<head>
<title>DTP Admin</title>
<style>

body{
background:#111;
color:white;
font-family:system-ui;
text-align:center;
padding:50px;
}

.box{
background:#000;
border:1px solid gold;
padding:40px;
border-radius:10px;
display:inline-block;
}

.result{
font-size:40px;
color:gold;
margin-top:20px;
}

</style>
</head>

<body>

<div class="box">

<h2>DTP SECRET RESULT</h2>

<div>Round: <span id="round"></span></div>

<div class="result" id="secret"></div>



<button onclick="setWinner('dragon')">DRAGON</button>
<button onclick="setWinner('tiger')">TIGER</button>
<button onclick="setWinner('phoenix')">PHOENIX</button>
</div>


<h3>PLAYER BETS</h3>

<table id="betTable">
<tr>
<th>Player</th>
<th>Dragon</th>
<th>Tiger</th>
<th>Phoenix</th>
<th>Total</th>
</tr>
</table>


<script>

async function load(){

const res = await fetch("/api/admin/dtp-secret");
const data = await res.json();

document.getElementById("round").textContent = data.round;
document.getElementById("secret").textContent = data.secret.toUpperCase();

}

load();

setInterval(load,2000);


async function setWinner(w){

await fetch("/api/admin/dtp-override",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({winner:w})
});

load();

}



async function loadBets(){

const res = await fetch("/api/admin/dtp-bets");
const data = await res.json();

const table = document.getElementById("betTable");

table.innerHTML = `
<tr>
<th>Player</th>
<th>Side</th>
<th>Bet</th>
</tr>
`;

data.bets.forEach(b=>{

const row = document.createElement("tr");

row.innerHTML = `
<td>${b.name}</td>
<td>${b.dragon}</td>
<td>${b.tiger}</td>
<td>${b.phoenix}</td>
<td>${b.total}</td>
`;

table.appendChild(row);

});

}

setInterval(loadBets,2000);


</script>

</body>
</html>
