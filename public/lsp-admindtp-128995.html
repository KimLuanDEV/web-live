<!DOCTYPE html>
<html>
<head>
<title>DTP Admin</title>
<style>

body{
background:#0b0b0b;
color:#fff;
font-family:system-ui;
padding:30px;
}

.admin-title{
font-size:32px;
font-weight:700;
margin-bottom:20px;
color:gold;
}

.panel{
background:#111;
border:1px solid #333;
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px rgba(0,0,0,.6);
}

.result{
font-size:42px;
font-weight:700;
color:gold;
margin-top:10px;
}

.override-buttons button{
padding:10px 20px;
margin:10px;
border:none;
border-radius:8px;
font-weight:700;
cursor:pointer;
font-size:16px;
}

.btn-dragon{background:#b91c1c;color:#fff;}
.btn-tiger{background:#f59e0b;color:#000;}
.btn-phoenix{background:#9333ea;color:#fff;}

.pool-grid{
display:flex;
gap:20px;
margin-top:15px;
}

.pool-card{
flex:1;
background:#000;
border:1px solid #333;
padding:15px;
border-radius:10px;
text-align:center;
font-size:18px;
}

.pool-dragon{color:#ef4444}
.pool-tiger{color:#fbbf24}
.pool-phoenix{color:#c084fc}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th{
background:#222;
padding:10px;
}

td{
padding:8px;
border-bottom:1px solid #333;
}

tr:hover{
background:#1a1a1a;
}

</style>
</head>

<body>


<div class="admin-title">
🐉 DRAGON TIGER PHOENIX ADMIN
</div>


<div class="panel">

<h2>Round: <span id="round"></span></h2>

<div class="result" id="secret"></div>

<div class="override-buttons">

<button class="btn-dragon"
onclick="setWinner('dragon')">🐉 Dragon</button>

<button class="btn-tiger"
onclick="setWinner('tiger')">🐯 Tiger</button>

<button class="btn-phoenix"
onclick="setWinner('phoenix')">🔥 Phoenix</button>

</div>

</div>


<div class="panel">

<h3>POOL</h3>

<div class="pool-grid">

<div class="pool-card pool-dragon">
🐉 Dragon
<div id="poolDragon">0</div>
</div>

<div class="pool-card pool-tiger">
🐯 Tiger
<div id="poolTiger">0</div>
</div>

<div class="pool-card pool-phoenix">
🔥 Phoenix
<div id="poolPhoenix">0</div>
</div>

</div>

</div>


<div class="panel">

<h3>PLAYER BETS</h3>

<table id="betTable">

<tr>
<th>Player</th>
<th>Dragon</th>
<th>Tiger</th>
<th>Phoenix</th>
<th>Total</th>
</tr>

</table>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

// ==============================
// CONNECT SOCKET
// ==============================

const socket = io();


// ==============================
// SECRET RESULT (REALTIME)
// ==============================

socket.on("dtp-secret-update", data => {

document.getElementById("round").textContent =
  data.round;

document.getElementById("secret").textContent =
  data.secret.toUpperCase();

});


// ==============================
// ADMIN OVERRIDE RESULT
// ==============================

async function setWinner(w){

await fetch("/api/admin/dtp-override",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({winner:w})
});

}


// ==============================
// REALTIME BET UPDATE
// ==============================

socket.on("admin-dtp-bets-update", data => {

// UPDATE POOL
document.getElementById("poolDragon").textContent =
  data.pool.dragon;

document.getElementById("poolTiger").textContent =
  data.pool.tiger;

document.getElementById("poolPhoenix").textContent =
  data.pool.phoenix;


// RENDER BET TABLE
const table = document.getElementById("betTable");

table.innerHTML = `
<tr>
<th>Player</th>
<th>Dragon</th>
<th>Tiger</th>
<th>Phoenix</th>
<th>Total</th>
</tr>
`;

data.bets.forEach(b => {

const row = document.createElement("tr");

row.innerHTML = `
<td>${b.name}</td>
<td>${b.dragon}</td>
<td>${b.tiger}</td>
<td>${b.phoenix}</td>
<td>${b.total}</td>
`;

table.appendChild(row);

});

});

</script>

</body>
</html>
