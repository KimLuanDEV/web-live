<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📩 Tin nhắn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-messages">
<script src="/guard.js"></script>

<div class="container messages-shell">

  <div class="messages-header">
    <button class="back-btn" onclick="location.href='/profile.html'">←</button>
    <div class="messages-title">📩 Tin nhắn</div>
  </div>

  <div class="messages-body">

    <!-- LEFT: user list -->
    <div class="messages-users" id="userList"></div>

    <!-- RIGHT: chat -->
    <div class="messages-chat">

      <div class="chat-top">
        <img id="chatAvatar">
        <div id="chatTitle">Chọn người để chat</div>
      </div>

      <div id="chatBox" class="chat-messages"></div>

      <div class="chat-input">
        <input id="msgInput" placeholder="Nhập tin nhắn..." />
        <button id="sendBtn">➤</button>
      </div>

    </div>

  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/messages.js"></script>
</body>
</html>
