<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📩 Tin nhắn</title>
  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-messages">
<script src="/guard.js"></script>



   <div class="row">
  <button onclick="location.href='/profile.html'">← Quay lại</button>
  <!-- Danh sách người -->
  <div class="card" style="max-height:70vh;overflow:auto">
    <h4>👥 Người đang online</h4>
    <div id="userList"></div>
  </div>
</div>

    




<!-- CHAT MODAL -->
<div id="chatModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeChat()"></div>

  <div class="modal-card" style="max-width:520px">



<div class="chat-header">
  <button class="chat-back" onclick="closeChat()">‹</button>

  <img id="chatHeaderAvatar" class="chat-header-avatar" src="" />

  <div class="chat-header-title">
    <span id="chatTitle">Chat</span>
  </div>

  <button id="callBtn" class="chat-call">📞</button>
  <button id="endCallBtn" class="chat-endcall hidden">✖</button>

</div>




    <div id="chatBox" class="chatbox"></div>

    <div class="chatform">
      <input id="msgInput" placeholder="Nhập tin nhắn..." />
      <button id="sendBtn">Gửi</button>
    </div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/messages.js"></script>
</body>
</html>
