<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">

  <!-- PWA iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livestream Pro">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">



  <title>📩 Tin nhắn</title>
  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />


      <link rel="manifest" href="/manifest.json">

<!-- icon cho iOS -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-messages">
<script src="/guard.js"></script>



 <div class="msg-shell">

  <div class="msg-topbar">
    <button class="msg-back" onclick="location.href='/lobby.html'">‹</button>
    <div class="msg-title">
      <span class="dot"></span> Tin nhắn
    </div>
  </div>

  <div class="msg-layout">
    <div class="msg-users">
      <div class="msg-users-title">👥 Danh sách bạn bè</div>
      <div id="userList" class="msg-userlist"></div>
    </div>

    <div class="msg-placeholder">
      <div class="msg-empty">
        <div class="msg-empty-icon">💬</div>
        <div class="msg-empty-text">
          Chọn người bên trái<br>để bắt đầu chat
        </div>
      </div>
    </div>
  </div>

</div>

    




<!-- CHAT MODAL -->
<div id="chatModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeChat()"></div>

  <div class="modal-card" style="max-width:520px">



<div class="chat-header">
  <button class="chat-back" onclick="closeChat()">‹</button>

  <img id="chatHeaderAvatar" class="chat-header-avatar" src="" />

 <div class="chat-header-title">
  <span id="chatTitle">Chat</span>
</div>

 <!-- 🗑️ XÓA LỊCH SỬ -->
<button class="chat-clear" onclick="confirmClearMyMessages()">🗑️</button>

</div>

    <div id="chatBox" class="chatbox"></div>

<!-- 🔽 NÚT KÉO XUỐNG CUỐI CHAT -->
<button id="btnScrollBottom" class="chat-scroll-bottom hidden">
  <svg viewBox="0 0 24 24" width="20" height="20">
    <path d="M12 4v12" />
    <path d="M6 12l6 6 6-6" />
  </svg>
  <span class="scroll-dot"></span>
</button>




   <div class="chatform">

    
<div class="chat-tools">
  <!-- 📷 IMAGE -->
  <label class="chat-tool" title="Gửi ảnh">
    <span class="tool-icon">📷</span>
    <input type="file" id="imgInput" accept="image/*" multiple hidden>
  </label>

  <!-- 🎥 VIDEO -->
  <label class="chat-tool" title="Gửi video">
    <span class="tool-icon">🎥</span>
    <input type="file" id="videoInput" accept="video/*" hidden>
  </label>

  <!-- 📍 LOCATION -->
  <button
    id="btnLocation"
    class="chat-tool"
    type="button"
    title="Chia sẻ vị trí"
  >
    <span class="tool-icon">📍</span>
  </button>
</div>




  
  <textarea
  id="msgInput"
  rows="1"
  placeholder="Nhập tin nhắn..."
></textarea>


  <button id="sendBtn" class="send-arrow">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
    <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
  </svg>
</button>

</div>


  </div>
</div>




<!-- GLOBAL CHAT MODAL -->
<div id="sysModal" class="sys-modal hidden">
  <div class="sys-box">
    <div id="sysText" class="sys-text">...</div>

    <div class="sys-actions">
      <button id="sysCancel" class="sys-btn ghost">Huỷ</button>
      <button id="sysOk" class="sys-btn primary">OK</button>
    </div>
  </div>
</div>





<!-- IMAGE ZOOM MODAL -->
<div id="imgZoom" class="img-zoom hidden">
  <div class="img-zoom-backdrop"></div>

  <div class="img-zoom-inner">
    <button class="img-close" onclick="closeImgZoom()">✕</button>

    <img id="imgZoomView" />

    <div class="img-zoom-indicator" id="imgZoomIndicator"></div>

    <button class="img-nav left" onclick="prevImg()">‹</button>
    <button class="img-nav right" onclick="nextImg()">›</button>
  </div>
</div>




<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/messages.js"></script>
</body>
</html>
