<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📩 Tin nhắn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-messages">
<script src="/guard.js"></script>

<div class="messages-app">

  <!-- LEFT SIDEBAR -->
  <div class="msg-sidebar">
    <div class="msg-logo">💬 Chat</div>
    <div id="userList" class="msg-userlist"></div>
  </div>

  <!-- RIGHT CHAT -->
  <div class="msg-main">

    <div class="msg-header">
      <div class="msg-peer">
        <img id="chatAvatar">
        <div id="chatTitle">Chọn người để chat</div>
      </div>
      <button onclick="location.href='/profile.html'">✕</button>
    </div>

    <div id="chatBox" class="msg-body"></div>

    <div class="msg-inputbar">
      <input id="msgInput" placeholder="Nhập tin nhắn…" />
      <button id="sendBtn">➤</button>
    </div>

  </div>

</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/messages.js"></script>
</body>
</html>
