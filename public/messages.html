<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📩 Tin nhắn</title>
  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-messages">
<script src="/guard.js"></script>



   <div class="row">
  <button onclick="location.href='/profile.html'">← Quay lại</button>
  <!-- Danh sách người -->
  <div class="card" style="max-height:70vh;overflow:auto">
    <h4>👥 Người đang online</h4>
    <div id="userList"></div>
  </div>
</div>

    




<!-- CHAT MODAL -->
<div id="chatModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeChat()"></div>

  <div class="modal-card" style="max-width:520px">



<div class="chat-header">
  <button class="chat-back" onclick="closeChat()">‹</button>

  <img id="chatHeaderAvatar" class="chat-header-avatar" src="" />

 <div class="chat-header-title">
  <span id="chatTitle">Chat</span>
  <div id="callStatus" class="chat-status hidden">📡 Đang gọi…</div>
  <div id="netStatus" class="net-status hidden">📶</div>
</div>


  <button id="callBtn" class="chat-call">📞</button>
  <button id="chatMuteBtn" class="chat-mute hidden">🔈</button>

  <button id="endCallBtn" class="chat-endcall hidden">✖</button>

</div>




    <div id="chatBox" class="chatbox"></div>

    <div class="chatform">
      <input id="msgInput" placeholder="Nhập tin nhắn..." />
     <button id="sendBtn" type="button">Gửi</button>
    </div>

  </div>
</div>




<!-- GLOBAL CHAT MODAL -->
<div id="sysModal" class="sys-modal hidden">
  <div class="sys-box">
    <div id="sysText" class="sys-text">...</div>

    <div class="sys-actions">
      <button id="sysCancel" class="sys-btn ghost">Huỷ</button>
      <button id="sysOk" class="sys-btn primary">OK</button>
    </div>
  </div>
</div>


<audio id="ringtone" loop>
  <source src="/sounds/ringtone.mp3" type="audio/mpeg">
</audio>

<audio id="ringback" loop>
  <source src="/sounds/ringback.mp3" type="audio/mpeg">
</audio>



<div id="callModal" class="vc-modal hidden">

  <!-- nền mờ + blur -->
  <div class="vc-bg"></div>

  <!-- video -->
  <div class="vc-stage">
    <video id="remoteVideo" autoplay playsinline></video>

    <!-- video mình (pip) -->
    <div class="vc-me">
      <video id="localVideo" autoplay muted playsinline></video>
    </div>

    <!-- info -->
    <div class="vc-top">
      <div class="vc-user">
        <img id="callAvatar">
        <div>
          <div id="callName"></div>
          <div id="callTimer" class="vc-time">00:00</div>
        </div>
      </div>
    </div>

    <!-- nút -->
    <div class="vc-controls">
      <button id="callCam" class="vc-btn">📷</button>
      <button id="callMute" class="vc-btn">🔈</button>
      <button id="callEnd" class="vc-btn end">❌</button>
    </div>

  </div>
</div>




<script src="/socket.io/socket.io.js"></script>
<script src="/messages.js"></script>
</body>
</html>
