<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📩 Tin nhắn</title>
  <meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <link rel="stylesheet" href="/style.css" />
</head>

<body class="page-messages">
<script src="/guard.js"></script>



 <div class="msg-shell">

  <div class="msg-topbar">
    <button class="msg-back" onclick="location.href='/profile.html'">‹</button>
    <div class="msg-title">
      <span class="dot"></span> Tin nhắn
    </div>
  </div>

  <div class="msg-layout">
    <div class="msg-users">
      <div class="msg-users-title">👥 Danh sách bạn bè</div>
      <div id="userList" class="msg-userlist"></div>
    </div>

    <div class="msg-placeholder">
      <div class="msg-empty">
        <div class="msg-empty-icon">💬</div>
        <div class="msg-empty-text">
          Chọn người bên trái<br>để bắt đầu chat
        </div>
      </div>
    </div>
  </div>

</div>

    




<!-- CHAT MODAL -->
<div id="chatModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeChat()"></div>

  <div class="modal-card" style="max-width:520px">



<div class="chat-header">
  <button class="chat-back" onclick="closeChat()">‹</button>

  <img id="chatHeaderAvatar" class="chat-header-avatar" src="" />

 <div class="chat-header-title">
  <span id="chatTitle">Chat</span>
</div>
</div>

    <div id="chatBox" class="chatbox"></div>

    <div class="chatform">
      <input id="msgInput" placeholder="Nhập tin nhắn..." />
     <button id="sendBtn" type="button">Gửi</button>
    </div>

  </div>
</div>




<!-- GLOBAL CHAT MODAL -->
<div id="sysModal" class="sys-modal hidden">
  <div class="sys-box">
    <div id="sysText" class="sys-text">...</div>

    <div class="sys-actions">
      <button id="sysCancel" class="sys-btn ghost">Huỷ</button>
      <button id="sysOk" class="sys-btn primary">OK</button>
    </div>
  </div>
</div>






<!-- MOBILE NAV BAR -->
<div class="mnav-bar" id="mnavBar">

  <div class="mnav-item" data-link="/lobby.html">
    <div class="mnav-icon">🏟</div>
    <div class="mnav-text">Lobby</div>
  </div>

<div class="mnav-item" data-link="/social.html">
    <div class="mnav-icon">🌍</div>
    <div class="mnav-text">Status</div>
  </div>


  <div class="mnav-item" data-link="/messages.html">
    <div class="mnav-icon">💬</div>
    <div class="mnav-text">Chat</div>
    <span class="mnav-badge" id="mnavMsgBadge"></span>
  </div>

  <div class="mnav-item" data-link="/profile.html">
    <div class="mnav-icon">👤</div>
    <div class="mnav-text">Profile</div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/chat-global.js"></script>
<script src="/messages.js"></script>
</body>
</html>
