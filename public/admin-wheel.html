<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LUCKY WHEEL CONTROL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body{
  width:100%;
  overflow-x:hidden;
}


*{box-sizing:border-box}
body{
  margin:0;
  background:#050505;
  font-family:system-ui,-apple-system;
  color:#fff;
}

/* ===== APP ===== */
.admin-app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== HEADER ===== */
.admin-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 28px;
  background:linear-gradient(180deg,#0b0b0b,#050505);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-weight:900;
  letter-spacing:1px;
}
.sub{
  font-size:12px;
  opacity:.6;
}

.round-badge{
  background:#111;
  padding:10px 16px;
  border-radius:12px;
  font-size:12px;
  letter-spacing:2px;
}
.round-badge strong{
  display:block;
  font-size:22px;
  color:#00e5ff;
}

/* ===== MAIN ===== */
.admin-main{
  flex:1;
  display:grid;
  grid-template-columns: minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);
  gap:32px;
  padding:32px;
  width:100%;
  max-width:100%;
}


/* ===== RESULT CORE ===== */
.result-core{
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

.orb{
  overflow:hidden;
  width:260px;
  height:260px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 30%, #333, #111 65%);
  box-shadow:
    0 0 50px rgba(0,229,255,.2),
    inset 0 0 50px rgba(0,0,0,.7);
}

.orb::after{
  content:"";
  position:absolute;
  inset:-10px;
  border-radius:50%;
  border:2px solid rgba(0,229,255,.4);
  filter:blur(4px);
}

.mul{
  font-size:88px;
  font-weight:900;
  color:#ffd700;
  text-shadow:
    0 0 25px rgba(255,215,0,.6),
    0 0 60px rgba(255,215,0,.25);
}

.orb-label{
  position:absolute;
  bottom:24px;
  font-size:11px;
  letter-spacing:2px;
  opacity:.6;
}

/* ===== COUNTDOWN ===== */
.countdown{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
  color:#00e5ff;
  text-shadow:0 0 20px rgba(0,229,255,.5);
}
.countdown.danger{
  color:#ff5252;
  animation:pulse .8s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.4}
  100%{opacity:1}
}

/* ===== META ===== */
.meta-panel{
  background:#0c0c0c;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.meta-item{
  display:flex;
  justify-content:space-between;
  font-size:13px;
}
.meta-item span{opacity:.6}
.meta-item strong{font-weight:700}
.meta-item.mono strong{
  word-break: break-all;
  max-width:100%;
  display:block;
  font-family:monospace;
  font-size:11px;
  opacity:.7;
}

/* ===== DANGER ZONE ===== */
.danger-zone{
  border:1px solid rgba(255,82,82,.35);
  background:rgba(255,82,82,.05);
  border-radius:18px;
  padding:20px;
}

.danger-zone h2{
  margin:0 0 6px;
  color:#ff5252;
}
.danger-zone p{
  margin:0 0 16px;
  font-size:12px;
  opacity:.75;
}

.override-box{
  display:flex;
  flex-direction:column;
  gap:12px;
}

select{
  padding:14px;
  border-radius:12px;
  background:#111;
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
}

.btn-danger{
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:900;
  letter-spacing:1px;
  background:linear-gradient(180deg,#d00030,#900020);
  color:#fff;
  cursor:pointer;
}
.btn-danger:hover{
  filter:brightness(1.1);
}


@media (max-width: 900px){
  .admin-main{
    grid-template-columns: 1fr;
    padding:24px 16px;
  }
}

</style>
</head>

<body>

<div class="admin-app">

  <!-- ===== HEADER ===== -->
  <header class="admin-header">
    <div class="h-left">
      <div class="logo">🎡 LUCKY WHEEL</div>
      <div class="sub">Wheel Control · Internal</div>
    </div>
    <div class="h-right">
      <div class="round-badge">
        ROUND <strong id="roundId">--</strong>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="admin-main">

    <!-- RESULT CORE -->
    <section class="result-core">
      <div class="orb">
        <div id="mul" class="mul">--</div>
        <div class="orb-label">RESULT LOCKED</div>
      </div>

      <div id="countdown" class="countdown">--</div>
    </section>

    <!-- META -->
    <section class="meta-panel">
      <div class="meta-item">
        <span>Index</span>
        <strong id="idx">--</strong>
      </div>
      <div class="meta-item mono">
        <span>Commit Hash</span>
        <strong id="hash">--</strong>
      </div>
    </section>

    <!-- DANGER ZONE -->
    <section class="danger-zone">
      <h2>🚨 DANGER ZONE</h2>
      <p>
        Override sẽ <strong>ghi đè kết quả vòng quay</strong>.
        Hành động này <u>không thể hoàn tác</u>.
      </p>

      <div class="override-box">
        <select id="forceMul">
          <option value="">— chọn multiplier —</option>
          <option value="0.5">x0.5</option>
          <option value="1.2">x1.2</option>
          <option value="1.5">x1.5</option>
          <option value="2">x2</option>
          <option value="5">x5</option>
          <option value="10">x10</option>
        </select>

        <button class="btn-danger" onclick="overrideResult()">
          FORCE RESULT
        </button>
      </div>
    </section>

  </main>

</div>

<script>
const me = JSON.parse(localStorage.getItem("user_profile") || "{}");

async function loadSecret(){
  const res = await fetch("/api/admin/wheel/secret",{
    headers:{ "x-uid": me.uid }
  });
  const data = await res.json();
  if (!data.ok) return;

  roundId.textContent = "ROUND #" + data.roundToday;
  mul.textContent    = "x" + data.result.multiplier;
  idx.textContent    = data.result.index;
  hash.textContent   = "hash: " + data.result.hash;

  // ⏱️ COUNTDOWN
  roundEndAt = data.endAt;
  startCountdown();
}


loadSecret();
setInterval(loadSecret, 3000);

async function overrideResult(){
  const v = Number(forceMul.value);
  if (!v) return alert("Chưa chọn multiplier");
  if (!confirm("OVERRIDE KẾT QUẢ?")) return;

  const res = await fetch("/api/admin/wheel/override",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-uid": me.uid
    },
    body: JSON.stringify({ multiplier:v })
  });

  const data = await res.json();
  if (!data.ok) return alert("Override thất bại");

  loadSecret();
}




let roundEndAt = 0;
let countdownTimer = null;

function startCountdown(){
  if (countdownTimer) clearInterval(countdownTimer);

  countdownTimer = setInterval(() => {
    if (!roundEndAt) return;

    const remain = Math.max(
      0,
      Math.ceil((roundEndAt - Date.now()) / 1000)
    );

    countdown.textContent = remain + "s";

    if (remain <= 5){
      countdown.classList.add("danger");
    } else {
      countdown.classList.remove("danger");
    }

  }, 500);
}



</script>

</body>
</html>
