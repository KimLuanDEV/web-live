<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>🛑 ADMIN CONTROL – WHEEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at top, #1a1a1a, #050505 60%);
  color:#fff;
  font-family:system-ui, -apple-system, BlinkMacSystemFont;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== LAYOUT ===== */
.admin-wrap{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns: 1fr 420px;
}

/* ===== LEFT: STATUS ===== */
.status{
  padding:48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.title{
  font-size:14px;
  letter-spacing:2px;
  opacity:.6;
}

.round{
  font-size:48px;
  font-weight:900;
  margin:8px 0 32px;
  color:#00e5ff;
}

.mul{
  font-size:120px;
  font-weight:900;
  line-height:1;
  color:#ffd700;
  text-shadow:
    0 0 30px rgba(255,215,0,.4),
    0 0 80px rgba(255,215,0,.2);
}

.meta{
  margin-top:32px;
  display:flex;
  gap:24px;
  opacity:.8;
}

.meta div span{
  display:block;
  font-size:12px;
  opacity:.5;
}

/* ===== RIGHT: DANGER PANEL ===== */
.panel{
  background:linear-gradient(180deg,#111,#0a0a0a);
  border-left:1px solid rgba(255,255,255,.05);
  padding:32px;
  display:flex;
  flex-direction:column;
}

.panel h2{
  margin:0 0 8px;
  color:#ff5252;
}

.warn{
  font-size:12px;
  opacity:.6;
  margin-bottom:24px;
}

select,button{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

select{
  background:#181818;
  color:#fff;
  margin-bottom:16px;
}

button{
  background:#b00020;
  color:#fff;
  font-weight:900;
  cursor:pointer;
  transition:.15s;
}
button:hover{background:#d00030}
button:active{transform:scale(.98)}

.hash{
  margin-top:auto;
  font-size:11px;
  opacity:.4;
  word-break:break-all;
}
</style>
</head>

<body>

<div class="admin-wrap">

  <!-- LEFT -->
  <div class="status">
    <div class="title">CURRENT ROUND</div>
    <div id="roundId" class="round">--</div>

    <div class="title">SECRET MULTIPLIER</div>
    <div id="mul" class="mul">--</div>

    <div class="meta">
      <div>
        <span>INDEX</span>
        <strong id="idx">--</strong>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel">
    <h2>🛑 OVERRIDE MODE</h2>
    <div class="warn">
      Chỉ dùng khi thật sự cần thiết.<br>
      Không thể hoàn tác.
    </div>

    <select id="forceMul">
      <option value="">— chọn multiplier —</option>
      <option value="0.5">x0.5</option>
      <option value="1.2">x1.2</option>
      <option value="1.5">x1.5</option>
      <option value="2">x2</option>
      <option value="5">x5</option>
      <option value="10">x10</option>
    </select>

    <button onclick="overrideResult()">FORCE RESULT</button>

    <div id="hash" class="hash">hash: --</div>
  </div>

</div>

<script>
const me = JSON.parse(localStorage.getItem("user_profile") || "{}");

async function loadSecret(){
  const res = await fetch("/api/admin/wheel/secret",{
    headers:{ "x-uid": me.uid }
  });
  const data = await res.json();
  if (!data.ok) return;

  roundId.textContent = "ROUND #" + data.roundToday;
  mul.textContent    = "x" + data.result.multiplier;
  idx.textContent    = data.result.index;
  hash.textContent   = "hash: " + data.result.hash;
}

loadSecret();
setInterval(loadSecret, 3000);

async function overrideResult(){
  const v = Number(forceMul.value);
  if (!v) return alert("Chưa chọn multiplier");

  if (!confirm("⚠️ OVERRIDE KẾT QUẢ?\nKhông thể hoàn tác!"))
    return;

  const res = await fetch("/api/admin/wheel/override",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-uid": me.uid
    },
    body: JSON.stringify({ multiplier:v })
  });

  const data = await res.json();
  if (!data.ok) return alert("Override thất bại");

  alert("🔥 ĐÃ FORCE → x" + v);
  loadSecret();
}
</script>

</body>
</html>
