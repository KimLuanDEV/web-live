<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>ADMIN · WHEEL CONTROL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at center, #111 0%, #050505 70%);
  font-family:system-ui,-apple-system;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ===== MAIN STAGE ===== */
.stage{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:32px;
}

/* ===== ROUND ===== */
.round{
  font-size:14px;
  letter-spacing:2px;
  opacity:.6;
}
.round strong{
  display:block;
  font-size:36px;
  color:#00e5ff;
  margin-top:6px;
}

/* ===== ORB ===== */
.orb{
  width:260px;
  height:260px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 30% 30%, #333, #111 60%);
  box-shadow:
    0 0 40px rgba(0,229,255,.15),
    inset 0 0 40px rgba(0,0,0,.6);
}

.orb::before{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  border:2px solid rgba(0,229,255,.35);
  filter:blur(2px);
}

.mul{
  font-size:84px;
  font-weight:900;
  color:#ffd700;
  text-shadow:
    0 0 25px rgba(255,215,0,.5),
    0 0 60px rgba(255,215,0,.25);
}

/* ===== META ===== */
.meta{
  display:flex;
  gap:24px;
  font-size:13px;
  opacity:.7;
}

/* ===== OVERRIDE ===== */
.override{
  margin-top:20px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:20px;
  width:280px;
  text-align:center;
}

.override h3{
  margin:0 0 6px;
  color:#ff5252;
}
.override p{
  margin:0 0 14px;
  font-size:12px;
  opacity:.6;
}

select,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:15px;
}

select{
  background:#111;
  color:#fff;
  margin-bottom:12px;
}

button{
  background:#b00020;
  color:#fff;
  font-weight:800;
}
button:hover{background:#d00030}

.hash{
  margin-top:10px;
  font-size:11px;
  opacity:.35;
  word-break:break-all;
}


.countdown{
  font-size:32px;
  font-weight:800;
  letter-spacing:2px;
  color:#00e5ff;
  text-shadow:0 0 15px rgba(0,229,255,.4);
}

.countdown.danger{
  color:#ff5252;
  animation:pulse .8s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:.4}
  100%{opacity:1}
}


/* ===== PLAYERS PANEL ===== */
.players-panel{
  position:fixed;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  width:320px;
  max-height:70vh;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  backdrop-filter:blur(10px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.players-head{
  padding:14px 16px;
  font-weight:800;
  font-size:14px;
  letter-spacing:1px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.players-head span{
  background:#00e5ff;
  color:#000;
  padding:2px 8px;
  border-radius:10px;
  font-size:12px;
}

.players-list{
  flex:1;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.player{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05);
}

.player .avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.player .info{
  flex:1;
}

.player .name{
  font-weight:700;
  font-size:14px;
}

.player .bet{
  font-size:12px;
  opacity:.7;
}

.player .coin{
  font-weight:800;
  color:#ffd700;
}

.player-empty{
  opacity:.4;
  text-align:center;
  margin-top:20px;
  font-size:13px;
}



</style>
</head>

<body>

<div class="stage">

  <div class="round">
    CURRENT ROUND
    <strong id="roundId">--</strong>
  </div>

  <div class="orb">
    <div id="mul" class="mul">--</div>
  </div>

  <div class="players-panel">
  <div class="players-head">
    👥 Người chơi trong phiên
    <span id="playerCount">0</span>
  </div>

  <div id="playersList" class="players-list">
    <div class="player-empty">Chưa có người đặt cược</div>
  </div>
</div>


<div id="countdown" class="countdown">--</div>


  <div class="meta">
    <div>Index: <strong id="idx">--</strong></div>
  </div>

  <div class="override">
    <h3>🛑 Override</h3>
    <p>Không thể hoàn tác</p>

    <select id="forceMul">
      <option value="">— chọn multiplier —</option>
      <option value="0.5">x0.5</option>
      <option value="1.2">x1.2</option>
      <option value="1.5">x1.5</option>
      <option value="2">x2</option>
      <option value="5">x5</option>
      <option value="10">x10</option>
    </select>

    <button onclick="overrideResult()">FORCE RESULT</button>

    <div id="hash" class="hash">hash: --</div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const me = JSON.parse(localStorage.getItem("user_profile") || "{}");

const socket = io({
  auth:{ uid: me.uid }
});


let lastEndAt = 0;

function setEndAt(endAt){
  if (endAt === lastEndAt) return;
  lastEndAt = endAt;
  roundEndAt = endAt;
  startCountdown();
}



async function overrideResult(){
  const v = Number(forceMul.value);
  if (!v) return alert("Chưa chọn multiplier");
  if (!confirm("OVERRIDE KẾT QUẢ?")) return;

  const res = await fetch("/api/admin/wheel/override",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-uid": me.uid
    },
    body: JSON.stringify({ multiplier:v })
  });

  const data = await res.json();
  if (!data.ok) return alert("Override thất bại");

  // 👉 update UI ngay cho admin
mul.textContent = "x" + v;
}




let roundEndAt = 0;
let countdownTimer = null;

function startCountdown(){




  if (countdownTimer) clearInterval(countdownTimer);

  countdownTimer = setInterval(() => {
    if (!roundEndAt) return;

    const remain = Math.max(
      0,
      Math.ceil((roundEndAt - Date.now()) / 1000)
    );

    countdown.textContent = remain + "s";

    if (remain <= 5){
      countdown.classList.add("danger");
    } else {
      countdown.classList.remove("danger");
    }

    
if (remain <= 0){
  countdown.textContent = "LOCK";
  countdown.classList.add("danger");
  clearInterval(countdownTimer);
  countdownTimer = null;
  return;
}


  }, 500);
}



socket.on("admin-wheel-secret", data => {
  roundId.textContent = "ROUND #" + data.roundToday;
  mul.textContent    = "x" + data.result.multiplier;
  idx.textContent    = data.result.index;
  hash.textContent   = "hash: " + data.result.hash;

setEndAt(data.endAt);

});


socket.on("wheel-round-new", data => {
  // reset player list
  playersList.innerHTML =
    `<div class="player-empty">Chưa có người đặt cược</div>`;
  playerCount.textContent = 0;

setEndAt(data.endAt);

});


socket.on("wheel-bet-update", data => {
  const list = data.bets || [];

  playerCount.textContent = list.length;
  playersList.innerHTML = "";

  if (!list.length){
    playersList.innerHTML =
      `<div class="player-empty">Chưa có người đặt cược</div>`;
    return;
  }

  list.forEach(p => {
    const div = document.createElement("div");
    div.className = "player";
    div.innerHTML = `
      <div class="avatar">${p.avatar ? "🧑" : "👤"}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div class="bet">Cược: <span class="coin">${p.bet}</span></div>
      </div>
    `;
    playersList.appendChild(div);
  });
});


</script>





</body>
</html>
