<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📖 Chi tiết truyện</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">

  <style>
    body{
      background:#0e0e12;
      color:#fff;
      margin:0;
    }

    /* HEADER */
    .detail-header{
      height:52px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 12px;
      background:#111;
      border-bottom:1px solid rgba(255,255,255,.08);
      position:sticky;
      top:0;
      z-index:10;
    }

    .detail-header .title{
      font-weight:700;
      font-size:16px;
    }

    .back-btn{
      background:none;
      border:none;
      color:#fff;
      font-size:20px;
      cursor:pointer;
    }

    /* COVER */
    .story-hero{
      display:flex;
      gap:14px;
      padding:16px;
    }

    .story-hero img{
      width:120px;
      aspect-ratio:3/4;
      object-fit:cover;
      border-radius:12px;
    }

    .story-meta{
      flex:1;
    }

    .story-meta h1{
      font-size:18px;
      margin:0 0 6px;
      font-weight:800;
    }

    .story-meta .author{
      font-size:13px;
      opacity:.75;
      margin-bottom:8px;
    }

    .story-meta .tags{
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .tag{
      font-size:11px;
      padding:4px 8px;
      border-radius:999px;
      background:#1c1c26;
      opacity:.8;
    }

    /* DESCRIPTION */
    .story-desc{
      padding:0 16px 16px;
      font-size:14px;
      line-height:1.55;
      opacity:.9;
    }

    .story-desc.collapsed{
      display:-webkit-box;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .toggle-desc{
      padding:0 16px;
      font-size:13px;
      color:#7da6ff;
      cursor:pointer;
      margin-bottom:12px;
    }

    /* CHAPTER LIST */
    .chapter-section{
      padding:12px 16px 30px;
    }

    .chapter-title{
      font-weight:800;
      margin-bottom:10px;
    }

    .chapter-list{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .chapter-item{
      padding:12px;
      border-radius:12px;
      background:#15151c;
      border:1px solid rgba(255,255,255,.06);
      display:flex;
      justify-content:space-between;
      align-items:center;
      cursor:pointer;
    }

    .chapter-item:active{
      transform:scale(.98);
    }

    .chapter-item .name{
      font-size:14px;
    }

    .chapter-item .lock{
      font-size:12px;
      color:#ff6a6a;
      font-weight:700;
    }
  </style>
</head>

<body>

<script src="/guard.js"></script>

<header class="detail-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">📖 Chi tiết truyện</div>
</header>

<!-- HERO -->
<section class="story-hero">
  <img id="storyCover">
  <div class="story-meta">
    <h1 id="storyTitle"></h1>
    <div id="storyAuthor" class="author"></div>
    <div id="storyTags" class="tags"></div>
  </div>
</section>

<!-- DESCRIPTION -->
<div id="storyDesc" class="story-desc collapsed"></div>
<div id="btnToggleDesc" class="toggle-desc">Xem thêm</div>

<!-- CHAPTER -->
<section class="chapter-section">
  <div class="chapter-title">📚 Danh sách chương</div>
  <div id="chapterList" class="chapter-list"></div>
</section>







<script src="/story-detail.js"></script>

</body>
</html>
