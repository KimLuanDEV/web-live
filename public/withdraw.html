<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>💎 Rút tiền</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-withdraw">


<header class="lp-header">
  <button class="btn-back" onclick="goBack()">←</button>
  <div class="lp-header-title">💎 Rút tiền</div>
</header>


<div class="withdraw-card">

  <div class="withdraw-info">


<div class="withdraw-section">
  <div class="withdraw-summary">
    <div class="sum-box">
      <span>💎 Đã nhận</span>
      <b id="receivedVal">0</b>
    </div>
    <div class="sum-box highlight">
      <span>💵 Có thể rút</span>
      <b id="moneyVal">0 ₫</b>
    </div>
  </div>

  <label>Số kim cương muốn rút</label>
  <input type="number" id="withdrawInput" min="0">

<label>Liên kết tài khoản ngân hàng</label>

<select id="bankName">
  <option value="">-- Chọn ngân hàng --</option>
  <option value="Vietcombank">Vietcombank</option>
  <option value="Techcombank">Techcombank</option>
  <option value="BIDV">BIDV</option>
  <option value="VietinBank">VietinBank</option>
  <option value="MB Bank">MB Bank</option>
  <option value="ACB">ACB</option>
</select>

<div class="bank-logo-wrap">
  <img id="bankLogo" class="bank-logo hidden">
</div>



<input
  type="text"
  id="bankAccount"
  placeholder="Số tài khoản ngân hàng"
>

<input
  type="text"
  id="bankOwner"
  placeholder="Tên chủ tài khoản"
>

  <button id="btnSubmitWithdraw" class="btn-primary">
    📤 Gửi yêu cầu rút
  </button>
</div>



<div class="withdraw-section">
<hr style="margin:24px 0;border-color:#1e2536">
<h3>📜 Lịch sử rút tiền</h3>

<table class="withdraw-table">
  <thead>
    <tr>
      <th>Thời gian</th>
      <th>💎 Kim cương</th>
      <th>Thanh toán</th>
      <th>Trạng thái</th>
      <th>Ghi chú</th>
    </tr>
  </thead>
  <tbody id="withdrawHistoryBody"></tbody>
</table>


<div class="withdraw-pagination" id="withdrawPagination"></div>

<p id="withdrawEmpty" class="note" style="display:none">
  Chưa có yêu cầu rút nào
</p>
</div>



</div>



<!-- ✅ MODAL THÔNG BÁO RÚT TIỀN -->
<div id="withdrawSuccessModal" class="lp-modal hidden">
  <div class="lp-modal-backdrop"></div>

  <div class="lp-modal-box">
    <div class="lp-modal-icon">✅</div>
    <h3>Gửi yêu cầu thành công</h3>
    <p>
      Yêu cầu rút tiền của bạn đã được gửi<br>
      ⏳ Vui lòng chờ phê duyệt trong vòng 30 ngày.
    </p>

    <div class="lp-modal-actions">
      <button class="btn-secondary" onclick="closeWithdrawModal()">
        Ở lại trang
      </button>
      <button class="btn-primary" onclick="goBack()">
        Quay lại
      </button>
    </div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/withdraw.js"></script>
</body>
</html>
