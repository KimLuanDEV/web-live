<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>💎 Rút tiền</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-withdraw">

<div class="withdraw-card">
  <h2>💎 Rút tiền</h2>

  <div class="withdraw-info">
    <div>💎 Kim cương đã nhận:</div>
    <b id="receivedVal">0</b>
  </div>

  <div class="withdraw-info">
    <div>💵 Số tiền có thể rút:</div>
    <b id="moneyVal">0 ₫</b>
  </div>

  <label>Số kim cương muốn rút</label>
  <input type="number" id="withdrawInput" min="0">

  <label>Thông tin thanh toán</label>
  <input type="text" id="bankInput" placeholder="Ngân hàng / Momo / ZaloPay">

  <button id="btnSubmitWithdraw">📤 Gửi yêu cầu rút</button>

  <p class="note">
    ⏳ Yêu cầu sẽ được phê duyệt trong vòng 30 ngày.
  </p>


<hr style="margin:24px 0;border-color:#1e2536">

<h3>📜 Lịch sử rút tiền</h3>

<table class="withdraw-table">
  <thead>
    <tr>
      <th>Thời gian</th>
      <th>💎 Kim cương</th>
      <th>Thanh toán</th>
      <th>Trạng thái</th>
      <th>Ghi chú</th>
    </tr>
  </thead>
  <tbody id="withdrawHistoryBody"></tbody>
</table>

<p id="withdrawEmpty" class="note" style="display:none">
  Chưa có yêu cầu rút nào
</p>


</div>




<script src="/withdraw.js"></script>
</body>
</html>
