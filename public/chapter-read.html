<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📄 Đọc chương</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      background:#0e0e12;
      color:#eaeaf0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    /* HEADER */
    .reader-header{
      height:52px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 12px;
      background:#111;
      border-bottom:1px solid rgba(255,255,255,.08);
      position:sticky;
      top:0;
      z-index:10;
    }

    .reader-header .title{
      font-weight:700;
      font-size:15px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .back-btn{
      background:none;
      border:none;
      color:#fff;
      font-size:20px;
      cursor:pointer;
    }

    /* CONTENT */
    .reader{
      padding:18px 16px 40px;
      max-width:720px;
      margin:auto;
      font-size:18px;        /* 🔥 font lớn */
      line-height:1.75;     /* 🔥 dễ đọc */
    }

    .reader p{
      margin:0 0 16px;
    }

    /* FOOTER */
    .reader-footer{
      text-align:center;
      opacity:.6;
      font-size:13px;
      margin-top:30px;
    }


    /* TOOLBAR */
.reader-toolbar{
  display:flex;
  gap:8px;
  padding:8px 12px;
  background:#0f0f14;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky;
  top:52px;
  z-index:9;
}

.reader-toolbar button{
  padding:6px 10px;
  border-radius:8px;
  background:#1c1c26;
  border:none;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

/* THEMES */
body.theme-dark{
  background:#0e0e12;
  color:#eaeaf0;
}

body.theme-sepia{
  background:#f4ecd8;
  color:#3b2f1e;
}

body.theme-sepia .reader-header,
body.theme-sepia .reader-toolbar{
  background:#efe4c8;
  border-color:rgba(0,0,0,.1);
}

body.theme-sepia button{
  background:#e0d2b0;
  color:#3b2f1e;
}


.chapter-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  display:flex;
  gap:10px;
  padding:10px 12px;
  background:rgba(15,15,20,.95);
  border-top:1px solid rgba(255,255,255,.08);
  z-index:20;
}

.chapter-nav button{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#1c1c26;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.chapter-nav button:disabled{
  opacity:.4;
  cursor:not-allowed;
}


  </style>
</head>

<body>

<header class="reader-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="title" id="chapterTitle">
    Chương 1: Gặp gỡ
  </div>
</header>

<div class="reader-toolbar">
  <button id="btnFontMinus">A−</button>
  <button id="btnFontPlus">A+</button>
  <button id="btnThemeDark">🌙</button>
  <button id="btnThemeSepia">☀️</button>
</div>

<main id="reader" class="reader"></main>

<div class="chapter-nav">
  <button id="btnPrev">⬅️ Chương trước</button>
  <button id="btnNext">Chương sau ➡️</button>
</div>




 <!-- JS -->
  <script src="/chapter-read.js"></script>

</body>
</html>
