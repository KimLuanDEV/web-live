<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Cuộc Chiến Sinh Tồn</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body{
  margin:0;
  background:#0d0f1a;
  font-family:system-ui;
  color:#fff;
  overflow:hidden;
}

.survival-wrap{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:20px;
  box-sizing:border-box;
}

/* HEADER */
.survival-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:20px;
  font-weight:700;
}

.coin-box{
  background:#1a1f35;
  padding:6px 14px;
  border-radius:20px;
  font-size:14px;
}

/* PROGRESS BAR */
.progress-wrap{
  margin-top:20px;
}

.progress-bar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.round-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#333;
}

.round-dot.active{
  background:#00ffae;
  box-shadow:0 0 10px #00ffae;
}

.round-dot.done{
  background:#008cff;
}

/* BATTLE AREA */
.battle-area{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:20px;
}

.warrior{
  font-size:80px;
  transition:0.3s;
}

.shake{
  animation:shake 0.4s;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-10px)}
  50%{transform:translateX(10px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

.result-text{
  font-size:28px;
  font-weight:800;
  min-height:40px;
}

/* CONTROLS */
.control-panel{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.bet-input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

.btn{
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
}

.btn-start{
  background:#00ffae;
  color:#000;
}

.btn-fight{
  background:#ff9800;
  color:#000;
}

.btn-cashout{
  background:#008cff;
  color:#fff;
}

.btn:disabled{
  opacity:0.4;
}

.footer-msg{
  text-align:center;
  font-size:14px;
  margin-top:6px;
  opacity:0.7;
}
</style>
</head>
<body>

<div class="survival-wrap">

  <div class="survival-header">
    ⚔️ Sinh Tồn
    <div class="coin-box">
      💎 <span id="coin">0</span>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="battle-area">
    <div class="warrior" id="warrior">🧝‍♂️</div>
    <div class="result-text" id="resultText"></div>
  </div>

  <div class="control-panel">
    <input type="number"
           id="betInput"
           class="bet-input"
           placeholder="Nhập số 💎 cược">

    <button class="btn btn-start"
            id="startBtn"
            onclick="startGame()">
      BẮT ĐẦU
    </button>

    <button class="btn btn-fight"
            id="fightBtn"
            onclick="fight()"
            disabled>
      ĐÁNH TIẾP
    </button>

    <button class="btn btn-cashout"
            id="cashBtn"
            onclick="cashout()"
            disabled>
      RÚT LUI
    </button>

    <div class="footer-msg">
      Tối đa 20 hiệp – càng về sau càng khó
    </div>
  </div>

</div>

<script>
const socket = io({
  auth:{
    uid: localStorage.getItem("uid")
  }
});

let currentRound = 0;

function renderProgress(){
  const bar = document.getElementById("progressBar");
  bar.innerHTML = "";
  for(let i=1;i<=20;i++){
    const dot = document.createElement("div");
    dot.className = "round-dot";

    if(i < currentRound)
      dot.classList.add("done");

    if(i === currentRound)
      dot.classList.add("active");

    bar.appendChild(dot);
  }
}

function startGame(){
  const bet = Number(
    document.getElementById("betInput").value
  );
  socket.emit("survival-start",{ bet });
}

function fight(){
  socket.emit("survival-fight");
}

function cashout(){
  socket.emit("survival-cashout");
}

socket.on("coin-update", data=>{
  document.getElementById("coin")
    .textContent = data.coins;
});

socket.on("survival-state", data=>{
  currentRound = data.round;
  renderProgress();

  document.getElementById("fightBtn").disabled=false;
  document.getElementById("cashBtn").disabled=false;
  document.getElementById("startBtn").disabled=true;

  document.getElementById("resultText").textContent=
    "Hiệp " + currentRound;
});

socket.on("survival-round-win", data=>{
  currentRound = data.round;
  renderProgress();

  document.getElementById("resultText").textContent=
    "✅ Thắng! Hiệp " + currentRound;

  document.getElementById("warrior")
    .classList.add("shake");

  setTimeout(()=>{
    document.getElementById("warrior")
      .classList.remove("shake");
  },400);
});

socket.on("survival-finish", data=>{
  document.getElementById("fightBtn").disabled=true;
  document.getElementById("cashBtn").disabled=true;
  document.getElementById("startBtn").disabled=false;

  if(data.result==="LOSE"){
    document.getElementById("resultText")
      .textContent="💀 Bạn đã thất bại!";
  }

  if(data.result==="WIN_ALL"){
    document.getElementById("resultText")
      .textContent="🏆 Thắng toàn bộ! +"+data.reward+" 💎";
  }

  if(data.result==="CASHOUT"){
    document.getElementById("resultText")
      .textContent="💰 Rút lui +"+data.reward+" 💎";
  }

  currentRound=0;
  renderProgress();
});

renderProgress();
</script>

</body>
</html>
