<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>🔮 Wheel Predict Tool</title>

<style>
body{
  background:#000;
  color:#00ff9c;
  font-family: monospace;
  padding:20px;
}

h2{ margin-bottom:12px; }

.panel{
  border:1px solid #00ff9c;
  border-radius:16px;
  padding:16px;
  max-width:420px;
}

.big{
  font-size:36px;
  font-weight:900;
  text-align:center;
}

.countdown{
  text-align:center;
  margin-top:8px;
  font-size:20px;
  color:#ffd54f;
}

.wheel-wrap{
  position:relative;
  width:260px;
  height:260px;
  margin:16px auto;
}

.pointer{
  position:absolute;
  top:-6px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-bottom:20px solid #ff5252;
  z-index:5;
}

svg{
  width:100%;
  height:100%;
}

.slice{
  fill:#111;
  stroke:#00ff9c;
  stroke-width:1;
  opacity:.35;
}

.slice.active{
  opacity:1;
  fill:#00ff9c;
  filter:drop-shadow(0 0 10px #00ff9c);
}

.label{
  fill:#000;
  font-size:12px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  pointer-events:none;
}

.lock{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  color:#ff5252;
}

/* 🎡 FAKE SPIN ANIMATION */
#wheelSvg{
  transition: transform 1s linear;
}

#wheelSvg.spinning{
  animation: fakeSpin 2s linear infinite;
}

@keyframes fakeSpin{
  from{ transform: rotate(0deg); }
  to{ transform: rotate(360deg); }
}


</style>
</head>

<body>

<h2>🔮 WHEEL PREDICT</h2>

<div class="panel">

  <div class="big" id="multiplier">--</div>
  <div class="countdown" id="countdown">--</div>

  <div class="wheel-wrap">
    <div class="pointer"></div>

    <svg viewBox="-130 -130 260 260" id="wheelSvg"></svg>
  </div>

  <div class="lock" id="lockText"></div>

</div>

<script src="wheel-predict.js"></script>
</body>
</html>
