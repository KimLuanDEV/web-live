<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>🔮 Wheel Predict Tool</title>

<style>
:root{
  --neon:#00ff9c;
  --yellow:#ffd54f;
  --red:#ff5252;
  --bg:#050505;
  --card:#0b0b0b;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top, rgba(0,255,156,.12), transparent 40%),
    var(--bg);
  color:var(--neon);
  font-family: system-ui, monospace;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== CARD ===== */
.panel{
  width:380px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), transparent),
    var(--card);
  border-radius:20px;
  padding:22px;
  box-shadow:
    0 0 0 1px rgba(0,255,156,.2),
    0 20px 60px rgba(0,0,0,.8);
}

/* ===== HEADER ===== */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.title{
  font-size:14px;
  letter-spacing:1.5px;
  opacity:.8;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  background:rgba(0,255,156,.15);
}

/* ===== MULTIPLIER ===== */
.multiplier-box{
  text-align:center;
  margin:14px 0 6px;
}

.multiplier{
  font-size:56px;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 0 18px rgba(0,255,156,.6);
}

.subtext{
  font-size:12px;
  opacity:.6;
}

/* ===== COUNTDOWN ===== */
.countdown{
  margin:14px auto;
  text-align:center;
  padding:8px 14px;
  border-radius:12px;
  font-size:18px;
  color:var(--yellow);
  background:rgba(255,213,79,.12);
  width:fit-content;
}

/* ===== SLOTS ===== */
.wheel{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.slot{
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), transparent),
    #0f0f0f;
  border-radius:14px;
  padding:14px 0;
  text-align:center;
  font-size:18px;
  font-weight:700;
  opacity:.35;
  transition:.25s;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.05);
}

.slot.active{
  opacity:1;
  color:#000;
  background:
    radial-gradient(circle at top, #b6ffe3, var(--neon));
  box-shadow:
    0 0 18px rgba(0,255,156,.8),
    inset 0 0 0 1px rgba(0,0,0,.25);
}

/* ===== FOOTER ===== */
.lock{
  margin-top:18px;
  text-align:center;
  font-size:13px;
  color:var(--red);
}
</style>
</head>

<body>

<div class="panel">

  <div class="header">
    <div class="title">WHEEL • PREDICT</div>
    <div class="badge">RESULT</div>
  </div>

  <div class="multiplier-box">
    <div class="multiplier" id="multiplier">--</div>
    <div class="subtext">Hệ số sắp quay</div>
  </div>

  <div class="countdown" id="countdown">--</div>

  <div class="wheel">
    <div class="slot">x0.5</div>
    <div class="slot">x1.2</div>
    <div class="slot">x1.5</div>
    <div class="slot">x2</div>
    <div class="slot">x5</div>
    <div class="slot">x10</div>
  </div>

  <div class="lock" id="lockText"></div>

</div>

<script src="wheel-predict.js"></script>
</body>
</html>
