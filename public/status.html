<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Livestream Pro • Profile</title>

<link rel="stylesheet" href="/style.css">
<link rel="manifest" href="/manifest.json">

<style>
/* ===== PROFILE PAGE ===== */
.profile-page{
  background:#000;
  color:#fff;
}

.lp-profile-header{
  background:#000;
}

.lp-profile-cover{
  height:180px;
  background:#111;
  position:relative;
}
.lp-profile-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.lp-profile-info{
  padding:0 14px 14px;
  position:relative;
}

.lp-profile-avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  overflow:hidden;
  border:4px solid #000;
  margin-top:-48px;
}
.lp-profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.lp-profile-name{
  font-size:20px;
  font-weight:900;
  margin-top:6px;
}

.lp-profile-bio{
  opacity:.8;
  margin-top:4px;
  font-size:14px;
}

.lp-profile-stats{
  display:flex;
  gap:18px;
  margin-top:8px;
  font-size:14px;
}

.lp-btn-outline{
  margin-top:10px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background:transparent;
  color:#fff;
  font-weight:700;
}

/* ===== PROFILE TABS ===== */
.lp-profile-tabs{
  display:flex;
  border-bottom:1px solid rgba(255,255,255,.1);
  margin-top:10px;
}
.lp-profile-tabs .tab{
  flex:1;
  text-align:center;
  padding:12px;
  cursor:pointer;
  opacity:.6;
}
.lp-profile-tabs .tab.active{
  opacity:1;
  border-bottom:2px solid #25F09A;
  color:#25F09A;
}

/* ===== TAB CONTENT ===== */
.lp-profile-content{
  padding-bottom:80px;
}

/* photo grid */
.lp-photo-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  padding:8px;
}
.lp-photo-grid img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* about */
.lp-about{
  padding:14px;
  line-height:1.6;
  font-size:15px;
}
</style>
</head>

<body class="profile-page">

<script src="/guard.js"></script>

<!-- TOP BAR -->
<div class="lp-topbar">
  <button class="msg-back" onclick="location.href='/social.html'">‹</button>
  <div class="lp-title">Trang cá nhân</div>
</div>

<!-- PROFILE HEADER -->
<div class="lp-profile-header">

  <div class="lp-profile-cover">
    <img id="profileCover" src="/default-cover.jpg">
  </div>

  <div class="lp-profile-info">
    <div class="lp-profile-avatar">
      <img id="profileAvatar">
    </div>

    <div class="lp-profile-name" id="profileName"></div>
    <div class="lp-profile-bio" id="profileBio"></div>

    <button class="lp-btn-outline" onclick="openEditProfile()">
      Chỉnh sửa hồ sơ
    </button>

    <div class="lp-profile-stats">
      <span><b id="postCount">0</b> bài viết</span>
      <span><b id="likeCount">0</b> lượt thích</span>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="lp-profile-tabs">
  <div class="tab active" data-tab="posts">Bài viết</div>
  <div class="tab" data-tab="photos">Ảnh</div>
  <div class="tab" data-tab="about">Giới thiệu</div>
</div>

<!-- CONTENT -->
<div class="lp-profile-content">

  <!-- POSTS -->
  <div id="tab-posts">
    <div class="lp-compose">
      <div class="lp-compose-row">
        <img id="meAvatar" class="lp-ava">
        <textarea id="postText" placeholder="Chia sẻ điều gì đó…" readonly></textarea>
      </div>
    </div>

    <div id="lpFeed" class="lp-feed"></div>
  </div>

  <!-- PHOTOS -->
  <div id="tab-photos" class="hidden">
    <div id="photoGrid" class="lp-photo-grid"></div>
  </div>

  <!-- ABOUT -->
  <div id="tab-about" class="hidden">
    <div class="lp-about">
      <div><b>Tên:</b> <span id="aboutName"></span></div>
      <div><b>Giới thiệu:</b> <span id="aboutBio"></span></div>
      <div><b>Tham gia:</b> <span id="aboutDate"></span></div>
    </div>
  </div>

</div>

<!-- TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab" data-tab="social"><div class="icon">🏠</div></div>
  <div class="lp-tab" data-tab="lobby"><div class="icon">🎥</div></div>
  <div class="lp-tab" data-tab="messages"><div class="icon">💬</div></div>
  <div class="lp-tab active" data-tab="profile"><div class="icon">👤</div></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/profile.js"></script>
</body>
</html>
