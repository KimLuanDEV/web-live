<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trang cá nhân</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/status.css">
</head>
<body>

<!-- TOP BAR -->
<div class="lp-topbar">
  <button onclick="history.back()">←</button>
  <div class="lp-title">Trang cá nhân</div>
</div>

<!-- COVER -->
<div class="st-cover">
  <img id="stCover" src="https://i.ibb.co/3mY0H4Xh/Chat-GPT-Image-Jan-19-2026-09-44-27-AM.jpg">
  
  <!-- nút đổi cover -->
  <label class="st-cover-btn">
    📸 Đổi ảnh bìa
    <input type="file" id="coverInput" accept="image/*" hidden>
  </label>
</div>

<!-- COVER ACTIONS -->
<div class="st-cover-actions" id="coverActions">
  <button class="btn-save" id="saveCover">Lưu vị trí</button>
  <button class="btn-cancel" id="cancelCover">Hủy</button>
</div>


<!-- AVATAR -->
<div class="st-avatar-wrap">
  <img id="stAvatar">
</div>

<!-- INFO -->
<div class="st-info">
  <div id="stName" class="st-name"></div>
  <div id="stBio" class="st-bio">Chưa có mô tả</div>

  <div class="st-stats">
    <div><b id="stPosts">0</b><span>Bài viết</span></div>
    <div><b id="stLikes">0</b><span>Lượt thích</span></div>
    <div><b id="stComments">0</b><span>Bình luận</span></div>
  </div>
</div>

<!-- FEED -->
<div class="lp-shell">
  <div id="statusFeed" class="lp-feed"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/status.js"></script>
</body>
</html>
