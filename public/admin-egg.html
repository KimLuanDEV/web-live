<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Admin - Egg Round</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:#111;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}
.box{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  box-shadow:0 0 30px rgba(0,255,150,.2);
}
h2{
  margin-top:0;
}
.secret{
  font-size:24px;
  font-weight:bold;
  color:#00ff99;
}
.hash{
  font-size:12px;
  opacity:.6;
  word-break:break-all;
}
.timer{
  font-size:18px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="box">
  <h2>🥚 Current Egg Round</h2>
  <div>Round ID: <span id="roundId">-</span></div>
  <div>Egg Type: <span id="eggType">-</span></div>
  <div class="secret">
    Multiplier: x <span id="multi">?</span>
  </div>

<div style="margin-top:20px">
  <input type="number" step="0.1"
         id="overrideInput"
         placeholder="Enter multiplier"
         style="padding:8px;width:150px">

  <button onclick="overrideEgg()"
          style="padding:8px 12px;
                 background:red;
                 color:#fff;
                 border:none;
                 border-radius:6px">
    OVERRIDE
  </button>
</div>

<div id="overrideStatus"
     style="margin-top:10px;color:orange">
</div>


  <div class="hash">
    Hash: <span id="hash">-</span>
  </div>
  <div class="timer">
    Ends in: <span id="timer">--</span>s
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({
  auth:{ uid:"ADMIN_ID_HERE" } // 🔥 thay bằng uid admin
});

let endAt = 0;

socket.on("admin-egg-secret-update", data=>{
  document.getElementById("roundId").textContent = data.roundId;
  document.getElementById("eggType").textContent = data.eggType;
  document.getElementById("multi").textContent = data.multiplier;
  document.getElementById("hash").textContent = data.hash;
  endAt = data.endAt;
});

setInterval(()=>{
  if(!endAt) return;
  const left = Math.max(0,
    Math.floor((endAt - Date.now())/1000)
  );
  document.getElementById("timer").textContent = left;
},1000);



function overrideEgg(){

  const value = Number(
    document.getElementById("overrideInput").value
  );

  if(!value && value !== 0){
    alert("Invalid multiplier");
    return;
  }

  fetch("/api/admin/egg/override",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-uid":"ADMIN_ID_HERE" // 🔥 thay bằng uid admin
    },
    body: JSON.stringify({ multiplier:value })
  })
  .then(r=>r.json())
  .then(res=>{
    if(res.ok){
      document.getElementById("overrideStatus")
        .textContent = "⚠️ RESULT OVERRIDDEN";
    }else{
      alert(res.message || "Override failed");
    }
  });
}



</script>

</body>
</html>
