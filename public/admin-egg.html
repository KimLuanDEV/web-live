<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Admin - Egg Round</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  background:#111;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}
.box{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  box-shadow:0 0 30px rgba(0,255,150,.2);
}
h2{
  margin-top:0;
}
.secret{
  font-size:24px;
  font-weight:bold;
  color:#00ff99;
}
.hash{
  font-size:12px;
  opacity:.6;
  word-break:break-all;
}
.timer{
  font-size:18px;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="box">
  <h2>🥚 Current Egg Round</h2>
  <div>Round ID: <span id="roundId">-</span></div>
  <div>Egg Type: <span id="eggType">-</span></div>


  <div class="secret">
    Multiplier: x <span id="multi">?</span>
  </div>


  <hr style="margin:20px 0">

<div>
  <input type="number"
         id="overrideMulti"
         placeholder="Override multiplier"
         step="0.01"
         style="padding:8px;border-radius:8px;border:none;width:180px;">
         
  <button onclick="overrideEgg()"
          style="padding:8px 16px;border:none;border-radius:8px;background:#ff4444;color:white;cursor:pointer;">
    OVERRIDE
  </button>
</div>



  <div class="hash">
    Hash: <span id="hash">-</span>
  </div>


  <div class="timer">
    Ends in: <span id="timer">--</span>s
  </div>


</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const uid = localStorage.getItem("uid");

if(!uid){
  alert("❌ Not logged in");
}

const socket = io({
  auth:{ uid }
});

let endAt = 0;

socket.on("admin-egg-secret-update", data=>{
  document.getElementById("roundId").textContent = data.roundId;
  document.getElementById("eggType").textContent = data.eggType;
  document.getElementById("multi").textContent = data.multiplier;
  document.getElementById("hash").textContent = data.hash;
  endAt = data.endAt;
});

setInterval(()=>{
  if(!endAt) return;
  const left = Math.max(
    0,
    Math.floor((endAt - Date.now())/1000)
  );
  document.getElementById("timer").textContent = left;
},1000);


async function overrideEgg(){

  if(!uid){
    alert("❌ Not logged in");
    return;
  }

  const m = Number(
    document.getElementById("overrideMulti").value
  );

  if(isNaN(m) || m < 0){
    alert("Invalid multiplier");
    return;
  }

  try{

    const res = await fetch(
      "/api/admin/egg/override",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-uid": uid
        },
        body: JSON.stringify({ multiplier:m })
      }
    );

    const json = await res.json();

    if(!json.ok){
      alert("❌ " + (json.message || "Override failed"));
      console.log("Override error:", json);
      return;
    }

    alert("✅ Override success → x" + m);

  }catch(err){
    console.error(err);
    alert("Server error");
  }
}

</script>

</body>
</html>
