<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Admin Egg Control</title>
<script src="/socket.io/socket.io.js"></script>
<style>
body{
  background:#111;
  color:#fff;
  font-family:sans-serif;
  padding:20px;
}
.box{
  background:#1c1c1c;
  padding:20px;
  border-radius:16px;
  box-shadow:0 0 30px rgba(0,255,150,.3);
  margin-bottom:20px;
}
.big{
  font-size:36px;
  font-weight:bold;
  color:#00ff99;
}
</style>
</head>
<body>

<h2>🥚 Egg Admin Panel</h2>

<div class="box">
  <div>Round ID:</div>
  <div id="roundId"></div>
</div>

<div class="box">
  <div>Secret Multiplier:</div>
  <div id="multiplier" class="big">?</div>
</div>

<div class="box">
  <div>Egg Type:</div>
  <div id="eggType"></div>
</div>


<div class="box">
  <div>Override Multiplier</div>
  <input type="number" id="overrideInput" placeholder="Enter x" 
         style="width:100%;padding:10px;margin-top:10px;border-radius:8px;border:none;">
  <button onclick="overrideEgg()"
          style="margin-top:10px;width:100%;padding:12px;
                 background:#ff4444;border:none;border-radius:10px;
                 font-weight:bold;color:#fff;">
    ⚠ Override
  </button>
</div>



<script>
const me = JSON.parse(localStorage.getItem("user_profile")||"{}");
const socket = io({ auth:{ uid: me.uid }});

socket.emit("admin-get-egg-secret");

socket.on("admin-egg-secret", data=>{
  document.getElementById("roundId").textContent = data.roundId;
  document.getElementById("multiplier").textContent = "x " + data.multiplier;
  document.getElementById("eggType").textContent = data.eggType;
});

socket.on("admin-egg-secret-update", data=>{
  document.getElementById("roundId").textContent = data.roundId;
  document.getElementById("multiplier").textContent = "x " + data.multiplier;
  document.getElementById("eggType").textContent = data.eggType;
});



function overrideEgg(){

  const value = Number(
    document.getElementById("overrideInput").value
  );

  if(isNaN(value)){
    alert("Invalid multiplier");
    return;
  }

  fetch("/api/admin/egg/override",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-uid": me.uid
    },
    body: JSON.stringify({
      multiplier: value
    })
  })
  .then(r=>r.json())
  .then(data=>{
    if(!data.ok){
      alert(data.message || "Override failed");
      return;
    }
    alert("Override success → x" + value);
  });
}



</script>

</body>
</html>
