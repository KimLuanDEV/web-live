<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kéo • Búa • Bao</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>

<style>
/* ================= RPS GAME ================= */

html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

body{
  background:
    radial-gradient(circle at top, rgba(0,255,180,.15), transparent 60%),
    url("/assets/bg/rps1.jpg") center / cover no-repeat fixed;
}

/* ===== HEADER ===== */
.rps-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.rps-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.back-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

/* ===== MAIN ===== */
.rps-stage{
  min-height:calc(100vh - 64px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:20px 16px 28px;
}

/* ===== STATUS ===== */
.rps-status{
  text-align:center;
  margin-top:10px;
}

.rps-round{
  font-size:14px;
  opacity:.7;
}

.rps-msg{
  font-size:20px;
  font-weight:800;
  margin-top:6px;
  text-shadow:0 0 18px rgba(0,255,180,.6);
}

/* ===== HANDS ===== */
.rps-hands{
  display:flex;
  gap:20px;
  margin:30px 0;
}

.rps-hand{
  width:96px;
  height:96px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  cursor:pointer;

  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 10px 25px rgba(0,0,0,.6),
    inset 0 0 18px rgba(0,255,180,.15);

  transition:.2s ease;
}

.rps-hand:hover{
  transform:translateY(-4px) scale(1.05);
  box-shadow:
    0 0 28px rgba(0,255,180,.5),
    0 12px 30px rgba(0,0,0,.8);
}

.rps-hand.active{
  outline:2px solid #00ffb0;
  box-shadow:0 0 30px rgba(0,255,180,.8);
}

/* ===== RESULT ===== */
.rps-result{
  text-align:center;
  min-height:80px;
}

.rps-result .icon{
  font-size:48px;
}

.rps-result .text{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

/* ===== ACTION ===== */
.rps-action{
  width:100%;
  max-width:360px;
}

.rps-btn{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-size:16px;
  font-weight:800;
  cursor:pointer;

  background:
    linear-gradient(180deg,#00ffb0,#00b97d);
  color:#001a12;

  box-shadow:
    0 0 25px rgba(0,255,180,.5),
    0 10px 25px rgba(0,0,0,.8);
}

.rps-btn:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}


.rps-bet{
  width:100%;
  max-width:360px;
  padding:14px;
  border-radius:18px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 25px rgba(0,255,180,.25);
}

.bet-label{
  font-weight:800;
  margin-bottom:10px;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.bet-btn{
  padding:10px;
  border-radius:12px;
  border:none;
  font-weight:700;
  background:rgba(255,255,255,.08);
  color:#fff;
  cursor:pointer;
}

.bet-btn.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}


.bet-info{
  margin-top:8px;
  opacity:.85;
}



#rpsTimer{
  font-weight:900;
  color:#00ffb0;
  text-shadow:0 0 14px rgba(0,255,180,.7);
}

.rps-timer-warn{
  color:#ffb400 !important;
  text-shadow:0 0 16px rgba(255,180,0,.8);
}

.rps-timer-danger{
  color:#ff4d4d !important;
  text-shadow:0 0 18px rgba(255,80,80,.9);
  animation:pulse .8s infinite alternate;
}

@keyframes pulse{
  from{ transform:scale(1); }
  to{ transform:scale(1.15); }
}


.rps-wallet{
  font-weight:800;
  color:#00ffb0;
  text-shadow:0 0 12px rgba(0,255,180,.7);
}


.rps-server-result{
  width:100%;
  max-width:360px;
  margin-top:12px;
  padding:12px;
  border-radius:16px;
  background:rgba(0,0,0,.6);
  box-shadow:0 0 22px rgba(0,255,180,.25);
  font-size:14px;
}

.rps-server-result.hidden{
  display:none;
}

.sr-title{
  font-weight:900;
  margin-bottom:8px;
  color:#00ffb0;
}

.sr-row{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
}

.sr-win{ color:#00ffb0; }
.sr-lose{ color:#ff4d4d; }
.sr-draw{ color:#ffc44d; }


.rps-result-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter: blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.rps-result-overlay.hidden{
  display:none;
}

.rps-result-box{
  width:90%;
  max-width:360px;
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.9);
  box-shadow:0 0 40px rgba(0,255,180,.45);
}


/* ===== WAITING INLINE STATE ===== */
.rps-wait-overlay{
  position: relative;        /* ❗ KHÔNG fixed */
  width: 100%;
  max-width: 360px;
  margin: 16px auto;
  background: rgba(0,0,0,.6);
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 30px rgba(0,255,180,.35);
}

.rps-wait-overlay.hidden{
  display: none;
}


.rps-wait-box{
  text-align:center;
  padding:30px 24px;
  border-radius:24px;
  background:rgba(0,0,0,.85);
  box-shadow:0 0 50px rgba(0,255,180,.45);
}

.rps-wait-spinner{
  display:flex;
  justify-content:center;
  gap:18px;
  font-size:42px;
  margin-bottom:18px;
}

.rps-wait-spinner span{
  animation: rpsSpin 1.2s infinite ease-in-out;
}

.rps-wait-spinner span:nth-child(2){
  animation-delay:.2s;
}
.rps-wait-spinner span:nth-child(3){
  animation-delay:.4s;
}

@keyframes rpsSpin{
  0%{
    transform:translateY(0) scale(1);
    opacity:.4;
  }
  50%{
    transform:translateY(-12px) scale(1.2);
    opacity:1;
  }
  100%{
    transform:translateY(0) scale(1);
    opacity:.4;
  }
}

.rps-wait-title{
  font-size:20px;
  font-weight:900;
  color:#00ffb0;
  text-shadow:0 0 18px rgba(0,255,180,.7);
}

.rps-wait-sub{
  margin-top:6px;
  font-size:14px;
  opacity:.8;
}


/* ===== BET PANEL PRO ===== */
.rps-bet.pro{
  width:100%;
  max-width:360px;
  padding:16px;
  border-radius:20px;
  background:linear-gradient(
    180deg,
    rgba(0,255,180,.12),
    rgba(0,0,0,.65)
  );
  border:1px solid rgba(0,255,180,.25);
  box-shadow:
    0 0 30px rgba(0,255,180,.35),
    inset 0 0 20px rgba(0,255,180,.12);
}




.bet-balance{
  font-size:13px;
  opacity:.85;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:10px;
}

.bet-btn{
  padding:10px 0;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.bet-btn:hover{
  box-shadow:0 0 14px rgba(0,255,180,.6);
}

.bet-btn.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}

/* % buttons */
.bet-percent{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px;
}

.bet-pct{
  padding:8px 0;
  border-radius:14px;
  border:1px solid rgba(0,255,180,.35);
  background:rgba(0,255,180,.12);
  color:#00ffb0;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.bet-pct:hover{
  background:rgba(0,255,180,.25);
}

.bet-pct.allin{
  color:#ffb400;
  border-color:#ffb400;
  background:rgba(255,180,0,.15);
}


.bet-info{
  margin-top:8px;
  text-align:right;
  font-size:14px;
  opacity:.9;
}


</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="rps-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="rps-title">Kéo • Búa • Bao</div>
  <div class="rps-wallet">
  💎 <span id="myCoins">0</span>
</div>

</header>

<!-- ===== STAGE ===== -->
<main class="rps-stage">

  <!-- STATUS -->
 <div class="rps-status">
  <div class="rps-round">
    Round <span id="rpsRoundId">#1</span> •
    <span id="rpsTimer">60</span>s
  </div>
  <div class="rps-msg" id="statusMsg">Chọn tay của bạn</div>
</div>

  

  <!-- HANDS -->
  <div class="rps-hands">
    <div class="rps-hand" data-hand="rock">✊</div>
    <div class="rps-hand" data-hand="paper">✋</div>
    <div class="rps-hand" data-hand="scissors">✌️</div>
  </div>




<!-- ⏳ WAITING RESULT OVERLAY (GLOBAL) -->
<div class="rps-wait-overlay hidden" id="waitOverlay">
  <div class="rps-wait-box">

    <div class="rps-wait-spinner">
      <span>✊</span>
      <span>✋</span>
      <span>✌️</span>
    </div>

    <div class="rps-wait-title">
      Hệ thống đang quay
    </div>

    <div class="rps-wait-sub">
      Vui lòng chờ kết quả…
    </div>

  </div>
</div>


  <!-- RESULT -->
  <div class="rps-result" id="resultBox"></div>

<!-- 🧾 SERVER RESULT DETAIL -->
<div class="rps-result-overlay hidden" id="serverOverlay">

  <div class="rps-server-result" id="serverResult">


  <div class="sr-title">Kết quả từ hệ thống</div>

  <div class="sr-row">
    <span>Hệ thống ra:</span>
    <b id="srEnemy">---</b>
  </div>

  <div class="sr-row">
    <span>Kết quả:</span>
    <b id="srOutcome">---</b>
  </div>

  <div class="sr-row">
    <span>Thay đổi kim cương:</span>
    <b id="srCoin">0</b>
  </div>

  <button class="rps-btn" onclick="closeRpsResult()">
  OK
</button>


  </div>
</div>




<!-- 💎 BET PANEL PRO -->
<div class="rps-bet pro">

    <!-- INFO -->
  <div class="bet-info">
    Vốn đầu tư:
    <b><span id="betValue">0</span></b> 💎
  </div>

    <!-- % BET -->
  <div class="bet-percent">
    <button class="bet-pct" data-pct="25">25%</button>
    <button class="bet-pct" data-pct="50">50%</button>
    <button class="bet-pct allin" data-pct="100">ALL IN</button>
  </div>

  <!-- QUICK BET -->
  <div class="bet-row">
    <button class="bet-btn" data-bet="10">10</button>
    <button class="bet-btn" data-bet="50">50</button>
    <button class="bet-btn" data-bet="100">100</button>
    <button class="bet-btn" data-bet="500">500</button>
    <button class="bet-btn" data-bet="1000">1k</button>
    <button class="bet-btn" data-bet="5000">5k</button>
  </div>


   <!-- ACTION -->
  <div class="rps-action">
    <button class="rps-btn" id="playBtn" disabled>BẮT ĐẦU</button>
  </div>

</div>



 
</main>




<script src="/socket.io/socket.io.js"></script>
<script src="/game-rps.js"></script>

</body>
</html>
