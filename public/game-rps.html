<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kéo • Búa • Bao</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>

<style>
/* ================= RPS GAME ================= */

html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

body{
  background:
    radial-gradient(circle at top, rgba(0,255,180,.15), transparent 60%),
    url("/assets/bg/rps.jpg") center / cover no-repeat fixed;
}

/* ===== HEADER ===== */
.rps-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:rgba(0,0,0,.55);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.rps-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.back-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

/* ===== MAIN ===== */
.rps-stage{
  min-height:calc(100vh - 64px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:20px 16px 28px;
}

/* ===== STATUS ===== */
.rps-status{
  text-align:center;
  margin-top:10px;
}

.rps-round{
  font-size:14px;
  opacity:.7;
}

.rps-msg{
  font-size:20px;
  font-weight:800;
  margin-top:6px;
  text-shadow:0 0 18px rgba(0,255,180,.6);
}

/* ===== HANDS ===== */
.rps-hands{
  display:flex;
  gap:20px;
  margin:30px 0;
}

.rps-hand{
  width:96px;
  height:96px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  cursor:pointer;

  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);

  box-shadow:
    0 10px 25px rgba(0,0,0,.6),
    inset 0 0 18px rgba(0,255,180,.15);

  transition:.2s ease;
}

.rps-hand:hover{
  transform:translateY(-4px) scale(1.05);
  box-shadow:
    0 0 28px rgba(0,255,180,.5),
    0 12px 30px rgba(0,0,0,.8);
}

.rps-hand.active{
  outline:2px solid #00ffb0;
  box-shadow:0 0 30px rgba(0,255,180,.8);
}

/* ===== RESULT ===== */
.rps-result{
  text-align:center;
  min-height:80px;
}

.rps-result .icon{
  font-size:48px;
}

.rps-result .text{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

/* ===== ACTION ===== */
.rps-action{
  width:100%;
  max-width:360px;
}

.rps-btn{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-size:16px;
  font-weight:800;
  cursor:pointer;

  background:
    linear-gradient(180deg,#00ffb0,#00b97d);
  color:#001a12;

  box-shadow:
    0 0 25px rgba(0,255,180,.5),
    0 10px 25px rgba(0,0,0,.8);
}

.rps-btn:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}

</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="rps-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="rps-title">Kéo • Búa • Bao</div>
  <div style="width:24px"></div>
</header>

<!-- ===== STAGE ===== -->
<main class="rps-stage">

  <!-- STATUS -->
  <div class="rps-status">
    <div class="rps-round">Round #1</div>
    <div class="rps-msg" id="statusMsg">Chọn tay của bạn</div>
  </div>

  <!-- HANDS -->
  <div class="rps-hands">
    <div class="rps-hand" data-hand="rock">✊</div>
    <div class="rps-hand" data-hand="paper">✋</div>
    <div class="rps-hand" data-hand="scissors">✌️</div>
  </div>

  <!-- RESULT -->
  <div class="rps-result" id="resultBox"></div>

  <!-- ACTION -->
  <div class="rps-action">
    <button class="rps-btn" id="playBtn" disabled>BẮT ĐẦU</button>
  </div>

</main>
