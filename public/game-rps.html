<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kéo • Búa • Bao</title>
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">


<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>

<style>
/* ================= RPS GAME ================= */

html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

body{
  background:
    radial-gradient(circle at top, rgba(0,255,180,.15), transparent 60%),
    url("/assets/bg/rps1.jpg") center / cover no-repeat fixed;
}

/* ===== HEADER (FIXED TOP) ===== */
.rps-header{
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;

  height: 56px;          /* ✅ CỐ ĐỊNH */
  padding: 0 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,.65);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}


.rps-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.back-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.rps-stage{
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top: 56px;      /* = header */
  padding-left: 16px;
  padding-right: 16px;
  padding-bottom: 280px;  /* = bet sheet */

  box-shadow:none;        /* ❌ bỏ shadow gây ảo giác height */
}





/* ===== STATUS ===== */
.rps-status{
  text-align:center;
  margin-top:10px;
}

.rps-round{
  font-size:14px;
  opacity:.7;
}

.rps-msg{
  font-size:20px;
  font-weight:800;
  margin-top:6px;
  text-shadow:0 0 18px rgba(0,255,180,.6);
}



/* ===== RPS HANDS (NEON CARD STYLE) ===== */
.rps-hands{
  display:flex;
  justify-content:center;
  gap:18px;
  margin:32px 0 24px;
}

/* CARD */
.rps-hand{
  width:94px;
  height:112px;
  border-radius:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:44px;
  cursor:pointer;
  user-select:none;

  background:
    radial-gradient(circle at top,
      rgba(0,255,180,.28),
      rgba(0,0,0,.92) 70%);

  border:1px solid rgba(0,255,180,.45);

  box-shadow:
    0 14px 30px rgba(0,0,0,.85),
    inset 0 0 22px rgba(0,255,180,.18);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

/* emoji glow */
.rps-hand::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  box-shadow:inset 0 0 40px rgba(0,255,180,.35);
  opacity:.6;
  pointer-events:none;
}

/* HOVER */
.rps-hand:hover{
  transform:translateY(-6px) scale(1.06);
  box-shadow:
    0 0 36px rgba(0,255,180,.6),
    0 18px 40px rgba(0,0,0,.9);
}

/* SELECT (CHƯA CHỐT) */
.rps-hand.active{
  outline:2px solid #00ffb0;
  box-shadow:
    0 0 42px rgba(0,255,180,.85),
    inset 0 0 26px rgba(0,255,180,.35);
  transform:translateY(-4px) scale(1.08);
}

/* CONFIRMED (ĐÃ VÀO LỆNH) */
.rps-hand.confirmed{
  outline:3px solid #00ffb0;
  box-shadow:
    0 0 60px rgba(0,255,180,1),
    inset 0 0 30px rgba(0,255,180,.5);
  transform:scale(1.12);
  animation:handPulse .9s ease-in-out infinite alternate;
}

/* HAND KHÁC KHI ĐÃ CHỐT */
.rps-hand.locked-dim{
  opacity:.22;
  filter:grayscale(1) blur(.3px);
  transform:scale(.92);
  box-shadow:none;
}

/* LOCKED */
.rps-hand.bet-locked{
  cursor:not-allowed;
}

/* pulse */
@keyframes handPulse{
  from{ box-shadow:0 0 40px rgba(0,255,180,.8); }
  to{ box-shadow:0 0 70px rgba(0,255,180,1); }
}






/* ===== RESULT ===== */
.rps-result{
  text-align:center;
  min-height:80px;
}

.rps-result .icon{
  font-size:48px;
}

.rps-result .text{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

/* ===== ACTION ===== */
.rps-action{
  width:100%;
  max-width:none;   /* ✅ cho full ngang */
}


.rps-btn{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-size:16px;
  font-weight:800;
  cursor:pointer;

  background:
    linear-gradient(180deg,#00ffb0,#00b97d);
  color:#001a12;

  box-shadow:
    0 0 25px rgba(0,255,180,.5),
    0 10px 25px rgba(0,0,0,.8);
}

.rps-btn:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}


.rps-bet{
  width:100%;
  max-width:360px;
  padding:14px;
  border-radius:18px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 25px rgba(0,255,180,.25);
}

.bet-label{
  font-weight:800;
  margin-bottom:10px;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}



.bet-btn.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}


.bet-info{
  margin-top:8px;
  opacity:.85;
}



#rpsTimer{
  font-weight:900;
  color:#00ffb0;
  text-shadow:0 0 14px rgba(0,255,180,.7);
}

.rps-timer-warn{
  color:#ffb400 !important;
  text-shadow:0 0 16px rgba(255,180,0,.8);
}

.rps-timer-danger{
  color:#ff4d4d !important;
  text-shadow:0 0 18px rgba(255,80,80,.9);
  animation:pulse .8s infinite alternate;
}

@keyframes pulse{
  from{ transform:scale(1); }
  to{ transform:scale(1.15); }
}


.rps-wallet{
  font-weight:800;
  color:#00ffb0;
  text-shadow:0 0 12px rgba(0,255,180,.7);
}


.rps-server-result{
  width:100%;
  max-width:360px;
  margin-top:12px;
  padding:12px;
  border-radius:16px;
  background:rgba(0,0,0,.6);
  box-shadow:0 0 22px rgba(0,255,180,.25);
  font-size:14px;
}

.rps-server-result.hidden{
  display:none;
}

.sr-title{
  font-weight:900;
  margin-bottom:8px;
  color:#00ffb0;
}

.sr-row{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
}

.sr-win{ color:#00ffb0; }
.sr-lose{ color:#ff4d4d; }
.sr-draw{ color:#ffc44d; }


.rps-result-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter: blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.rps-result-overlay.hidden{
  display:none;
}

.rps-result-box{
  width:90%;
  max-width:360px;
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.9);
  box-shadow:0 0 40px rgba(0,255,180,.45);
}




/* ===== BET PANEL PRO ===== */
.rps-bet.pro{
  width:100%;
  max-width:380px;
  padding:18px;
  border-radius:22px;
  background:
    linear-gradient(180deg, rgba(0,255,180,.18), rgba(0,0,0,.75));
  border:1px solid rgba(0,255,180,.35);
  box-shadow:
    0 0 35px rgba(0,255,180,.35),
    inset 0 0 25px rgba(0,255,180,.12);
}

/* INFO */
.bet-info.big{
  text-align:center;
  margin-bottom:14px;
  font-weight:900;
  letter-spacing:.5px;
  color:#00ffb0;
}

.bet-amount{
  margin-top:6px;
  font-size:26px;
  color:#fff;
  text-shadow:0 0 18px rgba(0,255,180,.8);
}



/* % BET */
.bet-pct{
  padding:12px 0;
  border-radius:16px;
  border:1px solid rgba(0,255,180,.4);
  background:rgba(0,255,180,.15);
  color:#00ffb0;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.bet-pct:hover{
  box-shadow:0 0 18px rgba(0,255,180,.6);
}

.bet-pct.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}

.bet-pct.allin{
  color:#ffb400;
  border-color:#ffb400;
  background:rgba(255,180,0,.18);
}

/* QUICK BET */
.bet-btn{
  padding:10px 0;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.bet-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 16px rgba(0,255,180,.6);
}

.bet-btn.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}

/* ACTION */
.rps-action{
  margin-top:8px;
}

.rps-btn{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  background:
    linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
  box-shadow:
    0 0 25px rgba(0,255,180,.6),
    0 12px 30px rgba(0,0,0,.8);
}

.rps-btn:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}


/* ===== BET LOCK ===== */
.bet-locked{
  opacity:.4;
  pointer-events:none;
  filter: grayscale(1);
}


.bet-btn.reset:hover{
  box-shadow:
    0 0 26px rgba(255,180,0,.8),
    inset 0 0 14px rgba(255,180,0,.35);
}






/* ===== BET BAR FIXED BOTTOM (GIỐNG GAME WHEEL) ===== */
.bet-sheet{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 998;
  

  padding: 0 env(safe-area-inset-bottom);
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0),
    rgba(0,0,0,.9)
  );
}


.bet-sheet .rps-bet.pro{
  width: 100%;
  max-width: none;        /* ❗ bỏ bó chiều ngang */
  margin: 0;

   padding: 10px 12px 12px;   /* 🔽 gọn hơn */
  border-radius: 0;       /* ❗ phẳng như bet bar */

  border-left: none;
  border-right: none;
  border-bottom: none;
  background: rgba(20,20,20,.96);

  box-shadow:
    0 -10px 30px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.06);
}

.grid-3{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 8px;
}


.bet-btn.reset{
  grid-column: 1 / -1;
  height: 38px;

  background: rgba(255,80,80,.15);
  color: #ff8080;

  border: none;
  border-radius: 12px;

  font-weight: 800;
}

.bet-sheet .rps-action{
  width:100%;
  margin-top: 6px;
}

.bet-sheet .rps-btn{
  width: 100%;
  height:46px;
  font-size:18px;
  letter-spacing:.5px;
  border-radius: 14px;
  display:block;

}



html, body{
  touch-action: manipulation;   /* chặn zoom gesture */
  height: 100%;
  overflow: hidden;           /* 🔒 khóa scroll nền */
  overscroll-behavior: none;
}



/* ===== BET TIMER (TOP LEFT) ===== */
.bet-timer{
  position: absolute;
  top: 6px;
  left: 10px;
  z-index: 2;

  font-size: 13px;
  font-weight: 900;
  color: #00ffb0;

  display: flex;
  align-items: center;
  gap: 4px;

  text-shadow: 0 0 12px rgba(0,255,180,.8);
}

/* đảm bảo rps-bet là relative */
.bet-sheet .rps-bet.pro{
  position: relative;
}

.bet-timer.danger{
  color:#ff4d4d;
  animation:pulse .8s infinite alternate;
}


/* ===== TIMER RING ===== */
.bet-timer.ring{
  position: absolute;
  top: 22px;
  left: 15px;
  z-index: 5;

  width: 44px;
  height: 44px;
}

.timer-ring{
  transform: rotate(-90deg);
}

.ring-bg{
  fill: none;
  stroke: rgba(255,255,255,.15);
  stroke-width: 4;
}

.ring-progress{
  fill: none;
  stroke: #00ffb0;
  stroke-width: 4;
  stroke-linecap: round;

  stroke-dasharray: 113; /* 2πr ≈ 113 */
  stroke-dashoffset: 0;

  transition: stroke-dashoffset .3s linear,
              stroke .3s linear;
}

.timer-text{
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 12px;
  font-weight: 900;
  color: #00ffb0;
  text-shadow: 0 0 10px rgba(0,255,180,.8);
}

/* WARNING */
.bet-timer.warn .ring-progress,
.bet-timer.warn .timer-text{
  color: #ffcc00;
  stroke: #ffcc00;
}

/* DANGER */
.bet-timer.danger .ring-progress,
.bet-timer.danger .timer-text{
  color: #ff4d4d;
  stroke: #ff4d4d;
}

.bet-timer.danger{
  animation: pulse .8s infinite alternate;
}

@keyframes pulse{
  from{ transform: scale(1); }
  to{ transform: scale(1.08); }
}


/* ===== HAND CONFIRMED (ĐÃ CHỐT) ===== */
.rps-hand.confirmed{
  outline: 3px solid #00ffb0;
  box-shadow:
    0 0 40px rgba(0,255,180,.9),
    inset 0 0 22px rgba(0,255,180,.35);

  transform: scale(1.08);
  filter: none;
}

/* các hand khác khi đã vào lệnh */
.rps-hand.locked-dim{
  opacity: .25;
  filter: grayscale(1);
  transform: scale(.95);
  box-shadow: none;
}



/* ===== RPS QUICK HISTORY ===== */
.rps-history{
  width:100%;
  max-width:100%;
  margin: 0;
  padding:8px 10px;
  border-radius:0;


  background:rgba(0,0,0,.55);
  border:1px solid rgba(0,255,180,.35);
  border-left:none;
  border-right: none;
  border-bottom: none;
  box-shadow:0 0 25px rgba(0,255,180,.25);
}

.rh-title{
  font-size:10px;
  font-weight:900;
  color:#00ffb0;
  margin-bottom:8px;
}

.rh-list{
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.rh-list::-webkit-scrollbar{
  height:4px;
}
.rh-list::-webkit-scrollbar-thumb{
  background:rgba(0,255,180,.5);
  border-radius:4px;
}

.rh-item{
  min-width:46px;
  height:46px;
  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  font-weight:900;

  background:rgba(255,255,255,.08);
  box-shadow:inset 0 0 14px rgba(0,0,0,.6);
}

.rh-win{
  color:#00ffb0;
  box-shadow:0 0 18px rgba(0,255,180,.6);
}
.rh-lose{
  color:#ff4d4d;
  box-shadow:0 0 18px rgba(255,80,80,.6);
}
.rh-draw{
  color:#ffc44d;
  box-shadow:0 0 18px rgba(255,200,80,.6);
}

.rh-empty{
  opacity:.6;
  font-size:13px;
}



</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="rps-header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="rps-title">Scissors • Rock • Paper</div>
  <div class="rps-wallet">
  💎 <span id="myCoins">0</span>
</div>

</header>

<!-- ===== STAGE ===== -->
<main class="rps-stage">

  <!-- STATUS -->
 <div class="rps-status">
  <div class="rps-round">
    Round <span id="rpsRoundId">#1</span> 
  
  </div>
  <div class="rps-msg" id="statusMsg">Chọn tay của bạn</div>
</div>

  

  <!-- HANDS -->
  <div class="rps-hands">
    <div class="rps-hand" data-hand="rock">✊</div>
    <div class="rps-hand" data-hand="paper">✋</div>
    <div class="rps-hand" data-hand="scissors">✌️</div>
  </div>






  <!-- RESULT -->
  <div class="rps-result" id="resultBox"></div>

<!-- 🧾 SERVER RESULT DETAIL -->
<div class="rps-result-overlay hidden" id="serverOverlay">

  <div class="rps-server-result" id="serverResult">


  <div class="sr-title">Kết quả từ hệ thống</div>

  <div class="sr-row">
    <span>Hệ thống ra:</span>
    <b id="srEnemy">---</b>
  </div>

  <div class="sr-row">
    <span>Kết quả:</span>
    <b id="srOutcome">---</b>
  </div>

  <div class="sr-row">
    <span>Thay đổi kim cương:</span>
    <b id="srCoin">0</b>
  </div>

  <button class="rps-btn" onclick="closeRpsResult()">
  OK
</button>


  </div>
</div>




<!-- 💎 BET BOTTOM SHEET -->
<div class="bet-sheet">


<!-- 📜 QUICK RPS HISTORY -->
<div class="rps-history" id="rpsHistory">
  <div class="rh-title">Lịch sử</div>
  <div class="rh-list" id="rpsHistoryList">
    <span class="rh-empty">Chưa có dữ liệu</span>
  </div>
</div>


  <div class="rps-bet pro">

<!-- ⏳ ROUND TIMER RING -->
<div class="bet-timer ring">
  <svg class="timer-ring" width="44" height="44">
    <circle
      class="ring-bg"
      cx="22" cy="22" r="18"
    />
    <circle
      class="ring-progress"
      cx="22" cy="22" r="18"
    />
  </svg>

  <div class="timer-text">
    <span id="rpsTimer">60</span>
  </div>
</div>


    <!-- INFO -->
    <div class="bet-info big">
      Vốn đầu tư
      <div class="bet-amount">
        <span id="betValue">0</span> 💎
      </div>
    </div>

    <!-- % BET -->
    <div class="bet-percent grid-3">
      <button class="bet-pct" data-pct="25">25%</button>
      <button class="bet-pct" data-pct="50">50%</button>
      <button class="bet-pct allin" data-pct="100">ALL IN</button>
    </div>

    <!-- QUICK BET -->
    <div class="bet-row grid-3">
      <button class="bet-btn" data-bet="10">10</button>
      <button class="bet-btn" data-bet="50">50</button>
      <button class="bet-btn" data-bet="100">100</button>
      <button class="bet-btn" data-bet="500">500</button>
      <button class="bet-btn" data-bet="1000">1K</button>
      <button class="bet-btn" data-bet="5000">5K</button>
    </div>

    <!-- RESET -->
    <div class="bet-row grid-3">
      <button class="bet-btn reset" id="resetBet">RESET</button>
    </div>

    <!-- ACTION -->
    <div class="rps-action">
      <button class="rps-btn" id="playBtn" disabled>
        Chốt lệnh
      </button>
    </div>

  </div>
</div>





 
</main>




<script src="/socket.io/socket.io.js"></script>
<script src="/game-rps.js"></script>

</body>
</html>
