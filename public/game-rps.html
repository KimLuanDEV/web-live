<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Scissors • Rock • Paper</title>
<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no">


<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>

<style>
/* ================= RPS GAME ================= */

html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family: system-ui, -apple-system, BlinkMacSystemFont;
}

body{
  background:
    radial-gradient(circle at top, rgba(0,255,180,.15), transparent 60%),
    url("/assets/bg/rps1.jpg") center / cover no-repeat fixed;
}

/* ===== HEADER (FIXED TOP) ===== */
.rps-header{
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;

  height: 56px;          /* ✅ CỐ ĐỊNH */
  padding: 0 16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:rgba(0,0,0,.65);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08);
}


.rps-title{
  font-size:18px;
  font-weight:800;
  letter-spacing:.5px;
}

.back-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.rps-stage{
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  align-items:center;

  padding-top: 56px;      /* = header */
  padding-left: 16px;
  padding-right: 16px;
  padding-bottom: 280px;  /* = bet sheet */

  box-shadow:none;        /* ❌ bỏ shadow gây ảo giác height */
}





/* ===== STATUS ===== */
.rps-status{
  text-align:center;
  margin-top:10px;
}

.rps-round{
  font-size:14px;
  opacity:.7;
}

.rps-msg{
  font-size:20px;
  font-weight:800;
  margin-top:6px;
  text-shadow:0 0 18px rgba(0,255,180,.6);
}



/* ===== RPS HANDS (NEON CARD STYLE) ===== */
.rps-hands{
  display:flex;
  justify-content:center;
  gap:18px;
  margin:32px 0 24px;
}

/* CARD */
.rps-hand{
  width:94px;
  height:112px;
  border-radius:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:44px;
  cursor:pointer;
  user-select:none;

  background:
    radial-gradient(circle at top,
      rgba(0,255,180,.28),
      rgba(0,0,0,.92) 70%);

  border:1px solid rgba(0,255,180,.45);

  box-shadow:
    0 14px 30px rgba(0,0,0,.85),
    inset 0 0 22px rgba(0,255,180,.18);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}

/* emoji glow */
.rps-hand::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:22px;
  box-shadow:inset 0 0 40px rgba(0,255,180,.35);
  opacity:.6;
  pointer-events:none;
}

/* HOVER */
.rps-hand:hover{
  transform:translateY(-6px) scale(1.06);
  box-shadow:
    0 0 36px rgba(0,255,180,.6),
    0 18px 40px rgba(0,0,0,.9);
}

/* SELECT (CHƯA CHỐT) */
.rps-hand.active{
  outline:2px solid #00ffb0;
  box-shadow:
    0 0 42px rgba(0,255,180,.85),
    inset 0 0 26px rgba(0,255,180,.35);
  transform:translateY(-4px) scale(1.08);
}





/* LOCKED */
.rps-hand.bet-locked{
  cursor:not-allowed;
}

/* pulse */
@keyframes handPulse{
  from{ box-shadow:0 0 40px rgba(0,255,180,.8); }
  to{ box-shadow:0 0 70px rgba(0,255,180,1); }
}






/* ===== RESULT ===== */
.rps-result{
  text-align:center;
  min-height:80px;
}

.rps-result .icon{
  font-size:48px;
}

.rps-result .text{
  font-size:22px;
  font-weight:800;
  margin-top:8px;
}

/* ===== ACTION ===== */
.rps-action{
  width:100%;
  max-width:none;   /* ✅ cho full ngang */
}


.rps-btn{
  width:100%;
  padding:14px;
  border-radius:16px;
  border:none;
  font-size:16px;
  font-weight:800;
  cursor:pointer;

  background:
    linear-gradient(180deg,#00ffb0,#00b97d);
  color:#001a12;

  box-shadow:
    0 0 25px rgba(0,255,180,.5),
    0 10px 25px rgba(0,0,0,.8);
}

.rps-btn:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}


.rps-bet{
  width:100%;
  max-width:360px;
  padding:14px;
  border-radius:18px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 25px rgba(0,255,180,.25);
}

.bet-label{
  font-weight:800;
  margin-bottom:10px;
}

.bet-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}



.bet-btn.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}


.bet-info{
  margin-top:8px;
  opacity:.85;
}



#rpsTimer{
  font-weight:900;
  color:#00ffb0;
  text-shadow:0 0 14px rgba(0,255,180,.7);
}

.rps-timer-warn{
  color:#ffb400 !important;
  text-shadow:0 0 16px rgba(255,180,0,.8);
}

.rps-timer-danger{
  color:#ff4d4d !important;
  text-shadow:0 0 18px rgba(255,80,80,.9);
  animation:pulse .8s infinite alternate;
}

@keyframes pulse{
  from{ transform:scale(1); }
  to{ transform:scale(1.15); }
}


.rps-wallet{
  font-weight:800;
  color:#00ffb0;
  text-shadow:0 0 12px rgba(0,255,180,.7);
}



.rps-server-result.hidden{
  display:none;
}



.sr-row{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
}

.sr-win{ color:#00ffb0; }
.sr-lose{ color:#ff4d4d; }
.sr-draw{ color:#ffc44d; }



.rps-result-overlay.hidden{
  display:none;
}

.rps-result-box{
  width:90%;
  max-width:360px;
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.9);
  box-shadow:0 0 40px rgba(0,255,180,.45);
}




/* ===== BET PANEL PRO ===== */
.rps-bet.pro{
  width:100%;
  max-width:380px;
  padding:18px;
  border-radius:22px;
  background:
    linear-gradient(180deg, rgba(0,255,180,.18), rgba(0,0,0,.75));
  border:1px solid rgba(0,255,180,.35);
  box-shadow:
    0 0 35px rgba(0,255,180,.35),
    inset 0 0 25px rgba(0,255,180,.12);
}

/* INFO */
.bet-info.big{
  text-align:center;
  margin-bottom:14px;
  font-weight:900;
  letter-spacing:.5px;
  color:#00ffb0;
}

.bet-amount{
  margin-top:6px;
  font-size:26px;
  color:#fff;
  text-shadow:0 0 18px rgba(0,255,180,.8);
}



/* % BET */
.bet-pct{
  padding:12px 0;
  border-radius:16px;
  border:1px solid rgba(0,255,180,.4);
  background:rgba(0,255,180,.15);
  color:#00ffb0;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.bet-pct:hover{
  box-shadow:0 0 18px rgba(0,255,180,.6);
}

.bet-pct.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}

.bet-pct.allin{
  color:#ffb400;
  border-color:#ffb400;
  background:rgba(255,180,0,.18);
}

/* QUICK BET */
.bet-btn{
  padding:10px 0;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.bet-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 0 16px rgba(0,255,180,.6);
}

.bet-btn.active{
  background:linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
}

/* ACTION */
.rps-action{
  margin-top:8px;
}

.rps-btn{
  width:100%;
  padding:16px;
  border-radius:18px;
  border:none;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  background:
    linear-gradient(180deg,#00ffb0,#00b97d);
  color:#002016;
  box-shadow:
    0 0 25px rgba(0,255,180,.6),
    0 12px 30px rgba(0,0,0,.8);
}

.rps-btn:disabled{
  opacity:.4;
  box-shadow:none;
  cursor:not-allowed;
}


/* ===== BET LOCK (KHÔNG ÁP DỤNG CHO ENEMY) ===== */
.bet-locked:not(.enemy){
  opacity:.4;
  pointer-events:none;
  filter: grayscale(1);
}




.bet-btn.reset:hover{
  box-shadow:
    0 0 26px rgba(255,180,0,.8),
    inset 0 0 14px rgba(255,180,0,.35);
}






/* ===== BET BAR FIXED BOTTOM (GIỐNG GAME WHEEL) ===== */
.bet-sheet{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 998;
  

  padding: 0 env(safe-area-inset-bottom);
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0),
    rgba(0,0,0,.9)
  );
}


.bet-sheet .rps-bet.pro{
  width: 100%;
  max-width: none;        /* ❗ bỏ bó chiều ngang */
  margin: 0;

   padding: 10px 12px 12px;   /* 🔽 gọn hơn */
  border-radius: 0;       /* ❗ phẳng như bet bar */

  border-left: none;
  border-right: none;
  border-bottom: none;
  background: rgba(20,20,20,.96);

  box-shadow:
    0 -10px 30px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.06);
}

.grid-3{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-bottom: 8px;
}


.bet-btn.reset{
  grid-column: 1 / -1;
  height: 38px;

  background: rgba(255,80,80,.15);
  color: #ff8080;

  border: none;
  border-radius: 12px;

  font-weight: 800;
}

.bet-sheet .rps-action{
  width:100%;
  margin-top: 6px;
}

.bet-sheet .rps-btn{
  width: 100%;
  height:46px;
  font-size:18px;
  letter-spacing:.5px;
  border-radius: 14px;
  display:block;

}



html, body{
  touch-action: manipulation;   /* chặn zoom gesture */
  height: 100%;
  overflow: hidden;           /* 🔒 khóa scroll nền */
  overscroll-behavior: none;
}



/* ===== BET TIMER (TOP LEFT) ===== */
.bet-timer{
  position: absolute;
  top: 6px;
  left: 10px;
  z-index: 2;

  font-size: 13px;
  font-weight: 900;
  color: #00ffb0;

  display: flex;
  align-items: center;
  gap: 4px;

  text-shadow: 0 0 12px rgba(0,255,180,.8);
}

/* đảm bảo rps-bet là relative */
.bet-sheet .rps-bet.pro{
  position: relative;
}

.bet-timer.danger{
  color:#ff4d4d;
  animation:pulse .8s infinite alternate;
}


/* ===== TIMER RING ===== */
.bet-timer.ring{
  position: absolute;
  top: 22px;
  left: 15px;
  z-index: 5;

  width: 44px;
  height: 44px;
}

.timer-ring{
  transform: rotate(-90deg);
}

.ring-bg{
  fill: none;
  stroke: rgba(255,255,255,.15);
  stroke-width: 4;
}

.ring-progress{
  fill: none;
  stroke: #00ffb0;
  stroke-width: 4;
  stroke-linecap: round;

  stroke-dasharray: 113; /* 2πr ≈ 113 */
  stroke-dashoffset: 0;

  transition: stroke-dashoffset .3s linear,
              stroke .3s linear;
}

.timer-text{
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 12px;
  font-weight: 900;
  color: #00ffb0;
  text-shadow: 0 0 10px rgba(0,255,180,.8);
}

/* WARNING */
.bet-timer.warn .ring-progress,
.bet-timer.warn .timer-text{
  color: #ffcc00;
  stroke: #ffcc00;
}

/* DANGER */
.bet-timer.danger .ring-progress,
.bet-timer.danger .timer-text{
  color: #ff4d4d;
  stroke: #ff4d4d;
}

.bet-timer.danger{
  animation: pulse .8s infinite alternate;
}

@keyframes pulse{
  from{ transform: scale(1); }
  to{ transform: scale(1.08); }
}


/* ===== HAND CONFIRMED (ĐÃ CHỐT) ===== */
.rps-hand.confirmed{
  outline: 3px solid #00ffb0;
  box-shadow:
    0 0 40px rgba(0,255,180,.9),
    inset 0 0 22px rgba(0,255,180,.35);

  transform: none;      
  filter: none;
}

/* ===== HAND KHÁC BỊ MỜ (KHÔNG ẢNH HƯỞNG CONFIRMED) ===== */
.rps-hand.locked-dim:not(.confirmed){
  opacity: .25;
  filter: grayscale(1);
  transform: scale(.95);
  box-shadow: none;
}

/* image mode */
.rps-hand.locked-dim:not(.confirmed) img{
  opacity: .25;
  filter: grayscale(1) blur(.5px);
}

/* đảm bảo hand đã chốt LUÔN SÁNG */
.rps-hand.confirmed{
  opacity: 1 !important;
  filter: none !important;
}

.rps-hand.confirmed img{
  opacity: 1 !important;
  filter: none !important;
}




/* ===== RPS QUICK HISTORY ===== */
.rps-history{
  width:100%;
  max-width:100%;
  margin: 0;
  padding:8px 10px;
  border-radius:0;


  background:rgba(0,0,0,.55);
  border:1px solid rgba(0,255,180,.35);
  border-left:none;
  border-right: none;
  border-bottom: none;
  box-shadow:0 0 25px rgba(0,255,180,.25);
}

.rh-title{
  font-size:10px;
  font-weight:900;
  color:#00ffb0;
  margin-bottom:8px;
}

.rh-list{
  display:flex;
  gap:5px;
  overflow-x:auto;
}

.rh-list::-webkit-scrollbar{
  height:4px;
}
.rh-list::-webkit-scrollbar-thumb{
  background:rgba(0,255,180,.5);
  border-radius:4px;
}

/* ===== RPS HISTORY IMAGE MODE ===== */
.rh-item{
  min-width:46px;
  height:46px;
  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 14px rgba(0,0,0,.6);

  overflow:hidden;
}

.rh-item img{
  width:78%;
  height:78%;
  object-fit:contain;

  filter:
    drop-shadow(0 0 8px rgba(0,255,180,.6))
    drop-shadow(0 0 16px rgba(0,255,180,.35));
}

/* trạng thái kết quả */
.rh-win img{
  filter:
    drop-shadow(0 0 10px rgba(0,255,180,.9))
    drop-shadow(0 0 24px rgba(0,255,180,.8));
}

.rh-lose img{
  filter:
    drop-shadow(0 0 10px rgba(255,80,80,.9))
    drop-shadow(0 0 24px rgba(255,80,80,.8));
}

.rh-draw img{
  filter:
    drop-shadow(0 0 10px rgba(255,200,80,.9))
    drop-shadow(0 0 24px rgba(255,200,80,.8));
}


.rh-empty{
  opacity:.6;
  font-size:13px;
}



/* ===== RPS HAND IMAGE MODE ===== */
.rps-hand.img{
  padding: 14px;
}

.rps-hand.img img{
  width: 100%;
  height: 100%;
  object-fit: contain;

  filter:
    drop-shadow(0 0 12px rgba(0,255,180,.6))
    drop-shadow(0 0 28px rgba(0,255,180,.35));

  transition: transform .2s ease, filter .2s ease;
}

/* hover */
.rps-hand.img:hover img{
  transform: scale(1.08);
  filter:
    drop-shadow(0 0 18px rgba(0,255,180,.9))
    drop-shadow(0 0 40px rgba(0,255,180,.6));
}

/* active (chọn tay) */
.rps-hand.active img{
  transform: scale(1.12);
  filter:
    drop-shadow(0 0 26px rgba(0,255,180,1))
    drop-shadow(0 0 60px rgba(0,255,180,.9));
}

/* confirmed (đã chốt lệnh) */
.rps-hand.confirmed img{
  animation: rpsGlow 1s ease-in-out infinite alternate;
}

@keyframes rpsGlow{
  from{
    filter:
      drop-shadow(0 0 25px rgba(0,255,180,.9))
      drop-shadow(0 0 50px rgba(0,255,180,.6));
  }
  to{
    filter:
      drop-shadow(0 0 40px rgba(0,255,180,1))
      drop-shadow(0 0 80px rgba(0,255,180,1));
  }
}



.rps-hand.win img{ filter: drop-shadow(0 0 40px #00ffb0); }
.rps-hand.lose img{ filter: drop-shadow(0 0 40px #ff4d4d); }





/* hand không chọn → ẩn dần */
.rps-hand.hide-hand{
  opacity:0;
  transform:scale(.6);
  pointer-events:none;
}

/* animation mượt */
.rps-hand{
  transition: opacity .35s ease;
}



/* 🎯 VỊ TRÍ ĐÍCH CỐ ĐỊNH CHO HAND */
#rpsHandTarget{
  position: fixed;
  left: 18%;
  top: 27%;

  width: 94px;     /* = width rps-hand */
  height: 112px;   /* = height rps-hand */


  pointer-events: none;
  z-index: 5;
}


/* hand bay tới target */
.rps-hand.to-target{
  position: fixed;
  z-index: 999;

  transition:
    left .55s cubic-bezier(.4,0,.2,1),
    top  .55s cubic-bezier(.4,0,.2,1),
    transform .55s cubic-bezier(.4,0,.2,1);
}





/* ===== ENEMY HAND ===== */
.rps-hand.enemy{
  position: fixed;
  right: 18%;      /* đối diện hand player */
  top: 27%;
  z-index: 2;
  pointer-events: none;
}

/* ẩn ban đầu */
.rps-hand.enemy.hidden{
  opacity: 0;
  transform: scale(.6);
}

/* hiện khi vào lệnh */
.rps-hand.enemy.show{
  opacity: 1;
  transform: scale(1);
  transition: .35s ease;
}

/* hiệu ứng lật */
.rps-hand.enemy.flip img{
  animation: enemyFlip .6s ease forwards;
}

@keyframes enemyFlip{
  0%{
    transform: rotateY(0deg);
  }
  49%{
    transform: rotateY(90deg);
  }
  50%{
    transform: rotateY(-90deg);
  }
  100%{
    transform: rotateY(0deg);
  }
}



/* ===== RESULT BOTTOM SHEET ===== */
.rps-result-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.7);
  backdrop-filter: blur(8px);

  display:flex;
  align-items:flex-end;
}

/* SHEET */
.rps-result-sheet{
  width:100%;
  max-width:none;              /* ✅ FULL WIDTH */
  border-radius:24px 24px 0 0;
  display: flex;
  flex-direction: column;
  align-items: center;   /* ✅ FIX LỆCH */

  background:
    linear-gradient(
      180deg,
      rgba(0,255,180,.22),
      rgba(0,0,0,.95) 40%
    );

  box-shadow:
    0 -25px 50px rgba(0,0,0,.9),
    0 0 45px rgba(0,255,180,.45);

  padding:14px 18px 22px;
  animation: sheetUp .35s cubic-bezier(.2,.8,.2,1);
}


/* HERO */
.sr-hero{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}


/* ENEMY HAND */
.sr-enemy img{
  width:72px;
  height:72px;
  object-fit:contain;

  filter:
    drop-shadow(0 0 16px rgba(0,255,180,.8))
    drop-shadow(0 0 40px rgba(0,255,180,.6));
}

/* OUTCOME */
.sr-outcome{
  font-size:32px;
  font-weight:1000;
  letter-spacing:2px;
  margin-top:4px;
}

.sr-win{ color:#00ffb0; text-shadow:0 0 25px rgba(0,255,180,1); }
.sr-lose{ color:#ff4d4d; text-shadow:0 0 25px rgba(255,80,80,1); }
.sr-draw{ color:#ffc44d; text-shadow:0 0 25px rgba(255,200,80,1); }

/* INFO */
.sr-info{
  background:rgba(255,255,255,.05);
  border-radius:16px;
  padding:12px;
  margin-bottom:14px;
}

.sr-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:16px;
  font-weight:900;
}

/* COIN */
#srCoin{
  font-size:20px;
}

/* BUTTON */
.sr-ok{
  height:52px;
  font-size:18px;
  font-weight:1000;
  letter-spacing:1px;
}

.rps-result-overlay.hidden{
  display: none;
}



/* HANDLE */
.sheet-handle{
  width: 46px;
  height: 5px;
  border-radius: 999px;
  margin: 4px auto 10px;

  background: rgba(255,255,255,.35);
}

/* CONTENT */
.rps-server-result{
  width: 100%;
  max-width: 520px;   /* ✅ tablet đẹp, mobile full */
  margin: 0 auto;     /* ✅ CENTER */

  padding: 14px;
  border-radius: 18px;

  background: rgba(0,0,0,.55);
  border: 1px solid rgba(0,255,180,.35);

  box-shadow:
    inset 0 0 18px rgba(0,255,180,.15),
    0 0 24px rgba(0,255,180,.25);

  font-size: 15px;
}


/* TITLE */
.sr-title{
  text-align: center;

/* ===== BATTLE COLLISION ===== */
@keyframes collideCenter {
  0%   { transform: translate(0,0) scale(1); }
  60%  { transform: translate(40px,0) scale(1.15); }
  100% { transform: translate(0,0) scale(1); }
}

@keyframes collideCenterEnemy {
  0%   { transform: translate(0,0) scale(1); }
  60%  { transform: translate(-40px,0) scale(1.15); }
  100% { transform: translate(0,0) scale(1); }
}

.rps-hand.collide-player{
  animation: collideCenter .45s ease forwards;
  z-index:1000;
}

.rps-hand.collide-enemy{
  animation: collideCenterEnemy .45s ease forwards;
  z-index:1000;
}

/* ===== FIRE DESTROY (REAL BURN) ===== */

@keyframes burnImg {
  0%{
    opacity:1;
    transform:scale(1);
    filter:
      drop-shadow(0 0 20px #ff4d00)
      drop-shadow(0 0 40px #ff0000);
  }

  40%{
    transform:scale(1.15) rotate(-8deg);
    filter:
      brightness(2)
      saturate(2)
      drop-shadow(0 0 40px #ff0000)
      drop-shadow(0 0 80px #ff5500);
  }

  70%{
    transform:scale(.9) rotate(12deg);
    filter:
      brightness(3)
      saturate(3)
      drop-shadow(0 0 60px #ff0000);
  }

  100%{
    opacity:0;
    transform:scale(.5) rotate(25deg);
    filter:blur(6px);
  }
}

.rps-hand.burn img{
  animation: burnImg 1s ease forwards;
}


.rps-hand.burn::before{
  content:"";
  position:absolute;
  inset:-20px;
  border-radius:50%;
  background:
    radial-gradient(circle,
      rgba(255,120,0,.8),
      rgba(255,0,0,.6),
      transparent 70%);
  animation: fireFlash .6s ease forwards;
}

@keyframes fireFlash{
  from{ opacity:1; transform:scale(.5); }
  to{ opacity:0; transform:scale(1.5); }
}



.rps-vs.hidden{
  opacity:0;
  transform:translate(-50%,-50%) scale(.6);
  transition:.25s ease;
}
