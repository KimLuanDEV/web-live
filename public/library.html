<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📚 Thư viện</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">



<style>

    .page-library{
  background:#0e0e12;
  color:#fff;
  min-height:100vh;
}

.simple-header{
  height:52px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
  background:#111;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.simple-header .title{
  font-weight:700;
  font-size:16px;
}

.back-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.library-container{
  padding:20px;
}

.library-empty{
  margin-top:60px;
  text-align:center;
  opacity:.85;
}

.library-empty .icon{
  font-size:48px;
  margin-bottom:12px;
}



.library-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD */
.lib-card{
  position:relative;
  background:#15151c;
  border-radius:16px;
  padding:16px 14px;
  min-height:110px;

  display:flex;
  flex-direction:column;
  justify-content:center;

  border:1px solid rgba(255,255,255,.06);
  transition:.2s;
}

/* ACTIVE */
.lib-card.active{
  cursor:pointer;
}
.lib-card.active:active{
  transform:scale(.97);
}

/* LOCKED */
.lib-card.locked{
  opacity:.55;
  filter:grayscale(1);
}

/* ICON */
.lib-icon{
  font-size:28px;
  margin-bottom:8px;
}

/* TEXT */
.lib-title{
  font-weight:800;
  font-size:15px;
}
.lib-desc{
  font-size:12px;
  opacity:.75;
  margin-top:2px;
}





</style>


</head>
<body class="page-library">

<script src="/guard.js"></script>

<header class="simple-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">📚 Thư viện</div>
</header>

<main class="library-container">




<div class="library-grid">

  <!-- Đọc truyện -->
<div class="lib-card active" onclick="location.href='/stories.html'">
  <div class="lib-icon">📖</div>
  <div class="lib-title">Đọc truyện</div>
  <div class="lib-desc">Ngôn tình · Truyện ngắn · Tiểu thuyết</div>
</div>


<!-- 🍳 NẤU ĂN -->
<div class="lib-card active" onclick="location.href='/cooking.html'">
  <div class="lib-icon">🍳</div>
  <div class="lib-title">Nấu ăn</div>
  <div class="lib-desc">Công thức · Mẹo bếp · Sắp ra mắt</div>
</div>


<!-- 🎓 GIÁO DỤC -->
<div class="lib-card active" onclick="location.href='/education.html'">
  <div class="lib-icon">🎓</div>
  <div class="lib-title">Giáo dục</div>
  <div class="lib-desc">Kiến thức · Lộ trình · Học tập</div>
</div>


<!-- 🎮 TRÒ CHƠI -->
<div class="lib-card active" onclick="location.href='/game.html'">
  <div class="lib-icon">🎮</div>
  <div class="lib-title">Trò chơi</div>
  <div class="lib-desc">Mini game · Giải trí · Sắp phát triển</div>
</div>


<!-- ⚖️ LUẬT PHÁP -->
<div class="lib-card active" onclick="location.href='/law.html'">
  <div class="lib-icon">⚖️</div>
  <div class="lib-title">Luật pháp</div>
  <div class="lib-desc">Quy định · Kiến thức · Pháp lý</div>
</div>


</div>
























</main>

</body>
</html>
