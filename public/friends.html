<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bạn bè - Livestream Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">

<style>
body{
  background:#000;
  color:#fff;
  margin:0;
  font-family:system-ui;
}

.friend-header{
  position: sticky;
  top: 0;
  left: 0;
  right: 0;

  width: 100vw;
  margin-left: calc(50% - 50vw);

  height: 52px;
  display:flex;
  align-items:center;

  padding: 0 12px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index: 100;
}


.friend-header h3{
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  margin:0;
  font-size:16px;
  font-weight:600;
  pointer-events:none; /* tránh che nút */
}


.friend-header button{
  width: 40px;
  height: 40px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  z-index: 2;
}

.friend-section{
  padding:10px 14px 90px; /* 👈 thêm padding-bottom */
}


.friend-title{
  font-size:13px;
  opacity:.7;
  margin:12px 0 6px;
}

.friend-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-radius:10px;
  background:#111;
  margin-bottom:8px;
}

.friend-row img{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
}

.friend-info{
  flex:1;
}

.friend-name{
  font-weight:600;
}

.friend-level{
  font-size:12px;
  opacity:.6;
}

.friend-actions{
  display:flex;
  gap:6px;
}

.friend-actions button{
  padding:6px 10px;
  font-size:12px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.2);
  background:#111;
  color:#fff;
}
.btn-accept{ border-color:#00ff99; color:#00ff99; }
.btn-reject{ border-color:#ff6666; color:#ff6666; }
.btn-chat{ border-color:#00c8ff; color:#00c8ff; }

/* 🔍 Search button bên phải */
.btn-search{
  position: absolute;
  right: 12px;
  top: 6px;

  width: 40px;
  height: 40px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:none;
  border:none;
  color:#fff;
  font-size:18px;
  z-index: 2;
}

/* 🔎 Search box */
.friend-search{
  position: sticky;
  top: 52px; /* ngay dưới header */
  z-index: 90;

  padding: 8px 12px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.08);

  display:none;
}

.friend-search input{
  width:100%;
  padding:10px 12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:#111;
  color:#fff;
  font-size:14px;
}


/* 🚫 Blocked button fixed bottom */
.btn-blocked-fixed{
  position: fixed;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);

  width: calc(100% - 32px);
  max-width: 420px;

  padding: 14px 16px;
  border-radius: 14px;

  background: linear-gradient(135deg, #ff4d4d, #ff0066);
  color: #fff;
  font-size: 15px;
  font-weight: 600;

  border: none;
  box-shadow: 0 8px 24px rgba(255,0,80,.35);

  z-index: 200;
}



</style>
</head>

<body>

<div class="friend-header">
  <button onclick="history.back()">←</button>
  <h3>Bạn bè</h3>

  <!-- 🔍 Search button (right) -->
  <button class="btn-search" onclick="toggleSearch()">🔍</button>
</div>


<div class="friend-search" id="friendSearch">
  <input
    id="friendSearchInput"
    placeholder="Tìm theo tên bạn bè..."
    oninput="applySearch()"
    autocomplete="off"
  >
</div>



<div class="friend-section">
  <div class="friend-title">📨 Lời mời kết bạn</div>
  <div id="reqList"></div>

  <div class="friend-title">👥 Danh sách bạn bè</div>
  <div id="friendList"></div>
</div>

<button class="btn-blocked-fixed" onclick="location.href='/blocked.html'">
  🚫 Danh sách chặn
</button>




<div id="toast-container"></div>

<script src="/push-init.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/app-entry-guard.js"></script>
<script>

const socket = io();
const profile = JSON.parse(localStorage.getItem("user_profile") || "{}");

let __searchOpen = false;
let __lastData = null;


if(!profile.uid){
  location.href = "/login.html";
}

// 🔑 BẮT BUỘC: auth-login để server biết uid
socket.emit("auth-login", { uid: profile.uid });


fetch("/api/friends/" + profile.uid)
  .then(r=>r.json())
  .then(renderFriends);

function renderFriends(data){
  const reqBox = document.getElementById("reqList");
  const frBox  = document.getElementById("friendList");

  reqBox.innerHTML = "";
  frBox.innerHTML  = "";

  // Requests
  if(!data.requests.length){
    reqBox.innerHTML = `<div style="opacity:.5">Không có lời mời</div>`;
  }

  data.requests.forEach(u=>{
    reqBox.innerHTML += `

      <div class="friend-row">
        <img src="${u.avatar}">

        <div class="friend-info">
          <div class="friend-name">${u.name}</div>
          <div class="friend-level">Lv ${u.level}</div>
        </div>

        <div class="friend-actions">
          <button class="btn-accept"
            onclick="respond('${u.uid}',true)">✓</button>
          <button class="btn-reject"
            onclick="respond('${u.uid}',false)">✕</button>
        </div>

      </div>
    `;
  });

  // Friends
  if(!data.friends.length){
    frBox.innerHTML = `<div style="opacity:.5">Chưa có bạn bè</div>`;
  }

  data.friends.forEach(u=>{
    frBox.innerHTML += `

    <div class="friend-row">
  <img src="${u.avatar}"
       onclick="openProfile('${u.uid}')"
       style="cursor:pointer">

  <div class="friend-info"
       onclick="openProfile('${u.uid}')"
       style="cursor:pointer">
    <div class="friend-name">
      ${u.name}
      ${u.verified ? `<span class="tick-blue">✔</span>` : ``}
    </div>
    <div class="friend-level">Lv ${u.level}</div>
  </div>


       <div class="friend-actions">
  <button class="btn-chat"
    onclick="chat('${u.uid}','${u.name}')">💬</button>

  <button class="btn-reject"
    onclick="removeFriend('${u.uid}','${u.name}')">
    🗑
  </button>

  <button class="btn-reject"
  onclick="blockUser('${u.uid}','${u.name}')">
  🚫
  </button>

</div>


      </div>
    `;
  });
}

function respond(uid, accept){
  socket.emit("friend-respond", { from: uid, accept });

  setTimeout(()=>{
    fetch("/api/friends/" + profile.uid)
      .then(r=>r.json())
      .then(renderFriends);
  }, 200);
}


function chat(uid, name){
  localStorage.setItem("chat_to_uid", uid);
  localStorage.setItem("chat_to_name", name);
  location.href = "/messages.html";
}


function removeFriend(uid, name){
  const ok = confirm(`Bạn có chắc muốn huỷ kết bạn với ${name}?`);
  if(!ok) return;

  socket.emit("friend-remove", { uid });

  setTimeout(()=>{
    fetch("/api/friends/" + profile.uid)
      .then(r=>r.json())
      .then(renderFriends);
  }, 200);
}


function blockUser(uid, name){
  const ok = confirm(`Bạn có chắc muốn chặn ${name}? Người này sẽ không thể liên hệ với bạn.`);
  if(!ok) return;

  socket.emit("user-block", { uid });

  setTimeout(()=>{
    fetch("/api/friends/" + profile.uid)
      .then(r=>r.json())
      .then(renderFriends);
  }, 200);
}





// override renderFriends để giữ data gốc
const _renderFriends = renderFriends;
renderFriends = function(data){
  __lastData = data;
  _renderFriends(data);
};

function toggleSearch(){
  __searchOpen = !__searchOpen;
  const box = document.getElementById("friendSearch");
  const input = document.getElementById("friendSearchInput");

  box.style.display = __searchOpen ? "block" : "none";

  if(__searchOpen){
    setTimeout(()=> input.focus(), 50);
  }else{
    input.value = "";
    if(__lastData) _renderFriends(__lastData);
  }
}

function applySearch(){
  if(!__lastData) return;

  const q = document.getElementById("friendSearchInput")
    .value
    .toLowerCase()
    .trim();

  if(!q){
    _renderFriends(__lastData);
    return;
  }

  const filtered = {
    requests: __lastData.requests.filter(u =>
      u.name.toLowerCase().includes(q)
    ),
    friends: __lastData.friends.filter(u =>
      u.name.toLowerCase().includes(q)
    )
  };

  _renderFriends(filtered);
}


function openProfile(uid){
  location.href = "/profile.html?uid=" + encodeURIComponent(uid);
}


socket.on("system-notify", data => {
  if (!data) return;

  // 💰 NẠP COIN
  if (data.type === "topup") {
    showToast(data.text || "💰 Bạn vừa được nạp coin", "success");
    return;
  }

   // ➖ TRỪ COIN
  if (data.type === "withdraw") {
     notifyWithdraw(data);
  }

  // 🚫 KHOÁ TÀI KHOẢN
  if (data.type === "lock") {
    showToast(
      data.reason || "🚫 Tài khoản của bạn đã bị khoá",
      "error"
    );

    localStorage.removeItem("user_profile");
    localStorage.removeItem("login_uid");
    localStorage.removeItem("isGuest");

    setTimeout(() => {
      location.href = "/login.html";
    }, 2000);
  }
});



function showToast(text, type = "info", timeout = 3500){
  const box = document.getElementById("toast-container");
  if(!box) return;

  const icons = {
    info:"ℹ️",
    success:"✅",
    error:"❌",
    warn:"⚠️"
  };

  const div = document.createElement("div");
  div.className = `toast ${type}`;
  div.innerHTML = `
    <span class="icon">${icons[type] || "🔔"}</span>
    <span class="msg">${text}</span>
  `;

  box.appendChild(div);

  setTimeout(()=>div.remove(), timeout);
}



function showWithdrawNotify(data){
  const text =
    data.text ||
    "Tài khoản của bạn vừa bị trừ coin";

  openSysModal(text);
}


function notifyWithdraw(data){
  const text =
    data?.text ||
    "➖ Tài khoản của bạn vừa bị trừ coin";

  // ưu tiên modal nếu tồn tại
  if (typeof openSysModal === "function") {
    openSysModal(text);
    return;
  }

  // fallback toast
  if (typeof showToast === "function") {
    showToast(text, "error", 5000);
    return;
  }

  // fallback cuối cùng
  alert(text);
}






</script>
</body>
</html>
