<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>💎 Nạp coin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <style>
    .topup-page {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .topup-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .topup-header h2 {
      margin: 0;
    }

    .coin-pack {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: .15s;
    }

    .coin-pack:hover {
      background: #f7f9ff;
      transform: translateY(-1px);
    }

    .coin-pack b {
      font-size: 18px;
    }

    .coin-pack span {
      opacity: .7;
      font-size: 14px;
    }

    .qr-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #fafafa;
      text-align: center;
    }

    .qr-box img {
      max-width: 220px;
      margin: 12px auto;
      display: block;
    }

    .bank-info {
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-copy {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #4f6df5;
      color: #fff;
      cursor: pointer;
    }

    .btn-back {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ddd;
      cursor: pointer;
    }


    .agent-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.agent-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #eee;
  cursor: pointer;
  transition: .15s;
}

.agent-card:hover {
  background: #f7f9ff;
  transform: translateY(-1px);
}

.agent-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
}

.agent-info {
  flex: 1;
}

.agent-name {
  font-weight: 600;
}

.agent-bank {
  font-size: 13px;
  opacity: .7;
}

.agent-status {
  font-size: 12px;
  color: #28a745;
}

.agent-status.offline {
  color: #aaa;
}

.topup-header {
  position: sticky;
  top: 0;
  z-index: 10;

  width: 100vw;
  margin-left: calc(-50vw + 50%);
  padding: 12px 14px;

  display: flex;
  align-items: center;
  gap: 12px;

  background: linear-gradient(135deg, #4f6df5, #7b8cff);
  color: #fff;

  box-shadow: 0 6px 18px rgba(0,0,0,.18);
}

/* nút back */
.topup-header .btn-back {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.2);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* khối giữa */
.header-center {
  flex: 1;
  text-align: center;
  line-height: 1.2;
}

.header-center h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

#myCoin {
  font-size: 13px;
  opacity: .9;
}

.topup-header {
  position: sticky;
  top: 0;
  z-index: 20;

  width: 100vw;
  margin-left: calc(-50vw + 50%);
  padding: 10px 14px;

  display: flex;
  align-items: center;
  gap: 12px;

  backdrop-filter: blur(16px);
  background: rgba(18,18,18,.75);
  border-bottom: 1px solid rgba(255,255,255,.08);
}


.topup-header .btn-back {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.08);
  color: #0a84ff; /* xanh iOS */
  font-size: 26px;
  cursor: pointer;
}



.header-center h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  color: #fff;
}

#myCoin {
  font-size: 13px;
  color: #aaa;
}


.topup-page {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}



.agent-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 14px;

  border-radius: 16px;
  background: #111;
  border: 1px solid rgba(255,255,255,.08);

  cursor: pointer;
  transition: .2s;
}

.agent-card:hover {
  background: #161616;
  transform: translateY(-2px);
}

.agent-name { color: #fff; }
.agent-bank { color: #888; }
.agent-status { color: #34c759; } /* iOS green */
.agent-status.offline { color: #666; }



.qr-box {
  background: #111;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.08);
  color: #eee;
}


html, body {
  background: #000;
  color: #fff;
}


/* overlay nền mờ */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
  z-index: 50;
}

/* bottom sheet */
.bottom-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;

  background: #111;
  color: #fff;

  border-radius: 22px 22px 0 0;
  padding: 12px 16px 24px;

  transform: translateY(110%);
  transition: .35s cubic-bezier(.2,.8,.2,1);
}

/* khi mở */
.bottom-sheet.show {
  transform: translateY(0);
}

/* thanh kéo */
.sheet-handle {
  width: 36px;
  height: 5px;
  background: #444;
  border-radius: 3px;
  margin: 6px auto 12px;
}

.bottom-sheet h3 {
  margin: 6px 0 12px;
  text-align: center;
}

.bottom-sheet img {
  width: 220px;
  margin: 0 auto 12px;
  display: block;
  border-radius: 12px;
  background: #fff;
}

/* spacer cân đối bên phải */
.header-spacer {
  width: 40px;
  height: 40px;
}

.topup-header .btn-back {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}


.btn-back svg {
  display: block;
}


.topup-header .btn-back {
  margin: 0 !important;
  padding: 0 !important;

  width: 40px;
  height: 40px;

  display: flex;
  align-items: center;
  justify-content: center;
}


.topup-header .btn-back:active {
  transform: scale(0.92);
  background: rgba(255,255,255,.14);
}


#myCoin b {
  color: #fff;
  font-weight: 600;
}

#myCoin {
  letter-spacing: .2px;
}


.section-header {
  margin: 8px 0 12px;
}

.section-header span {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
}

.section-header small {
  display: block;
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}


.section-header {
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

/* ===== OPTION NẠP ===== */
.topup-option {
  background: #111;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.08);
  overflow: hidden;
}

/* header option */
.option-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
}

.option-left {
  display: flex;
  flex-direction: column;
}

.option-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
}

.option-desc {
  font-size: 12px;
  color: #888;
  margin-top: 2px;
}

.option-arrow {
  font-size: 22px;
  color: #666;
  transition: .25s;
}

/* khi mở */
.topup-option.open .option-arrow {
  transform: rotate(90deg);
}

/* nội dung */
.option-content {
  padding: 8px 12px 12px;
  border-top: 1px solid rgba(255,255,255,.06);
}


.card-coming {
  padding: 16px;
  text-align: center;
  font-size: 14px;
  color: #aaa;
  background: rgba(255,255,255,.03);
  border-radius: 12px;
}

.card-coming small {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  color: #666;
}


.option-logos {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 6px;
}

.option-logos img {
  height: 18px;
  width: auto;
  opacity: .85;
  filter: brightness(1.1);
}


.option-logos img {
  height: 16px;
  opacity: .75;
}


.card-sheet-content {
  text-align: center;
}

.card-logos {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px 0 16px;
}

.card-logos img {
  height: 26px;
  opacity: .85;
}



  </style>
</head>

<body>
<script src="/guard.js"></script>


<div class="topup-header">

  <button class="btn-back" onclick="history.back()" aria-label="Back">
  <svg viewBox="0 0 24 24" width="20" height="20">
    <path
      d="M15 18l-6-6 6-6"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>


  <div class="header-center">
  <h2>Purchase</h2>
  <div id="myCoin">
  Số dư khả dụng · <b>12,500</b> 💎
</div>

</div>
  <div class="header-spacer"></div>
</div>



<div class="topup-page">

  <!-- 🔘 PHƯƠNG THỨC NẠP -->
  <div class="topup-option" id="agentOption">

    <div class="option-header">
      <div class="option-left">
        <div class="option-title">🧑‍💼 Nạp qua đại lý</div>
        <div class="option-desc">Chuyển khoản · QR · An toàn</div>
      </div>
      <div class="option-arrow">›</div>
    </div>

    <!-- 📋 DANH SÁCH ĐẠI LÝ (ẨN BAN ĐẦU) -->
    <div class="option-content hidden">
      <div id="agentList" class="agent-list"></div>
    </div>

  </div>


  <!-- 💳 PHƯƠNG THỨC: NẠP QUA THẺ -->
<div class="topup-option" id="cardOption">

  <div class="option-header">
  <div class="option-left">
    <div class="option-title">💳 Nạp qua thẻ</div>
    <div class="option-desc">ATM · Visa · Mastercard</div>
  </div>

  <!-- LOGO THẺ -->
  <div class="option-logos">
    <img src="/images/payments/atm.png" alt="ATM">
    <img src="/images/payments/visa.png" alt="Visa">
    <img src="/images/payments/mastercard.png" alt="Mastercard">
  </div>

  <div class="option-arrow">›</div>
</div>


  <!-- 📋 NỘI DUNG (ẨN / SẮP MỞ) -->
  <div class="option-content hidden">
    <div class="card-coming">
      🚧 Tính năng đang được phát triển<br>
      <small>Vui lòng sử dụng nạp qua đại lý</small>
    </div>
  </div>

</div>




</div>





<div id="toast-container"></div>




<!-- 🌑 OVERLAY -->
<div id="sheetOverlay" class="sheet-overlay hidden"></div>

<!-- 📲 BOTTOM SHEET QR -->
<div id="qrSheet" class="bottom-sheet">
  <div class="sheet-handle"></div>

  <h3>📲 Nạp coin</h3>

  <img id="sheetQr" src="" alt="QR nạp coin">

  <div id="sheetBankInfo" class="bank-info"></div>

  <button class="btn-copy" onclick="copyTransfer()">📋 Copy nội dung CK</button>
</div>

<!-- 💳 BOTTOM SHEET NẠP QUA THẺ -->
<div id="cardSheet" class="bottom-sheet">
  <div class="sheet-handle"></div>

  <h3>💳 Nạp qua thẻ</h3>

  <div class="card-sheet-content">
    <div class="card-logos">
      <img src="/images/payments/atm.png">
      <img src="/images/payments/visa.png">
      <img src="/images/payments/mastercard.png">
    </div>

    <div class="card-coming">
      🚧 Tính năng đang được phát triển<br>
      <small>Hiện tại vui lòng sử dụng nạp qua đại lý</small>
    </div>
  </div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script src="/topup.js"></script>
</body>
</html>
