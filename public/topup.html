<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>💎 Nạp coin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <style>
    .topup-page {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .topup-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .topup-header h2 {
      margin: 0;
    }

    .coin-pack {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: .15s;
    }

    .coin-pack:hover {
      background: #f7f9ff;
      transform: translateY(-1px);
    }

    .coin-pack b {
      font-size: 18px;
    }

    .coin-pack span {
      opacity: .7;
      font-size: 14px;
    }

    .qr-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #fafafa;
      text-align: center;
    }

    .qr-box img {
      max-width: 220px;
      margin: 12px auto;
      display: block;
    }

    .bank-info {
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-copy {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #4f6df5;
      color: #fff;
      cursor: pointer;
    }

    .btn-back {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ddd;
      cursor: pointer;
    }


    .agent-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.agent-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #eee;
  cursor: pointer;
  transition: .15s;
}

.agent-card:hover {
  background: #f7f9ff;
  transform: translateY(-1px);
}

.agent-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
}

.agent-info {
  flex: 1;
}

.agent-name {
  font-weight: 600;
}

.agent-bank {
  font-size: 13px;
  opacity: .7;
}

.agent-status {
  font-size: 12px;
  color: #28a745;
}

.agent-status.offline {
  color: #aaa;
}

.topup-header {
  position: sticky;
  top: 0;
  z-index: 10;

  width: 100vw;
  margin-left: calc(-50vw + 50%);
  padding: 12px 14px;

  display: flex;
  align-items: center;
  gap: 12px;

  background: linear-gradient(135deg, #4f6df5, #7b8cff);
  color: #fff;

  box-shadow: 0 6px 18px rgba(0,0,0,.18);
}

/* nút back */
.topup-header .btn-back {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.2);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* khối giữa */
.header-center {
  flex: 1;
  text-align: center;
  line-height: 1.2;
}

.header-center h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 700;
}

#myCoin {
  font-size: 13px;
  opacity: .9;
}

.topup-header {
  position: sticky;
  top: 0;
  z-index: 20;

  width: 100vw;
  margin-left: calc(-50vw + 50%);
  padding: 10px 14px;

  display: flex;
  align-items: center;
  gap: 12px;

  backdrop-filter: blur(16px);
  background: rgba(18,18,18,.75);
  border-bottom: 1px solid rgba(255,255,255,.08);
}


.topup-header .btn-back {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.08);
  color: #0a84ff; /* xanh iOS */
  font-size: 26px;
  cursor: pointer;
}



.header-center h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  color: #fff;
}

#myCoin {
  font-size: 13px;
  color: #aaa;
}


.topup-page {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}



.agent-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 14px;

  border-radius: 16px;
  background: #111;
  border: 1px solid rgba(255,255,255,.08);

  cursor: pointer;
  transition: .2s;
}

.agent-card:hover {
  background: #161616;
  transform: translateY(-2px);
}

.agent-name { color: #fff; }
.agent-bank { color: #888; }
.agent-status { color: #34c759; } /* iOS green */
.agent-status.offline { color: #666; }



.qr-box {
  background: #111;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.08);
  color: #eee;
}


html, body {
  background: #000;
  color: #fff;
}


  </style>
</head>

<body>
<script src="/guard.js"></script>


 <div class="topup-header">
  <button class="btn-back" onclick="history.back()">‹</button>

  <div class="header-center">
    <h2>💎 Nạp coin</h2>
    <div id="myCoin">Đang tải coin...</div>
  </div>
</div>

<div class="topup-page">
 <!-- 🧑‍💼 DANH SÁCH ĐẠI LÝ NẠP COIN -->
<div id="agentList" class="agent-list"></div>

<!-- QR / BANK -->
<div class="qr-box hidden" id="qrBox">
  <h3>📲 Nạp coin qua đại lý</h3>

  <img id="agentQr" src="" alt="QR đại lý">

  <div class="bank-info" id="bankInfo"></div>

  <button class="btn-copy" onclick="copyTransfer()">📋 Copy nội dung CK</button>
</div>


</div>

<div id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/topup.js"></script>
</body>
</html>
