<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>💎 Nạp coin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">
  <style>
    .topup-page {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }

    .topup-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .topup-header h2 {
      margin: 0;
    }

    .coin-pack {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: .15s;
    }

    .coin-pack:hover {
      background: #f7f9ff;
      transform: translateY(-1px);
    }

    .coin-pack b {
      font-size: 18px;
    }

    .coin-pack span {
      opacity: .7;
      font-size: 14px;
    }

    .qr-box {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #fafafa;
      text-align: center;
    }

    .qr-box img {
      max-width: 220px;
      margin: 12px auto;
      display: block;
    }

    .bank-info {
      font-size: 14px;
      line-height: 1.6;
    }

    .btn-copy {
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      background: #4f6df5;
      color: #fff;
      cursor: pointer;
    }

    .btn-back {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #ddd;
      cursor: pointer;
    }


    .agent-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.agent-card {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 14px;
  border-radius: 16px;
  background: linear-gradient(145deg,#ffffff,#f2f5ff);
  box-shadow: 0 6px 18px rgba(79,109,245,.15);
  border: none;
}

.agent-card:hover {
  transform: translateY(-2px) scale(1.01);
}


.agent-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
}

.agent-info {
  flex: 1;
}

.agent-name {
  font-weight: 600;
}

.agent-bank {
  font-size: 13px;
  opacity: .7;
}

.agent-status {
  font-size: 12px;
  font-weight: 600;
  margin-top: 4px;
}

.agent-status::before {
  content: "";
  width: 8px;
  height: 8px;
  display: inline-block;
  border-radius: 50%;
  background: #28a745;
  margin-right: 6px;
}

.agent-status.offline::before {
  background: #aaa;
}



.qr-box {
  animation: slideUp .25s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}


  </style>
</head>

<body>
<script src="/guard.js"></script>




<div class="topup-page">

 <button class="btn-back" onclick="history.back()">⬅ Quay lại</button>





  <div class="topup-header">
    <h2>💎 Nạp coin</h2>
    <div id="myCoin">Đang tải coin...</div>
  </div>

 <!-- 🧑‍💼 DANH SÁCH ĐẠI LÝ NẠP COIN -->
<div id="agentList" class="agent-list"></div>

<!-- QR / BANK -->
<div class="qr-box hidden" id="qrBox">
  <h3>📲 Nạp coin qua đại lý</h3>

  <img id="agentQr" src="" alt="QR đại lý">

  <div class="bank-info" id="bankInfo"></div>

  <button class="btn-copy" onclick="copyTransfer()">📋 Copy nội dung CK</button>
</div>


</div>

<div id="toast-container"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/topup.js"></script>
</body>
</html>
