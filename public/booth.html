<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gian hàng</title>
<link rel="stylesheet" href="/style.css">

<style>
html,body{
  background:#000;
  color:#fff;
  margin:0;
}

/* HEADER */
.booth-header{
  padding:16px;
  border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  gap:12px;
}

.booth-back{
  font-size:22px;
  cursor:pointer;
}

.booth-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.booth-logo{
  width:44px;
  height:44px;
  border-radius:12px;
  object-fit:cover;
  box-shadow:0 0 12px rgba(37,240,154,.6);
}

.booth-name{
  font-weight:900;
  font-size:16px;
}

/* BODY */
.booth-body{
  padding:16px;
}

.empty-text{
  opacity:.6;
  font-size:14px;
  text-align:center;
  margin-top:60px;
}

/* ADD PRODUCT */
.add-product{
  position:fixed;
  right:16px;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  font-size:28px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(37,240,154,.6);
  cursor:pointer;
}


.booth-extend{
  margin-left:auto;
  background:transparent;
  border:1px solid #25F09A;
  color:#25F09A;
  padding:6px 12px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

.booth-expire{
  margin:12px 16px;
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
}

.booth-expire.warn{
  border-color:#ffb347;
  color:#ffb347;
  box-shadow:0 0 12px rgba(255,179,71,.4);
}

.booth-expire.danger{
  border-color:#ff5f6d;
  color:#ff5f6d;
  box-shadow:0 0 14px rgba(255,95,109,.45);
}

.hidden{ display:none; }


</style>
</head>

<body>

<!-- HEADER -->
<div class="booth-header">
  <div class="booth-back" id="btnBack">‹</div>

  <div class="booth-info">
    <img id="boothLogo" class="booth-logo">
    <div id="boothName" class="booth-name">Gian hàng</div>
  </div>

  <button id="btnExtendBooth" class="booth-extend hidden">
  ⏳ Gia hạn
</button>


</div>

<div id="boothExpireBox" class="booth-expire hidden"></div>



<!-- BODY -->
<div class="booth-body">
  <div class="empty-text" id="emptyText">
    Gian hàng chưa có sản phẩm nào.<br>
    Nhấn “＋” để đăng bán.
  </div>
</div>

<!-- ADD -->
<div class="add-product" id="btnAddProduct">＋</div>

<script src="/booth.js"></script>
</body>
</html>
