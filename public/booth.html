<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gian hàng</title>
<link rel="stylesheet" href="/style.css">

<style>
html,body{
  background:#000;
  color:#fff;
  margin:0;
}

/* HEADER */
.booth-header{
  padding:16px;
  border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  gap:12px;
}

.booth-back{
  font-size:22px;
  cursor:pointer;
}

.booth-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.booth-logo{
  width:44px;
  height:44px;
  border-radius:12px;
  object-fit:cover;
  box-shadow:0 0 12px rgba(37,240,154,.6);
}

.booth-name{
  font-weight:900;
  font-size:16px;
}

/* BODY */
.booth-body{
  padding:16px;
}

.empty-text{
  opacity:.6;
  font-size:14px;
  text-align:center;
  margin-top:60px;
}

/* ADD PRODUCT */
.add-product{
  position:fixed;
  right:16px;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  font-size:28px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(37,240,154,.6);
  cursor:pointer;
}


.booth-extend{
  margin-left:auto;
  background:transparent;
  border:1px solid #25F09A;
  color:#25F09A;
  padding:6px 12px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

.booth-expire{
  margin:12px 16px;
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
}

.booth-expire.warn{
  border-color:#ffb347;
  color:#ffb347;
  box-shadow:0 0 12px rgba(255,179,71,.4);
}

.booth-expire.danger{
  border-color:#ff5f6d;
  color:#ff5f6d;
  box-shadow:0 0 14px rgba(255,95,109,.45);
}

.hidden{ display:none; }



.product-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  padding:10px;
}

.product-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
}

.product-name{
  font-weight:900;
  font-size:14px;
  margin-top:6px;
}

.product-price{
  color:#25F09A;
  font-weight:900;
  margin-top:4px;
}


.product-stock{
  margin-top:4px;
  font-size:13px;
  font-weight:800;
}
.product-stock.out{
  color:#ff5f6d;
}
.product-stock.in{
  color:#25F09A;
}



.booth-tabs.compact{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.booth-tabs.compact .tab{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 0;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
}

.booth-tabs.compact .tab.active{
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  box-shadow:0 0 12px rgba(37,240,154,.6);
}


.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:16px;
}

.pagination button{
  min-width:36px;
  height:36px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.pagination button.active{
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  box-shadow:0 0 10px rgba(37,240,154,.6);
}

.pagination button:disabled{
  opacity:.4;
  cursor:default;
}



.product-list{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px; /* ⬅️ giảm từ 12px */
}

.product-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;   /* ⬅️ nhỏ hơn */
  padding:8px;          /* ⬅️ nhỏ hơn */
}


.product-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;   /* ⬅️ nhỏ hơn */
}

.product-name{
  font-weight:800;
  font-size:13px;      /* ⬅️ từ 14px */
  margin-top:4px;
}

.product-price{
  font-size:13px;
  margin-top:2px;
}

.product-stock{
  font-size:12px;
  margin-top:2px;
}


.product-list{
  display:grid;
  grid-template-columns:repeat(2, 1fr); /* 2 cột */
  gap:8px;                              /* gọn hơn */
}


.product-card{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:12px;
  padding:8px;
}


.product-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}


.product-name{
  font-size:13px;
  font-weight:800;
  margin-top:4px;
  line-height:1.25;
}

.product-price{
  font-size:13px;
  font-weight:900;
  margin-top:2px;
}

.product-stock{
  font-size:12px;
  margin-top:2px;
}


</style>
</head>

<body>

<!-- HEADER -->
<div class="booth-header">
  <div class="booth-back" id="btnBack">‹</div>

  <div class="booth-info">
    <img id="boothLogo" class="booth-logo">
    <div id="boothName" class="booth-name">Gian hàng</div>
  </div>

  <button id="btnExtendBooth" class="booth-extend hidden">
  ⏳ Gia hạn
</button>


</div>

<div id="boothExpireBox" class="booth-expire hidden"></div>



<!-- BODY -->
<div class="booth-body">

  <!-- TABS -->
<div class="booth-tabs compact">
  <button class="tab active" data-tab="products">
    🛒 <span>Sản phẩm</span>
  </button>

  <button class="tab hidden" data-tab="orders" id="tabOrders">
    📦 <span>Đơn hàng</span>
  </button>

  <button class="tab hidden" data-tab="myOrders" id="tabMyOrders">
    🧾 <span>Đơn hàng</span>
  </button>
</div>



  <!-- PRODUCTS -->
  <div id="productList" class="product-list"></div>

  <div id="productPagination" class="pagination hidden"></div>


  <!-- ORDERS -->
  <div id="orderSection" class="hidden">
    <div id="orderList" class="order-list"></div>

 <div id="orderEmpty" class="empty-text hidden">
  📭 Chưa có đơn hàng nào
</div>

  </div>

<!-- MY ORDERS -->
<div id="myOrderSection" class="hidden">
  <div id="myOrderList"></div>
  <div id="myOrderEmpty" class="empty-text hidden">
    🧾 Bạn chưa có đơn hàng nào
  </div>
</div>


  <div class="empty-text" id="emptyText">
    Gian hàng chưa có sản phẩm nào.<br>
    Nhấn “＋” để đăng bán.
  </div>
</div>


<!-- ADD -->
<div class="add-product" id="btnAddProduct">＋</div>





<div id="addProductModal" class="modal-backdrop hidden">
  <div class="rent-modal">
    <div class="rent-header">
      <b id="productModalTitle">➕ Thêm sản phẩm</b>
      <span onclick="closeAddProduct()">✕</span>
    </div>

    <div class="rent-body">
      <input id="pName" placeholder="Tên sản phẩm">
      <input id="pPrice" type="number" placeholder="Giá (💎)">
      <input type="file" id="pImageFile" accept="image/*">

<img id="pImagePreview"
     style="
       width:100%;
       margin-top:8px;
       border-radius:10px;
       display:none;
       object-fit:cover;
       aspect-ratio:1/1;
     ">

      <textarea id="pDesc" placeholder="Mô tả"></textarea>
      <input id="pStock" type="number" placeholder="Số lượng">

<button class="rent-confirm" id="btnSubmitProduct">
  Đăng bán
</button>


    </div>
  </div>
</div>




<!-- 🔔 GLOBAL MODAL -->
<div id="globalModal" class="modal-backdrop hidden">
  <div class="rent-modal">
    <div class="rent-header">
      <b id="globalModalTitle">Thông báo</b>
      <span onclick="closeGlobalModal()">✕</span>
    </div>

    <div class="rent-body" id="globalModalContent"
      style="font-size:14px;line-height:1.5">
    </div>

    <div class="rent-actions" style="display:flex;gap:10px;margin-top:14px">
      <button id="globalCancelBtn"
        class="rent-confirm"
        style="flex:1;background:#333;display:none">
        Huỷ
      </button>
      <button id="globalOkBtn"
        class="rent-confirm"
        style="flex:1">
        OK
      </button>
    </div>
  </div>
</div>




<!-- 🛒 BUY FORM MODAL -->
<div id="buyFormModal" class="modal-backdrop hidden">
  <div class="rent-modal">
    <div class="rent-header">
      <b>🛒 Thông tin mua hàng</b>
      <span onclick="closeBuyForm()">✕</span>
    </div>

    <div class="rent-body" style="display:flex;flex-direction:column;gap:10px">
      <input id="buyName" placeholder="👤 Họ và tên">
      <input id="buyPhone" placeholder="📞 Số điện thoại">
      <input id="buyAddress" placeholder="📍 Địa chỉ nhận hàng">
      <input id="buyQty" type="number" min="1" value="1" placeholder="🔢 Số lượng">
      <textarea id="buyNote" placeholder="📝 Ghi chú cho shop (tuỳ chọn)"></textarea>

      <button class="rent-confirm" onclick="submitBuyForm()">
        ✅ Xác nhận mua
      </button>
    </div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/booth.js"></script>
<script src="/push-init.js"></script>
<script src="/app-entry-guard.js"></script>


</body>
</html>
