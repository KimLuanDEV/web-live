<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gian hàng</title>
<link rel="stylesheet" href="/style.css">

<style>
html,body{
  background:#000;
  color:#fff;
  margin:0;
}

/* HEADER */
.booth-header{
  padding:16px;
  border-bottom:1px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  gap:12px;
}

.booth-back{
  font-size:22px;
  cursor:pointer;
}

.booth-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.booth-logo{
  width:44px;
  height:44px;
  border-radius:12px;
  object-fit:cover;
  box-shadow:0 0 12px rgba(37,240,154,.6);
}

.booth-name{
  font-weight:900;
  font-size:16px;
}

/* BODY */
.booth-body{
  padding:16px;
}

.empty-text{
  opacity:.6;
  font-size:14px;
  text-align:center;
  margin-top:60px;
}

/* ADD PRODUCT */
.add-product{
  position:fixed;
  right:16px;
  bottom:20px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  font-size:28px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(37,240,154,.6);
  cursor:pointer;
}


.booth-extend{
  margin-left:auto;
  background:transparent;
  border:1px solid #25F09A;
  color:#25F09A;
  padding:6px 12px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
}

.booth-expire{
  margin:12px 16px;
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.15);
}

.booth-expire.warn{
  border-color:#ffb347;
  color:#ffb347;
  box-shadow:0 0 12px rgba(255,179,71,.4);
}

.booth-expire.danger{
  border-color:#ff5f6d;
  color:#ff5f6d;
  box-shadow:0 0 14px rgba(255,95,109,.45);
}

.hidden{ display:none; }


.product-stock.out{
  color:#ff5f6d;
}
.product-stock.in{
  color:#25F09A;
}



.booth-tabs.compact{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.booth-tabs.compact .tab{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:8px 0;
  border-radius:999px;
  font-weight:800;
  font-size:13px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
}

.booth-tabs.compact .tab.active{
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  box-shadow:0 0 12px rgba(37,240,154,.6);
}


.pagination{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:16px;
}

.pagination button{
  min-width:36px;
  height:36px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.pagination button.active{
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  box-shadow:0 0 10px rgba(37,240,154,.6);
}

.pagination button:disabled{
  opacity:.4;
  cursor:default;
}





/* =========================
   PRODUCT GRID – 2x2 CHUẨN
========================= */

.product-list{
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:6px;
}

/* CARD GỌN */
.product-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:10px;
  padding:6px;
}

/* ẢNH NHỎ – KHÔNG PHÌNH */
.product-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:8px;
}

/* TEXT GỌN */
.product-name{
  font-size:12px;
  font-weight:700;
  margin-top:4px;
  line-height:1.2;
}

.product-price{
  font-size:12px;
  font-weight:800;
  color:#25F09A;
  margin-top:2px;
}

.product-stock{
  font-size:11px;
  margin-top:2px;
}

/* NÚT MUA / SỬA */
.product-card button{
  margin-top:6px;
  padding:6px 0;
  font-size:12px;
  border-radius:8px;
}




/* =========================
   MODAL FIX – KHÔNG MỜ, KHÔNG LỆCH
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65); /* nền tối, KHÔNG làm mờ modal */
  display:flex;
  align-items:center;        /* căn giữa dọc */
  justify-content:center;    /* căn giữa ngang */
  z-index:9999;
}

/* MODAL BOX */
.rent-modal{
  width:92%;
  max-width:420px;
  background:#0f0f0f;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
  animation:modalPop .25s ease;
}

/* HEADER */
.rent-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  font-weight:900;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.rent-header span{
  cursor:pointer;
  font-size:18px;
}

/* BODY */
.rent-body{
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* INPUT */
.rent-body input,
.rent-body textarea{
  background:#111;
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  padding:10px 12px;
  color:#fff;
  font-size:14px;
}

.rent-body textarea{
  resize:none;
  min-height:70px;
}

/* BUTTON */
.rent-confirm{
  margin-top:8px;
  padding:12px;
  border-radius:12px;
  font-weight:900;
  border:none;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  cursor:pointer;
}

/* ANIMATION */
@keyframes modalPop{
  from{
    transform:scale(.96) translateY(10px);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}


/* =========================
   BOTTOM SHEET – ADD PRODUCT
========================= */

/* backdrop riêng cho add product */
#addProductModal.modal-backdrop{
  align-items:flex-end;          /* dính đáy */
}

/* bottom sheet box */
#addProductModal .rent-modal{
  width:100%;
  max-width:none;
  border-radius:18px 18px 0 0;
  padding-bottom:env(safe-area-inset-bottom);
  animation:sheetUp .28s ease;
}

/* thanh kéo */
#addProductModal .rent-header::before{
  content:"";
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:36px;
  height:4px;
  border-radius:999px;
  background:rgba(255,255,255,.3);
}

/* header fixed */
#addProductModal .rent-header{
  position:sticky;
  top:0;
  background:#0f0f0f;
  z-index:2;
}

/* body scroll nếu dài */
#addProductModal .rent-body{
  max-height:70vh;
  overflow-y:auto;
}

/* animation */
@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}



.upload-bar{
  width:100%;
  height:8px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  overflow:hidden;
  margin-top:6px;
}

#uploadProgressBar{
  height:100%;
  width:0%;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  transition:width .2s ease;
}

#uploadProgressText{
  font-size:12px;
  font-weight:700;
  opacity:.8;
}

#uploadProgressWrap{
  margin-top:8px;
}



</style>
</head>

<body>

<!-- HEADER -->
<div class="booth-header">
  <div class="booth-back" id="btnBack">‹</div>

  <div class="booth-info">
    <img id="boothLogo" class="booth-logo">
    <div id="boothName" class="booth-name">Gian hàng</div>
  </div>

  <button id="btnExtendBooth" class="booth-extend hidden">
  ⏳ Gia hạn
</button>


</div>

<div id="boothExpireBox" class="booth-expire hidden"></div>



<!-- BODY -->
<div class="booth-body">

  <!-- TABS -->
<div class="booth-tabs compact">
  <button class="tab active" data-tab="products">
    🛒 <span>Sản phẩm</span>
  </button>

  <button class="tab hidden" data-tab="orders" id="tabOrders">
    📦 <span>Đơn hàng</span>
  </button>

  <button class="tab hidden" data-tab="myOrders" id="tabMyOrders">
    🧾 <span>Đơn hàng</span>
  </button>
</div>



  <!-- PRODUCTS -->
  <div id="productList" class="product-list"></div>

  <div id="productPagination" class="pagination hidden"></div>


  <!-- ORDERS -->
  <div id="orderSection" class="hidden">
    <div id="orderList" class="order-list"></div>

 <div id="orderEmpty" class="empty-text hidden">
  📭 Chưa có đơn hàng nào
</div>

  </div>

<!-- MY ORDERS -->
<div id="myOrderSection" class="hidden">
  <div id="myOrderList"></div>
  <div id="myOrderEmpty" class="empty-text hidden">
    🧾 Bạn chưa có đơn hàng nào
  </div>
</div>


  <div class="empty-text" id="emptyText">
    Gian hàng chưa có sản phẩm nào.<br>
    Nhấn “＋” để đăng bán.
  </div>
</div>


<!-- ADD -->
<div class="add-product" id="btnAddProduct">＋</div>





<div id="addProductModal" class="modal-backdrop hidden">
  <div class="rent-modal">
    <div class="rent-header">
      <b id="productModalTitle">➕ Thêm sản phẩm</b>
      <span onclick="closeAddProduct()">✕</span>
    </div>

    <div class="rent-body">
      <input id="pName" placeholder="Tên sản phẩm">
      <input id="pPrice" type="number" placeholder="Giá (💎)">
      <input type="file" id="pImageFile" accept="image/*" multiple>

<img id="pImagePreview"
     style="
       width:100%;
       margin-top:8px;
       border-radius:10px;
       display:none;
       object-fit:cover;
       aspect-ratio:1/1;
     ">

<div id="pGalleryPreview"
     style="display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:6px;
            margin-top:8px">
</div>


      <textarea id="pDesc" placeholder="Mô tả"></textarea>
      <input id="pStock" type="number" placeholder="Số lượng">



<div id="uploadProgressWrap" class="hidden">
  <div id="uploadProgressText">⏳ Đang tải ảnh... 0%</div>
  <div class="upload-bar">
    <div id="uploadProgressBar"></div>
  </div>
</div>


<button class="rent-confirm" id="btnSubmitProduct">
  Đăng bán
</button>


    </div>
  </div>
</div>




<!-- 🔔 GLOBAL MODAL -->
<div id="globalModal" class="modal-backdrop hidden">
  <div class="rent-modal">
    <div class="rent-header">
      <b id="globalModalTitle">Thông báo</b>
      <span onclick="closeGlobalModal()">✕</span>
    </div>

    <div class="rent-body" id="globalModalContent"
      style="font-size:14px;line-height:1.5">
    </div>

    <div class="rent-actions" style="display:flex;gap:10px;margin-top:14px">
      <button id="globalCancelBtn"
        class="rent-confirm"
        style="flex:1;background:#333;display:none">
        Huỷ
      </button>
      <button id="globalOkBtn"
        class="rent-confirm"
        style="flex:1">
        OK
      </button>
    </div>
  </div>
</div>




<!-- 🛒 BUY FORM MODAL -->
<div id="buyFormModal" class="modal-backdrop hidden">
  <div class="rent-modal">
    <div class="rent-header">
      <b>🛒 Thông tin mua hàng</b>
      <span onclick="closeBuyForm()">✕</span>
    </div>

    <div class="rent-body" style="display:flex;flex-direction:column;gap:10px">
      <input id="buyName" placeholder="👤 Họ và tên">
      <input id="buyPhone" placeholder="📞 Số điện thoại">
      <input id="buyAddress" placeholder="📍 Địa chỉ nhận hàng">
      <input id="buyQty" type="number" min="1" value="1" placeholder="🔢 Số lượng">
      <textarea id="buyNote" placeholder="📝 Ghi chú cho shop (tuỳ chọn)"></textarea>

      <button class="rent-confirm" onclick="submitBuyForm()">
        ✅ Xác nhận mua
      </button>
    </div>
  </div>
</div>



<!-- 🖼️ GALLERY SLIDER -->
<div id="galleryModal" class="modal-backdrop hidden">
  <div class="rent-modal" style="max-width:none;width:100%;height:100%;border-radius:0;background:#000">
    <div class="rent-header">
      <b id="galleryTitle">Ảnh sản phẩm</b>
      <span onclick="closeGallery()">✕</span>
    </div>

    <div style="
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    ">
      <img id="galleryImage"
           style="max-width:100%;max-height:100%;object-fit:contain">

      <button onclick="prevGallery()"
        style="position:absolute;left:10px;font-size:26px;background:none;border:none;color:#fff">
        ‹
      </button>

      <button onclick="nextGallery()"
        style="position:absolute;right:10px;font-size:26px;background:none;border:none;color:#fff">
        ›
      </button>
    </div>

    <div style="text-align:center;padding:10px;font-size:13px;opacity:.7">
      <span id="galleryIndex">1 / 1</span>
    </div>
  </div>
</div>




<script src="/socket.io/socket.io.js"></script>
<script src="/booth.js"></script>
<script src="/push-init.js"></script>
<script src="/app-entry-guard.js"></script>


</body>
</html>
