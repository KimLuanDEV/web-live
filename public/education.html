<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🎓 Giáo dục</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">

  <style>
    body{
      margin:0;
      background:#0e0e12;
      color:#fff;
      min-height:100vh;
    }

    .simple-header{
      height:52px;
      display:flex;
      align-items:center;
      gap:12px;
      padding:0 12px;
      background:#111;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    .back-btn{
      background:none;
      border:none;
      color:#fff;
      font-size:20px;
      cursor:pointer;
    }

    .title{
      font-weight:800;
      font-size:16px;
    }

    .edu-wrap{
      padding:24px 16px;
      text-align:center;
    }

    .edu-icon{
      font-size:56px;
      margin-bottom:12px;
    }

    .edu-title{
      font-size:18px;
      font-weight:800;
      margin-bottom:6px;
    }

    .edu-desc{
      font-size:13px;
      opacity:.7;
      max-width:320px;
      margin:0 auto;
    }

    .edu-soon{
      margin-top:28px;
      font-size:12px;
      opacity:.5;
    }
  </style>
</head>
<body>

<header class="simple-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">🎓 Giáo dục</div>
</header>

<main class="edu-wrap">
  <div class="edu-icon">📚</div>
  <div class="edu-title">Trung tâm giáo dục</div>
  <div class="edu-desc">
    Nơi phát triển kiến thức, lộ trình học tập, kỹ năng và hệ thống đào tạo trong tương lai.
  </div>

  <div class="edu-soon">
    🚧 Module đang được phát triển
  </div>
</main>

</body>
</html>
