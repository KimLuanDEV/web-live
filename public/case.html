<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🕵️ Vụ án</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
    }

    header button {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    main {
      padding: 20px 16px 40px;
    }

    .case-box {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .case-id {
      font-size: 12px;
      color: #888;
    }

    .case-name {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    .case-desc {
      font-size: 14px;
      color: #aaa;
      margin-top: 10px;
      line-height: 1.4;
    }

    h3 {
      margin: 20px 0 10px;
    }

    .clue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .clue-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: .2s;
    }

    .clue-card:hover {
      box-shadow: 0 0 0 1px #00ffd5;
    }

    .clue-card.locked {
      opacity: .4;
      pointer-events: none;
    }

    .clue-icon {
      font-size: 28px;
    }

    .clue-title {
      margin-top: 6px;
      font-weight: 700;
    }

    .clue-status {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
    }


 
@keyframes slideUp {
  from { transform: translate(-50%, 100%); }
  to { transform: translate(-50%, 0); }
}



  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <button onclick="history.back()">←</button>
    <b id="headerTitle">Vụ án</b>
  </header>

  <main>

    <!-- CASE INFO -->
    <div class="case-box">
      <div class="case-id" id="caseId"></div>
      <div class="case-name" id="caseName"></div>
      <div class="case-desc" id="caseDesc"></div>
    </div>

    <!-- CLUES -->
    <h3>🔍 Manh mối</h3>
    <div class="clue-grid" id="clueGrid"></div>

  </main>



  <!-- 🔍 CLUE MODAL -->
<div id="clueModal" style="
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  z-index: 99;
">

  <div style="
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #0f0f0f;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    animation: slideUp .2s ease;
  ">

    <div style="display:flex;align-items:center;margin-bottom:10px">
      <div id="modalIcon" style="font-size:28px;margin-right:8px"></div>
      <b id="modalTitle"></b>
      <button onclick="closeClue()" style="
        margin-left:auto;
        background:none;
        border:none;
        color:#fff;
        font-size:20px;
        cursor:pointer;
      ">✕</button>
    </div>

    <div id="modalContent" style="font-size:14px;color:#ccc;line-height:1.4"></div>

  </div>
</div>




<script>
  const params = new URLSearchParams(location.search);
  const caseId = params.get("id");

  async function loadCase() {
    try {
      const res = await fetch("/data/cases.json");
      const cases = await res.json();

      const data = cases[caseId];
      if (!data) {
        document.body.innerHTML =
          "<p style='padding:20px'>❌ Không tìm thấy vụ án</p>";
        return;
      }

      document.title = "🕵️ " + data.name;
      document.getElementById("headerTitle").innerText = "Vụ án #" + data.id;
      document.getElementById("caseId").innerText = "VỤ ÁN #" + data.id;
      document.getElementById("caseName").innerText = data.name;
      document.getElementById("caseDesc").innerText = data.desc;

      const grid = document.getElementById("clueGrid");
      grid.innerHTML = "";


data.clues.forEach(c => {
  const div = document.createElement("div");
  div.className = "clue-card" + (c.locked ? " locked" : "");
  div.innerHTML = `
    <div class="clue-icon">${c.icon}</div>
    <div class="clue-title">${c.title}</div>
    <div class="clue-status">${c.status}</div>
  `;

  if (!c.locked) {
    div.onclick = () => openClue(c);
  }

  grid.appendChild(div);
});

    } catch (err) {
      document.body.innerHTML =
        "<p style='padding:20px'>❌ Lỗi tải dữ liệu vụ án</p>";
      console.error(err);
    }
  }

  loadCase();



function openClue(clue) {
  document.getElementById("modalIcon").innerText = clue.icon;
  document.getElementById("modalTitle").innerText = clue.title;
  document.getElementById("modalContent").innerText =
    clue.content || "Chưa có thông tin.";

  document.getElementById("clueModal").style.display = "block";

  // đánh dấu đã đọc (tạm thời – local)
  clue.status = "Đã đọc";
}

function closeClue() {
  document.getElementById("clueModal").style.display = "none";
}




</script>


</body>
</html>
