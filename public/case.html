<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🕵️ Vụ án</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: #000;
      z-index: 10;
    }

    header button {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      margin-right: 10px;
      cursor: pointer;
    }

    main {
      padding: 20px 16px 40px;
    }

    .case-box {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .case-id {
      font-size: 12px;
      color: #888;
    }

    .case-name {
      font-size: 22px;
      font-weight: 800;
      margin-top: 6px;
    }

    .case-desc {
      font-size: 14px;
      color: #aaa;
      margin-top: 10px;
      line-height: 1.4;
    }

    h3 {
      margin: 20px 0 10px;
    }

    .clue-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }

    .clue-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: .2s;
    }

    .clue-card:hover {
      box-shadow: 0 0 0 1px #00ffd5;
    }

    .clue-card.locked {
      opacity: .4;
      pointer-events: none;
    }

    .clue-icon {
      font-size: 28px;
    }

    .clue-title {
      margin-top: 6px;
      font-weight: 700;
    }

    .clue-status {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
    }


 
@keyframes slideUp {
  from { transform: translate(-50%, 100%); }
  to { transform: translate(-50%, 0); }
}

#suspectList > div {
  background: #111;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.suspect-name {
  font-weight: 700;
}

.suspect-desc {
  font-size: 13px;
  color: #aaa;
  margin-top: 4px;
}

.suspect-alibi {
  font-size: 12px;
  color: #888;
  margin-top: 6px;
}


.suspicion-wrap {
  margin-top: 8px;
}

.suspicion-bar {
  height: 8px;
  background: #222;
  border-radius: 6px;
  overflow: hidden;
}

.suspicion-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00ffd5, #ff5252);
  transition: width .3s ease;
}

.suspicion-label {
  font-size: 11px;
  color: #aaa;
  margin-top: 4px;
}


.decision-item {
  border: 1px solid #222;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: .2s;
}

.decision-item:hover {
  box-shadow: 0 0 0 1px #ff5252;
}

.decision-item.active {
  box-shadow: 0 0 0 2px #ff5252;
}

.decision-name {
  font-weight: 700;
}

.decision-note {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}




  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <button onclick="history.back()">←</button>
    <b id="headerTitle">Vụ án</b>
  </header>

  <main>

    <!-- CASE INFO -->
    <div class="case-box">
      <div class="case-id" id="caseId"></div>
      <div class="case-name" id="caseName"></div>
      <div class="case-desc" id="caseDesc"></div>
    </div>

    <!-- CLUES -->
    <h3>🔍 Manh mối</h3>
    <div class="clue-grid" id="clueGrid"></div>

<!-- 🧍 NGHI PHẠM -->
<div id="suspectSection" style="display:none">
  <h3>🧍 Nghi phạm</h3>
  <div id="suspectList"></div>
</div>

<!-- 🟥 DECISION POINT -->
<div id="decisionSection" style="display:none;margin-top:20px">
  <h3>🟥 Quyết định điều tra</h3>
  <div style="font-size:13px;color:#aaa;margin-bottom:10px">
    Dựa trên các manh mối hiện có, hãy chỉ định <b>nghi phạm chính</b>.
    <br>⚠️ Quyết định này sẽ ảnh hưởng đến tiến trình vụ án.
  </div>

  <div id="decisionList"></div>

  <button id="btnConfirmDecision"
    style="
      margin-top:12px;
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      background:#ff5252;
      color:#fff;
      font-weight:700;
      cursor:pointer;
      opacity:.5;
    "
    disabled
    onclick="confirmDecision()"
  >
    🔒 Xác nhận nghi phạm
  </button>
</div>




  </main>



  <!-- 🔍 CLUE MODAL -->
<div id="clueModal" style="
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  z-index: 99;
">

  <div style="
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #0f0f0f;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    animation: slideUp .2s ease;
  ">

    <div style="display:flex;align-items:center;margin-bottom:10px">
      <div id="modalIcon" style="font-size:28px;margin-right:8px"></div>
      <b id="modalTitle"></b>
      <button onclick="closeClue()" style="
        margin-left:auto;
        background:none;
        border:none;
        color:#fff;
        font-size:20px;
        cursor:pointer;
      ">✕</button>
    </div>

    <div id="modalContent" style="font-size:14px;color:#ccc;line-height:1.4"></div>

  </div>
</div>




<!-- 🧠 VERDICT SCREEN -->
<div id="verdictScreen" style="
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  display:none;
  z-index:200;
  padding:20px 16px;
  overflow:auto;
">

  <h2 style="margin-top:10px">🧠 KẾT ÁN</h2>

  <div id="verdictResult" style="
    margin-top:14px;
    font-size:16px;
    font-weight:700;
  "></div>

  <div id="verdictReason" style="
    margin-top:10px;
    font-size:14px;
    color:#ccc;
    line-height:1.5;
  "></div>

  <div style="margin-top:20px">
    <h3>📌 Tóm tắt vụ án</h3>
    <ul id="verdictSummary" style="font-size:14px;color:#aaa;line-height:1.6"></ul>
  </div>

  <div style="margin-top:26px">
    <button onclick="replayCase()" style="
      width:100%;
      padding:14px;
      border-radius:14px;
      border:none;
      background:#00ffd5;
      color:#000;
      font-weight:800;
      cursor:pointer;
    ">
      🔁 Điều tra lại vụ án
    </button>
  </div>

</div>


<script>
  const params = new URLSearchParams(location.search);
  const caseId = params.get("id");
  const READ_KEY = "case_read_" + caseId;
  let readClues = JSON.parse(localStorage.getItem(READ_KEY) || "[]");
  const SUSPICION_KEY = "case_suspicion_" + caseId;
  let suspicionState = JSON.parse(
  localStorage.getItem(SUSPICION_KEY) || "{}"
);

const DECISION_KEY = "case_decision_" + caseId;
let chosenSuspect = localStorage.getItem(DECISION_KEY);
let tempSelectedSuspect = null;
const TRUTH_REVEALED_KEY = "case_truth_revealed_" + caseId;
let truthRevealed = localStorage.getItem(TRUTH_REVEALED_KEY);


let data; // giữ data case dùng chung




  async function loadCase() {
    try {
      const res = await fetch("/data/cases.json");
      const cases = await res.json();

      data = cases[caseId];

initSuspicion();

      if (!data) {
        document.body.innerHTML =
          "<p style='padding:20px'>❌ Không tìm thấy vụ án</p>";
        return;
      }

      document.title = "🕵️ " + data.name;
      document.getElementById("headerTitle").innerText = "Vụ án #" + data.id;
      document.getElementById("caseId").innerText = "VỤ ÁN #" + data.id;
      document.getElementById("caseName").innerText = data.name;
      document.getElementById("caseDesc").innerText = data.desc;

      const grid = document.getElementById("clueGrid");
      grid.innerHTML = "";

refreshClues();
checkSuspects();

    } catch (err) {
      document.body.innerHTML =
        "<p style='padding:20px'>❌ Lỗi tải dữ liệu vụ án</p>";
      console.error(err);
    }
  }

  loadCase();




function initSuspicion() {
  data.suspects.forEach(s => {
    if (suspicionState[s.id] == null) {
      // base suspicion từ cases.json (0–5) → %
      suspicionState[s.id] = Math.min(100, (s.suspicion || 1) * 15);
    }
  });
  localStorage.setItem(SUSPICION_KEY, JSON.stringify(suspicionState));
}




function refreshClues() {
  const LOCK_KEY = "case_locked_" + caseId;
  const lockedByDecision =
    JSON.parse(localStorage.getItem(LOCK_KEY) || "[]");

  const grid = document.getElementById("clueGrid");
  grid.innerHTML = "";

  data.clues.forEach(c => {

    // 1️⃣ Kiểm tra unlock cơ bản + khóa theo quyết định
    let unlocked =
      !lockedByDecision.includes(c.id) &&
      (
        !c.locked ||
        (c.unlockAfter &&
          c.unlockAfter.every(id => readClues.includes(id)))
      );

    // 2️⃣ Điều kiện nâng cao: nghi ngờ trung bình phải dưới ngưỡng
    if (unlocked && c.unlockSuspicionBelow != null) {
      const values = Object.values(suspicionState);
      const avgSuspicion =
        values.length
          ? values.reduce((a, b) => a + b, 0) / values.length
          : 0;

      if (avgSuspicion >= c.unlockSuspicionBelow) {
        unlocked = false;
      }
    }

    // 3️⃣ Render card
    const div = document.createElement("div");
    div.className = "clue-card" + (unlocked ? "" : " locked");

    div.innerHTML = `
      <div class="clue-icon">${c.icon}</div>
      <div class="clue-title">${c.title}</div>
      <div class="clue-status">
        ${readClues.includes(c.id) ? "Đã đọc" : c.status}
      </div>
    `;

    // 4️⃣ Chỉ cho click khi thật sự mở
    if (unlocked) {
      div.onclick = () => openClue(c);
    } else {
      div.onclick = null;
    }

    grid.appendChild(div);
  });
}


function getSuspicionLevel(p) {
  if (p < 25) return "Thấp";
  if (p < 50) return "Trung bình";
  if (p < 75) return "Cao";
  return "Rất cao";
}



function checkSuspects() {
  if (!data.suspects) return;

  const section = document.getElementById("suspectSection");
  const list = document.getElementById("suspectList");

  list.innerHTML = "";
  let hasVisible = false;

  data.suspects.forEach(s => {
    const unlocked =
      !s.unlockAfter ||
      s.unlockAfter.every(id => readClues.includes(id));

    if (!unlocked) return;

    hasVisible = true;

    const percent = Math.min(100, suspicionState[s.id] || 0);

    const div = document.createElement("div");
    div.innerHTML = `
      <div class="suspect-name">${s.name}</div>
      <div class="suspect-desc">${s.desc}</div>
      <div class="suspect-alibi">🕒 Alibi: ${s.alibi}</div>

      <div class="suspicion-wrap">
        <div class="suspicion-bar">
          <div class="suspicion-fill" style="width:${percent}%"></div>
        </div>
       <div class="suspicion-label">
  Độ nghi ngờ:
  <b>${getSuspicionLevel(percent)}</b>
</div>

      </div>
    `;

    list.appendChild(div);
  });

  section.style.display = hasVisible ? "block" : "none";

  showDecisionPoint();
}

function showDecisionPoint() {
  if (!data.suspects) return;

  const box = document.getElementById("decisionList");
  const section = document.getElementById("decisionSection");

  box.innerHTML = "";

  // Chỉ mở Decision khi đã đọc Camera
  if (!readClues.includes("c3")) return;

  section.style.display = "block";

  data.suspects.forEach(s => {
    const unlocked =
      !s.unlockAfter ||
      s.unlockAfter.every(id => readClues.includes(id));

    if (!unlocked) return;

    const percent = Math.min(100, suspicionState[s.id] || 0);
    const level = getSuspicionLevel(percent);

    // ✅ TẠO div ĐÚNG CÁCH
    const div = document.createElement("div");
    div.className =
      "decision-item" +
      (chosenSuspect === s.id ? " active" : "");

    div.innerHTML = `
      <div class="decision-name">${s.name}</div>
      <div class="decision-note">
        Độ nghi ngờ: <b>Không ổn định</b>
      </div>
    `;

    div.onclick = () => selectDecision(s.id, div);

    box.appendChild(div);
  });

  // Nếu đã chọn trước đó → khóa nút
  if (chosenSuspect) {
    const btn = document.getElementById("btnConfirmDecision");
    btn.innerText = "🔒 Đã chỉ định nghi phạm";
    btn.disabled = true;
    btn.style.opacity = .4;
  }
}

function selectDecision(id, el) {
  if (chosenSuspect) return;

  document.querySelectorAll(".decision-item")
    .forEach(d => d.classList.remove("active"));

  el.classList.add("active");

  tempSelectedSuspect = id;
  document.getElementById("btnConfirmDecision").disabled = false;
  document.getElementById("btnConfirmDecision").style.opacity = 1;
}




function confirmDecision() {
  if (!tempSelectedSuspect) return;

  chosenSuspect = tempSelectedSuspect;
  localStorage.setItem(DECISION_KEY, chosenSuspect);
  lockCluesByDecision();

  alert("Bạn đã chỉ định nghi phạm chính.\n\nQuyết định này sẽ ảnh hưởng đến diễn biến tiếp theo.");

  document.getElementById("btnConfirmDecision").innerText =
    "🔒 Đã chỉ định nghi phạm";
  document.getElementById("btnConfirmDecision").disabled = true;
  document.getElementById("btnConfirmDecision").style.opacity = .4;

  refreshClues();

}


function lockCluesByDecision() {
  if (!chosenSuspect) return;

  const LOCK_KEY = "case_locked_" + caseId;
  let lockedClues = [];

  data.clues.forEach(c => {
    if (
      c.lockedIfSuspect &&
      c.lockedIfSuspect.includes(chosenSuspect)
    ) {
      lockedClues.push(c.id);
    }
  });

  localStorage.setItem(LOCK_KEY, JSON.stringify(lockedClues));
}


function applyClueEffect(clue) {
  data.suspects.forEach(s => {
    if (suspicionState[s.id] == null) return;

    // 1️⃣ Giá trị nền
    let delta = clue.redHerring ? 6 : -4;

    // 2️⃣ Manh mối đánh lạc hướng mạnh
    if (clue.mislead) {
      delta += 10; // cộng thêm, KHÔNG ghi đè
    }

    // 3️⃣ Nhiễu nhẹ để không quá lộ
    const noise = Math.floor(Math.random() * 7) - 3; // -3 → +3
    delta += noise;

    // 4️⃣ Áp dụng vào nghi ngờ
    suspicionState[s.id] = Math.max(
      0,
      Math.min(100, suspicionState[s.id] + delta)
    );
  });

  localStorage.setItem(SUSPICION_KEY, JSON.stringify(suspicionState));
}




function openClue(clue) {
  document.getElementById("modalIcon").innerText = clue.icon;
  document.getElementById("modalTitle").innerText = clue.title;
  document.getElementById("modalContent").innerText =
    clue.content || "Chưa có thông tin.";

  document.getElementById("clueModal").style.display = "block";

  if (!readClues.includes(clue.id)) {
    readClues.push(clue.id);
    localStorage.setItem(READ_KEY, JSON.stringify(readClues));
  }

applyClueEffect(clue);
refreshClues();
checkSuspects();

if (
  !truthRevealed &&
  chosenSuspect &&
  data.truth &&
  data.truth.keyClues.every(id => readClues.includes(id))
) {
  localStorage.setItem(TRUTH_REVEALED_KEY, "1");
  truthRevealed = true;
  setTimeout(revealTruth, 300);
}




}


function closeClue() {
  document.getElementById("clueModal").style.display = "none";
}


function revealTruth() {
  if (!data.truth || !chosenSuspect) return;

  const truth = data.truth;
  const killer = data.suspects.find(s => s.id === truth.killer);
  const chosen = data.suspects.find(s => s.id === chosenSuspect);
  const correct = chosenSuspect === truth.killer;

  // Ẩn decision
  document.getElementById("decisionSection").style.display = "none";

  // Hiện verdict screen
  const screen = document.getElementById("verdictScreen");
  screen.style.display = "block";

  document.getElementById("verdictResult").innerText = correct
    ? "🎯 BẠN ĐÃ KẾT ÁN ĐÚNG"
    : "❌ BẠN ĐÃ KẾT ÁN SAI";

  document.getElementById("verdictReason").innerHTML = `
    Hung thủ thật sự là <b>${killer.name}</b>.<br><br>
    ${truth.reason}
    <br><br>
    ${
      correct
        ? "Bạn đã không bị đánh lạc hướng bởi các manh mối giả."
        : "Bạn đã bị thanh độ nghi ngờ và manh mối giả đánh lạc hướng."
    }
  `;

  const summary = document.getElementById("verdictSummary");
  summary.innerHTML = "";

  truth.keyClues.forEach(id => {
    const clue = data.clues.find(c => c.id === id);
    if (clue) {
      const li = document.createElement("li");
      li.innerText = `🔑 ${clue.title}`;
      summary.appendChild(li);
    }
  });
}

function replayCase() {
  if (!confirm("Bạn muốn điều tra lại vụ án này từ đầu?")) return;

  localStorage.removeItem("case_read_" + caseId);
  localStorage.removeItem("case_suspicion_" + caseId);
  localStorage.removeItem("case_decision_" + caseId);
  localStorage.removeItem("case_locked_" + caseId);
  localStorage.removeItem("case_truth_revealed_" + caseId);

  location.reload();
}




</script>


</body>
</html>
