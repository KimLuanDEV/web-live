<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nạp Kim Cương</title>

<style>

body{
background:#0b0f1a;
color:#fff;
font-family:system-ui;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#111827;
padding:30px;
border-radius:15px;
width:350px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.6);
}

h1{
margin-top:0;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin:10px 0;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#00d4ff;
color:#000;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00b5d9;
}

.result{
margin-top:10px;
}

</style>
</head>

<body>

<div class="box">

<h1>💎 Nạp Kim Cương</h1>

<input id="username" placeholder="Username">

<input id="amount" type="number" placeholder="Số kim cương">

<button onclick="deposit()">Nạp</button>

<div class="result" id="result"></div>

</div>

<script>

async function deposit(){

const username =
document.getElementById("username").value

const amount =
Number(document.getElementById("amount").value)

const res = await fetch("/api/deposit",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({username,amount})
})

const data = await res.json()

document.getElementById("result").innerText =
data.message

}

</script>

</body>
</html>
