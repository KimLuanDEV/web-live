<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Nạp Kim Cương</title>

<style>

body{
background:#0b0f1a;
color:#fff;
font-family:system-ui;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#111827;
padding:30px;
border-radius:15px;
width:350px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,.6);
}

h1{
margin-top:0;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
margin:10px 0;
font-size:16px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#00d4ff;
color:#000;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#00b5d9;
}

.result{
margin-top:10px;
}

/* ===== CONFIRM MODAL ===== */

.confirm-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.confirm-box{
background:#0f172a;
padding:25px;
border-radius:14px;
width:320px;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.8);
border:1px solid #1f2937;
}

.confirm-title{
font-size:18px;
margin-bottom:15px;
font-weight:bold;
}

.confirm-user{
margin:10px 0;
font-size:14px;
}

.confirm-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.btn-cancel{
flex:1;
background:#374151;
color:#fff;
}

.btn-confirm{
flex:1;
background:#00e0ff;
color:#000;
font-weight:bold;
}



</style>
</head>

<body>

<div class="box">

<h1>💎 Nạp Kim Cương</h1>

<input id="username" placeholder="Username">

<button onclick="checkUser()">CHECK USER</button>

<div id="userPreview" style="display:none;margin:10px 0">

<img id="userAvatar"
style="width:60px;height:60px;border-radius:50%">

<div id="userName"></div>
<div id="userCoins"></div>

</div>

<input id="amount" type="number" placeholder="Số kim cương">

<button onclick="deposit()">Nạp</button>

<div class="result" id="result"></div>

</div>





<div id="confirmModal" class="confirm-modal">

<div class="confirm-box">

<div class="confirm-title">CONFIRM DEPOSIT</div>

<div class="confirm-user" id="confirmUser"></div>

<div class="confirm-user" id="confirmAmount"></div>

<div class="confirm-buttons">

<button class="btn-cancel" onclick="closeConfirm()">
CANCEL
</button>

<button class="btn-confirm" onclick="confirmDeposit()">
CONFIRM
</button>

</div>

</div>

</div>



<script>

function deposit(){

const username =
document.getElementById("username").value

const amount =
Number(document.getElementById("amount").value)

if(!username || !amount){
alert("Nhập username và số kim cương")
return
}

document.getElementById("confirmUser").innerText =
"User: " + username

document.getElementById("confirmAmount").innerText =
"Deposit: 💎 " + amount

document.getElementById("confirmModal").style.display =
"flex"

}


function closeConfirm(){
document.getElementById("confirmModal").style.display="none"
}

async function confirmDeposit(){

const username =
document.getElementById("username").value

const amount =
Number(document.getElementById("amount").value)

closeConfirm()

const res = await fetch("/api/deposit",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({username,amount})
})

const data = await res.json()

document.getElementById("result").innerText =
data.message

}


async function checkUser(){

const username =
document.getElementById("username").value

if(username.length < 2){
document.getElementById("userPreview").style.display="none"
return
}

const res = await fetch("/api/user-info?uid="+username)

if(!res.ok) return

const data = await res.json()

if(!data.success){
document.getElementById("userPreview").style.display="none"
return
}

document.getElementById("userPreview").style.display="block"

document.getElementById("userAvatar").src =
data.user.avatar

document.getElementById("userName").innerText =
data.user.name

document.getElementById("userCoins").innerText =
"💎 "+data.user.coins

}



</script>

</body>
</html>
