<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diamond Deposit</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
background:#060b16;
color:#fff;
font-family:system-ui;
min-height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

.header{
height:60px;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:18px;
letter-spacing:1px;
border-bottom:1px solid #1f2937;
}

/* CONTAINER */

.container{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* CARD */

.box{
background:#0f172a;
padding:25px;
border-radius:16px;
width:100%;
max-width:380px;
text-align:center;
border:1px solid #1f2937;
box-shadow:0 15px 50px rgba(0,0,0,.7);
}

.box h2{
margin-top:0;
}

/* INPUT */

input{
width:100%;
padding:12px;
border-radius:8px;
margin:10px 0;
font-size:16px;
background:#020617;
color:#fff;
border:1px solid #1f2937;
}

/* BUTTON */

button{
width:100%;
padding:12px;
border-radius:8px;
margin-top:8px;
background:#00e0ff;
color:#000;
font-weight:bold;
cursor:pointer;
border:none;
}

button:hover{
background:#00c5e0;
}

/* USER PREVIEW */

#userPreview{
margin-top:15px;
padding:12px;
background:#020617;
border-radius:10px;
border:1px solid #1f2937;
}

#userAvatar{
width:60px;
height:60px;
border-radius:50%;
margin-bottom:5px;
}

/* RESULT */

.result{
margin-top:10px;
font-size:14px;
}

/* FOOTER */

.footer{
height:50px;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
color:#9ca3af;
border-top:1px solid #1f2937;
background:#0f172a;
}

/* CONFIRM MODAL */

.confirm-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.confirm-box{
background:#0f172a;
padding:25px;
border-radius:14px;
width:320px;
text-align:center;
border:1px solid #1f2937;
box-shadow:0 0 40px rgba(0,0,0,.8);
}

.confirm-title{
font-size:18px;
margin-bottom:15px;
font-weight:bold;
}

.confirm-user{
margin:10px 0;
font-size:14px;
}

.confirm-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.btn-cancel{
flex:1;
background:#374151;
color:#fff;
}

.btn-confirm{
flex:1;
background:#00e0ff;
color:#000;
font-weight:bold;
}

/* MOBILE */

@media(max-width:480px){

.header{
font-size:16px;
}

.box{
padding:20px;
}

}

</style>
</head>

<body>

<div class="header">
 DIAMOND DEPOSIT
</div>

<div class="container">

<div class="box">
    
<input id="username" placeholder="UserID">

<button onclick="checkUser()">CHECK USER</button>

<div id="userPreview" style="display:none">

<img id="userAvatar">

<div id="userName"></div>
<div id="userCoins"></div>

</div>

<input id="amount" type="number" placeholder="Diamond">

<button onclick="deposit()">CONFIRM</button>

<div class="result" id="result"></div>

</div>

</div>

<div class="footer">
Livestream Pro
</div>


<div id="confirmModal" class="confirm-modal">

<div class="confirm-box">

<div class="confirm-title">
CONFIRM DEPOSIT
</div>

<div class="confirm-user" id="confirmUser"></div>

<div class="confirm-user" id="confirmAmount"></div>

<div class="confirm-buttons">

<button class="btn-cancel" onclick="closeConfirm()">
CANCEL
</button>

<button class="btn-confirm" onclick="confirmDeposit()">
CONFIRM
</button>

</div>

</div>

</div>


<script>

function deposit(){

const username =
document.getElementById("username").value

const amount =
Number(document.getElementById("amount").value)

if(!username || !amount){
alert("Nhập username và số kim cương")
return
}

document.getElementById("confirmUser").innerText =
"User: " + username

document.getElementById("confirmAmount").innerText =
"Deposit: 💎 " + amount

document.getElementById("confirmModal").style.display =
"flex"

}


function closeConfirm(){
document.getElementById("confirmModal").style.display="none"
}


async function confirmDeposit(){

const username =
document.getElementById("username").value

const amount =
Number(document.getElementById("amount").value)

closeConfirm()

const res = await fetch("/api/deposit",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({username,amount})
})

const data = await res.json()

document.getElementById("result").innerText =
data.message

}


async function checkUser(){

const username =
document.getElementById("username").value

if(username.length < 2){
document.getElementById("userPreview").style.display="none"
return
}

const res = await fetch("/api/user-info?uid="+username)

if(!res.ok) return

const data = await res.json()

if(!data.success){
document.getElementById("userPreview").style.display="none"
return
}

document.getElementById("userPreview").style.display="block"

document.getElementById("userAvatar").src =
data.user.avatar

document.getElementById("userName").innerText =
data.user.name

document.getElementById("userCoins").innerText =
"💎 " + data.user.coins

}

</script>

</body>
</html>
