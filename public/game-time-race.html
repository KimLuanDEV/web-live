<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Time Race</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>

<style>
html,body{
  margin:0;
  padding:0;

  background:
  radial-gradient(circle at 50% 30%,
    rgba(0,255,255,.15),
    rgba(0,0,0,.95) 60%
  ),
  url('/assets/bg/time-race-bg.jpg') center/cover no-repeat fixed;

background-blend-mode: screen;


  font-family:system-ui;
  color:#fff;
  overflow:hidden;
}


body::before{
  content:"";
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle at 50% 40%,
      rgba(0,0,0,.2),
      rgba(0,0,0,.7) 70%
    );

  pointer-events:none;
  z-index:-1;
}


body{
  animation:bgMove 20s linear infinite;
}

@keyframes bgMove{
  0%{ background-position:0% 0%; }
  50%{ background-position:50% 50%; }
  100%{ background-position:0% 0%; }
}

/* HEADER PRO */

/* ================= GLASS NEON HEADER LEVEL 2 ================= */

/* ================= LEVEL 3 CINEMATIC HEADER ================= */

.tr-header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  /* Safe zone + cân giữa */
  padding-top:calc(env(safe-area-inset-top) + 10px);
  padding-left:16px;
  padding-right:16px;
  padding-bottom:14px;

  height:calc(90px + env(safe-area-inset-top));

  display:flex;
  align-items:center;      /* 🔥 QUAN TRỌNG: căn giữa dọc */
  justify-content:space-between;

  background:linear-gradient(
    120deg,
    rgba(0,30,60,.85),
    rgba(0,0,0,.95),
    rgba(0,30,60,.85)
  );

  background-size:200% 200%;
  animation:headerFlow 8s ease infinite;

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:1px solid rgba(0,255,255,.25);

  box-shadow:
    0 0 60px rgba(0,255,255,.15),
    inset 0 0 40px rgba(0,255,255,.05);

  overflow:hidden;
  z-index:300;
}

@keyframes headerFlow{
  0%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}

.tr-header::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 40%, rgba(0,255,255,.2) 0%, transparent 60%),
    radial-gradient(circle at 80% 20%, rgba(0,255,255,.15) 0%, transparent 60%),
    radial-gradient(circle at 50% 80%, rgba(0,255,255,.1) 0%, transparent 60%);
  animation:particleMove 10s linear infinite;
  pointer-events:none;
  opacity:.6;
}

@keyframes particleMove{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-10px); }
  100%{ transform:translateY(0); }
}


.tr-header::after{
  content:"";
  position:absolute;
  bottom:0;
  left:-50%;
  width:200%;
  height:3px;

  background:linear-gradient(
    90deg,
    transparent,
    #00f0ff,
    #00ffff,
    transparent
  );

  animation:neonSlide 4s linear infinite;
}

@keyframes neonSlide{
  from{ transform:translateX(0);}
  to{ transform:translateX(50%);}
}

.tr-back{
  position:relative;
  z-index:2;

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:16px;

  border:1px solid rgba(0,255,255,.25);
  background:rgba(255,255,255,.06);

  color:#fff;
  font-size:20px;
  font-weight:700;

  cursor:pointer;

  backdrop-filter:blur(10px);

  box-shadow:
    0 0 20px rgba(0,255,255,.3),
    inset 0 0 12px rgba(0,255,255,.1);

  transition:.2s;
}

.tr-back:hover{
  transform:scale(1.08);
  box-shadow:
    0 0 30px rgba(0,255,255,.6);
}

.tr-head-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  width:200px;
}


.tr-title{
  font-weight:900;
  font-size:18px;
  letter-spacing:.7px;

  background:linear-gradient(
    90deg,
    #00f0ff,
    #ffffff,
    #00f0ff
  );
  background-size:200%;

  background-clip:text;
  -webkit-background-clip:text;

  color:transparent;
  -webkit-text-fill-color:transparent;

  animation:titleShimmer 4s linear infinite;
}

@keyframes titleShimmer{
  from{ background-position:0%;}
  to{ background-position:200%;}
}

@keyframes neonPulse{
  0%,100%{ opacity:.9; }
  50%{ opacity:1; }
}

.tr-sub{
  font-size:12px;
  opacity:.75;
  margin-top:4px;
  letter-spacing:.5px;
}

.tr-right{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:8px;
}

.tr-coins{
  padding:10px 16px;
  border-radius:20px;

  background:linear-gradient(
    135deg,
    rgba(0,255,255,.2),
    rgba(0,0,0,.4)
  );

  border:1px solid rgba(0,255,255,.4);

  font-weight:800;

  box-shadow:
    0 0 25px rgba(0,255,255,.4),
    inset 0 0 15px rgba(0,255,255,.15);

  backdrop-filter:blur(12px);

  animation:coinPulse 3s ease-in-out infinite;
}

@keyframes coinPulse{
  0%,100%{ box-shadow:0 0 25px rgba(0,255,255,.3); }
  50%{ box-shadow:0 0 45px rgba(0,255,255,.8); }
}

.tr-coins:hover{
  box-shadow:
    0 0 40px rgba(0,255,255,.6);
}

.tr-timer-badge{
  background:#007bff;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}


/* CENTER */
.tr-center{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.multiplier{
  font-size:64px;
  font-weight:800;
  text-shadow:0 0 25px #00f0ff;
  transition:.1s;
}

.multiplier.big{
  font-size:80px;
}

.multiplier.crash{
  color:#ff2d2d;
  text-shadow:0 0 30px red;
}

/* BET PANEL */
.tr-bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  padding:18px 16px calc(20px + env(safe-area-inset-bottom));

  background:linear-gradient(
    180deg,
    rgba(10,10,25,.95),
    rgba(0,0,0,.98)
  );

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-top:1px solid rgba(0,255,255,.15);

  box-shadow:
    0 -10px 40px rgba(0,255,255,.08);

  z-index:200;
}

.bet-input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#111;
  color:#fff;
  margin-bottom:12px;
  font-size:16px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn-bet{
  background:linear-gradient(
    135deg,
    #007bff,
    #00f0ff
  );

  box-shadow:
    0 0 30px rgba(0,123,255,.7);

  transition:.2s;
}

.btn-bet:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 45px rgba(0,123,255,.9);
}

.btn-stop{
  display: none;
  background:linear-gradient(
    135deg,
    #ff2d2d,
    #ff6600
  );

  box-shadow:
    0 0 30px rgba(255,0,0,.7);
}

.btn:disabled{
  opacity:.5;
}

/* CRASH FLASH */
.crash-flash{
  position:fixed;
  inset:0;
  background:rgba(255,0,0,.15);
  animation:flash .4s ease 4;
  pointer-events:none;
}

@keyframes flash{
  from{opacity:0}
  to{opacity:1}
}



/* ================= CINEMATIC BOMB ================= */

.bomb-wrap{
  position: relative;
  width: 240px;
  height: 240px;
  margin: 0 auto;

  filter: drop-shadow(0 0 40px rgba(0,255,255,.2));
}

.bomb-body{
  width:240px;
  height:240px;
  border-radius:50%;

  background:
    radial-gradient(circle at 35% 30%,
      #555 0%,
      #222 35%,
      #111 65%,
      #000 100%
    );

  box-shadow:
    inset -25px -25px 60px rgba(0,0,0,.8),
    inset 10px 10px 30px rgba(255,255,255,.08),
    0 0 70px rgba(0,255,255,.25);

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
  transition:.2s;
}


.bomb-body::before{
  content:"";
  position:absolute;
  inset:-10px;
  border-radius:50%;

  background:linear-gradient(
    145deg,
    #666,
    #111
  );

  z-index:-1;
}


.bomb-multi{
  font-size:54px;
  font-weight:900;
  color:#00f0ff;

  text-shadow:
    0 0 10px #00f0ff,
    0 0 25px #00f0ff,
    0 0 45px rgba(0,255,255,.8);

  animation:multiPulse 2.5s ease-in-out infinite;
}

@keyframes multiPulse{
  0%,100%{
    text-shadow:
      0 0 10px #00f0ff,
      0 0 25px #00f0ff,
      0 0 45px rgba(0,255,255,.6);
  }
  50%{
    text-shadow:
      0 0 20px #ffffff,
      0 0 40px #00f0ff,
      0 0 70px rgba(0,255,255,1);
  }
}

.bomb-fuse{
  position:absolute;
  top:-45px;
  left:50%;
  transform:translateX(-50%);

  width:10px;
  height:55px;

  background:linear-gradient(
    180deg,
    #555,
    #222
  );

  border-radius:6px;

  box-shadow:
    inset 0 0 10px rgba(0,0,0,.6);
}


.spark{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);

  width:20px;
  height:20px;
  border-radius:50%;

  background:
    radial-gradient(circle,
      #fff,
      #ffcc00,
      #ff3300
    );

  box-shadow:
    0 0 25px #ff6600,
    0 0 45px #ff0000;

  animation: sparkBlink .3s infinite alternate;
}

@keyframes sparkBlink{
  from{opacity:.6; transform:translateX(-50%) scale(1);}
  to{opacity:1; transform:translateX(-50%) scale(1.25);}
}

/* khi multiplier cao */
.bomb-body.hot{
  box-shadow:
    0 0 100px rgba(255,0,0,.6);
}

/* crash */
.bomb-body.crash{
  background: radial-gradient(circle,#ff0000,#200 70%);
  box-shadow:0 0 120px red;
}


.bet-grid{
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.bet-chip{
  padding:12px;
  border-radius:14px;

  border:1px solid rgba(255,255,255,.08);
  color: white;
  background:rgba(255,255,255,.03);

  font-weight:700;

  transition:.2s;
}

.bet-chip:hover{
  background:rgba(0,255,255,.15);
  box-shadow:0 0 15px rgba(0,255,255,.3);
}

.bet-chip.active{
  background:linear-gradient(135deg,#007bff,#00f0ff);
  border:none;
  box-shadow:
    0 0 25px rgba(0,123,255,.6);
}


.bet-quick{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.quick-btn{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.08);

  background:rgba(255,255,255,.04);

  color:#fff;
  font-weight:700;

  backdrop-filter:blur(8px);

  transition:.2s;
}

.quick-btn:hover{
  background:rgba(0,255,255,.15);
  box-shadow:0 0 20px rgba(0,255,255,.4);
}

.quick-btn.allin{
  background:linear-gradient(135deg,#ff2d2d,#ff6600);
  border:none;
  box-shadow:0 0 25px rgba(255,0,0,.6);
}

.selected-bet-bar{
  margin-bottom:14px;
  padding:12px;
  text-align:center;
  border-radius:16px;

  background:linear-gradient(
    135deg,
    rgba(0,255,255,.1),
    rgba(0,0,0,.5)
  );

  border:1px solid rgba(0,255,255,.25);

  font-weight:700;
  font-size:14px;

  backdrop-filter:blur(10px);

  transition:.25s;
}

.selected-bet-bar.active{
  background:linear-gradient(
    135deg,
    rgba(0,123,255,.6),
    rgba(0,255,255,.3)
  );

  box-shadow:
    0 0 30px rgba(0,123,255,.6),
    inset 0 0 20px rgba(0,255,255,.2);
}

#selectedBetValue{
  font-weight:800;
}

#roundToday{
  font-weight:700;
  color:#00f0ff;
  text-shadow:0 0 8px #00f0ff;
}


/* TIMER TRONG BOMB */

.bomb-timer{
  position:absolute;
  top:22px;
  font-size:18px;
  font-weight:800;
  color:#ffcc00;
  text-shadow:0 0 10px #ff9900;
  animation: pulseTimer 1s infinite;
}

@keyframes pulseTimer{
  0%{ transform:scale(1); opacity:.8;}
  50%{ transform:scale(1.1); opacity:1;}
  100%{ transform:scale(1); opacity:.8;}
}


.tr-history-wrap{
  position:fixed;

  /* 🔥 bám sát header */
  top:calc(90px + env(safe-area-inset-top));

  left:0;
  right:0;

  padding:10px 16px 8px;

background:transparent;
border-top:1px solid rgba(0,255,255,.08);

  z-index:290; /* thấp hơn header 300 */
}

.history-title{
  font-size:11px;
  opacity:.5;
  margin-bottom:6px;
}

.tr-history-bar{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}

.tr-history-bar::-webkit-scrollbar{
  display:none;
}

.tr-history-item{
  min-width:52px;
  padding:6px 0;
  border-radius:20px;
  font-size:12px;
  text-align:center;
  font-weight:700;
  background:#111;
  border:1px solid rgba(255,255,255,.08);
}

.tr-history-item.low{
  color:#ff2d2d;
}

.tr-history-item.mid{
  color:#ff9900;
}

.tr-history-item.high{
  color:#00f0ff;
}



/* STOP dưới bomb */

.stop-wrap{
  position:absolute;
  top:calc(100% - 30px); /* nằm dưới bomb */
  left:50%;
  transform:translateX(-80%);
  width:100%;
  text-align:center;
  pointer-events:none; /* tránh ảnh hưởng layout */
  bottom:-110px; /* neo cố định theo bomb */
}

.stop-wrap .btn-stop-floating{
  pointer-events:auto;
}



/* ================= DETONATE BUTTON ================= */

.btn-stop-floating{
  display: none; 
  width:70px;
  height:70px;
  border-radius:50%;

  font-size:20px;
  font-weight:900;
  letter-spacing:1px;

  border:none;
  cursor:pointer;

  color:#fff;

  background:
    radial-gradient(circle at 30% 30%, #ff4444, #b80000 70%);

  box-shadow:
    inset -10px -15px 30px rgba(0,0,0,.6),
    0 0 60px rgba(255,0,0,.8),
    0 0 120px rgba(255,0,0,.4);

  transition:.15s;
  position:relative;
}

/* outer metal ring */
.btn-stop-floating::before{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:50%;
  background:linear-gradient(145deg,#666,#222);
  z-index:-1;
}

/* glow pulse */
.btn-stop-floating::after{
  content:"";
  position:absolute;
  inset:-25px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,0,0,.6),
    transparent 70%);
  animation:detonatePulse 1.5s infinite;
  z-index:-2;
}

@keyframes detonatePulse{
  0%,100%{ opacity:.5; transform:scale(1);}
  50%{ opacity:1; transform:scale(1.1);}
}

/* press effect */
.btn-stop-floating:active{
  transform:scale(.9);
  box-shadow:
    inset 0 0 50px rgba(0,0,0,.8),
    0 0 40px rgba(255,0,0,.6);
}



/* ===== EXPLOSION EFFECT ===== */

.explosion-ring{
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  border:4px solid rgba(255,0,0,.8);
  animation:explodeRing .6s ease-out forwards;
  pointer-events:none;
}

@keyframes explodeRing{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(2.2);
    opacity:0;
  }
}

.explosion-core{
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#ff0000 60%,transparent 70%);
  animation:explodeCore .4s ease-out forwards;
  pointer-events:none;
}

@keyframes explodeCore{
  from{
    opacity:1;
    transform:scale(1);
  }
  to{
    opacity:0;
    transform:scale(1.6);
  }
}


.tr-bottom.locked{
  opacity:.4;
  pointer-events:none;
  transition:.25s;
}



.btn-stop-floating:disabled{
  filter:grayscale(.5);
  box-shadow:0 0 20px rgba(255,0,0,.3);
}

</style>
</head>
<body>

<div class="tr-header">

  <button class="tr-back" onclick="location.href='/invest.html'">‹</button>

  <div class="tr-head-center">
    <div class="tr-title">Time Race</div>
    <div class="tr-sub">
   Round •
  <span id="roundToday">1</span>
</div>
  </div>

  <div class="tr-right">
    <div class="tr-coins">
      💎 <span id="coinBalance">0</span>
    </div>
  </div>

</div>

<div class="tr-history-wrap">
  <div class="history-title">
    Round History
  </div>

  <div class="tr-history-bar"
       id="timeRaceHistoryBar">
  </div>
</div>



<div class="tr-center">

<div class="bomb-wrap">

<div class="bomb-body">

  <!-- TIMER INSIDE BOMB -->
  <div class="bomb-timer" id="betTimer">
    15
  </div>

  <div id="multiplier" class="bomb-multi">
    x1.00
  </div>

</div>

    <div class="bomb-fuse">
      <div class="spark"></div>
    </div>

  </div>


<div class="stop-wrap">
  <button id="stopBtn" class="btn-stop-floating">
    STOP
  </button>
</div>

</div>






<div class="tr-bottom">

  <div class="selected-bet-bar">
  Selected Bet: 
  <span id="selectedBetValue">0</span> 💎
</div>

  <div class="bet-quick">
  <button class="quick-btn" data-type="25">25%</button>
  <button class="quick-btn" data-type="50">50%</button>
  <button class="quick-btn allin" data-type="all">ALL IN</button>
</div>

  <div class="bet-grid">
    <button class="bet-chip" data-bet="10">10💎</button>
    <button class="bet-chip" data-bet="50">50💎</button>
    <button class="bet-chip" data-bet="100">100💎</button>
    <button class="bet-chip" data-bet="500">500💎</button>
    <button class="bet-chip" data-bet="1000">1000💎</button>
    <button class="bet-chip" data-bet="5000">5000💎</button>
  </div>

  <button id="betBtn" class="btn btn-bet">COMFIRM</button>


</div>

<script>
const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

let deviceId = localStorage.getItem("device_id");
if(!deviceId){
  deviceId="dev_"+Math.random().toString(36).slice(2);
  localStorage.setItem("device_id",deviceId);
}

const socket = io({
  auth:{
    uid:me.uid,
    deviceId
  }
});

let betEndAt = 0;
let crashed = false;
let hasBet = false;
let currentCoins = 0;
let selectedBet = 0;
let serverOffset = 0;
let raceStarted = false;

const multiplierEl = document.getElementById("multiplier");
const betBtn = document.getElementById("betBtn");
const stopBtn = document.getElementById("stopBtn");
const betTimer = document.getElementById("betTimer");
const selectedBetEl = document.getElementById("selectedBetValue");
const selectedBetBar = document.querySelector(".selected-bet-bar");


function serverTime(){
  return Date.now() + serverOffset;
}



function updateSelectedBetDisplay(){
  selectedBetEl.textContent = selectedBet.toLocaleString();

  if(selectedBet > 0){
    selectedBetBar.classList.add("active");
  }else{
    selectedBetBar.classList.remove("active");
  }
}


document.querySelectorAll(".quick-btn").forEach(btn=>{
  btn.onclick = ()=>{

    if(!currentCoins) return;

    const type = btn.dataset.type;
    let bet = 0;

    if(type === "25"){
      bet = Math.floor(currentCoins * 0.25);
    }
    else if(type === "50"){
      bet = Math.floor(currentCoins * 0.5);
    }
    else if(type === "all"){
      bet = currentCoins;
    }

    // highlight chip tương ứng nếu trùng
    document.querySelectorAll(".bet-chip")
      .forEach(b=>b.classList.remove("active"));

    selectedBet = bet;
    updateSelectedBetDisplay();

    // hiệu ứng nháy nhẹ
    btn.animate([
      { transform:"scale(1)" },
      { transform:"scale(1.08)" },
      { transform:"scale(1)" }
    ],{ duration:200 });

  };
});



document.querySelectorAll(".bet-chip").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".bet-chip")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");
    selectedBet = Number(btn.dataset.bet);
    updateSelectedBetDisplay();
  };
});


function updateTimer(){
  if(!betEndAt) return;

  const betPanel = document.querySelector(".tr-bottom");
  const msLeft = betEndAt - serverTime();
  const left = Math.max(0, Math.ceil(msLeft / 1000));

  // hiển thị số giây
  betTimer.textContent = left > 0 ? left : "";

  // ✅ Nếu đã đặt cược rồi -> khóa bet bar luôn, KHÔNG mở lại
  if(hasBet){
    betPanel?.classList.add("locked");
    betBtn.disabled = true;
    return;
  }

  // 🔒 Chưa bet thì mới khóa theo <= 3s
  if(msLeft <= 3000){
    betPanel?.classList.add("locked");
    betBtn.disabled = true;

    betTimer.style.color = "#ff2d2d";
    betTimer.style.textShadow = "0 0 15px red";
  }else{
    betPanel?.classList.remove("locked");
    betBtn.disabled = false;

    betTimer.style.color = "";
    betTimer.style.textShadow = "";
  }

  if(msLeft <= 0){
    betPanel?.classList.add("locked");
    betBtn.disabled = true;
  }
}

setInterval(updateTimer,500);





function renderTimeRaceHistory(list){
  const bar =
    document.getElementById(
      "timeRaceHistoryBar"
    );

  if(!bar) return;

  bar.innerHTML = "";

  list.forEach(h=>{

    const div = document.createElement("div");
    div.className = "tr-history-item";

    const crash = Number(h.crashPoint);

    if(crash < 2){
      div.classList.add("low");
    }
    else if(crash < 5){
      div.classList.add("mid");
    }
    else{
      div.classList.add("high");
    }

    div.textContent =
      "x" + crash.toFixed(2);

    bar.appendChild(div);

  });
}



/* SOCKET EVENTS */

socket.on("time-race-state",data=>{

  // 🔥 tính lệch giờ
  serverOffset = data.serverNow - Date.now();

  betEndAt = data.betEndAt;
  multiplierEl.textContent =
    "x"+Number(data.multiplier).toFixed(2);

  crashed=data.crashed;
});


socket.on("time-race-new", data => {

  // 🔄 RESET LOGIC STATE
  raceStarted = false;
  crashed = false;
  hasBet = false;   // 🔥 đảm bảo reset

  serverOffset = data.serverNow - Date.now();
  betEndAt = data.betEndAt;

  const bomb = document.querySelector(".bomb-body");
  const spark = document.querySelector(".spark");

  const betPanel = document.querySelector(".tr-bottom");
  betPanel.classList.remove("locked");
  /* ================= HARD RESET VISUAL ================= */

  // ❌ remove toàn bộ class trạng thái
  bomb.classList.remove("crash", "hot");

  // ❌ reset inline style hoàn toàn
  bomb.style.cssText = "";
  spark.style.cssText = "";

  // ❌ reset transition để tránh dư animation
  bomb.style.transition = "none";

  // 🔁 force browser repaint
  void bomb.offsetWidth;

  // 🔄 bật lại transition
  bomb.style.transition = "";

  /* ================= RESET UI ================= */

  multiplierEl.classList.remove("crash");
  multiplierEl.textContent = "x1.00";

  selectedBet = 0;
  updateSelectedBetDisplay();

  betBtn.disabled = false;
  stopBtn.style.display = "none";

});


socket.on("time-race-tick",data=>{

  if(crashed) return;

  const m = Number(data.multiplier);

  // 🔒 Chỉ cho phép vẽ hiệu ứng khi multiplier > 1
  if(m <= 1){
    return;
  }


if(hasBet && !raceStarted && !crashed){
  raceStarted = true;

  // 🔓 Cho click khi race bắt đầu
  stopBtn.disabled = false;
  stopBtn.style.opacity = "1";
}
  multiplierEl.textContent = "x" + m.toFixed(2);

  const bomb = document.querySelector(".bomb-body");
  const spark = document.querySelector(".spark");

  // 🔥 Tính độ nóng
  const intensity = Math.min(m / 10, 1);
  const glow = 60 + intensity * 200;
  const redPower = Math.floor(255 * intensity);

  // 🔥 Glow theo multiplier
  bomb.style.boxShadow = `
    inset -15px -15px 40px rgba(0,0,0,.7),
    0 0 ${glow}px rgba(${redPower},0,0,.7)
  `;

  // 🔥 Nền bomb đỏ dần
  bomb.style.background = `
    radial-gradient(circle at 30% 30%, 
    rgb(${80 + redPower/3},${20 - intensity*20},${20 - intensity*20}),
    #0a0a0a 70%)
  `;

  // 🔥 Tia lửa cháy nhanh dần
  spark.style.animationDuration =
    (0.4 - intensity * 0.3) + "s";

});



socket.on("time-race-crash",data=>{

  raceStarted = false;
  crashed = true;

  const bombWrap = document.querySelector(".bomb-wrap");
  const bomb = document.querySelector(".bomb-body");

  // 🔴 đổi trạng thái crash
  bomb.classList.add("crash");

  multiplierEl.textContent =
    "x" + Number(data.crashPoint).toFixed(2);

  /* ================= EXPLOSION ================= */

  // shockwave ring
  const ring = document.createElement("div");
  ring.className = "explosion-ring";
  bombWrap.appendChild(ring);

  // flash core
  const core = document.createElement("div");
  core.className = "explosion-core";
  bombWrap.appendChild(core);

  // remove after animation
  setTimeout(()=>{
    ring.remove();
    core.remove();
  },700);

  /* ================= SHAKE ================= */

  bomb.animate([
    { transform: "scale(1)" },
    { transform: "scale(1.2)" },
    { transform: "scale(.95)" },
    { transform: "scale(1.1)" },
    { transform: "scale(1)" }
  ],{
    duration:500
  });

  /* ================= FLASH SCREEN ================= */

  const flash = document.createElement("div");
  flash.className = "crash-flash";
  document.body.appendChild(flash);
  setTimeout(()=> flash.remove(), 600);

  stopBtn.style.display="none";
});


/* BET */

betBtn.onclick=()=>{
  const bet = selectedBet;
  if(!bet || bet<=0) return;

  socket.emit("time-race-bet",{bet});
};


socket.on("time-race-bet-ok",()=>{
  hasBet = true;

  const betPanel = document.querySelector(".tr-bottom");
  betPanel.classList.add("locked");

  betBtn.disabled = true;

  // 🔥 Hiện STOP ngay nhưng chưa cho click
  stopBtn.style.display = "block";
  stopBtn.disabled = true;
  stopBtn.style.opacity = ".6";
});
/* STOP */

stopBtn.onclick=()=>{
  socket.emit("time-race-stop");
};

socket.on("time-race-stopped",data=>{
  stopBtn.style.display="none";
  multiplierEl.textContent="x"+data.multiplier+" ✔";
});


socket.on("time-race-lost",data=>{
  stopBtn.style.display="none";
  multiplierEl.textContent="THUA x"+data.crashPoint;
});



socket.on("coin-update",data=>{
  currentCoins = Number(data.coins || 0);
  document.getElementById("coinBalance").textContent = currentCoins;
});


socket.on("time-race-round-count", data=>{
  const el = document.getElementById("roundToday");
  if(el){
    el.textContent = data.roundCountToday;
  }
});



socket.on("time-race-history",
  renderTimeRaceHistory
);

socket.on("time-race-history-update",
  renderTimeRaceHistory
);


socket.on("time-race-restore", data=>{

  serverOffset = data.serverNow - Date.now();
  betEndAt = data.betEndAt;
  crashed = data.crashed;
  hasBet = data.hasBet;

  const currentMultiplier = Number(data.multiplier);
  multiplierEl.textContent =
    "x" + currentMultiplier.toFixed(2);

  /* ================= RESTORE BET VALUE ================= */

  if(data.myBet){
    selectedBet = Number(data.myBet);
  }else{
    selectedBet = 0;
  }

  updateSelectedBetDisplay();

  /* ================= RESTORE UI STATE ================= */

  if(hasBet){

    document
      .querySelector(".tr-bottom")
      .classList.add("locked");

    betBtn.disabled = true;

    if(!crashed && !data.stopped){

      stopBtn.style.display = "block";

      if(currentMultiplier <= 1){
        stopBtn.disabled = true;
        stopBtn.style.opacity = ".6";
      }
      else{
        stopBtn.disabled = false;
        stopBtn.style.opacity = "1";
        raceStarted = true;
      }

    }else{
      stopBtn.style.display = "none";
    }

  }else{

    document
      .querySelector(".tr-bottom")
      .classList.remove("locked");

    betBtn.disabled = false;
    stopBtn.style.display = "none";
  }

});

</script>
</body>
