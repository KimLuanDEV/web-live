<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Time Race</title>
<meta name="viewport" 
      content="width=device-width, initial-scale=1, 
               maximum-scale=1, minimum-scale=1, 
               user-scalable=no">   
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="portrait">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>

<style>
html,body{
  margin:0;
  padding:0;

  background:
  radial-gradient(circle at 50% 30%,
    rgba(0,255,255,.15),
    rgba(0,0,0,.95) 60%
  ),
  url('/assets/bg/time-race-bg.jpg') center/cover no-repeat fixed;

background-blend-mode: screen;


  font-family:system-ui;
  color:#fff;
  overflow:hidden;

 touch-action: manipulation;
  overscroll-behavior: none;

}


body::before{
  content:"";
  position:fixed;
  inset:0;

  background:
    radial-gradient(circle at 50% 40%,
      rgba(0,0,0,.2),
      rgba(0,0,0,.7) 70%
    );

  pointer-events:none;
  z-index:-1;
}


body{
  animation:bgMove 20s linear infinite;
}

@keyframes bgMove{
  0%{ background-position:0% 0%; }
  50%{ background-position:50% 50%; }
  100%{ background-position:0% 0%; }
}

/* HEADER PRO */

/* ================= GLASS NEON HEADER LEVEL 2 ================= */

/* ================= LEVEL 3 CINEMATIC HEADER ================= */

.tr-header{
  position:fixed;
  top:0;
  left:0;
  right:0;

  /* Safe zone + cân giữa */
  padding-top:calc(env(safe-area-inset-top) + 10px);
  padding-left:16px;
  padding-right:16px;
  padding-bottom:14px;

  height:calc(90px + env(safe-area-inset-top));

  display:flex;
  align-items:center;      /* 🔥 QUAN TRỌNG: căn giữa dọc */
  justify-content:space-between;

  background:linear-gradient(
    120deg,
    rgba(0,30,60,.85),
    rgba(0,0,0,.95),
    rgba(0,30,60,.85)
  );

  background-size:200% 200%;
  animation:headerFlow 8s ease infinite;

  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);

  border-bottom:1px solid rgba(0,255,255,.25);

  box-shadow:
    0 0 60px rgba(0,255,255,.15),
    inset 0 0 40px rgba(0,255,255,.05);

  overflow:hidden;
  z-index:300;
}

@keyframes headerFlow{
  0%{ background-position:0% 50%; }
  50%{ background-position:100% 50%; }
  100%{ background-position:0% 50%; }
}

.tr-header::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 40%, rgba(0,255,255,.2) 0%, transparent 60%),
    radial-gradient(circle at 80% 20%, rgba(0,255,255,.15) 0%, transparent 60%),
    radial-gradient(circle at 50% 80%, rgba(0,255,255,.1) 0%, transparent 60%);
  animation:particleMove 10s linear infinite;
  pointer-events:none;
  opacity:.6;
}

@keyframes particleMove{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-10px); }
  100%{ transform:translateY(0); }
}


.tr-header::after{
  content:"";
  position:absolute;
  bottom:0;
  left:-50%;
  width:200%;
  height:3px;

  background:linear-gradient(
    90deg,
    transparent,
    #00f0ff,
    #00ffff,
    transparent
  );

  animation:neonSlide 4s linear infinite;
}

@keyframes neonSlide{
  from{ transform:translateX(0);}
  to{ transform:translateX(50%);}
}

.tr-back{
  position:relative;
  z-index:2;

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:16px;

  border:1px solid rgba(0,255,255,.25);
  background:rgba(255,255,255,.06);

  color:#fff;
  font-size:20px;
  font-weight:700;

  cursor:pointer;

  backdrop-filter:blur(10px);

  box-shadow:
    0 0 20px rgba(0,255,255,.3),
    inset 0 0 12px rgba(0,255,255,.1);

  transition:.2s;
}

.tr-back:hover{
  transform:scale(1.08);
  box-shadow:
    0 0 30px rgba(0,255,255,.6);
}

.tr-head-center{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  width:200px;
}


.tr-title{
  font-weight:900;
  font-size:18px;
  letter-spacing:.7px;

  background:linear-gradient(
    90deg,
    #00f0ff,
    #ffffff,
    #00f0ff
  );
  background-size:200%;

  background-clip:text;
  -webkit-background-clip:text;

  color:transparent;
  -webkit-text-fill-color:transparent;

  animation:titleShimmer 4s linear infinite;
}

@keyframes titleShimmer{
  from{ background-position:0%;}
  to{ background-position:200%;}
}

@keyframes neonPulse{
  0%,100%{ opacity:.9; }
  50%{ opacity:1; }
}

.tr-sub{
  font-size:12px;
  opacity:.75;
  margin-top:4px;
  letter-spacing:.5px;
}

.tr-right{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:8px;
}

.tr-coins{
  padding:10px 16px;
  border-radius:20px;

  background:linear-gradient(
    135deg,
    rgba(0,255,255,.2),
    rgba(0,0,0,.4)
  );

  border:1px solid rgba(0,255,255,.4);

  font-weight:800;

  box-shadow:
    0 0 25px rgba(0,255,255,.4),
    inset 0 0 15px rgba(0,255,255,.15);

  backdrop-filter:blur(12px);

  animation:coinPulse 3s ease-in-out infinite;
}

@keyframes coinPulse{
  0%,100%{ box-shadow:0 0 25px rgba(0,255,255,.3); }
  50%{ box-shadow:0 0 45px rgba(0,255,255,.8); }
}

.tr-coins:hover{
  box-shadow:
    0 0 40px rgba(0,255,255,.6);
}

.tr-timer-badge{
  background:#007bff;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}


/* CENTER */
.tr-center{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.multiplier{
  font-size:64px;
  font-weight:800;
  text-shadow:0 0 25px #00f0ff;
  transition:.1s;
}

.multiplier.big{
  font-size:80px;
}

.multiplier.crash{
  color:#ff2d2d;
  text-shadow:0 0 30px red;
}

/* BET PANEL */
.tr-bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  padding:18px 16px calc(20px + env(safe-area-inset-bottom));

  background:linear-gradient(
    180deg,
    rgba(10,10,25,.95),
    rgba(0,0,0,.98)
  );

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-top:1px solid rgba(0,255,255,.15);

  box-shadow:
    0 -10px 40px rgba(0,255,255,.08);

  z-index:200;
}

.bet-input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#111;
  color:#fff;
  margin-bottom:12px;
  font-size:16px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.btn-bet{
  background:linear-gradient(
    135deg,
    #007bff,
    #00f0ff
  );

  box-shadow:
    0 0 30px rgba(0,123,255,.7);

  transition:.2s;
}

.btn-bet:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 45px rgba(0,123,255,.9);
}

.btn-stop{
  display: none;
  background:linear-gradient(
    135deg,
    #ff2d2d,
    #ff6600
  );

  box-shadow:
    0 0 30px rgba(255,0,0,.7);
}

.btn:disabled{
  opacity:.5;
}

/* CRASH FLASH */
.crash-flash{
  position:fixed;
  inset:0;
  background:rgba(255,0,0,.15);
  animation:flash .4s ease 4;
  pointer-events:none;
}

@keyframes flash{
  from{opacity:0}
  to{opacity:1}
}

/* ================= ULTRA CYBER BOMB ================= */

.bomb-wrap{
  position:relative;
  width:260px;
  height:260px;
  margin:0 auto;
}


.bomb-img{
  width:260px;
  height:auto;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  filter:
    drop-shadow(0 0 30px #00f0ff)
    drop-shadow(0 0 80px rgba(0,255,255,.5));
}




/* TIMER TRONG BOMB */

.bomb-timer{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-60%);

  font-size:16px;
  font-weight:900;

  font-family:"Orbitron", monospace; /* digital style */

  letter-spacing:2px;

  color:#ff0000;

  text-shadow:
    0 0 10px #00f0ff,
    0 0 25px #00f0ff,
    0 0 50px rgba(0,255,255,.7);
}






/* 🔵 outer glow */
.bomb-core-glow{
  position:absolute;
  inset:-40px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,255,255,.4),
    transparent 70%);
  filter:blur(40px);
  animation:corePulse 3s ease-in-out infinite;
  z-index:-2;
}

@keyframes corePulse{
  0%,100%{ opacity:.6; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.1); }
}



/* 💎 multiplier */
.bomb-multi{
  display:none;   /* thêm dòng này */
  position:absolute;
  top:49%;
  left:50%;
  transform:translate(-50%, -50%);
  z-index:5;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;

  background:linear-gradient(
    90deg,
    #00f0ff,
    #ffffff,
    #00f0ff
  );

  background-size:200%;
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;

  animation:multiShine 3s linear infinite;
}

@keyframes multiShine{
  from{ background-position:0%; }
  to{ background-position:200%; }
}




.bet-grid{
  display:grid;
  grid-template-columns: repeat(3,1fr);
  gap:10px;
  margin-bottom:14px;
}

.bet-chip{
  padding:12px;
  border-radius:14px;

  border:1px solid rgba(255,255,255,.08);
  color: white;
  background:rgba(255,255,255,.03);

  font-weight:700;

  transition:.2s;
}

.bet-chip:hover{
  background:rgba(0,255,255,.15);
  box-shadow:0 0 15px rgba(0,255,255,.3);
}

.bet-chip.active{
  background:linear-gradient(135deg,#007bff,#00f0ff);
  border:none;
  box-shadow:
    0 0 25px rgba(0,123,255,.6);
}


.bet-quick{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.quick-btn{
  flex:1;
  padding:12px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.08);

  background:rgba(255,255,255,.04);

  color:#fff;
  font-weight:700;

  backdrop-filter:blur(8px);

  transition:.2s;
}

.quick-btn:hover{
  background:rgba(0,255,255,.15);
  box-shadow:0 0 20px rgba(0,255,255,.4);
}

.quick-btn.allin{
  background:linear-gradient(135deg,#ff2d2d,#ff6600);
  border:none;
  box-shadow:0 0 25px rgba(255,0,0,.6);
}

.selected-bet-bar{
  margin-bottom:14px;
  padding:12px;
  text-align:center;
  border-radius:16px;

  background:linear-gradient(
    135deg,
    rgba(0,255,255,.1),
    rgba(0,0,0,.5)
  );

  border:1px solid rgba(0,255,255,.25);

  font-weight:700;
  font-size:14px;

  backdrop-filter:blur(10px);

  transition:.25s;
}

.selected-bet-bar.active{
  background:linear-gradient(
    135deg,
    rgba(0,123,255,.6),
    rgba(0,255,255,.3)
  );

  box-shadow:
    0 0 30px rgba(0,123,255,.6),
    inset 0 0 20px rgba(0,255,255,.2);
}

#selectedBetValue{
  font-weight:800;
}

#roundToday{
  font-weight:700;
  color:#00f0ff;
  text-shadow:0 0 8px #00f0ff;
}



/* ================= CYBER ROUND HISTORY ================= */

.tr-history-wrap{
  position:fixed;
  top:calc(90px + env(safe-area-inset-top));
  left:0;
  right:0;

  padding:12px 16px 10px;

  background:linear-gradient(
    180deg,
    rgba(0,20,40,.6),
    rgba(0,0,0,.4)
  );

  backdrop-filter:blur(14px);

  border-bottom:1px solid rgba(0,255,255,.15);

  box-shadow:
    0 8px 30px rgba(0,255,255,.08);

  z-index:290;
}

/* title */
.history-title{
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:700;
  margin-bottom:8px;

  background:linear-gradient(
    90deg,
    #00f0ff,
    #ffffff,
    #00f0ff
  );
  background-size:200%;
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;

  animation:titleShimmer 4s linear infinite;
}

/* bar */
.tr-history-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scroll-behavior:smooth;
  padding-bottom:2px;
}

.tr-history-bar::-webkit-scrollbar{
  display:none;
}

/* item */
.tr-history-item{
  min-width:58px;
  padding:8px 0;
  border-radius:22px;

  font-size:13px;
  font-weight:800;
  text-align:center;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.05),
      rgba(0,0,0,.4)
    );

  box-shadow:
    inset 0 0 12px rgba(0,255,255,.05);

  transition:.2s;
}

/* LOW (<2x) */
.tr-history-item.low{
  color:#ff2d2d;
  border-color:rgba(255,0,0,.3);
  box-shadow:
    0 0 12px rgba(255,0,0,.4);
}

/* MID (2-5x) */
.tr-history-item.mid{
  color:#ff9900;
  border-color:rgba(255,165,0,.3);
  box-shadow:
    0 0 12px rgba(255,165,0,.4);
}

/* HIGH (>5x) */
.tr-history-item.high{
  color:#00f0ff;
  border-color:rgba(0,255,255,.5);
  box-shadow:
    0 0 20px rgba(0,255,255,.6);

  animation:historyHighPulse 2s infinite;
}

@keyframes historyHighPulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.08); }
}

/* hover effect */
.tr-history-item:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 25px rgba(0,255,255,.8);
}


/* STOP dưới bomb */

.stop-wrap{
  position:absolute;
  top:calc(100% - 50px); /* nằm dưới bomb */
  left:50%;
  transform:translateX(-75%);
  width:100%;
  text-align:center;
  pointer-events:none; /* tránh ảnh hưởng layout */
  bottom:-110px; /* neo cố định theo bomb */
}

.stop-wrap .btn-stop-floating{
  pointer-events:auto;
}



/* ================= CYBER STOP BUTTON V2 ================= */

.btn-stop-floating{
  display: none;
  width:88px;
  height:88px;
  border-radius:50%;

  position:relative;
  cursor:pointer;
  border:none;

  font-size:14px;
  font-weight:900;
  letter-spacing:2px;

  color:#fff;

  background:
    radial-gradient(circle at 30% 30%, #ff3b3b, #7a0000 70%);

  box-shadow:
    inset -15px -20px 40px rgba(0,0,0,.7),
    0 0 40px rgba(255,0,0,.6);

  transition:.2s;
}



/* glow pulse */
.btn-stop-floating::after{
  content:"";
  position:absolute;
  inset:-30px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,0,0,.5),
    transparent 70%);
  animation:stopPulse 1.5s infinite;
  z-index:-1;
}

@keyframes stopPulse{
  0%,100%{ opacity:.4; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.15); }
}

/* hover */
.btn-stop-floating:hover{
  transform:scale(1.08);
  box-shadow:
    0 0 70px rgba(255,0,0,.9);
}

/* press */
.btn-stop-floating:active{
  transform:scale(.9);
  box-shadow:
    inset 0 0 60px rgba(0,0,0,.9),
    0 0 40px rgba(255,0,0,.7);
}

/* disabled state */
.btn-stop-floating:disabled{
  filter:grayscale(.6);
  opacity:.6;
  box-shadow:
    0 0 20px rgba(255,0,0,.3);
}


/* ===== EXPLOSION EFFECT ===== */

.explosion-ring{
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  border:4px solid rgba(255,0,0,.8);
  animation:explodeRing .6s ease-out forwards;
  pointer-events:none;
}

@keyframes explodeRing{
  from{
    transform:scale(1);
    opacity:1;
  }
  to{
    transform:scale(2.2);
    opacity:0;
  }
}

.explosion-core{
  position:absolute;
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,#fff,#ff0000 60%,transparent 70%);
  animation:explodeCore .4s ease-out forwards;
  pointer-events:none;
}

@keyframes explodeCore{
  from{
    opacity:1;
    transform:scale(1);
  }
  to{
    opacity:0;
    transform:scale(1.6);
  }
}


.tr-bottom.locked{
  opacity:.4;
  pointer-events:none;
  transition:.25s;
}



.btn-stop-floating:disabled{
  filter:grayscale(.5);
  box-shadow:0 0 20px rgba(255,0,0,.3);
}


.bomb-wrap.exploded{
  animation: bombVanish .4s forwards;
}

@keyframes bombVanish{
  to{
    opacity:0;
    transform:scale(1.4);
  }
}


/* ===== BOMB FRAGMENTS ===== */

.bomb-fragment{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:4px;

  background:radial-gradient(circle,
    #444,
    #111 70%
  );

  box-shadow:
    0 0 20px rgba(255,0,0,.7);

  pointer-events:none;
}

@keyframes fragmentFly{
  to{
    transform:
      translate(var(--x), var(--y))
      rotate(720deg);
    opacity:0;
  }
}


/* ===== SLOW MOTION EFFECT ===== */

body.slowmo *,
body.slowmo *::before,
body.slowmo *::after{
  animation-duration: calc(var(--origDur, 1s) * 2) !important;
  transition-duration: .2s !important;
}

body.slowmo{
  transform: scale(1.02);
  transition: transform .2s ease;
}



/* ===== MULTIPLIER CRASH GLOW ===== */

.bomb-multi.crash-red{
  background:none !important;
  -webkit-text-fill-color:#ff2d2d !important;
  color:#ff2d2d !important;

  text-shadow:
    0 0 10px #ff0000,
    0 0 25px #ff0000,
    0 0 50px #ff0000,
    0 0 90px rgba(255,0,0,.9);

  animation:crashPulse .6s ease-in-out infinite;
}

@keyframes crashPulse{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.12);
  }
}


/* ===== CRASH BACKGROUND GLOW ===== */

.crash-bg-glow{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:150;

  background:
    radial-gradient(circle at 50% 50%,
      rgba(255,0,0,.6),
      rgba(255,0,0,.35) 30%,
      rgba(255,0,0,.15) 55%,
      transparent 75%
    );

  animation:crashBgPulse .6s ease-out forwards;
}

@keyframes crashBgPulse{
  0%{
    opacity:0;
    transform:scale(.6);
  }
  40%{
    opacity:1;
    transform:scale(1.1);
  }
  100%{
    opacity:0;
    transform:scale(1.6);
  }
}


/* ===== DARK RED BACKGROUND MODE ===== */

body.crash-dark{
  background:
    radial-gradient(circle at 50% 30%,
      rgba(255,0,0,.35),
      rgba(30,0,0,.95) 60%
    ),
    url('/assets/bg/time-race-bg.jpg') center/cover no-repeat fixed;

  background-blend-mode: overlay;

  transition: background 1s ease;
}


/* ================= CYBER HISTORY BUTTON ================= */

.tr-history-btn{
  width:70px;
  height:70px;
  border-radius:50%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;

  border:1px solid rgba(0,255,255,.4);

  background:
    radial-gradient(circle at 30% 30%,
      rgba(0,255,255,.3),
      rgba(0,0,0,.6)
    );

  backdrop-filter:blur(12px);

  cursor:pointer;

  box-shadow:
    0 0 25px rgba(0,255,255,.5),
    inset 0 0 15px rgba(0,255,255,.2);

  transition:.2s;
  position:relative;
}

/* outer pulse */
.tr-history-btn::after{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(0,255,255,.5),
    transparent 70%);
  animation:historyPulse 2s infinite;
  z-index:-1;
}

@keyframes historyPulse{
  0%,100%{ opacity:.4; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.15); }
}

/* icon */
.tr-history-icon{
  width:18px;
  height:18px;
  border:2px solid #00f0ff;

<script>
  
const me = JSON.parse(localStorage.getItem("user_profile")||"{}");

let deviceId = localStorage.getItem("device_id");
if(!deviceId){
  deviceId="dev_"+Math.random().toString(36).slice(2);
  localStorage.setItem("device_id",deviceId);
}

const socket = io({
  auth:{
    uid:me.uid,
    deviceId
  }
});

let betEndAt = 0;
let crashed = false;
let hasBet = false;
let currentCoins = 0;
let selectedBet = 0;
let serverOffset = 0;
let raceStarted = false;

const multiplierEl = document.getElementById("multiplier");
const betBtn = document.getElementById("betBtn");
const stopBtn = document.getElementById("stopBtn");
const betTimer = document.getElementById("betTimer");
const selectedBetEl = document.getElementById("selectedBetValue");
const selectedBetBar = document.querySelector(".selected-bet-bar");

const maxFuseHeight = 60; // phải khớp CSS




function showTimeRaceWinModal(multiplier, amount){

  document.getElementById("winMultiplier")
    .textContent = Number(multiplier).toFixed(2);

  document.getElementById("winAmount")
    .textContent = Number(amount).toLocaleString();

  document
    .getElementById("timeRaceWinModal")
    .classList.remove("hidden");

  // hiệu ứng glow toàn màn
  document.body.animate([
    { boxShadow:"0 0 0 rgba(0,255,255,0)" },
    { boxShadow:"0 0 100px rgba(0,255,255,.8)" },
    { boxShadow:"0 0 0 rgba(0,255,255,0)" }
  ],{ duration:600 });

}

function closeTimeRaceWinModal(){
  document
    .getElementById("timeRaceWinModal")
    .classList.add("hidden");
}



function serverTime(){
  return Date.now() + serverOffset;
}



function updateSelectedBetDisplay(){
  selectedBetEl.textContent = selectedBet.toLocaleString();

  if(selectedBet > 0){
    selectedBetBar.classList.add("active");
  }else{
    selectedBetBar.classList.remove("active");
  }
}


document.querySelectorAll(".quick-btn").forEach(btn=>{
  btn.onclick = ()=>{

    if(!currentCoins) return;

    const type = btn.dataset.type;
    let bet = 0;

    if(type === "25"){
      bet = Math.floor(currentCoins * 0.25);
    }
    else if(type === "50"){
      bet = Math.floor(currentCoins * 0.5);
    }
    else if(type === "all"){
      bet = currentCoins;
    }

    // highlight chip tương ứng nếu trùng
    document.querySelectorAll(".bet-chip")
      .forEach(b=>b.classList.remove("active"));

    selectedBet = bet;
    updateSelectedBetDisplay();

    // hiệu ứng nháy nhẹ
    btn.animate([
      { transform:"scale(1)" },
      { transform:"scale(1.08)" },
      { transform:"scale(1)" }
    ],{ duration:200 });

  };
});



document.querySelectorAll(".bet-chip").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".bet-chip")
      .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");
    selectedBet = Number(btn.dataset.bet);
    updateSelectedBetDisplay();
  };
});


function updateTimer(){
  if(!betEndAt) return;

  const betPanel = document.querySelector(".tr-bottom");

const msLeft = betEndAt - serverTime();

if(msLeft > 0){

  const seconds = Math.floor(msLeft / 1000);
  const ms = Math.floor((msLeft % 1000) / 10); // 2 digit ms

  betTimer.textContent =
    seconds.toString().padStart(2,"0") +
    ":" +
    ms.toString().padStart(2,"0");

}else{
  betTimer.textContent = "";
}




  // ✅ Nếu đã đặt cược rồi -> khóa bet bar luôn, KHÔNG mở lại
  if(hasBet){
    betPanel?.classList.add("locked");
    betBtn.disabled = true;
    return;
  }

  // 🔒 Chưa bet thì mới khóa theo <= 3s
  if(msLeft <= 3000){
    betPanel?.classList.add("locked");
    betBtn.disabled = true;

    betTimer.style.color = "#ff2d2d";
    betTimer.style.textShadow = "0 0 15px red";
  }else{
    betPanel?.classList.remove("locked");
    betBtn.disabled = false;

    betTimer.style.color = "";
    betTimer.style.textShadow = "";
  }

  if(msLeft <= 0){
    betPanel?.classList.add("locked");
    betBtn.disabled = true;
  }
}

setInterval(updateTimer,16);





function renderTimeRaceHistory(list){
  const bar =
    document.getElementById(
      "timeRaceHistoryBar"
    );

  if(!bar) return;

  bar.innerHTML = "";

  list.forEach(h=>{

    const div = document.createElement("div");
    div.className = "tr-history-item";

    const crash = Number(h.crashPoint);

    if(crash < 2){
      div.classList.add("low");
    }
    else if(crash < 5){
      div.classList.add("mid");
    }
    else{
      div.classList.add("high");
    }

    div.textContent =
      "x" + crash.toFixed(2);

    bar.appendChild(div);

  });
}



function openTimeRaceHistory(){
  document
    .getElementById("timeRaceHistorySheet")
    .classList.remove("hidden");

  socket.emit("time-race-get-my-history");
}


function closeTimeRaceHistory(){
  document
    .getElementById("timeRaceHistorySheet")
    .classList.add("hidden");
}





/* SOCKET EVENTS */

socket.on("time-race-my-history", list=>{
  renderMyHistory(list);
});

function renderMyHistory(list){

  const wrap =
    document.getElementById("timeRaceHistoryList");

  if(!wrap) return;

  wrap.innerHTML = "";

  if(!list.length){
    wrap.innerHTML =
      "<div style='opacity:.6;text-align:center'>No history yet</div>";
    return;
  }

  list.forEach(h=>{

    const item = document.createElement("div");
    item.className = "tr-history-item-card";

item.innerHTML = `
  <div>#${h.roundId}</div>
  <div>${h.bet} 💎</div>
  <div>x${Number(h.stopMultiplier).toFixed(2)}</div>
<div style="color:${h.result === 'win' ? '#00f0ff' : '#ff2d2d'};font-weight:700">
  ${h.result === 'win' ? '✔ +' + h.win : '✖ LOSE'}
</div>
`;

    wrap.appendChild(item);
  });
}



socket.on("time-race-state",data=>{

  // 🔥 tính lệch giờ
  serverOffset = data.serverNow - Date.now();

  betEndAt = data.betEndAt;
  multiplierEl.textContent =
    "x"+Number(data.multiplier).toFixed(2);

  crashed=data.crashed;
});


socket.on("time-race-new", data => {

  // 🔥 Hiện lại bomb nếu vừa crash
  const bombWrap = document.querySelector(".bomb-wrap");
  const bomb = document.querySelector(".bomb-img");
  const glow = document.querySelector(".bomb-core-glow");


  bombWrap.classList.remove("exploded");

  if(bomb) bomb.style.display = "";
  if(glow) glow.style.display = "";
 

  // ================= RESET LOGIC STATE =================
  raceStarted = false;
  crashed = false;
  hasBet = false;

  serverOffset = data.serverNow - Date.now();
  betEndAt = data.betEndAt;

  const betPanel = document.querySelector(".tr-bottom");
  betPanel.classList.remove("locked");

  /* ================= HARD RESET VISUAL ================= */

  bomb.classList.remove("crash", "hot");

  bomb.style.cssText = "";
 

  bomb.style.transition = "none";
  void bomb.offsetWidth;
  bomb.style.transition = "";



  /* ================= RESET UI ================= */



  multiplierEl.classList.remove("crash");
  multiplierEl.classList.remove("crash-red");
  multiplierEl.textContent = "x1.00";
  multiplierEl.style.display = "none";

  selectedBet = 0;
  updateSelectedBetDisplay();

  betBtn.disabled = false;
  stopBtn.style.display = "none";
});

socket.on("time-race-tick",data=>{

  if(crashed) return;

  const m = Number(data.multiplier);

  // 🔒 Chỉ cho phép vẽ hiệu ứng khi multiplier > 1
 if(m <= 1){
  multiplierEl.style.display = "none";
  return;
}

multiplierEl.style.display = "block";


if(hasBet && !raceStarted && !crashed){
  raceStarted = true;

  // 🔓 Cho click khi race bắt đầu
  stopBtn.disabled = false;
  stopBtn.style.opacity = "1";
}
  multiplierEl.textContent = "x" + m.toFixed(2);

  const bomb = document.querySelector(".bomb-img")


});

socket.on("time-race-crash",data=>{

  raceStarted = false;
  crashed = true;

  const bombWrap = document.querySelector(".bomb-wrap");
  const bomb = document.querySelector(".bomb-img")
  const glow = document.querySelector(".bomb-core-glow");

  bomb.classList.add("crash");

  multiplierEl.textContent =
    "x" + Number(data.crashPoint).toFixed(2);

  multiplierEl.classList.add("crash-red");

/* ================= BACKGROUND RED SHOCK ================= */

const bgGlow = document.createElement("div");
bgGlow.className = "crash-bg-glow";
document.body.appendChild(bgGlow);

setTimeout(()=>{
  bgGlow.remove();
},600);


/* ================= DARK RED MODE 1s ================= */

document.body.classList.add("crash-dark");

setTimeout(()=>{
  document.body.classList.remove("crash-dark");
},1000);




  /* ================= EXPLOSION CORE ================= */

  const ring = document.createElement("div");
  ring.className = "explosion-ring";
  bombWrap.appendChild(ring);

  const core = document.createElement("div");
  core.className = "explosion-core";
  bombWrap.appendChild(core);

  /* ================= FRAGMENTS ================= */

  const fragmentCount = 14;

  for(let i=0;i<fragmentCount;i++){

    const frag = document.createElement("div");
    frag.className = "bomb-fragment";

    const angle = Math.random() * Math.PI * 2;
    const distance = 150 + Math.random()*120;

    const x = Math.cos(angle) * distance + "px";
    const y = Math.sin(angle) * distance + "px";

    frag.style.setProperty("--x", x);
    frag.style.setProperty("--y", y);

    frag.style.left = "50%";
    frag.style.top = "50%";
    frag.style.transform = "translate(-50%, -50%)";
    frag.style.animation = "fragmentFly 700ms ease-out forwards";

    bombWrap.appendChild(frag);

    setTimeout(()=>frag.remove(),700);
  }

  setTimeout(()=>{
    ring.remove();
    core.remove();
  },600);

  /* ================= SLOW MOTION 0.2s ================= */

  // Freeze nhẹ + zoom cinematic
  document.body.style.transition = "transform 0.2s ease";
  document.body.style.transform = "scale(1.03)";

  bomb.style.transition = "transform 0.2s ease";
  bomb.style.transform = "scale(1.1)";

  /* ================= SCREEN SHAKE ================= */

  document.body.animate([
    { transform:"translateX(0px)" },
    { transform:"translateX(6px)" },
    { transform:"translateX(-6px)" },
    { transform:"translateX(0px)" }
  ],{ duration:200 });

  /* ================= HIDE AFTER 0.2s ================= */

  setTimeout(()=>{

    document.body.style.transform = "";
    bomb.style.transform = "";

    bomb.style.display = "none";
    if(glow) glow.style.display = "none";

  },200);

  /* ================= MULTI POP ================= */

  multiplierEl.animate([
    { transform:"scale(1)" },
    { transform:"scale(1.6)" },
    { transform:"scale(1)" }
  ],{ duration:500 });

  stopBtn.style.display="none";
});


/* BET */

betBtn.onclick=()=>{
  const bet = selectedBet;
  if(!bet || bet<=0) return;

  socket.emit("time-race-bet",{bet});
};


socket.on("time-race-bet-ok",()=>{
  hasBet = true;

  const betPanel = document.querySelector(".tr-bottom");
  betPanel.classList.add("locked");

  betBtn.disabled = true;

  // 🔥 Hiện STOP ngay nhưng chưa cho click
  stopBtn.style.display = "block";
  stopBtn.disabled = true;
  stopBtn.style.opacity = ".6";
});
/* STOP */

stopBtn.onclick=()=>{
  socket.emit("time-race-stop");
};


socket.on("time-race-stopped",data=>{

  stopBtn.style.display="none";

  multiplierEl.textContent =
    "x" + Number(data.multiplier).toFixed(2);

  const winAmount = data.win || 0;

  showTimeRaceWinModal(
    data.multiplier,
    winAmount
  );

});


socket.on("time-race-lost",data=>{
  stopBtn.style.display="none";
  multiplierEl.textContent="THUA x"+data.crashPoint;
});



socket.on("coin-update",data=>{
  currentCoins = Number(data.coins || 0);
  document.getElementById("coinBalance").textContent = currentCoins;
});


socket.on("time-race-round-count", data=>{
  const el = document.getElementById("roundToday");
  if(el){
    el.textContent = data.roundCountToday;
  }
});



socket.on("time-race-history",
  renderTimeRaceHistory
);

socket.on("time-race-history-update",
  renderTimeRaceHistory
);


socket.on("time-race-restore", data=>{

  serverOffset = data.serverNow - Date.now();
  betEndAt = data.betEndAt;
  crashed = data.crashed;
  hasBet = data.hasBet;

  const currentMultiplier = Number(data.multiplier);
  multiplierEl.textContent =
    "x" + currentMultiplier.toFixed(2);

  /* ================= RESTORE BET VALUE ================= */

  if(data.myBet){
    selectedBet = Number(data.myBet);
  }else{
    selectedBet = 0;
  }

  updateSelectedBetDisplay();

  /* ================= RESTORE UI STATE ================= */

  if(hasBet){

    document
      .querySelector(".tr-bottom")
      .classList.add("locked");

    betBtn.disabled = true;

    if(!crashed && !data.stopped){

      stopBtn.style.display = "block";

      if(currentMultiplier <= 1){
        stopBtn.disabled = true;
        stopBtn.style.opacity = ".6";
      }
      else{
        stopBtn.disabled = false;
        stopBtn.style.opacity = "1";
        raceStarted = true;
      }

    }else{
      stopBtn.style.display = "none";
    }

  }else{

    document
      .querySelector(".tr-bottom")
      .classList.remove("locked");

    betBtn.disabled = false;
    stopBtn.style.display = "none";
  }

});



// 🔒 Prevent double tap zoom
let lastTouchEnd = 0;

document.addEventListener("touchend", function (event) {
  const now = (new Date()).getTime();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, false);


// 🔒 Lock portrait orientation
if (screen.orientation && screen.orientation.lock) {
  screen.orientation.lock("portrait").catch(()=>{});
}



/* ================= LOADER ================= */

const progress = document.getElementById("loadingProgress");
const text = document.getElementById("loadingText");

let load = 0;

const loadingSteps = [
  "Initializing engine...",
  "Loading assets...",
  "Connecting server...",
  "Syncing game state...",
  "Preparing bomb..."
];

const interval = setInterval(()=>{

  load += Math.random()*15;

  if(load >= 100){
    load = 100;
    clearInterval(interval);

    text.innerText = "Ready";

    setTimeout(()=>{
      const overlay = document.getElementById("loadingOverlay");
      overlay.style.opacity = "0";

      setTimeout(()=>{
        overlay.remove();
      },600);

    },500);
  }

  progress.style.width = load + "%";

  const stepIndex = Math.floor(load / 25);
  text.innerText = loadingSteps[Math.min(stepIndex, loadingSteps.length-1)];

},400);



</script>
