<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Police Statistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
background:#000;
color:#fff;
font-family:system-ui;
padding:20px;
}

h2{
color:#00cfff;
}

.stat-box{
background:#020617;
border:1px solid #00aaff;
padding:16px;
margin-bottom:16px;
border-radius:10px;
}

.result-list{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.result{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
background:#001a33;
border-radius:8px;
font-weight:900;
}



.bar{
height:8px;
background:#00aaff;
}


.round-info{
display:flex;
justify-content:space-between;
align-items:center;
text-align:center;
}

.round-info .label{
font-size:12px;
opacity:.6;
margin-bottom:4px;
}

#roundId{
font-size:22px;
font-weight:700;
}

#roundTimer{
font-size:28px;
font-weight:900;
color:#00eaff;
}

#roundResult{
width:60px;
height:60px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.round-left,
.round-center,
.round-right{
flex:1;
}


.result-img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}


.miss-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:10px;
}

.miss-box{
background:#001a33;
border-radius:10px;
padding:10px;
text-align:center;
}

.miss-box img{
width:40px;
height:40px;
object-fit:contain;
display:block;
margin:auto;
}

.miss-count{
font-size:20px;
font-weight:900;
margin-top:4px;
color:#00eaff;
}

.miss-hot{
color:#ff3b3b;
}



</style>
</head>

<body>

<h2>POLICE STATISTICS</h2>



<div class="stat-box round-info">

<div class="round-left">
<div class="label">ROUND</div>
<div id="roundId">--</div>
</div>

<div class="round-center">
<div class="label">TIME LEFT</div>
<div id="roundTimer">--</div>
</div>

<div class="round-right">
<div class="label">RESULT</div>
<div id="roundResult">?</div>
</div>

</div>



<div class="stat-box">
<h3>LAST RESULTS</h3>
<div id="lastResults" class="result-list"></div>
</div>

<div class="stat-box">
<h3>SLOT MISS COUNT</h3>
<div id="slotMiss" class="miss-grid"></div>
</div>


<script>

const socket = io()


let roundResultResetTimer = null


socket.on("wheel8-history",list=>{

renderStats(list)

})


function renderStats(list){

renderLast(list)

renderMiss(list)

}


function renderLast(list){

const box = document.getElementById("lastResults")

box.innerHTML = ""

const last50 = list.slice(0,50)

last50.forEach(r=>{

const div = document.createElement("div")
div.className = "result"

const img = document.createElement("img")

img.src = "/assets/police/slot"+r.slot+".png"
img.className = "result-img"

div.appendChild(img)

box.appendChild(div)

})

}









let roundEnd = 0

socket.on("wheel8-round-info",(data)=>{

document.getElementById("roundId").textContent =
data.roundId

roundEnd = data.endAt

clearTimeout(roundResultResetTimer)

roundResultResetTimer = setTimeout(()=>{

  const box = document.getElementById("roundResult")
  box.innerHTML = "?"

},10000)

})



socket.on("wheel8-timer",(sec)=>{
document.getElementById("roundTimer").textContent = sec
})



socket.on("wheel8-result",(data)=>{


const slot =
  data.slot ??
  data.winSlot ??
  data.resultSlot ??
  data.slots?.[0]

if(!slot) return

clearTimeout(roundResultResetTimer)

const box = document.getElementById("roundResult")
box.innerHTML = ""

const img = document.createElement("img")
img.src = `/assets/police/slot${slot}.png`
img.className = "result-img"

img.onerror = ()=>{
  box.innerHTML = "?"
}

box.appendChild(img)

})



function renderMiss(list){

const miss=[0,0,0,0,0,0,0,0]
let missX5=0
let missX45=0

// tính slot miss
for(let i=0;i<8;i++){

let count=0

for(let r of list){

if(r.slot===i+1) break

count++

}

miss[i]=count

}

// tính event miss
for(let r of list){

if(r.event==="x5-all") break
missX5++

}

for(let r of list){

if(r.event==="x45-all") break
missX45++

}

const box=document.getElementById("slotMiss")

box.innerHTML=""

// render slot
miss.forEach((v,i)=>{

box.innerHTML+=`
<div class="miss-box">

<img src="/assets/police/slot${i+1}.png">

<div class="miss-count ${v>15?'miss-hot':''}">
${v}
</div>

</div>
`

})

// render event x5
box.innerHTML+=`
<div class="miss-box">

<img src="/assets/police/event-x5-all.png">

<div class="miss-count ${missX5>30?'miss-hot':''}">
${missX5}
</div>

</div>
`

// render event x45
box.innerHTML+=`
<div class="miss-box">

<img src="/assets/police/event-x45-all.png">

<div class="miss-count ${missX45>30?'miss-hot':''}">
${missX45}
</div>

</div>
`

}



</script>

</body>
</html>
