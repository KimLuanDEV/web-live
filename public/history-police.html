<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Wheel Statistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
background:#000;
color:#fff;
font-family:system-ui;
padding:20px;
}

h2{
color:#00cfff;
}

.stat-box{
background:#020617;
border:1px solid #00aaff;
padding:16px;
margin-bottom:16px;
border-radius:10px;
}

.result-list{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.result{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
background:#001a33;
border-radius:8px;
font-weight:900;
}



.bar{
height:8px;
background:#00aaff;
}


.round-info{
display:flex;
justify-content:space-between;
align-items:center;
text-align:center;
}

.round-info .label{
font-size:12px;
opacity:.6;
margin-bottom:4px;
}

#roundId{
font-size:22px;
font-weight:700;
}

#roundTimer{
font-size:28px;
font-weight:900;
color:#00eaff;
}

#roundResult{
width:60px;
height:60px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.round-left,
.round-center,
.round-right{
flex:1;
}


.result-img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}


</style>
</head>

<body>

<h2>POLICE STATISTICS</h2>



<div class="stat-box round-info">

<div class="round-left">
<div class="label">ROUND</div>
<div id="roundId">--</div>
</div>

<div class="round-center">
<div class="label">TIME LEFT</div>
<div id="roundTimer">--</div>
</div>

<div class="round-right">
<div class="label">RESULT</div>
<div id="roundResult">?</div>
</div>

</div>



<div class="stat-box">
<h3>LAST RESULTS</h3>
<div id="lastResults" class="result-list"></div>
</div>

<div class="stat-box">
<h3>SLOT FREQUENCY</h3>
<div id="slotStats"></div>
</div>

<div class="stat-box">
<h3>MULTIPLIER STATS</h3>
<div id="multiStats"></div>
</div>



<script>

const socket = io()


let roundResultResetTimer = null


socket.on("wheel8-history",list=>{

renderStats(list)

})

function renderStats(list){

renderLast(list)

renderSlotStats(list)

renderMultiStats(list)

}


function renderLast(list){

const box = document.getElementById("lastResults")

box.innerHTML = ""

const last50 = list.slice(0,50)

last50.forEach(r=>{

const div = document.createElement("div")
div.className = "result"

const img = document.createElement("img")

img.src = "/assets/police/slot"+r.slot+".png"
img.className = "result-img"

div.appendChild(img)

box.appendChild(div)

})

}



function renderSlotStats(list){

const stat=[0,0,0,0,0,0,0,0]

list.forEach(r=>{
stat[r.slot-1]++
})

const box=document.getElementById("slotStats")
box.innerHTML=""

stat.forEach((v,i)=>{

const p=Math.round(v/list.length*100)

box.innerHTML+=`
<div>
Slot ${i+1} - ${p}%
<div class="bar" style="width:${p}%"></div>
</div>
`

})

}

function renderMultiStats(list){

const map={}

list.forEach(r=>{
map[r.multi]=(map[r.multi]||0)+1
})

const box=document.getElementById("multiStats")
box.innerHTML=""

Object.keys(map).forEach(m=>{

const p=Math.round(map[m]/list.length*100)

box.innerHTML+=`
<div>
${m}x - ${p}%
<div class="bar" style="width:${p}%"></div>
</div>
`

})

}



let roundEnd = 0

socket.on("wheel8-round-info",(data)=>{

document.getElementById("roundId").textContent =
data.roundId

roundEnd = data.endAt

clearTimeout(roundResultResetTimer)

roundResultResetTimer = setTimeout(()=>{

  const box = document.getElementById("roundResult")
  box.innerHTML = "?"

},10000)

})



socket.on("wheel8-timer",(sec)=>{
document.getElementById("roundTimer").textContent = sec
})



socket.on("wheel8-result",(data)=>{

console.log("RESULT:",data)

const slot =
  data.slot ??
  data.winSlot ??
  data.resultSlot ??
  data.slots?.[0]

if(!slot) return

clearTimeout(roundResultResetTimer)

const box = document.getElementById("roundResult")
box.innerHTML = ""

const img = document.createElement("img")
img.src = `/assets/police/slot${slot}.png`
img.className = "result-img"

img.onerror = ()=>{
  box.innerHTML = "?"
}

box.appendChild(img)

})



</script>

</body>
</html>
