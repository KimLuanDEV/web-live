<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Police Statistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="/socket.io/socket.io.js"></script>

<style>

body{
background:#000;
color:#fff;
font-family:system-ui;
padding:20px;
}

h2{
color:#00cfff;
}

.stat-box{
background:#020617;
border:1px solid #00aaff;
padding:16px;
margin-bottom:16px;
border-radius:10px;
}

.result-list{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
}

.result{
width:50px;
height:50px;
display:flex;
align-items:center;
justify-content:center;
background:#001a33;
border-radius:8px;
font-weight:900;
}


/* slot 1,6,7,8 = xanh */
.result.result-blue{
background:
linear-gradient(
180deg,
#0077ff,
#001a44
);

border:1px solid rgba(0,170,255,.9);

box-shadow:
0 0 10px rgba(0,170,255,.8),
inset 0 0 8px rgba(0,170,255,.6);
}

/* slot 2,3,4,5 = đỏ */
.result.result-red{
background:
linear-gradient(
180deg,
#d80812,
#3a0004
);

border:1px solid rgba(255,40,40,.9);

box-shadow:
0 0 10px rgba(216,8,18,.8),
inset 0 0 8px rgba(216,8,18,.6);
}


.bar{
height:8px;
background:#00aaff;
}


.round-info{
display:flex;
justify-content:space-between;
align-items:center;
text-align:center;
flex-wrap:wrap;
}


/* TOP 3 HIỂN THỊ TRỰC TIẾP */

.live-top-winners{
width:100%;
margin-top:14px;
padding-top:12px;
border-top:1px solid rgba(0,170,255,.35);
}

.live-top-title{
font-size:13px;
font-weight:900;
color:#00eaff;
margin-bottom:8px;
}

.live-top-list{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.live-top-item{
min-width:0;
display:grid;
grid-template-columns:30px minmax(0,1fr);
grid-template-rows:auto auto;
column-gap:7px;
align-items:center;
background:#001a33;
border:1px solid rgba(0,170,255,.3);
border-radius:9px;
padding:8px;
text-align:left;
}

.live-top-rank{
grid-row:1 / 3;
font-size:18px;
font-weight:900;
color:#ffd43b;
text-align:center;
}

.live-top-name{
min-width:0;
font-size:13px;
font-weight:800;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.live-top-win{
font-size:14px;
font-weight:900;
color:#00ff9d;
white-space:nowrap;
}

.live-top-empty{
grid-column:1 / -1;
padding:10px;
font-size:13px;
opacity:.6;
text-align:center;
}

@media(max-width:600px){

.live-top-list{
grid-template-columns:1fr;
}

}


.round-info .label{
font-size:12px;
opacity:.6;
margin-bottom:4px;
}

#roundId{
font-size:22px;
font-weight:700;
}

#roundTimer{
font-size:28px;
font-weight:900;
color:#00eaff;
}

#roundResult{
width:60px;
height:60px;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
}

.round-left,
.round-center,
.round-right{
flex:1;
}


.result-img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}


.miss-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin-top:10px;
}

.miss-box{
background:#001a33;
border-radius:10px;
padding:10px;
text-align:center;
}

.miss-box img{
width:40px;
height:40px;
object-fit:contain;
display:block;
margin:auto;
}

.miss-count{
font-size:20px;
font-weight:900;
margin-top:4px;
color:#00eaff;
}

.miss-hot{
color:#ff3b3b;
}


/* TOP WINNERS MODAL */

.top-modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.78);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
padding:20px;
}

.top-modal.show{
display:flex;
}

.top-modal-box{
width:min(420px,100%);
background:linear-gradient(180deg,#041525,#010712);
border:1px solid #00aaff;
border-radius:14px;
box-shadow:0 0 30px rgba(0,170,255,.45);
overflow:hidden;
}

.top-modal-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 16px;
border-bottom:1px solid rgba(0,170,255,.35);
}

.top-modal-title{
font-size:18px;
font-weight:900;
color:#00eaff;
}

.top-modal-close{
width:34px;
height:34px;
border:0;
border-radius:8px;
background:#182536;
color:#fff;
font-size:22px;
cursor:pointer;
}

.top-round{
padding:10px 16px 4px;
font-size:13px;
opacity:.7;
}

.top-list{
padding:12px 16px 18px;
}

.top-winner{
display:grid;
grid-template-columns:42px 1fr auto;
gap:10px;
align-items:center;
background:#001a33;
border:1px solid rgba(0,170,255,.25);
border-radius:10px;
padding:11px;
margin-top:8px;
}

.top-rank{
font-size:21px;
font-weight:900;
color:#ffd43b;
text-align:center;
}

.top-name{
font-weight:800;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.top-win{
font-size:16px;
font-weight:900;
color:#00ff9d;
white-space:nowrap;
}

.top-empty{
padding:24px;
text-align:center;
opacity:.65;
}

.result{
cursor:pointer;
transition:transform .15s;
}

.result:hover{
transform:scale(1.06);
}



</style>
</head>

<body>

<h2>POLICE STATISTICS</h2>



<div class="stat-box round-info">

<div class="round-left">
<div class="label">ROUND</div>
<div id="roundId">--</div>
</div>

<div class="round-center">
<div class="label">TIME LEFT</div>
<div id="roundTimer">--</div>
</div>

<div class="round-right">
<div class="label">RESULT</div>
<div id="roundResult">?</div>
</div>

<div class="live-top-winners">

  <div class="live-top-title">
    TOP 3 WINNERS
  </div>

  <div id="liveTopWinnerList" class="live-top-list">

    <div class="live-top-empty">
      Waiting for result...
    </div>

  </div>

</div>

</div>



<div class="stat-box">
<h3>LAST RESULTS</h3>
<div id="lastResults" class="result-list"></div>
</div>

<div class="stat-box">
<h3>SLOT MISS COUNT</h3>
<div id="slotMiss" class="miss-grid"></div>
</div>


<div id="topModal" class="top-modal">
  <div class="top-modal-box">

    <div class="top-modal-header">
      <div class="top-modal-title">TOP 3 WINNERS</div>

      <button
        id="topModalClose"
        class="top-modal-close"
        type="button"
      >×</button>
    </div>

    <div id="topRound" class="top-round"></div>

    <div id="topWinnerList" class="top-list"></div>

  </div>
</div>



<script>

const socket = io()


socket.emit("wheel8-get-history")


let roundResultResetTimer = null
let liveTopClearTimer = null


socket.on("wheel8-history",list=>{

renderStats(list)

})


function renderStats(list){

renderLast(list)

renderMiss(list)

}


function renderLast(list){

const box = document.getElementById("lastResults")

box.innerHTML = ""

const last50 = list.slice(0,50)

last50.forEach(r=>{

const div = document.createElement("div")
div.className = "result"

const slot = Number(r.slot)

// slot 2-3-4-5 = đỏ
if([2,3,4,5].includes(slot)){
  div.classList.add("result-red")
}

// slot 1-6-7-8 = xanh
else if([1,6,7,8].includes(slot)){
  div.classList.add("result-blue")
}

const img = document.createElement("img")

img.src = "/assets/police/slot"+r.slot+".png"
img.className = "result-img"

div.appendChild(img)

div.title = "Click để xem top 3 thắng"

div.addEventListener("click",()=>{
  openTopWinners(r)
})

box.appendChild(div)

})

}


function formatWin(value){

const n = Number(value || 0)

return Math.round(n).toLocaleString("en-US")

}


function openTopWinners(round){

const modal = document.getElementById("topModal")
const roundBox = document.getElementById("topRound")
const listBox = document.getElementById("topWinnerList")

roundBox.textContent =
  "ROUND: " + (round.roundId ?? "--")

const winners =
  Array.isArray(round.topWinners)
    ? [...round.topWinners]
    : Array.isArray(round.top)
      ? [...round.top]
      : []

winners.sort((a,b)=>{
  return Number(b.win || b.amount || 0)
       - Number(a.win || a.amount || 0)
})

const top3 = winners.slice(0,3)

if(!top3.length){

  listBox.innerHTML = `
    <div class="top-empty">
      Phiên này chưa có dữ liệu người thắng
    </div>
  `

}else{

  listBox.innerHTML = top3.map((item,index)=>{

    const name =
      item.name ||
      item.displayName ||
      "???"

    const win =
      item.win ??
      item.amount ??
      0

    return `
      <div class="top-winner">

        <div class="top-rank">
          #${index + 1}
        </div>

        <div class="top-name">
          ${escapeTopHtml(name)}
        </div>

        <div class="top-win">
          ${formatWin(win)}
        </div>

      </div>
    `

  }).join("")

}

modal.classList.add("show")

}


function closeTopWinners(){

document
  .getElementById("topModal")
  .classList.remove("show")

}


function escapeTopHtml(value){

return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;")

}


document
  .getElementById("topModalClose")
  .addEventListener("click",closeTopWinners)


document
  .getElementById("topModal")
  .addEventListener("click",event=>{

    if(event.target.id === "topModal"){
      closeTopWinners()
    }

  })


document.addEventListener("keydown",event=>{

  if(event.key === "Escape"){
    closeTopWinners()
  }

})






let roundEnd = 0

socket.on("wheel8-round-info",(data)=>{

document.getElementById("roundId").textContent =
data.roundId

roundEnd = data.endAt

clearTimeout(liveTopClearTimer)

liveTopClearTimer = setTimeout(()=>{

  const liveTopBox =
    document.getElementById("liveTopWinnerList")

  if(liveTopBox){

    liveTopBox.innerHTML = `
      <div class="live-top-empty">
        Waiting for result...
      </div>
    `

  }

},5000)


clearTimeout(roundResultResetTimer)

roundResultResetTimer = setTimeout(()=>{

  const box = document.getElementById("roundResult")
  box.innerHTML = "?"

},10000)

})



socket.on("wheel8-timer",(sec)=>{
document.getElementById("roundTimer").textContent = sec
})



function renderLiveTopWinners(data){

const box =
  document.getElementById("liveTopWinnerList")

if(!box) return

const winners =
  Array.isArray(data.topWinners)
    ? [...data.topWinners]
    : Array.isArray(data.top)
      ? [...data.top]
      : []

winners.sort((a,b)=>{

  const winA = Number(
    a.win ??
    a.amount ??
    a.totalWin ??
    0
  )

  const winB = Number(
    b.win ??
    b.amount ??
    b.totalWin ??
    0
  )

  return winB - winA

})

const top3 = winners.slice(0,3)

if(!top3.length){

  box.innerHTML = `
    <div class="live-top-empty">
      No winners this round
    </div>
  `

  return
}

box.innerHTML = top3.map((item,index)=>{

  const name =
    item.name ||
    item.displayName ||
    "???"

  const win =
    item.win ??
    item.amount ??
    item.totalWin ??
    0

  return `
    <div class="live-top-item">

      <div class="live-top-rank">
        #${index + 1}
      </div>

      <div class="live-top-name">
        ${escapeTopHtml(name)}
      </div>

      <div class="live-top-win">
        ${formatWin(win)}
      </div>

    </div>
  `

}).join("")

}


socket.on("wheel8-result",(data)=>{


const slot =
  data.slot ??
  data.winSlot ??
  data.resultSlot ??
  data.slots?.[0]

if(!slot) return

renderLiveTopWinners(data)

clearTimeout(roundResultResetTimer)

const box = document.getElementById("roundResult")
box.innerHTML = ""

const img = document.createElement("img")
img.src = `/assets/police/slot${slot}.png`
img.className = "result-img"

img.onerror = ()=>{
  box.innerHTML = "?"
}

box.appendChild(img)

})



function renderMiss(list){

const miss=[0,0,0,0,0,0,0,0]
let missX5=0
let missX45=0

// tính slot miss
for(let i=0;i<8;i++){

let count=0

for(let r of list){

if(r.slot===i+1) break

count++

}

miss[i]=count

}

// tính event miss
for(let r of list){

if(r.event==="x5-all") break
missX5++

}

for(let r of list){

if(r.event==="x45-all") break
missX45++

}

const box=document.getElementById("slotMiss")

box.innerHTML=""

// render slot theo layout:
// hàng trên: 1 - 6 - 7 - 8
// hàng dưới: 2 - 3 - 4 - 5
const slotOrder = [1,8,7,6,2,3,4,5]

slotOrder.forEach(slot=>{

const v = miss[slot-1]

box.innerHTML+=`
<div class="miss-box">

<img src="/assets/police/slot${slot}.png">

<div class="miss-count ${v>15?'miss-hot':''}">
${v}
</div>

</div>
`

})

// render event x5
box.innerHTML+=`
<div class="miss-box">

<img src="/assets/police/event-x5-all.png">

<div class="miss-count ${missX5>30?'miss-hot':''}">
${missX5}
</div>

</div>
`

// render event x45
box.innerHTML+=`
<div class="miss-box">

<img src="/assets/police/event-x45-all.png">

<div class="miss-count ${missX45>30?'miss-hot':''}">
${missX45}
</div>

</div>
`

}



</script>

</body>
</html>
