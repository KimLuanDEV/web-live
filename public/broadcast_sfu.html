<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host SFU</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#video{width:100vw;height:100vh;object-fit:cover}
#bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
button{padding:10px 16px;font-size:16px;border-radius:8px;border:0;background:#ff2d55;color:#fff}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>

<div id="bar">
  <button id="btnStart">▶️ START</button>
  <button id="btnStop" disabled>⏹ STOP</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/mediasoup-client@3/lib/index.js"></script>
<script>

const roomId = new URLSearchParams(location.search).get("room") || "test";
const socket = io("http://207.148.79.73:4000");

let device, sendTransport, localStream;
const videoEl = document.getElementById("video");

socket.on("connect", () => {
  socket.emit("join", { roomId, role:"broadcaster" }, async ({ rtpCapabilities })=>{
    device = new mediasoupClient.Device();
    await device.load({ routerRtpCapabilities: rtpCapabilities });
    console.log("SFU Device ready");
  });
});

async function start(){
  localStream = await navigator.mediaDevices.getUserMedia({
    video:{ width:960, height:540, frameRate:24 },
    audio:true
  });
  videoEl.srcObject = localStream;

  socket.emit("create-transport", {}, async (data)=>{
    sendTransport = device.createSendTransport(data);

    sendTransport.on("connect", ({ dtlsParameters }, cb)=>{
      socket.emit("connect-transport", {
        transportId: sendTransport.id,
        dtlsParameters
      });
      cb();
    });

    sendTransport.on("produce", async ({ kind, rtpParameters }, cb)=>{
      socket.emit("produce", {
        transportId: sendTransport.id,
        kind,
        rtpParameters
      }, ({ id })=>cb({ id }));
    });

    for(const track of localStream.getTracks()){
      await sendTransport.produce({ track });
    }

    console.log("Host is LIVE on SFU");
    btnStart.disabled = true;
    btnStop.disabled = false;
  });
}

function stop(){
  if(localStream){
    localStream.getTracks().forEach(t=>t.stop());
    localStream = null;
  }
  location.reload();
}

btnStart.onclick = start;
btnStop.onclick = stop;

</script>
</body>
</html>
