<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo tài khoản</title>
<link rel="stylesheet" href="/style.css">

<style>
.auth-shell{
  max-width:420px;
  margin:10vh auto;
  padding:24px;
  text-align:center;
}

.auth-shell input{
  width:100%;
  margin-top:12px;
  height:46px;
  font-size:16px;
}

.auth-shell button{
  width:100%;
  height:48px;
  margin-top:16px;
  border:none;
  background:linear-gradient(135deg,#ff3b6b,#5fa8ff);
  color:white;
  border-radius:14px;
  font-size:17px;
  font-weight:700;
}

@media (max-width:600px){
  .auth-shell{
    max-width:100%;
    width:100%;
    min-height:100vh;
    margin:0;
    border-radius:0;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
}
</style>

</head>

<body>

<div class="card auth-shell">
  <h2>✨ Tạo tài khoản</h2>

  <input id="regUser" placeholder="Tên đăng nhập">
  <input id="regPass" type="password" placeholder="Mật khẩu">
  <input id="regPass2" type="password" placeholder="Nhập lại mật khẩu">
  <input id="regName" placeholder="Tên hiển thị">

  <button onclick="register()">TẠO TÀI KHOẢN</button>
</div>

<script>


async function register(){
  const u = regUser.value.trim();
  const p = regPass.value;
  const p2 = regPass2.value;
  const name = regName.value.trim();

  if(!u || !p || !p2 || !name){
    alert("❌ Nhập đầy đủ thông tin");
    return;
  }

  if(p.length < 6){
    alert("❌ Mật khẩu phải ít nhất 6 ký tự");
    return;
  }

  if(p !== p2){
    alert("❌ Mật khẩu nhập lại không khớp");
    return;
  }

  const res = await fetch("/api/register",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: u,
      password: p,
      name
    })
  });

  const data = await res.json();

  if(data.error){
    if(data.error === "exists"){
      alert("❌ Tài khoản đã tồn tại");
    }else{
      alert("❌ Lỗi tạo tài khoản");
    }
    return;
  }

  // server trả về profile chuẩn
  localStorage.setItem("user_profile", JSON.stringify(data.profile));
  localStorage.setItem("login_uid", data.profile.uid);

  alert("🎉 Tạo tài khoản thành công!");
  location.href = "/profile.html";
}




</script>

</body>
</html>
