<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo tài khoản</title>
<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#0f1b3a,#05070d);
  font-family:system-ui,-apple-system;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.register-shell{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#0b1327,#080c18);
  border-radius:24px;
  padding:36px 26px 42px;
  box-shadow:0 0 50px rgba(0,255,255,.15);
  text-align:center;
}

.register-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 14px;
  background:url("https://i.ibb.co/ZR2yR7dJ/Chat-GPT-Image-Jan-12-2026-02-44-07-AM.jpg") center/cover;
  box-shadow:0 0 40px rgba(0,255,255,.6);
}

.register-title{
  font-size:26px;
  font-weight:900;
  color:#00f6ff;
  margin-bottom:6px;
}

.register-sub{
  font-size:13px;
  opacity:.7;
  margin-bottom:28px;
}

.register-shell input{
  width:100%;
  height:52px;
  margin-top:14px;
  background:#0e172c;
  border:none;
  border-radius:16px;
  padding:0 16px;
  color:white;
  font-size:16px;
  box-shadow:inset 0 0 0 1px rgba(0,255,255,.15);
}

.register-shell input::placeholder{
  color:#6c7da8;
}

.register-btn{
  width:100%;
  height:56px;
  margin-top:26px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#00f6ff,#5f7dff);
  color:#00141a;
  font-size:18px;
  font-weight:900;
  box-shadow:0 0 30px rgba(0,246,255,.6);
}

.register-links{
  margin-top:22px;
  font-size:13px;
  opacity:.75;
}

.register-links a{
  color:#00f6ff;
  text-decoration:none;
  font-weight:600;
}

/* mobile */
@media(max-width:600px){
  .register-shell{
    min-height:100vh;
    border-radius:0;
    padding:48px 24px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
}

.pass-wrap{
  position:relative;
}

.pass-eye{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  opacity:.7;
}

.pass-eye:hover{
  opacity:1;
}

</style>

</head>

<body>

<div class="register-shell">
  <div class="register-avatar"></div>
  <div class="register-title">LIVESTREAM PRO</div>
  <div class="register-sub">Tạo tài khoản mới</div>

  <input id="phone" placeholder="Số điện thoại (VD: 0123...)">
  <input id="username" placeholder="Tên đăng nhập">
  <input id="name" placeholder="Tên hiển thị">

  <div class="pass-wrap">
  <input id="password" type="password" placeholder="Mật khẩu">
  <span class="pass-eye" onclick="togglePass('password', this)">👁</span>
</div>

<div class="pass-wrap">
  <input id="password2" type="password" placeholder="Nhập lại mật khẩu">
  <span class="pass-eye" onclick="togglePass('password2', this)">👁</span>
</div>

<div id="passWarn" style="font-size:13px;margin-top:6px;color:#ff6b6b;display:none">
  ❌ Mật khẩu không khớp
</div>


  <button class="register-btn" onclick="register()">TẠO TÀI KHOẢN</button>


  <div class="register-links">
    Đã có tài khoản?
    <a href="/login.html">Đăng nhập</a>
  </div>
</div>


<!-- GLOBAL MESSAGE MODAL -->
<div id="msgModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <h3 id="msgTitle">Thông báo</h3>
    <div id="msgText" style="margin:12px 0;opacity:.9"></div>
    <button onclick="closeMsg()">OK</button>
  </div>
</div>


<div id="otpModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeOtp()"></div>

  <div class="modal-card" style="position:relative">
    <div onclick="closeOtp()" 
         style="position:absolute;top:10px;right:14px;
                font-size:22px;cursor:pointer;opacity:.7">
      ✖
    </div>

    <h3>📱 Nhập mã OTP</h3>
    <input id="otpCode" placeholder="6 chữ số OTP">
    <button onclick="verifyOtp()">Xác nhận</button>
  </div>
</div>


<script>

  function closeOtp(){
  document.getElementById("otpModal").classList.add("hidden");
}

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    closeOtp();
  }
});


async function verifyOtp(){
  const otp = document.getElementById("otpCode").value.trim();
  const username = localStorage.getItem("otp_user");

  const res = await fetch("/api/verify-otp",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username, otp })
  });

  const d = await res.json();
  if(!d.ok){
    showMsg("❌ OTP sai hoặc hết hạn");
    return;
  }

  location.href="/login.html";
}
</script>


<script>

let phone = document.getElementById("phone").value.trim();
phone = normalizePhone(phone);


async function register(){
  const phone = document.getElementById("phone").value.trim();
  const u = document.getElementById("username").value.trim();
  const name = document.getElementById("name").value.trim();
  const p = document.getElementById("password").value;
  const p2 = document.getElementById("password2").value;

  if(!u || !p || !p2 || !name || !phone){
    showMsg("❌ Nhập đầy đủ thông tin");
    return;
  }

  if(p !== p2){
    showMsg("❌ Mật khẩu không khớp");
    return;
  }

  const res = await fetch("/api/register",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username:u, password:p, name, phone })
  });

  const data = await res.json();
  if(data.error){
    showMsg("❌ Tài khoản đã tồn tại");
    return;
  }

  // Gửi OTP sau khi tạo account
  await fetch("/api/send-otp",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username:u, phone })
  });

  localStorage.setItem("otp_user", u);
  document.getElementById("otpModal").classList.remove("hidden");
}


function togglePass(id, el){
  const input = document.getElementById(id);
  if(input.type === "password"){
    input.type = "text";
    el.textContent = "🙈";
  }else{
    input.type = "password";
    el.textContent = "👁";
  }
}


const p1 = document.getElementById("password");
const p2 = document.getElementById("password2");
const warn = document.getElementById("passWarn");

function checkMatch(){
  if(!p1.value || !p2.value){
    warn.style.display = "none";
    return;
  }

  if(p1.value !== p2.value){
    warn.style.display = "block";
  }else{
    warn.style.display = "none";
  }
}

p1.addEventListener("input", checkMatch);
p2.addEventListener("input", checkMatch);



function showMsg(text, title="Thông báo"){
  document.getElementById("msgTitle").textContent = title;
  document.getElementById("msgText").textContent = text;
  document.getElementById("msgModal").classList.remove("hidden");
}

function closeMsg(){
  document.getElementById("msgModal").classList.add("hidden");
}

function normalizePhone(p){
  p = p.replace(/\s+/g,"");
  if(p.startsWith("0")){
    return "+84" + p.slice(1);
  }
  if(p.startsWith("84")){
    return "+" + p;
  }
  if(!p.startsWith("+")){
    return "+" + p;
  }
  return p;
}

</script>


</body>
</html>
