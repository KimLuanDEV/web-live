<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📖 Đọc truyện</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">


  <style>

    .page-stories{
  background:#0e0e12;
  color:#fff;
  min-height:100vh;
}

.stories-container{
  padding:20px;
}

.stories-empty{
  margin-top:60px;
  text-align:center;
  opacity:.85;
}

.stories-empty .icon{
  font-size:46px;
  margin-bottom:12px;
}


.story-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD */
.story-card{
  background:#14141b;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.06);
  transition:.2s;
}

.story-card:active{
  transform:scale(.97);
}

/* COVER */
.story-cover{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

/* INFO */
.story-info{
  padding:8px 10px 10px;
}

.story-title{
  font-size:14px;
  font-weight:800;
  line-height:1.25;
  margin-bottom:4px;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.story-author{
  font-size:12px;
  opacity:.7;
}


.story-tags{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:6px;
}

.story-tag{
  font-size:10px;
  padding:3px 6px;
  border-radius:999px;
  background:#1c1c26;
  color:#fff;
  opacity:.85;
}


/* TAG BASE */
.story-tag{
  font-size:10px;
  padding:3px 7px;
  border-radius:999px;
  font-weight:700;
  line-height:1;
  white-space:nowrap;
}

/* TAG COLORS */
.tag-ngon-tinh{
  background:#ff5fa2;
  color:#fff;
}

.tag-hao-mon{
  background:#ffcc00;
  color:#3a2a00;
}

.tag-trong-sinh{
  background:#9b6bff;
  color:#fff;
}

.tag-nu-cuong{
  background:#ff4d4f;
  color:#fff;
}

.tag-hien-dai{
  background:#4da3ff;
  color:#fff;
}

.tag-he{
  background:#2ecc71;
  color:#fff;
}

.tag-vip{
  background:#ff9800;
  color:#fff;
}



  </style>
</head>

<body class="page-stories">

<script src="/guard.js"></script>

<header class="simple-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">📖 Đọc truyện</div>
</header>

<main class="stories-container">

<div id="storyGrid" class="story-grid"></div>

</main>



<script src="/stories.js"></script>
</body>
</html>
