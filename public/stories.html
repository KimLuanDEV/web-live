<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>📖 Đọc truyện</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">


  <style>

    .page-stories{
  background:#0e0e12;
  color:#fff;
  min-height:100vh;
}

.stories-container{
  padding:20px;
}

.stories-empty{
  margin-top:60px;
  text-align:center;
  opacity:.85;
}

.stories-empty .icon{
  font-size:46px;
  margin-bottom:12px;
}


.story-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD */
.story-card{
  background:#14141b;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.06);
  transition:.2s;
}

.story-card:active{
  transform:scale(.97);
}

/* COVER */
.story-cover{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
}

/* INFO */
.story-info{
  padding:8px 10px 10px;
}

.story-title{
  font-size:14px;
  font-weight:800;
  line-height:1.25;
  margin-bottom:4px;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.story-author{
  font-size:12px;
  opacity:.7;
}


  </style>
</head>

<body class="page-stories">

<script src="/guard.js"></script>

<header class="simple-header">
  <button onclick="history.back()" class="back-btn">←</button>
  <div class="title">📖 Đọc truyện</div>
</header>

<main class="stories-container">



<div class="story-grid">

  <!-- 📘 STORY ITEM -->
  <div class="story-card" onclick="location.href='/story-detail.html?id=1'">
    <img class="story-cover"
         src="https://i.ibb.co/3mY0H4Xh/Chat-GPT-Image-Jan-19-2026-09-44-27-AM.jpg">
    <div class="story-info">
      <div class="story-title">Em Là Ánh Trăng Của Anh</div>
      <div class="story-author">✍️ Diệp Lạc Vô Tâm</div>
    </div>
  </div>

  <div class="story-card" onclick="location.href='/story-detail.html?id=2'">
    <img class="story-cover"
         src="https://i.ibb.co/ZR2yR7dJ/Chat-GPT-Image-Jan-12-2026-02-44-07-AM.jpg">
    <div class="story-info">
      <div class="story-title">Thiên Kim Trở Về</div>
      <div class="story-author">✍️ Thanh Sam Lạc Thác</div>
    </div>
  </div>

  <div class="story-card" onclick="location.href='/story-detail.html?id=3'">
    <img class="story-cover"
         src="https://i.ibb.co/3mY0H4Xh/Chat-GPT-Image-Jan-19-2026-09-44-27-AM.jpg">
    <div class="story-info">
      <div class="story-title">Hào Môn Kinh Mộng</div>
      <div class="story-author">✍️ Ân Tầm</div>
    </div>
  </div>

</div>











</main>

</body>
</html>
