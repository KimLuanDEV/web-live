<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TIME STOP</title>

<link rel="stylesheet" href="/css/main.css">

<style>

body{
background:#05070f;
color:white;
font-family:Arial;
text-align:center;
margin:0;
overflow:hidden;
}

/* ================= TOP BAR ================= */

.topbar{
display:flex;
justify-content:space-between;
padding:10px 20px;
font-weight:700;
background:#0c1020;
border-bottom:1px solid rgba(255,255,255,.1);
}

/* ================= TIMER ================= */

.timer-box{
margin-top:120px;
}

.timer-circle{

width:260px;
height:260px;
border-radius:50%;

margin:auto;

display:flex;
align-items:center;
justify-content:center;

font-size:64px;
font-weight:900;

background:
radial-gradient(circle,
#0b0f25 40%,
#0a0e1c 80%
);

border:4px solid #00f0ff;

box-shadow:
0 0 20px #00f0ff,
0 0 60px rgba(0,240,255,.3);

}

/* ================= BUTTON ================= */

.stop-btn{

margin-top:40px;

font-size:28px;
font-weight:900;

padding:18px 60px;

border:none;
border-radius:12px;

background:linear-gradient(
45deg,
#ff2b2b,
#ff7b00
);

color:white;

cursor:pointer;

box-shadow:
0 0 20px rgba(255,0,0,.6);

}

/* ================= BET ================= */

.bet-panel{

position:absolute;
bottom:40px;
left:0;
right:0;

}

.bet-grid{

display:flex;
justify-content:center;
gap:12px;

}

.bet-chip{

background:#11142a;
padding:12px 18px;
border-radius:10px;
cursor:pointer;

border:1px solid rgba(255,255,255,.2);

font-weight:700;

}

.bet-chip.active{

border:1px solid #00f0ff;
box-shadow:0 0 10px #00f0ff;

}

</style>

</head>

<body>

<!-- ================= TOP BAR ================= -->

<div class="topbar">

<div>
ROUND: <span id="roundId">1</span>
</div>

<div>
💎 <span id="coins">0</span>
</div>

</div>

<!-- ================= TIMER ================= -->

<div class="timer-box">

<div class="timer-circle">

<span id="timer">0.00</span>

</div>

<button class="stop-btn"
onclick="stopTimer()">

STOP

</button>

</div>

<!-- ================= BET ================= -->

<div class="bet-panel">

<div class="bet-grid">

<div class="bet-chip" onclick="setBet(10)">10</div>
<div class="bet-chip" onclick="setBet(50)">50</div>
<div class="bet-chip" onclick="setBet(100)">100</div>
<div class="bet-chip" onclick="setBet(500)">500</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

/* ================= SOCKET ================= */

const socket = io();

/* ================= COIN ================= */

socket.on("coin-update", data=>{
document.getElementById("coins").textContent =
data.coins;
});

/* ================= GAME ================= */

let timer = 0;
let running = false;
let interval;

let bet = 0;

/* ================= BET ================= */

function setBet(v){

bet = v;

document.querySelectorAll(".bet-chip")
.forEach(el=>el.classList.remove("active"));

event.target.classList.add("active");

}

/* ================= START ================= */

function startTimer(){

timer = 0;

running = true;

interval = setInterval(()=>{

timer += 0.01;

if(timer > 10){

resetGame();

return;

}

document.getElementById("timer")
.textContent = timer.toFixed(2);

},10);

}

/* ================= STOP ================= */

function stopTimer(){

if(!running) return;

running = false;

clearInterval(interval);

const t = timer;

let reward = 0;

/* ===== CALC REWARD ===== */

if(t >= 9.9){

reward = bet * 10;

}else if(t >= 9){

reward = bet * 5;

}else if(t >= 8){

reward = bet * 2;

}

/* ===== SEND SERVER ===== */

socket.emit("time-stop-result",{

bet,
time:t

});

alert("Result: " + t.toFixed(2));

setTimeout(startTimer,3000);

}

/* ================= RESET ================= */

function resetGame(){

clearInterval(interval);

setTimeout(startTimer,2000);

}

/* ================= START GAME ================= */

startTimer();

</script>

</body>
</html>
