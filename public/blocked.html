<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Livestream Pro - Blocked</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">

<style>
body{
  background:#000;
  color:#fff;
  margin:0;
  font-family:system-ui;
}

.block-header{
  position: sticky;
  top: 0;
  left: 0;
  right: 0;

  width: 100vw;
  margin-left: calc(50% - 50vw);

  height: 52px;
  display:flex;
  align-items:center;

  padding: 0 12px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.08);
  z-index: 100;
}


.block-header h3{
  position: absolute;
  left: 50%;
  transform: translateX(-50%);

  margin:0;
  font-size:16px;
  font-weight:600;
  pointer-events:none; /* không che nút */
}



.block-header button{
  width: 40px;
  height: 40px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  z-index: 2;
}




.block-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.block-row img{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
}

.block-info{
  flex:1;
}

.block-name{
  font-weight:600;
}

.block-actions button{
  padding:6px 10px;
  font-size:12px;
  border-radius:8px;
  border:1px solid #00ffaa;
  background:#111;
  color:#00ffaa;
}


</style>
</head>

<body>

<div class="block-header">
  <button onclick="history.back()">←</button>
  <h3>Đã chặn</h3>
</div>

<div id="blockList"></div>


<div id="toast-container"></div>

<script src="/push-init.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/app-entry-guard.js"></script>
<script>
const socket = io();
const profile = JSON.parse(localStorage.getItem("user_profile") || "{}");
if(!profile.uid){
  location.href = "/login.html";
}

// 🔑 auth-login
socket.emit("auth-login", { uid: profile.uid });

fetch("/api/blocked/" + profile.uid)
  .then(r=>r.json())
  .then(data => renderBlocked(data.blocked));

function renderBlocked(list){
  const box = document.getElementById("blockList");
  box.innerHTML = "";

  if(!list.length){
    box.innerHTML = `<div style="padding:14px;opacity:.5">Không có user bị chặn</div>`;
    return;
  }

  list.forEach(u=>{
    box.innerHTML += `
      <div class="block-row">
        <img src="${u.avatar}">
        <div class="block-info">
          <div class="block-name">
            ${u.name}
            ${u.verified ? `<span class="tick-blue">✔</span>` : ``}
          </div>
          <div style="font-size:12px;opacity:.6">Lv ${u.level}</div>
        </div>
        <div class="block-actions">
          <button onclick="unblock('${u.uid}','${u.name}')">
            🔓 Bỏ chặn
          </button>
        </div>
      </div>
    `;
  });
}

function unblock(uid, name){
  const ok = confirm(`Bỏ chặn ${name}?`);
  if(!ok) return;

  socket.emit("user-unblock", { uid });

  setTimeout(()=>{
    fetch("/api/blocked/" + profile.uid)
      .then(r=>r.json())
      .then(data => renderBlocked(data.blocked));
  }, 200);
}



socket.on("system-notify", data => {
  if (!data) return;

  // 💰 NẠP COIN
  if (data.type === "topup") {
    showToast(data.text || "💰 Bạn vừa được nạp coin", "success");
    return;
  }

   // ➖ TRỪ COIN
  if (data.type === "withdraw") {
    notifyWithdraw(data);
  }
  

  // 🚫 KHOÁ TÀI KHOẢN
  if (data.type === "lock") {
    showToast(
      data.reason || "🚫 Tài khoản của bạn đã bị khoá",
      "error"
    );

    localStorage.removeItem("user_profile");
    localStorage.removeItem("login_uid");
    localStorage.removeItem("isGuest");

    setTimeout(() => {
      location.href = "/login.html";
    }, 2000);
  }
});


function showToast(text, type = "info", timeout = 3500){
  const box = document.getElementById("toast-container");
  if(!box) return;

  const icons = {
    info:"ℹ️",
    success:"✅",
    error:"❌",
    warn:"⚠️"
  };

  const div = document.createElement("div");
  div.className = `toast ${type}`;
  div.innerHTML = `
    <span class="icon">${icons[type] || "🔔"}</span>
    <span class="msg">${text}</span>
  `;

  box.appendChild(div);

  setTimeout(()=>div.remove(), timeout);
}




function showWithdrawNotify(data){
  const text =
    data.text ||
    "Tài khoản của bạn vừa bị trừ coin";

  openSysModal(text);
}


function notifyWithdraw(data){
  const text =
    data?.text ||
    "➖ Tài khoản của bạn vừa bị trừ coin";

  // ưu tiên modal nếu tồn tại
  if (typeof openSysModal === "function") {
    openSysModal(text);
    return;
  }

  // fallback toast
  if (typeof showToast === "function") {
    showToast(text, "error", 5000);
    return;
  }

  // fallback cuối cùng
  alert(text);
}






</script>
</body>
</html>
