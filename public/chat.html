<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>💬 Trò chuyện</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-chat">

<div class="container">
  <div class="card">
    <div class="topbar">
      <button onclick="history.back()">←</button>
      <div id="chatTitle">Chat</div>
    </div>

    <div id="chatBox" class="messages-chat-body"></div>

    <div class="messages-chat-input">
      <input id="msgInput" placeholder="Nhập tin nhắn...">
      <button id="sendBtn">➤</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/chat.js"></script>
</body>
</html>
