<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Diamond Factory</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="factory-body">

<div class="factory-wrap">

  <div class="factory-header">
    <h2>🏭 Diamond Factory</h2>
    <div class="wallet">
      💎 <span id="diamondValue">0</span>
    </div>
  </div>

  <div class="factory-core">
    <div class="factory-level">
      Level: <span id="factoryLevel">1</span>
    </div>

    <div class="factory-storage">
      Stored: <span id="factoryStorage">0</span> 💎
    </div>

    <button id="collectBtn">Collect</button>
    <button id="upgradeBtn">Upgrade</button>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    
const socket = io();

let factory = {
  level: 1,
  storage: 0,
  lastTick: Date.now()
};

const levelEl = document.getElementById("factoryLevel");
const storageEl = document.getElementById("factoryStorage");

function updateUI(){
  levelEl.textContent = factory.level;
  storageEl.textContent = factory.storage;
}

setInterval(()=>{
  const now = Date.now();
  const diff = now - factory.lastTick;

  if(diff >= 3000){
    const produce = factory.level * 2;
    factory.storage += produce;
    factory.lastTick = now;
    updateUI();
  }

},1000);

document.getElementById("collectBtn")
.onclick = ()=>{
  socket.emit("factory-collect", factory.storage);
  factory.storage = 0;
  updateUI();
};

document.getElementById("upgradeBtn")
.onclick = ()=>{
  socket.emit("factory-upgrade");
};


</script>



</body>
</html>
