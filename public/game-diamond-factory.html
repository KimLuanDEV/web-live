<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhà máy sản xuất Kim Cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">

<style>

/* =========================
   💎 DIAMOND FACTORY V2
========================= */

html,body{
  margin:0;
  padding:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui;
}

/* ===== TOP BAR ===== */

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0b0f14,#05080c);
  border-bottom:1px solid rgba(0,255,255,.15);
}

.title{
  font-weight:800;
  font-size:15px;
  text-shadow:0 0 10px rgba(0,255,255,.6);
}

.wallet{
  font-weight:800;
  color:#00f0ff;
}

/* ===== GRID ===== */

.factory-grid{
  padding:16px;
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

/* ===== FACTORY CARD ===== */

.factory-card{
  background:linear-gradient(180deg,#0a1016,#05080c);
  border:1px solid rgba(0,255,255,.15);
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
}

.factory-card h3{
  margin:0;
  font-size:14px;
  color:#00f0ff;
}

.factory-stats{
  font-size:12px;
  opacity:.85;
}

.progress{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00aaff);
  box-shadow:0 0 10px rgba(0,255,255,.8);
  transition:width .3s linear;
}

.btn{
  border:none;
  padding:8px;
  border-radius:8px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}

.btn-collect{
  background:linear-gradient(180deg,#00f0ff,#0088ff);
  color:#001;
}

.btn-upgrade{
  background:linear-gradient(180deg,#ff5050,#aa0000);
  color:#fff;
}

.slot-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:13px;
  border:2px dashed rgba(0,255,255,.3);
  border-radius:16px;
  cursor:pointer;
  opacity:.6;
}

.slot-empty:hover{
  opacity:1;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}



</style>
</head>

<body>

<div class="topbar">
  <div onclick="location.href='/invest.html'" style="cursor:pointer">←</div>
  <div class="title">🏭 Nhà máy Kim Cương</div>
  <div class="wallet"><span id="coinVal">0</span> 💎</div>
</div>

<div class="factory-grid" id="factoryGrid">
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

let factories = [
  {empty:true},
  {empty:true},
  {empty:true}
];

function updateFactories(){

  const now = Date.now();

  factories.forEach(f=>{

if(
  f.empty ||
  f.active === false ||
  !f.workers ||
  f.workers <= 0
) return;

    const seconds = Math.floor((now - f.lastUpdate)/1000);

    // chỉ preview hiển thị
    const preview = Math.min(
      f.storage,
      f.stored + seconds * f.rate
    );

    f._previewStored = preview;
  });

  render();
}

function render(){

  const grid = document.getElementById("factoryGrid");
  grid.innerHTML = "";

  const myCoins = Number(
    document.getElementById("coinVal").textContent || 0
  );

  factories.forEach((f,index)=>{

    // =========================
    // SLOT TRỐNG
    // =========================
    if(f.empty){

      const cost = (index + 1) * 500;
      const disabled = myCoins < cost
        ? "opacity:.5;pointer-events:none;"
        : "";

      const slot = document.createElement("div");
      slot.className = "slot-empty";
      slot.style = disabled;

      slot.innerHTML = `
        ➕ Xây nhà máy mới<br>
        <span style="font-size:11px;opacity:.7">
          Giá: ${cost} 💎
        </span>
      `;

      slot.onclick = ()=> buildFactory(index);
      grid.appendChild(slot);
      return;
    }

    // =========================
    // FACTORY CARD
    // =========================
    const card = document.createElement("div");
    card.className = "factory-card";

    const currentWorkers = f.workers || 0;
    const maxWorkers     = f.maxWorkers || 1;

    const hasWorker = currentWorkers > 0;
    const isActive  = f.active !== false && hasWorker;

    const currentStored = isActive
      ? (f._previewStored ?? f.stored)
      : f.stored;

    const percent = Math.min(
      100,
      (currentStored / f.storage) * 100
    );

    const upgradeCost = f.level * 300;

    const disableUpgrade =
      myCoins < upgradeCost ||
      f._upgrading ||
      f.active === false
        ? "disabled"
        : "";

    const disableCollect =
      currentStored <= 0 ||
      f._collecting ||
      !isActive
        ? "disabled"
        : "";

    // =========================
    // 👷 WORKER BLOCK (NEW)
    // =========================
    let workerBlock = `
      <div style="font-size:12px;opacity:.85">
        👷 ${currentWorkers}/${maxWorkers}
      </div>
    `;

    if(currentWorkers < maxWorkers){
      workerBlock += `
        <button class="btn"
          style="background:#ffaa00"
          onclick="hireWorker(${index})">
          Thuê công nhân (${f.workerCost || 150} 💎)
        </button>
      `;
    }

    if(currentWorkers === 0){
      workerBlock += `
        <div style="color:#ff7777;font-size:11px">
          ⚠ Không có công nhân → Không hoạt động
        </div>
      `;
    }

    // =========================
    // 💸 DAILY FEE BLOCK
    // =========================
    let feeBlock = "";

    if(f.active === false && currentWorkers > 0){
      feeBlock = `
        <div style="color:#ff5555;font-weight:700;font-size:12px">
          ⛔ Ngừng hoạt động (chưa trả phí)
        </div>
        <button class="btn"
          style="background:#ffaa00"
          onclick="payFactoryFee(${index})">
          Trả phí ${f.dailyFee || 200} 💎
        </button>
      `;
    }else{
      feeBlock = `
        <div style="font-size:11px;opacity:.6">
          Phí/ngày: ${f.dailyFee || 200} 💎
        </div>
      `;
    }

    card.innerHTML = `
      <h3>Nhà máy #${f.id} (Lv.${f.level})</h3>

      ${workerBlock}
      ${feeBlock}

      <div class="factory-stats">
        ⚡ ${f.rate} 💎/s<br>
        📦 ${Math.floor(currentStored)}/${f.storage}
      </div>

      <div class="progress">
        <div class="progress-fill"
          style="width:${percent}%">
        </div>
      </div>

      <button class="btn btn-collect"
        ${disableCollect}
        onclick="collectFactory(${index})">
        Thu hoạch
      </button>

      <button class="btn btn-upgrade"
        ${disableUpgrade}
        onclick="upgradeFactory(${index})">
        ⬆ Nâng cấp (${upgradeCost} 💎)
      </button>
    `;

    grid.appendChild(card);
  });
}

function hireWorker(index){
  socket.emit("factory-hire-worker",{ index });
}


function collectFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chặn bấm khi đang thu
  if(f._collecting) return;
  f._collecting = true;

  // ✅ chỉ gửi index, server tự tính stored + cộng coin
  socket.emit("factory-collect", { index });

  // ❌ KHÔNG reset stored ở client
  // server sẽ emit "factory-update" mới
}

function upgradeFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chống spam click
  if(f._upgrading) return;
  f._upgrading = true;

  // ✅ chỉ gửi index
  socket.emit("factory-upgrade", { index });

  // ❌ KHÔNG tự tăng level/rate/storage ở client
  // ❌ KHÔNG render thủ công
}

function buildFactory(index){
  socket.emit("factory-build",{ index });
}

function payFactoryFee(index){
  socket.emit("factory-pay-fee",{ index });
}


socket.on("factory-update", data=>{
  factories = data;

  factories.forEach(f=>{
    if(!f.empty){
      f._previewStored = f.stored;
      f._collecting = false;
      f._upgrading = false; // ✅ mở lại nút upgrade
    }
  });

  render();
});

socket.on("factory-build-success", data=>{
  factories = data;
  render();
});

socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


socket.on("factory-error", d=>{
if(d.message === "MAX_WORKER_REACHED"){
  alert("Đã đạt tối đa số công nhân!");
}


  if(d.message === "NOT_ENOUGH_COIN"){
    alert("Không đủ kim cương!");
  }

  if(d.message === "FACTORY_INACTIVE"){
    alert("Nhà máy đang ngừng hoạt động! Hãy trả phí.");
  }
});

setInterval(updateFactories,1000);

render();

</script>

</body>
</html>
