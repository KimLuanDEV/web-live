<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhà máy sản xuất Kim Cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">

<style>

/* =========================
   💎 DIAMOND FACTORY V2
========================= */

html,body{
  margin:0;
  padding:0;
  color:#fff;
  font-family:system-ui;

  background:
    radial-gradient(circle at 50% 0%, rgba(0,240,255,.08), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(0,150,255,.08), transparent 60%),
    linear-gradient(180deg,#05080c,#03060a);
}
/* ===== TOP BAR PREMIUM ===== */
.topbar{
  position:relative;
  height:95px;
  width:100%;
  overflow:hidden;
}

.topbar-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* Back */
.tb-left{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
}

.backBtnImg{
  width:48px;
  transition:.25s ease;
}

.backBtnImg:active{
  transform:scale(.9);
}

/* Coin */
.tb-right{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
}

.walletBox{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:900;
  font-size:16px;
  color:#fff;

  text-shadow:
    0 0 12px rgba(0,240,255,.8),
    0 0 25px rgba(0,240,255,.4);
}

.coinIcon{
  width:22px;
}

/* ===== GRID ===== */

.factory-grid{
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(170px,1fr));
  gap:2px;
}

/* ===== FACTORY CARD ===== */

.factory-card{
  background:
    radial-gradient(circle at 50% 0%, rgba(0,240,255,.08), transparent 70%),
    linear-gradient(180deg,#0a1118,#05080c);

  border:1px solid rgba(0,240,255,.2);
  border-radius:18px;
  padding:0;
  display:flex;
  flex-direction:column;
  gap:0px;
  position:relative;

  transition:.35s ease;
  overflow:hidden;
}

.factory-card:hover{
  transform:translateY(-4px);
  box-shadow:
    0 15px 40px rgba(0,0,0,.6),
    0 0 30px rgba(0,240,255,.2);
}

.factory-card h3{
  margin:0;
  font-size:14px;
  color:#00f0ff;
}

.factory-stats{
  font-size:12px;
  opacity:.85;
}

.progress{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#0088ff);
  box-shadow:0 0 20px rgba(0,240,255,.6);
  transition:width .4s ease;
  position:relative;
}

.progress-fill::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3),
    transparent
  );
  animation: shine 2s linear infinite;
}

@keyframes shine{
  0%{ transform:translateX(-100%); }
  100%{ transform:translateX(100%); }
}

.btn{
  border:none;
  padding:8px;
  border-radius:8px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}

.btn-collect{
  background:linear-gradient(180deg,#00f0ff,#0088ff);
  color:#001;
}

.btn-upgrade{
  background:linear-gradient(180deg,#ff5050,#aa0000);
  color:#fff;
}

.slot-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;

  border:2px dashed rgba(0,240,255,.3);
  border-radius:18px;

  background:rgba(0,0,0,.3);

  cursor:pointer;
  opacity:.7;
  transition:.3s ease;
}

.slot-empty:hover{
  opacity:1;
  transform:scale(1.03);
  box-shadow:0 0 25px rgba(0,240,255,.3);
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}



.headerLogo{
  height:52px;
  max-width:100%;
  object-fit:contain;

  filter:
    drop-shadow(0 0 25px rgba(0,240,255,.6))
    drop-shadow(0 0 40px rgba(0,240,255,.3));

  transition:.3s ease;
}

.headerLogo:hover{
  transform:scale(1.05);
}


</style>
</head>

<body>

<div class="topbar">

  <!-- ẢNH NỀN HEADER -->
  <img src="/assets/ui/topbar-factory.png" class="topbar-bg">

  <!-- BACK BUTTON -->
  <div class="tb-left" onclick="location.href='/invest.html'">
    <img src="/assets/ui/back-panel1.png" class="backBtnImg">
  </div>

  <!-- COIN -->
  <div class="tb-right">
    <div class="walletBox">
      <img src="/assets/ui/diamond-icon1.png" class="coinIcon">
      <span id="coinVal">0</span>
    </div>
  </div>

</div>





<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});


let currentFactoryIndex = null;


let factories = [
  { empty:true }
];



function updateFactories(){

  const now = Date.now();

  factories.forEach(f=>{

    if(
      f.empty ||
      f.active === false ||
      !f.workers ||
      f.workers <= 0
    ) return;

    const seconds = Math.floor((now - f.lastUpdate)/1000);

    const preview = Math.min(
      f.storage,
      f.stored + seconds * f.rate
    );

    f._previewStored = preview;
  });

  render();

  // 🔥 nếu modal đang mở → update luôn
  if(currentFactoryIndex !== null){
    renderFactoryDetail();
  }
}



function render(){

  const grid = document.getElementById("factoryGrid");
  grid.innerHTML = "";

  const myCoins = Number(
    document.getElementById("coinVal").textContent || 0
  );

  factories.forEach((f,index)=>{

    // =========================
    // SLOT TRỐNG
    // =========================
    if(f.empty){

      const cost = (index + 1) * 500;
      const disabled = myCoins < cost
        ? "opacity:.5;pointer-events:none;"
        : "";

      const slot = document.createElement("div");
      slot.className = "slot-empty";
      slot.style = disabled;

      slot.innerHTML = `
        ➕ Xây nhà máy mới<br>
        <span style="font-size:11px;opacity:.7">
          Giá: ${cost} 💎
        </span>
      `;

      slot.onclick = ()=> buildFactory(index);
      grid.appendChild(slot);
      return;
    }

    // =========================
    // FACTORY CARD
    // =========================
    const card = document.createElement("div");
    card.className = "factory-card";
    card.style.cursor = "pointer";

    const currentWorkers = f.workers || 0;
    const hasWorker = currentWorkers > 0;
    const isActive  = f.active !== false && hasWorker;

    const currentStored = isActive
      ? (f._previewStored ?? f.stored)
      : f.stored;

    const percent = Math.min(
      100,
      (currentStored / f.storage) * 100
    );

    // =========================
    // 🎨 ẢNH THEO LEVEL
    // =========================
    let levelImg = "factory-lv1.png";

    if(f.level >= 5){
      levelImg = "factory-lv5.png";
    }else if(f.level === 4){
      levelImg = "factory-lv4.png";
    }else if(f.level === 3){
      levelImg = "factory-lv3.png";
    }else if(f.level === 2){
      levelImg = "factory-lv2.png";
    }

    // 🔥 nếu full kho → đổi màu progress
    const progressColor =
      percent >= 100
        ? "linear-gradient(90deg,#ffd700,#ffaa00)"
        : "linear-gradient(90deg,#00f0ff,#00aaff)";

    // =========================
    // HTML CARD
    // =========================
    card.innerHTML = `
      <div style="position:relative">

<img src="/assets/ui/${levelImg}"
     style="
       width:100%;
       border-radius:14px;
       transition:.4s ease;
       transform: scale(${isActive ? 1 : .95});
       filter:${isActive ? "brightness(1)" : "grayscale(1) brightness(.6)"};
     ">

        ${
          !isActive
          ? `<div style="
              position:absolute;
              inset:0;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:12px;
              font-weight:700;
              background:rgba(0,0,0,.6);
              border-radius:12px;
              color:#ff5555;
            ">
              ⛔ Tạm dừng
            </div>`
          : ""
        }

        <div style="
          position:absolute;
          top:8px;
          left:8px;
          background:rgba(0,0,0,.6);
          padding:4px 8px;
          border-radius:8px;
          font-size:11px;
        ">
          Lv.${f.level}
        </div>

      </div>

      <div class="progress" style="margin-top:-4px">
        <div class="progress-fill"
          style="width:${percent}%;
                 background:${progressColor}">
        </div>
      </div>
    `;

 card.onclick = ()=>{
  location.href = "/factory-detail.html?index=" + index;
};

    grid.appendChild(card);
  });
}

function hireWorker(index){
  socket.emit("factory-hire-worker",{ index });
}


function collectFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chặn bấm khi đang thu
  if(f._collecting) return;
  f._collecting = true;

  // ✅ chỉ gửi index, server tự tính stored + cộng coin
  socket.emit("factory-collect", { index });

  // ❌ KHÔNG reset stored ở client
  // server sẽ emit "factory-update" mới
}

function upgradeFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chống spam click
  if(f._upgrading) return;
  f._upgrading = true;

  // ✅ chỉ gửi index
  socket.emit("factory-upgrade", { index });

  // ❌ KHÔNG tự tăng level/rate/storage ở client
  // ❌ KHÔNG render thủ công
}

function buildFactory(index){
  socket.emit("factory-build",{ index });
}

function payFactoryFee(index){
  socket.emit("factory-pay-fee",{ index });
}


socket.on("factory-update", data=>{
  factories = data;

  factories.forEach(f=>{
    if(!f.empty){
      f._previewStored = f.stored;
      f._collecting = false;
      f._upgrading = false; // ✅ mở lại nút upgrade
    }
  });

  render();
});

socket.on("factory-build-success", data=>{
  factories = data;
  render();
});

socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


socket.on("factory-error", d=>{
if(d.message === "MAX_WORKER_REACHED"){
  alert("Đã đạt tối đa số công nhân!");
}


  if(d.message === "NOT_ENOUGH_COIN"){
    alert("Không đủ kim cương!");
  }

  if(d.message === "FACTORY_INACTIVE"){
    alert("Nhà máy đang ngừng hoạt động! Hãy trả phí.");
  }
});

setInterval(updateFactories,1000);

render();




</script>

</body>
</html>
