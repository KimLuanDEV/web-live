<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhà máy sản xuất Kim Cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">

<style>

/* =========================
   💎 DIAMOND FACTORY V2
========================= */

html,body{
  margin:0;
  padding:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui;
}

/* ===== TOP BAR ===== */

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0b0f14,#05080c);
  border-bottom:1px solid rgba(0,255,255,.15);
}

.title{
  font-weight:800;
  font-size:15px;
  text-shadow:0 0 10px rgba(0,255,255,.6);
}

.wallet{
  font-weight:800;
  color:#00f0ff;
}

/* ===== GRID ===== */

.factory-grid{
  padding:16px;
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

/* ===== FACTORY CARD ===== */

.factory-card{
  background:linear-gradient(180deg,#0a1016,#05080c);
  border:1px solid rgba(0,255,255,.15);
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
}

.factory-card h3{
  margin:0;
  font-size:14px;
  color:#00f0ff;
}

.factory-stats{
  font-size:12px;
  opacity:.85;
}

.progress{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00aaff);
  box-shadow:0 0 10px rgba(0,255,255,.8);
  transition:width .3s linear;
}

.btn{
  border:none;
  padding:8px;
  border-radius:8px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}

.btn-collect{
  background:linear-gradient(180deg,#00f0ff,#0088ff);
  color:#001;
}

.btn-upgrade{
  background:linear-gradient(180deg,#ff5050,#aa0000);
  color:#fff;
}

.slot-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:13px;
  border:2px dashed rgba(0,255,255,.3);
  border-radius:16px;
  cursor:pointer;
  opacity:.6;
}

.slot-empty:hover{
  opacity:1;
}

</style>
</head>

<body>

<div class="topbar">
  <div onclick="location.href='/invest.html'" style="cursor:pointer">←</div>
  <div class="title">🏭 Nhà máy Kim Cương</div>
  <div class="wallet"><span id="coinVal">0</span> 💎</div>
</div>

<div class="factory-grid" id="factoryGrid">
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

let factories = [
  {empty:true},
  {empty:true},
  {empty:true}
];

function updateFactories(){
  const now = Date.now();

  factories.forEach(f=>{
    if(f.empty) return;

    const seconds = (now - f.lastUpdate)/1000;
    f.stored += seconds * f.rate;
    if(f.stored > f.storage){
      f.stored = f.storage;
    }
    f.lastUpdate = now;
  });

  render();
}

function render(){

  const grid = document.getElementById("factoryGrid");
  grid.innerHTML = "";

  factories.forEach((f,index)=>{

if(f.empty){
  const cost = (index + 1) * 500;

  const slot = document.createElement("div");
  slot.className = "slot-empty";
  slot.innerHTML = `
    ➕ Xây nhà máy mới<br>
    <span style="font-size:11px;opacity:.7">
      Giá: ${cost} 💎
    </span>
  `;
  slot.onclick = ()=> buildFactory(index);
  grid.appendChild(slot);
  return;
}

    const card = document.createElement("div");
    card.className = "factory-card";

    const percent = (f.stored/f.storage)*100;

    card.innerHTML = `
      <h3>Nhà máy #${f.id}</h3>
      <div class="factory-stats">
        ⚡ ${f.rate} 💎/s<br>
        📦 ${Math.floor(f.stored)}/${f.storage}
      </div>

      <div class="progress">
        <div class="progress-fill" style="width:${percent}%"></div>
      </div>

      <button class="btn btn-collect"
        onclick="collectFactory(${index})">
        Thu hoạch
      </button>

      <button class="btn btn-upgrade"
        onclick="upgradeFactory(${index})">
        Nâng cấp
      </button>
    `;

    grid.appendChild(card);
  });
}

function collectFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  const amount = Math.floor(f.stored);
  if(amount <= 0) return;

  socket.emit("factory-collect",{amount});

  f.stored = 0;
  render();
}

function upgradeFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  const cost = f.level * 300;

  socket.emit("factory-upgrade",{cost});

  f.level++;
  f.rate += 1;
  f.storage += 100;

  render();
}

function buildFactory(index){

  // 💎 Giá tăng theo slot
  const cost = (index + 1) * 500;

  socket.emit("factory-upgrade",{cost});

  socket.once("factory-upgrade-success", ()=>{

    factories[index] = {
      id:index+1,
      level:1,
      rate:1,
      storage:100,
      stored:0,
      lastUpdate:Date.now()
    };

    render();
  });
}

socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    d.coins || 0;
});

setInterval(updateFactories,1000);

render();

</script>

</body>
</html>
