<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhà máy sản xuất Kim Cương</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">

<style>

/* =========================
   💎 DIAMOND FACTORY V2
========================= */

html,body{
  margin:0;
  padding:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui;
}

/* ===== TOP BAR ===== */

.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0b0f14,#05080c);
  border-bottom:1px solid rgba(0,255,255,.15);
}

.title{
  font-weight:800;
  font-size:15px;
  text-shadow:0 0 10px rgba(0,255,255,.6);
}

.wallet{
  font-weight:800;
  color:#00f0ff;
}

/* ===== GRID ===== */

.factory-grid{
  padding:16px;
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
  gap:16px;
}

/* ===== FACTORY CARD ===== */

.factory-card{
  background:linear-gradient(180deg,#0a1016,#05080c);
  border:1px solid rgba(0,255,255,.15);
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  position:relative;
}

.factory-card h3{
  margin:0;
  font-size:14px;
  color:#00f0ff;
}

.factory-stats{
  font-size:12px;
  opacity:.85;
}

.progress{
  height:10px;
  background:rgba(255,255,255,.08);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00aaff);
  box-shadow:0 0 10px rgba(0,255,255,.8);
  transition:width .3s linear;
}

.btn{
  border:none;
  padding:8px;
  border-radius:8px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}

.btn-collect{
  background:linear-gradient(180deg,#00f0ff,#0088ff);
  color:#001;
}

.btn-upgrade{
  background:linear-gradient(180deg,#ff5050,#aa0000);
  color:#fff;
}

.slot-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:13px;
  border:2px dashed rgba(0,255,255,.3);
  border-radius:16px;
  cursor:pointer;
  opacity:.6;
}

.slot-empty:hover{
  opacity:1;
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}


</style>
</head>

<body>

<div class="topbar">
  <div onclick="location.href='/invest.html'" style="cursor:pointer">←</div>
  <div class="title">🏭 Nhà máy Kim Cương</div>
  <div class="wallet"><span id="coinVal">0</span> 💎</div>
</div>

<div class="factory-grid" id="factoryGrid">
</div>






<!-- =========================
   🏭 FACTORY DETAIL MODAL
========================= -->
<div id="factoryModal" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
">
  <div id="factoryDetail"
       style="
         width:90%;
         max-width:420px;
         background:#0a1016;
         border:1px solid rgba(0,255,255,.2);
         border-radius:16px;
         padding:20px;
       ">
  </div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

let factories = [
  {empty:true},
  {empty:true},
  {empty:true}
];

function updateFactories(){

  const now = Date.now();

  factories.forEach(f=>{

if(
  f.empty ||
  f.active === false ||
  !f.workers ||
  f.workers <= 0
) return;

    const seconds = Math.floor((now - f.lastUpdate)/1000);

    // chỉ preview hiển thị
    const preview = Math.min(
      f.storage,
      f.stored + seconds * f.rate
    );

    f._previewStored = preview;
  });

  render();
}

function render(){

  const grid = document.getElementById("factoryGrid");
  grid.innerHTML = "";

  const myCoins = Number(
    document.getElementById("coinVal").textContent || 0
  );

  factories.forEach((f,index)=>{

    // =========================
    // SLOT TRỐNG
    // =========================
    if(f.empty){

      const cost = (index + 1) * 500;
      const disabled = myCoins < cost
        ? "opacity:.5;pointer-events:none;"
        : "";

      const slot = document.createElement("div");
      slot.className = "slot-empty";
      slot.style = disabled;

      slot.innerHTML = `
        ➕ Xây nhà máy mới<br>
        <span style="font-size:11px;opacity:.7">
          Giá: ${cost} 💎
        </span>
      `;

      slot.onclick = ()=> buildFactory(index);
      grid.appendChild(slot);
      return;
    }

    // =========================
    // FACTORY CARD
    // =========================
    const card = document.createElement("div");
    card.className = "factory-card";
    card.style.cursor = "pointer";

    const currentWorkers = f.workers || 0;
    const hasWorker = currentWorkers > 0;
    const isActive  = f.active !== false && hasWorker;

    const currentStored = isActive
      ? (f._previewStored ?? f.stored)
      : f.stored;

    const percent = Math.min(
      100,
      (currentStored / f.storage) * 100
    );

    // =========================
    // 🎨 ẢNH THEO LEVEL
    // =========================
    let levelImg = "factory-lv1.png";

    if(f.level >= 5){
      levelImg = "factory-lv5.png";
    }else if(f.level === 4){
      levelImg = "factory-lv4.png";
    }else if(f.level === 3){
      levelImg = "factory-lv3.png";
    }else if(f.level === 2){
      levelImg = "factory-lv2.png";
    }

    // 🔥 nếu full kho → đổi màu progress
    const progressColor =
      percent >= 100
        ? "linear-gradient(90deg,#ffd700,#ffaa00)"
        : "linear-gradient(90deg,#00f0ff,#00aaff)";

    // =========================
    // HTML CARD
    // =========================
    card.innerHTML = `
      <div style="position:relative">

        <img src="/assets/ui/${levelImg}"
             style="width:100%;
                    border-radius:12px;
                    opacity:${isActive ? 1 : .5};
                    transition:.3s">

        ${
          !isActive
          ? `<div style="
              position:absolute;
              inset:0;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:12px;
              font-weight:700;
              background:rgba(0,0,0,.6);
              border-radius:12px;
              color:#ff5555;
            ">
              ⛔ Tạm dừng
            </div>`
          : ""
        }

        <div style="
          position:absolute;
          top:8px;
          left:8px;
          background:rgba(0,0,0,.6);
          padding:4px 8px;
          border-radius:8px;
          font-size:11px;
        ">
          Lv.${f.level}
        </div>

      </div>

      <div class="progress" style="margin-top:8px">
        <div class="progress-fill"
          style="width:${percent}%;
                 background:${progressColor}">
        </div>
      </div>
    `;

    card.onclick = ()=>{
      openFactoryDetail(index);
    };

    grid.appendChild(card);
  });
}

function hireWorker(index){
  socket.emit("factory-hire-worker",{ index });
}


function collectFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chặn bấm khi đang thu
  if(f._collecting) return;
  f._collecting = true;

  // ✅ chỉ gửi index, server tự tính stored + cộng coin
  socket.emit("factory-collect", { index });

  // ❌ KHÔNG reset stored ở client
  // server sẽ emit "factory-update" mới
}

function upgradeFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chống spam click
  if(f._upgrading) return;
  f._upgrading = true;

  // ✅ chỉ gửi index
  socket.emit("factory-upgrade", { index });

  // ❌ KHÔNG tự tăng level/rate/storage ở client
  // ❌ KHÔNG render thủ công
}

function buildFactory(index){
  socket.emit("factory-build",{ index });
}

function payFactoryFee(index){
  socket.emit("factory-pay-fee",{ index });
}


socket.on("factory-update", data=>{
  factories = data;

  factories.forEach(f=>{
    if(!f.empty){
      f._previewStored = f.stored;
      f._collecting = false;
      f._upgrading = false; // ✅ mở lại nút upgrade
    }
  });

  render();
});

socket.on("factory-build-success", data=>{
  factories = data;
  render();
});

socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


socket.on("factory-error", d=>{
if(d.message === "MAX_WORKER_REACHED"){
  alert("Đã đạt tối đa số công nhân!");
}


  if(d.message === "NOT_ENOUGH_COIN"){
    alert("Không đủ kim cương!");
  }

  if(d.message === "FACTORY_INACTIVE"){
    alert("Nhà máy đang ngừng hoạt động! Hãy trả phí.");
  }
});

setInterval(updateFactories,1000);

render();




function openFactoryDetail(index){

  const f = factories[index];
  if(!f || f.empty) return;

  const modal = document.getElementById("factoryModal");
  const box   = document.getElementById("factoryDetail");

  const currentWorkers = f.workers || 0;
  const maxWorkers     = f.maxWorkers || 1;

  const currentStored = f.stored;

  box.innerHTML = `
    <h3>🏭 Nhà máy #${f.id} (Lv.${f.level})</h3>

    <div style="margin-top:10px">
      ⚡ Tốc độ:
      ${(f.workers||0)*(f.baseRate||1)} 💎/s
    </div>

    <div>
      📦 Kho:
      ${Math.floor(currentStored)}/${f.storage}
    </div>

    <div>
      👷 Công nhân:
      ${currentWorkers}/${maxWorkers}
    </div>

    <div>
      💼 Lương/ngày:
      ${(f.workerSalary||50)*currentWorkers} 💎
    </div>

    <div>
      🧾 Phí vận hành:
      ${f.dailyFee||200} 💎/ngày
    </div>

    <div style="margin-top:15px;display:flex;flex-direction:column;gap:8px">

      <button class="btn btn-collect"
        onclick="collectFactory(${index})">
        Thu hoạch
      </button>

      <button class="btn btn-upgrade"
        onclick="upgradeFactory(${index})">
        ⬆ Nâng cấp (${f.level*300} 💎)
      </button>

      <button class="btn"
        style="background:#ffaa00"
        onclick="hireWorker(${index})">
        Thuê công nhân
      </button>

      <button class="btn"
        style="background:#555"
        onclick="closeFactoryDetail()">
        Đóng
      </button>
    </div>
  `;

  modal.style.display = "flex";
}

function closeFactoryDetail(){
  document.getElementById("factoryModal").style.display="none";
}


</script>

</body>
</html>
