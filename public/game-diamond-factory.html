<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Diamond Factory</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="/style.css">

<style>

/* =========================
   💎 DIAMOND FACTORY V2
========================= */

html,body{
  margin:0;
  padding:0;
  color:#fff;
  font-family:system-ui;
  height:100%;

  background:url('/assets/ui/bg-diamond-factory.jpg') center top no-repeat;
  background-size:cover;
  background-attachment:fixed;
}


body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.3),
    rgba(0,0,0,.6)
  );
  pointer-events:none;
}


/* ===== TOP BAR PREMIUM ===== */
.topbar{
  position:absolute; /* 🔥 đổi từ relative */
  top:0;
  left:0;
  width:100%;

  height:95px;
  padding-top: env(safe-area-inset-top);

  overflow:hidden;
  z-index:10;
}

.topbar-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

/* ===== HIT AREA BACK ===== */
.backHit{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  width:90px;
  height:65px;
  cursor:pointer;
}

/* ===== COIN TEXT ===== */
.coinArea{
  position:absolute;
  right:43px;
  top: 63%;
  transform:translateY(-50%);

  font-size:17px;
  font-weight:900;
  color:#ffffff;

  text-shadow:
    0 0 12px rgba(0,240,255,.9),
    0 0 25px rgba(0,240,255,.6);
}

/* ===== GRID ===== */

.factory-grid{
  padding:10px;
  padding-top: calc(70px + env(safe-area-inset-top));
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(170px,1fr));
  gap:10px;
}

/* ===== FACTORY CARD ===== */

.factory-card{
  position:relative;
  border-radius:30px;
  overflow:hidden;
  padding:0;

  background:
    radial-gradient(circle at 50% 0%, rgba(0,240,255,.08), transparent 70%),
    linear-gradient(180deg,#0a1118,#05080c);

  border:2px solid rgba(0,240,255,.35);

  box-shadow:
    0 0 0 1px rgba(0,240,255,.2),
    inset 0 0 25px rgba(0,240,255,.05),
    0 15px 40px rgba(0,0,0,.6);

  transition:.35s ease;
}

.factory-card:hover{
  transform:translateY(-6px);

  border-color:rgba(0,240,255,.8);

  box-shadow:
    0 0 0 1px rgba(0,240,255,.5),
    0 0 30px rgba(0,240,255,.4),
    0 20px 50px rgba(0,0,0,.7);
}


.factory-card::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  padding:2px; /* độ dày viền */

  background:linear-gradient(120deg,#00f0ff,#0088ff,#00f0ff);

  /* cách mới: dùng background-clip */
  -webkit-background-clip: content-box, border-box;
  background-clip: content-box, border-box;

  mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  mask-composite: exclude;

  pointer-events:none;
  opacity:.6;
}



.factory-card h3{
  margin:0;
  font-size:14px;
  color:#00f0ff;
}

.factory-stats{
  font-size:12px;
  opacity:.85;
}

.progress{
  height:0px;
  background:rgba(255,255,255,.08);
  border-radius:6px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#0088ff);
  box-shadow:0 0 20px rgba(0,240,255,.6);
  transition:width .4s ease;
  position:relative;
}

.progress-fill::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.3),
    transparent
  );
  animation: shine 2s linear infinite;
}

@keyframes shine{
  0%{ transform:translateX(-100%); }
  100%{ transform:translateX(100%); }
}

.btn{
  border:none;
  padding:8px;
  border-radius:8px;
  font-weight:700;
  font-size:12px;
  cursor:pointer;
}

.btn-collect{
  background:linear-gradient(180deg,#00f0ff,#0088ff);
  color:#001;
}

.btn-upgrade{
  background:linear-gradient(180deg,#ff5050,#aa0000);
  color:#fff;
}

.slot-empty{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:13px;

  border:2px dashed rgba(0,240,255,.3);
  border-radius:18px;

  background:rgba(0,0,0,.3);

  cursor:pointer;
  opacity:.7;
  transition:.3s ease;
}

.slot-empty:hover{
  opacity:1;
  transform:scale(1.03);
  box-shadow:0 0 25px rgba(0,240,255,.3);
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}



.headerLogo{
  height:52px;
  max-width:100%;
  object-fit:contain;

  filter:
    drop-shadow(0 0 25px rgba(0,240,255,.6))
    drop-shadow(0 0 40px rgba(0,240,255,.3));

  transition:.3s ease;
}

.headerLogo:hover{
  transform:scale(1.05);
}



/* =========================
   LOADING OVERLAY
========================= */

#loadingOverlay{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at center,#00121f,#000);

  overflow:hidden;
  transition:opacity .8s ease;
}

/* CORE */
.loader-core{
  text-align:center;
}

/* RINGS */

.loader-ring{
  position:absolute;
  width:220px;
  height:220px;

  border:2px solid rgba(0,240,255,.3);
  border-radius:50%;

  animation:spin 3s linear infinite;
}

.loader-ring.ring2{
  width:280px;
  height:280px;

  border-color:rgba(0,150,255,.2);
  animation-direction:reverse;
  animation-duration:6s;
}

/* LOGO */

.loader-logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;

  color:#00f0ff;

  text-shadow:
    0 0 15px #00f0ff,
    0 0 40px #0088ff;

  margin-bottom:30px;
}

/* BAR */

.loader-bar{
  width:260px;
  height:8px;

  background:rgba(255,255,255,.08);
  border-radius:20px;

  overflow:hidden;

  margin:auto;
}

.loader-progress{
  width:0%;
  height:100%;

  background:linear-gradient(
    90deg,
    #00f0ff,
    #0088ff,
    #00f0ff
  );

  box-shadow:
    0 0 20px rgba(0,240,255,.8);

  transition:.3s;
}

/* TEXT */

.loader-text{
  margin-top:12px;
  font-size:12px;
  opacity:.7;
}

/* ANIMATION */

@keyframes spin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}


/* CYBER GRID BACKGROUND */

#loadingOverlay::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(#00f0ff22 1px, transparent 1px),
    linear-gradient(90deg,#00f0ff22 1px, transparent 1px);

  background-size:60px 60px;

  animation:gridMove 8s linear infinite;
}

@keyframes gridMove{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(60px);
  }
}



.diamondParticles{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.diamond{
  position:absolute;
  width:6px;
  height:6px;

  background:#00f0ff;

  transform:rotate(45deg);

  box-shadow:
    0 0 10px #00f0ff,
    0 0 20px #0088ff;

  animation:diamondFloat linear infinite;
}

@keyframes diamondFloat{

  from{
    transform:translateY(100vh) rotate(45deg);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  to{
    transform:translateY(-20vh) rotate(45deg);
    opacity:0;
  }

}




#introCinematic{
  position:fixed;
  inset:0;
  z-index:10000;

  background:black;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

/* FLASH */

.introFlash{
  position:absolute;
  inset:0;

  background:radial-gradient(circle,#00f0ff,transparent 70%);
  opacity:0;

  animation:introFlash 1.5s ease forwards;
}

@keyframes introFlash{

  0%{opacity:0}

  40%{
    opacity:.8;
    transform:scale(.5);
  }

  100%{
    opacity:0;
    transform:scale(2);
  }

}

/* LOGO */

.introLogo{

  font-size:48px;
  font-weight:900;
  letter-spacing:6px;

  color:#00f0ff;

  opacity:0;

  text-shadow:
    0 0 20px #00f0ff,
    0 0 40px #0088ff,
    0 0 80px #00f0ff;

  animation:introLogo 2.5s ease forwards;
  animation-delay:.5s;
}

@keyframes introLogo{

  0%{
    opacity:0;
    transform:scale(.6);
  }

  50%{
    opacity:1;
    transform:scale(1.05);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }

}



.radarScan{
  position:absolute;
  inset:0;
  pointer-events:none;

  background:conic-gradient(
    from 0deg,
    transparent,
    rgba(0,240,255,.25),
    transparent 60%
  );

  animation:radarSpin 6s linear infinite;
}

@keyframes radarSpin{
  from{ transform:rotate(0deg); }
  to{ transform:rotate(360deg); }
}


.energyCore{

  position:absolute;
  width:120px;
  height:120px;

  border-radius:50%;

  background:radial-gradient(
    circle,
    #00f0ff,
    transparent 70%
  );

  filter:blur(20px);

  animation:corePulse 2s ease-in-out infinite;
}

@keyframes corePulse{

  0%{
    transform:scale(.8);
    opacity:.5;
  }

  50%{
    transform:scale(1.2);
    opacity:1;
  }

  100%{
    transform:scale(.8);
    opacity:.5;
  }

}



</style>
</head>

<body>



<div id="introCinematic">

  <div class="introFlash"></div>

  <div class="introLogo">
    DIAMOND FACTORY
  </div>

</div>


<!-- =========================
     🚀 LOADING OVERLAY
========================= -->
<div id="loadingOverlay">


  <div class="diamondParticles"></div>

<div class="radarScan"></div>

<div class="energyCore"></div>

  <div class="loader-core">

    <div class="loader-ring"></div>
    <div class="loader-ring ring2"></div>

    <div class="loader-logo">
      DIAMOND FACTORY
    </div>

    <div class="loader-bar">
      <div class="loader-progress" id="loaderProgress"></div>
    </div>

<div class="loader-text" id="bootText">
Booting Factory Core...
</div>

  </div>

</div>


<div class="topbar">

  <!-- ẢNH NỀN HEADER -->
  <img src="/assets/ui/topbar-factory.png" class="topbar-bg">

  <!-- VÙNG CLICK BACK -->
  <div class="backHit"
       onclick="location.href='/invest.html'">
  </div>

  <!-- VÙNG HIỂN THỊ COIN -->
  <div class="coinArea">
    <span id="coinVal">0</span>
  </div>

</div>




<div class="factory-grid" id="factoryGrid">
</div>


<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});


let currentFactoryIndex = null;


let factories = [
  { empty:true }
];



function updateFactories(){

  const now = Date.now();

  factories.forEach(f=>{

    if(
      f.empty ||
      f.active === false ||
      !f.workers ||
      f.workers <= 0
    ) return;

    const seconds = Math.floor((now - f.lastUpdate)/1000);

    const preview = Math.min(
      f.storage,
      f.stored + seconds * f.rate
    );

    f._previewStored = preview;
  });

  render();

  // 🔥 nếu modal đang mở → update luôn
  if(currentFactoryIndex !== null){
    renderFactoryDetail();
  }
}



function render(){

  const grid = document.getElementById("factoryGrid");
  grid.innerHTML = "";

  const myCoins = Number(
    document.getElementById("coinVal").textContent || 0
  );

  factories.forEach((f,index)=>{

    // =========================
    // SLOT TRỐNG
    // =========================
    if(f.empty){

      const cost = (index + 1) * 500;
      const disabled = myCoins < cost
        ? "opacity:.5;pointer-events:none;"
        : "";

      const slot = document.createElement("div");
      slot.className = "slot-empty";
      slot.style = disabled;

      slot.innerHTML = `
        ➕ Build<br>
        <span style="font-size:11px;opacity:.7">
          Cost: ${cost} 💎
        </span>
      `;

      slot.onclick = ()=> buildFactory(index);
      grid.appendChild(slot);
      return;
    }

    // =========================
    // FACTORY CARD
    // =========================
    const card = document.createElement("div");
    card.className = "factory-card";
    card.style.cursor = "pointer";

    const currentWorkers = f.workers || 0;
    const hasWorker = currentWorkers > 0;
    const isActive  = f.active !== false && hasWorker;

    const currentStored = isActive
      ? (f._previewStored ?? f.stored)
      : f.stored;

    const percent = Math.min(
      100,
      (currentStored / f.storage) * 100
    );

    let levelImg = "factory-lv1.png";

    if(f.level >= 5){
      levelImg = "factory-lv5.png";
    }else if(f.level === 4){
      levelImg = "factory-lv4.png";
    }else if(f.level === 3){
      levelImg = "factory-lv3.png";
    }else if(f.level === 2){
      levelImg = "factory-lv2.png";
    }

    const progressColor =
      percent >= 100
        ? "linear-gradient(90deg,#ffd700,#ffaa00)"
        : "linear-gradient(90deg,#00f0ff,#00aaff)";

    card.innerHTML = `
      <div style="position:relative">

        <img src="/assets/ui/${levelImg}"
          style="
            width:100%;
            border-radius:14px;
            transition:.4s ease;
            transform: scale(${isActive ? 1 : .95});
            filter:${isActive ? "brightness(1)" : "grayscale(1) brightness(.6)"};
          ">

        ${
          !isActive
          ? `<div style="
              position:absolute;
              inset:0;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:12px;
              font-weight:700;
              background:rgba(0,0,0,.6);
              border-radius:12px;
              color:#ff5555;
            ">
              ⛔ INACTIVE
            </div>`
          : ""
        }

        <div style="
          position:absolute;
          top:8px;
          left:8px;
          background:rgba(0,0,0,.6);
          padding:4px 8px;
          border-radius:8px;
          font-size:11px;
        ">
          Lv.${f.level}
        </div>

      </div>

      <div class="progress" style="margin-top:-4px">
        <div class="progress-fill"
          style="width:${percent}%;
                 background:${progressColor}">
        </div>
      </div>
    `;

    card.onclick = ()=>{
      location.href = "/factory-detail.html?index=" + index;
    };

    grid.appendChild(card);
  });


  // ==========================================
  // 🚀 STAR WAR CARD (THÊM Ở CUỐI GRID)
  // ==========================================
  const starCard = document.createElement("div");
  starCard.className = "factory-card";
  starCard.style.cursor = "pointer";

  starCard.innerHTML = `
    <div style="position:relative">

      <img src="/assets/ui/star-war-thumb.png"
           style="
             width:100%;
             border-radius:14px;
             transition:.3s ease;
           ">

      <div style="
        position:absolute;
        inset:0;
        background:linear-gradient(
          180deg,
          rgba(0,0,0,.1),
          rgba(0,0,0,.6)
        );
        border-radius:14px;
      "></div>

      <div style="
        position:absolute;
        bottom:12px;
        left:12px;
        font-weight:900;
        font-size:16px;
        color:#00f0ff;
        text-shadow:0 0 20px rgba(0,240,255,.8);
      ">
       STAR WAR
      </div>

    </div>
  `;

  starCard.onclick = ()=>{
    location.href = "/star-war.html";
  };

  grid.appendChild(starCard);
}






function hireWorker(index){
  socket.emit("factory-hire-worker",{ index });
}


function collectFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chặn bấm khi đang thu
  if(f._collecting) return;
  f._collecting = true;

  // ✅ chỉ gửi index, server tự tính stored + cộng coin
  socket.emit("factory-collect", { index });

  // ❌ KHÔNG reset stored ở client
  // server sẽ emit "factory-update" mới
}

function upgradeFactory(index){

  const f = factories[index];
  if(!f || f.empty) return;

  // (optional) chống spam click
  if(f._upgrading) return;
  f._upgrading = true;

  // ✅ chỉ gửi index
  socket.emit("factory-upgrade", { index });

  // ❌ KHÔNG tự tăng level/rate/storage ở client
  // ❌ KHÔNG render thủ công
}

function buildFactory(index){
  socket.emit("factory-build",{ index });
}

function payFactoryFee(index){
  socket.emit("factory-pay-fee",{ index });
}


socket.on("factory-update", data=>{
  factories = data;

  factories.forEach(f=>{
    if(!f.empty){
      f._previewStored = f.stored;
      f._collecting = false;
      f._upgrading = false; // ✅ mở lại nút upgrade
    }
  });

  render();
});

socket.on("factory-build-success", data=>{
  factories = data;
  render();
});

socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


socket.on("factory-error", d=>{
if(d.message === "MAX_WORKER_REACHED"){
  alert("Đã đạt tối đa số công nhân!");
}


  if(d.message === "NOT_ENOUGH_COIN"){
    alert("Không đủ kim cương!");
  }

  if(d.message === "FACTORY_INACTIVE"){
    alert("Nhà máy đang ngừng hoạt động! Hãy trả phí.");
  }
});

setInterval(updateFactories,1000);

render();




// =======================
// AAA INTRO CINEMATIC
// =======================

setTimeout(()=>{

  const intro = document.getElementById("introCinematic");

  intro.style.opacity = 0;
  intro.style.transition = "opacity 1s";

  setTimeout(()=>{
    intro.remove();
  },1000);

},3200);



// =======================
// LOADER SYSTEM
// =======================

let loaderProgress = 0;

const loaderBar = document.getElementById("loaderProgress");

const loaderInterval = setInterval(()=>{

  loaderProgress += Math.random()*12;

  if(loaderProgress >= 100){
    loaderProgress = 100;

    clearInterval(loaderInterval);

    setTimeout(()=>{

      const overlay = document.getElementById("loadingOverlay");

overlay.style.transform = "scale(1.4)";
overlay.style.opacity = 0;
overlay.style.transition = "transform 1s, opacity 1s";

      setTimeout(()=>{
        document.getElementById("loadingOverlay").remove();
      },600);

    },300);
  }

  loaderBar.style.width = loaderProgress + "%";

},120);



// =======================
// DIAMOND PARTICLES
// =======================

const particleContainer = document.querySelector(".diamondParticles");

function spawnDiamond(){

  const d = document.createElement("div");
  d.className = "diamond";

  const x = Math.random()*100;

  d.style.left = x + "%";

  const size = 4 + Math.random()*6;
  d.style.width = size + "px";
  d.style.height = size + "px";

  const duration = 4 + Math.random()*4;

  d.style.animationDuration = duration + "s";

  particleContainer.appendChild(d);

  setTimeout(()=> d.remove(), duration*1000);

}

setInterval(spawnDiamond,200);


const bootMessages = [
"Booting Factory Core...",
"Loading Worker Systems...",
"Calibrating Diamond Extractors...",
"Connecting Storage Network...",
"Synchronizing Production...",
"Initializing Livestream Pro Engine..."
];

let bootIndex = 0;

setInterval(()=>{

  bootIndex++;

  if(bootIndex >= bootMessages.length) return;

  document.getElementById("bootText").textContent =
    bootMessages[bootIndex];

},1200);


</script>

</body>
</html>
