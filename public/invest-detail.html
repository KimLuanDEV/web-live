<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Phân tích đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">







<style>

html, body {
  margin: 0;              /* 🔥 cái này thường bị quên */
  padding: 0;
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}


.page-invest-detail {
  width: 100%;
  max-width: 100%;
  margin: 0;              /* 🔥 kéo nội dung sang trái */
  padding: 0;
  overflow-x: hidden;
  background: #000;
}


.page-invest-detail section,
.page-invest-detail .card {
  padding-left: 8px;
  padding-right: 8px;
}


.detail-header {
  padding-left: 12px;
  padding-right: 12px;
  box-sizing: border-box;
}


.chart-wrap {
  width: 100%;
  max-width: 100%;
  overflow: hidden;
}

#priceChart {
  display: block;
  width: 100% !important;
  max-width: 100%;
}


.history-table-wrap {
  width: 100%;
  overflow-x: auto;   /* chỉ table được scroll ngang */
  -webkit-overflow-scrolling: touch;
}

.history-table {
  width: 100%;
  min-width: 100%;
  border-collapse: collapse;
}


.page-invest-detail {
  overscroll-behavior-x: none;
  touch-action: pan-y;
}


.detail-header,
.overlay-timer,
.live-badge-fixed,
.trend-overlay,
.pnl-overlay {
  max-width: 100vw;
}



/* ===== CHART CARD XỊN ===== */
.detail-chart.chart-wrap {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  padding: 0;
  overflow: hidden;

  /* ✨ bo góc */
  border-radius: 16px;

  /* ✨ nền tối nhẹ */
  background: linear-gradient(
    180deg,
    rgba(20,20,20,.95),
    rgba(10,10,10,1)
  );

  /* ✨ shadow nhẹ, không bệt */
  box-shadow:
    0 8px 24px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.detail-chart .overlay-timer {
  left: 14px;
  top: 14px;
}

.detail-chart .live-badge-fixed {
  right: 14px;
  top: 14px;
}

.detail-chart .trend-overlay {
  left: 50%;
  transform: translateX(-50%);
  bottom: 14px;
}


.detail-chart .pnl-overlay {
  right: 14px;
  bottom: 14px;
}

.detail-chart.chart-wrap {
  border-radius: 20px;
}

/* ===== GRADIENT THEO XU HƯỚNG ===== */
.detail-chart.chart-wrap {
  transition: background 0.6s ease; /* mượt khi đổi màu */
}

/* 🟢 TĂNG */
.detail-chart.trend-up {
  background: linear-gradient(
    180deg,
    rgba(0, 255, 153, 0.18),
    rgba(10, 10, 10, 1)
  );
}

/* 🔴 GIẢM */
.detail-chart.trend-down {
  background: linear-gradient(
    180deg,
    rgba(255, 92, 92, 0.18),
    rgba(10, 10, 10, 1)
  );
}

/* ➖ SIDEWAY */
.detail-chart.trend-neutral {
  background: linear-gradient(
    180deg,
    rgba(120, 120, 120, 0.12),
    rgba(10, 10, 10, 1)
  );
}


/* ===== CINEMATIC HEIGHT ===== */
.detail-chart.chart-wrap {
  min-height: 42vh;          /* mobile cinematic */
  max-height: 520px;         /* chặn quá cao desktop */
  display: flex;
  align-items: stretch;
}

/* canvas chiếm toàn bộ chiều cao chart */
.detail-chart #priceChart {
  height: 100% !important;
}

/* cinematic feel: vignette nhẹ */
.detail-chart::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at center,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,.35) 100%
    );
}



.detail-chart .overlay-timer,
.detail-chart .live-badge-fixed {
  top: 18px;
}





/* đảm bảo overlay bám theo chart */
.detail-chart { position: relative; }

/* ===== HISTORY FLOATING BUTTON ===== */
.history-fab{
  position: absolute;
  left: 14px;
  bottom: 14px;
  z-index: 6;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 14px;
  cursor: pointer;

  display: grid;
  place-items: center;

  background: rgba(15,15,15,.75);
  box-shadow: 0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  color: #fff;
  font-size: 18px;
  transform: translateZ(0);
}
.history-fab:active{ transform: scale(.96); }


/* ===== BOTTOM SHEET MODAL ===== */
.sheet.hidden{ display:none; }
.sheet{
  position: fixed;
  inset: 0;
  z-index: 9999;
}
.sheet-backdrop{
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.55);
}
.sheet-box{
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  background: rgba(12,12,12,.98);
  border-top-left-radius: 18px;
  border-top-right-radius: 18px;
  box-shadow: 0 -18px 60px rgba(0,0,0,.6);
  max-height: 72vh;
  overflow: hidden;
  animation: sheetUp .18s ease-out;
}
@keyframes sheetUp{
  from{ transform: translateY(18px); opacity: .7; }
  to{ transform: translateY(0); opacity: 1; }
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.sheet-title{
  font-weight: 700;
}
.sheet-close{
  border:0;
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  color:#fff;
  cursor:pointer;
}
.sheet-body{
  padding: 10px 12px 14px;
}

/* table trong sheet: scroll ngang riêng */
.sheet-table{ overflow-x: auto; }



/* ===== ORDERS FLOATING BUTTON ===== */
.orders-fab{
  position: absolute;
  left: 64px;
  bottom: 14px;              /* nằm trên icon lịch sử */
  z-index: 6;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 14px;
  cursor: pointer;

  display: grid;
  place-items: center;

  background: rgba(15,15,15,.75);
  box-shadow: 0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  color: #fff;
  font-size: 18px;
}
.orders-fab:active{ transform: scale(.96); }



</style>


</head>

<body class="page-invest-detail">

<header class="detail-header">
  <button class="back-btn" id="btnBack">←</button>


  <div class="header-center">
    <h1 id="assetTitle">📊 Phân tích</h1>
    <div class="header-sub">Realtime • 60s / phiên</div>
  </div>
</header>


<!-- 📈 CHART -->
<section class="detail-chart card chart-wrap">
  <canvas id="priceChart" height="220"></canvas>

  <!-- ⏳ TIMER (GÓC TRÁI) -->
  <div id="roundTimer" class="round-timer overlay-timer">
    ⏳
  </div>

  <!-- 🔴 LIVE BADGE (GÓC PHẢI) -->
  <div id="liveBadge" class="live-badge-fixed">
    LIVE
  </div>

 <!-- 📊 TREND -->
  <div id="trendText" class="trend-overlay neutral">
    ➖ Sideway
  </div>


  <!-- 🧾 HISTORY BUTTON (ICON NỔI) -->
<button id="btnOpenHistory" class="history-fab" title="Lịch sử phiên">
  📊
</button>


<!-- 🧾 ORDERS BUTTON (ICON NỔI) -->
<button id="btnOpenOrders" class="orders-fab" title="Lệnh trong phiên">
  👤
</button>



  <!-- 💰 PnL realtime -->
<div id="pnlRealtime" class="pnl-overlay hidden">
  PnL: 0%
</div>





</section>




<!-- 🧠 INFO BAR -->
<section class="detail-info card info-bar">

  <ul id="analysisText" class="analysis-list"></ul>
</section>

<!-- 🚀 ACTION -->
<section class="detail-invest card invest-action">
  <div class="coin-row">
    💎 Số dư: <b id="myCoin">0</b>
  </div>

  <input
    id="investAmount"
    type="number"
    placeholder="Nhập số coin đầu tư"
  >

  <button onclick="confirmInvest()">🚀 VÀO LỆNH</button>
</section>

<!-- 🔔 MODAL -->
<div id="appModal" class="app-modal hidden">
  <div class="app-modal-backdrop" onclick="closeAppModal()"></div>
  <div class="app-modal-box">
    <h3 id="appModalTitle">Thông báo</h3>
    <div id="appModalContent"></div>
    <button class="app-modal-btn" onclick="closeAppModal()">OK</button>
  </div>
</div>





<!-- 📊 HISTORY MODAL -->
<div id="historyModal" class="sheet hidden" aria-hidden="true">
  <div class="sheet-backdrop" id="historyBackdrop"></div>

  <div class="sheet-box">
    <div class="sheet-head">
      <div class="sheet-title">📊 Lịch sử các phiên</div>
      <button class="sheet-close" id="btnCloseHistory">✕</button>
    </div>

    <div class="sheet-body">
      <div class="history-table-wrap sheet-table">
        <table class="history-table">
          <thead>
            <tr>
              <th>🕒</th>
              <th class="asset-th"><img src="/assets/silver.png" alt="Bạc"></th>
              <th class="asset-th"><img src="/assets/gold.png" alt="Vàng"></th>
              <th class="asset-th"><img src="/assets/diamond.png" alt="Kim cương"></th>
            </tr>
          </thead>
          <tbody id="roundHistoryModal">
            <tr><td colspan="4" class="empty">Chưa có dữ liệu</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>


<!-- 🧾 ORDERS MODAL -->
<div id="ordersModal" class="sheet hidden" aria-hidden="true">
  <div class="sheet-backdrop" id="ordersBackdrop"></div>

  <div class="sheet-box">
    <div class="sheet-head">
      <div class="sheet-title">🧾 Lệnh trong phiên</div>
      <button class="sheet-close" id="btnCloseOrders">✕</button>
    </div>

    <div class="sheet-body">
      <ul id="orderListModal" class="order-list">
        <li class="empty">Chưa có lệnh nào</li>
      </ul>
    </div>
  </div>
</div>




<script src="/socket.io/socket.io.js"></script>
