<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Phân tích đầu tư</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">







<style>

html, body {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden; /* ⛔ chặn xô ngang */
}

.page-invest-detail {
  width: 100vw;
  max-width: 100vw;
  overflow-x: hidden;
  background: #000; /* nền đen full */
}


.page-invest-detail section,
.page-invest-detail .card {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
}



.chart-wrap {
  width: 100%;
  max-width: 100%;
  overflow: hidden;
}

#priceChart {
  display: block;
  width: 100% !important;
  max-width: 100%;
}


.history-table-wrap {
  width: 100%;
  overflow-x: auto;   /* chỉ table được scroll ngang */
  -webkit-overflow-scrolling: touch;
}

.history-table {
  width: 100%;
  min-width: 100%;
  border-collapse: collapse;
}


.page-invest-detail {
  overscroll-behavior-x: none;
  touch-action: pan-y;
}


.detail-header,
.overlay-timer,
.live-badge-fixed,
.trend-overlay,
.pnl-overlay {
  max-width: 100vw;
}


</style>


</head>

<body class="page-invest-detail">

<header class="detail-header">
  <button class="back-btn" id="btnBack">←</button>


  <div class="header-center">
    <h1 id="assetTitle">📊 Phân tích</h1>
    <div class="header-sub">Realtime • 60s / phiên</div>
  </div>
</header>


<!-- 📈 CHART -->
<section class="detail-chart card chart-wrap">
  <canvas id="priceChart" height="220"></canvas>

  <!-- ⏳ TIMER (GÓC TRÁI) -->
  <div id="roundTimer" class="round-timer overlay-timer">
    ⏳
  </div>

  <!-- 🔴 LIVE BADGE (GÓC PHẢI) -->
  <div id="liveBadge" class="live-badge-fixed">
    LIVE
  </div>

 <!-- 📊 TREND -->
  <div id="trendText" class="trend-overlay neutral">
    ➖ Sideway
  </div>


  <!-- 💰 PnL realtime -->
<div id="pnlRealtime" class="pnl-overlay hidden">
  PnL: 0%
</div>


</section>




<!-- 🧠 INFO BAR -->
<section class="detail-info card info-bar">

  <ul id="analysisText" class="analysis-list"></ul>
</section>

<!-- 🧾 LỆNH -->
<section class="detail-orders card">
  <h3>🧾 Lệnh trong phiên</h3>
  <ul id="orderList" class="order-list">
    <li class="empty">Chưa có lệnh nào</li>
  </ul>
</section>

<!-- 📊 LỊCH SỬ -->
<section class="detail-history card">
  <h3>📊 Lịch sử các phiên</h3>

  <div class="history-table-wrap">
    <table class="history-table">
      <thead>
        <tr>
          <th>🕒</th>
          
          <th class="asset-th">
  <img src="/assets/silver.png" alt="Bạc">
</th>
<th class="asset-th">
  <img src="/assets/gold.png" alt="Vàng">
</th>
<th class="asset-th">
  <img src="/assets/diamond.png" alt="Kim cương">
</th>

        </tr>
      </thead>
      <tbody id="roundHistory">
        <tr>
          <td colspan="4" class="empty">Chưa có dữ liệu</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>

<!-- 🚀 ACTION -->
<section class="detail-invest card invest-action">
  <div class="coin-row">
    💎 Số dư: <b id="myCoin">0</b>
  </div>

  <input
    id="investAmount"
    type="number"
    placeholder="Nhập số coin đầu tư"
  >

  <button onclick="confirmInvest()">🚀 VÀO LỆNH</button>
</section>

<!-- 🔔 MODAL -->
<div id="appModal" class="app-modal hidden">
  <div class="app-modal-backdrop" onclick="closeAppModal()"></div>
  <div class="app-modal-box">
    <h3 id="appModalTitle">Thông báo</h3>
    <div id="appModalContent"></div>
    <button class="app-modal-btn" onclick="closeAppModal()">OK</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/invest-detail.js"></script>
</body>
</html>
