<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02070c">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Đấu Trường</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  color:#fff;
  height:100vh;
  overflow:hidden;

  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;   /* ⭐ ĐỔI LẠI COVER */
  transition:background .5s ease;
}



@media (max-width:768px){
  body{
    background-size:auto 100vh;
    background-position:center center;
  }
}

@media (min-width:769px){
  body{
    background-size:cover;
    background-position:center;
  }
}





.title{
  text-align:center;
  font-size:22px;
  font-weight:800;
  padding:15px 0;
  color:#00f0ff;
  text-shadow:0 0 15px #00f0ff;
}

.arena{
  height:38vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
  
  
}

.character{
  width:45%;
  text-align:center;
}

.avatar{
  width:160px;
  height:200px;
  margin:0 auto;
  background-size:cover;
  background-position:center;
  border-radius:20px;
  box-shadow:0 0 30px rgba(0,255,255,.3);
}

.enemy .avatar{
  box-shadow:0 0 30px rgba(255,0,60,.4);
}

/* ===== PRO HP BAR ===== */

.hp-wrapper{
  width:90%;
  margin:15px auto 0;
}

.hp-bar.pro{
  position:relative;
  height:22px;
  border-radius:14px;
  background:linear-gradient(180deg,#050b12,#0c1c26);
  overflow:hidden;
  border:1px solid rgba(0,255,255,.4);
  box-shadow:0 0 15px rgba(0,255,255,.3);
}

.hp-bar.pro.enemy-bar{
  border:1px solid rgba(255,0,60,.4);
  box-shadow:0 0 15px rgba(255,0,60,.3);
}

.hp-fill{
  position:absolute;
  inset:0;
  width:100%;
  transition:width .4s ease;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
}

.enemy-bar .hp-fill{
  background:linear-gradient(90deg,#ff0044,#ff9900);
}

/* LIGHT SWEEP EFFECT */
.hp-glow{
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,.25) 40%,
    transparent 80%
  );
  animation:hpSweep 2.5s linear infinite;
  pointer-events:none;
}

@keyframes hpSweep{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* TEXT INSIDE BAR */
.hp-text.inside{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  color:#fff;
  text-shadow:0 0 6px #000;
  pointer-events:none;
}




.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-weight:800;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff0044,#ff9900);
  color:#fff;
}

.back{
  background:#111;
}

.log{
   position:fixed;
  top:450px;   /* nằm trên skill */
  left:20px;
  right:20px;
  margin:15px 20px;
  background:#0b1118;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  height:100px;
  overflow-y:auto;
}


/* HIT SHAKE */
.hit{
  animation:shake .25s;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

/* DAMAGE FLOAT */
.damage{
  position:absolute;
  font-weight:900;
  font-size:22px;
  pointer-events:none;
  animation:floatUp 1s forwards;
  z-index:10;
}


@keyframes floatUp{
  0%{opacity:1; transform:translate(-50%,0);}
  100%{opacity:0; transform:translate(-50%,-60px);}
}

/* CRIT EFFECT */
.crit{
  color:#ff0033;
  font-size:28px;
  text-shadow:0 0 15px red;
}

/* FLASH HIT */
.flash{
  animation:flashHit .2s;
}

@keyframes flashHit{
  0%{filter:brightness(1)}
  50%{filter:brightness(2)}
  100%{filter:brightness(1)}
}


/* SLASH EFFECT */
.slash{
  position:absolute;
  top:50%;
  left:50%;
  width:120px;
  height:8px;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  transform:translate(-50%,-50%) rotate(25deg);
  animation:slashMove .3s forwards;
  opacity:0;
}

@keyframes slashMove{
  0%{opacity:1; transform:translate(-50%,-50%) rotate(25deg) scale(0.5);}
  100%{opacity:0; transform:translate(-50%,-50%) rotate(25deg) scale(1.8);}
}

/* SCREEN SHAKE */
.screenShake{
  animation:screenShake .3s;
}

@keyframes screenShake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

/* LOW HP GLOW */
.lowHp{
  box-shadow:0 0 25px red !important;
  animation:lowPulse 1s infinite;
}

@keyframes lowPulse{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.5)}
  100%{filter:brightness(1)}
}


/* ===== ASH EXPLOSION ===== */
.ash{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(255,255,255,.8);
  border-radius:50%;
  pointer-events:none;
  animation:ashFly 1.2s forwards;
}

@keyframes ashFly{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(var(--x), var(--y)) scale(.3);
  }
}

/* CARD DISINTEGRATE */
.disintegrate{
  animation:burnOut 1.2s forwards;
}

@keyframes burnOut{
  0%{
    filter:grayscale(0%) brightness(1);
    opacity:1;
  }
  40%{
    filter:grayscale(100%) brightness(1.8);
  }
  100%{
    filter:grayscale(100%) brightness(0.2);
    opacity:0;
    transform:scale(.8);
  }
}



/* ===== ACTION PANEL REDESIGN ===== */

.actions{
  position:fixed;
  bottom:0px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:520px;

  padding:16px 20px 20px;
  border-radius:0px;

  background:rgba(10,20,30,0.55);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(0,255,255,.25);

  box-shadow:
    0 20px 40px rgba(0,0,0,.6),
    0 0 25px rgba(0,255,255,.25);

  z-index:100;
  text-align:center;
  overflow:hidden;
}


.actions::before{
  content:"";
  position:absolute;
  top:-60%;
  left:-30%;
  width:160%;
  height:200%;
  background:linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,.08) 40%,
    transparent 70%
  );
  transform:rotate(25deg);
  pointer-events:none;
}


/* MAIN ATTACK */
.btn-main{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff0044,#ff9900);
  box-shadow:0 0 25px rgba(255,0,80,.6);
  transition:.2s;
}

.btn-main:active{
  transform:scale(.97);
}

/* SKILL BAR */
.skill-bar{
  display:flex;
  justify-content:center;   /* ⭐ căn giữa */
  align-items:center;
  gap:50px;                 /* khoảng cách đều */
  margin-top:14px;
}


.skill-btn{
  flex:1;
  height:70px;
  border-radius:18px;
  border:2px solid rgba(0,255,255,.3);
  background:linear-gradient(180deg,#0d1a22,#09131a);
  color:#00f0ff;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.2s;
}

.skill-btn span{
  position:relative;
  z-index:2;
}

.skill-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(45deg,transparent,#00f0ff33,transparent);
  opacity:0;
  transition:.3s;
}

.skill-btn:hover::before{
  opacity:1;
}

.skill-btn:disabled{
  filter:grayscale(100%);
  opacity:.5;
  border-color:#444;
}



/* ===== SKILL CIRCLE ===== */
.skill-circle{
  position:relative;
  width:78px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(0,255,255,.4);

  background:linear-gradient(
    180deg,
    rgba(255,255,255,.08),
    rgba(0,0,0,.3)
  );

  backdrop-filter:blur(8px);

  box-shadow:
    0 10px 20px rgba(0,0,0,.6),
    inset 0 0 15px rgba(0,255,255,.2),
    0 0 20px rgba(0,255,255,.4);

  transition:.25s;
}

.skill-circle:active{
  transform:translateY(4px);
  box-shadow:
    0 6px 12px rgba(0,0,0,.6),
    inset 0 0 20px rgba(0,255,255,.5);
}


.skill-circle img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* COOL DOWN OVERLAY */
.cooldown{
  position:absolute;
  inset:0;
  background:conic-gradient(
    rgba(0,0,0,.7) 0deg,
    rgba(0,0,0,.7) 360deg
  );
  border-radius:50%;
  pointer-events:none;
  display:none;
}

.skill-circle.disabled{
  filter:grayscale(100%);
}

/* TEXT GIỮA VÒNG */
.cd-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px;
  color:#fff;
  text-shadow:0 0 10px #000;
  pointer-events:none;
}

/* SKILL READY PULSE */
.skill-ready{
  animation:skillGlow 1.5s infinite;
}

@keyframes skillGlow{
  0%{
    box-shadow:
      0 10px 20px rgba(0,0,0,.6),
      0 0 15px rgba(0,255,255,.4);
  }
  50%{
    box-shadow:
      0 10px 20px rgba(0,0,0,.6),
      0 0 35px rgba(0,255,255,1);
  }
  100%{
    box-shadow:
      0 10px 20px rgba(0,0,0,.6),
      0 0 15px rgba(0,255,255,.4);
  }
}


@keyframes skillPulse{
  0%{ box-shadow:0 0 15px rgba(0,255,255,.4);}
  50%{ box-shadow:0 0 35px rgba(0,255,255,.9);}
  100%{ box-shadow:0 0 15px rgba(0,255,255,.4);}
}



/* ===== GAME HEADER ===== */

.game-header{
  position:relative;
  padding-top:env(safe-area-inset-top);
  height:calc(65px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#061018,#02070c);
  border-bottom:1px solid rgba(0,255,255,.2);
  box-shadow:0 0 25px rgba(0,255,255,.15);
}

.header-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  color:#00f0ff;
  text-shadow:0 0 15px #00f0ff;
}

.header-back{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:40px;
  height:40px;
  border-radius:12px;
  border:none;
  background:#0d1a22;
  color:#00f0ff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,255,255,.4);
  transition:.2s;
}

.header-back:hover{
  background:#122430;
}

.header-right{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  gap:10px;
}


.header-gold{
  background:#0d1a22;
  padding:6px 10px;
  border-radius:12px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 0 10px rgba(0,255,255,.2);
}



/* ===== SKILL CAST EFFECT ===== */

.skill-cast{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,
    rgba(0,255,255,.2),
    transparent 70%);
  animation:skillFlash .4s ease-out forwards;
  pointer-events:none;
  z-index:999;
}

@keyframes skillFlash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* ENERGY BURST */
.energy-burst{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.6);
  animation:burst 0.5s ease-out forwards;
  pointer-events:none;
}

@keyframes burst{
  0%{
    opacity:1;
    transform:scale(.3);
  }
  100%{
    opacity:0;
    transform:scale(1.6);
  }
}



/* ===== LIGHTNING ===== */
.lightning{
  position:absolute;
  width:6px;
  height:200px;
  background:linear-gradient(#00f0ff,#ffffff,#00f0ff);
  left:50%;
  top:-50px;
  transform:translateX(-50%);
  animation:lightningStrike .3s ease-out forwards;
  box-shadow:0 0 20px #00f0ff;
}

@keyframes lightningStrike{
  0%{opacity:1; height:0;}
  100%{opacity:0; height:220px;}
}

/* ===== SHADOW DASH ===== */
.shadow-dash{
  position:absolute;
  inset:0;
  background:rgba(0,255,150,.15);
  animation:dashMove .3s ease-out forwards;
  pointer-events:none;
}

@keyframes dashMove{
  0%{opacity:0; transform:translateX(-80px);}
  50%{opacity:1;}
  100%{opacity:0; transform:translateX(0);}
}

/* ===== GROUND CRACK ===== */
.ground-crack{
  position:absolute;
  bottom:-10px;
  left:50%;
  width:120px;
  height:40px;
  transform:translateX(-50%);
  background:radial-gradient(circle,#ff9900,transparent);
  animation:crack .4s ease-out forwards;
}

@keyframes crack{
  0%{opacity:1; transform:translateX(-50%) scale(.4);}
  100%{opacity:0; transform:translateX(-50%) scale(1.5);}
}

/* ===== SLOW MOTION ===== */
.slowmo{
  animation:slowmoEffect .6s ease-out forwards;
}

@keyframes slowmoEffect{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}


.mode-btn{
  background:#0d1a22;
  color:#00f0ff;
  border:none;
  padding:6px 10px;
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.mode-btn:hover{
  background:#122430;
}

.gold-btn{
  color:gold;
  box-shadow:0 0 10px gold;
}



/* ===== MODE SCROLL BAR ===== */

.mode-wrapper{
  width:100%;
  background:#050b12;
  border-bottom:1px solid rgba(0,255,255,.15);
  overflow:hidden;
}

.mode-scroll{
  display:flex;
  gap:12px;
  padding:10px 15px;
  overflow-x:auto;
  scroll-behavior:smooth;
}

.mode-scroll::-webkit-scrollbar{
  display:none;
}

.mode-card{
  flex:0 0 auto;
  min-width:120px;
  padding:10px 14px;
  border-radius:14px;
  border:1px solid rgba(0,255,255,.25);
  background:linear-gradient(180deg,#0d1a22,#09131a);
  color:#00f0ff;
  font-weight:800;
  cursor:pointer;
  transition:.25s;
  white-space:nowrap;
}

.mode-card:hover{
  transform:translateY(-2px);
  box-shadow:0 0 15px rgba(0,255,255,.4);
}

.mode-card.active{
  border:1px solid #00f0ff;
  box-shadow:0 0 20px #00f0ff;
}

.mode-card.gold{
  color:gold;
  border:1px solid rgba(255,215,0,.5);
}

.mode-card.gold.active{
  box-shadow:0 0 25px gold;
}



/* ===== LOCK OVERLAY ===== */

.mode-card{
  position:relative;
}

.lock-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  background:rgba(0,0,0,.6);
  border-radius:14px;
}

.mode-card.locked{
  filter:grayscale(100%);
  opacity:.6;
  cursor:not-allowed;
}

/* ===== UNLOCK EFFECT ===== */

.unlock-flash{
  animation:unlockFlash .8s ease-out;
}

@keyframes unlockFlash{
  0%{box-shadow:0 0 0px gold;}
  50%{box-shadow:0 0 40px gold;}
  100%{box-shadow:0 0 0px gold;}
}



/* ===== GOLD UNLOCK POPUP ===== */

.gold-popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:fadeIn .4s ease;
}

.gold-popup.hidden{
  display:none;
}

.gold-popup-content{
  width:85%;
  max-width:380px;
  padding:25px 20px;
  border-radius:20px;
  text-align:center;
  background:linear-gradient(180deg,#2b1a00,#000);
  border:2px solid gold;
  box-shadow:0 0 40px gold;
  animation:popScale .4s ease;
}

.gold-icon{
  font-size:50px;
  margin-bottom:10px;
  animation:goldSpin 3s linear infinite;
}

.gold-title{
  font-size:20px;
  font-weight:900;
  color:gold;
  text-shadow:0 0 15px gold;
  margin-bottom:10px;
}

.gold-desc{
  font-size:14px;
  opacity:.85;
  margin-bottom:20px;
}

.gold-btn-popup{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:900;
  font-size:15px;
  background:linear-gradient(90deg,gold,#ff9900);
  color:#000;
  cursor:pointer;
}

@keyframes popScale{
  0%{transform:scale(.6); opacity:0;}
  100%{transform:scale(1); opacity:1;}
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

@keyframes goldSpin{
  0%{transform:rotate(0);}
  100%{transform:rotate(360deg);}
}



.loot-btn{
  position:absolute;
  right:8px;
  top:6px;
  font-size:14px;
  cursor:pointer;
  opacity:.8;
}

.loot-btn:hover{
  opacity:1;
}


/* ===== CAST CHARGE ===== */
.skill-charge{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid #00f0ff;
  animation:chargeSpin .4s linear forwards;
  pointer-events:none;
}

@keyframes chargeSpin{
  0%{transform:scale(.5) rotate(0deg); opacity:1;}
  100%{transform:scale(1.4) rotate(360deg); opacity:0;}
}



.impactZoom{
  animation:impactZoom .3s ease-out;
}

@keyframes impactZoom{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}




.explosion-ring{
  position:absolute;
  width:140px;
  height:140px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.6);
  animation:explodeRing .5s ease-out forwards;
  pointer-events:none;
}

@keyframes explodeRing{
  0%{transform:scale(.4); opacity:1;}
  100%{transform:scale(1.8); opacity:0;}
}



/* ===== CAST BAR ===== */
.cast-bar-wrapper{
  position:absolute;
  bottom:-12px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:8px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 0 10px rgba(0,255,255,.3);
}

.cast-bar-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  transition:width .4s linear;
}


.bg-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  pointer-events:none;
  z-index:-1;
}


@media (max-width:768px){
  body{
    background-position:center center !important;
    background-size:cover !important;
  }
}



</style>
</head>

<body>

  <div class="bg-overlay"></div>


<div class="game-header">

  <button class="header-back" onclick="backToHub()">
    ←
  </button>

<div class="header-title">
  ARENA<span id="stageText"></span>
</div>


<div class="header-right">

  <div class="header-gold">
    💎 <span id="headerGold">0</span>
  </div>

</div>
</div>


<div class="mode-wrapper">
  <div class="mode-scroll">

<button onclick="setMode('rank')" 
        class="mode-card" 
        data-mode="rank">

  🏆 Rank

  <span class="loot-btn"
        onclick="event.stopPropagation(); openLootPreview('rank')">
    👁
  </span>

</button>


<button onclick="setMode('farm')" 
        class="mode-card" 
        data-mode="farm">

  🌾 Farm

  <span class="loot-btn"
        onclick="event.stopPropagation(); openLootPreview('farm')">
    👁
  </span>

</button>


<button onclick="setMode('gold')" 
        class="mode-card gold" 
        data-mode="gold"
        id="goldBtn">

  👑 Hoàng Kim

  <span class="loot-btn" onclick="event.stopPropagation(); openLootPreview('gold')">
    👁
  </span>

  <span class="lock-overlay" id="goldLock">🔒</span>
</button>



  </div>
</div>



<div class="arena">

<script>

let stage = parseInt(localStorage.getItem("arena_stage")) || 1;
let gameMode = localStorage.getItem("arena_mode") || "rank";
let player = JSON.parse(localStorage.getItem("hunter_char"));
let enemy = null;
let isAttacking = false;
let isCasting = false;  

let skillCooldown = {
  1:0,
  2:0,
  3:0
};
let status = {
  enemyBurn:0,
  enemyPoison:0,
  enemyAtkDown:0,
  playerShield:0,
  playerReflect:0,
  playerInvisible:false,
  playerCritBoost:0,
  enemyStun:false
};


/* ===== SKILL ICON MAP ===== */
const SKILL_ICONS = {
  warrior:{
    1:"/assets/skills/warrior_skill1.png",
    2:"/assets/skills/warrior_skill2.png",
    3:"/assets/skills/warrior_skill3.png"
  },
  assassin:{
    1:"/assets/skills/assassin_skill1.png",
    2:"/assets/skills/assassin_skill2.png",
    3:"/assets/skills/assassin_skill3.png"
  },
  mage:{
    1:"/assets/skills/mage_skill1.png",
    2:"/assets/skills/mage_skill2.png",
    3:"/assets/skills/mage_skill3.png"
  }
};



if(!player){
  location.href="game-diamond-hunter.html";
}

/* ===== SAVE ===== */
function savePlayer(){
  if(!player) return;
  player.lastOnline = Date.now();
  localStorage.setItem("hunter_char",
    JSON.stringify(player));
}

/* ===== SPAWN ENEMY ===== */
function spawnEnemy(){

  if(gameMode === "gold"){

  const scale = stage * 1.8;

  enemy = {
    maxHp: 1200 + scale * 200,
    hp:    1200 + scale * 200,
    atk:   200 + scale * 40,
    def:   100 + scale * 25,
    isBoss:true,
    isGolden:true
  };
}


  if(gameMode === "rank"){

    const isBoss = stage % 5 === 0;

    const baseHp = 400 + stage * 120;
    const baseAtk = 60 + stage * 15;
    const baseDef = 30 + stage * 8;

    enemy = {
      maxHp: isBoss ? baseHp * 2 : baseHp,
      hp:    isBoss ? baseHp * 2 : baseHp,
      atk:   isBoss ? baseAtk * 1.5 : baseAtk,
      def:   baseDef,
      isBoss: isBoss
    };

  }else{

    // 🌾 FARM MODE
    const scale = player.level * 1.2;

    enemy = {
      maxHp: 300 + scale * 80,
      hp:    300 + scale * 80,
      atk:   40 + scale * 12,
      def:   20 + scale * 6,
      isBoss:false
    };

  }
}



/* ===== LEVEL UP ===== */
function checkLevelUp(){
  if(player.exp >= player.level*200){
    player.level++;
    player.exp = 0;
    player.hp = player.maxHp;
  }
}

/* ===== RENDER ===== */
function render(){

  /* ================= AVATAR ================= */

  const avatarMap = {
    warrior:"/assets/classes/warrior.jpg",
    assassin:"/assets/classes/assassin.jpg",
    mage:"/assets/classes/mage.jpg"
  };

  document.getElementById("playerAvatar").style.backgroundImage =
    `url(${avatarMap[player.classType]})`;

  // 👑 Enemy avatar theo mode
  let enemyImg = "/assets/classes/enemy.jpg";

  if(gameMode === "gold"){
    enemyImg = "/assets/classes/boss_gold.jpg";
  }
  else if(enemy.isBoss){
    enemyImg = "/assets/classes/boss.jpg";
  }

  document.getElementById("enemyAvatar").style.backgroundImage =
    `url(${enemyImg})`;


  /* ================= BACKGROUND ================= */

const bgMap = {
  rank: "/assets/maps/arena_rank.jpg",
  farm: "/assets/maps/arena_farm.jpg",
  gold: "/assets/maps/arena_gold.jpg"
};

document.body.style.backgroundImage =
  `url(${bgMap[gameMode]})`;



  /* ================= PLAYER HP ================= */

  const playerPercent =
    (player.hp / player.maxHp) * 100;

  document.getElementById("playerHpFill")
    .style.width = playerPercent + "%";

  const playerBar =
    document.querySelector(".hp-bar.pro");

  if(player.hp / player.maxHp < 0.25){
    playerBar.style.boxShadow = "0 0 25px red";
    playerBar.style.borderColor = "red";
  }else{
    playerBar.style.boxShadow =
      gameMode === "gold"
        ? "0 0 25px gold"
        : "0 0 15px rgba(0,255,255,.3)";

    playerBar.style.borderColor =
      gameMode === "gold"
        ? "gold"
        : "rgba(0,255,255,.4)";
  }

  document.getElementById("playerHpText").innerText =
    player.name + " | " +
    Math.floor(player.hp) + "/" + player.maxHp;


  /* ================= ENEMY HP ================= */

  const enemyPercent =
    (enemy.hp / enemy.maxHp) * 100;

  document.getElementById("enemyHpFill")
    .style.width = enemyPercent + "%";

  const enemyBar =
    document.querySelector(".enemy-bar");

  if(enemy.hp / enemy.maxHp < 0.25){
    enemyBar.style.boxShadow = "0 0 25px red";
    enemyBar.style.borderColor = "red";
  }else{
    enemyBar.style.boxShadow =
      gameMode === "gold"
        ? "0 0 25px gold"
        : "0 0 15px rgba(255,0,60,.3)";

    enemyBar.style.borderColor =
      gameMode === "gold"
        ? "gold"
        : "rgba(255,0,60,.4)";
  }

  document.getElementById("enemyHpText").innerText =
    (gameMode === "gold" ? "Boss | " : "Enemy | ") +
    Math.floor(enemy.hp) + "/" + enemy.maxHp;


  /* ================= LOW HP EFFECT ================= */

  const playerAvatar =
    document.querySelector(".character:not(.enemy) .avatar");

  if(player.hp / player.maxHp < 0.2){
    playerAvatar.classList.add("lowHp");
  }else{
    playerAvatar.classList.remove("lowHp");
  }


  /* ================= SKILL ICON ================= */

  const skillMap = SKILL_ICONS[player.classType];

  for(let i=1;i<=3;i++){
    const btn = document.getElementById("skill"+i+"Btn");
    if(!btn) continue;

    const img = btn.querySelector("img");
    if(img && skillMap[i]){
      img.src = skillMap[i];
    }
  }


  /* ================= STAGE TEXT ================= */

  document.getElementById("stageText").innerText =
    gameMode === "gold"
      ? ""
      : " " + stage;


  /* ================= GOLD HEADER ================= */

  document.getElementById("headerGold").innerText =
    player.gold;
}



function showDamage(targetClass, dmg, isCrit=false){

  const target =
    document.querySelector(targetClass + " .avatar");

  const dmgEl = document.createElement("div");
  dmgEl.className="damage";


  if(dmg > 0){
  dmgEl.innerText = "-" + dmg;
}else{
  dmgEl.innerText = "+" + Math.abs(dmg);
  dmgEl.style.color = "#00ff99";
}


  if(isCrit){
    dmgEl.classList.add("crit");
  }

  /* Vị trí cố định theo bên */
  dmgEl.style.top = "20px";
  dmgEl.style.left = "50%";
  dmgEl.style.transform = "translateX(-50%)";

  target.style.position = "relative"; // đảm bảo có positioning
  target.appendChild(dmgEl);

  setTimeout(()=>dmgEl.remove(),1000);
}



function showSlash(targetClass){

  const target =
    document.querySelector(targetClass + " .avatar");

  const slash = document.createElement("div");
  slash.className="slash";

  target.style.position="relative";
  target.appendChild(slash);

  setTimeout(()=>slash.remove(),300);
}




function showSkillEffect(targetClass, type){

  // Flash toàn màn
  const flash = document.createElement("div");
  flash.className = "skill-cast";
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(),400);

  // Burst tại target
  const target =
    document.querySelector(targetClass + " .avatar");

  const burst = document.createElement("div");
  burst.className="energy-burst";

  // đổi màu theo hệ
  if(type==="warrior") burst.style.borderColor="#ff9900";
  if(type==="assassin") burst.style.borderColor="#00ff99";
  if(type==="mage") burst.style.borderColor="#00f0ff";

  burst.style.top="50%";
  burst.style.left="50%";
  burst.style.transform="translate(-50%,-50%)";

  target.style.position="relative";
  target.appendChild(burst);

  setTimeout(()=>burst.remove(),500);

  // rung mạnh hơn
  document.querySelector(".arena")
    .classList.add("screenShake");

  setTimeout(()=>{
    document.querySelector(".arena")
      .classList.remove("screenShake");
  },300);


  document.querySelector(".arena")
  .classList.add("impactZoom");

setTimeout(()=>{
  document.querySelector(".arena")
    .classList.remove("impactZoom");
},300);

}



function playClassSkillAnimation(type){

  const enemyAvatar =
    document.querySelector(".character.enemy .avatar");

  const arena = document.querySelector(".arena");

  const ring = document.createElement("div");
ring.className="explosion-ring";
enemyAvatar.appendChild(ring);
setTimeout(()=>ring.remove(),500);


  /* ===== MAGE ===== */
  if(type==="mage"){
    const lightning = document.createElement("div");
    lightning.className="lightning";
    enemyAvatar.appendChild(lightning);
    setTimeout(()=>lightning.remove(),300);
  }

  /* ===== ASSASSIN ===== */
  if(type==="assassin"){
    const dash = document.createElement("div");
    dash.className="shadow-dash";
    enemyAvatar.appendChild(dash);
    setTimeout(()=>dash.remove(),300);
  }

  /* ===== WARRIOR ===== */
  if(type==="warrior"){
    const crack = document.createElement("div");
    crack.className="ground-crack";
    enemyAvatar.appendChild(crack);
    setTimeout(()=>crack.remove(),400);
  }

  /* ===== SLOW MOTION ===== */
  arena.classList.add("slowmo");
  setTimeout(()=>arena.classList.remove("slowmo"),600);
}


function playDeath(targetClass){

  const card = document.querySelector(targetClass);
  const avatar = card.querySelector(".avatar");

  avatar.style.position = "relative";

  // tạo 30 hạt bụi
  for(let i=0;i<30;i++){

    const ash = document.createElement("div");
    ash.className = "ash";

    const x = (Math.random()*200 - 100) + "px";
    const y = (Math.random()*200 - 100) + "px";

    ash.style.setProperty("--x", x);
    ash.style.setProperty("--y", y);

    ash.style.left = "50%";
    ash.style.top = "50%";

    avatar.appendChild(ash);

    setTimeout(()=>ash.remove(),1200);
  }

  // làm card cháy tan
  card.classList.add("disintegrate");
}




/* ===== ATTACK ===== */
function attack(){

  if(isAttacking) return;
  isAttacking = true;

  let logText = "";

  /* ===== PLAYER ATTACK ===== */

  if(Math.random()*100 < 5){
    logText += "👹 Quái né đòn!\n";
  }else{

    let dmg = player.atk - enemy.def*0.5;
    dmg = Math.max(0, dmg);

    let isCrit = false;

    if(Math.random()*100 < player.critRate){
      dmg *= player.critDamage;
      isCrit = true;
      logText += "💥 CHÍ MẠNG!\n";
    }

    dmg = Math.floor(dmg);
    enemy.hp -= dmg;


// ===== LIFE STEAL =====
if(player.lifesteal > 0){

  const heal = Math.floor(
    dmg * (player.lifesteal / 100)
  );

  player.hp += heal;

  if(player.hp > player.maxHp)
    player.hp = player.maxHp;

  showDamage(".character:not(.enemy)", -heal);

}




    logText += "Bạn gây "+dmg+" sát thương.\n";

    /* EFFECT */
    showDamage(".character.enemy", dmg, isCrit);
    showSlash(".character.enemy");

    if(isCrit){
      document.querySelector(".arena")
        .classList.add("screenShake");

      setTimeout(()=>{
        document.querySelector(".arena")
          .classList.remove("screenShake");
      },300);
    }

    const enemyAvatar =
      document.querySelector(".enemy .avatar");

    enemyAvatar.classList.add("hit","flash");

    setTimeout(()=>{
      enemyAvatar.classList.remove("hit","flash");
    },200);
  }

  
/* ===== KIỂM TRA QUÁI CHẾT ===== */
if(enemy.hp <= 0){

  enemy.hp = 0;

  playDeath(".character.enemy");

  document.body.style.transition="0.3s";
  document.body.style.filter="blur(2px)";

  setTimeout(()=>{
    document.body.style.filter="none";
  },300);

  // ⭐ CHUYỂN TOÀN BỘ THƯỞNG VỀ HÀM CHUNG
  rewardEnemyKill();

  reduceCooldown();
  updateCooldownUI();

  setTimeout(()=>{

    if(gameMode === "rank"){
      stage++;
      localStorage.setItem("arena_stage", stage);
    }

    resetAllSkills();
    spawnEnemy();

    document
      .querySelector(".character.enemy")
      .classList.remove("disintegrate");

    render();
    document.getElementById("battleLog").innerText = "";
    isAttacking = false;

  },1500);

  return;
}


  /* ===== UPDATE UI SAU PLAYER ===== */
  document.getElementById("battleLog").innerText = logText;
  savePlayer();
  render();

  reduceCooldown();

  /* ===== DELAY TRƯỚC KHI QUÁI PHẢN CÔNG ===== */
  setTimeout(()=>{
    enemyTurn();
  },600);
}

function useSkill(skillId){

  if(isAttacking) return;
  if(isCasting) return;
  if(skillCooldown[skillId] > 0) return;

  isAttacking = true;

  let dmg = 0;
  let logText = "";
  const cls = player.classType;

  /* ===== SET SKILL ===== */

  if(cls==="warrior"){
    if(skillId===1){
      dmg = enemy.hp < enemy.maxHp*0.3
        ? player.atk * 2.5
        : player.atk * 1.2;
      skillCooldown[1]=3;
      logText="⚔ Bổ Đao Kết Liễu!";
    }

    if(skillId===2){
      status.playerShield = 0.5;
      status.playerReflect = 0.4;
      skillCooldown[2]=4;
      logText="🛡 Khiên Phản Đòn!";
    }

    if(skillId===3){
      dmg = player.atk * 2.2;
      skillCooldown[3]=5;
      logText="⚡ Thiên Lôi!";
    }
  }

  if(cls==="assassin"){
    if(skillId===1){
      dmg = player.atk * 1.8;
      skillCooldown[1]=3;
      logText="🗡 Đâm Xuyên Tim!";
    }

    if(skillId===2){
      status.playerInvisible = true;
      skillCooldown[2]=4;
      logText="🌫 Tàng Hình!";
    }

    if(skillId===3){
      status.enemyPoison = 3;
      skillCooldown[3]=5;
      logText="☠ Độc Huyết!";
    }
  }

  if(cls==="mage"){
    if(skillId===1){
      dmg = player.atk * 1.5;
      status.enemyBurn = 2;
      skillCooldown[1]=3;
      logText="🔥 Hỏa Vũ!";
    }

    if(skillId===2){
      dmg = player.atk;
      status.enemyStun = true;
      skillCooldown[2]=4;
      logText="❄ Đóng Băng!";
    }

    if(skillId===3){
      dmg = player.atk * 2.2;
      skillCooldown[3]=5;
      logText="⚡ Thiên Lôi!";
    }
  }

  /* ===================================================== */
  /* ================= SKILL CÓ DAMAGE =================== */
  /* ===================================================== */

  if(dmg > 0){

    playChargeEffect();

    startCast(400).then(()=>{

      dmg = Math.floor(dmg);
      enemy.hp -= dmg;

      // lifesteal
      if(player.lifesteal > 0){
        const heal = Math.floor(dmg * (player.lifesteal/100));
        player.hp = Math.min(player.hp + heal, player.maxHp);
        showDamage(".character:not(.enemy)", -heal);
      }

      // chết do skill
      if(enemy.hp <= 0){

        enemy.hp = 0;
        playDeath(".character.enemy");

        rewardEnemyKill();

        reduceCooldown();          // ⭐ FIX CHÍNH
        updateCooldownUI();        // ⭐ FIX CHÍNH

        render();

        setTimeout(()=>{
          if(gameMode==="rank"){
            stage++;
            localStorage.setItem("arena_stage", stage);
          }

          resetAllSkills();
          spawnEnemy();
          document.querySelector(".character.enemy")
            .classList.remove("disintegrate");
          render();
          document.getElementById("battleLog").innerText="";
          isAttacking = false;
        },1500);

        return;
      }

      // chưa chết
      showDamage(".character.enemy", dmg, true);
      showSlash(".character.enemy");
      showSkillEffect(".character.enemy", player.classType);
      playClassSkillAnimation(player.classType);

      document.getElementById("battleLog").innerText = logText;
      render();

      reduceCooldown();     // ⭐ luôn giảm sau lượt player
      updateCooldownUI();

      setTimeout(()=>enemyTurn(),600);
    });

    return;
  }

  /* ===================================================== */
  /* ================= SKILL KHÔNG DAMAGE ================ */
  /* ===================================================== */

  document.getElementById("battleLog").innerText = logText;

  render();

  reduceCooldown();
  updateCooldownUI();

  setTimeout(()=>enemyTurn(),600);
}


function rewardEnemyKill(){

  player.exp += 100;

  let diamondDrop;

  if(gameMode === "rank"){
    diamondDrop = Math.floor(
      15 + stage * 3 + Math.random()*20
    );
  }else{
    diamondDrop = Math.floor(
      25 + player.level * 5 + Math.random()*40
    );
  }

  player.gold += diamondDrop;

 let dropRate = 0;

if(gameMode === "farm") dropRate = 0.25;
if(gameMode === "rank") dropRate = 0.15;
if(gameMode === "gold") dropRate = 0.01; 

if(Math.random() < dropRate){
  dropRandomItem();
}




  checkLevelUp();
  savePlayer();

  document.getElementById("battleLog").innerText +=
    "🎉 Hạ quái!\n" +
    "+100 EXP\n" +
    `💎 Nhận ${diamondDrop} kim cương\n`;

  render();
}





function enemyTurn(){

  let logText = "";

if(enemy.isBoss && Math.random() < 0.3){

  let rage = Math.floor(enemy.atk * 1.5);
  player.hp -= rage;

  showDamage(".character:not(.enemy)", rage, true);
  showSlash(".character:not(.enemy)");

  document.getElementById("battleLog").innerText += 
    "🔥 BOSS Cuồng Nộ gây " + rage + " sát thương!\n";

  render();

  // kiểm tra player chết
  if(player.hp <= 0){
    player.hp = 0;
    playDeath(".character:not(.enemy)");
    savePlayer();
    render();
    setTimeout(()=>{
      location.href="game-diamond-hunter.html";
    },1500);
    return;
  }

  reduceCooldown();
  isAttacking = false;   // 🔥 QUAN TRỌNG
  return;
}




  /* ===== ENEMY BỊ STUN ===== */
  if(status.enemyStun){
    status.enemyStun = false;
    logText += "❄ Quái bị đóng băng và mất lượt!\n";

    document.getElementById("battleLog").innerText += logText;
    isAttacking = false;
    return;
  }

  /* ===== PLAYER TÀNG HÌNH ===== */
  if(status.playerInvisible){
    status.playerInvisible = false;
    logText += "🌫 Bạn né nhờ tàng hình!\n";

    document.getElementById("battleLog").innerText += logText;
    isAttacking = false;
    return;
  }

  /* ===== ENEMY ATTACK ===== */
  if(Math.random()*100 < player.dodge){
    logText += "💨 Bạn né được đòn!\n";
  }else{

    let effectiveAtk = enemy.atk;

    if(status.enemyAtkDown > 0){
      effectiveAtk *= 0.7;
    }

    let dmg = effectiveAtk - player.def*0.4;
    dmg = Math.max(0,dmg);
    dmg = Math.floor(dmg);

    /* SHIELD */
    if(status.playerShield){
      dmg *= (1 - status.playerShield);
      status.playerShield = 0; // dùng 1 lần
    }

    dmg = Math.floor(dmg);

    player.hp -= dmg;

    /* REFLECT */
    if(status.playerReflect){
      let reflectDmg = Math.floor(dmg * status.playerReflect);
      enemy.hp -= reflectDmg;
      logText += "🛡 Phản lại "+reflectDmg+" sát thương!\n";
      status.playerReflect = 0;
    }

    showDamage(".character:not(.enemy)", dmg);
    showSlash(".character:not(.enemy)");

    const playerAvatar =
      document.querySelector(".character:not(.enemy) .avatar");

    playerAvatar.classList.add("hit","flash");

    setTimeout(()=>{
      playerAvatar.classList.remove("hit","flash");
    },200);

    logText += "Quái gây "+dmg+" sát thương.\n";
  }

  /* ===== DOT EFFECT ===== */
  if(status.enemyPoison > 0){
    let dot = Math.floor(player.atk*0.5);
    enemy.hp -= dot;
    status.enemyPoison--;
    logText += "☠ Quái bị độc -"+dot+"\n";
  }

  if(status.enemyBurn > 0){
    let burn = Math.floor(player.atk*0.3);
    enemy.hp -= burn;
    status.enemyBurn--;
    logText += "🔥 Quái bị thiêu đốt -"+burn+"\n";
  }

  document.getElementById("battleLog").innerText += logText;

  /* ===== KIỂM TRA QUÁI CHẾT DO REFLECT / DOT ===== */
if(enemy.hp <= 0){

  enemy.hp = 0;

  playDeath(".character.enemy");

  rewardEnemyKill();   // ⭐ thêm dòng này

  setTimeout(()=>{

    if(gameMode === "rank"){
      stage++;
      localStorage.setItem("arena_stage", stage);
    }
    resetAllSkills();

    spawnEnemy();

    document
      .querySelector(".character.enemy")
      .classList.remove("disintegrate");

    render();
    document.getElementById("battleLog").innerText = "";
    isAttacking = false;

  },1500);

  return;
}


  /* ===== PLAYER CHẾT ===== */
  if(player.hp <= 0){

    player.hp = 0;

    playDeath(".character:not(.enemy)");

    player.deadUntil =
      Date.now() + (24 * 60 * 60 * 1000);

    savePlayer();
    render();

    document.getElementById("battleLog").innerText +=
      "💀 Bạn đã bị hạ!";

    setTimeout(()=>{
      location.href="game-diamond-hunter.html";
    },1500);

    return;
  }

  savePlayer();
  render();

  /* ===== GIẢM COOLDOWN ===== */
reduceCooldown();

  isAttacking = false;
}




function updateCooldownUI(){

  const maxCD = {1:3,2:4,3:5};

  [1,2,3].forEach(i=>{

    const btn = document.getElementById("skill"+i+"Btn");
    const cd = document.getElementById("cd"+i);
    const text = document.getElementById("cdText"+i);

    if(skillCooldown[i] > 0){

      const percent = skillCooldown[i] / maxCD[i];
      const deg = percent * 360;

      cd.style.display = "block";
      text.innerText = skillCooldown[i];

      cd.style.background =
        `conic-gradient(
          rgba(0,0,0,.75) 0deg,
          rgba(0,0,0,.75) ${deg}deg,
          transparent ${deg}deg,
          transparent 360deg
        )`;

      btn.classList.remove("skill-ready");
      btn.classList.add("disabled");

    }else{

      cd.style.display = "none";
      text.innerText = "";

      btn.classList.remove("disabled");
      btn.classList.add("skill-ready");
    }

  });
}


function reduceCooldown(){

  Object.keys(skillCooldown).forEach(k=>{
    if(skillCooldown[k] > 0){
      skillCooldown[k]--;
    }
  });

  updateCooldownUI();
}

function playChargeEffect(){

function startCast(duration = 400){

  return new Promise(resolve=>{

    const avatar =
      document.querySelector(".character:not(.enemy) .avatar");

    isCasting = true;

    // disable skill buttons
    for(let i=1;i<=3;i++){
      document
        .getElementById("skill"+i+"Btn")
        .classList.add("disabled");
    }

    // tạo cast bar
    const wrapper = document.createElement("div");
    wrapper.className = "cast-bar-wrapper";

    const fill = document.createElement("div");
    fill.className = "cast-bar-fill";

    wrapper.appendChild(fill);

    avatar.style.position="relative";
    avatar.appendChild(wrapper);

    // trigger animation
    setTimeout(()=>{
      fill.style.width = "100%";
    },10);

    setTimeout(()=>{
      wrapper.remove();
      isCasting = false;
      resolve();
    }, duration);

  });
}


function resetAllSkills(){

  Object.keys(skillCooldown).forEach(k=>{
    skillCooldown[k] = 0;
  });

  updateCooldownUI();
}
