<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đấu Trường</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle at center,#08121a,#000);
  font-family:system-ui;
  color:#fff;
}

.title{
  text-align:center;
  font-size:22px;
  font-weight:800;
  padding:15px 0;
  color:#00f0ff;
  text-shadow:0 0 15px #00f0ff;
}

.arena{
  height:60vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
}

.character{
  width:45%;
  text-align:center;
}

.avatar{
  width:160px;
  height:200px;
  margin:0 auto;
  background-size:cover;
  background-position:center;
  border-radius:20px;
  box-shadow:0 0 30px rgba(0,255,255,.3);
}

.enemy .avatar{
  box-shadow:0 0 30px rgba(255,0,60,.4);
}

.hp-wrapper{
  width:80%;
  margin:10px auto 0;
}

.hp-bar{
  height:12px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
}

.hp-fill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  transition:.3s;
}

.enemy .hp-fill{
  background:linear-gradient(90deg,#ff0044,#ff9900);
}

.hp-text{
  font-size:12px;
  margin-top:4px;
}

.actions{
  padding:0 20px 20px;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-weight:800;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff0044,#ff9900);
  color:#fff;
}

.back{
  background:#111;
}

.log{
  margin:15px 20px;
  background:#0b1118;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  height:90px;
  overflow-y:auto;
}


/* HIT SHAKE */
.hit{
  animation:shake .25s;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

/* DAMAGE FLOAT */
.damage{
  position:absolute;
  font-weight:900;
  font-size:22px;
  pointer-events:none;
  animation:floatUp 1s forwards;
  z-index:10;
}


@keyframes floatUp{
  0%{opacity:1; transform:translate(-50%,0);}
  100%{opacity:0; transform:translate(-50%,-60px);}
}

/* CRIT EFFECT */
.crit{
  color:#ff0033;
  font-size:28px;
  text-shadow:0 0 15px red;
}

/* FLASH HIT */
.flash{
  animation:flashHit .2s;
}

@keyframes flashHit{
  0%{filter:brightness(1)}
  50%{filter:brightness(2)}
  100%{filter:brightness(1)}
}



</style>
</head>

<body>

<div class="title">⚔ ĐẤU TRƯỜNG</div>

<div class="arena">

  <div class="character">
    <div class="avatar" id="playerAvatar"></div>

    <div class="hp-wrapper">
      <div class="hp-bar">
        <div class="hp-fill" id="playerHpFill"></div>
      </div>
      <div class="hp-text" id="playerHpText"></div>
    </div>
  </div>

  <div class="character enemy">
    <div class="avatar" id="enemyAvatar"></div>

    <div class="hp-wrapper">
      <div class="hp-bar">
        <div class="hp-fill" id="enemyHpFill"></div>
      </div>
      <div class="hp-text" id="enemyHpText"></div>
    </div>
  </div>

</div>

<div class="log" id="battleLog"></div>

<div class="actions">
  <button class="btn" onclick="attack()">⚔ TẤN CÔNG</button>
  <button class="btn back" onclick="backToHub()">⬅ Quay lại</button>
</div>

<script>

let player = JSON.parse(localStorage.getItem("hunter_char"));
let enemy = null;
let isAttacking = false;

if(!player){
  location.href="game-diamond-hunter.html";
}

/* ===== SAVE ===== */
function savePlayer(){
  if(!player) return;
  player.lastOnline = Date.now();
  localStorage.setItem("hunter_char",
    JSON.stringify(player));
}

/* ===== RECALC STATS (phòng khi có trang bị) ===== */
function recalcStats(){

  const CLASS_CONFIG = {
    warrior:{ base:{maxHp:800,atk:120,def:90}, dodge:5, critRate:10 },
    assassin:{ base:{maxHp:500,atk:200,def:40}, dodge:15, critRate:25 },
    mage:{ base:{maxHp:550,atk:170,def:60}, dodge:8, critRate:18 }
  };

  const config = CLASS_CONFIG[player.classType];

  player.maxHp = config.base.maxHp + player.level*50;
  player.atk   = config.base.atk   + player.level*10;
  player.def   = config.base.def   + player.level*8;
  player.dodge = config.dodge;
  player.critRate = config.critRate;
  player.critDamage = 1.5;

  if(player.equipment){
    Object.values(player.equipment).forEach(item=>{
      if(!item) return;
      if(item.atk) player.atk += item.atk;
      if(item.def) player.def += item.def;
      if(item.hp)  player.maxHp += item.hp;
      if(item.dodge) player.dodge += item.dodge;
      if(item.critRate) player.critRate += item.critRate;
    });
  }

  if(player.hp > player.maxHp)
    player.hp = player.maxHp;
}

/* ===== SPAWN ENEMY ===== */
function spawnEnemy(){
  enemy={
    maxHp:600,
    hp:600,
    atk:100,
    def:50
  };
}

/* ===== LEVEL UP ===== */
function checkLevelUp(){
  if(player.exp >= player.level*200){
    player.level++;
    player.exp = 0;
    player.hp = player.maxHp;
  }
}

/* ===== RENDER ===== */
function render(){

  // Avatar theo class
  const avatarMap = {
    warrior:"/assets/classes/warrior.jpg",
    assassin:"/assets/classes/assassin.jpg",
    mage:"/assets/classes/mage.jpg"
  };

  document.getElementById("playerAvatar").style.backgroundImage =
    `url(${avatarMap[player.classType]})`;

  document.getElementById("enemyAvatar").style.backgroundImage =
    "url(/assets/classes/warrior.jpg)"; // tạm dùng ảnh này cho quái

  // Player HP
  const playerPercent =
    (player.hp / player.maxHp) * 100;

  document.getElementById("playerHpFill")
    .style.width = playerPercent + "%";

  document.getElementById("playerHpText")
    .innerText =
    player.name + " | " +
    Math.floor(player.hp) + "/" + player.maxHp;

  // Enemy HP
  const enemyPercent =
    (enemy.hp / enemy.maxHp) * 100;

  document.getElementById("enemyHpFill")
    .style.width = enemyPercent + "%";

  document.getElementById("enemyHpText")
    .innerText =
    "Quái | " +
    Math.floor(enemy.hp) + "/" + enemy.maxHp;
}


function showDamage(targetClass, dmg, isCrit=false){

  const target =
    document.querySelector(targetClass + " .avatar");

  const dmgEl = document.createElement("div");
  dmgEl.className="damage";
  dmgEl.innerText = "-" + dmg;

  if(isCrit){
    dmgEl.classList.add("crit");
  }

  /* Vị trí cố định theo bên */
  dmgEl.style.top = "20px";
  dmgEl.style.left = "50%";
  dmgEl.style.transform = "translateX(-50%)";

  target.style.position = "relative"; // đảm bảo có positioning
  target.appendChild(dmgEl);

  setTimeout(()=>dmgEl.remove(),1000);
}





/* ===== ATTACK ===== */
function attack(){

  if(isAttacking) return;
  isAttacking = true;

  let logText="";

  /* PLAYER ATTACK */

  // Enemy dodge
  if(Math.random()*100 < 5){
    logText += "👹 Quái né đòn!\n";
  }else{

let dmg = player.atk - enemy.def*0.5;
dmg = Math.max(0, dmg);

let isCrit = false;

if(Math.random()*100 < player.critRate){
  dmg *= player.critDamage;
  isCrit = true;
  logText += "💥 CHÍ MẠNG!\n";
}

dmg = Math.floor(dmg);
enemy.hp -= dmg;

logText += "Bạn gây "+dmg+" sát thương.\n";

/* ===== EFFECT ===== */
showDamage(".character.enemy", dmg, isCrit);

const enemyAvatar =
  document.querySelector(".enemy .avatar");

enemyAvatar.classList.add("hit","flash");

setTimeout(()=>{
  enemyAvatar.classList.remove("hit","flash");
},200);

  }

if(enemy.hp <= 0){
  enemy.hp = 0;

  // ===== EXP =====
  player.exp += 100;

  // ===== DIAMOND DROP =====
  const diamondDrop = Math.floor(
    20 + Math.random() * (30 + player.level * 5)
  );

  player.gold += diamondDrop;

  // ===== ITEM DROP CHANCE =====
  const dropChance = 15 + player.level * 2; // %

  let itemDropText = "";

  if(Math.random() * 100 < dropChance){

    const lootTable = [
      { icon:"🗡", name:"Kiếm rỉ sét", atk:15, type:"weapon", price:120 },
      { icon:"🛡", name:"Giáp cũ", def:12, type:"armor", price:100 },
      { icon:"🪖", name:"Mũ sắt mẻ", def:8, type:"helmet", price:90 },
      { icon:"💍", name:"Nhẫn may mắn", atk:10, type:"ring", price:150 },
      { icon:"🔮", name:"Ngọc hồi phục", hp:120, type:"gem", price:180 }
    ];

    const randomItem =
      lootTable[Math.floor(Math.random()*lootTable.length)];

    player.inventory.push(randomItem);

    itemDropText =
      `🎁 Nhặt được: ${randomItem.icon} ${randomItem.name}\n`;
  }

  checkLevelUp();
  savePlayer();

  logText +=
    "🎉 Hạ quái! +100 EXP\n" +
    `💎 Nhận ${diamondDrop} kim cương\n` +
    itemDropText;

  document.getElementById("battleLog").innerText = logText;
  render();

  setTimeout(()=>{
    spawnEnemy();
    render();
    document.getElementById("battleLog").innerText = "";
    isAttacking=false;
  },1500);

  return;
}


  /* ENEMY ATTACK */

  if(Math.random()*100 < player.dodge){
    logText += "💨 Bạn né được đòn!\n";
  }else{

    let dmg = enemy.atk - player.def*0.4;
    dmg = Math.max(0,dmg);
    dmg = Math.floor(dmg);

    player.hp -= dmg;

    showDamage(".character:not(.enemy)", dmg);

const playerAvatar =
  document.querySelector(".character:not(.enemy) .avatar");

playerAvatar.classList.add("hit","flash");

setTimeout(()=>{
  playerAvatar.classList.remove("hit","flash");
},200);

    logText += "Quái gây "+dmg+" sát thương.\n";
  }

  if(player.hp <= 0){
    player.hp=0;
    player.deadUntil =
      Date.now()+(24*60*60*1000);

    savePlayer();

    logText += "💀 Bạn đã bị hạ!";
    document.getElementById("battleLog").innerText=logText;

    setTimeout(()=>{
      location.href="game-diamond-hunter.html";
    },1500);

    return;
  }

  document.getElementById("battleLog").innerText = logText;

  savePlayer();
  render();

  setTimeout(()=>isAttacking=false,300);
}

/* ===== BACK ===== */
function backToHub(){
  savePlayer();
  location.href="game-diamond-hunter.html";
}

/* ===== INIT ===== */
recalcStats();
spawnEnemy();
render();

</script>



</body>
</html>
