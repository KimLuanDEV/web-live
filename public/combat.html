<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#02070c">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Đấu Trường</title>

<style>
body{
  margin:0;
  background:radial-gradient(circle at center,#08121a,#000);
  font-family:system-ui;
  color:#fff;
  padding:0;
  min-height:100vh;
}

html, body{
  margin:0;
  padding:0;
  background:#02070c;
}


.title{
  text-align:center;
  font-size:22px;
  font-weight:800;
  padding:15px 0;
  color:#00f0ff;
  text-shadow:0 0 15px #00f0ff;
}

.arena{
  height:60vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 30px;
}

.character{
  width:45%;
  text-align:center;
}

.avatar{
  width:160px;
  height:200px;
  margin:0 auto;
  background-size:cover;
  background-position:center;
  border-radius:20px;
  box-shadow:0 0 30px rgba(0,255,255,.3);
}

.enemy .avatar{
  box-shadow:0 0 30px rgba(255,0,60,.4);
}

/* ===== PRO HP BAR ===== */

.hp-wrapper{
  width:90%;
  margin:15px auto 0;
}

.hp-bar.pro{
  position:relative;
  height:22px;
  border-radius:14px;
  background:linear-gradient(180deg,#050b12,#0c1c26);
  overflow:hidden;
  border:1px solid rgba(0,255,255,.4);
  box-shadow:0 0 15px rgba(0,255,255,.3);
}

.hp-bar.pro.enemy-bar{
  border:1px solid rgba(255,0,60,.4);
  box-shadow:0 0 15px rgba(255,0,60,.3);
}

.hp-fill{
  position:absolute;
  inset:0;
  width:100%;
  transition:width .4s ease;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
}

.enemy-bar .hp-fill{
  background:linear-gradient(90deg,#ff0044,#ff9900);
}

/* LIGHT SWEEP EFFECT */
.hp-glow{
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    transparent 0%,
    rgba(255,255,255,.25) 40%,
    transparent 80%
  );
  animation:hpSweep 2.5s linear infinite;
  pointer-events:none;
}

@keyframes hpSweep{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(100%)}
}

/* TEXT INSIDE BAR */
.hp-text.inside{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  color:#fff;
  text-shadow:0 0 6px #000;
  pointer-events:none;
}


.actions{
  padding:0 20px 20px;
}

.btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:18px;
  font-weight:800;
  font-size:16px;
  margin-top:10px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff0044,#ff9900);
  color:#fff;
}

.back{
  background:#111;
}

.log{
  margin:15px 20px;
  background:#0b1118;
  padding:12px;
  border-radius:14px;
  font-size:13px;
  height:90px;
  overflow-y:auto;
}


/* HIT SHAKE */
.hit{
  animation:shake .25s;
}

@keyframes shake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-6px)}
  100%{transform:translateX(0)}
}

/* DAMAGE FLOAT */
.damage{
  position:absolute;
  font-weight:900;
  font-size:22px;
  pointer-events:none;
  animation:floatUp 1s forwards;
  z-index:10;
}


@keyframes floatUp{
  0%{opacity:1; transform:translate(-50%,0);}
  100%{opacity:0; transform:translate(-50%,-60px);}
}

/* CRIT EFFECT */
.crit{
  color:#ff0033;
  font-size:28px;
  text-shadow:0 0 15px red;
}

/* FLASH HIT */
.flash{
  animation:flashHit .2s;
}

@keyframes flashHit{
  0%{filter:brightness(1)}
  50%{filter:brightness(2)}
  100%{filter:brightness(1)}
}


/* SLASH EFFECT */
.slash{
  position:absolute;
  top:50%;
  left:50%;
  width:120px;
  height:8px;
  background:linear-gradient(90deg,transparent,#fff,transparent);
  transform:translate(-50%,-50%) rotate(25deg);
  animation:slashMove .3s forwards;
  opacity:0;
}

@keyframes slashMove{
  0%{opacity:1; transform:translate(-50%,-50%) rotate(25deg) scale(0.5);}
  100%{opacity:0; transform:translate(-50%,-50%) rotate(25deg) scale(1.8);}
}

/* SCREEN SHAKE */
.screenShake{
  animation:screenShake .3s;
}

@keyframes screenShake{
  0%{transform:translateX(0)}
  25%{transform:translateX(-5px)}
  50%{transform:translateX(5px)}
  75%{transform:translateX(-5px)}
  100%{transform:translateX(0)}
}

/* LOW HP GLOW */
.lowHp{
  box-shadow:0 0 25px red !important;
  animation:lowPulse 1s infinite;
}

@keyframes lowPulse{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.5)}
  100%{filter:brightness(1)}
}


/* ===== ASH EXPLOSION ===== */
.ash{
  position:absolute;
  width:6px;
  height:6px;
  background:rgba(255,255,255,.8);
  border-radius:50%;
  pointer-events:none;
  animation:ashFly 1.2s forwards;
}

@keyframes ashFly{
  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }
  100%{
    opacity:0;
    transform:translate(var(--x), var(--y)) scale(.3);
  }
}

/* CARD DISINTEGRATE */
.disintegrate{
  animation:burnOut 1.2s forwards;
}

@keyframes burnOut{
  0%{
    filter:grayscale(0%) brightness(1);
    opacity:1;
  }
  40%{
    filter:grayscale(100%) brightness(1.8);
  }
  100%{
    filter:grayscale(100%) brightness(0.2);
    opacity:0;
    transform:scale(.8);
  }
}



/* ===== ACTION PANEL REDESIGN ===== */

.actions{
  padding:15px 20px 25px;
  background:linear-gradient(180deg,transparent,#050b12);
  backdrop-filter:blur(6px);
}

/* MAIN ATTACK */
.btn-main{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
  cursor:pointer;
  background:linear-gradient(90deg,#ff0044,#ff9900);
  box-shadow:0 0 25px rgba(255,0,80,.6);
  transition:.2s;
}

.btn-main:active{
  transform:scale(.97);
}

/* SKILL BAR */
.skill-bar{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
}

.skill-btn{
  flex:1;
  height:70px;
  border-radius:18px;
  border:2px solid rgba(0,255,255,.3);
  background:linear-gradient(180deg,#0d1a22,#09131a);
  color:#00f0ff;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:.2s;
}

.skill-btn span{
  position:relative;
  z-index:2;
}

.skill-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(45deg,transparent,#00f0ff33,transparent);
  opacity:0;
  transition:.3s;
}

.skill-btn:hover::before{
  opacity:1;
}

.skill-btn:disabled{
  filter:grayscale(100%);
  opacity:.5;
  border-color:#444;
}



/* ===== SKILL CIRCLE ===== */
.skill-circle{
  position:relative;
  width:75px;
  height:75px;
  border-radius:50%;
  border:none;
  background:#0d1a22;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 0 20px rgba(0,255,255,.4);
}

.skill-circle img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

/* COOL DOWN OVERLAY */
.cooldown{
  position:absolute;
  inset:0;
  background:conic-gradient(
    rgba(0,0,0,.7) 0deg,
    rgba(0,0,0,.7) 360deg
  );
  border-radius:50%;
  pointer-events:none;
  display:none;
}

.skill-circle.disabled{
  filter:grayscale(100%);
}

/* TEXT GIỮA VÒNG */
.cd-text{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px;
  color:#fff;
  text-shadow:0 0 10px #000;
  pointer-events:none;
}

/* SKILL READY PULSE */
.skill-ready{
  animation:skillPulse 1.2s infinite;
}

@keyframes skillPulse{
  0%{ box-shadow:0 0 15px rgba(0,255,255,.4);}
  50%{ box-shadow:0 0 35px rgba(0,255,255,.9);}
  100%{ box-shadow:0 0 15px rgba(0,255,255,.4);}
}



/* ===== GAME HEADER ===== */

.game-header{
  position:relative;
  padding-top:env(safe-area-inset-top);
  height:calc(65px + env(safe-area-inset-top));
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(180deg,#061018,#02070c);
  border-bottom:1px solid rgba(0,255,255,.2);
  box-shadow:0 0 25px rgba(0,255,255,.15);
}

.header-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
  color:#00f0ff;
  text-shadow:0 0 15px #00f0ff;
}

.header-back{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  width:40px;
  height:40px;
  border-radius:12px;
  border:none;
  background:#0d1a22;
  color:#00f0ff;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,255,255,.4);
  transition:.2s;
}

.header-back:hover{
  background:#122430;
}

.header-right{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  gap:10px;
}


.header-gold{
  background:#0d1a22;
  padding:6px 10px;
  border-radius:12px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 0 10px rgba(0,255,255,.2);
}



/* ===== SKILL CAST EFFECT ===== */

.skill-cast{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,
    rgba(0,255,255,.2),
    transparent 70%);
  animation:skillFlash .4s ease-out forwards;
  pointer-events:none;
  z-index:999;
}

@keyframes skillFlash{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* ENERGY BURST */
.energy-burst{
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.6);
  animation:burst 0.5s ease-out forwards;
  pointer-events:none;
}

@keyframes burst{
  0%{
    opacity:1;
    transform:scale(.3);
  }
  100%{
    opacity:0;
    transform:scale(1.6);
  }
}



/* ===== LIGHTNING ===== */
.lightning{
  position:absolute;
  width:6px;
  height:200px;
  background:linear-gradient(#00f0ff,#ffffff,#00f0ff);
  left:50%;
  top:-50px;
  transform:translateX(-50%);
  animation:lightningStrike .3s ease-out forwards;
  box-shadow:0 0 20px #00f0ff;
}

@keyframes lightningStrike{
  0%{opacity:1; height:0;}
  100%{opacity:0; height:220px;}
}

/* ===== SHADOW DASH ===== */
.shadow-dash{
  position:absolute;
  inset:0;
  background:rgba(0,255,150,.15);
  animation:dashMove .3s ease-out forwards;
  pointer-events:none;
}

@keyframes dashMove{
  0%{opacity:0; transform:translateX(-80px);}
  50%{opacity:1;}
  100%{opacity:0; transform:translateX(0);}
}

/* ===== GROUND CRACK ===== */
.ground-crack{
  position:absolute;
  bottom:-10px;
  left:50%;
  width:120px;
  height:40px;
  transform:translateX(-50%);
  background:radial-gradient(circle,#ff9900,transparent);
  animation:crack .4s ease-out forwards;
}

@keyframes crack{
  0%{opacity:1; transform:translateX(-50%) scale(.4);}
  100%{opacity:0; transform:translateX(-50%) scale(1.5);}
}

/* ===== SLOW MOTION ===== */
.slowmo{
  animation:slowmoEffect .6s ease-out forwards;
}

@keyframes slowmoEffect{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}





</style>
</head>

<body>

<div class="game-header">

  <button class="header-back" onclick="backToHub()">
    ←
  </button>

<div class="header-title">
  ARENA<span id="stageText"></span>
</div>


<div class="header-right">
  <button onclick="switchMode()" 
          style="background:#111;color:#00f0ff;border:none;
                 padding:6px 10px;border-radius:10px;font-weight:800;">
    MODE
  </button>

  <div class="header-gold">
    💎 <span id="headerGold">0</span>
  </div>
</div>


</div>


<div class="arena">

  <div class="character">
    <div class="avatar" id="playerAvatar"></div>

<div class="hp-wrapper">
  <div class="hp-bar pro">
    <div class="hp-fill" id="playerHpFill"></div>
    <div class="hp-glow"></div>
    <div class="hp-text inside" id="playerHpText"></div>
  </div>
</div>


  </div>

  <div class="character enemy">
    <div class="avatar" id="enemyAvatar"></div>

<div class="hp-wrapper">
  <div class="hp-bar pro enemy-bar">
    <div class="hp-fill" id="enemyHpFill"></div>
    <div class="hp-glow"></div>
    <div class="hp-text inside" id="enemyHpText"></div>
  </div>
</div>


  </div>
</div>


<div class="actions">

  <!-- MAIN ATTACK -->
  <button class="btn-main" onclick="attack()">
    ATTACK
  </button>

  <!-- SKILL BAR -->
<div class="skill-bar">

  <button class="skill-circle" onclick="useSkill(1)" id="skill1Btn">
  <div class="cooldown" id="cd1"></div>
  <div class="cd-text" id="cdText1"></div>
  <img>
  </button>

  <button class="skill-circle" onclick="useSkill(2)" id="skill2Btn">
  <div class="cooldown" id="cd2"></div>
  <div class="cd-text" id="cdText2"></div>
  <img>
  </button>

  <button class="skill-circle" onclick="useSkill(3)" id="skill3Btn">
  <div class="cooldown" id="cd3"></div>
  <div class="cd-text" id="cdText3"></div>
  <img>
  </button>
</div>
</div>



<div class="log" id="battleLog"></div>





<script>

let stage = parseInt(localStorage.getItem("arena_stage")) || 1;
let gameMode = localStorage.getItem("arena_mode") || "rank";
let player = JSON.parse(localStorage.getItem("hunter_char"));
let enemy = null;
let isAttacking = false;

let skillCooldown = {
  1:0,
  2:0,
  3:0
};
let status = {
  enemyBurn:0,
  enemyPoison:0,
  enemyAtkDown:0,
  playerShield:0,
  playerReflect:0,
  playerInvisible:false,
  playerCritBoost:0,
  enemyStun:false
};


/* ===== SKILL ICON MAP ===== */
const SKILL_ICONS = {
  warrior:{
    1:"/assets/skills/warrior_skill1.png",
    2:"/assets/skills/warrior_skill2.png",
    3:"/assets/skills/warrior_skill3.png"
  },
  assassin:{
    1:"/assets/skills/assassin_skill1.png",
    2:"/assets/skills/assassin_skill2.png",
    3:"/assets/skills/assassin_skill3.png"
  },
  mage:{
    1:"/assets/skills/mage_skill1.png",
    2:"/assets/skills/mage_skill2.png",
    3:"/assets/skills/mage_skill3.png"
  }
};



if(!player){
  location.href="game-diamond-hunter.html";
}

/* ===== SAVE ===== */
function savePlayer(){
  if(!player) return;
  player.lastOnline = Date.now();
  localStorage.setItem("hunter_char",
    JSON.stringify(player));
}

/* ===== RECALC STATS (phòng khi có trang bị) ===== */
function recalcStats(){

  const CLASS_CONFIG = {
    warrior:{ base:{maxHp:800,atk:120,def:90}, dodge:5, critRate:10 },
    assassin:{ base:{maxHp:500,atk:200,def:40}, dodge:15, critRate:25 },
    mage:{ base:{maxHp:550,atk:170,def:60}, dodge:8, critRate:18 }
  };

  const config = CLASS_CONFIG[player.classType];

  player.maxHp = config.base.maxHp + player.level*50;
  player.atk   = config.base.atk   + player.level*10;
  player.def   = config.base.def   + player.level*8;
  player.dodge = config.dodge;
  player.critRate = config.critRate;
  player.critDamage = 1.5;
  player.lifesteal = 0;

if(player.equipment){

  Object.values(player.equipment).forEach(item=>{
    if(!item) return;

    const enhance = item.enhance || 0;
    const scale = 1 + enhance * 0.1 + enhance * enhance * 0.02;


    if(item.atk)
      player.atk += Math.floor(item.atk * scale);

    if(item.def)
      player.def += Math.floor(item.def * scale);

    if(item.hp)
      player.maxHp += Math.floor(item.hp * scale);

    if(item.dodge)
      player.dodge += item.dodge;

    if(item.critRate)
      player.critRate += item.critRate;

    if(item.lifesteal)
      player.lifesteal += item.lifesteal;

    if(item.regen)
      player.regen += item.regen;
  });
}

  if(player.hp > player.maxHp)
    player.hp = player.maxHp;


/* ===== GOLDEN SET BONUS ===== */

if(player.equipment){

const equipped = Object.values(player.equipment)
  .filter(i => i && i.set === "golden");

const count = equipped.length;

if(count >= 3){
  player.atk += 150;
}

if(count >= 6){
  player.def += 250;
  player.critRate += 15;
}

if(count >= 9){
  player.atk += 300;
  player.lifesteal += 20;
  player.regen += 15;
}

}



}

/* ===== SPAWN ENEMY ===== */
function spawnEnemy(){

  if(gameMode === "gold"){

  const scale = stage * 1.8;

  enemy = {
    maxHp: 1200 + scale * 200,
    hp:    1200 + scale * 200,
    atk:   200 + scale * 40,
    def:   100 + scale * 25,
    isBoss:true,
    isGolden:true
  };
}


  if(gameMode === "rank"){

    const isBoss = stage % 5 === 0;

    const baseHp = 400 + stage * 120;
    const baseAtk = 60 + stage * 15;
    const baseDef = 30 + stage * 8;

    enemy = {
      maxHp: isBoss ? baseHp * 2 : baseHp,
      hp:    isBoss ? baseHp * 2 : baseHp,
      atk:   isBoss ? baseAtk * 1.5 : baseAtk,
      def:   baseDef,
      isBoss: isBoss
    };

  }else{

    // 🌾 FARM MODE
    const scale = player.level * 1.2;

    enemy = {
      maxHp: 300 + scale * 80,
      hp:    300 + scale * 80,
      atk:   40 + scale * 12,
      def:   20 + scale * 6,
      isBoss:false
    };

  }
}



/* ===== LEVEL UP ===== */
function checkLevelUp(){
  if(player.exp >= player.level*200){
    player.level++;
    player.exp = 0;
    player.hp = player.maxHp;
  }
}

/* ===== RENDER ===== */
function render(){

  /* ================= AVATAR ================= */

  const avatarMap = {
    warrior:"/assets/classes/warrior.jpg",
    assassin:"/assets/classes/assassin.jpg",
    mage:"/assets/classes/mage.jpg"
  };

  document.getElementById("playerAvatar").style.backgroundImage =
    `url(${avatarMap[player.classType]})`;

  // 👑 Enemy avatar theo mode
  let enemyImg = "/assets/classes/enemy.jpg";

  if(gameMode === "gold"){
    enemyImg = "/assets/classes/boss_gold.jpg";
  }
  else if(enemy.isBoss){
    enemyImg = "/assets/classes/boss.jpg";
  }

  document.getElementById("enemyAvatar").style.backgroundImage =
    `url(${enemyImg})`;


  /* ================= BACKGROUND ================= */

  if(gameMode === "gold"){
    document.body.style.background =
      "radial-gradient(circle at center,#3a2600,#000)";
  }else{
    document.body.style.background =
      "radial-gradient(circle at center,#08121a,#000)";
  }


  /* ================= PLAYER HP ================= */

  const playerPercent =
    (player.hp / player.maxHp) * 100;

  document.getElementById("playerHpFill")
    .style.width = playerPercent + "%";

  const playerBar =
    document.querySelector(".hp-bar.pro");

  if(player.hp / player.maxHp < 0.25){
    playerBar.style.boxShadow = "0 0 25px red";
    playerBar.style.borderColor = "red";
  }else{
    playerBar.style.boxShadow =
      gameMode === "gold"
        ? "0 0 25px gold"
        : "0 0 15px rgba(0,255,255,.3)";

    playerBar.style.borderColor =
      gameMode === "gold"
        ? "gold"
        : "rgba(0,255,255,.4)";
  }

  document.getElementById("playerHpText").innerText =
    player.name + " | " +
    Math.floor(player.hp) + "/" + player.maxHp;


  /* ================= ENEMY HP ================= */

  const enemyPercent =
    (enemy.hp / enemy.maxHp) * 100;

  document.getElementById("enemyHpFill")
    .style.width = enemyPercent + "%";

  const enemyBar =
    document.querySelector(".enemy-bar");

  if(enemy.hp / enemy.maxHp < 0.25){
    enemyBar.style.boxShadow = "0 0 25px red";
    enemyBar.style.borderColor = "red";
  }else{
    enemyBar.style.boxShadow =
      gameMode === "gold"
        ? "0 0 25px gold"
        : "0 0 15px rgba(255,0,60,.3)";

    enemyBar.style.borderColor =
      gameMode === "gold"
        ? "gold"

function showDamage(targetClass, dmg, isCrit=false){

  const target =
    document.querySelector(targetClass + " .avatar");

  const dmgEl = document.createElement("div");
  dmgEl.className="damage";


  if(dmg > 0){
  dmgEl.innerText = "-" + dmg;
}else{
  dmgEl.innerText = "+" + Math.abs(dmg);
  dmgEl.style.color = "#00ff99";
}


  if(isCrit){
    dmgEl.classList.add("crit");
  }

  /* Vị trí cố định theo bên */
  dmgEl.style.top = "20px";
  dmgEl.style.left = "50%";
  dmgEl.style.transform = "translateX(-50%)";

  target.style.position = "relative"; // đảm bảo có positioning
  target.appendChild(dmgEl);

function showSkillEffect(targetClass, type){

function playDeath(targetClass){

  const card = document.querySelector(targetClass);
  const avatar = card.querySelector(".avatar");

  avatar.style.position = "relative";

  // tạo 30 hạt bụi
  for(let i=0;i<30;i++){

    const ash = document.createElement("div");
    ash.className = "ash";

    const x = (Math.random()*200 - 100) + "px";
    const y = (Math.random()*200 - 100) + "px";

    ash.style.setProperty("--x", x);
    ash.style.setProperty("--y", y);

    ash.style.left = "50%";
    ash.style.top = "50%";

    avatar.appendChild(ash);

    setTimeout(()=>ash.remove(),1200);
  }

  // làm card cháy tan
  card.classList.add("disintegrate");
}

function updateCooldownUI(){

  const maxCD = {1:3,2:4,3:5};

  [1,2,3].forEach(i=>{

    const btn = document.getElementById("skill"+i+"Btn");
    const cd = document.getElementById("cd"+i);
    const text = document.getElementById("cdText"+i);

    if(skillCooldown[i] > 0){

      const percent = skillCooldown[i] / maxCD[i];
      const deg = percent * 360;

      cd.style.display = "block";
      text.innerText = skillCooldown[i];

      cd.style.background =
        `conic-gradient(
          rgba(0,0,0,.75) 0deg,
          rgba(0,0,0,.75) ${deg}deg,
          transparent ${deg}deg,
          transparent 360deg
        )`;

      btn.classList.remove("skill-ready");
      btn.classList.add("disabled");

    }else{

      cd.style.display = "none";
      text.innerText = "";

      btn.classList.remove("disabled");
      btn.classList.add("skill-ready");
    }

  });
}


function reduceCooldown(){

  Object.keys(skillCooldown).forEach(k=>{
    if(skillCooldown[k] > 0){
      skillCooldown[k]--;
    }
  });

  updateCooldownUI();
}

      { name:"Kiếm Sắt", atk:12, type:"weapon", img:"/assets/items/weapon_sword_1.png", rarity:"normal" },
      { name:"Giáp Thép", def:25, type:"armor", img:"/assets/items/armor_silver.png", rarity:"normal" },
      { name:"Nhẫn Máu", lifesteal:5, type:"ring", img:"/assets/items/ring_power.png", rarity:"normal" },
      { name:"Ngọc Sinh Mệnh", hp:300, type:"gem", img:"/assets/items/gem_life.png", rarity:"normal" }

    ];

    item = normalItems[
      Math.floor(Math.random()*normalItems.length)
    ];
  }

  /* ================= FINALIZE ================= */

  const finalItem = {
    ...item,
    enhance:0
  };

  if(!player.inventory) player.inventory = [];

  player.inventory.push(finalItem);

  /* ================= LOG ================= */

  let rarityText = "";

  if(finalItem.rarity === "ultimate")
    rarityText = "✨✨ ULTIMATE ✨✨ ";

  else if(finalItem.rarity === "mythic")
    rarityText = "🔥 MYTHIC 🔥 ";

  document.getElementById("battleLog").innerText +=
    rarityText + "🎁 Rơi trang bị: " + finalItem.name + "\n";

  savePlayer();
}


</script>
