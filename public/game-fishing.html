<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<title>Fishing Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
background:#021a2a;
color:#fff;
font-family:sans-serif;
text-align:center;
overflow:hidden;
}

/* TOPBAR */

.topbar{
display:flex;
justify-content:space-between;
padding:10px 15px;
background:#000a;
}

#coins{
color:#0ff;
font-weight:bold;
}

/* GAME AREA */

#lake{
height:50vh;
background:linear-gradient(#0b3d5c,#021a2a);
display:flex;
align-items:center;
justify-content:center;
font-size:80px;
}

/* BET PANEL */

.bet-panel{
padding:15px;
}

.bet-panel button{
padding:10px 16px;
margin:5px;
font-size:16px;
}

/* CAST BUTTON */

#castBtn{
margin-top:10px;
padding:12px 25px;
font-size:18px;
background:#ffcc00;
border:none;
}

/* TIMING BAR */

#timingBar{
width:80%;
height:20px;
background:#111;
margin:30px auto;
position:relative;
border-radius:10px;
overflow:hidden;
display:none;
}

#perfectZone{
position:absolute;
left:40%;
width:20%;
top:0;
bottom:0;
background:#00ff88;
}

#indicator{
position:absolute;
width:6px;
background:#fff;
top:0;
bottom:0;
left:0;
}

#result{
font-size:24px;
margin-top:10px;
}

</style>
</head>


<body>

<div class="topbar">
<div>🎣 Fishing</div>
<div>💎 <span id="coins">0</span></div>
</div>

<div id="lake">
🎣
</div>

<div class="bet-panel">

<button onclick="setBet(10)">10</button>
<button onclick="setBet(50)">50</button>
<button onclick="setBet(100)">100</button>

<br>

<button id="castBtn" onclick="cast()">CAST</button>

</div>

<div id="timingBar">

<div id="perfectZone"></div>

<div id="indicator"></div>

</div>

<div id="result"></div>


<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io({
auth:{ uid:localStorage.uid }
})

let coins = 0
let bet = 10

socket.on("coin-update",data=>{
coins = data.coins
document.getElementById("coins").textContent = coins
})

function setBet(v){
bet = v
}

let barActive=false
let pos=0
let dir=1

function cast(){

if(coins < bet){
alert("Not enough coins")
return
}

socket.emit("fishing-cast",{bet})

document.getElementById("timingBar").style.display="block"

barActive=true

pos=0

}

function updateBar(){

if(!barActive) return

pos += dir*2

if(pos > 100){
pos=100
dir=-1
}

if(pos < 0){
pos=0
dir=1
}

document.getElementById("indicator").style.left=pos+"%"

}

setInterval(updateBar,16)


document.body.addEventListener("click",()=>{

if(!barActive) return

barActive=false

document.getElementById("timingBar").style.display="none"

socket.emit("fishing-reel",{pos})

})


socket.on("fishing-result",data=>{

if(data.win){

document.getElementById("result").textContent =
"🐟 Bắt được cá! +" + data.reward

}else{

document.getElementById("result").textContent =
"❌ Cá tuột mất!"

}

})

</script>

</body>
</html>
