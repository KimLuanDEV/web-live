<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- PWA iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livestream Pro">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">


<title>Livestream Pro • Social</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="manifest" href="/manifest.json">

<!-- icon cho iOS -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link rel="stylesheet" href="/style.css">

<style>

/* ===== LIVESTREAM PRO SOCIAL ===== */

.lp-shell{
  max-width:720px;
  margin:0 auto;
  padding:10px;
}

.lp-topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  background:rgba(0,0,0,.5);
  border-bottom:1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(10px);
}

.lp-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
  letter-spacing:.6px;
}

.lp-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#25F09A;
  box-shadow:0 0 14px #25F09A;
}

/* Composer */
.lp-compose{
  margin-top:12px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  padding:12px;
}

.lp-compose-row{
  display:flex;
  gap:10px;
}

.lp-compose textarea{
  flex:1;
  height:70px;
  resize:none;
  background:rgba(0,0,0,.6);
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
  padding:10px;
  color:#fff;
}

.lp-compose-actions{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.lp-post-btn{
  padding:10px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  border:none;
  font-weight:900;
  color:#000;
}

/* Feed */
.lp-feed{
  margin-top:14px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.lp-post{
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.14);
  border-radius:20px;
  padding:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.6);
}

.lp-post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.lp-ava{
  width:44px;
  height:44px;
  border-radius:14px;
  object-fit:cover;
}

.lp-post-name{
  font-weight:900;
}

.lp-post-time{
  font-size:12px;
  opacity:.6;
}

.lp-post-text{
  margin-top:10px;
  line-height:1.4;
}

.lp-post-img{
  width:100%;
  margin-top:10px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.12);
}


.lp-actions{
  display:flex;
  gap:16px;
  margin-top:10px;
  font-weight:800;
}
.lp-action{
  cursor:pointer;
  opacity:.8;
}
.lp-action:hover{ color:#25F09A }

.lp-comments{
  margin-top:10px;
  border-top:1px solid rgba(255,255,255,.12);
  padding-top:8px;
}

.lp-comment{
  display:flex;
  gap:10px;
  font-size:13px;
  align-items:flex-start;
  padding:6px 0;
  opacity:.9;
}


.lp-cm-ava{
  width:32px;
  height:32px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid rgba(255,255,255,.15);
}

.lp-cm-body{
  background:rgba(0,0,0,.55);
  padding:8px 12px;
  border-radius:14px;
  flex:1;
}

.lp-cm-name{
  font-weight:800;
  font-size:13px;
  color:#25F09A;
}

.lp-cm-text{
  font-size:14px;
  line-height:1.35;
  margin-top:2px;
}

/* ===== COMMENT INPUT FIX ===== */

.lp-comment-box{
  display:flex;
  gap:8px;
  margin-top:8px;
  align-items:center;
}

.lp-comment-input{
  flex:1;
  height:42px;
  padding:0 14px;
  border-radius:999px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.15);
  color:#fff;
  font-size:14px;
}

.lp-comment-send{
  width:42px;
  height:42px;
  border-radius:50%;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  border:none;
  font-size:18px;
  font-weight:900;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 14px rgba(37,240,154,.6);
  cursor:pointer;
}
.lp-comment-send:hover{
  filter:brightness(1.15);
}



.lp-cm-actions{
  font-size:12px;
  opacity:.7;
  cursor:pointer;
  margin-top:4px;
}

.lp-replies{
  margin-top:8px;
  padding-left:14px;
  border-left:2px solid rgba(255,255,255,.1);
}

.lp-reply{
  display:flex;
  gap:8px;
  margin-top:6px;
}

.lp-reply img{
  width:26px;
  height:26px;
  border-radius:50%;
}
.lp-reply-box{
  display:flex;
  gap:6px;
  margin-top:6px;
}
.lp-reply-box input{
  flex:1;
  background:rgba(0,0,0,.6);
  border-radius:999px;
}
.lp-reply-box button{
  width:32px;
  height:32px;
  border-radius:50%;
}

.hidden{
  display:none !important;
}


.lp-del{
  margin-left:auto;
  cursor:pointer;
  opacity:.6;
}
.lp-del:hover{
  color:#ff3b6b;
}


.cm-del{
  margin-left:10px;
  cursor:pointer;
  opacity:.5;
}
.cm-del:hover{
  color:#ff4d6d;
}


.cm-like{
  cursor:pointer;
  opacity:.8;
}
.cm-like:hover{
  color:#ff3b6b;
  filter:drop-shadow(0 0 6px rgba(255,59,107,.6));
}


/* ===== MOBILE TAB BAR ===== */

.lp-tabbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:64px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:rgba(0,0,0,.85);
  border-top:1px solid rgba(255,255,255,.15);
  backdrop-filter: blur(12px);
  z-index:9999;
}

.lp-tab{
  flex:1;
  text-align:center;
  color:#aaa;
  font-size:12px;
  cursor:pointer;
  position:relative;
}

.lp-tab .icon{
  font-size:22px;
  line-height:22px;
}

.lp-tab.active{
  color:#25F09A;
}

.lp-tab.active .icon{
  filter: drop-shadow(0 0 10px #25F09A);
}

.lp-tab .badge{
  position:absolute;
  top:4px;
  right:30%;
  width:10px;
  height:10px;
  background:#ff3b6b;
  border-radius:50%;
  box-shadow:0 0 10px #ff3b6b;
}

/* đẩy nội dung lên để không bị che */
.lp-shell{
  padding-bottom:80px;
}

/* ===== TAB BAR HIDE ON SCROLL ===== */
.lp-tabbar{
  transition: transform .35s ease, opacity .35s ease;
}

.lp-tabbar.hide{
  transform: translateY(100%);
  opacity: 0;
  pointer-events: none;
}

.lp-post-video{
  width:100%;
  margin-top:10px;
  border-radius:14px;
  background:#000;
}


</style>

</head>

<body class="social-page">

<script src="/guard.js"></script>

<div class="lp-shell">

  <!-- TOP BAR -->
  <div class="lp-topbar">
    <button class="msg-back" onclick="location.href='/profile.html'">‹</button>
    <div class="lp-title">
      <span class="lp-dot"></span> Livestream Pro
    </div>
  </div>

  <!-- CREATE POST -->
  <div class="lp-compose">
    <div class="lp-compose-row">
      <img id="meAvatar" class="lp-ava" />
      <textarea id="postText" placeholder="Chia sẻ điều gì đó…"></textarea>
    </div>

    <div class="lp-compose-actions">
      <input type="file" id="postImage" accept="image/*">
      <input type="file" id="postVideo" accept="video/*">

      <button class="lp-post-btn" onclick="submitPost()">Đăng</button>
    </div>
  </div>

  <!-- FEED -->
  <div id="lpFeed" class="lp-feed"></div>

</div>




<!-- MOBILE TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab active" data-tab="social">
    <div class="icon">🏠</div>
    <div class="txt">Feed</div>
  </div>

  <div class="lp-tab" data-tab="lobby">
    <div class="icon">🎥</div>
    <div class="txt">Live</div>
  </div>

  <div class="lp-tab" data-tab="messages">
    <div class="icon">💬</div>
    <div class="txt">Chat</div>
    <span class="badge hidden" id="msgBadge"></span>
  </div>

  <div class="lp-tab" data-tab="profile">
    <div class="icon">👤</div>
    <div class="txt">Profile</div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/social.js"></script>
</body>
</html>
