<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Viewer SFU</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#video{width:100vw;height:100vh;object-fit:cover;background:#000}
#overlay{
  position:fixed;top:10px;left:10px;
  background:rgba(0,0,0,.5);
  padding:8px 12px;border-radius:10px
}
</style>
</head>
<body>

<div id="overlay">⏳ Connecting…</div>
<video id="video" autoplay playsinline></video>

<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/mediasoup-client@3/lib/index.js"></script>
<script>

const roomId = new URLSearchParams(location.search).get("room") || "test";
const socket = io("http://207.148.79.73:4000");

let device, recvTransport;
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");

socket.on("connect", ()=>{
  socket.emit("join", { roomId, role:"viewer" }, async ({ rtpCapabilities })=>{
    device = new mediasoupClient.Device();
    await device.load({ routerRtpCapabilities: rtpCapabilities });
    overlay.textContent = "📡 Connected";
    createTransport();
  });
});

function createTransport(){
  socket.emit("create-transport", {}, data=>{
    recvTransport = device.createRecvTransport(data);

    recvTransport.on("connect", ({ dtlsParameters }, cb)=>{
      socket.emit("connect-transport", {
        transportId: recvTransport.id,
        dtlsParameters
      });
      cb();
    });

    socket.emit("get-producers", async (producerIds)=>{
      for(const id of producerIds){
        await consume(id);
      }
    });

    socket.on("new-producer", async ({ producerId })=>{
      await consume(producerId);
    });
  });
}

async function consume(producerId){
  socket.emit("consume", {
    transportId: recvTransport.id,
    producerId,
    rtpCapabilities: device.rtpCapabilities
  }, async (data)=>{
    const consumer = await recvTransport.consume(data);
    const stream = new MediaStream([consumer.track]);
    video.srcObject = stream;
    overlay.textContent = "🔴 LIVE";
    video.play().catch(()=>{});
  });
}

// unlock audio on mobile
["click","touchstart"].forEach(e=>{
  document.addEventListener(e, ()=>{
    video.muted = false;
    video.play().catch(()=>{});
  });
});

</script>
</body>
</html>
