<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thợ săn kim cương</title>
<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  background:#000;
  font-family:system-ui;
  color:#fff;
}

/* ===== SCREEN ===== */
.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

/* ===== TITLE ===== */
.title{
  font-size:20px;
  font-weight:800;
  text-align:center;
  margin-bottom:20px;
  color:#00f0ff;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:20px;
  background:#111;
  color:#fff;
}

/* ===== CLASS SELECT ===== */
.class-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
}

@media (max-width: 768px){
  .class-grid{
    grid-template-columns:repeat(3, 1fr);
  }
}




.class-card.selected{
  box-shadow:0 0 30px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
  transform:scale(1.03);
}

.btn{
  margin-top:20px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  font-weight:700;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  cursor:pointer;
}

/* ===== HUB ===== */
.card{
  background:#0a0f15;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 0 25px rgba(0,255,255,.15);
}

.bar{
  height:10px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
}

.menu-btn{
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  width:100%;
}

/* ===== COMBAT ===== */
.enemy{
  box-shadow:0 0 25px rgba(255,0,60,.25);
}

.log{
  margin-top:10px;
  font-size:13px;
  opacity:.8;
}



.class-card{
  position:relative;
  height:160px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:flex-end;
  padding:12px;
  transition:.25s;
}

.class-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.1),
    rgba(0,0,0,.75)
  );
}



/* ẢNH NỀN */
.class-card.warrior{
  background-image:url('/assets/classes/warrior.jpg');
}

.class-card.assassin{
  background-image:url('/assets/classes/assassin.jpg');
}

.class-card.mage{
  background-image:url('/assets/classes/mage.jpg');
}

/* Hover */
.class-card:hover{
  transform:scale(1.02);
}

/* Selected */
.class-card.selected{
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
}


.class-preview{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg,#0b1118,#060a0f);
  box-shadow:0 0 40px rgba(0,255,255,.15);
  animation:fadeUp .3s ease;
}

.hidden{
  display:none;
}

.preview-title{
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
  color:#00f0ff;
  text-align:center;
}

.preview-bar{
  margin-bottom:12px;
  font-size:14px;
}

.preview-bar .bar{
  height:8px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.preview-bar .fill{
  height:100%;
  width:0%;
  transition:.4s;
  border-radius:10px;
}

.preview-stat{
  font-size:14px;
  margin-bottom:6px;
  opacity:.9;
}

@keyframes fadeUp{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}



/* ===== HUB DESIGN ===== */

.hub-header{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin-bottom:20px;
  color:#00f0ff;
  text-shadow:0 0 15px rgba(0,255,255,.6);
}

.hub-card{
  background:linear-gradient(145deg,#0b1118,#060a0f);
  border-radius:24px;
  padding:25px 20px;
  text-align:center;
  box-shadow:
    0 0 40px rgba(0,255,255,.15),
    inset 0 0 30px rgba(0,255,255,.05);
  margin-bottom:20px;
}

.hub-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 15px;
  background:radial-gradient(circle,#00f0ff,#001a1f);
  box-shadow:0 0 25px rgba(0,255,255,.6);
}

.hub-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.hub-hp{
  height:12px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.hub-hp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  transition:.4s;
  border-radius:20px;
}

.hub-stats{
  font-size:14px;
  opacity:.85;
  margin-bottom:10px;
}

.hub-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.hub-btn{
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

.hub-btn.primary{
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  color:#000;
}

.hub-btn.danger{
  background:linear-gradient(90deg,#ff0044,#ff5500);
  color:#fff;
}

.hub-btn:hover{
  transform:scale(1.03);
}

.hub-avatar-img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 15px;
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:2px solid #00f0ff;
}

.hub-label{
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
  text-align:left;
}

.hub-exp{
  height:10px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.hub-exp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  transition:.4s;
  border-radius:20px;
}

.hub-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:10px;
}

.stat-box{
  background:#0f1620;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,255,255,.1);
}

.stat-value{
  font-size:18px;
  font-weight:800;
}

.stat-label{
  font-size:12px;
  opacity:.6;
}



</style>
</head>
<body>

<!-- ================= CREATE CHARACTER ================= -->
<div id="createScreen" class="screen active">

  <div class="title">✨ Tạo nhân vật</div>

  <input id="charName" placeholder="Nhập tên nhân vật">

<div class="class-grid">

  <div class="class-card warrior"
       onclick="selectClass(this,'warrior')">
  </div>

  <div class="class-card assassin"
       onclick="selectClass(this,'assassin')">
  </div>

  <div class="class-card mage"
       onclick="selectClass(this,'mage')">
  </div>

</div>

<!-- CLASS PREVIEW -->
<div id="classPreview" class="class-preview hidden">

  <div class="preview-title" id="previewName"></div>

  <div class="preview-bar">
    <span>❤️ HP</span>
    <div class="bar">
      <div class="fill" id="hpFill"></div>
    </div>
  </div>

  <div class="preview-bar">
    <span>⚔ ATK</span>
    <div class="bar">
      <div class="fill" id="atkFill"></div>
    </div>
  </div>

  <div class="preview-bar">
    <span>🛡 DEF</span>
    <div class="bar">
      <div class="fill" id="defFill"></div>
    </div>
  </div>

</div>


  <button class="btn" onclick="createCharacter()">Tạo nhân vật</button>
</div>


<!-- ================= HUB ================= -->
<div id="hubScreen" class="screen">

  <div class="hub-header">
    🏕 Thông tin nhân vật
  </div>

<div class="hub-card">

  <img id="hubAvatar" class="hub-avatar-img">

  <div class="hub-name" id="infoName"></div>

  <!-- HP BAR -->
  <div class="hub-label">❤️ HP</div>
  <div class="hub-hp">
    <div class="hub-hp-fill" id="hpBar"></div>
  </div>

  <!-- EXP BAR -->
  <div class="hub-label">⭐ EXP</div>
  <div class="hub-exp">
    <div class="hub-exp-fill" id="expBar"></div>
  </div>

  <!-- STATS 3 CỘT -->
  <div class="hub-stats-grid">
    <div class="stat-box">
      <div class="stat-value" id="atkStat"></div>
      <div class="stat-label">⚔ ATK</div>
    </div>

    <div class="stat-box">
      <div class="stat-value" id="defStat"></div>
      <div class="stat-label">🛡 DEF</div>
    </div>

    <div class="stat-box">
      <div class="stat-value" id="lvStat"></div>
      <div class="stat-label">LV</div>
    </div>
  </div>

</div>





  <div class="hub-actions">
    <button class="hub-btn primary" onclick="openCombat()">
      ⚔ Vào chiến đấu
    </button>

    <button class="hub-btn danger" onclick="resetCharacter()">
      🗑 Xóa nhân vật
    </button>
  </div>

</div>


<!-- ================= COMBAT ================= -->
<div id="combatScreen" class="screen">

  <div class="title">⚔ Chiến đấu</div>

  <div class="card">
    <div id="playerCombatStats"></div>
  </div>

  <div class="card enemy">
    <div id="enemyStats"></div>
  </div>

  <button class="btn" onclick="attack()">Tấn công</button>
  <button class="menu-btn" onclick="backToHub()">⬅ Quay lại</button>

  <div class="log" id="battleLog"></div>

</div>


<script>

let selectedClass=null;
let player=null;
let enemy=null;

/* ===== INIT ===== */
window.onload=function(){
  const saved=localStorage.getItem("hunter_char");
  if(saved){
    player=JSON.parse(saved);
    showHub();
  }
};

function selectClass(el,type){

  document.querySelectorAll(".class-card")
    .forEach(c=>c.classList.remove("selected"));

  el.classList.add("selected");
  selectedClass=type;

  const preview = document.getElementById("classPreview");
  preview.classList.remove("hidden");

  let hp=0, atk=0, def=0, name="";

  if(type==="warrior"){
    name="⚔ Chiến Binh";
    hp=800; atk=120; def=90;
  }

  if(type==="assassin"){
    name="🏹 Sát Thủ";
    hp=500; atk=200; def=40;
  }

  if(type==="mage"){
    name="🔮 Pháp Sư";
    hp=550; atk=170; def=60;
  }

  document.getElementById("previewName").innerText=name;

  document.getElementById("hpFill").style.width=(hp/1000*100)+"%";
  document.getElementById("atkFill").style.width=(atk/300*100)+"%";
  document.getElementById("defFill").style.width=(def/150*100)+"%";
}



function createCharacter(){

  const name=document.getElementById("charName").value.trim();
  if(!name || !selectedClass) return alert("Nhập tên và chọn phái!");

  if(selectedClass==="warrior"){
    player={name,level:1,maxHp:800,hp:800,atk:120,def:90,exp:0};
  }
  if(selectedClass==="assassin"){
    player={name,level:1,maxHp:500,hp:500,atk:200,def:40,exp:0};
  }
  if(selectedClass==="mage"){
    player={name,level:1,maxHp:550,hp:550,atk:170,def:60,exp:0};
  }

  localStorage.setItem("hunter_char",JSON.stringify(player));
  showHub();
}

function showHub(){
  switchScreen("hubScreen");

  document.getElementById("infoName").innerText =
    player.name;

  // Avatar theo class
  let avatarPath="";
  if(player.atk===120) avatarPath="/assets/classes/warrior.jpg";
  if(player.atk===200) avatarPath="/assets/classes/assassin.jpg";
  if(player.atk===170) avatarPath="/assets/classes/mage.jpg";

  document.getElementById("hubAvatar").src=avatarPath;

  // HP bar
  document.getElementById("hpBar").style.width =
    (player.hp/player.maxHp*100)+"%";

  // EXP bar
  document.getElementById("expBar").style.width =
    (player.exp/(player.level*200)*100)+"%";

  // Stats
  document.getElementById("atkStat").innerText=player.atk;
  document.getElementById("defStat").innerText=player.def;
  document.getElementById("lvStat").innerText=player.level;
}


function openCombat(){
  enemy={
    maxHp:600+player.level*150,
    hp:600+player.level*150,
    atk:100+player.level*20,
    def:50+player.level*10
  };
  switchScreen("combatScreen");
  renderCombat();
}

function renderCombat(){
  document.getElementById("playerCombatStats").innerText=
    player.name+" | HP "+player.hp+"/"+player.maxHp;
  document.getElementById("enemyStats").innerText=
    "Quái | HP "+enemy.hp+"/"+enemy.maxHp;
}

function attack(){

  let dmgToEnemy=Math.max(0,player.atk-enemy.def*0.5);
  dmgToEnemy=Math.floor(dmgToEnemy);
  enemy.hp-=dmgToEnemy;

  if(enemy.hp<=0){
    enemy.hp=0;
    player.exp+=100;
    levelUp();
    document.getElementById("battleLog").innerText=
      "🎉 Hạ quái! +100 EXP";
    localStorage.setItem("hunter_char",JSON.stringify(player));
    return;
  }

  let dmgToPlayer=Math.max(0,enemy.atk-player.def*0.4);
  dmgToPlayer=Math.floor(dmgToPlayer);
  player.hp-=dmgToPlayer;

  if(player.hp<=0){
    player.hp=0;
    document.getElementById("battleLog").innerText=
      "💀 Bạn đã bị hạ!";
  }

  renderCombat();
}

function levelUp(){
  if(player.exp>=player.level*200){
    player.level++;
    player.exp=0;
    player.maxHp+=200;
    player.hp=player.maxHp;
    player.atk+=40;
    player.def+=25;
  }
}

function backToHub(){
  localStorage.setItem("hunter_char",JSON.stringify(player));
  showHub();
}

function resetCharacter(){
  localStorage.removeItem("hunter_char");
  location.reload();
}

function switchScreen(id){
  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
