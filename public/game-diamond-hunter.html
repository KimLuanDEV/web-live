<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thợ săn kim cương</title>
<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  background:#000;
  font-family:system-ui;
  color:#fff;
}

/* ===== SCREEN ===== */
.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

/* ===== TITLE ===== */
.title{
  font-size:20px;
  font-weight:800;
  text-align:center;
  margin-bottom:20px;
  color:#00f0ff;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:20px;
  background:#111;
  color:#fff;
}

/* ===== CLASS SELECT ===== */
.class-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
}

@media (max-width: 768px){
  .class-grid{
    grid-template-columns:repeat(3, 1fr);
  }
}




.class-card.selected{
  box-shadow:0 0 30px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
  transform:scale(1.03);
}

.btn{
  margin-top:20px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  font-weight:700;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  cursor:pointer;
}

/* ===== HUB ===== */
.card{
  background:#0a0f15;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 0 25px rgba(0,255,255,.15);
}

.bar{
  height:10px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
}

.menu-btn{
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  width:100%;
}




.class-card{
  position:relative;
  height:160px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:flex-end;
  padding:12px;
  transition:.25s;
}

.class-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.1),
    rgba(0,0,0,.75)
  );
}



/* ẢNH NỀN */
.class-card.warrior{
  background-image:url('/assets/classes/warrior.jpg');
}

.class-card.assassin{
  background-image:url('/assets/classes/assassin.jpg');
}

.class-card.mage{
  background-image:url('/assets/classes/mage.jpg');
}

/* Hover */
.class-card:hover{
  transform:scale(1.02);
}

/* Selected */
.class-card.selected{
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
}


.class-preview{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg,#0b1118,#060a0f);
  box-shadow:0 0 40px rgba(0,255,255,.15);
  animation:fadeUp .3s ease;
}

.hidden{
  display:none;
}

.preview-title{
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
  color:#00f0ff;
  text-align:center;
}

.preview-bar{
  margin-bottom:12px;
  font-size:14px;
}

.preview-bar .bar{
  height:8px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.preview-bar .fill{
  height:100%;
  width:0%;
  transition:.4s;
  border-radius:10px;
}

.preview-stat{
  font-size:14px;
  margin-bottom:6px;
  opacity:.9;
}

@keyframes fadeUp{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}



/* ===== HUB DESIGN ===== */



.hub-card{
  background:linear-gradient(145deg,#0b1118,#060a0f);
  border-radius:24px;
  padding:25px 20px;
  text-align:center;
  box-shadow:
    0 0 40px rgba(0,255,255,.15),
    inset 0 0 30px rgba(0,255,255,.05);
  margin-bottom:20px;
}

.hub-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 15px;
  background:radial-gradient(circle,#00f0ff,#001a1f);
  box-shadow:0 0 25px rgba(0,255,255,.6);
}

.hub-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.hub-hp{
  height:12px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.hub-hp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  transition:.4s;
  border-radius:20px;
}

.hub-stats{
  font-size:14px;
  opacity:.85;
  margin-bottom:10px;
}

.hub-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.hub-btn{
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

.hub-btn.primary{
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  color:#000;
}

.hub-btn.danger{
  background:linear-gradient(90deg,#ff0044,#ff5500);
  color:#fff;
}

.hub-btn:hover{
  transform:scale(1.03);
}

.hub-avatar-img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 15px;
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:2px solid #00f0ff;
}

.hub-label{
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
  text-align:left;
}

.hub-exp{
  height:10px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.hub-exp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  transition:.4s;
  border-radius:20px;
}

.hub-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:10px;
}

.stat-box{
  background:#0f1620;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,255,255,.1);
}

.stat-value{
  font-size:18px;
  font-weight:800;
}

.stat-label{
  font-size:12px;
  opacity:.6;
}



.inventory{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  z-index:999;
}

.inventory-box{
  flex:1;
  width:100%;
  background:linear-gradient(145deg,#0b1118,#060a0f);
  padding:20px;
  overflow-y:auto;
  border-radius:0;
}


.inventory-header{
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
}

.close-btn{
  cursor:pointer;
  opacity:.7;
}

.inventory-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.inventory-item{
  aspect-ratio:1/1;
  background:#111;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 0 15px rgba(0,255,255,.1);
  cursor:pointer;
  transition:.2s;
}

.inventory-item:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(0,255,255,.4);
}

.hidden{
  display:none;
}

.hub-btn.secondary{
  background:#111;
  color:#fff;
}


.hub-gold{
  font-weight:700;
  margin-bottom:10px;
  color:#ffd700;
}


.equip-section{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}


.equip-slot{
  flex:1;
  background:#111;
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,255,.1);
}


.hub-label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
}

.hub-value{
  font-weight:700;
  opacity:1;
}



.inventory-item{
  position:relative;
}

.sell-icon{
  position:absolute;
  top:4px;
  right:4px;
  font-size:12px;
  background:#ff0033;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.sell-icon:hover{
  transform:scale(1.2);
}



/* ===== CHARACTER CARD ===== */

.character-card{
  position:relative;
  width:100%;
  max-width:340px;
  margin:0 auto 20px;
  border-radius:24px;
  overflow:hidden;

  aspect-ratio: 3/4;   /* 👈 đổi sang 3:4 thay vì 9:16 */
}

.character-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center 15%;
  background-repeat:no-repeat;
  transform:scale(1.15);
}



/* Badge chung */
.char-badge{
  position:absolute;
  padding:6px 10px;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
  box-shadow:0 0 10px rgba(0,255,255,.5);
}

/* Vị trí */
.hp-badge{ top:12px; left:12px; }
.lv-badge{ top:12px; right:12px; }
.atk-badge{ bottom:12px; left:12px; }
.def-badge{ bottom:12px; right:12px; }



.inventory-equip{
  margin-bottom:20px;
}

.equip-title{
  font-weight:800;
  margin-bottom:10px;
  color:#00f0ff;
}

.equip-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.equip-slot{
  background:#0f1620;
  border-radius:16px;
  padding:12px;
  text-align:center;
  font-size:13px;
  box-shadow:0 0 15px rgba(0,255,255,.15);
  cursor:pointer;
  transition:.2s;
}

.equip-slot:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(0,255,255,.4);
}



.inventory-stats{
  margin-bottom:20px;
}

.stats-title{
  font-weight:800;
  color:#00f0ff;
  margin-bottom:10px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat-card{
  background:#0f1620;
  border-radius:14px;
  padding:12px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,255,255,.15);
}

.stat-num{
  font-size:18px;
  font-weight:800;
  margin-bottom:4px;
}


.stats-simple{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:20px;
}

.stat-row{
  background:#0f1620;
  padding:12px 14px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  font-weight:600;
  box-shadow:0 0 12px rgba(0,255,255,.15);
}

.stat-row span{
  font-weight:800;
  color:#00ffcc;
}


/* ===== HEADER FIXED CENTER ===== */

.game-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:linear-gradient(90deg,#050b12,#0b1a22);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  z-index:1;

  box-shadow:
    0 0 25px rgba(0,255,255,.2),
    inset 0 -1px 0 rgba(0,255,255,.2);
}

/* TITLE CĂN GIỮA TUYỆT ĐỐI */
.header-title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-weight:800;
  font-size:16px;
  color:#00f0ff;
  letter-spacing:1px;
  pointer-events:none; /* không chặn click */
}

/* Left & Right giữ nguyên */
.header-btn{
  background:none;
  border:none;
  color:#00f0ff;
  font-size:22px;
  cursor:pointer;
  z-index:2;
}

.header-gold{
  font-weight:700;
  color:#ffd700;
  background:rgba(0,0,0,.4);
  padding:6px 12px;
  border-radius:20px;
  box-shadow:0 0 15px rgba(255,215,0,.4);
  z-index:2;
}


.screen{
  display:none;
  padding:80px 20px 20px; /* thêm top padding */
}



</style>
</head>

<script>

let regenInterval = null;
let selectedClass=null;
let player=null;

const CLASS_CONFIG = {
  warrior:{
    base:{ maxHp:800, atk:120, def:90 },
    dodge:5,
    critRate:10
  },
  assassin:{
    base:{ maxHp:500, atk:200, def:40 },
    dodge:15,
    critRate:25
  },
  mage:{
    base:{ maxHp:550, atk:170, def:60 },
    dodge:8,
    critRate:18
  }
};

function savePlayer(){
  if(!player) return;
  player.lastOnline = Date.now();
  localStorage.setItem("hunter_char",
    JSON.stringify(player));
}



/* ===== INIT ===== */
window.onload=function(){

  const saved=localStorage.getItem("hunter_char");
  if(saved){
  player=JSON.parse(saved);

  recalcStats();
  applyOfflineRegen();
  showHub();
  startRegen();
}

};



function selectClass(el, type){

  // Remove selected cũ
  document.querySelectorAll(".class-card")
    .forEach(c => c.classList.remove("selected"));

  el.classList.add("selected");
  selectedClass = type;

  const preview = document.getElementById("classPreview");
  if(preview) preview.classList.remove("hidden");

  const config = CLASS_CONFIG[type];
  if(!config) return;

  const nameMap = {
    warrior: "⚔ Chiến Binh",
    assassin: "🏹 Sát Thủ",
    mage: "🔮 Pháp Sư"
  };

  const hp  = config.base.maxHp;
  const atk = config.base.atk;
  const def = config.base.def;

  document.getElementById("previewName").innerText =
    nameMap[type] || type;

  document.getElementById("hpFill").style.width =
    (hp / 1000 * 100) + "%";

  document.getElementById("atkFill").style.width =
    (atk / 300 * 100) + "%";

  document.getElementById("defFill").style.width =
    (def / 150 * 100) + "%";
}



function createCharacter(){

  const name=document.getElementById("charName").value.trim();
  if(!name || !selectedClass)
    return alert("Nhập tên và chọn phái!");

  const config = CLASS_CONFIG[selectedClass];

  player = {
    classType:selectedClass,
    name,
    level:1,
    baseStats:config.base,
    maxHp:config.base.maxHp,
    hp:config.base.maxHp,
    atk:config.base.atk,
    def:config.base.def,
    dodge:config.dodge,
    critRate:config.critRate,
    critDamage:1.5,
    regen:0.5,
    exp:0,
    gold:500,
    inventory:[],
    equipment:{
      weapon:null, armor:null, helmet:null,
      gloves:null, boots:null, shoulder:null,
      legs:null, ring:null, gem:null
    }
  };

  savePlayer();
  showHub();
  startRegen();
}

function showHub(){

if(!player) return;

const headerGold = document.getElementById("headerGold");
if(headerGold && player){
  headerGold.innerText = player.gold;
}


const defaultEquip = {
  weapon:null, armor:null, helmet:null,
  gloves:null, boots:null, shoulder:null,
  legs:null, ring:null, gem:null
};

player.equipment = {

};


switchScreen("hubScreen");

  let avatarPath="";

  if(player.classType==="warrior")
    avatarPath="/assets/classes/warrior.jpg";

  if(player.classType==="assassin")
    avatarPath="/assets/classes/assassin.jpg";

    avatarPath="/assets/classes/mage.jpg";

  const avatarEl = document.getElementById("hubAvatar");
  if(avatarEl){

}


  // ===== OVERLAY STATS =====

  if(hpOverlay)

  if(lvOverlay)
    lvOverlay.innerText = player.level;

  const atkOverlay = document.getElementById("atkOverlay");
  if(atkOverlay)
    atkOverlay.innerText = player.atk;

  if(defOverlay)

const dodgeEl = document.getElementById("dodgeOverlay");
if(dodgeEl) dodgeEl.innerText = player.dodge;

const critEl = document.getElementById("critOverlay");
if(critEl) critEl.innerText = player.critRate;

Object.keys(player.equipment).forEach(slot=>{

function resetCharacter(){

  if(!confirm("Bạn chắc chắn muốn xóa nhân vật?"))
    return;

  // Dừng regen
  if(regenInterval) clearInterval(regenInterval);

  // Xóa player trong RAM
  player = null;

  // Xóa localStorage
  localStorage.removeItem("hunter_char");

  // Chuyển về màn tạo nhân vật
  switchScreen("createScreen");
}



function switchScreen(id){
  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}





let respawnInterval=null;

function startRespawnTimer(timeLeft){

  const btn = document.querySelector(".hub-btn.primary");
  if(!btn) return;


  btn.disabled = true;
  btn.innerText = "⏳ Đang hồi sinh...";

  if(respawnInterval) clearInterval(respawnInterval);

  respawnInterval = setInterval(()=>{

    const now = Date.now();
    const remaining = player.deadUntil - now;

    if(remaining <= 0){

      clearInterval(respawnInterval);

      // Hồi sinh
      player.deadUntil = null;
      player.hp = player.maxHp;

     savePlayer();


      btn.disabled = false;
      btn.innerText = "⚔ Vào chiến đấu";

      showHub();
      return;
    }

    const hours = Math.floor(remaining / (1000*60*60));
    const minutes = Math.floor((remaining % (1000*60*60))/(1000*60));
    const seconds = Math.floor((remaining % (1000*60))/1000);

    btn.innerText =
      `⏳ ${hours}h ${minutes}m ${seconds}s`;

  },1000);
}


function toggleInventory(){
  const panel=document.getElementById("inventoryPanel");
  panel.classList.toggle("hidden");
  renderInventory();
}



function renderInventory(){

   if(!player) return; 


   
  const grid = document.getElementById("inventoryGrid");
  grid.innerHTML = "";

  // ===== UPDATE GOLD =====
  const goldDisplay = document.getElementById("inventoryGold");
  if(goldDisplay){
    goldDisplay.innerText = player.gold;
  }

  const headerGold = document.getElementById("headerGold");
if(headerGold && player){
  headerGold.innerText = player.gold;
}


  // ===== UPDATE FINAL STATS =====
  const hpEl   = document.getElementById("invHpFinal");
  const atkEl  = document.getElementById("invAtkFinal");
  const defEl  = document.getElementById("invDefFinal");
  const dodgeEl= document.getElementById("invDodgeFinal");
  const critEl = document.getElementById("invCritFinal");
  const critDmgEl = document.getElementById("invCritDmgFinal");
  const regenEl = document.getElementById("invRegenFinal");


  if(hpEl)   hpEl.innerText   = player.hp + " / " + player.maxHp;
  if(atkEl)  atkEl.innerText  = player.atk;
  if(defEl)  defEl.innerText  = player.def;
  if(dodgeEl)dodgeEl.innerText= player.dodge + "%";
  if(critEl) critEl.innerText = player.critRate + "%";
  if(regenEl) regenEl.innerText = player.regen;
  if(critDmgEl) critDmgEl.innerText =
      (player.critDamage * 100) + "%";

  // ===== INVENTORY EMPTY =====
  if(!player.inventory || player.inventory.length===0){
    grid.innerHTML = "<div style='opacity:.6'>Trống</div>";
  }else{

    player.inventory.forEach((item,index)=>{

      const div = document.createElement("div");
      div.className = "inventory-item";

      const icon = document.createElement("div");
      icon.innerText = item.icon;
      icon.style.fontSize = "24px";
      div.appendChild(icon);

      const sell = document.createElement("div");
      sell.className = "sell-icon";
      sell.innerText = "🗑";
      sell.onclick = (e)=>{
        e.stopPropagation();
        sellItem(index);
      };
      div.appendChild(sell);

      div.onclick = ()=>equipItem(index);

      grid.appendChild(div);
    });
  }

  // ===== UPDATE EQUIPMENT SLOTS =====
  Object.keys(player.equipment).forEach(slot=>{
    const el = document.getElementById(slot + "Slot");
    if(el){
      el.innerText = player.equipment[slot]
        ? player.equipment[slot].name
        : "Trống";
    }
  });

}




function equipItem(index){

  const item = player.inventory[index];

  // 🧪 Nếu là potion thì dùng ngay
  if(item.type==="potion"){

    if(player.deadUntil && Date.now() < player.deadUntil){
      alert("Không thể dùng khi đang chết!");
      return;
    }

    if(player.hp >= player.maxHp){
      alert("HP đã đầy!");
      return;
    }

    player.hp += item.heal;

    if(player.hp > player.maxHp)
      player.hp = player.maxHp;

    alert("Hồi +" + item.heal + " HP");

    // Xóa potion sau khi dùng
    player.inventory.splice(index,1);

    savePlayer();


    renderInventory();
    showHub();
    return;
  }

  // 🔥 Trang bị bình thường
  if(item.type==="consumable"){
    alert("Không thể trang bị vật phẩm này");
    return;
  }

  const slot = item.type;

  if(player.equipment[slot]){
    player.inventory.push(player.equipment[slot]);
  }

  player.equipment[slot] = item;
  player.inventory.splice(index,1);

  recalcStats();

  savePlayer();


  renderInventory();
  showHub();
}




function unequipItem(slot){

  const item = player.equipment[slot];
  if(!item) return;

  // Trả đồ về kho
  player.inventory.push(item);

  // Xóa khỏi slot
  player.equipment[slot] = null;

  // Tính lại chỉ số
  recalcStats();

  // Lưu
  savePlayer();


  // Nếu đang mở inventory → cập nhật ngay
  renderInventory();

  // Cập nhật Hub overlay
  showHub();
}


function recalcStats(){

  const config = CLASS_CONFIG[player.classType];

  player.maxHp = config.base.maxHp;
  player.atk   = config.base.atk;
  player.def   = config.base.def;

  player.dodge = config.dodge;
  player.critRate = config.critRate;
  player.regen = 0.5;
  player.critDamage = 1.5;

  // Level bonus
  player.maxHp += player.level * 50;
  player.atk   += player.level * 10;
  player.def   += player.level * 8;

  // Equipment bonus
  Object.values(player.equipment).forEach(item=>{
    if(!item) return;
    if(item.atk) player.atk += item.atk;
    if(item.def) player.def += item.def;
    if(item.hp)  player.maxHp += item.hp;
    if(item.dodge) player.dodge += item.dodge;
    if(item.critRate) player.critRate += item.critRate;
    if(item.regen) player.regen += item.regen;
  });

  if(player.hp > player.maxHp)
    player.hp = player.maxHp;
}

function buyItem(item){

  if(player.gold < item.price){
    alert("Không đủ 💎");
    return;
  }

player.gold -= item.price;
player.inventory.push(item);

savePlayer();


renderShop();   // 👈 cập nhật tiền ngay
alert("Đã mua " + item.name);

}



let selectedShopItem = null;

function openShopItemModal(item){

  selectedShopItem = item;

  document.getElementById("shopItemModal")
    .classList.remove("hidden");

  document.getElementById("modalItemName")
    .innerText = item.name;

  document.getElementById("modalItemIcon")
    .innerText = item.icon;

  let stats = "";

  if(item.atk) stats += "⚔ ATK +" + item.atk + "<br>";
  if(item.def) stats += "🛡 DEF +" + item.def + "<br>";
  if(item.hp)  stats += "❤️ HP +" + item.hp + "<br>";
  if(item.heal) stats += "🧪 Hồi " + item.heal + " HP<br>";

  document.getElementById("modalItemStats")
    .innerHTML = stats || "Không có chỉ số";

  document.getElementById("modalItemPrice")
    .innerText = item.price;
}

function closeShopItemModal(){
  document.getElementById("shopItemModal")
    .classList.add("hidden");
  selectedShopItem = null;
}

function confirmBuyItem(){

  if(!selectedShopItem) return;

  if(player.gold < selectedShopItem.price){
    alert("Không đủ 💎");
    return;
  }

  player.gold -= selectedShopItem.price;
  player.inventory.push(selectedShopItem);

savePlayer();


  closeShopItemModal();
  renderShop();
}



function sellItem(index){

  const item = player.inventory[index];

  const sellPrice = Math.floor(item.price * 0.5);

  if(!confirm(`Bán ${item.name} với giá ${sellPrice} 💎 ?`))
    return;

  player.gold += sellPrice;

  player.inventory.splice(index,1);

  savePlayer();


  renderInventory();
  showHub();
}


function applyOfflineRegen(){

recalcStats();


  if(!player.lastOnline) return;

  const now = Date.now();
  const diffMs = now - player.lastOnline;

  const secondsOffline = Math.floor(diffMs / 1000);

  if(secondsOffline <= 0) return;

  // Không hồi khi chết
  if(player.deadUntil && now < player.deadUntil)
    return;

  const regenAmount = secondsOffline * player.regen;

  player.hp += regenAmount;

  if(player.hp > player.maxHp)
    player.hp = player.maxHp;

  player.hp = Math.floor(player.hp);

  console.log("Offline regen:", secondsOffline, "giây");

  savePlayer();

}




function startRegen(){

  if(regenInterval) clearInterval(regenInterval);

  regenInterval = setInterval(()=>{

    if(!player) return;

    // Không regen khi chết
    if(player.deadUntil && Date.now() < player.deadUntil)
      return;

    if(player.hp < player.maxHp){

      player.hp += player.regen;

      if(player.hp > player.maxHp)
        player.hp = player.maxHp;

      // Update UI thôi (không save mỗi tick)
      const hpOverlay =
        document.getElementById("hpOverlay");

      if(hpOverlay){
        hpOverlay.innerText =
          player.hp + "/" + player.maxHp;
      }

      const hpInv =
        document.getElementById("invHpFinal");

      if(hpInv){
        hpInv.innerText =
          player.hp + " / " + player.maxHp;
      }

      // Chỉ save khi full HP
      if(player.hp === player.maxHp){
        savePlayer();
      }
    }

  },1000);
}



window.addEventListener("beforeunload",()=>{
  if(player && localStorage.getItem("hunter_char")){
    player.lastOnline = Date.now();
    savePlayer();
  }
});



function goToCombat(){

  if(player.deadUntil && Date.now() < player.deadUntil){
    alert("⏳ Nhân vật chưa hồi sinh!");
    return;
  }

savePlayer();


  location.href = "combat.html";
}



function handleBack(){

  const inventory = document.getElementById("inventoryPanel");
  const shop = document.getElementById("shopPanel");
  const modal = document.getElementById("shopItemModal");

  if(!inventory.classList.contains("hidden")){
    toggleInventory();
    return;
  }

  if(!shop.classList.contains("hidden")){
    toggleShop();
    return;
  }

  if(!modal.classList.contains("hidden")){
    closeShopItemModal();
    return;
  }

  // Nếu đang ở hub → confirm
  if(document.getElementById("hubScreen").classList.contains("active")){
    if(confirm("Thoát game?")){
      location.href = "invest.html";
    }
    return;
  }

  // Nếu đang create → không back
}
