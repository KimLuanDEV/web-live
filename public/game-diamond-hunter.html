<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thợ săn kim cương</title>
<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  background:#000;
  font-family:system-ui;
  color:#fff;
}

/* ===== SCREEN ===== */
.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

/* ===== TITLE ===== */
.title{
  font-size:20px;
  font-weight:800;
  text-align:center;
  margin-bottom:20px;
  color:#00f0ff;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:20px;
  background:#111;
  color:#fff;
}

/* ===== CLASS SELECT ===== */
.class-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
}

@media (max-width: 768px){
  .class-grid{
    grid-template-columns:repeat(3, 1fr);
  }
}




.class-card.selected{
  box-shadow:0 0 30px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
  transform:scale(1.03);
}

.btn{
  margin-top:20px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  font-weight:700;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  cursor:pointer;
}

/* ===== HUB ===== */
.card{
  background:#0a0f15;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 0 25px rgba(0,255,255,.15);
}

.bar{
  height:10px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
}

.menu-btn{
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  width:100%;
}

/* ===== COMBAT ===== */
.enemy{
  box-shadow:0 0 25px rgba(255,0,60,.25);
}

.log{
  margin-top:10px;
  font-size:13px;
  opacity:.8;
}



.class-card{
  position:relative;
  height:160px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:flex-end;
  padding:12px;
  transition:.25s;
}

.class-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.1),
    rgba(0,0,0,.75)
  );
}



/* ẢNH NỀN */
.class-card.warrior{
  background-image:url('/assets/classes/warrior.jpg');
}

.class-card.assassin{
  background-image:url('/assets/classes/assassin.jpg');
}

.class-card.mage{
  background-image:url('/assets/classes/mage.jpg');
}

/* Hover */
.class-card:hover{
  transform:scale(1.02);
}

/* Selected */
.class-card.selected{
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
}


.class-preview{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg,#0b1118,#060a0f);
  box-shadow:0 0 40px rgba(0,255,255,.15);
  animation:fadeUp .3s ease;
}

.hidden{
  display:none;
}

.preview-title{
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
  color:#00f0ff;
  text-align:center;
}

.preview-bar{
  margin-bottom:12px;
  font-size:14px;
}

.preview-bar .bar{
  height:8px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.preview-bar .fill{
  height:100%;
  width:0%;
  transition:.4s;
  border-radius:10px;
}

.preview-stat{
  font-size:14px;
  margin-bottom:6px;
  opacity:.9;
}

@keyframes fadeUp{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}



/* ===== HUB DESIGN ===== */

.hub-header{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin-bottom:20px;
  color:#00f0ff;
  text-shadow:0 0 15px rgba(0,255,255,.6);
}

.hub-card{
  background:linear-gradient(145deg,#0b1118,#060a0f);
  border-radius:24px;
  padding:25px 20px;
  text-align:center;
  box-shadow:
    0 0 40px rgba(0,255,255,.15),
    inset 0 0 30px rgba(0,255,255,.05);
  margin-bottom:20px;
}

.hub-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 15px;
  background:radial-gradient(circle,#00f0ff,#001a1f);
  box-shadow:0 0 25px rgba(0,255,255,.6);
}

.hub-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.hub-hp{
  height:12px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.hub-hp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  transition:.4s;
  border-radius:20px;
}

.hub-stats{
  font-size:14px;
  opacity:.85;
  margin-bottom:10px;
}

.hub-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.hub-btn{
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

.hub-btn.primary{
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  color:#000;
}

.hub-btn.danger{
  background:linear-gradient(90deg,#ff0044,#ff5500);
  color:#fff;
}

.hub-btn:hover{
  transform:scale(1.03);
}

.hub-avatar-img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 15px;
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:2px solid #00f0ff;
}

.hub-label{
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
  text-align:left;
}

.hub-exp{
  height:10px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.hub-exp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  transition:.4s;
  border-radius:20px;
}

.hub-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:10px;
}

.stat-box{
  background:#0f1620;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,255,255,.1);
}

.stat-value{
  font-size:18px;
  font-weight:800;
}

.stat-label{
  font-size:12px;
  opacity:.6;
}



.inventory{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.inventory-box{
  width:90%;
  max-width:500px;
  background:#0b1118;
  border-radius:24px;
  padding:20px;
  box-shadow:0 0 40px rgba(0,255,255,.3);
}

.inventory-header{
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
}

.close-btn{
  cursor:pointer;
  opacity:.7;
}

.inventory-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.inventory-item{
  aspect-ratio:1/1;
  background:#111;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  box-shadow:0 0 15px rgba(0,255,255,.1);
  cursor:pointer;
  transition:.2s;
}

.inventory-item:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(0,255,255,.4);
}

.hidden{
  display:none;
}

.hub-btn.secondary{
  background:#111;
  color:#fff;
}


.hub-gold{
  font-weight:700;
  margin-bottom:10px;
  color:#ffd700;
}


.equip-section{
  display:flex;
  gap:12px;
  margin-top:15px;
}

.equip-slot{
  flex:1;
  background:#111;
  padding:10px;
  border-radius:12px;
  text-align:center;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,255,.1);
}


.hub-label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
}

.hub-value{
  font-weight:700;
  opacity:1;
}



.inventory-item{
  position:relative;
}

.sell-icon{
  position:absolute;
  top:4px;
  right:4px;
  font-size:12px;
  background:#ff0033;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.sell-icon:hover{
  transform:scale(1.2);
}



/* ===== CHARACTER CARD ===== */

.character-card{
  position:relative;
  width:100%;
  max-width:320px;
  margin:0 auto 20px;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,255,255,.3);
}

.character-img{
  width:100%;
  height:400px;
  object-fit:cover;
  display:block;
}

/* Badge chung */
.char-badge{
  position:absolute;
  padding:6px 10px;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
  box-shadow:0 0 10px rgba(0,255,255,.5);
}

/* Vị trí */
.hp-badge{ top:12px; left:12px; }
.lv-badge{ top:12px; right:12px; }
.atk-badge{ bottom:12px; left:12px; }
.def-badge{ bottom:12px; right:12px; }


</style>
</head>
<body>

<!-- ================= CREATE CHARACTER ================= -->
<div id="createScreen" class="screen active">

  <div class="title">✨ Tạo nhân vật</div>

  <input id="charName" placeholder="Nhập tên nhân vật">

<div class="class-grid">

  <div class="class-card warrior"
       onclick="selectClass(this,'warrior')">
  </div>

  <div class="class-card assassin"
       onclick="selectClass(this,'assassin')">
  </div>

  <div class="class-card mage"
       onclick="selectClass(this,'mage')">
  </div>

</div>

<!-- CLASS PREVIEW -->
<div id="classPreview" class="class-preview hidden">

  <div class="preview-title" id="previewName"></div>

  <div class="preview-bar">
    <span>❤️ HP</span>
    <div class="bar">
      <div class="fill" id="hpFill"></div>
    </div>
  </div>

  <div class="preview-bar">
    <span>⚔ ATK</span>
    <div class="bar">
      <div class="fill" id="atkFill"></div>
    </div>
  </div>

  <div class="preview-bar">
    <span>🛡 DEF</span>
    <div class="bar">
      <div class="fill" id="defFill"></div>
    </div>
  </div>

</div>


  <button class="btn" onclick="createCharacter()">Tạo nhân vật</button>
</div>


<!-- ================= HUB ================= -->
<div id="hubScreen" class="screen">

  <div class="hub-header">
    🏕 Thông tin nhân vật
  </div>

<div class="hub-card">

<div class="character-card">

  <img id="hubAvatar" class="character-img">

  <!-- TOP LEFT -->
  <div class="char-badge hp-badge">
    ❤️ <span id="hpOverlay"></span>
  </div>

  <!-- TOP RIGHT -->
  <div class="char-badge lv-badge">
    ⭐ LV <span id="lvOverlay"></span>
  </div>

  <!-- BOTTOM LEFT -->
  <div class="char-badge atk-badge">
    ⚔ <span id="atkOverlay"></span>
  </div>

  <!-- BOTTOM RIGHT -->
  <div class="char-badge def-badge">
    🛡 <span id="defOverlay"></span>
  </div>

</div>

<div class="hub-name" id="infoName"></div>

<div class="hub-gold">
  💎 <span id="goldStat"></span>
</div>



<div class="equip-section">

  <div class="equip-slot" onclick="unequipItem('weapon')">
    ⚔ <span id="weaponSlot">Trống</span>
  </div>

  <div class="equip-slot" onclick="unequipItem('armor')">
    🛡 <span id="armorSlot">Trống</span>
  </div>

</div>


</div>





  <div class="hub-actions">

    <button class="hub-btn secondary" onclick="toggleInventory()">
  🎒 Kho đồ
</button>

<button class="hub-btn secondary" onclick="toggleShop()">
  🛒 Shop
</button>




    <button class="hub-btn primary" onclick="openCombat()">
      ⚔ Vào chiến đấu
    </button>

    <button class="hub-btn danger" onclick="resetCharacter()">
      🗑 Xóa nhân vật
    </button>
  </div>

</div>


<!-- ================= COMBAT ================= -->
<div id="combatScreen" class="screen">

  <div class="title">⚔ Chiến đấu</div>

  <div class="card">
    <div id="playerCombatStats"></div>
  </div>

  <div class="card enemy">
    <div id="enemyStats"></div>
  </div>

  <button class="btn" onclick="attack()">Tấn công</button>
  <button class="menu-btn" onclick="backToHub()">⬅ Quay lại</button>

  <div class="log" id="battleLog"></div>

</div>






<!-- ================= INVENTORY ================= -->
<div id="inventoryPanel" class="inventory hidden">

  <div class="inventory-box">

    <div class="inventory-header">
      🎒 Kho đồ cá nhân
      <span class="close-btn" onclick="toggleInventory()">✕</span>
    </div>

    <div class="inventory-grid" id="inventoryGrid">
      <!-- Items render ở đây -->
    </div>
  </div>
</div>



<!-- ================= SHOP ================= -->
<div id="shopPanel" class="inventory hidden">

  <div class="inventory-box">

    <div class="inventory-header">
      🛒 Shop Trang Bị
      <span class="close-btn" onclick="toggleShop()">✕</span>
    </div>

    <div class="inventory-grid" id="shopGrid">
    </div>

  </div>
</div>




<script>

    let selectedClass=null;
let player=null;
let enemy=null;

/* ===== INIT ===== */
window.onload=function(){
  const saved=localStorage.getItem("hunter_char");
  if(saved){
    player=JSON.parse(saved);
    showHub();
  }
};

function selectClass(el,type){

  document.querySelectorAll(".class-card")
    .forEach(c=>c.classList.remove("selected"));

  el.classList.add("selected");
  selectedClass=type;

  const preview = document.getElementById("classPreview");
  preview.classList.remove("hidden");

  let hp=0, atk=0, def=0, name="";

  if(type==="warrior"){
    name="⚔ Chiến Binh";
    hp=800; atk=120; def=90;
  }

  if(type==="assassin"){
    name="🏹 Sát Thủ";
    hp=500; atk=200; def=40;
  }

  if(type==="mage"){
    name="🔮 Pháp Sư";
    hp=550; atk=170; def=60;
  }

  document.getElementById("previewName").innerText=name;

  document.getElementById("hpFill").style.width=(hp/1000*100)+"%";
  document.getElementById("atkFill").style.width=(atk/300*100)+"%";
  document.getElementById("defFill").style.width=(def/150*100)+"%";
}



function createCharacter(){

  const name=document.getElementById("charName").value.trim();
  if(!name || !selectedClass) return alert("Nhập tên và chọn phái!");

  if(selectedClass==="warrior"){
player={
  classType:"warrior",
  name,
  level:1,
  baseStats:{
    maxHp:800,
    atk:120,
    def:90
  },
  maxHp:800,
  hp:800,
  atk:120,
  def:90,
  exp:0,
  gold:500,
  inventory:[],
  equipment:{
    weapon:null,
    armor:null
  }
};

  }

  if(selectedClass==="assassin"){
    player={
  classType:"assassin",
  name,
  level:1,
  baseStats:{
  maxHp:500,
  atk:200,
  def:40
},
  maxHp:500,
  hp:500,
  atk:200,
  def:40,
  exp:0,
  gold:500,
  inventory:[],
  equipment:{
  weapon:null,
  armor:null
}
};
  }

  if(selectedClass==="mage"){
player={
  classType:"mage",
  name,
  level:1,
  baseStats:{
  maxHp:550,
  atk:170,
  def:60
},
  maxHp:550,
  hp:550,
  atk:170,
  def:60,
  exp:0,
  gold:500,
  inventory:[],
  equipment:{
  weapon:null,
  armor:null
}
};
  }

  localStorage.setItem("hunter_char",JSON.stringify(player));
  showHub();
}

function showHub(){
  switchScreen("hubScreen");

  document.getElementById("infoName").innerText =
    player.name;

  // Avatar theo class
let avatarPath="";

if(player.classType==="warrior")
  avatarPath="/assets/classes/warrior.jpg";

if(player.classType==="assassin")
  avatarPath="/assets/classes/assassin.jpg";

if(player.classType==="mage")
  avatarPath="/assets/classes/mage.jpg";

document.getElementById("hubAvatar").src=avatarPath;


  // HP bar
  document.getElementById("hpBar").style.width =
    (player.hp/player.maxHp*100)+"%";

  // EXP bar
  document.getElementById("expBar").style.width =
    (player.exp/(player.level*200)*100)+"%";


    // HP text
document.getElementById("hpText").innerText =
  player.hp + " / " + player.maxHp;

// EXP text
const expNeed = player.level * 200;
document.getElementById("expText").innerText =
  player.exp + " / " + expNeed;


  // Stats


document.getElementById("hpOverlay").innerText =
  player.hp + "/" + player.maxHp;

document.getElementById("lvOverlay").innerText =
  player.level;

document.getElementById("atkOverlay").innerText =
  player.atk;

document.getElementById("defOverlay").innerText =
  player.def;




  document.getElementById("goldStat").innerText=player.gold;


// Nếu đang chết
if(player.deadUntil && Date.now() < player.deadUntil){

  const remaining = player.deadUntil - Date.now();
  startRespawnTimer(remaining);

}

document.getElementById("weaponSlot").innerText =
  player.equipment.weapon ? player.equipment.weapon.name : "Trống";

document.getElementById("armorSlot").innerText =
  player.equipment.armor ? player.equipment.armor.name : "Trống";






}


function openCombat(){

  // Nếu đang chết
  if(player.deadUntil && Date.now() < player.deadUntil){
    alert("⏳ Nhân vật chưa hồi sinh!");
    return;
  }

  enemy={
    maxHp:600+player.level*150,
    hp:600+player.level*150,
    atk:100+player.level*20,
    def:50+player.level*10
  };

  switchScreen("combatScreen");
  renderCombat();
}




function renderCombat(){
  document.getElementById("playerCombatStats").innerText=
    player.name+" | HP "+player.hp+"/"+player.maxHp;
  document.getElementById("enemyStats").innerText=
    "Quái | HP "+enemy.hp+"/"+enemy.maxHp;
}

function attack(){

  let dmgToEnemy=Math.max(0,player.atk-enemy.def*0.5);
  dmgToEnemy=Math.floor(dmgToEnemy);
  enemy.hp-=dmgToEnemy;

  if(enemy.hp<=0){
    enemy.hp=0;
    player.exp+=100;
    levelUp();
    document.getElementById("battleLog").innerText=
      "🎉 Hạ quái! +100 EXP";
    localStorage.setItem("hunter_char",JSON.stringify(player));
    return;
  }

  let dmgToPlayer=Math.max(0,enemy.atk-player.def*0.4);
  dmgToPlayer=Math.floor(dmgToPlayer);
  player.hp-=dmgToPlayer;

if(player.hp<=0){
  player.hp=0;

  // Ghi thời gian chết
  player.deadUntil = Date.now() + (24*60*60*1000);

  localStorage.setItem("hunter_char",JSON.stringify(player));

  document.getElementById("battleLog").innerText=
    "💀 Bạn đã bị hạ! Hồi sinh sau 24 giờ.";

  setTimeout(()=>{
    backToHub();
  },1500);

  return;
}


  renderCombat();
}

function levelUp(){

  if(player.exp >= player.level * 200){

    player.level++;
    player.exp = 0;

    recalcStats();

    player.hp = player.maxHp;
  }
}


function backToHub(){
  localStorage.setItem("hunter_char",JSON.stringify(player));
  showHub();
}

function resetCharacter(){
  localStorage.removeItem("hunter_char");
  location.reload();
}

function switchScreen(id){
  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}





let respawnInterval=null;

function startRespawnTimer(timeLeft){

  const btn = document.querySelector(".hub-btn.primary");
  btn.disabled = true;
  btn.innerText = "⏳ Đang hồi sinh...";

  if(respawnInterval) clearInterval(respawnInterval);

  respawnInterval = setInterval(()=>{

    const now = Date.now();
    const remaining = player.deadUntil - now;

    if(remaining <= 0){

      clearInterval(respawnInterval);

      // Hồi sinh
      player.deadUntil = null;
      player.hp = player.maxHp;

      localStorage.setItem("hunter_char",JSON.stringify(player));

      btn.disabled = false;
      btn.innerText = "⚔ Vào chiến đấu";

      showHub();
      return;
    }

    const hours = Math.floor(remaining / (1000*60*60));
    const minutes = Math.floor((remaining % (1000*60*60))/(1000*60));
    const seconds = Math.floor((remaining % (1000*60))/1000);

    btn.innerText =
      `⏳ ${hours}h ${minutes}m ${seconds}s`;

  },1000);
}


function toggleInventory(){
  const panel=document.getElementById("inventoryPanel");
  panel.classList.toggle("hidden");
  renderInventory();
}



function renderInventory(){

  const grid = document.getElementById("inventoryGrid");
  grid.innerHTML="";

  if(!player.inventory || player.inventory.length===0){
    grid.innerHTML="<div style='opacity:.6'>Trống</div>";
    return;
  }

  player.inventory.forEach((item,index)=>{

    const div=document.createElement("div");
    div.className="inventory-item";

    // Icon item
    const icon=document.createElement("div");
    icon.innerText=item.icon;
    icon.style.fontSize="24px";
    div.appendChild(icon);

    // Sell icon
    const sell=document.createElement("div");
    sell.className="sell-icon";
    sell.innerText="🗑";
    sell.onclick=(e)=>{
      e.stopPropagation(); // không trigger equip
      sellItem(index);
    };
    div.appendChild(sell);

    // Click item = equip
    div.onclick=()=>equipItem(index);

    grid.appendChild(div);
  });
}



function equipItem(index){

  const item = player.inventory[index];

  // 🧪 Nếu là potion thì dùng ngay
  if(item.type==="potion"){

    if(player.deadUntil && Date.now() < player.deadUntil){
      alert("Không thể dùng khi đang chết!");
      return;
    }

    if(player.hp >= player.maxHp){
      alert("HP đã đầy!");
      return;
    }

    player.hp += item.heal;

    if(player.hp > player.maxHp)
      player.hp = player.maxHp;

    alert("Hồi +" + item.heal + " HP");

    // Xóa potion sau khi dùng
    player.inventory.splice(index,1);

    localStorage.setItem("hunter_char",JSON.stringify(player));

    renderInventory();
    showHub();
    return;
  }

  // 🔥 Trang bị bình thường
  if(item.type==="consumable"){
    alert("Không thể trang bị vật phẩm này");
    return;
  }

  const slot = item.type;

  if(player.equipment[slot]){
    player.inventory.push(player.equipment[slot]);
  }

  player.equipment[slot] = item;
  player.inventory.splice(index,1);

  recalcStats();

  localStorage.setItem("hunter_char",JSON.stringify(player));

  renderInventory();
  showHub();
}




function unequipItem(slot){

  const item = player.equipment[slot];
  if(!item) return;

  player.inventory.push(item);
  player.equipment[slot]=null;

  recalcStats();

  localStorage.setItem("hunter_char",JSON.stringify(player));

  showHub();
}


function recalcStats(){

  // Reset về base stats
  player.maxHp = player.baseStats.maxHp;
  player.atk   = player.baseStats.atk;
  player.def   = player.baseStats.def;

  // Cộng level bonus
  player.maxHp += player.level * 50;
  player.atk   += player.level * 10;
  player.def   += player.level * 8;

  // Cộng equipment bonus
  const weapon = player.equipment.weapon;
  const armor  = player.equipment.armor;

  [weapon,armor].forEach(item=>{
    if(!item) return;
    if(item.atk) player.atk += item.atk;
    if(item.def) player.def += item.def;
    if(item.hp)  player.maxHp += item.hp;
  });

  // Giữ HP không vượt max
  if(player.hp > player.maxHp)
    player.hp = player.maxHp;
}



const shopItems = [
{ id:1, icon:"🗡", name:"Kiếm thép", price:200, atk:30, type:"weapon" },
{ id:2, icon:"🛡", name:"Khiên bạc", price:180, def:25, type:"armor" },
{ id:3, icon:"💎", name:"Đá tăng lực", price:150, hp:200, type:"consumable" },

// 🧪 Potion nhỏ
{ id:4, icon:"🧪", name:"Bình máu nhỏ", price:80, heal:150, type:"potion" },

// 🔥 Potion lớn
{ id:5, icon:"🧪", name:"Bình máu lớn", price:220, heal:500, type:"potion" }
];



function toggleShop(){
  const panel=document.getElementById("shopPanel");
  panel.classList.toggle("hidden");
  renderShop();
}

function renderShop(){
  const grid=document.getElementById("shopGrid");
  grid.innerHTML="";

  shopItems.forEach(item=>{
    const div=document.createElement("div");
    div.className="inventory-item";
    div.innerHTML=`
      <div style="font-size:22px">${item.icon}</div>
      <div style="font-size:11px">${item.price} 💎</div>
    `;
    div.onclick=()=>buyItem(item);
    grid.appendChild(div);
  });
}

function buyItem(item){

  if(player.gold < item.price){
    alert("Không đủ 💎");
    return;
  }

  player.gold -= item.price;
  player.inventory.push(item);

  localStorage.setItem("hunter_char",JSON.stringify(player));

  alert("Đã mua "+item.name);
  showHub();
}



function sellItem(index){

  const item = player.inventory[index];

  const sellPrice = Math.floor(item.price * 0.5);

  if(!confirm(`Bán ${item.name} với giá ${sellPrice} 💎 ?`))
    return;

  player.gold += sellPrice;

  player.inventory.splice(index,1);

  localStorage.setItem("hunter_char",JSON.stringify(player));

  renderInventory();
  showHub();
}



</script>
