<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thợ săn kim cương</title>
<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  background:#000;
  font-family:system-ui;
  color:#fff;
}

/* ===== SCREEN ===== */
.screen{
  display:none;
  padding:20px;
}

.screen.active{
  display:block;
}

/* ===== TITLE ===== */
.title{
  font-size:20px;
  font-weight:800;
  text-align:center;
  margin-bottom:20px;
  color:#00f0ff;
}

/* ===== INPUT ===== */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-bottom:20px;
  background:#111;
  color:#fff;
}

/* ===== CLASS SELECT ===== */
.class-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
}

@media (max-width: 768px){
  .class-grid{
    grid-template-columns:repeat(3, 1fr);
  }
}




.class-card.selected{
  box-shadow:0 0 30px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
  transform:scale(1.03);
}

.btn{
  margin-top:20px;
  padding:14px;
  width:100%;
  border:none;
  border-radius:14px;
  font-weight:700;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  cursor:pointer;
}

/* ===== HUB ===== */
.card{
  background:#0a0f15;
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 0 25px rgba(0,255,255,.15);
}

.bar{
  height:10px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:10px;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
}

.menu-btn{
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  background:#111;
  color:#fff;
  width:100%;
}




.class-card{
  position:relative;
  height:160px;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:flex-end;
  padding:12px;
  transition:.25s;
}

.class-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.1),
    rgba(0,0,0,.75)
  );
}



/* ẢNH NỀN */
.class-card.warrior{
  background-image:url('/assets/classes/warrior.jpg');
}

.class-card.assassin{
  background-image:url('/assets/classes/assassin.jpg');
}

.class-card.mage{
  background-image:url('/assets/classes/mage.jpg');
}

/* Hover */
.class-card:hover{
  transform:scale(1.02);
}

/* Selected */
.class-card.selected{
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:1px solid #00f0ff;
}


.class-preview{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:linear-gradient(145deg,#0b1118,#060a0f);
  box-shadow:0 0 40px rgba(0,255,255,.15);
  animation:fadeUp .3s ease;
}

.hidden{
  display:none;
}

.preview-title{
  font-weight:800;
  font-size:18px;
  margin-bottom:15px;
  color:#00f0ff;
  text-align:center;
}

.preview-bar{
  margin-bottom:12px;
  font-size:14px;
}

.preview-bar .bar{
  height:8px;
  background:#111;
  border-radius:10px;
  overflow:hidden;
  margin-top:5px;
}

.preview-bar .fill{
  height:100%;
  width:0%;
  transition:.4s;
  border-radius:10px;
}

.preview-stat{
  font-size:14px;
  margin-bottom:6px;
  opacity:.9;
}

@keyframes fadeUp{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}



/* ===== HUB DESIGN ===== */



.hub-card{
  background:linear-gradient(145deg,#0b1118,#060a0f);
  border-radius:24px;
  padding:25px 20px;
  text-align:center;
  box-shadow:
    0 0 40px rgba(0,255,255,.15),
    inset 0 0 30px rgba(0,255,255,.05);
  margin-bottom:20px;
}

.hub-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 15px;
  background:radial-gradient(circle,#00f0ff,#001a1f);
  box-shadow:0 0 25px rgba(0,255,255,.6);
}

.hub-name{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.hub-hp{
  height:12px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:15px;
}

.hub-hp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  transition:.4s;
  border-radius:20px;
}

.hub-stats{
  font-size:14px;
  opacity:.85;
  margin-bottom:10px;
}

.hub-actions{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.hub-btn{
  padding:14px;
  border:none;
  border-radius:16px;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
  transition:.2s;
}

.hub-btn.primary{
  background:linear-gradient(90deg,#00f0ff,#00ff99);
  color:#000;
}

.hub-btn.danger{
  background:linear-gradient(90deg,#ff0044,#ff5500);
  color:#fff;
}

.hub-btn:hover{
  transform:scale(1.03);
}

.hub-avatar-img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  margin:0 auto 15px;
  box-shadow:0 0 25px rgba(0,255,255,.6);
  border:2px solid #00f0ff;
}

.hub-label{
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
  text-align:left;
}

.hub-exp{
  height:10px;
  background:#111;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.hub-exp-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  transition:.4s;
  border-radius:20px;
}

.hub-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:10px;
}

.stat-box{
  background:#0f1620;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,255,255,.1);
}

.stat-value{
  font-size:18px;
  font-weight:800;
}

.stat-label{
  font-size:12px;
  opacity:.6;
}



.inventory{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  z-index:999;
}

.inventory-box{
  flex:1;
  width:100%;
  background:linear-gradient(145deg,#0b1118,#060a0f);
  padding:20px;
  overflow-y:auto;
  border-radius:0;
}


/* ===== INVENTORY HEADER CLEAN ===== */

/* ===== INVENTORY HEADER PRO ===== */

.inventory-header-pro{
  position:relative;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  border-radius:18px;
  background:
    linear-gradient(145deg,#0c1824,#060b12);
  box-shadow:
    0 0 30px rgba(0,255,255,.2),
    inset 0 0 25px rgba(0,255,255,.05);
  margin-bottom:20px;
}

.inv-title-pro{
  font-size:18px;
  font-weight:800;
  color:#00f0ff;
  letter-spacing:.5px;
  text-shadow:0 0 12px rgba(0,255,255,.6);
}

.inv-right-pro{
  display:flex;
  align-items:center;
  gap:12px;
}

.inv-gold-pro{
  padding:6px 14px;
  border-radius:20px;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  font-weight:800;
  color:#000;
  box-shadow:0 0 18px rgba(255,215,0,.6);
}

.inv-close-pro{
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  font-size:16px;
  font-weight:800;
  background:linear-gradient(135deg,#ff0044,#ff5500);
  color:#fff;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 0 20px rgba(255,0,80,.5);
}

.inv-close-pro:hover{
  transform:scale(1.1);
}


.close-btn{
  cursor:pointer;
  opacity:.7;
}

.inventory-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.inventory-item{
  position:relative;
  aspect-ratio:1/1;
  background:radial-gradient(circle at top,#111,#050b12);
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  box-shadow:0 0 15px rgba(0,255,255,.1);
  cursor:pointer;
  transition:.25s;
}

.inventory-item:hover{
  transform:scale(1.05);
  box-shadow:
    0 0 25px rgba(0,255,255,.5),
    0 0 50px rgba(0,255,255,.4);
}

.inv-img{
  width:90%;
  height:90%;
  object-fit:contain;
  filter:drop-shadow(0 0 15px rgba(0,255,255,.6));
}

/* Enhance level badge */
.enhance-badge{
  position:absolute;
  bottom:6px;
  left:6px;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  color:#000;
  font-size:11px;
  font-weight:800;
  padding:2px 6px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(255,215,0,.6);
}


.hidden{
  display:none;
}

.hub-btn.secondary{
  background:#111;
  color:#fff;
}


.hub-gold{
  font-weight:700;
  margin-bottom:10px;
  color:#ffd700;
}


.equip-section{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}



.hub-label{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  opacity:.7;
  margin-bottom:4px;
}

.hub-value{
  font-weight:700;
  opacity:1;
}



.inventory-item{
  position:relative;
}

.sell-icon{
  position:absolute;
  top:4px;
  right:4px;
  font-size:12px;
  background:#ff0033;
  width:18px;
  height:18px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.2s;
}

.sell-icon:hover{
  transform:scale(1.2);
}



/* ===== CHARACTER CARD ===== */

.character-card{
  position:relative;
  width:100%;
  max-width:340px;
  margin:0 auto 20px;
  border-radius:24px;
  overflow:hidden;

  aspect-ratio: 3/4;   /* 👈 đổi sang 3:4 thay vì 9:16 */
}

.character-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center 15%;
  background-repeat:no-repeat;
  transform:scale(1.15);
}



/* Badge chung */
.char-badge{
  position:absolute;
  padding:6px 10px;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);
  box-shadow:0 0 10px rgba(0,255,255,.5);
}

/* Vị trí */
.hp-badge{ top:12px; left:12px; }
.lv-badge{ top:12px; right:12px; }
.atk-badge{ bottom:12px; left:12px; }
.def-badge{ bottom:12px; right:12px; }



.inventory-equip{
  margin-bottom:20px;
}

.equip-title{
  font-weight:800;
  margin-bottom:10px;
  color:#00f0ff;
}





.inventory-stats{
  margin-bottom:20px;
}

.stats-title{
  font-weight:800;
  color:#00f0ff;
  margin-bottom:10px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat-card{
  background:#0f1620;
  border-radius:14px;
  padding:12px;
  text-align:center;
  box-shadow:0 0 15px rgba(0,255,255,.15);
}

.stat-num{
  font-size:18px;
  font-weight:800;
  margin-bottom:4px;
}

/* ===== CLEAN STATS GRID ===== */

.stats-grid-clean{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat-row{
  background:linear-gradient(145deg,#0b1118,#060a0f);
  border-radius:14px;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:600;
  box-shadow:
    0 0 15px rgba(0,255,255,.1),
    inset 0 0 10px rgba(0,255,255,.05);
}

.stat-row span{
  font-weight:800;
  color:#00ffcc;
}



/* ===== HEADER PERFECT CENTER ===== */

.game-header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:60px;
  background:linear-gradient(90deg,#050b12,#0b1a22);

  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;

  padding:0;

  z-index:1;

  box-shadow:
    0 0 25px rgba(0,255,255,.2),
    inset 0 -1px 0 rgba(0,255,255,.2);
}

/* LEFT */
.header-btn{
  justify-self:start;
  background:none;
  border:none;
  color:#00f0ff;
  font-size:22px;
  cursor:pointer;
}


/* CENTER */
.header-title{
  justify-self:center;
  font-weight:800;
  font-size:16px;
  color:#00f0ff;
  letter-spacing:1px;
}

/* RIGHT */
.header-right{
  justify-self:end;
  padding-right:15px;  /* giữ gold không sát mép */
}


.header-gold{
  font-weight:700;
  color:#ffd700;
  background:rgba(0,0,0,.4);
  padding:6px 12px;
  border-radius:20px;
  box-shadow:0 0 15px rgba(255,215,0,.4);
}


.screen{
  display:none;
  padding:80px 20px 20px; /* thêm top padding */
}



/* ===== SHOP CARD CLEAN PRO ===== */

.shop-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  transition:.25s;
  cursor:pointer;
}

/* ===== IMAGE FULL ===== */
.shop-img-wrap{
  width:100%;
  aspect-ratio:1/1;
  background:radial-gradient(circle at top,#111,#050b12);
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:1px solid rgba(0,255,255,.2);
  box-shadow:0 0 25px rgba(0,255,255,.15);
  transition:.3s;
}

.shop-item:hover .shop-img-wrap{
  transform:scale(1.05);
  box-shadow:
    0 10px 30px rgba(0,255,255,.4),
    0 0 40px rgba(0,255,255,.5);
}

.shop-img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 0 20px rgba(0,255,255,.6));
}

/* ===== INFO BELOW IMAGE ===== */
.shop-info{
  margin-top:10px;
  text-align:center;
}

.shop-name{
  font-size:14px;
  font-weight:700;
  color:#fff;
  margin-bottom:4px;
}

.shop-price{
  display:inline-block;
  padding:4px 12px;
  border-radius:14px;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  color:#000;
  font-weight:800;
  font-size:12px;
  box-shadow:0 0 12px rgba(255,215,0,.5);
}



.equip-img-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.equip-img{
  width:80%;
  height:80%;
  object-fit:contain;
  filter:drop-shadow(0 0 15px rgba(0,255,255,.5));
}

.equip-empty{
  opacity:.4;
  font-size:12px;
}

.enhance-badge{
  position:absolute;
  bottom:6px;
  left:6px;
  background:linear-gradient(90deg,#ffd700,#ff9900);
  color:#000;
  font-size:11px;
  font-weight:800;
  padding:2px 6px;
  border-radius:8px;
  box-shadow:0 0 10px rgba(255,215,0,.6);
}


.equip-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.equip-slot{
  background:linear-gradient(145deg,#0b1118,#060a0f);
  border-radius:18px;
  padding:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  transition:.25s;
  cursor:pointer;
  box-shadow:
    0 0 20px rgba(0,255,255,.15),
    inset 0 0 20px rgba(0,255,255,.05);
}

.equip-slot:hover{
  transform:translateY(-4px);
  box-shadow:
    0 0 35px rgba(0,255,255,.5);
}

.equip-label{
  font-size:11px;
  opacity:.6;
  margin-bottom:6px;
}

.equip-content{
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
}


.inventory-item.mythic{
  border:2px solid #ff00ff;
  box-shadow:
    0 0 25px #ff00ff,
    0 0 50px rgba(255,0,255,.6);
}



</style>
</head>
<body>

  <!-- ===== GLOBAL HEADER ===== -->
<div class="game-header">

  <button class="header-btn back" onclick="handleBack()">
    ←
  </button>

  <div class="header-title">
     Diamond Hunter
  </div>

  <div class="header-right">
    <div class="header-gold">
      💎 <span id="headerGold">0</span>
    </div>
  </div>

</div>



<!-- ================= CREATE CHARACTER ================= -->
<div id="createScreen" class="screen active">

  <div class="title">✨ Tạo nhân vật</div>

  <input id="charName" placeholder="Nhập tên nhân vật">

<div class="class-grid">

  <div class="class-card warrior"
       onclick="selectClass(this,'warrior')">
  </div>

  <div class="class-card assassin"
       onclick="selectClass(this,'assassin')">
  </div>

  <div class="class-card mage"
       onclick="selectClass(this,'mage')">
  </div>

</div>

<!-- CLASS PREVIEW -->
<div id="classPreview" class="class-preview hidden">

  <div class="preview-title" id="previewName"></div>

  <div class="preview-bar">
    <span>❤️ HP</span>
    <div class="bar">
      <div class="fill" id="hpFill"></div>
    </div>
  </div>

  <div class="preview-bar">
    <span>⚔ ATK</span>
    <div class="bar">
      <div class="fill" id="atkFill"></div>
    </div>
  </div>

  <div class="preview-bar">
    <span>🛡 DEF</span>
    <div class="bar">
      <div class="fill" id="defFill"></div>
    </div>
  </div>

</div>


  <button class="btn" onclick="createCharacter()">Tạo nhân vật</button>
</div>


<!-- ================= HUB ================= -->
<div id="hubScreen" class="screen">

  <div class="hub-card">

  <div class="character-card">

  <div id="hubAvatar" class="character-bg"></div>


  <!-- TOP LEFT -->
  <div class="char-badge hp-badge">
    ❤️ <span id="hpOverlay"></span>
  </div>

  <!-- TOP RIGHT -->
  <div class="char-badge lv-badge">
    ⭐ LV <span id="lvOverlay"></span>
  </div>

  <!-- BOTTOM LEFT -->
  <div class="char-badge atk-badge">
    ⚔ <span id="atkOverlay"></span>
  </div>

  <!-- BOTTOM RIGHT -->
  <div class="char-badge def-badge">
    🛡 <span id="defOverlay"></span>
  </div>


  <div class="char-badge" style="bottom:50px; right:12px">
  💨 <span id="dodgeOverlay"></span>%
</div>

<div class="char-badge" style="bottom:50px; left:12px">
  💥 <span id="critOverlay"></span>%
</div>


  </div>

<div class="hub-name" id="infoName"></div>

  </div>





  <div class="hub-actions">

<button class="hub-btn secondary" onclick="toggleInventory()">
  🎒 Kho đồ
</button>

<button class="hub-btn secondary" onclick="toggleShop()">
  🛒 Shop
</button>


<button class="hub-btn primary" onclick="goToCombat()">
      ⚔ Vào chiến đấu
</button>


<button class="hub-btn danger" onclick="resetCharacter()">
      🗑 Xóa nhân vật
</button>

  </div>



</div>




<!-- ================= INVENTORY ================= -->
<div id="inventoryPanel" class="inventory hidden">

    
  <div class="inventory-box">

<div class="inventory-header-pro">

  <div class="inv-title-pro">
    🎒 Kho đồ
  </div>

  <div class="inv-right-pro">
    <div class="inv-gold-pro">
      💎 <span id="inventoryGold"></span>
    </div>

    <button class="inv-close-pro"
            onclick="toggleInventory()">✕</button>
  </div>

</div>





<div class="inventory-stats">

  <div class="stats-title">Chỉ số cơ bản</div>

  <div class="stats-grid-clean">

    <div class="stat-row">
      ❤️ HP <span id="invHpFinal"></span>
    </div>

        <div class="stat-row">
      💨 Né tránh <span id="invDodgeFinal"></span>
    </div>

    <div class="stat-row">
      ⚔ ATK <span id="invAtkFinal"></span>
    </div>

      <div class="stat-row">
      💥 Chí mạng <span id="invCritFinal"></span>
    </div>

    <div class="stat-row">
      🛡 DEF <span id="invDefFinal"></span>
    </div>


    <div class="stat-row">
  ♻ Hồi máu /s <span id="invRegenFinal"></span>

    critRate:25
  },
  mage:{

    dodge:8,
    critRate:18
  }
};

function savePlayer(){
  if(!player) return;
  player.lastOnline = Date.now();
  localStorage.setItem("hunter_char",
    JSON.stringify(player));
}



/* ===== INIT ===== */
window.onload=function(){

  const saved=localStorage.getItem("hunter_char");
  if(saved){
  player=JSON.parse(saved);

  recalcStats();
  applyOfflineRegen();
  showHub();
  startRegen();
}

};



function selectClass(el, type){

  // Remove selected cũ
  document.querySelectorAll(".class-card")
    .forEach(c => c.classList.remove("selected"));

  el.classList.add("selected");
  selectedClass = type;

  const preview = document.getElementById("classPreview");
  if(preview) preview.classList.remove("hidden");

  const config = CLASS_CONFIG[type];
  if(!config) return;

  const nameMap = {
    warrior: "⚔ Chiến Binh",
    assassin: "🏹 Sát Thủ",
    mage: "🔮 Pháp Sư"
  };

  const hp  = config.base.maxHp;
  const atk = config.base.atk;
  const def = config.base.def;

  document.getElementById("previewName").innerText =
    nameMap[type] || type;

  document.getElementById("hpFill").style.width =
    (hp / 1000 * 100) + "%";

  document.getElementById("atkFill").style.width =
    (atk / 300 * 100) + "%";

  document.getElementById("defFill").style.width =
    (def / 150 * 100) + "%";
}



function createCharacter(){

  const name=document.getElementById("charName").value.trim();
  if(!name || !selectedClass)
    return alert("Nhập tên và chọn phái!");

  const config = CLASS_CONFIG[selectedClass];

  player = {
    classType:selectedClass,
    name,
    level:1,
    baseStats:config.base,
    maxHp:config.base.maxHp,
    hp:config.base.maxHp,
    atk:config.base.atk,
    def:config.base.def,
    dodge:config.dodge,
    critRate:config.critRate,
    critDamage:1.5,
    regen:0.5,
    lifesteal:0,
    exp:0,
    gold:500,
    inventory:[],
    equipment:{
      weapon:null, armor:null, helmet:null,
      gloves:null, boots:null, shoulder:null,
      legs:null, ring:null, gem:null
    }
  };

  savePlayer();
  showHub();
  startRegen();
}

}






function resetCharacter(){

  if(!confirm("Bạn chắc chắn muốn xóa nhân vật?"))
    return;

  // Dừng regen
  if(regenInterval) clearInterval(regenInterval);

  // Xóa player trong RAM
  player = null;

  // Xóa localStorage
  localStorage.removeItem("hunter_char");

  // Chuyển về màn tạo nhân vật
  switchScreen("createScreen");
}



function switchScreen(id){
  document.querySelectorAll(".screen")
    .forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}





let respawnInterval=null;

function startRespawnTimer(timeLeft){

  const btn = document.querySelector(".hub-btn.primary");
  if(!btn) return;


  btn.disabled = true;
  btn.innerText = "⏳ Đang hồi sinh...";

  if(respawnInterval) clearInterval(respawnInterval);

  respawnInterval = setInterval(()=>{

    const now = Date.now();
    const remaining = player.deadUntil - now;

    if(remaining <= 0){

      clearInterval(respawnInterval);

      // Hồi sinh
      player.deadUntil = null;
      player.hp = player.maxHp;

     savePlayer();


      btn.disabled = false;
      btn.innerText = "⚔ Vào chiến đấu";

      showHub();
      return;
    }

    const hours = Math.floor(remaining / (1000*60*60));
    const minutes = Math.floor((remaining % (1000*60*60))/(1000*60));
    const seconds = Math.floor((remaining % (1000*60))/1000);

    btn.innerText =
      `⏳ ${hours}h ${minutes}m ${seconds}s`;

  },1000);
}

function equipItem(index){

  const item = player.inventory[index];

  if(!item || !item.type){
    alert("Vật phẩm này không thể trang bị!");
    return;
  }

  // Potion dùng ngay
  if(item.type==="potion"){
    if(player.hp >= player.maxHp){
      alert("HP đã đầy!");
      return;
    }

    player.hp += item.heal;
    if(player.hp > player.maxHp)
      player.hp = player.maxHp;

    player.inventory.splice(index,1);

    savePlayer();
    renderInventory();
    showHub();
    return;
  }

  const validSlots = [
    "weapon","armor","helmet","gloves",
    "boots","shoulder","legs","ring","gem"
  ];

  if(!validSlots.includes(item.type)){
    alert("Không thể trang bị vật phẩm này");
    return;
  }

  const slot = item.type;

  // Nếu slot đã có đồ
  if(player.equipment[slot]){
    player.inventory.push(player.equipment[slot]);
  }

  item.enhance = item.enhance || 0;

  player.equipment[slot] = item;
  player.inventory.splice(index,1);

  recalcStats();
  savePlayer();

  renderInventory();
  showHub();
}





function unequipItem(slot){

  const item = player.equipment[slot];
  if(!item) return;

  // Trả đồ về kho
  player.inventory.push(item);

  // Xóa khỏi slot
  player.equipment[slot] = null;

  // Tính lại chỉ số
  recalcStats();

  // Lưu
  savePlayer();


  // Nếu đang mở inventory → cập nhật ngay
  renderInventory();

  // Cập nhật Hub overlay
  showHub();
}


function recalcStats(){

  const config = CLASS_CONFIG[player.classType];

  player.maxHp = config.base.maxHp;
  player.atk   = config.base.atk;
  player.def   = config.base.def;

  player.dodge = config.dodge;
  player.critRate = config.critRate;
  player.regen = 0.5;
  player.critDamage = 1.5;
  player.lifesteal = 0;

  // Level bonus
  player.maxHp += player.level * 50;
  player.atk   += player.level * 10;
  player.def   += player.level * 8;

  // Equipment bonus
Object.values(player.equipment).forEach(item=>{
  if(!item) return;

  const enhance = item.enhance || 0;
  
  const multi = getEnhanceMultiplier(enhance);


  if(item.atk) player.atk += Math.floor(item.atk * multi);
  if(item.def) player.def += Math.floor(item.def * multi);
  if(item.hp)  player.maxHp += Math.floor(item.hp * multi);

  if(item.dodge) player.dodge += item.dodge;
  if(item.critRate) player.critRate += item.critRate;
  if(item.regen) player.regen += item.regen;
  if(item.lifesteal) player.lifesteal += item.lifesteal;

});


  if(player.hp > player.maxHp)
    player.hp = player.maxHp;
}

    .innerHTML = stats || "Không có chỉ số";

    .innerText = item.price;
}

function closeShopItemModal(){
  document.getElementById("shopItemModal")
    .classList.add("hidden");
  selectedShopItem = null;
}

function confirmBuyItem(){

  if(!selectedShopItem) return;

  if(player.gold < selectedShopItem.price){
    alert("Không đủ 💎");
    return;
  }

  player.gold -= selectedShopItem.price;
  player.inventory.push(selectedShopItem);

savePlayer();


  closeShopItemModal();
  renderShop();
}



function sellItem(index){

  const item = player.inventory[index];
  if(!item) return;

  // Nếu không có price (đồ rơi)
  let sellPrice = 0;

  if(item.price){
    sellPrice = Math.floor(item.price * 0.6);
  }else{
    // Tự tính giá theo stat
    sellPrice = calculateSellValue(item);
  }

  player.gold += sellPrice;

  player.inventory.splice(index,1);

  savePlayer();
  renderInventory();
  showHub();
}



function calculateSellValue(item){

  let value = 50; // giá base

  if(item.atk) value += item.atk * 5;
  if(item.def) value += item.def * 4;
  if(item.hp) value += item.hp * 0.2;
  if(item.critRate) value += item.critRate * 20;
  if(item.lifesteal) value += item.lifesteal * 30;
  if(item.regen) value += item.regen * 40;

  if(item.rarity==="mythic"){
    value *= 5;
  }

  return Math.floor(value);
}



function applyOfflineRegen(){

recalcStats();


  if(!player.lastOnline) return;

  const now = Date.now();
  const diffMs = now - player.lastOnline;

  const secondsOffline = Math.floor(diffMs / 1000);

  if(secondsOffline <= 0) return;

  // Không hồi khi chết
  if(player.deadUntil && now < player.deadUntil)
    return;

  const regenAmount = secondsOffline * player.regen;

  player.hp += regenAmount;

  if(player.hp > player.maxHp)
    player.hp = player.maxHp;

  player.hp = Math.floor(player.hp);

  console.log("Offline regen:", secondsOffline, "giây");

  savePlayer();

}




function startRegen(){

  if(regenInterval) clearInterval(regenInterval);

  regenInterval = setInterval(()=>{

    if(!player) return;

    // Không regen khi chết
    if(player.deadUntil && Date.now() < player.deadUntil)
      return;

    if(player.hp < player.maxHp){

      player.hp += player.regen;

      if(player.hp > player.maxHp)
        player.hp = player.maxHp;

      // Update UI thôi (không save mỗi tick)
      const hpOverlay =
        document.getElementById("hpOverlay");

      if(hpOverlay){
        hpOverlay.innerText =
          player.hp + "/" + player.maxHp;
      }

      const hpInv =
        document.getElementById("invHpFinal");

      if(hpInv){
        hpInv.innerText =
          player.hp + " / " + player.maxHp;
      }

      // Chỉ save khi full HP
      if(player.hp === player.maxHp){
        savePlayer();
      }
    }

  },1000);
}



window.addEventListener("beforeunload",()=>{
  if(player && localStorage.getItem("hunter_char")){
    player.lastOnline = Date.now();
    savePlayer();
  }
});



function goToCombat(){

  if(player.deadUntil && Date.now() < player.deadUntil){
    alert("⏳ Nhân vật chưa hồi sinh!");
    return;
  }

savePlayer();


  location.href = "combat.html";
}



function handleBack(){

  const inventory = document.getElementById("inventoryPanel");
  const shop = document.getElementById("shopPanel");
  const modal = document.getElementById("shopItemModal");

  if(!inventory.classList.contains("hidden")){
    toggleInventory();
    return;
  }

  if(!shop.classList.contains("hidden")){
    toggleShop();
    return;
  }

  if(!modal.classList.contains("hidden")){
    closeShopItemModal();
    return;
  }

  // Nếu đang ở hub → confirm
  if(document.getElementById("hubScreen").classList.contains("active")){
    if(confirm("Thoát game?")){
      location.href = "invest.html";
    }
    return;
  }

  // Nếu đang create → không back
}



let selectedEnhanceSlot = null;

function openEnhance(slot){

  const item = player.equipment[slot];
  if(!item) return;

  selectedEnhanceSlot = slot;

  document.getElementById("enhanceModal")
    .classList.remove("hidden");

  updateEnhanceUI();
}

function closeEnhance(){
  document.getElementById("enhanceModal")
    .classList.add("hidden");
}

function updateEnhanceUI(){

  const item = player.equipment[selectedEnhanceSlot];
  const lv = item.enhance || 0;

  let rate = 100;
  let cost = 100;

  if(lv >= 5 && lv < 10){
    rate = 70;
    cost = 300;
  }

  if(lv >= 10){
    rate = 40;
    cost = 600;
  }

  document.getElementById("enhanceItemName")
    .innerText = item.name + " +" + lv;

  document.getElementById("enhanceInfo")
    .innerHTML =
      `Tỉ lệ thành công: ${rate}%<br>
       Chi phí: ${cost} 💎`;
}

function getEnhanceMultiplier(enhance){
  return 1 + enhance * 0.05;
}



function enhanceItem(){

  let item = null;

  if(selectedEnhanceSlot){
    item = player.equipment[selectedEnhanceSlot];
  }

  if(selectedEnhanceIndex !== null){
    item = player.inventory[selectedEnhanceIndex];
  }

  if(!item) return;

  let lv = item.enhance || 0;

  let rate = 100;
  let cost = 100;

  if(lv >= 5 && lv < 10){
    rate = 70;
    cost = 300;
  }

  if(lv >= 10){
    rate = 40;
    cost = 600;
  }

  if(player.gold < cost){
    alert("Không đủ 💎");
    return;
  }

  player.gold -= cost;

  if(Math.random()*100 <= rate){
    item.enhance = lv + 1;
    alert("🔥 Thành công! +" + item.enhance);
  }else{
    if(lv >= 10){
      item.enhance = Math.max(0, lv - 1);
      alert("💥 Thất bại! Giảm cấp!");
    }else{
      alert("💥 Thất bại!");
    }
  }

  recalcStats();
  savePlayer();

  renderInventory();
  showHub();
}


function confirmUnequip(){

  if(!selectedEnhanceSlot) return;

  const item = player.equipment[selectedEnhanceSlot];
  if(!item) return;

  if(!confirm("Tháo " + item.name + " ?"))
    return;

  unequipItem(selectedEnhanceSlot);

  closeEnhance();
}



let selectedInventoryIndex = null;

function openInventoryItem(index){

  const item = player.inventory[index];
  if(!item) return;

  selectedInventoryIndex = index;
  selectedEnhanceIndex = null;      // reset
  selectedEnhanceSlot = null;       // reset

  document.getElementById("inventoryItemModal")
    .classList.remove("hidden");

  document.getElementById("invModalName")
    .innerText = item.name + " +" + (item.enhance || 0);

  document.getElementById("invModalImg")
    .src = item.img;

  const equipped = player.equipment[item.type];

  // ===== TÍNH VALUE ĐÃ ENHANCE =====
  function val(it, stat){
    if(!it || !it[stat]) return 0;
    return getEnhancedValue(it, stat);
  }

  function compareStat(label, newVal, oldVal, suffix=""){

    if(!newVal && !oldVal) return "";

    newVal = newVal || 0;
    oldVal = oldVal || 0;

    const diff = newVal - oldVal;

    let color = "#fff";
    if(diff > 0) color = "#00ff88";
    if(diff < 0) color = "#ff4444";

    return `
      <div style="display:flex;justify-content:space-between">
        <span>${label}</span>
        <span style="color:${color}">
          ${newVal}${suffix}
          ${diff!==0 ? ` (${diff>0?"+":""}${diff})` : ""}
        </span>
      </div>
    `;
  }

  let html = "";

  html += compareStat("⚔ ATK",
    val(item,"atk"),
    val(equipped,"atk"));

  html += compareStat("🛡 DEF",
    val(item,"def"),
    val(equipped,"def"));

  html += compareStat("❤️ HP",
    val(item,"hp"),
    val(equipped,"hp"));

  html += compareStat("💨 Né",
    item.dodge || 0,
    equipped?.dodge || 0,
    "%");

  html += compareStat("💥 Crit",
    item.critRate || 0,
    equipped?.critRate || 0,
    "%");

  html += compareStat("🩸 Hút máu",
    item.lifesteal || 0,
    equipped?.lifesteal || 0,
    "%");

  html += compareStat("♻ Regen",
    item.regen || 0,
    equipped?.regen || 0);

  if(equipped){
    html += `
      <div style="margin-top:10px;font-size:12px;opacity:.6">
        Đang mặc: ${equipped.name}
      </div>
    `;
  }

  document.getElementById("invModalStats")
    .innerHTML = html;

  // ===== NÚT =====

  const btnEquip   = document.getElementById("btnEquip");
  const btnEnhance = document.getElementById("btnEnhance");
  const btnUnequip = document.getElementById("btnUnequip");

  btnEquip.style.display   = "block";
  btnEnhance.style.display = "block";
  btnUnequip.style.display = "none";

  btnEquip.innerText = "✅ Trang bị";
  btnEquip.onclick = confirmEquipItem;

  // 🔥 SỬA CHỖ NÀY — KHÔNG GÁN TẠM SLOT NỮA
  btnEnhance.innerText = "🔥 Cường hóa";

  btnEnhance.onclick = function(){

    selectedEnhanceIndex = index;  // enhance trực tiếp từ inventory
    selectedEnhanceSlot = null;

    openEnhanceFromInventory();
    closeInventoryItemModal();
  };
}


function updateEnhanceUIInventory(){

  const item = player.inventory[selectedEnhanceIndex];
  const lv = item.enhance || 0;

  let rate = 100;
  let cost = 100;

  if(lv >= 5 && lv < 10){
    rate = 70;
    cost = 300;
  }

  if(lv >= 10){
    rate = 40;
    cost = 600;
  }

  document.getElementById("enhanceItemName")
    .innerText = item.name + " +" + lv;

  document.getElementById("enhanceInfo")
    .innerHTML =
      `Tỉ lệ thành công: ${rate}%<br>
       Chi phí: ${cost} 💎`;
}



function openEnhanceFromInventory(){

  const item = player.inventory[selectedEnhanceIndex];
  if(!item) return;

  document.getElementById("enhanceModal")
    .classList.remove("hidden");

  updateEnhanceUIInventory();
}



function closeInventoryItemModal(){

  document.getElementById("inventoryItemModal")
    .classList.add("hidden");

  selectedInventoryIndex = null;
  selectedEquippedSlot = null;

  const btnEquip   = document.getElementById("btnEquip");
  const btnEnhance = document.getElementById("btnEnhance");
  const btnUnequip = document.getElementById("btnUnequip");

  // Ẩn toàn bộ nút khi đóng
  btnEquip.style.display   = "none";
  btnEnhance.style.display = "none";
  btnUnequip.style.display = "none";

  // Reset nội dung (không gán onclick ở đây nữa)
  btnEquip.innerText   = "✅ Trang bị";
  btnEnhance.innerText = "🔥 Cường hóa";
  btnUnequip.innerText = "🗑 Tháo";
}





function confirmEquipItem(){
  if(selectedInventoryIndex===null) return;
  equipItem(selectedInventoryIndex);
  closeInventoryItemModal();
}

function confirmSellItem(){
  if(selectedInventoryIndex===null) return;
  sellItem(selectedInventoryIndex);
  closeInventoryItemModal();
}



let selectedEquippedSlot = null;


function openEquippedItem(slot){

  const item = player.equipment[slot];
  if(!item) return;

  selectedEquippedSlot = slot;

  document.getElementById("inventoryItemModal")
    .classList.remove("hidden");

  document.getElementById("invModalName")
    .innerText = item.name + " +" + (item.enhance || 0);

  document.getElementById("invModalImg")
    .src = item.img;

  // ===== HIỂN THỊ STAT =====

  let html = "";

  html += statRow("⚔ ATK", getEnhancedValue(item,"atk"));
  html += statRow("🛡 DEF", getEnhancedValue(item,"def"));
  html += statRow("❤️ HP", getEnhancedValue(item,"hp"));
  html += statRow("💨 Né tránh", item.dodge || 0, "%");
  html += statRow("💥 Crit", item.critRate || 0, "%");
  html += statRow("🩸 Hút máu", item.lifesteal || 0, "%");
  html += statRow("♻ Regen", item.regen || 0);

  html += `
    <div style="margin-top:10px;opacity:.8">
      🔥 Cường hóa +${item.enhance || 0}
    </div>
  `;

  document.getElementById("invModalStats")
    .innerHTML = html;

  // ===== XỬ LÝ NÚT =====

  const btnEquip   = document.getElementById("btnEquip");
  const btnEnhance = document.getElementById("btnEnhance");
  const btnUnequip = document.getElementById("btnUnequip");

  // Ẩn nút Trang bị vì đang mặc
  btnEquip.style.display   = "none";

  // Hiện Cường hóa + Tháo
  btnEnhance.style.display = "block";
  btnUnequip.style.display = "block";

  // Cường hóa
  btnEnhance.innerText = "🔥 Cường hóa";
  btnEnhance.onclick = function(){
    openEnhance(slot);
    closeInventoryItemModal();
  };

  // Tháo
  btnUnequip.innerText = "🗑 Tháo";
  btnUnequip.onclick = function(){
    unequipItem(slot);
    closeInventoryItemModal();
  };
}





function statRow(label,value,suffix=""){
  if(value===undefined || value===null) return "";
  return `
    <div style="display:flex;justify-content:space-between">
      <span>${label}</span>
      <span>${value}${suffix}</span>
    </div>
  `;
}


function getEnhancedValue(item, stat){

  if(!item || !item[stat]) return 0;

  const enhance = item.enhance || 0;
  const scale = getEnhanceMultiplier(enhance);

  return Math.floor(item[stat] * scale);
}
