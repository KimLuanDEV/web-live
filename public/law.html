<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>⚖️ Luật pháp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">



  <style>

    /* LAW HEADER */
.law-header{
  height:auto;
  padding:14px 12px;
  align-items:flex-start;
}

.law-header-center{
  flex:1;
  text-align:center;
}

.law-icon{
  font-size:26px;
  margin-bottom:2px;
}

.law-title{
  font-weight:900;
  font-size:16px;
}

.law-sub{
  font-size:12px;
  opacity:.7;
}


/* LAW GRID */
.law-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* LAW CARD */
.law-card{
  position:relative;
  background:#15151c;
  border-radius:16px;
  padding:16px 14px;
  min-height:110px;

  border:1px solid rgba(255,255,255,.06);
  transition:.2s;

  display:flex;
  flex-direction:column;
  justify-content:center;
}

.law-card.active{
  cursor:pointer;
}
.law-card.active:active{
  transform:scale(.97);
}

.law-card.locked{
  opacity:.55;
  filter:grayscale(1);
}

/* CONTENT */
.law-card-icon{
  font-size:26px;
  margin-bottom:8px;
}

.law-card-title{
  font-weight:800;
  font-size:14px;
}

.law-card-desc{
  font-size:12px;
  opacity:.7;
  margin-top:2px;
}

/* BADGE */
.law-badge{
  position:absolute;
  top:8px;
  right:8px;
  font-size:10px;
  font-weight:800;
  padding:4px 6px;
  border-radius:8px;
  background:#ff9800;
  color:#000;
}


/* ===== LAW HEADER ===== */
.law-header{
  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  align-items:center;
  height:64px;
  padding:8px 12px;

  background:linear-gradient(
    180deg,
    #15151c,
    #0e0e12
  );

  border-bottom:1px solid rgba(255,255,255,.08);
}

/* BACK */
.law-back{
  width:36px;
  height:36px;
  border:none;
  background:rgba(255,255,255,.06);
  color:#fff;
  border-radius:10px;
  font-size:18px;
  cursor:pointer;
}

/* CENTER */
.law-head-center{
  flex:1;
  text-align:center;
  line-height:1.2;
}

.law-head-icon{
  font-size:20px;
}

.law-head-title{
  font-weight:900;
  font-size:15px;
}

.law-head-sub{
  font-size:11px;
  opacity:.65;
  margin-top:2px;
}

/* RIGHT (placeholder) */
.law-head-right{
  width:36px;
}

/* ===== FULL BLACK BACKGROUND ===== */
html, body{
  background:#000;
}

.page-library{
  background:#000;
  color:#fff;
  min-height:100vh;
}

/* ===== LAW HEADER (FULL BLACK) ===== */
.law-header{
  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  align-items:center;
  height:64px;
  padding:8px 12px;

  background:#000;
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* LAW CARD refine for black bg */
.law-card{
  background:#111;
  border:1px solid rgba(255,255,255,.08);
}

.law-card.active:active{
  transform:scale(.97);
  background:#151515;
}


.page-library::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      circle at top,
      rgba(255,255,255,.03),
      transparent 60%
    );
  pointer-events:none;
}



  </style>
</head>

<body class="page-library">

<header class="law-header">
  <button class="law-back" onclick="history.back()">←</button>

  <div class="law-head-center">
    <div class="law-head-icon">⚖️</div>
    <div class="law-head-title">Luật pháp</div>
    <div class="law-head-sub">
      Quy định · Pháp lý · An toàn
    </div>
  </div>

  <!-- chừa sẵn slot sau này (search / info / admin) -->
  <div class="law-head-right"></div>
</header>


<main class="library-container">

  <div class="law-grid">

    <!-- 📄 Điều khoản -->
    <div class="law-card active">
      <div class="law-card-icon">📄</div>
      <div class="law-card-title">Điều khoản sử dụng</div>
      <div class="law-card-desc">Quy định nền tảng</div>
    </div>

    <!-- 🔐 Quyền riêng tư -->
    <div class="law-card active">
      <div class="law-card-icon">🔐</div>
      <div class="law-card-title">Quyền riêng tư</div>
      <div class="law-card-desc">Bảo mật dữ liệu</div>
    </div>

    <!-- ⚠️ Cảnh báo -->
    <div class="law-card active">
      <div class="law-card-icon">⚠️</div>
      <div class="law-card-title">Cảnh báo & An toàn</div>
      <div class="law-card-desc">Lừa đảo · Vi phạm</div>
    </div>

    <!-- 📚 Kiến thức -->
    <div class="law-card locked">
      <div class="law-card-icon">📚</div>
      <div class="law-card-title">Kiến thức pháp lý</div>
      <div class="law-card-desc">Cơ bản · Dễ hiểu</div>
      <div class="law-badge">SOON</div>
    </div>

    <!-- 🧠 Hỏi đáp -->
    <div class="law-card locked">
      <div class="law-card-icon">🧠</div>
      <div class="law-card-title">Hỏi đáp</div>
      <div class="law-card-desc">Tình huống thực tế</div>
      <div class="law-badge">SOON</div>
    </div>

  </div>

</main>


</body>
</html>
