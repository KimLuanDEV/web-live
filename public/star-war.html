<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Star War</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, #0a1a2f 0%, #000 60%),
    radial-gradient(circle at 80% 30%, #120a2f 0%, #000 60%);
  font-family:Arial, Helvetica, sans-serif;
}

canvas{ display:block; }

/* ===== HUD ===== */
.hud{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:30px;
  z-index:20;
}

.hudBox{
  background:rgba(0,0,0,.5);
  border:1px solid #00f0ff;
  padding:8px 16px;
  border-radius:12px;
  color:#00f0ff;
  font-weight:700;
  backdrop-filter:blur(6px);
  box-shadow:0 0 20px rgba(0,240,255,.4);
}

/* HP BAR */
.hpWrap{
  position:fixed;
  top:20px;
  left:20px;
  width:200px;
  height:14px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
  z-index:20;
}

.hpBar{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff0040,#ff8800);
  transition:.3s;
}

/* EXIT BUTTON */
.backBtn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:20;
  padding:10px 18px;
  border-radius:12px;
  background:linear-gradient(45deg,#00f0ff,#0088ff);
  color:white;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,240,255,.6);
}

/* GAME OVER */
.gameOverPanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  z-index:50;
  display:none;
}

.gameOverPanel button{
  margin-top:20px;
  padding:10px 25px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(45deg,#00f0ff,#0088ff);
  color:white;
}



#baseElement{
  position:fixed;
  bottom:-80px;
  left:50%;
  transform:translateX(-50%);
  width:114vw;              /* chỉnh kích thước tại đây */
  max-width:900px;
  pointer-events:none;
  z-index:5;
  transition:.3s;
}



#baseHitbox{
  position:fixed;
  bottom:0px;          /* chỉnh cao thấp */
  left:50%;
  transform:translateX(-50%);
  width:430px;          /* chỉnh độ rộng hitbox */
  height:60px;          /* chỉnh chiều cao hitbox */
  z-index:6;
  pointer-events:none;

  /* DEBUG MODE (xem vùng va chạm) */
  border:2px solid red;
  background:rgba(255,0,0,.15);
}


#playerElement{
  position:fixed;
  width:90px;          /* 🔥 chỉnh size tại đây */
  bottom:120px;        /* 🔥 chỉnh vị trí dọc */
  left:50%;
  transform:translate(-50%, -50%);
  pointer-events:none;
  z-index:8;
  transition:.1s linear;
}


#playerHitbox{
  position:fixed;
  width:60px;          /* chỉnh độ rộng hitbox */
  height:60px;         /* chỉnh chiều cao hitbox */
  pointer-events:none;
  z-index:7;
  transform:translate(-50%, -50%);

  /* DEBUG */
  border:2px solid cyan;
  background:rgba(0,255,255,.15);
}


</style>
</head>
<body>

<div class="hpWrap">
  <div class="hpBar" id="hpBar"></div>
</div>

<div class="hpWrap" style="top:50px;">
  <div class="hpBar" id="baseHpBar"
       style="background:linear-gradient(90deg,#00ff88,#00ffaa);">
  </div>
</div>


<div class="hud">
  <div class="hudBox">Score: <span id="scoreUI">0</span></div>
  <div class="hudBox">Reward: <span id="rewardUI">0</span> 💎</div>
</div>

<div class="backBtn" id="backBtn"
 onclick="location.href='/game-diamond-factory.html'">
  EXIT
</div>

<div class="gameOverPanel" id="gameOverPanel">
  <div id="finalText"></div>
  <button onclick="location.reload()">RESTART</button>
</div>


<div id="startPanel" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:40;
  color:white;
">

  <div style="
    font-size:42px;
    font-weight:900;
    margin-bottom:30px;
    letter-spacing:3px;
    color:#00f0ff;
    text-shadow:0 0 20px #00f0ff;
  ">
    STAR WAR
  </div>

  <button onclick="confirmStart()" style="
    padding:15px 50px;
    border:none;
    border-radius:15px;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(45deg,#00f0ff,#0088ff);
    color:white;
    box-shadow:0 0 25px rgba(0,240,255,.7);
  ">
    START GAME (50 💎)
  </button>


<button onclick="location.href='/game-diamond-factory.html'" style="
  margin-top:20px;
  padding:10px 35px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(45deg,#ff0040,#ff8800);
  color:white;
  box-shadow:0 0 20px rgba(255,0,0,.6);
">
  EXIT
</button>


</div>


<div id="countdown" style="
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  font-size:120px;
  font-weight:900;
  color:#00f0ff;
  text-shadow:0 0 40px #00f0ff;
  z-index:45;
  display:none;
  letter-spacing:10px;
">
  3
</div>


<canvas id="game"></canvas>


<img id="playerElement" src="/assets/star-war/player.png">

<div id="playerHitbox"></div>


<img id="baseElement" src="/assets/star-war/base.png">


<div id="baseHitbox"></div>


<div id="feeModal" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
">
  <div style="
    background:#0a1a2f;
    padding:30px;
    border-radius:20px;
    border:1px solid #00f0ff;
    text-align:center;
    color:white;
    width:300px;
    box-shadow:0 0 30px rgba(0,240,255,.6);
  ">
    <div style="font-size:20px;font-weight:700;margin-bottom:15px;">
      START STAR WAR
    </div>

    <div style="margin-bottom:20px;">
      Entry Fee: <span style="color:#00f0ff">50 💎</span>
    </div>

    <button onclick="approveStart()" style="
      margin-right:10px;
      padding:8px 20px;
      border:none;
      border-radius:10px;
      background:#00f0ff;
      color:black;
      font-weight:700;
      cursor:pointer;
    ">
      CONFIRM
    </button>

    <button onclick="closeFeeModal()" style="
      padding:8px 20px;
      border:none;
      border-radius:10px;
      background:#ff0040;
      color:white;
      font-weight:700;
      cursor:pointer;
    ">
      CANCEL
    </button>
  </div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ===================== GAME STATE ===================== */
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let score = 0;
let reward = 0;
let hp = 100;
let gameOver = false;

let baseHp = 200;   // ❤️ máu căn cứ

let lastEnemySpawn = 0;
let lastBossSpawn = 0;


let gameStarted = false;
let starting = false;

const backBtn = document.getElementById("backBtn");
backBtn.style.display = "none";   // 🔥 Ẩn khi đang ở màn hình START

const player = {
  x: canvas.width/2,
  y: canvas.height - 120,
  size: 25
};


const playerImg = new Image();
playerImg.src = "/assets/star-war/player.png";

// chỉnh kích thước hiển thị
const PLAYER_WIDTH = 80;
const PLAYER_HEIGHT = 80;



const baseImg = new Image();
baseImg.src = "/assets/star-war/base.png";


const ENTRY_FEE = 50;
let paidThisRound = false;



/* ===================== STAR BACKGROUND ===================== */
for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    speed:1+Math.random()*2
  });
}

/* ===================== CONTROL ===================== */
canvas.addEventListener("mousemove", e=>{
  player.x = e.clientX;
  document.getElementById("playerElement").style.left =
    e.clientX + "px";
});

canvas.addEventListener("touchmove", e=>{

  e.preventDefault();

  let touchX = e.touches[0].clientX;

  const minX = 40;
  const maxX = window.innerWidth - 40;

  touchX = Math.max(minX, Math.min(maxX, touchX));

  player.x = touchX;

  document.getElementById("playerElement").style.left =
    touchX + "px";

}, { passive:false });


/* ===================== SHOOT ===================== */
setInterval(()=>{
  if(!gameStarted) return;
  if(gameOver) return;
  bullets.push({ x:player.x, y:player.y-20, speed:10 });
},200);

/* ===================== SPAWN ===================== */
function spawnEnemy(){
  enemies.push({
    x:Math.random()*canvas.width,
    y:-40,
    size:20,
    speed:2+Math.random()*2,
    hp:1,
    boss:false
  });
}
function spawnBoss(){
  enemies.push({
    x:canvas.width/2,
    y:-100,
    size:60,
    speed:1.5,
    hp:30,
    boss:true
  });
}

/* ===================== EXPLOSION ===================== */
function explode(x,y){
  for(let i=0;i<25;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5,
      life:30
    });
  }
}



/* ===================== UPDATE ===================== */
function update(){

  if(!gameStarted || gameOver) return;

  const now = Date.now();

  /* ================= SPAWN ================= */
  if(now - lastEnemySpawn > 800){
    spawnEnemy();
    lastEnemySpawn = now;
  }

  if(now - lastBossSpawn > 30000){
    spawnBoss();
    lastBossSpawn = now;
  }

  /* ================= UPDATE HITBOX POSITION ================= */
  const playerHitbox = document.getElementById("playerHitbox");
  playerHitbox.style.left = player.x + "px";
  playerHitbox.style.top  = player.y + "px";

  const playerRect = playerHitbox.getBoundingClientRect();

  const baseHitbox = document.getElementById("baseHitbox");
  const baseRect = baseHitbox.getBoundingClientRect();

  /* ================= BULLETS ================= */
  for(let i = bullets.length - 1; i >= 0; i--){
    bullets[i].y -= bullets[i].speed;
    if(bullets[i].y < -10){
      bullets.splice(i,1);
    }
  }

  /* ================= ENEMIES MOVE ================= */
  for(let i = enemies.length - 1; i >= 0; i--){
    enemies[i].y += enemies[i].speed;
  }

  /* ================= COLLISIONS ================= */
  for(let ei = enemies.length - 1; ei >= 0; ei--){

    const e = enemies[ei];

    const enemyLeft   = e.x - e.size;
    const enemyRight  = e.x + e.size;
    const enemyTop    = e.y - e.size;
    const enemyBottom = e.y + e.size;

    /* ===== Bullet Collision ===== */
    for(let bi = bullets.length - 1; bi >= 0; bi--){

      const b = bullets[bi];
      const dx = e.x - b.x;
      const dy = e.y - b.y;

      if(Math.sqrt(dx*dx + dy*dy) < e.size){

        e.hp--;
        bullets.splice(bi,1);

        if(e.hp <= 0){
          explode(e.x,e.y);
          reward += e.boss ? 50 : 5;
          score  += e.boss ? 50 : 5;
          enemies.splice(ei,1);
        }

        break;
      }
    }

    if(!enemies[ei]) continue;

    /* ===== PLAYER HITBOX COLLISION ===== */
    if(
      enemyRight  >= playerRect.left &&
      enemyLeft   <= playerRect.right &&
      enemyBottom >= playerRect.top &&
      enemyTop    <= playerRect.bottom
    ){
      explode(e.x,e.y);
      enemies.splice(ei,1);

      hp -= 10;
      if(hp <= 0){
        hp = 0;
        endGame();
        return;
      }

      continue;
    }

    /* ===== BASE HITBOX COLLISION ===== */
    if(
      enemyRight  >= baseRect.left &&
      enemyLeft   <= baseRect.right &&
      enemyBottom >= baseRect.top
    ){
      explode(e.x,e.y);
      enemies.splice(ei,1);

      baseHp -= e.boss ? 40 : 15;

      if(baseHp <= 0){
        baseHp = 0;
        endGame();
        return;
      }
    }
  }

  /* ================= PARTICLES ================= */
  for(let i = particles.length - 1; i >= 0; i--){
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].life--;

    if(particles[i].life <= 0){
      particles.splice(i,1);
    }
  }

  /* ================= STARS ================= */
  for(let i = 0; i < stars.length; i++){
    stars[i].y += stars[i].speed;
    if(stars[i].y > canvas.height) stars[i].y = 0;
  }

  /* ================= UI ================= */
  document.getElementById("scoreUI").textContent = score;
  document.getElementById("rewardUI").textContent = reward;
  document.getElementById("hpBar").style.width = hp + "%";
  document.getElementById("baseHpBar").style.width =
    (baseHp / 200 * 100) + "%";
}

/* ===================== DRAW ===================== */
function draw(){

  // ===== CLEAR =====
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ===== STARS =====
  ctx.fillStyle = "white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,2,2);
  });



  // ===== BULLETS =====
  ctx.fillStyle = "#00ffff";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-2,b.y,4,12);
  });

  // ===== ENEMIES =====
  enemies.forEach(e=>{

    if(e.boss){
      ctx.shadowBlur = 30;
      ctx.shadowColor = "red";
      ctx.fillStyle = "#ff2222";
    }else{
      ctx.shadowBlur = 15;
      ctx.shadowColor = "orange";
      ctx.fillStyle = "orange";
    }

    ctx.beginPath();
    ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

}

/* ===================== GAME OVER ===================== */
function endGame(){
  gameOver=true;
  gameStarted = false;   // 🔥 thêm dòng này
  starting = false;      // 🔥 thêm dòng này
  socket.emit("star-war-reward",{reward});

  const panel=document.getElementById("gameOverPanel");
  panel.style.display="flex";
  document.getElementById("finalText").innerHTML=
    `<div style="font-size:40px;color:#ff0040">GAME OVER</div>
     <div style="margin-top:15px">Earned ${reward} 💎</div>`;
}

/* ===================== LOOP ===================== */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();








function startGame(){

  if(starting) return;
  if(gameStarted) return;
  if(gameOver) return;

  starting = true;

  socket.emit("star-war-start-request", {
    fee: ENTRY_FEE
  });

}


socket.on("star-war-start-approved", ()=>{

  const startPanel = document.getElementById("startPanel");
  const countdown  = document.getElementById("countdown");

  startPanel.style.display = "none";
  countdown.style.display  = "flex";

  let count = 3;
  countdown.textContent = count;

  const timer = setInterval(()=>{

    count--;

    if(count > 0){
      countdown.textContent = count;
    }else{
      clearInterval(timer);

      countdown.textContent = "GO";

      setTimeout(()=>{
        countdown.style.display = "none";
        gameStarted = true;
        starting = false;
        backBtn.style.display = "block";  // 🔥 Hiện nút EXIT khi game chạy
      },700);
    }

  },1000);

});


socket.on("star-war-start-denied", (data)=>{

  starting = false;

  alert(data.message || "Not enough diamonds");

});




function confirmStart(){
  if(gameStarted || starting || gameOver) return;
  document.getElementById("feeModal").style.display="flex";
}

function closeFeeModal(){
  document.getElementById("feeModal").style.display="none";
}

function approveStart(){
  document.getElementById("feeModal").style.display="none";
  startGame();
}



</script>
</body>
</html>
