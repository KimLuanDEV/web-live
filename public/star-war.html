<!DOCTYPE html>

<style>
html, body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  position:fixed;
  width:100%;

  touch-action:none;
  overscroll-behavior:none;
  background-color:#000;
  
}

canvas{ display:block; }

/* ===== HUD ===== */
.hud{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);

  gap:30px;
  z-index:20;
}

.hudBox{

}

.hpWrap{

}

.hpBar{

}

/* EXIT BUTTON */

}

/* GAME OVER */
.gameOverPanel{

}

<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

/* ===================== GAME STATE ===================== */
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let score = 0;
let reward = 0;
let hp = 100;
let gameOver = false;

let baseHp = 200;   // ❤️ máu căn cứ

let lastEnemySpawn = 0;
let lastBossSpawn = 0;
let bossBullets = [];

let gameStarted = false;
let starting = false;



const player = {
  x: canvas.width/2,
  y: canvas.height - 120,
  hitRadius: 18   // 🎯 chỉnh hitbox tại đây
};


const playerImg = new Image();
playerImg.src = "/assets/star-war/player.png";


const baseImg = new Image();
baseImg.src = "/assets/star-war/base.png";



const enemyImg = new Image();
enemyImg.src = "/assets/star-war/enemy.png";

const bossImg = new Image();
bossImg.src = "/assets/star-war/boss.png";






function getPlayerSize(){
  const size = getComputedStyle(document.documentElement)
    .getPropertyValue('--player-size');
  const scale = getComputedStyle(document.documentElement)
    .getPropertyValue('--player-scale');

  return Number(size) * Number(scale);
}



let ENTRY_FEE = 300;
let paidThisRound = false;



/* ===================== STAR BACKGROUND ===================== */
for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    speed:1+Math.random()*2
  });
}

/* ===================== CONTROL ===================== */
canvas.addEventListener("mousemove", e=>{
  player.x = e.clientX;
});
canvas.addEventListener("touchmove", e=>{
  player.x = e.touches[0].clientX;
});

/* ===================== SHOOT ===================== */
setInterval(()=>{
  if(!gameStarted) return;
  if(gameOver) return;
  bullets.push({ x:player.x, y:player.y-20, speed:10 });
},200);

/* ===================== SPAWN ===================== */
function spawnEnemy(){
  enemies.push({
    x:Math.random()*canvas.width,
    y:-60,
    drawSize: 60,
    hitRadius: getEnemySize()/2,      // tăng size để khớp ảnh
    speed:2+Math.random()*2,
    hp:1,
    boss:false
  });
}

function spawnBoss(){

  const count = 4; // 🎯 số boss mỗi lần spawn

  const gap = canvas.width / (count + 1);

  for(let i=1;i<=count;i++){

    enemies.push({
      x: gap * i,
      y: -120,

      drawSize:180,
      hitRadius:getBossSize()/2,
      speed:1.5,
      hp:20,
      boss:true,

      phase:"enter",
      targetY:120 + Math.random()*60, // boss đứng cao thấp khác nhau
      dir: Math.random() < 0.5 ? -1 : 1,
      lastShot:0
    });

  }

}

/* ===================== EXPLOSION ===================== */
function explode(x,y){
  for(let i=0;i<25;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5,
      life:30
    });
  }
}



/* ===================== UPDATE ===================== */
function update(){

  if(!gameStarted || gameOver) return;

  const now = Date.now();

  // ================= SPAWN =================
  if(now - lastEnemySpawn > 800){
    spawnEnemy();
    lastEnemySpawn = now;
  }

  if(now - lastBossSpawn > 30000){
    spawnBoss();
    lastBossSpawn = now;
  }

  // ================= BULLETS =================
  for(let i = bullets.length - 1; i >= 0; i--){
    bullets[i].y -= bullets[i].speed;
    if(bullets[i].y < -10){
      bullets.splice(i,1);
    }
  }



  // ================= ENEMIES MOVE =================
for(let i = enemies.length - 1; i >= 0; i--){

  const e = enemies[i];

  if(!e.boss){

    // enemy thường
    e.y += e.speed;

  }else{

    // ===== BOSS =====

    if(e.phase === "enter"){

      e.y += e.speed;

      if(e.y >= e.targetY){
        e.phase = "fight";
      }

    }

    else if(e.phase === "fight"){

      // di chuyển trái phải
      e.x += 3 * e.dir;

const edge = e.hitRadius;

if(e.x < edge || e.x > canvas.width - edge){
  e.dir *= -1;
}

      // bắn đạn
if(Date.now() - e.lastShot > 900){

  const bulletCount = 6;

  for(let i=0;i<bulletCount;i++){

const speed = 4 + Math.random()*3;

// random ngang
const vx = (Math.random() - 0.5) * speed * 2;

// luôn bắn xuống
const vy = Math.random() * speed + 2;

bossBullets.push({
  x:e.x,
  y:e.y,
  vx:vx,
  vy:vy
});

  }

  e.lastShot = Date.now();
}

    }

  }

}


 // ================= Ammor Boss =================
for(let i = bossBullets.length-1; i>=0; i--){

  const b = bossBullets[i];

  b.x += b.vx;
  b.y += b.vy;

  if(b.y > canvas.height+50){
    bossBullets.splice(i,1);
    continue;
  }

  const dx = b.x - player.x;
  const dy = b.y - player.y;

  const playerRadius = player.hitRadius;

  if(Math.sqrt(dx*dx + dy*dy) < playerRadius){

    bossBullets.splice(i,1);

    hp -= 15;

    if(hp <= 0){
      hp = 0;
      endGame();
      return;
    }

  }

}


  // ================= COLLISIONS =================
  for(let ei = enemies.length - 1; ei >= 0; ei--){

    const e = enemies[ei];

    // ===== Bullet collision =====
    for(let bi = bullets.length - 1; bi >= 0; bi--){

      const b = bullets[bi];
      const dx = e.x - b.x;
      const dy = e.y - b.y;

      if(Math.sqrt(dx*dx + dy*dy) < e.hitRadius){

        e.hp--;
        bullets.splice(bi,1);

        if(e.hp <= 0){
          explode(e.x,e.y);

const enemyReward = Math.floor(ENTRY_FEE / 100);
const bossReward  = Math.floor(ENTRY_FEE / 10);

reward += e.boss ? bossReward : enemyReward;

          score  += e.boss ? 50 : 5;
          enemies.splice(ei,1);
        }

        break;
      }
    }

    if(!enemies[ei]) continue; // enemy đã chết

    // ===== Player collision =====
    const dxp = e.x - player.x;
    const dyp = e.y - player.y;

    const playerRadius = player.hitRadius;

if(Math.sqrt(dxp*dxp + dyp*dyp) < e.hitRadius + playerRadius)
    
    {
      explode(e.x,e.y);
      enemies.splice(ei,1);

      hp -= 10;
      if(hp <= 0){
        hp = 0;
        endGame();
        return;
      }

      continue;
    }

// ===== BASE COLLISION (CSS HITBOX) =====
const hitbox = document.getElementById("baseHitbox");
const rect = hitbox.getBoundingClientRect();

const enemyBottom = e.y + e.hitRadius;
const enemyLeft   = e.x - e.hitRadius;
const enemyRight  = e.x + e.hitRadius;

if(
  enemyBottom >= rect.top &&
  enemyRight  >= rect.left &&
  enemyLeft   <= rect.right
){
  explode(e.x, e.y);
  enemies.splice(ei,1);

  baseHp -= e.boss ? 40 : 15;

  if(baseHp <= 0){
    baseHp = 0;
    endGame();
    return;
  }
}

}

  // ================= PARTICLES =================
  for(let i = particles.length - 1; i >= 0; i--){
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].life--;

    if(particles[i].life <= 0){
      particles.splice(i,1);
    }
  }

  // ================= STARS =================
  stars.forEach(s=>{
    s.y += s.speed;
    if(s.y > canvas.height) s.y = 0;
  });

  // ================= UI =================
  document.getElementById("rewardUI").textContent = reward;
  document.getElementById("hpBar").style.width = hp + "%";
  document.getElementById("baseHpBar").style.width =
    (baseHp / 200 * 100) + "%";
}

/* ===================== DRAW ===================== */
function draw(){

  // ===== CLEAR =====
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ===== STARS =====
  ctx.fillStyle = "white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,2,2);
  });


// ===== BOSS BULLETS =====
ctx.fillStyle = "#ff0040";

bossBullets.forEach(b=>{
  ctx.beginPath();
  ctx.arc(b.x,b.y,5,0,Math.PI*2);
  ctx.fill();
});


// ===== PLAYER IMAGE =====
if(playerImg.complete){
const size = getPlayerSize();

ctx.drawImage(
  playerImg,
  player.x - size/2,
  player.y - size/2,
  size,
  size
);
}

  // ===== BULLETS =====
  ctx.fillStyle = "#00ffff";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-2,b.y,4,12);
  });


// ===== ENEMIES (PNG VERSION) =====
enemies.forEach(e=>{

  const img = e.boss ? bossImg : enemyImg;

  if(img.complete){

    ctx.save();

    if(e.boss){
      ctx.shadowBlur = 40;
      ctx.shadowColor = "#ff0040";
    }else{
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ff8800";
    }


const size = e.boss ? getBossSize() : getEnemySize();

ctx.drawImage(
  img,
  e.x - size/2,
  e.y - size/2,
  size,
  size
);

    ctx.restore();
  }

});

}

/* ===================== GAME OVER ===================== */
function endGame(){

  gameOver = true;
  gameStarted = false;
  starting = false;

  socket.emit("star-war-reward",{reward});

  const panel = document.getElementById("gameOverPanel");
  panel.style.display = "flex";

  document.getElementById("finalReward").textContent = reward;

}

/* ===================== LOOP ===================== */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();








function startGame(){

  if(starting) return;
  if(gameStarted) return;
  if(gameOver) return;

  starting = true;

  socket.emit("star-war-start-request", {
    fee: ENTRY_FEE
  });

}


socket.on("star-war-start-approved", ()=>{

  const startPanel = document.getElementById("startPanel");
  const countdown  = document.getElementById("countdown");

  startPanel.style.display = "none";
  countdown.style.display  = "flex";

  let count = 3;
  countdown.textContent = count;

  const timer = setInterval(()=>{

    count--;

    if(count > 0){
      countdown.textContent = count;
    }else{
      clearInterval(timer);

      countdown.textContent = "GO";

      setTimeout(()=>{
        countdown.style.display = "none";
        gameStarted = true;
        starting = false;
      },700);
    }

  },1000);

});


socket.on("star-war-start-denied", (data)=>{

  starting = false;

  alert(data.message || "Not enough diamonds");

});




function confirmStart(){
  if(gameStarted || starting || gameOver) return;
  document.getElementById("feeModal").style.display="flex";
}

function closeFeeModal(){
  document.getElementById("feeModal").style.display="none";
}

function approveStart(){
  document.getElementById("feeModal").style.display="none";
  startGame();
}



document.addEventListener('touchmove', function(e){
  e.preventDefault();
}, { passive:false });



document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

document.addEventListener('dblclick', function (e) {
  e.preventDefault();
}, { passive:false });



function getEnemySize(){

  const size = getComputedStyle(document.documentElement)
    .getPropertyValue('--enemy-size');

  const scale = getComputedStyle(document.documentElement)
    .getPropertyValue('--enemy-scale');

  return Number(size) * Number(scale);
}

function getBossSize(){

  const size = getComputedStyle(document.documentElement)
    .getPropertyValue('--boss-size');

  const scale = getComputedStyle(document.documentElement)
    .getPropertyValue('--boss-scale');

  return Number(size) * Number(scale);
}


function selectFee(fee){

  ENTRY_FEE = fee;

  document.getElementById("selectedFee").textContent = fee;

  document.querySelectorAll(".betChip").forEach(c=>{
    c.classList.remove("active");
  });

  event.currentTarget.classList.add("active");
}
