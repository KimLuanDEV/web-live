<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Star War</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
}
canvas{
  display:block;
}
.backBtn{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
  background:#00f0ff;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}
</style>
</head>
<body>

<div class="backBtn"
 onclick="location.href='/game-diamond-factory.html'">
  ← BACK
</div>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>

    // ================================
// 🚀 STAR WAR – FULL GAME
// ================================

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ================================
// 🎮 GAME STATE
// ================================
let bullets = [];
let enemies = [];
let particles = [];

let score = 0;
let reward = 0;
let hp = 100;
let gameOver = false;

let lastEnemySpawn = 0;
let lastBossSpawn = 0;

const player = {
  x: canvas.width/2,
  y: canvas.height - 100,
  size: 25
};

// ================================
// 🎯 CONTROL
// ================================
canvas.addEventListener("mousemove", e=>{
  player.x = e.clientX;
});

canvas.addEventListener("touchmove", e=>{
  player.x = e.touches[0].clientX;
});

// ================================
// 🔫 SHOOT AUTO
// ================================
setInterval(()=>{
  if(gameOver) return;
  bullets.push({
    x: player.x,
    y: player.y - 20,
    speed: 8
  });
}, 200);

// ================================
// 👾 SPAWN ENEMY
// ================================
function spawnEnemy(){
  enemies.push({
    x: Math.random() * canvas.width,
    y: -50,
    size: 20,
    speed: 2 + Math.random()*2,
    hp: 1,
    boss: false
  });
}

function spawnBoss(){
  enemies.push({
    x: canvas.width/2,
    y: -100,
    size: 60,
    speed: 1.5,
    hp: 30,
    boss: true
  });
}

// ================================
// 💥 PARTICLE
// ================================
function explode(x,y){
  for(let i=0;i<20;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*4,
      vy:(Math.random()-0.5)*4,
      life:30
    });
  }
}

// ================================
// 🔄 UPDATE
// ================================
function update(){

  if(gameOver) return;

  const now = Date.now();

  if(now - lastEnemySpawn > 800){
    spawnEnemy();
    lastEnemySpawn = now;
  }

  if(now - lastBossSpawn > 30000){
    spawnBoss();
    lastBossSpawn = now;
  }

  // bullets
  bullets.forEach(b=> b.y -= b.speed);
  bullets = bullets.filter(b=> b.y > -10);

  // enemies
  enemies.forEach(e=>{
    e.y += e.speed;
  });

  // collision
  enemies.forEach((e,ei)=>{
    bullets.forEach((b,bi)=>{
      const dx = e.x - b.x;
      const dy = e.y - b.y;
      if(Math.sqrt(dx*dx+dy*dy) < e.size){
        e.hp--;
        bullets.splice(bi,1);
        if(e.hp <= 0){
          explode(e.x,e.y);

          if(e.boss){
            reward += 50;
            score += 50;
          }else{
            reward += 5;
            score += 5;
          }

          enemies.splice(ei,1);
        }
      }
    });

    // hit player
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    if(Math.sqrt(dx*dx+dy*dy) < e.size + player.size){
      explode(e.x,e.y);
      enemies.splice(ei,1);
      hp -= 10;
      if(hp <= 0){
        endGame();
      }
    }
  });

  // particles
  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p=> p.life > 0);
}

// ================================
// 🎨 DRAW
// ================================
function draw(){

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle = "#00f0ff";
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 30);
  ctx.lineTo(player.x - 20, player.y + 20);
  ctx.lineTo(player.x + 20, player.y + 20);
  ctx.closePath();
  ctx.fill();

  // bullets
  ctx.fillStyle = "#00ffff";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-2, b.y, 4, 10);
  });

  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle = e.boss ? "red" : "orange";
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
    ctx.fill();
  });

  // particles
  ctx.fillStyle = "yellow";
  particles.forEach(p=>{
    ctx.fillRect(p.x,p.y,2,2);
  });

  // UI
  ctx.fillStyle = "white";
  ctx.font = "16px Arial";
  ctx.fillText("HP: "+hp, 20,30);
  ctx.fillText("Score: "+score, 20,50);
  ctx.fillText("Reward: "+reward+" 💎", 20,70);
}

// ================================
// 🏁 GAME OVER
// ================================
function endGame(){
  gameOver = true;

  socket.emit("star-war-reward",{ reward });

  ctx.fillStyle="white";
  ctx.font="40px Arial";
  ctx.fillText("GAME OVER", canvas.width/2-120, canvas.height/2);

  ctx.font="20px Arial";
  ctx.fillText("Earned "+reward+" 💎", canvas.width/2-80, canvas.height/2+40);
}

// ================================
// 🎮 LOOP
// ================================
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();

</script>



</body>
</html>
