<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Star War</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 20%, #0a1a2f 0%, #000 60%),
    radial-gradient(circle at 80% 30%, #120a2f 0%, #000 60%);
  font-family:Arial, Helvetica, sans-serif;
}

canvas{ display:block; }

/* ===== HUD ===== */
.hud{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:30px;
  z-index:20;
}

.hudBox{
  background:rgba(0,0,0,.5);
  border:1px solid #00f0ff;
  padding:8px 16px;
  border-radius:12px;
  color:#00f0ff;
  font-weight:700;
  backdrop-filter:blur(6px);
  box-shadow:0 0 20px rgba(0,240,255,.4);
}

/* HP BAR */
.hpWrap{
  position:fixed;
  top:20px;
  left:20px;
  width:200px;
  height:14px;
  background:rgba(255,255,255,.1);
  border-radius:10px;
  overflow:hidden;
  z-index:20;
}

.hpBar{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff0040,#ff8800);
  transition:.3s;
}

/* EXIT BUTTON */
.backBtn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:20;
  padding:10px 18px;
  border-radius:12px;
  background:linear-gradient(45deg,#00f0ff,#0088ff);
  color:white;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 0 15px rgba(0,240,255,.6);
}

/* GAME OVER */
.gameOverPanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:white;
  z-index:50;
  display:none;
}

.gameOverPanel button{
  margin-top:20px;
  padding:10px 25px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(45deg,#00f0ff,#0088ff);
  color:white;
}



#baseElement{
  position:fixed;
  bottom:-90px;
  left:50%;
  transform:translateX(-50%);
  width:114vw;              /* chỉnh kích thước tại đây */
  max-width:900px;
  pointer-events:none;
  z-index:5;
  transition:.3s;
}



#baseHitbox{
  position:fixed;
  bottom:0px;          /* chỉnh cao thấp */
  left:50%;
  transform:translateX(-50%);
  width:430px;          /* chỉnh độ rộng hitbox */
  height:60px;          /* chỉnh chiều cao hitbox */
  z-index:6;
  pointer-events:none;
  /* DEBUG MODE (xem vùng va chạm) */
  border:2px solid red;
  background:rgba(255,0,0,.15);
}




:root{
  --player-size: 100;        /* chỉnh kích cỡ tại đây */
  --player-scale: 1;        /* scale nhanh */
}

.player-debug{
  position:fixed;
  pointer-events:none;
  border:2px solid #00f0ff;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:30;
  display:none; /* bật khi cần debug */
}




/* ===== START PANEL ===== */

.startPanel{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:40;
  pointer-events:auto;
}

/* hộp chính */
.startBox{
  width:380px;
  padding:40px 30px;
  border-radius:25px;
  background:rgba(10,20,40,.85);
  backdrop-filter:blur(12px);
  border:1px solid #00f0ff;
  box-shadow:0 0 40px rgba(0,240,255,.5);
  text-align:center;
  animation:fadeIn .4s ease;
}

/* title */
.startTitle{
  font-size:38px;
  font-weight:900;
  margin-bottom:35px;
  letter-spacing:4px;
  color:#00f0ff;
  text-shadow:0 0 25px #00f0ff;
}

/* buttons */
.startBtn{
  width:100%;
  padding:15px 0;
  border:none;
  border-radius:15px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(45deg,#00f0ff,#0088ff);
  color:white;
  box-shadow:0 0 25px rgba(0,240,255,.7);
  transition:.2s;
}

.startBtn:hover{
  transform:scale(1.05);
}

.exitBtn{
  width:100%;
  margin-top:18px;
  padding:12px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(45deg,#ff0040,#ff8800);
  color:white;
  box-shadow:0 0 20px rgba(255,0,0,.6);
  transition:.2s;
}

.exitBtn:hover{
  transform:scale(1.05);
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(.9);}
  to{opacity:1; transform:scale(1);}
}





/* =========================
   🚀 GAME HUD PRO VERSION
   ========================= */

.gameHUD{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  max-width:1000px;
  z-index:50;
  color:white;
  font-family:Orbitron, Arial, sans-serif;
}

/* ===== Top ===== */

.hudTop{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  margin-bottom:15px;
}

.hudTitle{
  font-size:22px;
  font-weight:800;
  letter-spacing:4px;
  color:#00f0ff;
  text-shadow:0 0 15px #00f0ff;
}

/* ===== Exit button ===== */

.exitCircle{
  position:absolute;
  left:0;
  width:40px;
  height:40px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:18px;
  font-weight:700;
  background:rgba(255,0,60,.15);
  border:1px solid #ff0040;
  color:#ff0040;
  box-shadow:0 0 15px rgba(255,0,60,.6);
  transition:.2s;
}

.exitCircle:hover{
  transform:scale(1.1);
}

/* ===== HP Section ===== */

.hpSection{
  display:flex;
  gap:20px;
  margin-bottom:15px;
}

.hpBlock{
  flex:1;
}

.hpLabel{
  font-size:11px;
  margin-bottom:4px;
  opacity:.8;
  letter-spacing:2px;
}

.hpBarWrap{
  width:100%;
  height:10px;
  background:rgba(255,255,255,.1);
  border-radius:8px;
  overflow:hidden;
}

.hpBar{
  height:100%;
  width:100%;
  transition:.3s ease;
}

.playerHp{
  background:linear-gradient(90deg,#ff0040,#ff8800);
  box-shadow:0 0 10px #ff0040;
}

.baseHp{
  background:linear-gradient(90deg,#00ff88,#00ffaa);
  box-shadow:0 0 10px #00ffaa;
}

/* ===== Stats ===== */

.statSection{
  display:flex;
  gap:20px;
}

.statBox{
  flex:1;
  padding:10px 0;
  border-radius:12px;
  background:rgba(0,0,0,.4);
  border:1px solid rgba(0,240,255,.4);
  text-align:center;
  backdrop-filter:blur(6px);
  box-shadow:0 0 20px rgba(0,240,255,.2);
}

.statLabel{
  font-size:11px;
  opacity:.7;
  letter-spacing:2px;
}

.statValue{
  font-size:20px;
  font-weight:800;
  color:#00f0ff;
  text-shadow:0 0 10px #00f0ff;
}

</style>
</head>
<body>


<div class="gameHUD">

  <div class="hudTop">
    <div class="exitCircle"
         onclick="location.href='/game-diamond-factory.html'">
      ✕
    </div>

    <div class="hudTitle">
      STAR WAR
    </div>
  </div>

  <div class="hpSection">

    <div class="hpBlock">
      <div class="hpLabel">PLAYER</div>
      <div class="hpBarWrap">
        <div class="hpBar playerHp" id="hpBar"></div>
      </div>
    </div>

    <div class="hpBlock">
      <div class="hpLabel">BASE</div>
      <div class="hpBarWrap">
        <div class="hpBar baseHp" id="baseHpBar"></div>
      </div>
    </div>

  </div>

  <div class="statSection">
    <div class="statBox">
      <div class="statLabel">SCORE</div>
      <div class="statValue" id="scoreUI">0</div>
    </div>

    <div class="statBox">
      <div class="statLabel">REWARD</div>
      <div class="statValue">
        <span id="rewardUI">0</span> 💎
      </div>
    </div>
  </div>

</div>


<div class="gameOverPanel" id="gameOverPanel">
  <div id="finalText"></div>
  <button onclick="location.reload()">RESTART</button>
</div>


<div id="startPanel" class="startPanel">
  <div class="startBox">

    <div class="startTitle">
      STAR WAR
    </div>

    <button class="startBtn" onclick="confirmStart()">
      START GAME (50 💎)
    </button>

    <button class="exitBtn"
      onclick="location.href='/game-diamond-factory.html'">
      EXIT
    </button>

  </div>
</div>


<div id="countdown" style="
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.85);
  font-size:120px;
  font-weight:900;
  color:#00f0ff;
  text-shadow:0 0 40px #00f0ff;
  z-index:45;
  display:none;
  letter-spacing:10px;
">
  3
</div>


<canvas id="game"></canvas>




<img id="baseElement" src="/assets/star-war/base.png">


<div id="baseHitbox"></div>


<div id="feeModal" style="
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:60;
">
  <div style="
    background:#0a1a2f;
    padding:30px;
    border-radius:20px;
    border:1px solid #00f0ff;
    text-align:center;
    color:white;
    width:300px;
    box-shadow:0 0 30px rgba(0,240,255,.6);
  ">
    <div style="font-size:20px;font-weight:700;margin-bottom:15px;">
      START STAR WAR
    </div>

    <div style="margin-bottom:20px;">
      Entry Fee: <span style="color:#00f0ff">50 💎</span>
    </div>

    <button onclick="approveStart()" style="
      margin-right:10px;
      padding:8px 20px;
      border:none;
      border-radius:10px;
      background:#00f0ff;
      color:black;
      font-weight:700;
      cursor:pointer;
    ">
      CONFIRM
    </button>

    <button onclick="closeFeeModal()" style="
      padding:8px 20px;
      border:none;
      border-radius:10px;
      background:#ff0040;
      color:white;
      font-weight:700;
      cursor:pointer;
    ">
      CANCEL
    </button>
  </div>
</div>



<script src="/socket.io/socket.io.js"></script>
<script>

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ===================== GAME STATE ===================== */
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];

let score = 0;
let reward = 0;
let hp = 100;
let gameOver = false;

let baseHp = 200;   // ❤️ máu căn cứ

let lastEnemySpawn = 0;
let lastBossSpawn = 0;


let gameStarted = false;
let starting = false;

const backBtn = document.getElementById("backBtn");
backBtn.style.display = "none";   // 🔥 Ẩn khi đang ở màn hình START

const player = {
  x: canvas.width/2,
  y: canvas.height - 120,
  size: 25
};


const playerImg = new Image();
playerImg.src = "/assets/star-war/player.png";


const baseImg = new Image();
baseImg.src = "/assets/star-war/base.png";



const enemyImg = new Image();
enemyImg.src = "/assets/star-war/enemy.png";

const bossImg = new Image();
bossImg.src = "/assets/star-war/boss.png";






function getPlayerSize(){
  const size = getComputedStyle(document.documentElement)
    .getPropertyValue('--player-size');
  const scale = getComputedStyle(document.documentElement)
    .getPropertyValue('--player-scale');

  return Number(size) * Number(scale);
}



const ENTRY_FEE = 50;
let paidThisRound = false;



/* ===================== STAR BACKGROUND ===================== */
for(let i=0;i<120;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    speed:1+Math.random()*2
  });
}

/* ===================== CONTROL ===================== */
canvas.addEventListener("mousemove", e=>{
  player.x = e.clientX;
});
canvas.addEventListener("touchmove", e=>{
  player.x = e.touches[0].clientX;
});

/* ===================== SHOOT ===================== */
setInterval(()=>{
  if(!gameStarted) return;
  if(gameOver) return;
  bullets.push({ x:player.x, y:player.y-20, speed:10 });
},200);

/* ===================== SPAWN ===================== */
function spawnEnemy(){
  enemies.push({
    x:Math.random()*canvas.width,
    y:-60,
    drawSize: 60,
    hitRadius: 22,      // tăng size để khớp ảnh
    speed:2+Math.random()*2,
    hp:1,
    boss:false
  });
}

function spawnBoss(){
  enemies.push({
    x:canvas.width/2,
    y:-120,
    drawSize: 180,
    hitRadius: 70,
    speed:1.5,
    hp:30,
    boss:true
  });
}

/* ===================== EXPLOSION ===================== */
function explode(x,y){
  for(let i=0;i<25;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5,
      life:30
    });
  }
}



/* ===================== UPDATE ===================== */
function update(){

  if(!gameStarted || gameOver) return;

  const now = Date.now();

  // ================= SPAWN =================
  if(now - lastEnemySpawn > 800){
    spawnEnemy();
    lastEnemySpawn = now;
  }

  if(now - lastBossSpawn > 30000){
    spawnBoss();
    lastBossSpawn = now;
  }

  // ================= BULLETS =================
  for(let i = bullets.length - 1; i >= 0; i--){
    bullets[i].y -= bullets[i].speed;
    if(bullets[i].y < -10){
      bullets.splice(i,1);
    }
  }

  // ================= ENEMIES MOVE =================
  for(let i = enemies.length - 1; i >= 0; i--){
    enemies[i].y += enemies[i].speed;
  }

  // ================= COLLISIONS =================
  for(let ei = enemies.length - 1; ei >= 0; ei--){

    const e = enemies[ei];

    // ===== Bullet collision =====
    for(let bi = bullets.length - 1; bi >= 0; bi--){

      const b = bullets[bi];
      const dx = e.x - b.x;
      const dy = e.y - b.y;

      if(Math.sqrt(dx*dx + dy*dy) < e.hitRadius){

        e.hp--;
        bullets.splice(bi,1);

        if(e.hp <= 0){
          explode(e.x,e.y);
          reward += e.boss ? 50 : 5;
          score  += e.boss ? 50 : 5;
          enemies.splice(ei,1);
        }

        break;
      }
    }

    if(!enemies[ei]) continue; // enemy đã chết

    // ===== Player collision =====
    const dxp = e.x - player.x;
    const dyp = e.y - player.y;

    const playerRadius = getPlayerSize() / 2;

if(Math.sqrt(dxp*dxp + dyp*dyp) < e.hitRadius + playerRadius)
    
    {
      explode(e.x,e.y);
      enemies.splice(ei,1);

      hp -= 10;
      if(hp <= 0){
        hp = 0;
        endGame();
        return;
      }

      continue;
    }

// ===== BASE COLLISION (CSS HITBOX) =====
const hitbox = document.getElementById("baseHitbox");
const rect = hitbox.getBoundingClientRect();

const enemyBottom = e.y + e.hitRadius;
const enemyLeft   = e.x - e.hitRadius;
const enemyRight  = e.x + e.hitRadius;

if(
  enemyBottom >= rect.top &&
  enemyRight  >= rect.left &&
  enemyLeft   <= rect.right
){
  explode(e.x, e.y);
  enemies.splice(ei,1);

  baseHp -= e.boss ? 40 : 15;

  if(baseHp <= 0){
    baseHp = 0;
    endGame();
    return;
  }
}

}

  // ================= PARTICLES =================
  for(let i = particles.length - 1; i >= 0; i--){
    particles[i].x += particles[i].vx;
    particles[i].y += particles[i].vy;
    particles[i].life--;

    if(particles[i].life <= 0){
      particles.splice(i,1);
    }
  }

  // ================= STARS =================
  stars.forEach(s=>{
    s.y += s.speed;
    if(s.y > canvas.height) s.y = 0;
  });

  // ================= UI =================
  document.getElementById("scoreUI").textContent = score;
  document.getElementById("rewardUI").textContent = reward;
  document.getElementById("hpBar").style.width = hp + "%";
  document.getElementById("baseHpBar").style.width =
    (baseHp / 200 * 100) + "%";
}

/* ===================== DRAW ===================== */
function draw(){

  // ===== CLEAR =====
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // ===== STARS =====
  ctx.fillStyle = "white";
  stars.forEach(s=>{
    ctx.fillRect(s.x,s.y,2,2);
  });




// ===== PLAYER IMAGE =====
if(playerImg.complete){
const size = getPlayerSize();

ctx.drawImage(
  playerImg,
  player.x - size/2,
  player.y - size/2,
  size,
  size
);
}

  // ===== BULLETS =====
  ctx.fillStyle = "#00ffff";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-2,b.y,4,12);
  });


// ===== ENEMIES (PNG VERSION) =====
enemies.forEach(e=>{

  const img = e.boss ? bossImg : enemyImg;

  if(img.complete){

    ctx.save();

    if(e.boss){
      ctx.shadowBlur = 40;
      ctx.shadowColor = "#ff0040";
    }else{
      ctx.shadowBlur = 20;
      ctx.shadowColor = "#ff8800";
    }


ctx.drawImage(
  img,
  e.x - e.drawSize/2,
  e.y - e.drawSize/2,
  e.drawSize,
  e.drawSize
);

    ctx.restore();
  }

});

}

/* ===================== GAME OVER ===================== */
function endGame(){
  gameOver=true;
  gameStarted = false;   // 🔥 thêm dòng này
  starting = false;      // 🔥 thêm dòng này
  socket.emit("star-war-reward",{reward});

  const panel=document.getElementById("gameOverPanel");
  panel.style.display="flex";
  document.getElementById("finalText").innerHTML=
    `<div style="font-size:40px;color:#ff0040">GAME OVER</div>
     <div style="margin-top:15px">Earned ${reward} 💎</div>`;
}

/* ===================== LOOP ===================== */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();








function startGame(){

  if(starting) return;
  if(gameStarted) return;
  if(gameOver) return;

  starting = true;

  socket.emit("star-war-start-request", {
    fee: ENTRY_FEE
  });

}


socket.on("star-war-start-approved", ()=>{

  const startPanel = document.getElementById("startPanel");
  const countdown  = document.getElementById("countdown");

  startPanel.style.display = "none";
  countdown.style.display  = "flex";

  let count = 3;
  countdown.textContent = count;

  const timer = setInterval(()=>{

    count--;

    if(count > 0){
      countdown.textContent = count;
    }else{
      clearInterval(timer);

      countdown.textContent = "GO";

      setTimeout(()=>{
        countdown.style.display = "none";
        gameStarted = true;
        starting = false;
        backBtn.style.display = "block";  // 🔥 Hiện nút EXIT khi game chạy
      },700);
    }

  },1000);

});


socket.on("star-war-start-denied", (data)=>{

  starting = false;

  alert(data.message || "Not enough diamonds");

});




function confirmStart(){
  if(gameStarted || starting || gameOver) return;
  document.getElementById("feeModal").style.display="flex";
}

function closeFeeModal(){
  document.getElementById("feeModal").style.display="none";
}

function approveStart(){
  document.getElementById("feeModal").style.display="none";
  startGame();
}



</script>
</body>
</html>
