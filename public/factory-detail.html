<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết Nhà máy</title>
<link rel="stylesheet" href="/style.css">
<style>

:root{
  --bg0:#05080c;
  --bg1:#070c12;
  --card: rgba(12,18,28,.72);
  --stroke: rgba(0,240,255,.22);
  --stroke2: rgba(255,255,255,.08);
  --glow: rgba(0,240,255,.35);
  --txt:#eaf6ff;
  --muted: rgba(234,246,255,.65);
  --good:#00f0ff;
  --warn:#ffcc66;
  --bad:#ff4d4d;
  --r:20px;
  --safeTop: env(safe-area-inset-top, 0px);
  --safeBot: env(safe-area-inset-bottom, 0px);
}

*{ box-sizing:border-box; }
body{
  margin:0;
  background:
    radial-gradient(1200px 800px at 20% -10%, rgba(0,240,255,.18), transparent 60%),
    radial-gradient(1000px 700px at 110% 20%, rgba(255,80,80,.14), transparent 55%),
    linear-gradient(180deg, var(--bg1), var(--bg0));
  color:var(--txt);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  overflow-x:hidden;
}

/* ===== TOPBAR (premium) ===== */
.topbar{
  position:absolute;   /* 🔥 overlay */
  top:0;
  left:0;
  right:0;
  z-index:100;

  padding: calc(14px + var(--safeTop)) 16px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background: linear-gradient(
    180deg,
    rgba(0,0,0,.65),
    rgba(0,0,0,.35),
    rgba(0,0,0,0)
  );

  backdrop-filter: blur(10px);
  border:none;
}

.back{
  width:44px;
  height:44px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;

  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.10);
  box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 24px rgba(0,240,255,.12);
}

.title-wrap{
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:center;
  min-width:0;
}
#factoryTitle{
  font-weight:900;
  letter-spacing:.3px;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width: 56vw;
}
.subtle{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.2px;
}

.wallet{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  border-radius:16px;
  background: linear-gradient(180deg, rgba(0,240,255,.14), rgba(0,0,0,.35));
  border:1px solid rgba(0,240,255,.22);
  box-shadow: 0 0 30px rgba(0,240,255,.10);
}
.wallet .v{
  font-weight:1000;
  color:var(--good);
}

/* ===== LAYOUT ===== */
.container{
  max-width: 560px;
  margin: 0 auto;
}

.card{
  background: var(--card);
  border:1px solid var(--stroke2);
  border-radius: var(--r);
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    0 0 40px rgba(0,240,255,.08);
  overflow:hidden;
}

.card + .card{ margin-top:12px; }

/* ===== HERO ===== */
.hero{
  position:relative;
  width:100%;
  margin: 0;            /* bỏ margin */
  border-radius:0;     /* bỏ bo góc nếu muốn full edge */
  overflow:hidden;
  border:none;         /* bỏ viền nếu muốn sát mép */
  box-shadow:none;     /* bỏ shadow nếu muốn phẳng */
}

.factory-hero{
  display:block;
  width:100vw;          /* ✅ full ngang viewport */
  max-width:100%;
  height:70vh;        /* chỉnh tùy bạn */
  object-fit:cover;     /* ✅ ảnh cover full */
  object-position:center;
  transform:none;       /* ✅ bỏ scale để khỏi bị crop khó kiểm soát */
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 0%, rgba(0,240,255,.18), transparent 55%),
    linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.55));
  pointer-events:none;
}

.heroHUD{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}
.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.badge{
  padding:8px 10px;
  border-radius:14px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.2px;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.10);
}
.badge.good{
  border-color: rgba(0,240,255,.25);
  box-shadow: 0 0 26px rgba(0,240,255,.10);
}
.badge.warn{
  border-color: rgba(255,204,102,.25);
  box-shadow: 0 0 26px rgba(255,204,102,.08);
}

.statusDot{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:14px;
  font-size:12px;
  font-weight:900;
  background: rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.10);
}
.dot{
  width:10px;height:10px;border-radius:999px;
  background: var(--good);
  box-shadow: 0 0 18px rgba(0,240,255,.65);
}
.dot.off{
  background: rgba(255,255,255,.28);
  box-shadow:none;
}

/* ===== YARD (workers) ===== */
.yard{
  position:relative;
  height:80px;
  border-radius: var(--r);
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 120%, rgba(0,240,255,.18), transparent 60%),
    linear-gradient(180deg, rgba(10,16,24,.70), rgba(4,8,13,.78));
  border:1px solid rgba(0,240,255,.18);
}
.yard::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/22px 22px;
  opacity:.25;
  pointer-events:none;
}
.yard::after{
  content:"";
  position:absolute;
  left:-40px; right:-40px; bottom:-60px;
  height:120px;
  background: radial-gradient(circle at 50% 0%, rgba(0,240,255,.20), transparent 60%);
  filter: blur(10px);
  opacity:.8;
  pointer-events:none;
}



.worker.inactive{
  animation:none;
  opacity:.35;
  filter: grayscale(1);
}

/* ===== STATS GRID ===== */
.stats{
  padding:14px;
}
.grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:10px;
}
.tile{
  padding:12px 12px;
  border-radius:16px;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.09);
}
.k{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.2px;
}
.vbig{
  margin-top:6px;
  font-size:18px;
  font-weight:1000;
  letter-spacing:.3px;
}
.vbig.good{ color: var(--good); text-shadow: 0 0 18px rgba(0,240,255,.25); }
.vbig.warn{ color: var(--warn); text-shadow: 0 0 18px rgba(255,204,102,.18); }

.progressWrap{
  margin-top:10px;
  height:12px;
  background: rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
#progressFill{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, rgba(0,240,255,.95), rgba(0,140,255,.95));
  box-shadow: 0 0 26px rgba(0,240,255,.22);
  transition: .25s ease;
}

/* ===== ACTION BAR ===== */
.actionBar{
  position:fixed;
  left:0; right:0;
  bottom:0;
  padding: 12px 14px calc(12px + var(--safeBot));
  background: linear-gradient(180deg, rgba(5,8,12,.20), rgba(5,8,12,.92));
  backdrop-filter: blur(14px);
  border-top:1px solid rgba(0,240,255,.12);
  z-index:60;
}
.actions{
  max-width:560px;
  margin:0 auto;
  display:grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap:10px;
}
.btn{
  border:none;
  border-radius:18px;
  padding:12px 10px;
  font-weight:1000;
  letter-spacing:.2px;
  cursor:pointer;
  color:#071018;
}
.btn.primary{
  background: linear-gradient(180deg, rgba(0,240,255,1), rgba(0,140,255,1));
  box-shadow: 0 18px 50px rgba(0,240,255,.18);
}
.btn.ghost{
  background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.12);
  color: var(--txt);
}
.btn.danger{
  background: linear-gradient(180deg, rgba(255,90,90,1), rgba(170,0,0,1));
  color:#fff;
}
.btn:active{ transform: translateY(1px); }



.factoryWorkers{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.worker{
  position:absolute;
  left:0;
  top:72%;              /* điểm xuất phát dưới */
  width:42px;
  height:42px;
  object-fit:contain;

  animation: diagonalWalk linear infinite;
}

@keyframes diagonalWalk{

  /* xuất phát dưới trái */
  0%{
    transform: translate(-60px, 40px) scaleX(1);
    opacity:1;
  }

  /* chạy chéo lên */
  40%{
    transform: translate(20vw, -20px) scaleX(1);
    opacity:1;
  }

  /* tới cửa */
  50%{
    transform: translate(28vw, -60px) scaleX(1);
    opacity:0;
  }

  /* bên trong */
  55%{
    transform: translate(28vw, -60px) scaleX(-1);
    opacity:0;
  }

  /* đi ra */
  65%{
    transform: translate(20vw, -20px) scaleX(-1);
    opacity:1;
  }

  /* về lại dưới */
  100%{
    transform: translate(-60px, 40px) scaleX(-1);
    opacity:1;
  }
}


.storagePanel{
  position:absolute;
  width:46px;
  z-index:5;
  transform-origin: left center;
}

.storageBg{
  width:100%;
  display:block;
}

.storageText{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:14px;
}

.storageValue{
  font-size:18px;
  font-weight:1000;
  color:#00f0ff;
  text-shadow:0 0 18px rgba(0,240,255,.4);
}

.storageBar{
  margin-top:8px;
  width:100%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  overflow:hidden;
}

.storageBar #progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#008cff);
  box-shadow:0 0 18px rgba(0,240,255,.4);
}






.controlPanel{
  position:absolute;
  width:120px;
  z-index:6;
  transform-origin:center;
}

.controlBg{
  width:100%;
  display:block;
}

.controlText{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:8px;
}

.controlLevel{
  font-size:16px;
  font-weight:1000;
  color:#00f0ff;
  text-shadow:0 0 18px rgba(0,240,255,.4);
}

.controlState{
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
}

</style>
</head>
<body>

<div class="topbar">
  <div class="back" onclick="location.href='/game-diamond-factory.html'">←</div>

  <div class="title-wrap">
    <div id="factoryTitle">Nhà máy</div>
    <div class="subtle">Livestream Pro • Diamond Factory</div>
  </div>

  <div class="wallet">
    <span class="v" id="coinVal">0</span>
    <span>💎</span>
  </div>
</div>



  <div class="hero">
    <img id="factoryImg" class="factory-hero" alt="factory">

      <!-- 🔥 worker layer -->
  <div class="factoryWorkers" id="factoryWorkers"></div>



  <div class="storagePanel">
  <img src="/assets/ui/storage-panel.png" class="storageBg">

  <div class="storageText">
    <div class="storageValue" id="storedVal">0/0</div>
    <div class="storageBar">
      <div id="progressFill"></div>
    </div>
  </div>
</div>


<div class="controlPanel">
  <img src="/assets/ui/factory-control-panel.png" class="controlBg">

  <div class="controlText">
    <div class="controlLevel">
      LV <span id="levelVal">1</span>
    </div>

    <div class="controlState" id="stateVal">
      ACTIVE
    </div>
  </div>
</div>




    <div class="heroHUD">
      <div class="badges">
        <div class="badge good">⚡ <span id="rateVal">0 💎/s</span></div>
        <div class="badge warn">👷 <span id="workerVal">0/1</span></div>
      </div>

      <div class="statusDot">
        <span class="dot" id="activeDot"></span>
        <span id="activeText">ACTIVE</span>
      </div>
    </div>
  </div>



<div class="container">



  <div class="card stats">
    <div class="grid">


    </div>
  </div>

</div>

<div class="actionBar">
  <div class="actions">
    <button class="btn primary" onclick="collect()">Thu hoạch</button>
    <button class="btn ghost" onclick="hire()">Thuê</button>
    <button class="btn danger" onclick="upgrade()">Nâng cấp</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const params = new URLSearchParams(location.search);
const index = Number(params.get("index"));

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

const STORAGE_POS = {
  1: { top: "47%", left: "38%", ry:-38, rx:-20, rz:13 },
  2: { top: "47%", left: "38%", ry:-38, rx:-7, rz:13 },
  3: { top: "48%", left: "40%", ry:-12, rx:-8, rz:13 },
  4: { top: "48%", left: "40%", ry:-38, rx:-20, rz:13 },
  5: { top: "44%", left: "36%", ry:-19, rx:-3, rz:13 }
};



const CONTROL_POS = {
  1: { top:"35%", left:"60%" },
  2: { top:"36%", left:"62%" },
  3: { top:"34%", left:"58%" },
  4: { top:"33%", left:"60%" },
  5: { top:"30%", left:"57%" }
};



let factory = null;
let previewTimer = null;
let previewStored = 0;



socket.on("factory-update", list=>{
  factory = list[index];
  if(!factory) return;

  // reset preview theo dữ liệu mới nhất từ server
  previewStored = Number(factory.stored || 0);

  render();
  startPreviewTicker(); // ✅ bật realtime kho
});


socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


function computePreviewStored(){

  if(!factory) return 0;

  // nếu không hoạt động / không có worker -> đứng yên
  if(factory.active === false) return Number(factory.stored || 0);
  if(!factory.workers || factory.workers <= 0) return Number(factory.stored || 0);

  const stored   = Number(factory.stored || 0);
  const storage  = Number(factory.storage || 0);
  const lastUp   = Number(factory.lastUpdate || Date.now());

  const workers  = Number(factory.workers || 0);
  const baseRate = Number(factory.baseRate || 1);
  const rate     = Number(factory.rate ?? (workers * baseRate)) || 0;

  const sec = Math.floor((Date.now() - lastUp) / 1000);
  const value = stored + sec * rate;

  return Math.min(storage, value);
}


function startPreviewTicker(){

  if(previewTimer) clearInterval(previewTimer);

  previewTimer = setInterval(()=>{

    if(!factory) return;

    previewStored = computePreviewStored();

    // update UI kho + progress realtime (không cần render lại toàn bộ)
    const storage = Number(factory.storage || 1);
    const percent = storage > 0 ? (previewStored / storage) * 100 : 0;

    document.getElementById("storedVal").textContent =
      Math.floor(previewStored) + "/" + storage;

    document.getElementById("progressFill").style.width =
      Math.min(100, Math.max(0, percent)) + "%";

  }, 1000);
}




function render(){

  if(!factory) return;

  // ===== BASIC SAFE VALUES =====
  const level   = Math.max(1, Number(factory.level || 1));
  const workers = Math.max(0, Number(factory.workers || 0));
  const baseRate= Math.max(0, Number(factory.baseRate || 1));
  const storage = Math.max(1, Number(factory.storage || 1));
  const maxWorkers = Math.max(1, Number(factory.maxWorkers || 1));

  const rate = Number(factory.rate ?? (workers * baseRate)) || 0;

  const shownStored = Number(
    (typeof previewStored !== "undefined" ? previewStored : null)
      ?? factory.stored
      ?? 0
  );

  const percent = Math.min(
    100,
    Math.max(0, (shownStored / storage) * 100)
  );

  const active = factory.active !== false;

  // ===== TITLE =====
  const titleEl = document.getElementById("factoryTitle");
  if(titleEl){
    titleEl.textContent =
      "🏭 Nhà máy #" + factory.id + " (Lv." + level + ")";
  }

  // ===== IMAGE =====
  const MAX_FACTORY_IMG_LEVEL = 5;
  const displayLevel = Math.min(level, MAX_FACTORY_IMG_LEVEL);

  const img = document.getElementById("factoryImg");
  if(img){
    img.src = "/assets/ui/factory-lv" + displayLevel + ".png";
    img.onerror = () => {
      img.src = "/assets/ui/factory-lv5.png";
    };
  }

  // ===== STORAGE TEXT + PROGRESS =====
  const storedEl = document.getElementById("storedVal");
  if(storedEl){
    storedEl.textContent =
      Math.floor(shownStored) + "/" + storage;
  }

  const progressEl = document.getElementById("progressFill");
  if(progressEl){
    progressEl.style.width = percent + "%";
  }

  // ===== RATE =====
  const rateEl = document.getElementById("rateVal");
  if(rateEl){
    rateEl.textContent = rate + " 💎/s";
  }

  // ===== WORKERS =====
  const workerEl = document.getElementById("workerVal");
  if(workerEl){
    workerEl.textContent = workers + "/" + maxWorkers;
  }

  // ===== LEVEL =====
  const levelEl = document.getElementById("levelVal");
  if(levelEl){
    levelEl.textContent = level;
  }

  // ===== STATE =====
  const stateEl = document.getElementById("stateVal");
  if(stateEl){
    stateEl.textContent = active ? "Đang chạy" : "Tạm dừng";
  }

  const activeText = document.getElementById("activeText");
  if(activeText){
    activeText.textContent = active ? "ACTIVE" : "INACTIVE";
  }

  const dot = document.getElementById("activeDot");
  if(dot){
    dot.className = active ? "dot" : "dot off";
  }



  // ===== Control =====

  const ctrl = document.querySelector(".controlPanel");
if(ctrl){
  const cfg = CONTROL_POS[level] || CONTROL_POS[5];
  ctrl.style.top  = cfg.top;
  ctrl.style.left = cfg.left;
}



  // ===== AUTO POSITION STORAGE PANEL =====
  const panel = document.querySelector(".storagePanel");
  if(panel){

    const cfg = STORAGE_POS[level] || STORAGE_POS[5];

    panel.style.top  = cfg.top;
    panel.style.left = cfg.left;

    panel.style.transform = `
      perspective(800px)
      rotateY(${cfg.ry}deg)
      rotateX(${cfg.rx}deg)
      rotateZ(${cfg.rz}deg)
    `;
  }

  // ===== WORKERS =====
  renderWorkers();
}

function renderWorkers(){

  const layer = document.getElementById("factoryWorkers");
  if(!layer) return;

  layer.innerHTML = "";

  if(!factory) return;

  const workers = Number(factory.workers ?? 0);
  const count   = Math.min(workers, 6);

  for(let i=0;i<count;i++){

    const w = document.createElement("img");
    w.className = "worker";
    w.src = "/assets/ui/worker-bot.png";

    // lệch pha cho đẹp
    w.style.animationDelay = (i * 0.8) + "s";

    // tốc độ theo rate
    const rate = Number(factory.rate ?? 1);
    const speed = Math.max(4, 8 - rate * 0.2);
    w.style.animationDuration = speed + "s";

    layer.appendChild(w);
  }
}

function collect(){
  socket.emit("factory-collect",{ index });
}

function upgrade(){
  socket.emit("factory-upgrade",{ index });
}

function hire(){
  socket.emit("factory-hire-worker",{ index });
}

</script>
</body>
</html>
