<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết Nhà máy</title>
<link rel="stylesheet" href="/style.css">
<style>

:root{
  --bg0:#05080c;
  --bg1:#070c12;

  --stroke: rgba(0,240,255,.22);
  --stroke2: rgba(255,255,255,.08);
  --glow: rgba(0,240,255,.35);
  --txt:#eaf6ff;
  --muted: rgba(234,246,255,.65);
  --good:#00f0ff;
  --warn:#ffcc66;
  --bad:#ff4d4d;
  --r:20px;
  --safeTop: env(safe-area-inset-top, 0px);
  --safeBot: env(safe-area-inset-bottom, 0px);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  background:
    url("/assets/ui/factory-detail-bg.png")
    center top / cover
    no-repeat fixed;

  background-color:#05080c;
}

/* ===== TOPBAR (premium) ===== */
.topbar{
  position:absolute;   /* 🔥 overlay */
  top:0;
  left:0;
  right:0;
  z-index:100;

  padding: calc(14px + var(--safeTop)) 16px 14px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background: linear-gradient(
    180deg,
    rgba(0,0,0,.65),
    rgba(0,0,0,.35),
    rgba(0,0,0,0)
  );

  backdrop-filter: blur(10px);
  border:none;
}

.back{
  width:44px;
  height:44px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;

  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.10);
  box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 24px rgba(0,240,255,.12);
}






/* ===== HERO ===== */
.hero{
  position:relative;
  width:100%;
  margin: 0;            /* bỏ margin */
  border-radius:0;     /* bỏ bo góc nếu muốn full edge */
  overflow:hidden;
  border:none;         /* bỏ viền nếu muốn sát mép */
  box-shadow:none;     /* bỏ shadow nếu muốn phẳng */
  min-height: 100vh;
}

.factory-hero{
  display:block;
  width:100vw;          /* ✅ full ngang viewport */
  max-width:100%;
  height:70vh;        /* chỉnh tùy bạn */
  object-fit:contain;     /* ✅ ảnh cover full */
  object-position:center;
  transform:none;       /* ✅ bỏ scale để khỏi bị crop khó kiểm soát */
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 0%, rgba(0,240,255,.18), transparent 55%),
    linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.55));
  pointer-events:none;
}

.heroHUD{
  position:absolute;
  left:12px;
  right:12px;
  bottom:12px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}
.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.badge{
  padding:8px 10px;
  border-radius:14px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.2px;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.10);
}
.badge.good{
  border-color: rgba(0,240,255,.25);
  box-shadow: 0 0 26px rgba(0,240,255,.10);
}
.badge.warn{
  border-color: rgba(255,204,102,.25);
  box-shadow: 0 0 26px rgba(255,204,102,.08);
}

.statusDot{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  border-radius:14px;
  font-size:12px;
  font-weight:900;
  background: rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.10);
}
.dot{
  width:10px;height:10px;border-radius:999px;
  background: var(--good);
  box-shadow: 0 0 18px rgba(0,240,255,.65);
}
.dot.off{
  background: rgba(255,255,255,.28);
  box-shadow:none;
}

/* ===== YARD (workers) ===== */
.yard{
  position:relative;
  height:80px;
  border-radius: var(--r);
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 120%, rgba(0,240,255,.18), transparent 60%),
    linear-gradient(180deg, rgba(10,16,24,.70), rgba(4,8,13,.78));
  border:1px solid rgba(0,240,255,.18);
}
.yard::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px) 0 0/22px 22px,
    linear-gradient(0deg, rgba(255,255,255,.04) 1px, transparent 1px) 0 0/22px 22px;
  opacity:.25;
  pointer-events:none;
}
.yard::after{
  content:"";
  position:absolute;
  left:-40px; right:-40px; bottom:-60px;
  height:120px;
  background: radial-gradient(circle at 50% 0%, rgba(0,240,255,.20), transparent 60%);
  filter: blur(10px);
  opacity:.8;
  pointer-events:none;
}



.worker.inactive{
  animation:none;
  opacity:.35;
  filter: grayscale(1);
}



.tile{
  padding:12px 12px;
  border-radius:16px;
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35));
  border:1px solid rgba(255,255,255,.09);
}
.k{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.2px;
}
.vbig{
  margin-top:6px;
  font-size:18px;
  font-weight:1000;
  letter-spacing:.3px;
}
.vbig.good{ color: var(--good); text-shadow: 0 0 18px rgba(0,240,255,.25); }
.vbig.warn{ color: var(--warn); text-shadow: 0 0 18px rgba(255,204,102,.18); }

.progressWrap{
  margin-top:10px;
  height:12px;
  background: rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
}
#progressFill{
  height:100%;
  width:0%;
  background: linear-gradient(90deg, rgba(0,240,255,.95), rgba(0,140,255,.95));
  box-shadow: 0 0 26px rgba(0,240,255,.22);
  transition: .25s ease;
}





.factoryWorkers{
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.worker{
  position:absolute;
  left:0;
  top:50%;              /* điểm xuất phát dưới */
  width:42px;
  height:42px;
  object-fit:contain;

  animation: diagonalWalk linear infinite;
}

@keyframes diagonalWalk{

  /* xuất phát dưới trái */
  0%{
    transform: translate(-60px, 40px) scaleX(1);
    opacity:1;
  }

  /* chạy chéo lên */
  40%{
    transform: translate(20vw, -20px) scaleX(1);
    opacity:1;
  }

  /* tới cửa */
  50%{
    transform: translate(28vw, -60px) scaleX(1);
    opacity:0;
  }

  /* bên trong */
  55%{
    transform: translate(28vw, -60px) scaleX(-1);
    opacity:0;
  }

  /* đi ra */
  65%{
    transform: translate(20vw, -20px) scaleX(-1);
    opacity:1;
  }

  /* về lại dưới */
  100%{
    transform: translate(-60px, 40px) scaleX(-1);
    opacity:1;
  }
}


.storagePanel{
  position:absolute;
  width:46px;
  z-index:5;
  transform-origin: left center;
}

.storageBg{
  width:100%;
  display:block;
}

.storageText{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:14px;
}

.storageValue{
  font-size:18px;
  font-weight:1000;
  color:#00f0ff;
  text-shadow:0 0 18px rgba(0,240,255,.4);
}

.storageBar{
  margin-top:8px;
  width:100%;
  height:8px;
  background:rgba(255,255,255,.1);
  border-radius:999px;
  overflow:hidden;
}

.storageBar #progressFill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00f0ff,#008cff);
  box-shadow:0 0 18px rgba(0,240,255,.4);
}






.controlPanel{
  position:absolute;
  width:120px;
  z-index:6;
  transform-origin:center;

  filter:
  drop-shadow(0 15px 35px rgba(0,0,0,.5))
  drop-shadow(0 0 25px rgba(0,240,255,.15));

  
}

.controlBg{
  width:100%;
  display:block;
}

.controlText{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  padding:8px;
}

.controlLevel{
  font-size:16px;
  font-weight:1000;
  color:#00f0ff;
  text-shadow:0 0 18px rgba(0,240,255,.4);
}



.collectTruck{
  position:absolute;
  width:250px;
  cursor:pointer;
  z-index:8;
  transition:.25s ease;
}

.collectTruck:active{
  transform: scale(.95);
}

.truckImg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 10px 25px rgba(0,0,0,.6))
    drop-shadow(0 0 20px rgba(0,240,255,.25));
}




.supervisorBtn{
  position:absolute;
  width:130px;
  z-index:6;
  cursor:pointer;
  transition:.25s ease;
}

.supervisorBtn:active{
  transform: scale(.95);
}

.supervisorImg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 12px 30px rgba(0,0,0,.6))
    drop-shadow(0 0 25px rgba(0,240,255,.25));
}





.upgradeBtn{
  position:absolute;
  width: 120px;
  z-index:7;
  cursor:pointer;
  transition:.25s ease;
  
}

.upgradeBtn:active{
  transform: scale(.95);
}

.upgradeImg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 12px 30px rgba(0,0,0,.6))
    drop-shadow(0 0 25px rgba(0,240,255,.25));
  transform: scaleX(-1);
}





.ratePanel{
  position:absolute;
  width:170px;
  z-index:8;
  pointer-events:none;
}

.rateBg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 12px 30px rgba(0,0,0,.6))
    drop-shadow(0 0 20px rgba(0,240,255,.25));
}

.rateText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0px;
  font-weight:1000;
  font-size: 12px;
  color:#00f0ff;
  text-shadow:0 0 18px rgba(0,240,255,.5);
  right:-20px;
  top:4px;
}

.rateText .unit{
  font-size:14px;
  opacity:.9;
}



.workerPanel{
  position:absolute;
  width:170px;
  z-index:7;
  pointer-events:none;
}

.workerBg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 12px 30px rgba(0,0,0,.6))
    drop-shadow(0 0 20px rgba(255,204,102,.25));
}

.workerText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:16px;
  color:#ffcc66;
  text-shadow:0 0 18px rgba(255,204,102,.5);
  right:-45px;
  top:4px;
}





.coinPanel{
  position:absolute;
  width:165px;
  z-index:9;
  pointer-events:none;
}

.coinBg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 15px 35px rgba(0,0,0,.6))
    drop-shadow(0 0 25px rgba(0,240,255,.25));
}

.coinText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:12px;
  color:#00f0ff;
  text-shadow:0 0 20px rgba(0,240,255,.5);
  right: -30px;
}





.backBtn{
  position:absolute;
  width:110px;
  z-index:20;
  cursor:pointer;
  transition:.25s ease;
}

.backBtn:active{
  transform:scale(.92);
}

.backImg{
  width:100%;
  display:block;
  filter:
    drop-shadow(0 15px 35px rgba(0,0,0,.6))
    drop-shadow(0 0 20px rgba(0,240,255,.25));
}










/* =========================
   🔥 UPGRADE MODAL STYLE
   ========================= */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.overlay.show{
  display:flex;
}

.upgradeModalBox{
  width:340px;
  border-radius:22px;
  padding:22px;

  background:
    radial-gradient(circle at 50% 0%, rgba(0,240,255,.15), transparent 60%),
    linear-gradient(180deg, rgba(10,20,30,.95), rgba(4,8,13,.95));

  border:1px solid rgba(0,240,255,.25);

  box-shadow:
    0 0 50px rgba(0,240,255,.2),
    0 20px 60px rgba(0,0,0,.8);

  color:#eaf6ff;
}

.upgradeTitle{
  text-align:center;
  font-weight:1000;
  font-size:18px;
  margin-bottom:18px;
  letter-spacing:1px;
  color:#00f0ff;
  text-shadow:0 0 25px rgba(0,240,255,.6);
}

.uRow{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:14px;
}

.uRow.next b{
  color:#00f0ff;
  text-shadow:0 0 15px rgba(0,240,255,.4);
}

.uCost{
  margin-top:16px;
  text-align:center;
  font-weight:900;
  color:#ffcc66;
  text-shadow:0 0 18px rgba(255,204,102,.4);
}

.uActions{
  display:flex;
  gap:12px;
  margin-top:22px;
}

.uBtn{
  flex:1;
  padding:12px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
  border:none;
  transition:.25s ease;
}

.uBtn.cancel{
  background:rgba(255,255,255,.1);
  color:#fff;
}

.uBtn.confirm{
  background:linear-gradient(90deg,#00f0ff,#008cff);
  color:#001018;
}

.uBtn:active{
  transform:scale(.95);
}





/* =========================
   🔥 FIRE MODE LEVEL 10
   ========================= */

.fireOverlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  pointer-events:none;
}

.fireOverlay.show{
  display:flex;
  animation: screenShake .4s ease infinite alternate;
}

.fireGlow{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,80,0,.6), transparent 60%),
    linear-gradient(180deg, rgba(255,0,0,.25), rgba(0,0,0,.7));
  mix-blend-mode:screen;
  animation: firePulse 1.2s ease-in-out infinite;
}

.fireText{
  position:relative;
  font-size:22px;
  font-weight:1000;
  color:#ff4d4d;
  text-shadow:
    0 0 25px rgba(255,0,0,.8),
    0 0 50px rgba(255,100,0,.6);
  letter-spacing:2px;
}

@keyframes firePulse{
  0%{ opacity:.8 }
  50%{ opacity:1 }
  100%{ opacity:.8 }
}

@keyframes screenShake{
  from{ transform:translate(-1px,0) }
  to{ transform:translate(1px,0) }
}




.repairBtn{
  position:absolute;
  width:20px;
  bottom:-180px;
  left:12%;
  z-index:60;
  display:none;
  cursor:pointer;
  transform: scale(0.2);
}

.repairBtn.show{
  display:block;
}



</style>
</head>

const SUPERVISOR_POS = {
  1: { top:"74%", left:"-3%", scale:0.9 },
  2: { top:"74%", left:"-3%", scale:0.9 },
  3: { top:"74%", left:"-3%", scale:0.9 },
  4: { top:"74%", left:"-3%", scale:0.9 },
  5: { top:"74%", left:"-3%", scale:0.9 }
};




const TRUCK_POS = {
  1: { top:"76%", left:"20%" },
  2: { top:"76%", left:"20%" },
  3: { top:"76%", left:"20%" },
  4: { top:"76%", left:"20%" },
  5: { top:"76%", left:"20%" }
};




const STORAGE_POS = {
  1: { top: "33%", left: "38%", ry:-38, rx:-20, rz:13 },
  2: { top: "33%", left: "38%", ry:-38, rx:-7, rz:13 },
  3: { top: "33%", left: "40%", ry:-12, rx:-8, rz:13 },
  4: { top: "33%", left: "40%", ry:-38, rx:-20, rz:13 },
  5: { top: "31%", left: "36%", ry:-19, rx:-3, rz:13 }
};



const CONTROL_POS = {
  1: { top:"0%", left:"75%", ry:0, rx: 0, rz:0, scale:0.8 },
  2: { top:"0%", left:"75%", ry:0, rx: 0, rz:0, scale:0.8 },
  3: { top:"0%", left:"75%", ry:0, rx: 0, rz:0, scale:0.8 },
  4: { top:"0%", left:"75%", ry:0, rx: 0, rz:0, scale:0.8 },
  5: { top:"0%", left:"75%", ry:0, rx: 0, rz:0, scale:0.8 }
};


let factory = null;
let previewTimer = null;
let previewStored = 0;



socket.on("factory-update", list=>{
  factory = list[index];
  if(!factory) return;

  // reset preview theo dữ liệu mới nhất từ server
  previewStored = Number(factory.stored || 0);

  render();
  startPreviewTicker(); // ✅ bật realtime kho
});


socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


function computePreviewStored(){

  if(!factory) return 0;

  // nếu không hoạt động / không có worker -> đứng yên
  if(factory.burned === true)
  return Number(factory.stored || 0);
  if(!factory.workers || factory.workers <= 0) return Number(factory.stored || 0);

  const stored   = Number(factory.stored || 0);
  const storage  = Number(factory.storage || 0);
  const lastUp   = Number(factory.lastUpdate || Date.now());

  const workers  = Number(factory.workers || 0);
  const baseRate = Number(factory.baseRate || 1);
  const rate     = Number(factory.rate ?? (workers * baseRate)) || 0;

  const sec = Math.floor((Date.now() - lastUp) / 1000);
  const value = stored + sec * rate;

  return Math.min(storage, value);
}


function startPreviewTicker(){

  if(previewTimer) clearInterval(previewTimer);

  previewTimer = setInterval(()=>{

    if(!factory) return;

    previewStored = computePreviewStored();

    // update UI kho + progress realtime (không cần render lại toàn bộ)
    const storage = Number(factory.storage || 1);
    const percent = storage > 0 ? (previewStored / storage) * 100 : 0;

    document.getElementById("storedVal").textContent =
      Math.floor(previewStored) + "/" + storage;

    document.getElementById("progressFill").style.width =
      Math.min(100, Math.max(0, percent)) + "%";

  }, 1000);
}




function render(){

  if(!factory) return;

  // ===== BASIC SAFE VALUES =====
  const level   = Math.max(1, Number(factory.level || 1));
  const workers = Math.max(0, Number(factory.workers || 0));
  const baseRate= Math.max(0, Number(factory.baseRate || 1));
  const storage = Math.max(1, Number(factory.storage || 1));
  const maxWorkers = Math.max(1, Number(factory.maxWorkers || 1));

  const rate = Number(factory.rate ?? (workers * baseRate)) || 0;

  const shownStored = Number(
    (typeof previewStored !== "undefined" ? previewStored : null)
      ?? factory.stored
      ?? 0
  );

  const percent = Math.min(
    100,
    Math.max(0, (shownStored / storage) * 100)
  );

  const burned = factory.burned === true;
  const active = !burned && factory.active !== false;


  // ===== IMAGE =====
  const MAX_FACTORY_IMG_LEVEL = 5;
  const displayLevel = Math.min(level, MAX_FACTORY_IMG_LEVEL);

  const img = document.getElementById("factoryImg");

if(img){

  if(factory.burned === true){

    img.src = "/assets/factory/factory-burned.png";

    // bật overlay + repair khi reload
    document.getElementById("fireOverlay")
      ?.classList.add("show");

    document.getElementById("repairBtn")
      ?.classList.add("show");

  }else{

    img.src = "/assets/ui/factory-lv" + displayLevel + ".png";
    img.onerror = () => {
      img.src = "/assets/ui/factory-lv5.png";
    };

    document.getElementById("fireOverlay")
      ?.classList.remove("show");

    document.getElementById("repairBtn")
      ?.classList.remove("show");
  }
}




 // ===== Back =====

  const back = document.querySelector(".backBtn");
if(back){
  const cfg = BACK_POS[level] || BACK_POS[5];

  back.style.top  = cfg.top;
  back.style.left = cfg.left;
  back.style.transform = `scale(${cfg.scale})`;
}



 // ===== Coin Panel =====

const coin = document.querySelector(".coinPanel");
if(coin){
  const cfg = COIN_POS[level] || COIN_POS[5];

  coin.style.top  = cfg.top;
  coin.style.left = cfg.left;
  coin.style.transform = `scale(${cfg.scale})`;
}
  


 // ===== Worker Panel =====


  const workerPanel = document.querySelector(".workerPanel");
if(workerPanel){
  const cfg = WORKER_POS[level] || WORKER_POS[5];

  workerPanel.style.top  = cfg.top;
  workerPanel.style.left = cfg.left;
  workerPanel.style.transform = `scale(${cfg.scale})`;
}

 // ===== Rate =====

  const ratePanel = document.querySelector(".ratePanel");
if(ratePanel){
  const cfg = RATE_POS[level] || RATE_POS[5];

  ratePanel.style.top  = cfg.top;
  ratePanel.style.left = cfg.left;
  ratePanel.style.transform = `scale(${cfg.scale})`;
}




  // ===== Upgrade =====
const up = document.querySelector(".upgradeBtn");
if(up){
  const cfg = UPGRADE_POS[level] || UPGRADE_POS[5];

  up.style.top  = cfg.top;
  up.style.left = cfg.left;
  up.style.transform = `scale(${cfg.scale})`;
}



// ===== super visor=====

  const sup = document.querySelector(".supervisorBtn");
if(sup){
  const cfg = SUPERVISOR_POS[level] || SUPERVISOR_POS[5];

  sup.style.top  = cfg.top;
  sup.style.left = cfg.left;
  sup.style.transform = `scale(${cfg.scale})`;
}



// ===== Truck=====
  const truck = document.querySelector(".collectTruck");
if(truck){
  const cfg = TRUCK_POS[level] || TRUCK_POS[5];
  truck.style.top  = cfg.top;
  truck.style.left = cfg.left;
}


  // ===== STORAGE TEXT + PROGRESS =====
  const storedEl = document.getElementById("storedVal");
  if(storedEl){
    storedEl.textContent =
      Math.floor(shownStored) + "/" + storage;
  }

  const progressEl = document.getElementById("progressFill");
  if(progressEl){
    progressEl.style.width = percent + "%";
  }

  // ===== RATE =====
  const rateEl = document.getElementById("rateVal");
  if(rateEl){
    rateEl.textContent = rate + " 💎/s";
  }

  // ===== WORKERS =====
  const workerEl = document.getElementById("workerVal");
  if(workerEl){
    workerEl.textContent = workers + "/" + maxWorkers;
  }

  // ===== LEVEL =====
  const levelEl = document.getElementById("levelVal");
  if(levelEl){
    levelEl.textContent = level;
  }

  // ===== STATE =====

  const activeText = document.getElementById("activeText");
  if(activeText){
    if(burned){
  activeText.textContent = "BURNED";
}else{
  activeText.textContent = active ? "ACTIVE" : "INACTIVE";
}
  }

  const dot = document.getElementById("activeDot");
  if(dot){
    dot.className = (!burned && active) ? "dot" : "dot off";
  }



  // ===== Control =====

const ctrl = document.querySelector(".controlPanel");
if(ctrl){

  const cfg = CONTROL_POS[level] || CONTROL_POS[5];

  ctrl.style.top  = cfg.top;
  ctrl.style.left = cfg.left;

  ctrl.style.transform = `
    perspective(800px)
    rotateY(${cfg.ry}deg)
    rotateX(${cfg.rx}deg)
    rotateZ(${cfg.rz}deg)
    scale(${cfg.scale})
  `;
}



  // ===== AUTO POSITION STORAGE PANEL =====
  const panel = document.querySelector(".storagePanel");
  if(panel){

    const cfg = STORAGE_POS[level] || STORAGE_POS[5];

    panel.style.top  = cfg.top;
    panel.style.left = cfg.left;

    panel.style.transform = `
      perspective(800px)
      rotateY(${cfg.ry}deg)
      rotateX(${cfg.rx}deg)
      rotateZ(${cfg.rz}deg)
    `;
  }

  // ===== WORKERS =====
  renderWorkers();
}

function renderWorkers(){

  const layer = document.getElementById("factoryWorkers");
  if(!layer) return;

  layer.innerHTML = "";

  if(!factory) return;

  if(factory.burned) return;

  const workers = Number(factory.workers ?? 0);
  const count   = Math.min(workers, 6);

  for(let i=0;i<count;i++){

    const w = document.createElement("img");
    w.className = "worker";
    w.src = "/assets/ui/worker-bot.png";

    // lệch pha cho đẹp
    w.style.animationDelay = (i * 0.8) + "s";

    // tốc độ theo rate
    const rate = Number(factory.rate ?? 1);
    const speed = Math.max(4, 8 - rate * 0.2);
    w.style.animationDuration = speed + "s";

    layer.appendChild(w);
  }
}

function collect(){

  if(factory?.burned){
    alert("Factory is burned!");
    return;
  }

  socket.emit("factory-collect",{ index });
}



function hire(){


  if(factory?.burned){
  alert("Factory is burned!");
  return;
}

  if(!factory) return;

  const workers = Number(factory.workers || 0);
  const maxWorkers = Number(factory.maxWorkers || 1);

  if(workers >= maxWorkers){
    alert("Max workers reached");
    return;
  }

  const nextWorkers = workers + 1;

  // 🔥 giá thuê (bạn chỉnh theo server nếu khác)
 const cost = factory.workerCost || 150;

  document.getElementById("hWorkerNow").textContent =
    workers + "/" + maxWorkers;

  document.getElementById("hWorkerNext").textContent =
    nextWorkers + "/" + maxWorkers;

  document.getElementById("hCost").textContent = cost;

  document.getElementById("hireModal")
    .classList.add("show");
}



function closeHire(){
  document.getElementById("hireModal")
    .classList.remove("show");
}

function confirmHire(){
  socket.emit("factory-hire-worker",{ index });
  closeHire();
}


function upgrade(){

if(factory?.burned){
  alert("Factory is burned!");
  return;
}


  const level = Number(
    document.getElementById("levelVal").textContent
  );

  const workerText = document.getElementById("workerVal").textContent;
  const maxWorkers = Number(workerText.split("/")[1] || 1);

  const nextLevel = level + 1;
  const nextMaxWorkers = maxWorkers + 1;

  const cost = level * 300;

  document.getElementById("uLevelNow").textContent = level;
  document.getElementById("uLevelNext").textContent = nextLevel;

  document.getElementById("uWorkerNow").textContent = maxWorkers;
  document.getElementById("uWorkerNext").textContent = nextMaxWorkers;

  document.getElementById("uCost").textContent = cost;

  document.getElementById("upgradeModal")
    .classList.add("show");
}

function closeUpgrade(){
  document.getElementById("upgradeModal")
    .classList.remove("show");
}

function confirmUpgrade(){

  const cost = Number(
    document.getElementById("uCost").textContent
  );

  socket.emit("factory-upgrade",{
    index
  });

  closeUpgrade();
}


socket.on("factory-error",(d)=>{
  alert(d.message);
});



socket.on("factory-fire",(data)=>{


   if(data.index !== index) return;

  activateFireMode();


  alert("FACTORY BURNED!");

  document.getElementById("activeDot")
    .classList.add("off");

  document.getElementById("activeText")
    .textContent = "BURNED";

});


function activateFireMode(){

  factory.burned = true;

  // đổi ảnh
  document.getElementById("factoryImg")
    .src = "/assets/factory/factory-burned.png";

  // hiện overlay
  document.getElementById("fireOverlay")
    .classList.add("show");

  // đổi status
  document.getElementById("activeText")
    .textContent = "BURNED";

  document.getElementById("activeDot")
    .classList.add("off");

  // xoá worker
  document.getElementById("factoryWorkers")
    .innerHTML = "";


// repair
  document.getElementById("repairBtn")
  .classList.add("show");  
}


function repairFactory(){
  socket.emit("factory-repair",{ index });
}

socket.on("factory-repaired",(data)=>{
  if(data.index !== index) return;
  location.reload();
});
