<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chi tiết Nhà máy</title>
<link rel="stylesheet" href="/style.css">
<style>

body{
  margin:0;
  background:#05080c;
  color:#fff;
  font-family:system-ui;
}

/* HEADER */
.topbar{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:linear-gradient(180deg,#0b0f14,#05080c);
  border-bottom:1px solid rgba(0,255,255,.15);
}

.back{
  cursor:pointer;
  font-size:20px;
}

.wallet{
  font-weight:800;
  color:#00f0ff;
}

/* MAIN */
.container{
  padding:20px;
}

.factory-hero{
  width:100%;
  border-radius:18px;
  margin-bottom:20px;
}

.stat-box{
  background:#0a1016;
  border:1px solid rgba(0,255,255,.2);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.progress{
  height:12px;
  background:rgba(255,255,255,.08);
  border-radius:8px;
  overflow:hidden;
  margin-top:10px;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,#00f0ff,#00aaff);
  transition:.3s;
}

.btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:700;
  margin-top:10px;
  cursor:pointer;
}

.btn-primary{
  background:linear-gradient(180deg,#00f0ff,#0088ff);
}

.btn-danger{
  background:linear-gradient(180deg,#ff5050,#aa0000);
}


/* ===== WORKER YARD ===== */

.yard{
  position:relative;
  height:140px;
  border-radius:18px;
  margin-bottom:20px;
  background:
    radial-gradient(circle at 50% 100%, rgba(0,255,255,.15), transparent 60%),
    linear-gradient(180deg,#071018,#04080d);
  border:1px solid rgba(0,255,255,.2);
  overflow:hidden;
}

.worker{
  position:absolute;
  bottom:10px;
  width:36px;
  height:36px;
  filter: drop-shadow(0 0 8px rgba(0,255,255,.7));
  animation: walk linear infinite;
}

@keyframes walk{
  0%   { transform: translateX(-40px) scaleX(1); }
  49%  { transform: translateX(calc(100% + 40px)) scaleX(1); }
  50%  { transform: translateX(calc(100% + 40px)) scaleX(-1); }
  99%  { transform: translateX(-40px) scaleX(-1); }
  100% { transform: translateX(-40px) scaleX(1); }
}

/* inactive state */
.worker.inactive{
  animation:none;
  opacity:.4;
  filter: grayscale(1);
}


</style>
</head>
<body>

<div class="topbar">
  <div class="back" onclick="location.href='/game-diamond-factory.html'">←</div>
  <div id="factoryTitle">Nhà máy</div>
  <div class="wallet"><span id="coinVal">0</span> 💎</div>
</div>

<div class="container">

  <img id="factoryImg" class="factory-hero">

<div class="yard" id="yard"></div>

  <div class="stat-box">
    <div>📦 Kho: <span id="storedVal">0</span></div>
    <div class="progress">
      <div class="fill" id="progressFill"></div>
    </div>
  </div>

  <div class="stat-box">
    <div>⚡ Tốc độ: <span id="rateVal"></span></div>
    <div>👷 Công nhân: <span id="workerVal"></span></div>
  </div>

  <button class="btn btn-primary" onclick="collect()">Thu hoạch</button>
  <button class="btn btn-danger" onclick="upgrade()">Nâng cấp</button>
  <button class="btn" onclick="hire()">Thuê công nhân</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const params = new URLSearchParams(location.search);
const index = Number(params.get("index"));

const socket = io({
  auth:{
    uid: JSON.parse(localStorage.getItem("user_profile")||"{}").uid,
    deviceId: localStorage.getItem("device_id")
  }
});

let factory = null;
let previewTimer = null;
let previewStored = 0;


socket.on("factory-update", list=>{
  factory = list[index];
  if(!factory) return;

  // reset preview theo dữ liệu mới nhất từ server
  previewStored = Number(factory.stored || 0);

  render();
  startPreviewTicker(); // ✅ bật realtime kho
});


socket.on("coin-update", d=>{
  document.getElementById("coinVal").textContent =
    Math.floor(d.coins || 0);
});


function computePreviewStored(){

  if(!factory) return 0;

  // nếu không hoạt động / không có worker -> đứng yên
  if(factory.active === false) return Number(factory.stored || 0);
  if(!factory.workers || factory.workers <= 0) return Number(factory.stored || 0);

  const stored   = Number(factory.stored || 0);
  const storage  = Number(factory.storage || 0);
  const lastUp   = Number(factory.lastUpdate || Date.now());

  const workers  = Number(factory.workers || 0);
  const baseRate = Number(factory.baseRate || 1);
  const rate     = Number(factory.rate ?? (workers * baseRate)) || 0;

  const sec = Math.floor((Date.now() - lastUp) / 1000);
  const value = stored + sec * rate;

  return Math.min(storage, value);
}


function startPreviewTicker(){

  if(previewTimer) clearInterval(previewTimer);

  previewTimer = setInterval(()=>{

    if(!factory) return;

    previewStored = computePreviewStored();

    // update UI kho + progress realtime (không cần render lại toàn bộ)
    const storage = Number(factory.storage || 1);
    const percent = storage > 0 ? (previewStored / storage) * 100 : 0;

    document.getElementById("storedVal").textContent =
      Math.floor(previewStored) + "/" + storage;

    document.getElementById("progressFill").style.width =
      Math.min(100, Math.max(0, percent)) + "%";

  }, 1000);
}




function render(){

  if(!factory) return;

  // ===== TITLE =====
  const level = Number(factory.level || 1);
  document.getElementById("factoryTitle").textContent =
    "🏭 Nhà máy #" + factory.id + " (Lv." + level + ")";

  // ===== IMAGE (clamp max lv5) =====
  const MAX_FACTORY_IMG_LEVEL = 5;
  const displayLevel = Math.min(level, MAX_FACTORY_IMG_LEVEL);

  const img = document.getElementById("factoryImg");
  img.src = "/assets/ui/factory-lv" + displayLevel + ".png";
  img.onerror = () => {
    img.src = "/assets/ui/factory-lv5.png";
  };

  // ===== STORED + PROGRESS (prefer previewStored) =====
  const storage = Math.max(1, Number(factory.storage || 1));
  const shownStored = Number(
    (typeof previewStored !== "undefined" ? previewStored : null)
      ?? factory.stored
      ?? 0
  );

  const percent = Math.min(
    100,
    Math.max(0, (shownStored / storage) * 100)
  );

  document.getElementById("storedVal").textContent =
    Math.floor(shownStored) + "/" + storage;

  document.getElementById("progressFill").style.width =
    percent + "%";

  // ===== RATE (no NaN) =====
  const workers  = Math.max(0, Number(factory.workers || 0));
  const baseRate = Math.max(0, Number(factory.baseRate || 1));
  const rate     = Number(factory.rate ?? (workers * baseRate)) || 0;

  document.getElementById("rateVal").textContent =
    rate + " 💎/s";

  // ===== WORKERS DISPLAY =====
  const maxWorkers = Math.max(1, Number(factory.maxWorkers || 1));
  document.getElementById("workerVal").textContent =
    workers + "/" + maxWorkers;

  // ===== WORKER ANIM =====
  renderWorkers();
}


function renderWorkers(){

  const yard = document.getElementById("yard");
  yard.innerHTML = "";

  if(!factory) return;

  // ✅ ÉP KIỂU an toàn (tránh NaN)
  const workers  = Number(factory.workers ?? 0);
  const baseRate = Number(factory.baseRate ?? 1);

  // ✅ ưu tiên rate nếu server có, fallback nếu thiếu
  const rate = Number(factory.rate ?? (workers * baseRate)) || 0;

  const count = Math.min(Math.max(0, workers), 8);

  for(let i=0;i<count;i++){

    const w = document.createElement("img");
    w.className = "worker";
    w.src = "/assets/ui/worker-bot.png";

    // vị trí xuất phát
    w.style.left = (i * 30) + "px";

    // ✅ tốc độ phụ thuộc rate nhưng luôn ra số hợp lệ
    const speedBase = 6;
    const speed = Math.max(2, speedBase - (rate * 0.2));
    w.style.animationDuration = speed + "s";

    if(factory.active === false){
      w.classList.add("inactive");
    }

    yard.appendChild(w);
  }
}

function collect(){
  socket.emit("factory-collect",{ index });
}

function upgrade(){
  socket.emit("factory-upgrade",{ index });
}

function hire(){
  socket.emit("factory-hire-worker",{ index });
}

</script>
</body>
</html>
