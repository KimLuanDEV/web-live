<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🎡 Vòng quay may mắn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .wheel-wrap{
      position:relative;
      width:260px;
      height:260px;
    }

.wheel{
  width:100%;
  height:100%;
  border-radius:50%;

  background:
    conic-gradient(
      #ff3d00 0deg 60deg,      /* x0 */
      #9e9e9e 60deg 120deg,   /* x0.5 */
      #4caf50 120deg 180deg,  /* x1 */
      #03a9f4 180deg 240deg,  /* x2 */
      #ffc107 240deg 300deg, /* x5 */
      #e91e63 300deg 360deg  /* x10 */
    );

  box-shadow:
    0 0 45px rgba(255,200,0,.45),
    inset 0 0 25px rgba(0,0,0,.65);

  transition: transform 4s cubic-bezier(.17,.67,.14,1);
}



    .pointer{
      position:absolute;
      top:-18px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-bottom:26px solid #ffd700;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.6));
    }

    .spin-btn{
      margin-top:24px;
      padding:14px 28px;
      font-size:16px;
      font-weight:700;
      border:none;
      border-radius:999px;
      cursor:pointer;
      background:linear-gradient(180deg,#ffd700,#ff9800);
      color:#000;
      box-shadow:0 6px 20px rgba(255,200,0,.5);
    }

    .spin-btn:active{
      transform:scale(.95);
    }

    .result{
      margin-top:16px;
      font-size:15px;
      opacity:.9;
    }

    /* ================= GAME HEADER ================= */

.game-header{
  position: fixed;        /* 🔒 CỐ ĐỊNH TRÊN CÙNG */
  top: 0;
  left: 0;
  right: 0;
  z-index: 999;

  height: 64px;
  padding: 0 12px;

  display: grid;
  grid-template-columns: 48px 1fr 48px;
  align-items: center;

  background: linear-gradient(
    180deg,
    rgba(0,0,0,.9),
    rgba(0,0,0,.7)
  );

  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}

/* LEFT */
.gh-left{
  display:flex;
  align-items:center;
}

.gh-back{
  width:40px;
  height:40px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.gh-back:active{
  transform: scale(.92);
}

/* CENTER */
.gh-center{
  text-align:center;
  pointer-events:none;
}

.gh-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:.3px;
}

.gh-sub{
  font-size:12px;
  opacity:.7;
}

/* RIGHT */
.gh-right{
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.gh-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:16px;
}



/* ===== HEADER DIAMOND ===== */
.gh-coin{
  display:flex;
  align-items:center;
  gap:6px;

  padding:6px 10px;
  border-radius:999px;

  font-size:14px;
  font-weight:700;

  background:rgba(255,255,255,.08);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}


/* ================= DIAMOND FLY EFFECT ================= */

.fly-diamond{
  position: fixed;
  z-index: 2000;
  font-size: 18px;
  font-weight: 800;
  pointer-events: none;

  animation: flyToHeader 0.9s ease-out forwards;
}

@keyframes flyToHeader{
  0%{
    transform: translate(0,0) scale(1);
    opacity: 1;
  }
  80%{
    opacity: 1;
  }
  100%{
    transform: translate(var(--dx), var(--dy)) scale(0.4);
    opacity: 0;
  }
}


/* ================= BET PANEL ENHANCE ================= */

.invest-action{
  background: rgba(255,255,255,.04);
  border-radius: 18px;
  padding: 16px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.06),
    0 10px 30px rgba(0,0,0,.5);
}

/* QUICK ADD 3 CỘT */
.coin-quick.grid-3{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* BUTTON STYLE */
.coin-quick button,
.coin-ratio button,
.coin-reset-only button{
  height: 38px;
  border-radius: 10px;
  border: none;
  cursor: pointer;

  background: rgba(255,255,255,.08);
  color: #fff;
  font-weight: 700;
  font-size: 13px;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.08);
}

.coin-quick button:active,
.coin-ratio button:active,
.spin-btn:active{
  transform: scale(.96);
}

/* ALL IN nổi bật hơn */
.coin-ratio .all-in{
  background: linear-gradient(180deg,#ff5252,#ff1744);
  box-shadow: 0 6px 18px rgba(255,80,80,.5);
}

/* RESET */
.coin-reset-only{
  margin-top: 10px;
  text-align: center;
}

.coin-reset-only .key-clear{
  background: rgba(255,80,80,.15);
  color: #ff8080;
}



/* ================= BET BAR FIXED BOTTOM ================= */

.bet-bar{
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 998;

  padding: 10px 10px env(safe-area-inset-bottom);
  background: linear-gradient(
    180deg,
    rgba(0,0,0,0),
    rgba(0,0,0,.9)
  );
}


.bet-sheet{
  width: 100%;          /* 🔥 FULL WIDTH */
  margin: 0;

  background: rgba(20,20,20,.96);
  border-radius: 18px 18px 0 0;
  padding: 14px;

  box-shadow:
    0 -10px 30px rgba(0,0,0,.6),
    inset 0 0 0 1px rgba(255,255,255,.06);
}


/* ĐẨY BODY LÊN ĐỂ KHÔNG BỊ CHE */
body{
  padding-bottom: 260px;
}

/* COIN DISPLAY */
.bet-sheet .coin-display{
  margin-bottom: 10px;
}

/* RATIO */
.bet-sheet .coin-ratio{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 10px;
}

/* QUICK ADD 3 CỘT */
.coin-quick.grid-3{
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-bottom: 10px;
}

/* RESET */
.coin-reset-only{
  text-align: center;
  margin-bottom: 10px;
}

/* SPIN BUTTON FULL WIDTH */
.bet-sheet .spin-btn{
  width: 100%;
  margin-top: 6px;
  height: 46px;
  font-size: 16px;
}

/* RESULT */
.bet-sheet .result{
  text-align: center;
  margin-top: 6px;
  font-size: 14px;
  opacity: .85;
}



/* ================= COIN DISPLAY ENHANCED ================= */

.coin-display{
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 14px 16px;
  border-radius: 16px;

  background: linear-gradient(
    135deg,
    rgba(120,180,255,.18),
    rgba(60,120,255,.08)
  );

  box-shadow:
    inset 0 0 0 1px rgba(120,180,255,.25),
    0 6px 20px rgba(0,0,0,.4);

  margin-bottom: 12px;
}

/* LEFT TEXT */
.coin-left{
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.coin-label{
  font-size: 12px;
  letter-spacing: .4px;
  opacity: .7;
}

/* BIG NUMBER */
.coin-value{
  font-size: 26px;
  font-weight: 900;
  line-height: 1;
  letter-spacing: .5px;
}

/* ICON */
.coin-icon{
  font-size: 28px;
  filter: drop-shadow(0 0 8px rgba(120,180,255,.6));
}


  </style>
</head>

<body>

<header class="game-header">
  <!-- LEFT -->
  <div class="gh-left">
    <button class="gh-back" onclick="history.back()">←</button>
  </div>

  <!-- CENTER -->
  <div class="gh-center">
    <div class="gh-title">Vòng quay may mắn</div>
    <div class="gh-sub">Luck Wheel • Mini Game</div>
  </div>

  <!-- RIGHT -->
<div class="gh-right">
  <div class="gh-coin" id="diamondDisplay">
    💎 <span id="diamondValue">0</span>
  </div>
</div>



</header>



  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div id="wheel" class="wheel"></div>
  </div>




<!-- 💎 BET BAR (FIXED BOTTOM – FULL WIDTH) -->
<div class="bet-bar">

  <div class="bet-sheet">

<!-- COIN DISPLAY (ENHANCED) -->
<div class="coin-display">
  <div class="coin-left">
    <div class="coin-label">Vốn cược</div>
    <div class="coin-value">
      <span id="betDisplay">0</span>
    </div>
  </div>

  <div class="coin-icon">💎</div>
</div>

    <!-- RATIO -->
    <div class="coin-ratio">
      <button onclick="setBetRatio(0.25)">25%</button>
      <button onclick="setBetRatio(0.5)">50%</button>
      <button class="all-in" onclick="setBetRatio(1)">ALL IN</button>
    </div>

    <!-- QUICK ADD (3 CỘT) -->
    <div class="coin-quick grid-3">
      <button onclick="addBet(10)">+10</button>
      <button onclick="addBet(50)">+50</button>
      <button onclick="addBet(100)">+100</button>

      <button onclick="addBet(500)">+500</button>
      <button onclick="addBet(1000)">+1K</button>
      <button onclick="addBet(5000)">+5K</button>
    </div>

    <!-- RESET -->
    <div class="coin-reset-only">
      <button class="key-clear" onclick="resetBet()">RESET</button>
    </div>

    <!-- ACTION -->
    <button class="spin-btn" id="btnSpin" onclick="spinWheel()">
      🎡 QUAY
    </button>

    <div id="result" class="result"></div>

  </div>
</div>




<script src="/socket.io/socket.io.js"></script>
<script src="/game-wheel.js"></script>

</body>
</html>
