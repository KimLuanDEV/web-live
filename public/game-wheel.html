<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🎡 Vòng quay may mắn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .wheel-wrap{
      position:relative;
      width:260px;
      height:260px;
    }

.wheel{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;

  box-shadow:
    0 0 45px rgba(255,200,0,.45),
    inset 0 0 25px rgba(0,0,0,.65);

  transition: transform 4s cubic-bezier(.17,.67,.14,1);
}

/* slice chung */
.slice{
  position:absolute;
  width:100%;
  height:100%;
  clip-path: polygon(50% 50%, 100% 0, 100% 100%);
  transform-origin:50% 50%;
  background-size:80px;
  background-repeat:no-repeat;
  background-position:65% 35%;
}

/* từng slice = từng hệ số */
.s0{
  transform:rotate(0deg);
  background-color:#ff3d00;
  background-image:url("/assets/wheel/x0.png");
}

.s1{
  transform:rotate(60deg);
  background-color:#9e9e9e;
  background-image:url("/assets/wheel/x0_5.png");
}

.s2{
  transform:rotate(120deg);
  background-color:#4caf50;
  background-image:url("/assets/wheel/x1.png");
}

.s3{
  transform:rotate(180deg);
  background-color:#03a9f4;
  background-image:url("/assets/wheel/x2.png");
}

.s4{
  transform:rotate(240deg);
  background-color:#ffc107;
  background-image:url("/assets/wheel/x5.png");
}

.s5{
  transform:rotate(300deg);
  background-color:#e91e63;
  background-image:url("/assets/wheel/x10.png");
}



    .pointer{
      position:absolute;
      top:-18px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-bottom:26px solid #ffd700;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.6));
    }

    .spin-btn{
      margin-top:24px;
      padding:14px 28px;
      font-size:16px;
      font-weight:700;
      border:none;
      border-radius:999px;
      cursor:pointer;
      background:linear-gradient(180deg,#ffd700,#ff9800);
      color:#000;
      box-shadow:0 6px 20px rgba(255,200,0,.5);
    }

    .spin-btn:active{
      transform:scale(.95);
    }

    .result{
      margin-top:16px;
      font-size:15px;
      opacity:.9;
    }
  </style>
</head>

<body>

<div class="wheel-wrap">
  <div class="pointer"></div>

  <div id="wheel" class="wheel">

    <div class="slice s0"></div>
    <div class="slice s1"></div>
    <div class="slice s2"></div>
    <div class="slice s3"></div>
    <div class="slice s4"></div>
    <div class="slice s5"></div>

  </div>
</div>




<!-- 💎 BET PANEL -->
<div style="margin-top:20px; text-align:center; width:260px">

  <div style="margin-bottom:8px; font-size:14px; opacity:.85">
    💎 Nhập kim cương cược
  </div>

  <input
    id="betAmount"
    type="number"
    min="1"
    value="10"
    style="
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      outline:none;
      font-size:16px;
      text-align:center;
      margin-bottom:14px;
    "
  />

  <button class="spin-btn" onclick="spinWheel()">🎡 Quay</button>

  <div id="result" class="result"></div>
</div>


<script src="/game-wheel.js"></script>
</body>
</html>
