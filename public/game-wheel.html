<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🎡 Vòng quay may mắn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="/style.css">

  <style>
    body{
      margin:0;
      background:#000;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .wheel-wrap{
      position:relative;
      width:260px;
      height:260px;
    }



.wheel{
  position:relative;
  width:100%;
  height:100%;
  border-radius:50%;

  background:
    conic-gradient(
      #ff3d00 0deg 60deg,
      #9e9e9e 60deg 120deg,
      #4caf50 120deg 180deg,
      #03a9f4 180deg 240deg,
      #ffc107 240deg 300deg,
      #e91e63 300deg 360deg
    );

  box-shadow:
    0 0 45px rgba(255,200,0,.45),
    inset 0 0 25px rgba(0,0,0,.65);

  transition: transform 4s cubic-bezier(.17,.67,.14,1);
}


.wheel::after{
  content:"";
  position:absolute;
  inset:0;
  background-repeat:no-repeat;
  background-position:center;
  background-size:contain;
}

/* mỗi lớp ảnh đặt riêng bằng pseudo layer */
.wheel::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    url("/assets/wheel/x0.png") center 22% no-repeat,
    url("/assets/wheel/x0_5.png") 78% center no-repeat,
    url("/assets/wheel/x1.png") center 78% no-repeat,
    url("/assets/wheel/x2.png") 22% center no-repeat,
    url("/assets/wheel/x5.png") 65% 35% no-repeat,
    url("/assets/wheel/x10.png") 35% 65% no-repeat;

  background-size:80px;
  pointer-events:none;
}




    .pointer{
      position:absolute;
      top:-18px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:14px solid transparent;
      border-right:14px solid transparent;
      border-bottom:26px solid #ffd700;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.6));
    }

    .spin-btn{
      margin-top:24px;
      padding:14px 28px;
      font-size:16px;
      font-weight:700;
      border:none;
      border-radius:999px;
      cursor:pointer;
      background:linear-gradient(180deg,#ffd700,#ff9800);
      color:#000;
      box-shadow:0 6px 20px rgba(255,200,0,.5);
    }

    .spin-btn:active{
      transform:scale(.95);
    }

    .result{
      margin-top:16px;
      font-size:15px;
      opacity:.9;
    }


.slice-label{
  position:absolute;
  top:50%;
  left:50%;

  /* canh đúng tâm chữ */
  transform:
    translate(-50%, -50%)
    rotate(calc(var(--i) * 60deg + 30deg))
    translate(0, -72px)
    rotate(calc(-(var(--i) * 60deg + 30deg)));

  font-weight:900;
  font-size:15px;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.95);
  pointer-events:none;
  letter-spacing:.2px;
}




  </style>
</head>

<body>

<div class="wheel-wrap">
  <div class="pointer"></div>

  <div id="wheel" class="wheel">
  </div>
</div>



<!-- 💎 BET PANEL -->
<div style="margin-top:20px; text-align:center; width:260px">

  <div style="margin-bottom:8px; font-size:14px; opacity:.85">
    💎 Nhập kim cương cược
  </div>

  <input
    id="betAmount"
    type="number"
    min="1"
    value="10"
    style="
      width:100%;
      padding:12px;
      border-radius:12px;
      border:none;
      outline:none;
      font-size:16px;
      text-align:center;
      margin-bottom:14px;
    "
  />

  <button class="spin-btn" onclick="spinWheel()">🎡 Quay</button>

  <div id="result" class="result"></div>
</div>


<script src="/game-wheel.js"></script>
</body>
</html>
