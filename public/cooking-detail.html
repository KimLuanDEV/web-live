<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🍳 Công thức</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">

  <!-- CSS riêng cho Cooking -->
  <style>
    .recipe-hero img{
      width:100%;
      height:220px;
      object-fit:cover;
      border-radius:16px;
      margin-bottom:14px;
    }

    .recipe-meta{
      font-size:13px;
      opacity:.75;
      margin-bottom:14px;
    }

    .recipe-section h3{
      margin-top:20px;
      margin-bottom:8px;
    }


    /* COOK MODE */
    .cook-mode{
      position:fixed;
      inset:0;
      background:#0e0e12;
      color:#fff;
      z-index:999;
      display:flex;
      flex-direction:column;
      padding:24px;
    }
    .cook-mode.hidden{display:none}

    .cook-step{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      text-align:center;
    }

    .step-index{
      opacity:.6;
      margin-bottom:12px;
    }

    .step-text{
      font-size:22px;
      font-weight:800;
      line-height:1.4;
    }

    .cook-controls{
      display:flex;
      gap:12px;
    }

    .cook-controls button{
      flex:1;
      height:48px;
      border:none;
      border-radius:14px;
      font-size:18px;
      font-weight:700;
    }

    /* ===== PAGE DARK ===== */
body.page-library{
  background:#000;
  color:#fff;
}

/* ===== HEADER ===== */
.cook-detail-header{
  position:sticky;
  top:0;
  z-index:30;
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  gap:12px;

  background:rgba(0,0,0,.88);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.cd-back{
  width:36px;
  height:36px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:18px;
}

.cd-center{
  flex:1;
  text-align:center;
  line-height:1.1;
}

.cd-title{
  font-size:16px;
  font-weight:900;
}

.cd-sub{
  font-size:11px;
  opacity:.6;
}

.cd-right{
  width:36px;
  text-align:right;
  opacity:.7;
}

/* ===== CONTENT ===== */
.library-container{
  padding:14px;
}

/* ===== HERO ===== */
.recipe-hero{
  position:relative;
  margin:-14px -14px 16px;
}

.recipe-hero img{
  width:100%;
  height:260px;
  object-fit:cover;
}

/* HERO OVERLAY */
.recipe-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.05),
    rgba(0,0,0,.35),
    rgba(0,0,0,.9)
  );
}

/* ===== TEXT ===== */
h2{
  margin-top:-42px;
  position:relative;
  z-index:2;
  font-size:22px;
  font-weight:900;
}

.recipe-meta{
  font-size:12px;
  opacity:.7;
  margin-top:6px;
}

/* ===== SECTION ===== */
.recipe-section{
  margin-top:22px;
}

.recipe-section h3{
  font-size:15px;
  margin-bottom:8px;
}

.recipe-section ul,
.recipe-section ol{
  padding-left:18px;
  opacity:.9;
  line-height:1.6;
}



/* ===== COOK MODE ===== */
.cook-mode{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  z-index:999;
  display:flex;
  flex-direction:column;
  padding:24px;
}

.cook-mode.hidden{display:none}

.cook-step{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
}

.step-index{
  opacity:.5;
  margin-bottom:12px;
}

.step-text{
  font-size:24px;
  font-weight:900;
  line-height:1.4;
}

.cook-controls{
  display:flex;
  gap:12px;
}

.cook-controls button{
  flex:1;
  height:52px;
  border:none;
  border-radius:16px;
  font-size:18px;
  font-weight:800;
}

/* ===== BOTTOM FIXED BAR ===== */
.cook-mode-dock{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:12px 16px env(safe-area-inset-bottom);
  background:linear-gradient(
    to top,
    rgba(0,0,0,.92),
    rgba(0,0,0,.65),
    rgba(0,0,0,0)
  );
  z-index:50;
}


/* ===== COOK MODE BUTTON ===== */
.cook-mode-btn{
  width:100%;
  height:56px;
  border:none;
  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  background:#ffb703;
  color:#000;
  font-weight:900;
  font-size:16px;

  box-shadow:0 10px 28px rgba(0,0,0,.7);
}

.library-container{
  padding-bottom:96px; /* chừa chỗ cho bottom bar */
}


/* ICON */
.cook-icon{
  font-size:20px;
  line-height:1;
}



/* ===== COOK MODE BUTTON – POLISH ===== */
.cook-mode-btn{
  width:100%;
  height:56px;
  border:none;
  border-radius:20px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  background:linear-gradient(135deg,#ffd166,#ffb703);
  color:#000;
  font-weight:900;
  font-size:16px;

  box-shadow:
    0 10px 28px rgba(0,0,0,.7),
    inset 0 -2px 0 rgba(0,0,0,.15);

  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
}

.cook-mode-btn:active{
  transform:scale(.97);
  box-shadow:
    0 6px 16px rgba(0,0,0,.6),
    inset 0 2px 0 rgba(255,255,255,.25);
}



.step-timer{
  margin-top:14px;
  font-size:18px;
  font-weight:900;
  color:#ffd166;
  letter-spacing:1px;
}


  </style>
</head>

<body class="page-library">

<header class="cook-detail-header">
  <button class="cd-back" onclick="history.back()">←</button>

  <div class="cd-center">
    <div class="cd-title" id="recipeTitle">Công thức</div>
    <div class="cd-sub">Nấu ăn</div>
  </div>

  <div class="cd-right">🍳</div>
</header>


<main class="library-container" id="recipeContent">
  Đang tải công thức...
</main>


<!-- 🔥 NÚT COOK MODE -->
<div class="cook-mode-dock" id="cookDock">
  <button class="cook-mode-btn" id="cookBtn" onclick="enterCookMode()">
    <span class="cook-icon">🍳</span>
    <span class="cook-text" id="cookText">Bắt đầu nấu</span>
  </button>
</div>



<!-- 🔥 COOK MODE OVERLAY -->
<div id="cookMode" class="cook-mode hidden">
<div class="cook-step">
  <div class="step-index" id="stepIndex"></div>
  <div class="step-text" id="stepText"></div>
  <div class="step-timer" id="stepTimer"></div>
</div>


  <div class="cook-controls">
    <button onclick="prevStep()">←</button>
    <button onclick="nextStep()">→</button>
    <button onclick="exitCookMode()">✕</button>
  </div>
</div>

<script src="/cooking-detail.js"></script>
</body>
</html>
