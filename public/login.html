<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>🔐 Đăng nhập - Livestream Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">

<div class="container" style="max-width:420px">
  <div class="card login-card">

    <div class="login-logo">
      <span class="brand__dot"></span>
      <h1>Livestream Pro</h1>
      <small>Đăng nhập để trải nghiệm tốt hơn.</small>
    </div>

    <div class="login-form">
      <input id="email" placeholder="📧 Email" autocomplete="email">
      <input id="password" type="password" placeholder="🔒 Mật khẩu">

      <button id="btnLogin">🔑 Đăng nhập</button>
      <button id="btnRegister" class="btn-ghost">✨ Tạo tài khoản</button>

      <div class="login-divider">
        <span>hoặc</span>
      </div>

      <button id="btnGoogle" class="btn-google">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg">
        Đăng nhập bằng Google
      </button>

      <div id="loginError" class="login-error"></div>
    </div>

  </div>
</div>

<script type="module" src="/firebase-auth.js"></script>
</body>
</html>
