<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Login • Livestream Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(circle at top, #230045, #000 60%);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family: system-ui, sans-serif;
  overflow:hidden;
}

/* animated neon background */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(0,255,255,.04),
      rgba(0,255,255,.04) 1px,
      transparent 1px,
      transparent 4px
    );
  mix-blend-mode: screen;
  animation: scan 6s linear infinite;
}
@keyframes scan{
  from{background-position:0 0}
  to{background-position:400px 0}
}

/* main card */
.login-card{
  position:relative;
  width:360px;
  max-width:92vw;
  padding:26px;
  border-radius:16px;
  background:rgba(10,10,25,.85);
  box-shadow:
    0 0 40px rgba(0,255,255,.25),
    inset 0 0 30px rgba(255,255,255,.04);
  border:1px solid rgba(0,255,255,.5);
  z-index:1;
  text-align:center;
}

/* logo */
.login-logo{
  font-size:22px;
  font-weight:800;
  color:#00f0ff;
  text-shadow:0 0 10px #00f0ff;
  margin-bottom:14px;
}

/* avatar */
.login-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:12px auto 18px;
  border:2px solid #00f0ff;
  box-shadow:0 0 25px #00f0ff;
  overflow:hidden;
}
.login-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* input */
.login-input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:10px;
  background:#050812;
  border:1px solid #00f0ff;
  color:#fff;
  outline:none;
  box-shadow:inset 0 0 8px rgba(0,255,255,.2);
}
.login-input:focus{
  box-shadow:
    0 0 12px rgba(0,255,255,.7),
    inset 0 0 10px rgba(0,255,255,.4);
}

/* main button */
.login-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:700;
  letter-spacing:.5px;
  color:#fff;
  background:linear-gradient(90deg,#00f0ff,#7f00ff);
  box-shadow:0 0 20px rgba(0,255,255,.7);
  margin-top:6px;
}
.login-btn:hover{
  filter:brightness(1.15);
}

/* divider */
.login-divider{
  margin:18px 0 12px;
  color:#aaa;
  font-size:12px;
}

/* role buttons */
.role-btn{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.2);
  background:#111;
  color:#fff;
  cursor:pointer;
}
.role-btn.viewer{border-color:#00f0ff}
.role-btn.host{border-color:#ff3b3b}
.role-btn.guest{border-color:#ffd36e}

/* footer */
.login-footer{
  margin-top:14px;
  font-size:13px;
  color:#aaa;
}
.login-footer a{
  color:#00f0ff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="login-card">

  <div class="login-logo">🌌 Livestream Pro</div>

  <div class="login-avatar">
    <img id="avatarPreview"
         src="https://api.dicebear.com/7.x/thumbs/svg?seed=Guest">
  </div>

  <input id="loginName"
         class="login-input"
         placeholder="Tên hiển thị">

  <input id="loginPass"
         type="password"
         class="login-input"
         placeholder="Mật khẩu (demo có thể bỏ)">

  <button id="btnLogin" class="login-btn">
    🔑 ĐĂNG NHẬP
  </button>

  <div class="login-divider">HOẶC</div>

  <button class="role-btn viewer" id="btnViewer">
    👁 Vào với tư cách Viewer
  </button>

  <button class="role-btn host" id="btnHost">
    🎥 Đăng nhập Host
  </button>

  <button class="role-btn guest" id="btnGuest">
    👤 Guest (Ẩn danh)
  </button>

  <div class="login-footer">
    Chưa có tài khoản?
    <a href="#">Đăng ký</a>
  </div>

</div>

<script>
const nameInput = document.getElementById("loginName");
const avatar = document.getElementById("avatarPreview");

/* avatar tự đổi theo tên */
nameInput.addEventListener("input", ()=>{
  const name = nameInput.value || "Guest";
  avatar.src = "https://api.dicebear.com/7.x/thumbs/svg?seed=" + encodeURIComponent(name);
});



function goLobby(profile){
  localStorage.setItem("profile", JSON.stringify(profile));
  window.location.href = "/lobby.html";
}

async function login(role){
  const username = nameInput.value.trim();
  const password = document.getElementById("loginPass").value.trim();

  if(!username || !password){
    alert("Nhập tài khoản & mật khẩu");
    return;
  }

  const res = await fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await res.json();
  if(!data.uid){
    alert("Sai tài khoản hoặc mật khẩu");
    return;
  }

  data.role = role;                 // viewer / host
  localStorage.setItem("profile", JSON.stringify(data));
  window.location.href="/lobby.html";
}

btnLogin.onclick  = ()=> login("viewer");
btnViewer.onclick = ()=> login("viewer");
btnHost.onclick   = ()=> login("host");

btnGuest.onclick = ()=>{
  // Guest KHÔNG dùng tài khoản thật
  localStorage.setItem("profile", JSON.stringify({
    uid: "guest_" + Date.now(),
    name: "Guest",
    avatar: avatar.src,
    level: 1,
    coins: 0,
    role: "guest"
  }));
  window.location.href="/lobby.html";
};

</script>

</body>
</html>
