<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!-- PWA iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Livestream Pro">

<!-- Android / Chrome -->
<meta name="mobile-web-app-capable" content="yes">


<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập • Livestream Pro</title>

<link rel="manifest" href="/manifest.json">

<!-- icon cho iOS -->
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<link rel="stylesheet" href="/style.css">

<style>
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#0f1b3a,#05070d);
  font-family:system-ui,-apple-system;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.login-shell{
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#0b1327,#080c18);
  border-radius:24px;
  padding:36px 26px 42px;
  box-shadow:0 0 50px rgba(0,255,255,.15);
  text-align:center;
}

.login-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  margin:0 auto 14px;
  background:url("https://i.ibb.co/ZR2yR7dJ/Chat-GPT-Image-Jan-12-2026-02-44-07-AM.jpg") center/cover;
  box-shadow:0 0 40px rgba(0,255,255,.6);
}

.login-title{
  font-size:26px;
  font-weight:900;
  color:#00f6ff;
  margin-bottom:6px;
}

.login-sub{
  font-size:13px;
  opacity:.7;
  margin-bottom:28px;
}

.login-shell input{
  width:100%;
  height:52px;
  margin-top:14px;
  background:#0e172c;
  border:none;
  border-radius:16px;
  padding:0 16px;
  color:white;
  font-size:16px;
  box-shadow:inset 0 0 0 1px rgba(0,255,255,.15);
}

.login-shell input::placeholder{
  color:#6c7da8;
}

.login-btn{
  width:100%;
  height:56px;
  margin-top:26px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#00f6ff,#5f7dff);
  color:#00141a;
  font-size:18px;
  font-weight:900;
  box-shadow:0 0 30px rgba(0,246,255,.6);
}

.login-links{
  margin-top:22px;
  font-size:13px;
  opacity:.75;
}

.login-links a{
  color:#00f6ff;
  text-decoration:none;
  font-weight:600;
}

/* mobile */
@media(max-width:600px){
  .login-shell{
    min-height:100vh;
    border-radius:0;
    padding:48px 24px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
}

.pass-wrap{
  position:relative;
}

.pass-eye{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:18px;
  opacity:.7;
}

.pass-eye:hover{
  opacity:1;
}

/* ===== Forgot modal overlay ===== */
#forgotModal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

#forgotModal .modal-backdrop{
  position:absolute;
  inset:0;
  background:rgba(5,8,18,.75);
  backdrop-filter:blur(4px);
}

/* ===== Forgot card – same style as login-shell ===== */
#forgotModal .forgot-card{
  position:relative;
  width:100%;
  max-width:420px;
  background:linear-gradient(180deg,#0b1327,#080c18);
  border-radius:24px;
  padding:32px 26px 36px;
  box-shadow:0 0 50px rgba(0,255,255,.18);
  color:white;
  text-align:center;
  z-index:1;
  animation:pop .25s ease;
}

#forgotModal .forgot-card h3{
  font-size:22px;
  font-weight:900;
  color:#00f6ff;
  margin-bottom:18px;
  text-shadow:0 0 12px rgba(0,246,255,.6);
}

/* inputs */
#forgotModal .input-group{
  margin-top:14px;
  text-align:left;
}

#forgotModal .input-group label{
  font-size:12px;
  opacity:.75;
}

#forgotModal .input-group input{
  width:100%;
  height:52px;
  margin-top:6px;
  background:#0e172c;
  border:none;
  border-radius:16px;
  padding:0 16px;
  color:white;
  font-size:16px;
  box-shadow:inset 0 0 0 1px rgba(0,255,255,.15);
}

/* buttons */
#forgotModal .forgot-actions{
  display:flex;
  gap:12px;
  margin-top:26px;
}

#forgotModal .btn-primary{
  flex:1;
  height:56px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#00f6ff,#5f7dff);
  color:#00141a;
  font-size:16px;
  font-weight:900;
  box-shadow:0 0 30px rgba(0,246,255,.6);
}

#forgotModal .btn-cancel{
  flex:1;
  height:56px;
  border-radius:18px;
  background:#0e172c;
  color:#9fb3ff;
  border:1px solid rgba(0,255,255,.15);
}

/* mobile same as login */
@media(max-width:600px){
  #forgotModal .forgot-card{
    min-height:100vh;
    border-radius:0;
    padding:48px 24px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
}

/* animation */
@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}



</style>
</head>
<body>

<div class="login-shell">
  <div class="login-avatar"></div>
  <div class="login-title">LIVESTREAM PRO</div>
  <div class="login-sub">Đăng nhập để bắt đầu</div>

  <input id="username" placeholder="Tên đăng nhập">


  <div class="pass-wrap">
  <input id="password" type="password" placeholder="Mật khẩu">
  <span class="pass-eye" onclick="togglePass('password', this)">👁</span>
</div>




  <button class="login-btn" onclick="login()">ĐĂNG NHẬP</button>

  <button class="login-btn" style="
  background:linear-gradient(135deg,#666,#999);
  color:white;
  margin-top:14px"
  onclick="guestLogin()">
  ⚡ Trải nghiệm nhanh
</button>


<div class="login-links">
  <a href="#" onclick="openForgot()">Quên mật khẩu?</a>
  <br>
  Chưa có tài khoản?
  <a href="/register.html">Tạo ngay</a>
</div>


<div id="forgotModal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeForgot()"></div>

  <div class="forgot-card">
    <h3>🔐 Khôi phục mật khẩu</h3>

    <div class="input-group">
      <label>Tên đăng nhập</label>
      <input id="forgotUser" placeholder="Nhập username">
    </div>

    <div class="input-group">
      <label>Mật khẩu mới</label>
      <input id="forgotPass" type="password" placeholder="Mật khẩu mới">
    </div>

    <div class="input-group">
  <label>Mã bảo mật</label>
  <input id="forgotSec" type="password" placeholder="Nhập mã bảo mật">
</div>


    <div class="forgot-actions">
      <button class="btn-primary" onclick="submitForgot()">Đặt lại</button>
      <button class="btn-cancel" onclick="closeForgot()">Hủy</button>
    </div>
  </div>
</div>





<!-- GLOBAL MESSAGE MODAL -->
<div id="msgModal" class="modal hidden">
  <div class="modal-backdrop"></div>
  <div class="modal-card">
    <h3 id="msgTitle">Thông báo</h3>
    <div id="msgText" style="margin:12px 0;opacity:.9"></div>
    <button onclick="closeMsg()">OK</button>
  </div>
</div>


<div id="secModal" class="modal hidden">
  <div class="modal-backdrop"></div>

  <div class="modal-card" style="text-align:center">
    <h3>🔐 Xác thực bảo mật</h3>
    <p style="opacity:.8;font-size:14px">
      Nhập mã bảo mật để hoàn tất đăng nhập
    </p>

    <div class="pass-wrap">
      <input id="secInput" type="password" placeholder="Mã bảo mật">
      <span class="pass-eye" onclick="togglePass('secInput', this)">👁</span>
    </div>

    <div class="modal-actions">
      <button onclick="submitSecurity()">Xác nhận</button>
      <button onclick="closeSec()" style="background:#333">Hủy</button>
    </div>
  </div>
</div>




<script>



async function submitForgot(){
 const u = document.getElementById("forgotUser").value.trim();
const p = document.getElementById("forgotPass").value;
const sec = document.getElementById("forgotSec").value;

if(!u || !p || !sec){
  showMsg("❌ Nhập đủ username, mật khẩu mới và mã bảo mật");
  return;
}

  const res = await fetch("/api/change-password",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
   body: JSON.stringify({ 
  username: u, 
  newPassword: p,
  securityCode: sec
})
  });

  const d = await res.json();
  if(!d.ok){
    showMsg("❌ Không tìm thấy tài khoản");
    return;
  }

  showMsg("✅ Đổi mật khẩu thành công");
  closeForgot();
}


  function guestLogin(){
  const guest = {
    uid: "guest_" + Math.random().toString(36).slice(2,10),
    name: "Guest",
    level: 1,
    avatar: "https://api.dicebear.com/7.x/thumbs/svg?seed=guest"
  };

  localStorage.setItem("user_profile", JSON.stringify(guest));
  localStorage.setItem("login_uid", guest.uid);
  localStorage.setItem("isGuest", "1");

  location.href = "/lobby.html";
}

let __loginUser = null;
let __loginPass = null;

async function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value;

  if(!u || !p){
    showMsg("❌ Nhập tài khoản và mật khẩu");
    return;
  }

  const t = localStorage.getItem("trustedToken");
const tu = localStorage.getItem("trustedUser");

if(t && tu === u){
  const res = await fetch("/api/check-trusted",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username:u, trustedToken:t })
  });

  const d = await res.json();
  
if(d.ok){
  const res2 = await fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username:u,
      password:p,
      securityCode:"__TRUSTED__"
    })
  });

  const data = await res2.json();

  // 🔥 LƯU PROFILE + XOÁ GUEST
  localStorage.setItem("user_profile", JSON.stringify(data.profile));
  localStorage.setItem("login_uid", data.profile.uid);
  localStorage.removeItem("isGuest");      // ⭐ QUAN TRỌNG
  localStorage.removeItem("guest_uid");   // nếu có

  location.href="/lobby.html";
  return;
}

}


  const res = await fetch("/api/prelogin",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ username:u, password:p })
  });

const data = await res.json();

if (data.error === "blocked") {
  showMsg(
    "🚫 Tài khoản của bạn đang bị cấm.\nVui lòng liên hệ hỗ trợ.",
    "Tài khoản bị khoá"
  );
  return;
}

if(!data.ok){
  showMsg("❌ Sai tài khoản hoặc mật khẩu");
  return;
}


  // Đúng → mới mở modal bảo mật
  __loginUser = u;
  __loginPass = p;

  document.getElementById("secModal").classList.remove("hidden");
  document.getElementById("secInput").focus();
}




async function submitSecurity(){
  const sec = document.getElementById("secInput").value;
  if(!sec){
    showMsg("❌ Nhập mã bảo mật");
    return;
  }

  const res = await fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: __loginUser,
      password: __loginPass,
      securityCode: sec
    })
  });

 if (data.error === "blocked") {
  showMsg(
    "🚫 Tài khoản của bạn đang bị cấm.\nVui lòng liên hệ hỗ trợ.",
    "Tài khoản bị khoá"
  );
  closeSec();
  return;
}

if(data.error){
  showMsg("❌ Sai thông tin bảo mật");
  return;
}


  // login thành công
  localStorage.setItem("user_profile", JSON.stringify(data.profile));
  localStorage.setItem("login_uid", data.profile.uid);
  localStorage.removeItem("isGuest");

if(data.trustedToken){
  localStorage.setItem("trustedToken", data.trustedToken);
  localStorage.setItem("trustedUser", __loginUser);
}


  location.href = "/lobby.html";
}


function closeSec(){
  document.getElementById("secModal").classList.add("hidden");
  document.getElementById("secInput").value = "";
}


function openForgot(){
  document.getElementById("forgotModal").classList.remove("hidden");
}

function closeForgot(){
  document.getElementById("forgotModal").classList.add("hidden");
}


function togglePass(id, el){
  const input = document.getElementById(id);
  if(input.type === "password"){
    input.type = "text";
    el.textContent = "🙈";
  }else{
    input.type = "password";
    el.textContent = "👁";
  }
}



function showMsg(text, title="Thông báo"){
  document.getElementById("msgTitle").textContent = title;
  document.getElementById("msgText").textContent = text;
  document.getElementById("msgModal").classList.remove("hidden");
}

function closeMsg(){
  document.getElementById("msgModal").classList.add("hidden");
}




</script>



</body>
</html>
