<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập • Livestream Pro</title>
<link rel="stylesheet" href="/style.css">

<style>
@media (max-width: 600px){
  body{
    padding:0;
    margin:0;
  }

  .auth-shell{
    max-width:100%;
    width:100%;
    min-height:100vh;
    margin:0;
    border-radius:0;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .auth-avatar{
    width:80px;
    height:80px;
  }

  .auth-title{
    font-size:20px;
  }

  .auth-input{
    width:100%;
    height:48px;
    font-size:16px;
    border-radius:12px;
  }

  .auth-btn{
    width:100%;
    height:50px;
    font-size:17px;
    border-radius:14px;
    margin-top:20px;
  }

  .auth-link{
    margin-top:18px;
    font-size:14px;
  }
}

</style>
</head>
<body>

<div class="card auth-shell">
  <div class="auth-avatar"></div>
  <div class="auth-title">🔥 LIVESTREAM PRO</div>

  <input id="loginUser" class="auth-input" placeholder="Tên đăng nhập">
  <input id="loginPass" type="password" class="auth-input" placeholder="Mật khẩu">

  <button class="auth-btn" onclick="login()">ĐĂNG NHẬP</button>

  <a href="/register.html" class="auth-link">Chưa có tài khoản? Tạo ngay</a>
</div>

<script>
async function login(){
  const u = loginUser.value.trim();
  const p = loginPass.value;

  if(!u || !p){
    alert("❌ Nhập đủ tài khoản và mật khẩu");
    return;
  }

  const res = await fetch("/api/login",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      username: u,
      password: p
    })
  });

  const data = await res.json();

  if(data.error){
    alert("❌ Sai tài khoản hoặc mật khẩu");
    return;
  }

  // server trả profile chuẩn
  localStorage.setItem("user_profile", JSON.stringify(data.profile));
  localStorage.setItem("login_uid", data.profile.uid);

  location.href = "/lobby.html";
}
</script>


</body>
</html>
