<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Livestream Pro • Market</title>
<link rel="stylesheet" href="/style.css">

<style>
/* ===== MARKET PAGE ===== */

.market-shell{
  max-width:720px;
  margin:0 auto;
  padding:12px;
  padding-bottom:90px;
}

/* FILTER */
.market-tabs{
  display:flex;
  gap:10px;
  margin:10px 0 14px;
  overflow-x:auto;
}
.market-tab{
  padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.08);
  font-weight:800;
  font-size:13px;
  white-space:nowrap;
  cursor:pointer;
}
.market-tab.active{
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
}

/* GRID */
.market-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:420px){
  .market-grid{ grid-template-columns:1fr; }
}

/* CARD */
.market-card{
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  overflow:hidden;
  transition:.2s;
}
.market-card:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(37,240,154,.25);
}

.market-img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.market-body{ padding:10px }

.market-title{
  font-weight:900;
  font-size:14px;
  line-height:1.3;
}

.market-price{
  margin-top:6px;
  font-weight:900;
  color:#25F09A;
}

.market-seller{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
  font-size:12px;
  opacity:.85;
}
.market-seller img{
  width:24px;
  height:24px;
  border-radius:50%;
  object-fit:cover;
}
.market-verified{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#1d9bf0;
  color:#fff;
  font-size:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.market-buy{
  margin-top:10px;
  width:100%;
  border:none;
  border-radius:999px;
  padding:8px;
  font-weight:900;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
}

/* ADD BUTTON */
.market-add{
  position:fixed;
  right:16px;
  bottom:90px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb347,#ff5f6d);
  color:#000;
  font-size:28px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(255,95,109,.6);
  cursor:pointer;
  z-index:9999;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="lp-topbar">
  <div class="lp-title">
    <div class="lp-dot"></div>
    MARKET
  </div>
</div>

<!-- CONTENT -->
<div class="market-shell">

  <div class="market-tabs" id="marketTabs">
    <div class="market-tab active" data-type="all">🔥 Tất cả</div>
    <div class="market-tab" data-type="item">🎁 Vật phẩm</div>
    <div class="market-tab" data-type="service">🛠 Dịch vụ</div>
    <div class="market-tab" data-type="account">👤 Tài khoản</div>
  </div>

  <div class="market-grid" id="marketGrid"></div>
</div>

<!-- ADD -->
<div class="market-add" id="btnAddMarket">＋</div>

<!-- TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab" data-tab="lobby"><div class="icon">🎥</div><div>Lobby</div></div>
  <div class="lp-tab active" data-tab="market"><div class="icon">🛒</div><div>Chợ</div></div>
  <div class="lp-tab" data-tab="social"><div class="icon">🏠</div><div>Social</div></div>
  <div class="lp-tab" data-tab="messages"><div class="icon">💬</div><div>Tin nhắn</div></div>
  <div class="lp-tab" data-tab="profile"><div class="icon">👤</div><div>Tôi</div></div>
</div>

<script src="/market.js"></script>
</body>
</html>
