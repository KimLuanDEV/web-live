<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livestream Pro • Market</title>
<link rel="stylesheet" href="/style.css">

<style>
/* ===== MARKET LAYOUT ===== */

/* ===== FULL BLACK THEME ===== */
html, body{
  background:#000;
  color:#fff;
  margin:0;
}

/* ===== MARKET HEADER ===== */
.market-header{
  padding:18px 16px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.market-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.6px;
}
.market-sub{
  margin-top:4px;
  font-size:13px;
  opacity:.7;
}

/* ===== MARKET FLOOR (GRID) ===== */
.market-floor{
  padding:14px;
  padding-bottom:90px; /* chừa tab bar */
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

@media(max-width:600px){
  .market-floor{
    grid-template-columns:repeat(2,1fr);
  }
}

/* Gian trống */
.booth.empty:hover{
  border-color:#25F09A;
  box-shadow:0 0 18px rgba(37,240,154,.35);
}

.booth-plus{
  font-size:32px;
  font-weight:900;
  color:#25F09A;
}

.booth-text{
  margin-top:6px;
  font-size:13px;
  font-weight:800;
}


.booth-logo{
  width:56px;
  height:56px;
  border-radius:14px;
  object-fit:cover;
  background:#000;
  box-shadow:
    0 0 12px rgba(37,240,154,.6),
    0 0 24px rgba(37,240,154,.35);
}

.booth-name{
  margin-top:8px;
  font-weight:900;
  font-size:14px;
}

/* ===== MOBILE TAB BAR (STANDARD) ===== */
.lp-tabbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:64px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:#000;
  border-top:1px solid rgba(255,255,255,.15);
  z-index:9999;
}

.lp-tab{
  flex:1;
  text-align:center;
  color:#777;
  font-size:12px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  position:relative;
}

.lp-tab .icon{
  font-size:22px;
  line-height:22px;
}

.lp-tab.active{
  color:#25F09A;
}

.lp-tab.active .icon{
  filter: drop-shadow(0 0 12px #25F09A);
}

/* badge (nếu dùng sau này) */
.lp-tab .badge{
  position:absolute;
  top:6px;
  right:30%;
  width:10px;
  height:10px;
  background:#ff3b6b;
  border-radius:50%;
  box-shadow:0 0 10px #ff3b6b;
}


/* ===== RENT MODAL ===== */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

.modal-backdrop.hidden{
  display:none;
}

.rent-modal{
  width:90%;
  max-width:360px;
  background:#000;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 30px rgba(37,240,154,.25);
  overflow:hidden;
}

.rent-header{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.rent-close{
  cursor:pointer;
  font-size:18px;
  opacity:.7;
}

.rent-body{
  padding:16px;
}

.rent-slot{
  text-align:center;
  font-size:14px;
  margin-bottom:14px;
  opacity:.85;
}

/* OPTIONS */
.rent-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.rent-option{
  border:1.5px solid rgba(255,255,255,.25);
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.rent-option .days{
  font-weight:900;
}

.rent-option .price{
  font-size:12px;
  opacity:.8;
  margin-top:4px;
}

.rent-option.active{
  border-color:#25F09A;
  box-shadow:0 0 14px rgba(37,240,154,.35);
  color:#25F09A;
}

/* CONFIRM */
.rent-confirm{
  width:100%;
  border:none;
  border-radius:999px;
  padding:12px;
  font-weight:900;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  cursor:pointer;
}


/* ===== BADGE "GIAN CỦA TÔI" ===== */
.booth{
  position:relative;
}

.booth-mine-badge{
  position:absolute;
  top:8px;
  right:8px;
  background:#25F09A;
  color:#000;
  font-size:11px;
  font-weight:900;
  padding:3px 8px;
  border-radius:999px;
  box-shadow:0 0 10px rgba(37,240,154,.8);
}


/* ===== BADGE HẾT HẠN ===== */
.booth-expire-badge{
  position:absolute;
  bottom:8px;
  left:8px;
  font-size:11px;
  font-weight:900;
  padding:3px 8px;
  border-radius:999px;
  background:#ffb347;
  color:#000;
  box-shadow:0 0 10px rgba(255,179,71,.8);
}

.booth-expire-badge.danger{
  background:#ff5f6d;
  box-shadow:0 0 12px rgba(255,95,109,.9);
}


/* ===== GIAN CỦA TÔI – GLOW RIÊNG ===== */
.booth.booth-mine{
  border:2px solid #25F09A;
  box-shadow:
    0 0 12px rgba(37,240,154,.9),
    0 0 28px rgba(37,240,154,.6),
    inset 0 0 10px rgba(37,240,154,.25);
  animation: boothMineGlow 2.4s ease-in-out infinite;
}

@keyframes boothMineGlow{
  0%{
    box-shadow:
      0 0 10px rgba(37,240,154,.6),
      0 0 20px rgba(37,240,154,.4),
      inset 0 0 8px rgba(37,240,154,.2);
  }
  50%{
    box-shadow:
      0 0 16px rgba(37,240,154,1),
      0 0 36px rgba(37,240,154,.8),
      inset 0 0 12px rgba(37,240,154,.35);
  }
  100%{
    box-shadow:
      0 0 10px rgba(37,240,154,.6),
      0 0 20px rgba(37,240,154,.4),
      inset 0 0 8px rgba(37,240,154,.2);
  }
}


.booth-admin{
  position:absolute;
  bottom:8px;
  right:8px;
  display:flex;
  gap:6px;
  z-index:5;
}

.booth-admin button{
  font-size:10px;
  padding:4px 6px;
  border-radius:6px;
  border:none;
  cursor:pointer;
}

.booth-locked{
  opacity:.45;
}




.lp-modal.hidden { display: none; }

.lp-modal {
  position: fixed;
  inset: 0;
  z-index: 9999;
}

.lp-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.6);
}

.lp-modal-box {
  position: relative;
  max-width: 360px;
  margin: 20vh auto;
  background: #111;
  border-radius: 16px;
  padding: 16px;
  color: #fff;
  animation: pop .2s ease;
}

.lp-modal-title {
  font-weight: 800;
  margin-bottom: 8px;
}

.lp-modal-content {
  font-size: 14px;
  opacity: .9;
  margin-bottom: 16px;
}

.lp-modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
}

.btn {
  padding: 8px 16px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
}

.btn.primary {
  background: #25f09a;
  color: #000;
  font-weight: 700;
}

.btn.ghost {
  background: transparent;
  color: #aaa;
}

@keyframes pop {
  from { transform: scale(.95); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}


.market-tabs{
  display:flex;
  gap:8px;
  padding:8px;
  overflow-x:auto;
}

.market-tab{
  padding:6px 14px;
  border-radius:999px;
  border:none;
  background:#222;
  color:#aaa;
  font-size:13px;
  cursor:pointer;
  white-space:nowrap;
}

.market-tab.active{
  background:#25f09a;
  color:#000;
  font-weight:700;
}


#marketFloor {
  touch-action: pan-y;
}


/* ===== SLIDE ANIMATION ===== */
#marketFloor {
  transition: transform .25s ease, opacity .25s ease;
}

.market-slide-left {
  transform: translateX(-40px);
  opacity: 0;
}

.market-slide-right {
  transform: translateX(40px);
  opacity: 0;
}

#marketFloor {
  will-change: transform;
}


/* ===== BOOTH CARD NÂNG CẤP ===== */
.booth{
  position: relative;
  aspect-ratio: 1/1;
  border-radius: 18px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
  border: 1px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition: 
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;
  overflow:hidden;
}

/* hover / tap */
.booth:hover{
  transform: translateY(-3px) scale(1.01);
  border-color: rgba(37,240,154,.8);
  box-shadow:
    0 10px 28px rgba(0,0,0,.6),
    0 0 22px rgba(37,240,154,.35);
}


.booth-logo{
  width:64px;
  height:64px;
  border-radius:18px;
  object-fit:cover;
  background:#000;
  box-shadow:
    0 0 0 2px rgba(255,255,255,.12),
    0 0 16px rgba(37,240,154,.7),
    0 0 36px rgba(37,240,154,.45);
  transition: transform .25s ease;
}

.booth:hover .booth-logo{
  transform: scale(1.05);
}


.booth-name{
  margin-top:10px;
  font-weight:900;
  font-size:14px;
  letter-spacing:.3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}

.booth.empty{
  border:1.5px dashed rgba(37,240,154,.5);
  background:
    radial-gradient(circle at top,
      rgba(37,240,154,.15),
      transparent 60%);
}

.booth.empty:hover{
  box-shadow:
    0 0 18px rgba(37,240,154,.45),
    inset 0 0 20px rgba(37,240,154,.2);
}

.booth-plus{
  font-size:36px;
  font-weight:900;
  color:#25F09A;
  text-shadow:0 0 12px rgba(37,240,154,.9);
}


.booth.booth-locked::after{
  content:"🔒";
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  background:rgba(0,0,0,.65);
  color:#fff;
  backdrop-filter: blur(2px);
}


.booth-mine-badge{
  backdrop-filter: blur(6px);
}

.booth-expire-badge{
  backdrop-filter: blur(6px);
}


.rent-section-title{
  margin:10px 0 8px;
  font-size:13px;
  font-weight:900;
  opacity:.85;
}

.rent-save{
  margin-top:4px;
  font-size:10px;
  color:#25F09A;
}

.rent-save.hot{
  color:#ffb347;
  text-shadow:0 0 10px rgba(255,179,71,.9);
}

/* CUSTOM */
.rent-custom{
  margin-bottom:16px;
}

.rent-custom input[type=range]{
  width:100%;
}

.rent-custom-info{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-top:6px;
  font-weight:800;
}

.rent-wallet{
  margin:8px 0 12px;
  font-size:13px;
  font-weight:800;
  text-align:right;
  color:#25F09A;
}


#confirmRent.disabled{
  opacity:.6;
  background:#444 !important;
  cursor:not-allowed;
}

/* 🔴 Giá vượt số dư */
.rent-price-over{
  color:#ff4d4f;
  text-shadow:0 0 6px rgba(255,77,79,.6);
}


.rent-topup{
  width:100%;
  margin-top:8px;
  padding:10px;
  border-radius:12px;
  border:1px dashed rgba(37,240,154,.6);
  background:transparent;
  color:#25F09A;
  font-weight:900;
  cursor:pointer;
}


.rent-option.trial{
  border:1.5px dashed #5FA8FF;
  background:linear-gradient(
    180deg,
    rgba(95,168,255,.18),
    rgba(0,0,0,0)
  );
}

.rent-option.trial.active{
  border-color:#5FA8FF;
  color:#5FA8FF;
  box-shadow:0 0 16px rgba(95,168,255,.45);
}


/* Modal thuê gian hàng */
#rentBackdrop{
  z-index: 1000;
}

/* Modal thông báo chung */
#lpModal{
  z-index: 2000; /* CAO HƠN rent modal */
}


/* ===== MARKET MAIN TABS (USER / SYSTEM) ===== */
.market-main-tabs{
  display:flex;
  gap:8px;
  padding:10px 14px;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.market-main-tab{
  flex:1;
  padding:10px 12px;
  border-radius:999px;
  background:#222;
  color:#aaa;
  border:none;
  font-size:13px;
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.market-main-tab.active{
  background:#25F09A;
  color:#000;
  box-shadow:0 0 16px rgba(37,240,154,.45);
}



</style>
</head>

<body>

<!-- HEADER -->
<div class="market-header">
  <div class="market-title">🏬 MARKET</div>
  <div class="market-sub" id="marketStats">
    Đang tải thống kê...
  </div>
</div>

<!-- MAIN MARKET TABS -->
<div class="market-main-tabs">
  <button class="market-main-tab active" data-tab="user">
    🏪 Gian hàng người dùng
  </button>
  <button class="market-main-tab" data-tab="system">
    🧑‍💼 Gian hàng hệ thống
  </button>
</div>



<!-- FLOOR -->
<div class="market-floor" id="marketFloor"></div>

<!-- TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab" data-tab="social"><div class="icon">🌍</div><div>Status</div></div>
  <div class="lp-tab active" data-tab="market"><div class="icon">🏬</div><div>Market</div></div>
  <div class="lp-tab" data-tab="lobby"><div class="icon">🏟</div><div>Lobby</div></div>
  <div class="lp-tab" data-tab="messages"><div class="icon">💬</div><div>Chat</div></div>
  <div class="lp-tab" data-tab="profile"><div class="icon">👤</div><div>Profile</div></div>
</div>





<!-- RENT BOOTH MODAL -->
<div class="modal-backdrop hidden" id="rentBackdrop">
  <div class="rent-modal">
    <div class="rent-header">
      <div>💎 Thuê gian hàng</div>
      <span class="rent-close" id="closeRent">✕</span>
    </div>

<div class="rent-body">

  <div class="rent-slot">
    Gian hàng số <b id="rentBoothId">#</b>
  </div>

  <!-- ===== QUICK PLANS ===== -->
  <div class="rent-section-title">⚡ Gói nhanh</div>
  <div class="rent-options">

    <div class="rent-option trial" data-days="30" data-price="0" data-trial="true">
  <div class="days">🎁 Dùng thử</div>
  <div class="price">30 ngày · Miễn phí</div>
  <div class="rent-save hot">FREE</div>
</div>


    <div class="rent-option active" data-days="7" data-price="1000">
      <div class="days">7 ngày</div>
      <div class="price">💎 1,000</div>
    </div>

    <div class="rent-option" data-days="30" data-price="3500">
      <div class="days">30 ngày</div>
      <div class="price">💎 3,500</div>
      <div class="rent-save">Tiết kiệm</div>
    </div>

    <div class="rent-option" data-days="90" data-price="9000">
      <div class="days">90 ngày</div>
      <div class="price">💎 9,000</div>
      <div class="rent-save hot">🔥 Best</div>
    </div>
  </div>

  <!-- ===== CUSTOM DAYS ===== -->
  <div class="rent-section-title">🛠 Tuỳ chỉnh</div>
  <div class="rent-custom">
    <input
      type="range"
      id="rentDaysRange"
      min="1"
      max="180"
      value="7"
    />
    <div class="rent-custom-info">
      <span><b id="rentDaysVal">7</b> ngày</span>
      <span>💎 <b id="rentPriceVal">1,000</b></span>
    </div>
  </div>


  <div class="rent-wallet">
  💎 Số dư hiện tại: <b id="rentCoinVal">0</b>
</div>

  <!-- ===== CONFIRM ===== -->
  <button class="rent-confirm" id="confirmRent">
    Thuê gian hàng
  </button>

  <button id="btnTopupCoin" class="rent-topup hidden">
  💳 Nạp coin
</button>


</div>



  </div>
</div>



<!-- 🔔 MODAL THÔNG BÁO / XÁC NHẬN -->
<div id="lpModal" class="lp-modal hidden">
  <div class="lp-modal-backdrop"></div>
  <div class="lp-modal-box">
    <div class="lp-modal-title" id="lpModalTitle">Thông báo</div>
    <div class="lp-modal-content" id="lpModalContent"></div>

    <div class="lp-modal-actions">
      <button id="lpModalCancel" class="btn ghost hidden">Huỷ</button>
      <button id="lpModalOk" class="btn primary">OK</button>
    </div>
  </div>
</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/market.js"></script>
<script src="/push-init.js"></script>
<script src="/app-entry-guard.js"></script>

</body>
</html>
