<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livestream Pro • Market</title>
<link rel="stylesheet" href="/style.css">

<style>
/* ===== MARKET LAYOUT ===== */

/* ===== FULL BLACK THEME ===== */
html, body{
  background:#000;
  color:#fff;
  margin:0;
}

/* ===== MARKET HEADER ===== */
.market-header{
  padding:18px 16px;
  background:#000;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.market-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.6px;
}
.market-sub{
  margin-top:4px;
  font-size:13px;
  opacity:.7;
}

/* ===== MARKET FLOOR (GRID) ===== */
.market-floor{
  padding:14px;
  padding-bottom:90px; /* chừa tab bar */
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

@media(max-width:600px){
  .market-floor{
    grid-template-columns:repeat(2,1fr);
  }
}

/* ===== BOOTH (GIAN HÀNG) ===== */
.booth{
  aspect-ratio:1/1;
  border-radius:16px;
  border:1.5px dashed rgba(255,255,255,.25);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:.25s;
}

/* Gian trống */
.booth.empty:hover{
  border-color:#25F09A;
  box-shadow:0 0 18px rgba(37,240,154,.35);
}

.booth-plus{
  font-size:32px;
  font-weight:900;
  color:#25F09A;
}

.booth-text{
  margin-top:6px;
  font-size:13px;
  font-weight:800;
}

/* Gian active (để sau này dùng) */
.booth.active{
  border-style:solid;
  border-color:#25F09A;
  box-shadow:0 0 22px rgba(37,240,154,.25);
}

.booth-logo{
  width:56px;
  height:56px;
  border-radius:14px;
  object-fit:cover;
  background:#000;
  box-shadow:
    0 0 12px rgba(37,240,154,.6),
    0 0 24px rgba(37,240,154,.35);
}

.booth-name{
  margin-top:8px;
  font-weight:900;
  font-size:14px;
}

/* ===== MOBILE TAB BAR (STANDARD) ===== */
.lp-tabbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:64px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  background:#000;
  border-top:1px solid rgba(255,255,255,.15);
  z-index:9999;
}

.lp-tab{
  flex:1;
  text-align:center;
  color:#777;
  font-size:12px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  position:relative;
}

.lp-tab .icon{
  font-size:22px;
  line-height:22px;
}

.lp-tab.active{
  color:#25F09A;
}

.lp-tab.active .icon{
  filter: drop-shadow(0 0 12px #25F09A);
}

/* badge (nếu dùng sau này) */
.lp-tab .badge{
  position:absolute;
  top:6px;
  right:30%;
  width:10px;
  height:10px;
  background:#ff3b6b;
  border-radius:50%;
  box-shadow:0 0 10px #ff3b6b;
}


/* ===== RENT MODAL ===== */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

.modal-backdrop.hidden{
  display:none;
}

.rent-modal{
  width:90%;
  max-width:360px;
  background:#000;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 0 30px rgba(37,240,154,.25);
  overflow:hidden;
}

.rent-header{
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.rent-close{
  cursor:pointer;
  font-size:18px;
  opacity:.7;
}

.rent-body{
  padding:16px;
}

.rent-slot{
  text-align:center;
  font-size:14px;
  margin-bottom:14px;
  opacity:.85;
}

/* OPTIONS */
.rent-options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:16px;
}

.rent-option{
  border:1.5px solid rgba(255,255,255,.25);
  border-radius:12px;
  padding:10px 6px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.rent-option .days{
  font-weight:900;
}

.rent-option .price{
  font-size:12px;
  opacity:.8;
  margin-top:4px;
}

.rent-option.active{
  border-color:#25F09A;
  box-shadow:0 0 14px rgba(37,240,154,.35);
  color:#25F09A;
}

/* CONFIRM */
.rent-confirm{
  width:100%;
  border:none;
  border-radius:999px;
  padding:12px;
  font-weight:900;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  cursor:pointer;
}


/* ===== BADGE "GIAN CỦA TÔI" ===== */
.booth{
  position:relative;
}

.booth-mine-badge{
  position:absolute;
  top:8px;
  right:8px;
  background:#25F09A;
  color:#000;
  font-size:11px;
  font-weight:900;
  padding:3px 8px;
  border-radius:999px;
  box-shadow:0 0 10px rgba(37,240,154,.8);
}


/* ===== BADGE HẾT HẠN ===== */
.booth-expire-badge{
  position:absolute;
  bottom:8px;
  left:8px;
  font-size:11px;
  font-weight:900;
  padding:3px 8px;
  border-radius:999px;
  background:#ffb347;
  color:#000;
  box-shadow:0 0 10px rgba(255,179,71,.8);
}

.booth-expire-badge.danger{
  background:#ff5f6d;
  box-shadow:0 0 12px rgba(255,95,109,.9);
}


/* ===== GIAN CỦA TÔI – GLOW RIÊNG ===== */
.booth.booth-mine{
  border:2px solid #25F09A;
  box-shadow:
    0 0 12px rgba(37,240,154,.9),
    0 0 28px rgba(37,240,154,.6),
    inset 0 0 10px rgba(37,240,154,.25);
  animation: boothMineGlow 2.4s ease-in-out infinite;
}

@keyframes boothMineGlow{
  0%{
    box-shadow:
      0 0 10px rgba(37,240,154,.6),
      0 0 20px rgba(37,240,154,.4),
      inset 0 0 8px rgba(37,240,154,.2);
  }
  50%{
    box-shadow:
      0 0 16px rgba(37,240,154,1),
      0 0 36px rgba(37,240,154,.8),
      inset 0 0 12px rgba(37,240,154,.35);
  }
  100%{
    box-shadow:
      0 0 10px rgba(37,240,154,.6),
      0 0 20px rgba(37,240,154,.4),
      inset 0 0 8px rgba(37,240,154,.2);
  }
}


</style>
</head>

<body>

<!-- HEADER -->
<div class="market-header">
  <div class="market-title">🏬 MARKET</div>
  <div class="market-sub" id="marketStats">
    Đang tải thống kê...
  </div>
</div>


<!-- FLOOR -->
<div class="market-floor" id="marketFloor"></div>

<!-- TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab" data-tab="social"><div class="icon">🌍</div><div>Status</div></div>
  <div class="lp-tab active" data-tab="market"><div class="icon">🏬</div><div>Market</div></div>
  <div class="lp-tab" data-tab="lobby"><div class="icon">🏟</div><div>Lobby</div></div>
  <div class="lp-tab" data-tab="messages"><div class="icon">💬</div><div>Chat</div></div>
  <div class="lp-tab" data-tab="profile"><div class="icon">👤</div><div>Profile</div></div>
</div>





<!-- RENT BOOTH MODAL -->
<div class="modal-backdrop hidden" id="rentBackdrop">
  <div class="rent-modal">
    <div class="rent-header">
      <div>💎 Thuê gian hàng</div>
      <span class="rent-close" id="closeRent">✕</span>
    </div>

    <div class="rent-body">
      <div class="rent-slot">Gian hàng số <b id="rentBoothId">#</b></div>

      <div class="rent-options">
        <div class="rent-option active" data-days="7" data-price="1000">
          <div class="days">7 ngày</div>
          <div class="price">💎 1,000</div>
        </div>

        <div class="rent-option" data-days="30" data-price="3500">
          <div class="days">30 ngày</div>
          <div class="price">💎 3,500</div>
        </div>

        <div class="rent-option" data-days="90" data-price="9000">
          <div class="days">90 ngày</div>
          <div class="price">💎 9,000</div>
        </div>
      </div>

      <button class="rent-confirm" id="confirmRent">
        Thuê gian hàng
      </button>
    </div>
  </div>
</div>




<script src="/market.js"></script>
</body>
</html>
