<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livestream Pro • Market</title>
<link rel="stylesheet" href="/style.css">

<style>
/* ===== MARKET LAYOUT ===== */

.market-header{
  padding:18px 16px;
  background:linear-gradient(135deg,#101010,#000);
  border-bottom:1px solid rgba(255,255,255,.12);
}
.market-title{
  font-size:20px;
  font-weight:900;
  letter-spacing:.6px;
}
.market-sub{
  margin-top:4px;
  font-size:13px;
  opacity:.7;
}

/* GRID GIAN HÀNG */
.market-floor{
  padding:14px;
  padding-bottom:90px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

@media(max-width:600px){
  .market-floor{
    grid-template-columns:repeat(2,1fr);
  }
}

/* GIAN HÀNG */
.booth{
  aspect-ratio:1/1;
  border-radius:16px;
  border:1.5px dashed rgba(255,255,255,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:.25s;
  background:rgba(0,0,0,.35);
}

/* GIAN TRỐNG */
.booth.empty:hover{
  background:rgba(37,240,154,.08);
  border-color:#25F09A;
}
.booth-plus{
  font-size:32px;
  font-weight:900;
  color:#25F09A;
}
.booth-text{
  margin-top:6px;
  font-size:13px;
  font-weight:800;
}

/* GIAN ĐÃ THUÊ */
.booth.active{
  border-style:solid;
  border-color:rgba(37,240,154,.5);
  background:linear-gradient(135deg,rgba(37,240,154,.15),rgba(95,168,255,.15));
}
.booth-logo{
  width:56px;
  height:56px;
  border-radius:14px;
  object-fit:cover;
  box-shadow:0 0 14px rgba(37,240,154,.6);
}
.booth-name{
  margin-top:8px;
  font-weight:900;
  font-size:14px;
}

/* TAB BAR */
.lp-tabbar{
  position:fixed;
  bottom:0;left:0;
  width:100%;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="market-header">
  <div class="market-title">🏬 MARKET</div>
  <div class="market-sub">Khu gian hàng giao dịch Livestream Pro</div>
</div>

<!-- FLOOR -->
<div class="market-floor" id="marketFloor"></div>

<!-- TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab" data-tab="lobby"><div class="icon">🎥</div><div>Lobby</div></div>
  <div class="lp-tab active" data-tab="market"><div class="icon">🏬</div><div>Chợ</div></div>
  <div class="lp-tab" data-tab="social"><div class="icon">🏠</div><div>Social</div></div>
  <div class="lp-tab" data-tab="messages"><div class="icon">💬</div><div>Tin nhắn</div></div>
  <div class="lp-tab" data-tab="profile"><div class="icon">👤</div><div>Tôi</div></div>
</div>

<script src="/market.js"></script>
</body>
</html>
