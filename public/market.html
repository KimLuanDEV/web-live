<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Livestream Pro • Market</title>
<link rel="stylesheet" href="/style.css">

<style>
/* ===== MARKET BOOTH ===== */

.market-shell{
  max-width:720px;
  margin:0 auto;
  padding:12px;
  padding-bottom:90px;
}

/* BOOTH GRID */
.booth-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
@media(max-width:420px){
  .booth-grid{ grid-template-columns:1fr; }
}

/* BOOTH CARD */
.booth-card{
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.14);
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}
.booth-card:hover{
  transform:translateY(-3px);
  box-shadow:0 0 22px rgba(37,240,154,.25);
}

/* BANNER */
.booth-banner{
  width:100%;
  height:96px;
  object-fit:cover;
  background:#000;
}

/* BODY */
.booth-body{
  padding:10px;
}

/* SHOP NAME */
.booth-name{
  font-weight:900;
  font-size:15px;
  line-height:1.3;
}

/* OWNER */
.booth-owner{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
  font-size:12px;
  opacity:.85;
}
.booth-owner img{
  width:26px;
  height:26px;
  border-radius:50%;
  object-fit:cover;
}
.booth-verified{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#1d9bf0;
  color:#fff;
  font-size:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

/* STATUS */
.booth-status{
  margin-top:8px;
  font-size:12px;
  font-weight:800;
}
.booth-status.active{ color:#25F09A }
.booth-status.expired{ color:#ff6b6b }

/* BUTTON */
.booth-btn{
  margin-top:10px;
  width:100%;
  border:none;
  border-radius:999px;
  padding:8px;
  font-weight:900;
  cursor:pointer;
}
.booth-btn.enter{
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
}
.booth-btn.rent{
  background:linear-gradient(135deg,#ffb347,#ff5f6d);
  color:#000;
}

/* ADD BOOTH */
.market-add{
  position:fixed;
  right:16px;
  bottom:90px;
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(135deg,#25F09A,#5FA8FF);
  color:#000;
  font-size:28px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 20px rgba(37,240,154,.6);
  cursor:pointer;
  z-index:9999;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="lp-topbar">
  <div class="lp-title">
    <div class="lp-dot"></div>
    MARKET
  </div>
</div>

<div class="market-shell">
  <div class="booth-grid" id="boothGrid"></div>
</div>

<!-- ADD BOOTH -->
<div class="market-add" id="btnRentBooth">＋</div>

<!-- TAB BAR -->
<div class="lp-tabbar">
  <div class="lp-tab" data-tab="lobby"><div class="icon">🎥</div><div>Lobby</div></div>
  <div class="lp-tab active" data-tab="market"><div class="icon">🏪</div><div>Chợ</div></div>
  <div class="lp-tab" data-tab="social"><div class="icon">🏠</div><div>Social</div></div>
  <div class="lp-tab" data-tab="messages"><div class="icon">💬</div><div>Tin nhắn</div></div>
  <div class="lp-tab" data-tab="profile"><div class="icon">👤</div><div>Tôi</div></div>
</div>

<script src="/market.js"></script>
</body>
</html>
