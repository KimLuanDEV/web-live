<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ADMIN WHEEL8</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  margin:0;
  background:
    radial-gradient(circle at center,#001a1a,#000);
  color:#00eaff;
  font-family:"Segoe UI",sans-serif;
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  font-size:16px;
  font-weight:900;
  padding:8px;
  letter-spacing:2px;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

/* ===== PANEL ===== */
.panel{
  width:420px;
  margin:20px auto;
  padding:25px;

  background:rgba(0,20,20,0.6);
  border:1px solid rgba(0,255,255,0.3);
  border-radius:20px;

  box-shadow:
    0 0 20px rgba(0,255,255,0.2),
    inset 0 0 10px rgba(0,255,255,0.1);
}

/* ===== ROW ===== */
.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:14px;
  opacity:0.8;
}

/* ===== BIG VALUE ===== */
.big{
  font-size:42px;
  text-align:center;
  font-weight:900;
  margin:10px 0;

  text-shadow:0 0 15px #00ffff;
}

/* ===== SLOT ===== */
.slot{
  font-size:60px;
  text-align:center;
  font-weight:900;

  color:#00ffff;
  text-shadow:0 0 25px #00ffff;
}

/* ===== MULTI ===== */
.multi{
  font-size:20px;
  text-align:center;
  font-weight:900;

  color:#00ff88;
  text-shadow:0 0 20px #00ff88;
}

/* ===== TIMER ===== */
.timer{
  text-align:center;
  font-size:18px;
  font-weight:900;
  margin-top:10px;

  text-shadow:0 0 15px #00ffff;
}

.timer.danger{
  color:#ff4444;
  text-shadow:0 0 20px red;
}




.slot-box{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.slot-img-admin{
  width:70px;
  height:70px;
  object-fit:contain;

  filter:
    drop-shadow(0 0 15px #00aaff)
    drop-shadow(0 0 30px #00aaff);

  transition:.25s;
}

/* 🔥 hiệu ứng khi override */
.slot-img-admin.flash{
  transform:scale(1.2);

  filter:
    drop-shadow(0 0 25px #00ffff)
    drop-shadow(0 0 50px #00ffff);
}


.override-panel{
  margin-top:20px;
  text-align:center;
}

.override-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.override-grid button{
  padding:12px 0;
  font-size:14px;
  font-weight:900;

  background:#001a33;
  color:#00ffff;

  border:1px solid #00ffff;
  border-radius:10px;

  cursor:pointer;

  transition:.2s;
}

.override-grid button:hover{
  background:#00ffff;
  color:#000;
  transform:scale(1.1);
}


#poolList div,
#betList div{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(0,255,255,0.1);
  font-size:13px;
}

.pool-grid{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:6px;
}

.pool-slot{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background:#111;
}

.pool-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 💰 số tiền */
.pool-value{
  position:absolute;
  bottom:4px;
  left:0;
  width:100%;
  text-align:center;
  font-size:10px;
  font-weight:bold;
  color:#0ff;
  text-shadow:0 0 6px #0ff;
}

/* 🔥 HOT SLOT */
.pool-slot.hot{
  box-shadow:0 0 12px red;
}

/* 🧊 LOW SLOT */
.pool-slot.low{
  opacity:0.5;
}



.container{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px;
}

.card{
  background:rgba(0,20,20,0.6);
  border:1px solid rgba(0,255,255,0.2);
  border-radius:12px;
  padding:10px;

  box-shadow:
    0 0 15px rgba(0,255,255,0.1),
    inset 0 0 10px rgba(0,255,255,0.05);
}

.full-card{
  margin:15px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.label{
  font-size:12px;
  opacity:0.6;
}

.value{
  font-size:22px;
  font-weight:bold;
}

.section-title{
  margin:15px 0 8px;
  font-weight:bold;
  font-size:14px;
  opacity:0.8;
}

.center{
  text-align:center;
}

/* override đẹp hơn */
.override-grid button{
  padding:10px;
  font-size:16px;
  border-radius:8px;

  background:#001a33;
  border:1px solid rgba(0,255,255,0.4);

  transition:.2s;
}

.override-grid button:hover{
  background:#00ffff;
  color:#000;
}

/* player list */
.bet-list div{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(0,255,255,0.1);
}


.pool-slot::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  height:4px;
  width:var(--percent);
  background:linear-gradient(90deg,#00f,#0ff,#0f0,#ff0,#f00);
}


.bet-list div{
  font-size:12px;
  padding:4px 0;
}




@media(max-width:768px){

  .container{
    flex-direction:column;
  }

  .slot-img-admin{
    width:70px;
    height:70px;
  }

  .multi{
    font-size:20px;
  }

  .timer{
    font-size:18px;
  }

}



.override-grid-img{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.override-grid-img img{
  width:100%;
  height:70px;
  object-fit:contain;

  cursor:pointer;

  border-radius:10px;

  transition:.2s;

  filter:
    drop-shadow(0 0 8px #00aaff);
}

/* hover */
.override-grid-img img:hover{
  transform:scale(1.1);
  filter:
    drop-shadow(0 0 15px #00ffff)
    drop-shadow(0 0 25px #00ffff);
}

/* click effect */
.override-grid-img img:active{
  transform:scale(0.95);
    outline:2px solid #00ff88;
  box-shadow:0 0 20px #00ff88;
}


.bet-card{
  display:grid;
  grid-template-columns: 1fr auto;
  align-items:center;

  padding:8px 10px;
  margin-bottom:6px;

  background:rgba(0,30,30,0.7);
  border:1px solid rgba(0,255,255,0.2);
  border-radius:10px;

  box-shadow:
    0 0 10px rgba(0,255,255,0.15),
    inset 0 0 5px rgba(0,255,255,0.05);
}

.bet-left{
  display:flex;
  flex-direction:column;
  gap:2px;
}



.bet-name{
  font-size:13px;
  font-weight:bold;
  color:#00ffff;
}

.bet-coins{
  font-size:11px;
  color:#00ff88;
}

.bet-slots{
  display:grid;
  grid-template-columns:repeat(4,20px);
  gap:4px;
  margin-top:4px;
}

.bet-slot{
  width:20px;
  height:20px;
  position:relative;

  opacity:.35;
  transition:.2s;
}


.bet-slot.active{
  opacity:1;

  filter:
    drop-shadow(0 0 6px #00ffff)
    drop-shadow(0 0 12px #00ffff);
}



.bet-slot img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.bet-slot span{
  position:absolute;
  bottom:-2px;
  right:-2px;

  font-size:9px;
  background:#000;
  padding:1px 2px;
  border-radius:3px;

  color:#0ff;
}

.bet-total{
  font-size:14px;
  font-weight:bold;
  color:#ffcc00;

  padding:3px 6px;
  border-radius:6px;

  background:rgba(255,200,0,0.1);
}



.bet-row{
  display:flex;
  gap:4px;
  margin-top:2px;
}




</style>
</head>

<body>
<div class="container">

  <!-- LEFT -->
  <div class="card main-card">

    <div class="row top-row">
      <div>
        <div class="label">ROUND</div>
        <div id="round" class="value">--</div>
      </div>

      <div id="time" class="timer">0s</div>
    </div>

    <div class="slot-box">
      <img id="slotImg" class="slot-img-admin">
    </div>

    <div class="multi">x<span id="multi">0</span></div>


  </div>

  <!-- RIGHT -->
  <div class="card override-card">

    <div class="label center">OVERRIDE</div>

<div class="override-grid-img">

  <img src="/assets/police/slot1.png" onclick="setSlot(1)">
  <img src="/assets/police/slot8.png" onclick="setSlot(8)">
  <img src="/assets/police/slot7.png" onclick="setSlot(7)">
  <img src="/assets/police/slot6.png" onclick="setSlot(6)">
  <img src="/assets/police/slot2.png" onclick="setSlot(2)">
  <img src="/assets/police/slot3.png" onclick="setSlot(3)">
  <img src="/assets/police/slot4.png" onclick="setSlot(4)">
  <img src="/assets/police/slot5.png" onclick="setSlot(5)">
</div>

  </div>

</div>

<!-- POOL + PLAYER -->
<div class="card full-card">

  <div class="section-title">SLOT POOL</div>
  <div id="poolList" class="pool-grid"></div>

  <div class="section-title">👤 PLAYER BETS</div>
  <div id="betList" class="bet-list"></div>

</div>

<script>
const me = JSON.parse(localStorage.getItem("user_profile") || "{}")

const socket = io({
  auth:{
    uid: me.uid,
    deviceId: me.deviceId || null
  }
})


socket.on("connect",()=>{
  console.log("✅ ADMIN CONNECTED:", socket.id, me.uid)
})

socket.on("connect_error",(err)=>{
  console.log("❌ CONNECT ERROR:", err.message)
})

socket.on("admin-wheel8-secret",(data)=>{

  document.getElementById("round").textContent = data.roundId

  const img = document.getElementById("slotImg")

img.src = "/assets/police/slot" + data.slot + ".png"

// 🔥 flash effect
img.classList.add("flash")

setTimeout(()=>{
  img.classList.remove("flash")
},200)


  document.getElementById("multi").textContent = data.multiplier

})

socket.on("wheel8-timer",(remain)=>{

  const el = document.getElementById("time")

  el.textContent = remain + "s"

  if(remain <= 5){
    el.classList.add("danger")
  }else{
    el.classList.remove("danger")
  }

})


function setSlot(slot){

  console.log("🎯 OVERRIDE CLICK:", slot)

  // highlight
  document.querySelectorAll(".override-grid-img img")
    .forEach(img=>img.classList.remove("active"))

  const target =
    document.querySelector(`.override-grid-img img:nth-child(${slot})`)

  if(target) target.classList.add("active")

  socket.emit("admin-wheel8-override",{ slot })
}


socket.on("admin-wheel8-bets-update",(data)=>{

  // ======================
  // 💰 SLOT POOL
  // ======================
  const poolBox = document.getElementById("poolList")
  poolBox.innerHTML = ""

  const max = Math.max(...data.pool,1)

  // 🔥 thứ tự slot mới
  const order = [1,8,7,6,2,3,4,5]

  order.forEach(slot=>{

    const i = slot - 1
    const v = data.pool[i]

    const div = document.createElement("div")
    div.className = "pool-slot"

    // 🔥 phân loại
    if(v > max * 0.6){
      div.classList.add("hot")
    }else if(v < max * 0.2){
      div.classList.add("low")
    }

    // 📊 % bar
    const percent = (v / max) * 100
    div.style.setProperty("--percent", percent + "%")

    div.innerHTML = `
      <img src="/assets/police/slot${slot}.png">
      <div class="pool-value">${v}</div>
    `

    poolBox.appendChild(div)

  })


  // ======================
  // 👤 PLAYER BETS
  // ======================
  const betBox = document.getElementById("betList")
  betBox.innerHTML = ""

  if(!data.players || !data.players.length){
    betBox.innerHTML = "<div>NO BETS</div>"
    return
  }

  const players = data.players.sort((a,b)=>b.total - a.total)

  players.forEach((p,index)=>{

    const div = document.createElement("div")
    div.className = "bet-card"

    if(index === 0){
      div.style.boxShadow = "0 0 10px #00ff88"
    }

let row1 = ""
let row2 = ""

const row1Slots = [1,8,7,6]
const row2Slots = [2,3,4,5]

row1Slots.forEach(s=>{

  const v = p.slots[s-1]
  const active = v > 0 ? "active" : ""

  row1 += `
    <div class="bet-slot ${active}">
      <img src="/assets/police/slot${s}.png">
      ${v > 0 ? `<span>${v}</span>` : ``}
    </div>
  `
})

row2Slots.forEach(s=>{

  const v = p.slots[s-1]
  const active = v > 0 ? "active" : ""

  row2 += `
    <div class="bet-slot ${active}">
      <img src="/assets/police/slot${s}.png">
      ${v > 0 ? `<span>${v}</span>` : ``}
    </div>
  `
})

const slotsHTML = `
  <div class="bet-row">${row1}</div>
  <div class="bet-row">${row2}</div>
`

div.innerHTML = `
  <div class="bet-left">

    <div>

      <div class="bet-name">${p.name}</div>

<div class="bet-coins">
💰 ${p.coins}
</div>

      <div class="bet-slots">
        ${slotsHTML}
      </div>

    </div>

  </div>

  <div class="bet-total">
    ${p.total}
  </div>
`

    betBox.appendChild(div)

  })

})


</script>

</body>
</html>
