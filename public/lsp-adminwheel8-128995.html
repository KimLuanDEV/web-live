<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MILITARY | COMMAND CENTER</title>


<script src="/socket.io/socket.io.js"></script>

<style>
body{
  margin:0;
  background:
    radial-gradient(circle at center,#001a1a,#000);
  color:#00eaff;
  font-family:"Segoe UI",sans-serif;
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  font-size:16px;
  font-weight:900;
  padding:8px;
  letter-spacing:2px;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

/* ===== PANEL ===== */
.panel{
  width:420px;
  margin:20px auto;
  padding:25px;

  background:rgba(0,20,20,0.6);
  border:1px solid rgba(0,255,255,0.3);
  border-radius:20px;

  box-shadow:
    0 0 20px rgba(0,255,255,0.2),
    inset 0 0 10px rgba(0,255,255,0.1);
}

/* ===== ROW ===== */
.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:14px;
  opacity:0.8;
}

/* ===== BIG VALUE ===== */
.big{
  font-size:42px;
  text-align:center;
  font-weight:900;
  margin:10px 0;

  text-shadow:0 0 15px #00ffff;
}

/* ===== SLOT ===== */
.slot{
  font-size:60px;
  text-align:center;
  font-weight:900;

  color:#00ffff;
  text-shadow:0 0 25px #00ffff;
}

/* ===== MULTI ===== */
.multi{
  font-size:20px;
  text-align:center;
  font-weight:900;

  color:#00ff88;
  text-shadow:0 0 20px #00ff88;
}

/* ===== TIMER ===== */
.timer{
  text-align:center;
  font-size:18px;
  font-weight:900;
  margin-top:10px;

  text-shadow:0 0 15px #00ffff;
}

.timer.danger{
  color:#ff4444;
  text-shadow:0 0 20px red;
}




.slot-box{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.slot-img-admin{
  width:70px;
  height:70px;
  object-fit:contain;

  filter:
    drop-shadow(0 0 15px #00aaff)
    drop-shadow(0 0 30px #00aaff);

  transition:.25s;
}

/* 🔥 hiệu ứng khi override */
.slot-img-admin.flash{
  transform:scale(1.2);

  filter:
    drop-shadow(0 0 25px #00ffff)
    drop-shadow(0 0 50px #00ffff);
}


.override-panel{
  margin-top:20px;
  text-align:center;
}

.override-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.override-grid button{
  padding:12px 0;
  font-size:14px;
  font-weight:900;

  background:#001a33;
  color:#00ffff;

  border:1px solid #00ffff;
  border-radius:10px;

  cursor:pointer;

  transition:.2s;
}

.override-grid button:hover{
  background:#00ffff;
  color:#000;
  transform:scale(1.1);
}


#poolList div,
#betList div{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(0,255,255,0.1);
  font-size:13px;
}

.pool-grid{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:6px;
}

.pool-slot{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background:#111;
}

.pool-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 💰 số tiền */
.pool-value{
  position:absolute;
  bottom:4px;
  left:0;
  width:100%;
  text-align:center;
  font-size:10px;
  font-weight:bold;
  color:#0ff;
  text-shadow:0 0 6px #0ff;
}

/* 🔥 HOT SLOT */
.pool-slot.hot{
  box-shadow:0 0 12px red;
}

/* 🧊 LOW SLOT */
.pool-slot.low{
  opacity:0.5;
}



.container{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:8px;
}

.card{
  background:rgba(0,20,20,0.6);
  border:1px solid rgba(0,255,255,0.2);
  border-radius:12px;
  padding:10px;

  box-shadow:
    0 0 15px rgba(0,255,255,0.1),
    inset 0 0 10px rgba(0,255,255,0.05);
}

.full-card{
  margin:15px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.label{
  font-size:12px;
  opacity:0.6;
}

.value{
  font-size:22px;
  font-weight:bold;
}

.section-title{
  margin:15px 0 8px;
  font-weight:bold;
  font-size:14px;
  opacity:0.8;
}

.center{
  text-align:center;
}

/* override đẹp hơn */
.override-grid button{
  padding:10px;
  font-size:16px;
  border-radius:8px;

  background:#001a33;
  border:1px solid rgba(0,255,255,0.4);

  transition:.2s;
}

.override-grid button:hover{
  background:#00ffff;
  color:#000;
}

/* player list */
.bet-list div{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(0,255,255,0.1);
}


.pool-slot::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  height:4px;
  width:var(--percent);
  background:linear-gradient(90deg,#00f,#0ff,#0f0,#ff0,#f00);
}


.bet-list div{
  font-size:12px;
  padding:4px 0;
}




@media(max-width:768px){

  .container{
    flex-direction:column;
  }

  .slot-img-admin{
    width:70px;
    height:70px;
  }

  .multi{
    font-size:20px;
  }

  .timer{
    font-size:18px;
  }

}



.override-grid-img{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.override-grid-img img{
  width:100%;
  height:70px;
  object-fit:contain;

  cursor:pointer;

  border-radius:10px;

  transition:.2s;

  filter:
    drop-shadow(0 0 8px #00aaff);
}

/* hover */
.override-grid-img img:hover{
  transform:scale(1.1);
  filter:
    drop-shadow(0 0 15px #00ffff)
    drop-shadow(0 0 25px #00ffff);
}

/* click effect */
.override-grid-img img:active{
  transform:scale(0.95);
    outline:2px solid #00ff88;
  box-shadow:0 0 20px #00ff88;
}


.bet-card{
  display:grid;
  grid-template-columns: 1fr auto;
  align-items:center;

  padding:8px 10px;
  margin-bottom:6px;

  background:rgba(0,30,30,0.7);
  border:1px solid rgba(0,255,255,0.2);
  border-radius:10px;

  box-shadow:
    0 0 10px rgba(0,255,255,0.15),
    inset 0 0 5px rgba(0,255,255,0.05);
}

.bet-left{
  display:flex;
  flex-direction:column;
  gap:2px;
}



.bet-name{
  font-size:13px;
  font-weight:bold;
  color:#00ffff;
}

.bet-coins{
  font-size:11px;
  color:#00ff88;
}

.bet-slots{
  display:grid;
  grid-template-columns:repeat(4,20px);
  gap:4px;
  margin-top:4px;
}

.bet-slot{
  width:20px;
  height:20px;
  position:relative;

  opacity:.35;
  transition:.2s;
}


.bet-slot.active{
  opacity:1;

  filter:
    drop-shadow(0 0 6px #00ffff)
    drop-shadow(0 0 12px #00ffff);
}



.bet-slot img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.bet-slot span{
  position:absolute;
  bottom:-2px;
  right:-2px;

  font-size:9px;
  background:#000;
  padding:1px 2px;
  border-radius:3px;

  color:#0ff;
}

.bet-total{
  font-size:14px;
  font-weight:bold;
  color:#ffcc00;

  padding:3px 6px;
  border-radius:6px;

  background:rgba(255,200,0,0.1);
}



.bet-row{
  display:flex;
  gap:4px;
  margin-top:2px;
}


/* ===== ADMIN OVERRIDE 10 OPTIONS ===== */

.override-grid-img{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px;
  margin-top:10px;
}

.override-grid-img img{
  width:100%;
  height:70px;
  object-fit:contain;
  cursor:pointer;
  border-radius:10px;
  transition:transform .2s, filter .2s;
}

.override-grid-img img[data-event="x5-all"]{
  grid-column:2;
}

.override-grid-img img[data-event="x45-all"]{
  grid-column:3;
}

.override-grid-img img.active{
  transform:scale(1.08);
  filter:
    drop-shadow(0 0 10px #00ff88)
    drop-shadow(0 0 20px #00ff88);
}


/* ==========================================
   MILITARY COMMAND CENTER - ADMIN WHEEL8
   THEME: OLIVE / ARMY / GOLD / LED GREEN
========================================== */

:root {
    --army-bg: #080f0a;
    --army-panel: #192b1c;
    --army-gold: #d4b46b;
    --army-green: #a8ff70;
    --army-border: #71815b;
}

/* NỀN TOÀN TRANG */
html {
    min-height: 100%;
    background: var(--army-bg);
}

body {
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
    overflow-x: hidden;

    font-family: "Segoe UI", system-ui, sans-serif;
    color: #e0e9d6;

    background:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(85,113,61,.35),
            transparent 65%
        ),
        repeating-linear-gradient(
            135deg,
            transparent 0 35px,
            rgba(140,160,90,.025) 35px 70px
        ),
        linear-gradient(
            180deg,
            #263b29 0%,
            #111f15 35%,
            #060d08 100%
        );
}

/* BỐ CỤC MOBILE-FIRST */
.container {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 12px;
    box-sizing: border-box;

    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* KHUNG CHỈ HUY */
.card {
    position: relative;
    min-width: 0;
    padding: 15px;
    box-sizing: border-box;
    overflow: hidden;

    background:
        repeating-linear-gradient(
            135deg,
            transparent 0 14px,
            rgba(255,255,255,.012) 14px 28px
        ),
        linear-gradient(
            145deg,
            #354832 0%,
            #1a2d1d 45%,
            #0b180f 100%
        );

    border: 1px solid #a18c58;
    border-bottom: 3px solid #c7a75d;
    border-radius: 8px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 0 16px rgba(0,0,0,.35);
}

/* ĐƯỜNG KIM LOẠI */
.card::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 15px;
    right: 15px;
    height: 1px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(246,213,135,.6),
        transparent
    );

    pointer-events: none;
}

/* ROUND / TIMER */
.top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.label {
    color: #b6c8a7;
    opacity: 1;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
}

.value {
    color: #f4d789;
    font-size: 27px;
    font-weight: 1000;
    font-variant-numeric: tabular-nums;

    text-shadow:
        0 2px 2px #000,
        0 0 10px rgba(255,205,90,.25);
}

/* ĐỒNG HỒ LED */
.timer {
    min-width: 82px;
    height: 43px;
    margin: 0;
    padding: 0 12px;
    box-sizing: border-box;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        180deg,
        #233a25,
        #07140b
    );

    border: 1px solid #a18c58;
    border-bottom: 2px solid #d5b56c;
    border-radius: 5px;

    color: #a8ff70;
    font-family: monospace;
    font-size: 25px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;

    text-shadow:
        0 0 6px rgba(115,255,65,.7),
        0 0 12px rgba(115,255,65,.35);

    box-shadow:
        inset 0 2px 8px #0009,
        0 3px 8px #0008;
}

/* CẢNH BÁO 5 GIÂY CUỐI */
.timer.danger {
    color: #ff6960;
    border-color: #e57555;

    text-shadow:
        0 0 8px #ff3333,
        0 0 15px #ff333377;

    animation: armyTimerDanger .65s infinite alternate;
}

@keyframes armyTimerDanger {
    from { filter: brightness(1); }
    to { filter: brightness(1.4); }
}

/* ẢNH KẾT QUẢ */
.slot-box {
    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 110px;
    margin: 10px 0 5px;

    background:
        radial-gradient(
            circle,
            rgba(103,146,62,.18),
            transparent 70%
        );
}

.slot-img-admin {
    width: 105px;
    height: 105px;
    object-fit: contain;

    filter:
        drop-shadow(0 0 8px rgba(156,255,87,.35))
        drop-shadow(0 6px 8px #0009);
}

.slot-img-admin.flash {
    transform: scale(1.12);
    filter:
        drop-shadow(0 0 15px #d8ba70)
        drop-shadow(0 0 25px #8dff4c);
}

/* HỆ SỐ NHÂN */
.multi {
    margin: 5px 0 3px;

    color: #f5d37d;
    font-size: 27px;
    font-weight: 1000;
    letter-spacing: 1px;

    text-shadow:
        0 2px 3px #000,
        0 0 12px rgba(255,211,90,.4);
}

/* TIÊU ĐỀ CÁC KHU VỰC */
.section-title,
.override-card > .label {
    display: block;
    margin: 5px 0 12px;

    color: #f1d184;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.2px;
    opacity: 1;
    text-shadow: 0 2px 3px #000;
}

.override-card > .label::before {
    content: "★ ";
}

.override-card > .label::after {
    content: " ★";
}

/* LƯỚI CHỌN SLOT */
.override-grid-img {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 9px;
    margin-top: 12px;
}

.override-grid-img img {
    display: block;
    width: 100%;
    height: 75px;
    box-sizing: border-box;
    padding: 5px;

    object-fit: contain;
    cursor: pointer;

    background: linear-gradient(
        145deg,
        #334a31,
        #152719 60%,
        #09140c
    );

    border: 1px solid #647b54;
    border-radius: 6px;

    box-shadow:
        inset 0 1px 0 #ffffff16,
        0 3px 7px #0007;

    filter: none;
    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.override-grid-img img:hover {
    transform: translateY(-2px);
    border-color: #d8b76b;

    filter: none;
    box-shadow: 0 0 12px #d5b66544;
}

.override-grid-img img:active {
    transform: scale(.95);
}

/* SLOT / EVENT ĐƯỢC CHỌN */
.override-grid-img img.active {
    transform: scale(1.03);

    border: 2px solid #baff7b;
    background: linear-gradient(
        145deg,
        #48633b,
        #203a24
    );

    filter:
        drop-shadow(0 0 5px #8cff4c66);

    box-shadow:
        0 0 12px #8cff4c77,
        inset 0 0 10px #8cff4c22;
}

/* EVENT ĐẶC BIỆT */
.override-grid-img img[data-event="x5-all"] {
    grid-column: 2;
    border-color: #c6a85d;
}

.override-grid-img img[data-event="x45-all"] {
    grid-column: 3;
    border-color: #c6a85d;
}

/* BẢNG SLOT POOL */
.pool-grid {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 8px;
}

.pool-slot {
    position: relative;
    min-width: 0;
    aspect-ratio: 1 / 1;
    overflow: hidden;

    background: linear-gradient(
        145deg,
        #30452e,
        #0c1b10
    );

    border: 1px solid #667b54;
    border-radius: 6px;

    box-shadow: inset 0 0 10px #0008;
}

.pool-slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 4px 4px 18px;
    box-sizing: border-box;
}

.pool-value {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    padding: 4px 2px;
    box-sizing: border-box;

    background: rgba(5,15,8,.85);
    color: #baff83;

    font-size: 11px;
    font-weight: 900;
    text-align: center;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 5px #73ff4c66;
}

.pool-slot.hot {
    border-color: #e6ad5b;
    box-shadow: 0 0 10px #e6ad5b44;
}

.pool-slot.low {
    opacity: .65;
}

.pool-slot::after {
    background: linear-gradient(
        90deg,
        #4d8436,
        #aaff6b,
        #e3c76b
    );
}

/* DANH SÁCH NGƯỜI CHƠI */
.bet-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.bet-card {
    display: grid;
    grid-template-columns: minmax(0,1fr) auto;
    gap: 10px;
    align-items: center;

    margin: 0;
    padding: 10px;

    background: linear-gradient(
        145deg,
        #263b28,
        #101f14
    );

    border: 1px solid #617750;
    border-radius: 6px;

    box-shadow:
        0 3px 8px #0005,
        inset 0 1px 0 #ffffff12;
}

.bet-name {
    color: #f0d58b;
    font-size: 13px;
    font-weight: 900;
}

.bet-coins {
    color: #a9ff79;
    font-size: 11px;
    font-weight: 800;
}

.bet-slot.active {
    filter: drop-shadow(0 0 6px #8cff50);
}

.bet-slot span {
    background: #0c1c10;
    color: #c6ff9a;
    border: 1px solid #637a50;
}

.bet-total {
    background: #263a24;
    border: 1px solid #a78c51;
    border-radius: 5px;

    color: #f3d27d;
    font-size: 14px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}

/* CARD DANH SÁCH BÊN DƯỚI */
.full-card {
    width: calc(100% - 24px);
    max-width: 626px;
    margin: 0 auto 20px;
}

/* MOBILE */
@media (max-width: 480px) {
    .container {
        padding: 9px;
        gap: 9px;
    }

    .card {
        padding: 12px;
    }

    .override-grid-img {
        gap: 6px;
    }

    .override-grid-img img {
        height: 66px;
        padding: 3px;
    }

    .full-card {
        width: calc(100% - 18px);
    }

    .slot-img-admin {
        width: 95px;
        height: 95px;
    }
}



/* ==========================================
   WHEEL8 MILITARY ADMIN LOGIN
========================================== */

  inset: 0;
  z-index: 999999;

  display: flex;

    );

.wheel8-login-screen.hidden {

}

body:not(.wheel8-admin-unlocked) > .container,
body:not(.wheel8-admin-unlocked) > .full-card {

.wheel8-login-box {

.wheel8-login-icon {

.wheel8-login-title {

  letter-spacing: 2px;

.wheel8-login-sub {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 3px;

  color: #a8ff70;

.wheel8-login-line {

.wheel8-login-box label {

#wheel8AdminPassword {

  height: 50px;
  box-sizing: border-box;
  padding: 0 15px;

  background: #07130b;
  border: 1px solid #607750;
  border-radius: 6px;
  outline: none;

  color: #e5f9d6;
  font-size: 16px;
  letter-spacing: 2px;

  transition: .2s;
}

#wheel8AdminPassword:focus {
  border-color: #b8d777;
  box-shadow: 0 0 12px #9dff6b33;
}

#wheel8AdminPassword::placeholder {
  color: #718168;
  letter-spacing: 0;
}

#wheel8LoginBtn {
  width: 100%;
  min-height: 51px;
  margin-top: 18px;
  padding: 12px;

  border: 1px solid #e7cf8f;
  border-radius: 6px;

  background: linear-gradient(
    180deg,
    #dec483,
    #9b783e
  );

  color: #17220f;
  font-size: 13px;
  font-weight: 1000;
  letter-spacing: .6px;

  cursor: pointer;
}

#wheel8LoginBtn:active {
  transform: scale(.98);
}

#wheel8LoginBtn:disabled {
  opacity: .55;
  cursor: not-allowed;
}

#wheel8LoginMessage {
  min-height: 20px;
  margin-top: 16px;
  color: #ff9187;
  font-size: 12px;
  font-weight: 700;

  color: #7f957b;
  font-size: 10px;

/* ==========================================
   WHEEL8 ADMIN - FULL SCREEN RESPONSIVE
   MOBILE / TABLET / DESKTOP
========================================== */

html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  overflow-x: hidden;
}

*, *::before, *::after {
  box-sizing: border-box;
}

/* ===== KHUNG CHÍNH ===== */

.container {
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px;

  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
  gap: 16px;
  align-items: stretch;
}

.container > .card {
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 20px;
}

/* ===== ROUND / TIMER ===== */

.label {
  font-size: clamp(12px, 1.4vw, 16px);
}

.value {
  font-size: clamp(28px, 3vw, 40px);
}

.timer {
  min-width: 95px;
  height: 52px;
  font-size: clamp(25px, 3vw, 36px);
}

/* ===== KẾT QUẢ SLOT ===== */

.slot-box {
  min-height: 160px;
  margin: 15px 0;
}

.slot-img-admin {
  width: clamp(110px, 13vw, 170px);
  height: clamp(110px, 13vw, 170px);
  object-fit: contain;
}

.multi {
  font-size: clamp(28px, 3vw, 42px);
}

/* ===== TIÊU ĐỀ ===== */

.section-title,
.override-card > .label {
  font-size: clamp(14px, 1.5vw, 19px);
  margin-bottom: 15px;
}

/* ===== LƯỚI SLOT OVERRIDE ===== */

.override-grid-img {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 14px;
}

.override-grid-img img {
  width: 100%;
  height: clamp(80px, 9vw, 125px);
  padding: 8px;
  object-fit: contain;
}

/* ===== SLOT POOL ===== */

.full-card {
  width: calc(100% - 32px);
  max-width: 1368px;
  margin: 0 auto 20px;
  padding: 20px;
}

.pool-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.pool-slot {
  aspect-ratio: 1 / 1;
}

.pool-value {
  font-size: clamp(12px, 1.5vw, 18px);
  padding: 6px;
}

/* ===== PLAYER BETS ===== */

.bet-card {
  padding: 14px;
  gap: 12px;
}

.bet-name {
  font-size: clamp(14px, 1.5vw, 18px);
}

.bet-coins {
  font-size: clamp(12px, 1.2vw, 15px);
}

.bet-total {
  font-size: clamp(15px, 1.7vw, 20px);
}

.bet-slot {
  width: 30px;
  height: 30px;
}

.bet-slot span {
  font-size: 10px;
}

/* ===== MÀN HÌNH ĐĂNG NHẬP ===== */

.wheel8-login-screen {
  width: 100%;
  min-height: 100dvh;
  padding: 16px;
}

.wheel8-login-box {
  width: 100%;
  max-width: 440px;
  padding: 32px 24px;
}

/* ==========================================
   TABLET
========================================== */

@media (max-width: 900px) {

  .container {
    grid-template-columns: 1fr;
    padding: 12px;
    gap: 12px;
  }

  .container > .card {
    padding: 16px;
  }

  .full-card {
    width: calc(100% - 24px);
    padding: 16px;
  }

  .slot-img-admin {
    width: 130px;
    height: 130px;
  }

  .override-grid-img img {
    height: 95px;
  }
}

/* ==========================================
   MOBILE 320px - 600px
========================================== */

@media (max-width: 600px) {

  .container {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: none;
    padding: 8px;
    gap: 10px;
  }

  .container > .card {
    width: 100%;
    padding: 12px;
  }

  .main-card {
    padding: 14px;
  }

  .label {
    font-size: 13px;
  }

  .value {
    font-size: 30px;
  }

  .timer {
    min-width: 90px;
    height: 47px;
    font-size: 27px;
  }

  .slot-box {
    min-height: 125px;
    margin: 8px 0;
  }

  .slot-img-admin {
    width: 115px;
    height: 115px;
  }

  .multi {
    font-size: 31px;
  }

  .override-grid-img {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px;
    margin-top: 10px;
  }

  .override-grid-img img {
    width: 100%;
    height: clamp(72px, 20vw, 105px);
    padding: 5px;
  }

  .full-card {
    width: calc(100% - 16px);
    max-width: none;
    margin: 0 auto 12px;
    padding: 12px;
  }

  .section-title,
  .override-card > .label {
    font-size: 15px;
  }

  .pool-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px;
  }

  .pool-value {
    font-size: 11px;
    padding: 4px 2px;
  }

  .bet-card {
    padding: 10px;
  }

  .bet-name {
    font-size: 14px;
  }

  .bet-coins {
    font-size: 12px;
  }

  .bet-total {
    font-size: 15px;
  }

  .bet-slot {
    width: 24px;
    height: 24px;
  }

  .wheel8-login-box {
    max-width: 100%;
    padding: 28px 20px;
  }

  .wheel8-login-title {
    font-size: 23px;
  }

  #wheel8AdminPassword {
    font-size: 16px;
  }
}



</style>
</head>


<body>

<!-- 🔐 WHEEL8 ADMIN LOGIN -->
<div id="wheel8LoginScreen" class="wheel8-login-screen">

  <form id="wheel8LoginForm" class="wheel8-login-box">

    <div class="wheel8-login-icon">🛡️</div>

    <div class="wheel8-login-title">
      COMMAND CENTER
    </div>

    <div class="wheel8-login-sub">
      WHEEL8 ADMIN ACCESS
    </div>

    <div class="wheel8-login-line"></div>

    <label for="wheel8AdminPassword">
      MẬT KHẨU QUẢN TRỊ
    </label>

    <input
      id="wheel8AdminPassword"
      type="password"
      placeholder="Nhập mật khẩu admin"
      autocomplete="off"
      maxlength="256"
      required
    >

    <button id="wheel8LoginBtn" type="submit">
      🔓 XÁC THỰC QUYỀN TRUY CẬP
    </button>

    <div id="wheel8LoginMessage"></div>

    <div class="wheel8-login-footer">
      SECURE ADMIN CONTROL SYSTEM
    </div>

  </form>

</div>

<div class="container">


  <!-- LEFT -->
  <div class="card main-card">

    <div class="row top-row">
      <div>
        <div class="label">ROUND</div>
        <div id="round" class="value">--</div>
      </div>

      <div id="time" class="timer">0s</div>
    </div>

    <div class="slot-box">
      <img id="slotImg" class="slot-img-admin">
    </div>

    <div class="multi">x<span id="multi">0</span></div>


  </div>

  <!-- RIGHT -->
  <div class="card override-card">

    <div class="label center">OVERRIDE</div>

<div class="override-grid-img">

  <!-- SLOT THƯỜNG -->
  <img src="/assets/police/slot1.png" onclick="setSlot(1)" data-slot="1">
  <img src="/assets/police/slot8.png" onclick="setSlot(8)" data-slot="8">
  <img src="/assets/police/slot7.png" onclick="setSlot(7)" data-slot="7">
  <img src="/assets/police/slot6.png" onclick="setSlot(6)" data-slot="6">

  <img src="/assets/police/slot2.png" onclick="setSlot(2)" data-slot="2">
  <img src="/assets/police/slot3.png" onclick="setSlot(3)" data-slot="3">
  <img src="/assets/police/slot4.png" onclick="setSlot(4)" data-slot="4">
  <img src="/assets/police/slot5.png" onclick="setSlot(5)" data-slot="5">

  <!-- EVENT ĐẶC BIỆT -->
  <img
    src="/assets/police/event-x5-all.png"
    onclick="setEvent('x5-all')"
    data-event="x5-all"
    alt="EVENT ALL x5"
  >

  <img
    src="/assets/police/event-x45-all.png"
    onclick="setEvent('x45-all')"
    data-event="x45-all"
    alt="EVENT ALL x45"
  >

</div>

  </div>

</div>

<!-- POOL + PLAYER -->
<div class="card full-card">

  <div class="section-title">SLOT POOL</div>
  <div id="poolList" class="pool-grid"></div>

  <div class="section-title">👤 PLAYER BETS</div>
  <div id="betList" class="bet-list"></div>

</div>

<script>
const me = JSON.parse(localStorage.getItem("user_profile") || "{}")

const socket = io({
  auth:{
    uid: me.uid,
    deviceId: me.deviceId || null
  }
})



// ==========================================
// 🔐 WHEEL8 ADMIN LOGIN CONTROLLER
// ==========================================

let wheel8AdminUnlocked = false;

const wheel8LoginScreen =
  document.getElementById("wheel8LoginScreen");

const wheel8LoginForm =
  document.getElementById("wheel8LoginForm");

const wheel8LoginInput =
  document.getElementById("wheel8AdminPassword");

const wheel8LoginBtn =
  document.getElementById("wheel8LoginBtn");

const wheel8LoginMessage =
  document.getElementById("wheel8LoginMessage");

function lockWheel8Admin(message = "") {
  wheel8AdminUnlocked = false;

  document.body.classList.remove(
    "wheel8-admin-unlocked"
  );

  wheel8LoginScreen.classList.remove("hidden");
  wheel8LoginInput.value = "";
  wheel8LoginBtn.disabled = false;
  wheel8LoginMessage.textContent = message;
}

function unlockWheel8Admin() {
  wheel8AdminUnlocked = true;

  document.body.classList.add(
    "wheel8-admin-unlocked"
  );

  wheel8LoginScreen.classList.add("hidden");
  wheel8LoginInput.value = "";
  wheel8LoginMessage.textContent = "";
  wheel8LoginBtn.disabled = false;
}

socket.on("connect", () => {
  console.log("✅ WHEEL8 SOCKET CONNECTED");
  lockWheel8Admin();
});

socket.on("disconnect", () => {
  lockWheel8Admin("Mất kết nối đến máy chủ.");
});

wheel8LoginForm.addEventListener("submit", (e) => {
  e.preventDefault();

  const password = wheel8LoginInput.value;

  if (!password) {
    wheel8LoginMessage.textContent =
      "Vui lòng nhập mật khẩu quản trị.";
    return;
  }

  if (!socket.connected) {
    wheel8LoginMessage.textContent =
      "Chưa kết nối được máy chủ.";
    return;
  }

  wheel8LoginBtn.disabled = true;
  wheel8LoginMessage.textContent = "Đang xác thực...";

  socket.timeout(10000).emit(
    "wheel8-admin-login",
    { password },
    (err, result) => {

      wheel8LoginBtn.disabled = false;

      if (err) {
        wheel8LoginMessage.textContent =
          "Không nhận được phản hồi từ server.";
        return;
      }

      if (!result?.ok) {
        wheel8LoginMessage.textContent =
          result?.message || "Xác thực thất bại.";

        wheel8LoginInput.value = "";
        wheel8LoginInput.focus();
        return;
      }

      unlockWheel8Admin();
    }
  );
});


socket.on("connect_error",(err)=>{
  console.log("❌ CONNECT ERROR:", err.message)
})

socket.on("admin-wheel8-secret", (data) => {

    document.getElementById("round").textContent =
        data.roundId ?? "--";

    const img = document.getElementById("slotImg");

    // Ưu tiên hình EVENT nếu server gửi sự kiện
    if (data.event === "x5-all") {

        img.src = "/assets/police/event-x5-all.png";

    } else if (data.event === "x45-all") {

        img.src = "/assets/police/event-x45-all.png";

    } else if (
        Number.isInteger(data.slot) &&
        data.slot >= 1 &&
        data.slot <= 8
    ) {

        img.src = `/assets/police/slot${data.slot}.png`;

    } else {

        // Không tạo đường dẫn slotnull.png
        img.removeAttribute("src");
        console.warn("Invalid Wheel8 slot:", data);
    }

    // Hiệu ứng khi cập nhật
    img.classList.remove("flash");
    void img.offsetWidth;
    img.classList.add("flash");

    setTimeout(() => {
        img.classList.remove("flash");
    }, 200);

    document.getElementById("multi").textContent =
        data.multiplier ?? 0;

});

socket.on("wheel8-timer",(remain)=>{

  const el = document.getElementById("time")

  el.textContent = remain + "s"

  if(remain <= 5){
    el.classList.add("danger")
  }else{
    el.classList.remove("danger")
  }

})


function highlightOverride(selector){

  document.querySelectorAll(".override-grid-img img")
    .forEach(img => img.classList.remove("active"));

  const target = document.querySelector(selector);

  if(target){
    target.classList.add("active");
  }
}


// ==========================================
// 🛠 OVERRIDE WHEEL8 - AUTH REQUIRED
// ==========================================

function sendWheel8Override(data, selector) {

  if (!wheel8AdminUnlocked || !socket.connected) {
    lockWheel8Admin("Vui lòng xác thực mật khẩu.");
    return;
  }

  socket.timeout(10000).emit(
    "admin-wheel8-override",
    data,
    (err, result) => {

      if (err) {
        alert("Không nhận được phản hồi từ server.");
        return;
      }

      if (!result?.ok) {
        alert(result?.message || "Không thể cập nhật.");

        if (result?.message?.includes("chưa xác thực")) {
          lockWheel8Admin("Vui lòng đăng nhập lại.");
        }

        return;
      }

      highlightOverride(selector);
    }
  );
}


function setSlot(slot) {
  const n = Number(slot);

  if (!Number.isInteger(n) || n < 1 || n > 8) {
    return;
  }

  sendWheel8Override(
    { slot: n },
    `[data-slot="${n}"]`
  );
}

function setEvent(event) {

  if (!["x5-all", "x45-all"].includes(event)) {
    return;
  }

  sendWheel8Override(
    { event },
    `[data-event="${event}"]`
  );
}



socket.on("admin-wheel8-bets-update",(data)=>{

  // ======================
  // 💰 SLOT POOL
  // ======================
  const poolBox = document.getElementById("poolList")
  poolBox.innerHTML = ""

  const max = Math.max(...data.pool,1)

  // 🔥 thứ tự slot mới
  const order = [1,8,7,6,2,3,4,5]

  order.forEach(slot=>{

    const i = slot - 1
    const v = data.pool[i]

    const div = document.createElement("div")
    div.className = "pool-slot"

    // 🔥 phân loại
    if(v > max * 0.6){
      div.classList.add("hot")
    }else if(v < max * 0.2){
      div.classList.add("low")
    }

    // 📊 % bar
    const percent = (v / max) * 100
    div.style.setProperty("--percent", percent + "%")

    div.innerHTML = `
      <img src="/assets/police/slot${slot}.png">
      <div class="pool-value">${v}</div>
    `

    poolBox.appendChild(div)

  })


  // ======================
  // 👤 PLAYER BETS
  // ======================
  const betBox = document.getElementById("betList")
  betBox.innerHTML = ""

  if(!data.players || !data.players.length){
    betBox.innerHTML = "<div>NO BETS</div>"
    return
  }

  const players = data.players.sort((a,b)=>b.total - a.total)

  players.forEach((p,index)=>{

    const div = document.createElement("div")
    div.className = "bet-card"

    if(index === 0){
      div.style.boxShadow = "0 0 10px #00ff88"
    }

let row1 = ""
let row2 = ""

const row1Slots = [1,8,7,6]
const row2Slots = [2,3,4,5]

row1Slots.forEach(s=>{

  const v = p.slots[s-1]
  const active = v > 0 ? "active" : ""

  row1 += `
    <div class="bet-slot ${active}">
      <img src="/assets/police/slot${s}.png">
      ${v > 0 ? `<span>${v}</span>` : ``}
    </div>
  `
})

row2Slots.forEach(s=>{

  const v = p.slots[s-1]
  const active = v > 0 ? "active" : ""

  row2 += `
    <div class="bet-slot ${active}">
      <img src="/assets/police/slot${s}.png">
      ${v > 0 ? `<span>${v}</span>` : ``}
    </div>
  `
})

const slotsHTML = `
  <div class="bet-row">${row1}</div>
  <div class="bet-row">${row2}</div>
`

div.innerHTML = `
  <div class="bet-left">

    <div>

      <div class="bet-name">${p.name}</div>

<div class="bet-coins">
💰 ${p.coins}
</div>

      <div class="bet-slots">
        ${slotsHTML}
      </div>

    </div>

  </div>

  <div class="bet-total">
    ${p.total}
  </div>
`

    betBox.appendChild(div)

  })

})


</script>

</body>
</html>
