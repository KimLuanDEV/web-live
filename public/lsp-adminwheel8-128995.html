<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ADMIN WHEEL8</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  margin:0;
  background:
    radial-gradient(circle at center,#001a1a,#000);
  color:#00eaff;
  font-family:"Segoe UI",sans-serif;
}

/* ===== HEADER ===== */
.header{
  text-align:center;
  font-size:28px;
  font-weight:900;
  padding:15px;
  letter-spacing:2px;
  color:#00ffff;
  text-shadow:0 0 10px #00ffff;
}

/* ===== PANEL ===== */
.panel{
  width:420px;
  margin:20px auto;
  padding:25px;

  background:rgba(0,20,20,0.6);
  border:1px solid rgba(0,255,255,0.3);
  border-radius:20px;

  box-shadow:
    0 0 20px rgba(0,255,255,0.2),
    inset 0 0 10px rgba(0,255,255,0.1);
}

/* ===== ROW ===== */
.row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:14px;
  opacity:0.8;
}

/* ===== BIG VALUE ===== */
.big{
  font-size:42px;
  text-align:center;
  font-weight:900;
  margin:10px 0;

  text-shadow:0 0 15px #00ffff;
}

/* ===== SLOT ===== */
.slot{
  font-size:60px;
  text-align:center;
  font-weight:900;

  color:#00ffff;
  text-shadow:0 0 25px #00ffff;
}

/* ===== MULTI ===== */
.multi{
  font-size:50px;
  text-align:center;
  font-weight:900;

  color:#00ff88;
  text-shadow:0 0 20px #00ff88;
}

/* ===== TIMER ===== */
.timer{
  text-align:center;
  font-size:36px;
  font-weight:900;
  margin-top:10px;

  text-shadow:0 0 15px #00ffff;
}

.timer.danger{
  color:#ff4444;
  text-shadow:0 0 20px red;
}

/* ===== HASH ===== */
.hash{
  font-size:11px;
  word-break:break-all;
  opacity:0.6;
  margin-top:10px;
}


.slot-box{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:10px 0;
}

.slot-img-admin{
  width:140px;
  height:140px;
  object-fit:contain;

  filter:
    drop-shadow(0 0 15px #00aaff)
    drop-shadow(0 0 30px #00aaff);

  transition:.25s;
}

/* 🔥 hiệu ứng khi override */
.slot-img-admin.flash{
  transform:scale(1.2);

  filter:
    drop-shadow(0 0 25px #00ffff)
    drop-shadow(0 0 50px #00ffff);
}


.override-panel{
  margin-top:20px;
  text-align:center;
}

.override-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:10px;
}

.override-grid button{
  padding:12px;
  font-size:18px;
  font-weight:900;

  background:#001a33;
  color:#00ffff;

  border:1px solid #00ffff;
  border-radius:10px;

  cursor:pointer;

  transition:.2s;
}

.override-grid button:hover{
  background:#00ffff;
  color:#000;
  transform:scale(1.1);
}


#poolList div,
#betList div{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid rgba(0,255,255,0.1);
  font-size:13px;
}

.pool-grid{
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:10px;
}

.pool-slot{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background:#111;
}

.pool-slot img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* 💰 số tiền */
.pool-value{
  position:absolute;
  bottom:4px;
  left:0;
  width:100%;
  text-align:center;
  font-size:13px;
  font-weight:bold;
  color:#0ff;
  text-shadow:0 0 6px #0ff;
}

/* 🔥 HOT SLOT */
.pool-slot.hot{
  box-shadow:0 0 12px red;
}

/* 🧊 LOW SLOT */
.pool-slot.low{
  opacity:0.5;
}


</style>
</head>

<body>

<div class="header">🎡 ADMIN CONTROL</div>

<div class="panel">

  <div class="row">
    <div>ROUND</div>
    <div id="round">--</div>
  </div>

  <div class="slot-box">

  <img id="slotImg"
       src="/assets/police/slot1.png"
       class="slot-img-admin">

</div>

  <div class="multi">x<span id="multi">0</span></div>

  <div class="timer" id="time">0s</div>

  <div class="hash" id="hash"></div>

</div>



<div class="override-panel">

  <div>OVERRIDE SLOT</div>

  <div class="override-grid">

    <button onclick="setSlot(1)">1</button>
    <button onclick="setSlot(2)">2</button>
    <button onclick="setSlot(3)">3</button>
    <button onclick="setSlot(4)">4</button>
    <button onclick="setSlot(5)">5</button>
    <button onclick="setSlot(6)">6</button>
    <button onclick="setSlot(7)">7</button>
    <button onclick="setSlot(8)">8</button>

  </div>

</div>


<div class="panel">

  <div class="row">
    <div>💰 SLOT POOL</div>
  </div>

  <div id="poolList"></div>

  <div style="margin-top:15px">👤 PLAYER BETS</div>

  <div id="betList"></div>

</div>



<script>
const me = JSON.parse(localStorage.getItem("user_profile") || "{}")

const socket = io({
  auth:{
    uid: me.uid,
    deviceId: me.deviceId || null
  }
})


socket.on("connect",()=>{
  console.log("✅ ADMIN CONNECTED:", socket.id, me.uid)
})

socket.on("connect_error",(err)=>{
  console.log("❌ CONNECT ERROR:", err.message)
})

socket.on("admin-wheel8-secret",(data)=>{

  document.getElementById("round").textContent = data.roundId

  const img = document.getElementById("slotImg")

img.src = "/assets/police/slot" + data.slot + ".png"

// 🔥 flash effect
img.classList.add("flash")

setTimeout(()=>{
  img.classList.remove("flash")
},200)


  document.getElementById("multi").textContent = data.multiplier
  document.getElementById("hash").textContent = data.hash

})

socket.on("wheel8-timer",(remain)=>{

  const el = document.getElementById("time")

  el.textContent = remain + "s"

  if(remain <= 5){
    el.classList.add("danger")
  }else{
    el.classList.remove("danger")
  }

})


function setSlot(slot){

  console.log("🎯 OVERRIDE CLICK:", slot)

  socket.emit("admin-wheel8-override",{
    slot
  })

}



socket.on("admin-wheel8-bets-update",(data)=>{

  const poolBox = document.getElementById("poolList")
  poolBox.innerHTML = ""

  const max = Math.max(...data.pool,1)

  data.pool.forEach((v,i)=>{

    const div = document.createElement("div")
    div.className = "pool-slot"

    // 🔥 phân loại
    if(v > max * 0.6){
      div.classList.add("hot")
    }else if(v < max * 0.2){
      div.classList.add("low")
    }

    div.innerHTML = `
      <img src="/assets/police/slot${i+1}.png">
      <div class="pool-value">${v}</div>
    `

    poolBox.appendChild(div)

  })

})


</script>

</body>
</html>
