<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ADMIN WHEEL8</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  background:#000;
  color:#00ffff;
  font-family:monospace;
  padding:20px;
}

.box{
  border:1px solid #00ffff;
  padding:20px;
  margin-bottom:20px;
}

.big{
  font-size:28px;
  font-weight:900;
}
</style>
</head>

<body>

<h2>🎡 ADMIN WHEEL8</h2>

<div class="box">
  <div>Round: <span id="round"></span></div>
  <div class="big">Slot: <span id="slot"></span></div>
  <div class="big">x<span id="multi"></span></div>
  <div>Hash: <span id="hash"></span></div>

  <!-- ⏱ THÊM -->
  <div class="big">Time: <span id="time">0</span>s</div>
</div>


<div class="box">
  <h3>OVERRIDE</h3>

  <input id="slotInput" placeholder="Slot 1-8">
  <input id="multiInput" placeholder="Multiplier">

  <button onclick="overrideResult()">SET RESULT</button>
</div>




<script>
const socket = io()

socket.on("admin-wheel8-secret",(data)=>{

  document.getElementById("round").textContent = data.roundId
  document.getElementById("slot").textContent = data.slot
  document.getElementById("multi").textContent = data.multiplier
  document.getElementById("hash").textContent = data.hash

  if(data.overridden){
  document.body.style.background = "#200"
}


})

socket.on("wheel8-timer",(remain)=>{

  const el = document.getElementById("time")
  el.textContent = remain

  if(remain <= 5){
    el.style.color = "red"
  }else{
    el.style.color = "#00ffff"
  }

})



function overrideResult(){

  const slot = Number(
    document.getElementById("slotInput").value
  )

  const multiplier = Number(
    document.getElementById("multiInput").value
  )

  if(slot < 1 || slot > 8){
    alert("Slot 1-8")
    return
  }

  if(!multiplier){
    alert("Invalid multiplier")
    return
  }

  socket.emit("admin-wheel8-override",{
    slot,
    multiplier
  })

}

</script>

</body>
</html>
