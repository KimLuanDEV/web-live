<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ADMIN WHEEL8</title>
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  background:#000;
  color:#00ffff;
  font-family:monospace;
  padding:20px;
}

.box{
  border:1px solid #00ffff;
  padding:20px;
  margin-bottom:20px;
}

.big{
  font-size:28px;
  font-weight:900;
}


.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.btn{
  padding:14px;
  text-align:center;
  border:1px solid #00ffff;
  cursor:pointer;
  font-weight:900;
}

.btn:hover{
  background:#00ffff;
  color:#000;
}


</style>
</head>

<body>

<h2>🎡 ADMIN WHEEL8</h2>

<div class="box">
  <div>Round: <span id="round"></span></div>
  <div class="big">Slot: <span id="slot"></span></div>
  <div class="big">x<span id="multi"></span></div>
  <div>Hash: <span id="hash"></span></div>

  <!-- ⏱ THÊM -->
  <div class="big">Time: <span id="time">0</span>s</div>
</div>


<div class="box">
  <h3>CLICK TO OVERRIDE</h3>

  <div class="grid">

    <div class="btn" onclick="setSlot(1)">1</div>
    <div class="btn" onclick="setSlot(2)">2</div>
    <div class="btn" onclick="setSlot(3)">3</div>
    <div class="btn" onclick="setSlot(4)">4</div>
    <div class="btn" onclick="setSlot(5)">5</div>
    <div class="btn" onclick="setSlot(6)">6</div>
    <div class="btn" onclick="setSlot(7)">7</div>
    <div class="btn" onclick="setSlot(8)">8</div>

  </div>
</div>



<script>
const socket = io()

socket.on("admin-wheel8-secret",(data)=>{

  document.getElementById("round").textContent = data.roundId
  document.getElementById("slot").textContent = data.slot
  document.getElementById("multi").textContent = data.multiplier
  document.getElementById("hash").textContent = data.hash

  if(data.overridden){
  document.body.style.background = "#200"
}


})

socket.on("wheel8-timer",(remain)=>{

  const el = document.getElementById("time")
  el.textContent = remain

  if(remain <= 5){
    el.style.color = "red"
  }else{
    el.style.color = "#00ffff"
  }

})



function setSlot(slot){

  // reset tất cả
  document.querySelectorAll(".btn").forEach(b=>{
    b.style.background = ""
    b.style.color = "#00ffff"
  })

  // highlight nút bấm
  const el = event.target
  el.style.background = "red"
  el.style.color = "#fff"

  socket.emit("admin-wheel8-override",{ slot })

}




</script>

</body>
</html>
